services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    environment:
      POSTGRES_USER: themem
      POSTGRES_PASSWORD: themem
      POSTGRES_DB: themem_wishlist
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - ../../dev/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - wishlist-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themem -d themem_wishlist"]
      interval: 2s
      retries: 15
volumes:
  wishlist-data:
