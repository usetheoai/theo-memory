<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Theo Memory — the open-source memory layer for AI agents" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#2A2F45" stroke-width="1"/>

  <rect x="72" y="96" width="6" height="108" rx="3" fill="url(#accent)"/>

  <text x="102" y="140" font-size="58" font-weight="800" fill="#FFFFFF">Theo <tspan fill="#C4B5FD">Memory</tspan></text>
  <text x="104" y="182" font-size="24" font-weight="500" fill="#AAB2C5">The open-source memory layer for AI agents.</text>

  <text x="104" y="228" font-size="16" font-weight="600" letter-spacing="1" fill="#7C8398" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">remember  ·  recall  ·  forget  ·  reflect</text>

  <text x="104" y="262" font-size="13" font-weight="500" fill="#8B93A7">TypeScript SDK · REST · MCP  ·  Postgres + pgvector  ·  Apache-2.0</text>

  <g stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <line x1="900" y1="90" x2="1010" y2="150"/>
    <line x1="1010" y1="150" x2="960" y2="230"/>
    <line x1="1010" y1="150" x2="1110" y2="110"/>
    <line x1="900" y1="90" x2="960" y2="230"/>
    <line x1="1110" y1="110" x2="1090" y2="210"/>
    <line x1="960" y1="230" x2="1090" y2="210"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="900" cy="90" r="9"/>
    <circle cx="1010" cy="150" r="13"/>
    <circle cx="960" cy="230" r="8"/>
    <circle cx="1110" cy="110" r="10"/>
    <circle cx="1090" cy="210" r="7"/>
  </g>
</svg>
