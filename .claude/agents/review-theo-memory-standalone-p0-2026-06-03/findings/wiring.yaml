findings:
  - id: F-wire-1
    severity: MAJOR
    file: tsconfig.build.json
    line: 11
    plan_ref: T1.7 (subpath export) + Global DoD § "All tests passing / Zero TypeScript errors"
    summary: |
      tsconfig.build.json#include omits `src/server/**/*.ts` even though the
      package exposes the subpath `@usetheo/memory/server`. dist/server/* IS
      currently produced ONLY via transitive expansion from
      src/agent-tools/cli.ts → run-server.ts → src/server/index.ts. If a future
      refactor stops importing the server from agent-tools (e.g., a consumer
      uses @usetheo/memory/server library-mode without going through the CLI),
      `npm run build` will silently omit the entire server tree — `npm pack`
      will include the .ts sources (per EC-52 guard) but no compiled .js/.d.ts,
      breaking subpath ESM resolution for runtime consumers.
    evidence: |
      tsconfig.build.json:11
        "include": ["src/core/**/*.ts", "src/theokit/**/*.ts",
                    "src/agent-tools/**/*.ts", "src/embedders/**/*.ts",
                    "src/llms/**/*.ts"]
      tsconfig.contract.json:26 (typecheck) DOES list src/server/**/*.ts.
      eslint.config.ts:20 DOES list src/{...,server}/**/*.ts.
      The build config is the lone outlier — same omission pattern that
      tests/integration/config-parity.test.ts was created to prevent (per its
      own header: "v0-3-agent-tools-mcp halt-loop ... silent skips are the worst
      kind of green"). The parity test today checks tsconfig.contract.json vs
      eslint.config.ts but does NOT cover tsconfig.build.json.
    recommended_action: |
      1) Add "src/server/**/*.ts" to tsconfig.build.json#include.
      2) Extend tests/integration/config-parity.test.ts with a third assertion:
         "every src/* dir in tsconfig.contract.json#include is ALSO in
         tsconfig.build.json#include". Silent build skip is exactly the failure
         class that parity test was created to catch.

  - id: F-wire-2
    severity: MINOR
    file: src/server/errors.ts
    line: 47
    plan_ref: T1.6 EC-24 redaction + ADR D11 (DI composition)
    summary: |
      `redactSecrets` is exported from src/server/errors.ts but has ZERO
      external callers (verified via grep across src/ + tests/). The only
      reference outside its definition is inside the same file at
      `console.error(redactSecrets(raw))`. The 6 server contract tests
