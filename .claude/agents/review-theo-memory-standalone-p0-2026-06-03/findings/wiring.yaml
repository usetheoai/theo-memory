  - id: F-wire-6
    severity: INFO
    file: src/server/handlers/remember.ts
    line: 63
    plan_ref: T1.2 (4-verb handlers)
    summary: |
      `remember.ts` re-exports `safeJson`, `scopeOrValidationError`,
      `EMPTY_BODY`, `MALFORMED_BODY` to share with siblings (recall.ts,
      forget.ts, reflect.ts). This is functional reuse — pillar (a) PASS
      with 3 real callers per symbol — but the chosen locus (the remember
      handler exporting helpers used by the other 3 verbs) is a SRP smell:
      `remember.ts` should own its handler only, not be a de-facto helpers
      module. The honest refactor is to move the 4 helpers to
      `src/server/handlers/body.ts` (or similar) so remember/recall/forget/
      reflect each import from a shared neutral source. Plan budget
      constraint (≤ 200 LoC/handler per ADR D10) probably motivated the
      consolidation but the result couples the 3 other verbs to the
      remember module's lifecycle.
    evidence: |
      src/server/handlers/recall.ts:11:
        import { EMPTY_BODY, MALFORMED_BODY, safeJson, scopeOrValidationError } from './remember.js';
      src/server/handlers/forget.ts:12:
        import { EMPTY_BODY, MALFORMED_BODY, safeJson } from './remember.js';
      src/server/handlers/reflect.ts:13:
        import { EMPTY_BODY, MALFORMED_BODY, safeJson, scopeOrValidationError } from './remember.js';

      If remember.ts is refactored or split, the other 3 break silently
      at import time.
    recommended_action: |
      Out of scope for this PR (does not affect wire-up correctness).
      File a CLEAN-UP follow-up to extract `src/server/handlers/body.ts`
      (or `src/server/handlers/_shared.ts`) with the 4 helpers; rewire
      recall/forget/reflect imports.

