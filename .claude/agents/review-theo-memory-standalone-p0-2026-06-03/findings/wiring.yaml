      sanitized error strings) OR demote from `export function` to internal
      `function` (per architecture.md § 9 — "Internal helpers stay un-exported.
      Test them through the public API.").
    evidence: |
      $ grep -rn "redactSecrets" src/ tests/
      src/server/errors.ts:47:export function redactSecrets(input: string): string {
      src/server/errors.ts:58:  console.error(redactSecrets(raw));
      (no external callers)

      src/server/index.ts (the subpath barrel) re-exports createServer,
      CreateServerOptions, BearerAuthVerifier, readApiKey, bearerAuth — but
      NOT mapDomainErrorToResponse, redactSecrets, ErrorEnvelope, or
      MappedErrorResponse. The export from errors.ts is therefore
      unreachable from the public subpath surface.
    recommended_action: |
      Pick one:
      (a) Re-export from src/server/index.ts under a Public Error Utilities
          section (alongside mapDomainErrorToResponse if it's meant to be
          consumer-mountable), OR
      (b) Drop the `export` keyword and make `redactSecrets` file-local.
          Tested via mapDomainErrorToResponse behavior (already covered).

  - id: F-wire-3
    severity: MINOR
    file: .claude/rules/architecture.md
    line: 33
    plan_ref: T2.1-T2.5 CLI composition + ADR D11 (DI composition root)
    summary: |
      `architecture.md § 3` says verbatim: "src/agent-tools/ (when created —
      v0.3) depends on src/core/ only." The new run-*.ts composition-root
      files necessarily import from src/local/, src/server/, src/embedders/
      to compose the runtime. This is the intentional Composition Root
      pattern locked by ADR D11 — but the architecture rule wording predates
      ADR D11 and still claims "core only", creating a contradictory contract.
      Boundary-check.sh today does not enforce the original rule (no hits in
      grep), but a future reviewer or hook tightening could read the rule
      literally and block the CLI.
    evidence: |
      .claude/rules/architecture.md:33
        - `src/agent-tools/` (when created — v0.3) depends on `src/core/` only.

      Imports newly introduced by this plan:
      src/agent-tools/run-migrate.ts:22:import { runMigrations } from '../local/index.js';
      src/agent-tools/run-health.ts:31:import { createLocalMemory, StubEmbedder, StubLLM } from '../local/index.js';
      src/agent-tools/run-health.ts:32:import { PgvectorStore } from '../local/pgvector-store.js';
      src/agent-tools/run-server.ts:31:import { DeterministicStubEmbedder } from '../embedders/stub.js';
      src/agent-tools/run-server.ts:32:import { createLocalMemory, runMigrations, StubLLM } from '../local/index.js';
      src/agent-tools/run-server.ts:33:import { PgvectorStore } from '../local/pgvector-store.js';
      src/agent-tools/run-server.ts:34:import { BearerAuthVerifier, readApiKey } from '../server/auth/bearer-verifier.js';
      src/agent-tools/run-server.ts:35:import { createServer } from '../server/index.js';
      src/agent-tools/run-mcp-server.ts:22:import { createLocalMemory, runMigrations, StubEmbedder, StubLLM } from '../local/index.js';
      src/agent-tools/run-mcp-server.ts:23:import { PgvectorStore } from '../local/pgvector-store.js';

      The plan's ADR D11 says: "Subpath @usetheo/memory/server exports
      createServer ... CLI `themory server` is one of the consumers, not the
      only one." This is correct composition-root discipline but conflicts
      with the literal text of architecture.md § 3.
    recommended_action: |
      Amend .claude/rules/architecture.md § 3 to add a Composition Root
      carve-out for src/agent-tools/run-*.ts (the CLI subcommand handlers)
      AND src/agent-tools/cli.ts. Cite ADR D11 (theo-memory-standalone-p0)
      as the source. Pattern: same wording style as the v0.6.1 RepoScope
      4th-tier ADR-0010 note in § 1.

  - id: F-wire-4
    severity: MINOR
    file: src/server/schemas.ts
    line: 88
    plan_ref: T1.2 + T1.7 (subpath public surface)
    summary: |
      `ScopedMemoryLike` is `export interface` but has ONLY one in-tree
      consumer: the parent `MemoryLike` interface that declares
      `user/session/agent/skills` as returning `ScopedMemoryLike`. Because
      `MemoryLike` is itself not re-exported from src/server/index.ts,
      `ScopedMemoryLike` is unreachable from any external API path. It is
      effectively an internal type used by handlers + resolveScope. The
      `export` keyword promises a public surface that no caller can reach.
    evidence: |
      $ grep -rn "ScopedMemoryLike" src/ tests/
      src/server/schemas.ts:88:export interface ScopedMemoryLike {
      src/server/schemas.ts:95-98 (used to type MemoryLike fields)
      src/server/schemas.ts:104 (used as return type of resolveScope)
      (no external consumers; not re-exported from src/server/index.ts)

      Similarly: `MemoryLike`, `RememberBody`/`RecallBody`/`ReflectBody`/
      `ForgetBody` (zod schemas AND inferred types), `resolveScope` —
      all `export`-ed from schemas.ts, NONE re-exported from
      src/server/index.ts. Consumers writing a custom Hono app that
      wants to reuse our zod schemas cannot do so via the subpath.
    recommended_action: |
      Pick one (apply uniformly to MemoryLike + ScopedMemoryLike + the 4
      body schemas + resolveScope):
      (a) Re-export from src/server/index.ts as the intentional library-mode
          surface (matches ADR D11 "library-mode embed" rationale), OR
      (b) Drop the `export` keyword and confine to file-local scope.
      A mixed state (exported in schemas.ts but not in the subpath barrel)
      is the worst of both worlds — half-public, half-private, no consumer
      ergonomics.

