findings:
  - id: F-dom-dbmig-1
    severity: INFO
    file: src/agent-tools/run-server.ts
    line: 89-100
    plan_ref: ADR D8 amended (plan v1.1 lines 186-197) + T2.3 (lines 751-797)
    domain_anchor: plan ADR D8 "themory server invokes runMigrations(pool) BEFORE binding port"
    summary: |
      ADR D8 compliance VERIFIED. runMigrations() is awaited BEFORE serve() binds the port.
      Migration step is wrapped in try/catch; failure surfaces stderr context with the original
      error message and exits 1 (fail-fast). The pool is NOT torn down before exit 1 in this
      branch — minor cleanup gap (pool.end() omitted on the migrate-failure exit path), but
      since the process is exiting anyway the kernel reclaims the sockets. This matches the
      "no zombie pool" intent of the review brief at the OS level, though semantically a
      symmetric `await pool.end().catch(() => undefined)` (as done in run-migrate.ts:42)
      would be cleaner. Not blocking — surface as a hygiene observation only.
    evidence: |
      ```ts
      // src/agent-tools/run-server.ts:89-100
      if (!shouldSkipMigrations()) {
        try {
          await runMigrations(pool);
        } catch (err) {
          process.stderr.write(
            `themory server: migrations failed (${err instanceof Error ? err.message : String(err)})\n`,
          );
          process.exit(1);
          return;
        }
      }
      ```
      Compared to run-migrate.ts:38-44 which does `await pool.end().catch(() => undefined)`
      BEFORE `process.exit(1)`. The run-server.ts path skips the pool.end() flush.
    recommended_action: |
      OPTIONAL — for symmetry with run-migrate.ts and to ensure best-effort socket cleanup
      before exit, consider adding `await pool.end().catch(() => undefined);` before
      `process.exit(1)` in the migrate-failure catch block. Pure hygiene; not gating merge.

