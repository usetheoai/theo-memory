findings:
  - id: F-xval-1
    severity: MINOR
    file: src/server/schemas.ts
    line: 11-50
    plan_ref: T1.2 § Deep Dives — ADR D12 absorption ("ScopeSchema = z.union([z.object({userId...}).strict(), ...])")
    summary: |
      ADR D12 + plan T1.2 Deep Dive declared single-scope enforcement via
      zod `z.union([...]).strict()` (a discriminated-union with mutually-exclusive
      refines). Implementation uses a flat `z.object({...}).strict().superRefine(SingleScopeRefine)`
      counting present tier keys instead. Behaviorally equivalent (0 or ≥2 tiers → 422),
      but the chosen shape differs from the plan's prescription.
    evidence: |
      Plan v1.3 § ADR D12 ("Consequences"): "Zod schema in `src/server/schemas.ts`
      uses `z.union([userScope, sessionScope, agentScope, skillScope])` with
      mutually-exclusive refines."
      Code `src/server/schemas.ts:40-49` ships `RememberBody = z.object({ ...ScopeFields, text, ... }).strict().superRefine(SingleScopeRefine)`.
      Commit 09f97ff message acknowledges the divergence: "Plain z.union() does NOT
      enforce this reliably (no discriminator key) per SEPA pre-RED iter 3 CRITICAL finding."
      SEPA log at .claude/knowledge-base/implementations/theo-memory-standalone-p0/sepa-iterations/iteration-9-pre-red.md documents the deviation.
      Test assertion shape preserved (12 RED tests pass GREEN; EC-9 422 enforcement intact).
    recommended_action: |
      Either (a) add a one-line ADR amendment to D12 stating
      "Implementation chose superRefine over z.union for reliable enforcement;
      behavior identical, shape diverges from § Consequences clause" — minor honesty fix;
      OR (b) accept WITH_CAVEATS — the divergence is honestly disclosed in the commit
      and SEPA log, behavior matches plan acceptance, no consumer impact.

  - id: F-xval-2
    severity: MAJOR
    file: src/server/app.ts
    line: 83-99
    plan_ref: T1.3 (health handler), T3.5 (THE GOAL TEST) — silent scope creep
    summary: |
      T3.5 commit fc4ec5c modified middleware ordering in `src/server/app.ts` so
      `/v1/health` + `/v1/health/db` are mounted BEFORE `app.use('/v1/*', bearerAuth(...))`,
      making the health endpoints auth-exempt. This is an architectural change to
      T1.3's contract (no auth-exemption declared in T1.3 plan AC or ADR D3).
      The plan ONLY explicitly authorized auth-exemption for `/v1/openapi.json` (EC-19);
      extending the precedent to health endpoints is a NEW design decision that
      shipped without a new ADR — silent override of ADR D3 ("all 4 verbs + listing are
      auth-gated when verifier provided").
    evidence: |
      Plan v1.3 § ADR D3 Decision: "REST server accepts `Authorization: Bearer <token>`
      header...". Plan v1.3 § ADR D3 Consequences: "OAuth/JWT impl deferred to P1".
      No clause exempts health endpoints from auth.
      Plan v1.3 § T1.3 AC: "8 RED tests pass GREEN" — none require health 200 when
      THEMEMORY_API_KEY is set.
      Plan v1.3 § T1.2 Files-to-edit lists `bearerAuth(authVerifier)` mounted under
      `app.use('/v1/*', ...)` covering ALL /v1/* routes per commit 09f97ff.
      Commit fc4ec5c (T3.5) re-orders the mount, adding inline rationale
      ("RFC 9110 + OWASP /healthz convention") + regression tests 11a/11b in
      `src/server/__tests__/handlers.test.ts`. Honest disclosure in commit message but
      no ADR amendment, no plan section update.
    recommended_action: |
      Add ADR D3 amendment ("Health probes auth-exempt — RFC 9110 + OWASP /healthz
      convention; orchestrator liveness/readiness probes do not carry credentials")
      OR add explicit Acceptance Criterion to T1.3 AC list. The behavior is correct
      and industry-standard; the silent shipping is the issue. Inquebrável Rule 3 +
      cycle-implement anti-pattern #7 (NEVER scope-creep mid-task) — even an honest,
      load-bearing change deserves its own contract update.

  - id: F-xval-3
    severity: MINOR
    file: src/agent-tools/run-server.ts
    line: 31-32, 107-118
    plan_ref: T2.3 § Deep Dives + Roadmap Item 16 contract
    summary: |
      T3.5 swapped `StubEmbedder` → `DeterministicStubEmbedder` in
      `src/agent-tools/run-server.ts` to make the THE GOAL METRIC round-trip pass
      (StubEmbedder returns zero vectors, collapsing recall). The switch is honest
      and load-bearing for the round-trip, but the plan does NOT name an embedder
      for the alpha standalone image — readers must infer from THE GOAL TEST
      acceptance. The plan defers `OpenAIEmbedder` / `LocalTransformerEmbedder` as
      consumer-wired implicitly, but a debug-grade deterministic stub as the alpha
      default is undocumented in the plan or CHANGELOG.
    evidence: |
      Plan v1.3 § T2.3 Deep Dives describes "create pool → ... → create Memory factory
      → ...". No specific embedder named.
      Commit fc4ec5c message: "Switched to `DeterministicStubEmbedder` (debug-grade
      pure-function MD5+Lehmer LCG) so identical text round-trips at cosine 1.0".
      CHANGELOG entry for Phase 2 does not document the alpha-default embedder choice.
      Test acceptance (T3.5 #58 "POST /v1/remember + POST /v1/recall round-trip")
      satisfied with the switch.
    recommended_action: |
      Add a sentence to CHANGELOG Phase 2/3 entry: "Alpha standalone image ships
      `DeterministicStubEmbedder` as default; production consumers wire
      `OpenAIEmbedder` or `LocalTransformerEmbedder` via composition root."
      Mirrors the dogfood honesty discipline (root CLAUDE.md § Honesty discipline).

