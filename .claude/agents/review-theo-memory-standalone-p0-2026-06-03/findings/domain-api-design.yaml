domain_specific_strengths:
  - "Bearer auth correctly length-checks before crypto.timingSafeEqual (EC-4) — verified at src/server/auth/bearer-verifier.ts:58-66."
  - "Case-insensitive Bearer scheme via /^bearer\\s+(.+)$/i (EC-2) — RFC 6750 compliant."
  - "WWW-Authenticate: Bearer header on all 401 responses — middleware.ts:43, 52, 63."
  - "DIP discipline preserved: src/server/ never imports pg (verified by grep); dbProbe + tracer injected per ADR D11."
  - "ADD-only invariant respected: no PUT/PATCH/UPDATE verb in the REST surface; mutation is forget + remember."
  - "Two-layer cursor validation (base64 decode → JSON parse → CursorSchema.safeParse) correctly defends against Buffer.from(garbage,'base64') silent acceptance (EC-15)."
