  - id: F-arch-9
    severity: MINOR
    file: src/server/openapi-registration.ts
    line: 5-12
    plan_ref: ADR D1 — Hono REST framework; SEPA pre-RED iter 5 CRITICAL
    summary: "Hybrid OpenAPI registration explicitly forgoes the canonical RouteConfig migration. Honest trade-off documented in the JSDoc; acceptable trade for shipping T1.4 without rewriting T1.2/T1.3 handlers, but doubles the surface where spec + handler can drift."
    evidence: |
      ```ts
      // src/server/openapi-registration.ts:5-10
      // Per SEPA pre-RED iter 5 CRITICAL — Path A full RouteConfig migration risks
      // defaultHook envelope drift across 6 handlers. Hybrid registration honors
      // the plan's "single source of truth (zod schemas) → no spec drift" rationale
      // (ADR D1 Consequences) without re-implementing the safeJson + scopeOrValidationError
      // pipeline that the T1.2/T1.3 RED tests pin.
      ```
      The hybrid approach means:
      - `src/server/openapi-registration.ts` declares the OpenAPI path shape MANUALLY (164 LoC of `registry.registerPath({...})` calls);
      - `src/server/handlers/*.ts` declare the ACTUAL route handlers via vanilla `app.get/post`;
      - The two CAN drift: a handler refactor changing query param shape will not propagate to the OpenAPI spec.

      This is a real architectural trade-off honestly documented. A future v1.1 OpenAPI cycle should migrate handlers to RouteConfig — but that is out-of-scope here.
    recommended_action: |
      Add a static integration test that hits every handler and parses the OpenAPI spec to assert that documented request shapes match observed handler validation. This is the cheapest "drift detector" available short of full RouteConfig migration. Defer to a v1.1 cycle; not a blocker for THIS plan.

