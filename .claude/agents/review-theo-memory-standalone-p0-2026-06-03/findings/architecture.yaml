  # ===================================================================
  # CRITICAL — runtime contract violation in scope dispatch
  # ===================================================================
  - id: F-arch-1
    severity: CRITICAL
    file: src/server/handlers/scopes.ts
    line: 49
    plan_ref: T1.3 — scope type enum {user,session,agent,skill} + skill type dispatches to memory.skills(repoId) per ADR-0010 (scopes.test.ts test #12)
    summary: "Type cast `memory.skills(id) as unknown as ScopedMemory` hides a runtime contract violation — ScopedSkillMemory does NOT expose getAll()."
    evidence: |
      ```ts
      // src/server/handlers/scopes.ts:48-49
      case 'skill':
        return memory.skills(id) as unknown as ScopedMemory;
      ```
      `ScopedSkillMemory` interface at `src/core/skill.ts:168`:
      ```ts
      export interface ScopedSkillMemory {
        add(skill: SkillDraft): Promise<Skill>;
        recall(query: string, options?: SkillRecallOptions): Promise<readonly SkillWithScore[]>;
        consolidate(options?: ConsolidateOptions): Promise<ConsolidationResult>;
        forget(skillId: string): Promise<void>;
      }
      ```
      No `getAll()` method exists on `ScopedSkillMemory`. The handler at `src/server/handlers/scopes.ts:113` calls `await scoped.getAll()` unconditionally — for `scope=skill`, this will throw `scoped.getAll is not a function` at runtime.

      Test `scopes.test.ts` #12 only asserts `memory.skills` was called with the repoId; it does NOT exercise the actual `ScopedSkillMemory.getAll()` because `stubScopedWithItems` injects a `getAll` stub on the test stub that does not exist on the real interface. The test passes; production traffic on `GET /v1/scopes/skill/repo-alpha/memories` will 500.

      Type cast `as unknown as ScopedMemory` is the canonical escape-hatch smell — TypeScript itself was telling you the types do not match, and the double-cast silenced it.
    recommended_action: |
      Either (a) raise an explicit honest deferral: throw `BiTemporalNotSupportedLocally`-style error on `scope=skill` until `ScopedSkillMemory.getAll()` ships, plus a RED integration test against real pgvector that proves the 501 envelope; OR (b) extend `ScopedSkillMemory` with `getAll(): Promise<readonly Skill[]>` and migrate `scopes.ts` to dispatch via a discriminated union without casts. Option (b) is the cleaner Inquebrável Rule 7 / SOLID-compliant fix. Either way, REMOVE the `as unknown as ScopedMemory` cast and replace the test #12 with one that exercises the actual surface against real (not stubbed) skill memory.

  # ===================================================================
  # MAJOR — DIP discipline drift via structural-type cast
  # ===================================================================
  - id: F-arch-2
    severity: MAJOR
    file: src/server/handlers/remember.ts, recall.ts, reflect.ts, schemas.ts
    line: "remember.ts:29, recall.ts:29, reflect.ts:31, schemas.ts:88-99"
    plan_ref: ADR D11 — REST handlers compose Memory factory via DI; ADR D12 — single scope tier per request; v1.1 fix-up F-arch-2 precedent (ad-hoc structural type)
    summary: "Three handlers cast the injected `Memory` to a sibling structural interface `MemoryLike` via `as unknown as MemoryLike` — silences TS even though the shapes are compatible."
    evidence: |
      ```ts
      // src/server/handlers/remember.ts:29
      const scoped = resolveScope(memory as unknown as MemoryLike, parsed.data);
      // src/server/handlers/recall.ts:29 (same)
      // src/server/handlers/reflect.ts:31 (same)
      ```
      `MemoryLike` is declared at `src/server/schemas.ts:88-99` as a separate structural interface duplicating the `Memory` shape (with `unknown` return types instead of the real ones). The double-cast pattern (`as unknown as MemoryLike`) signals TS was unable to narrow them automatically.

      Honest cause: `MemoryLike.remember(text, options?: object) => Promise<unknown>` is BROADER than `Memory.remember`. Casting through `unknown` to a broader type then dispatching via a string-key switch (`resolveScope`) is the canonical "I am sidestepping the type system because the structural shape diverged" smell. This mirrors the F-arch-2 finding closed in the v1.1 fix-up cycle (`applySkillFilters` ad-hoc structural type per CLAUDE.md Item 12 caveats).
    recommended_action: |
      Either (a) drop `MemoryLike` and import the real `Memory` interface in `schemas.ts::resolveScope`, accepting the dependency from schemas.ts → core; OR (b) accept the structural decoupling honestly by typing `resolveScope` to receive only the 4 `user|session|agent|skills` factory functions extracted from `Memory` — `Pick<Memory, 'user'|'session'|'agent'|'skills'>` — which would type-check without `as unknown as`. Option (b) is the SOLID-ISP fix (depend on the minimum surface needed). Document the choice as ADR-amendment under D11.

  # ===================================================================
  # MAJOR — circular dependency between handlers/remember.ts and other handlers
  # ===================================================================
  - id: F-arch-3
    severity: MAJOR
    file: src/server/handlers/recall.ts, forget.ts, reflect.ts
    line: "recall.ts:11, forget.ts:12, reflect.ts:13"
    plan_ref: ADR D10 — Each handler ≤ 100 LoC; SRP per architecture.md § Module hygiene
    summary: "Three handlers (recall, forget, reflect) import shared safeJson/EMPTY_BODY/MALFORMED_BODY symbols FROM `remember.ts` instead of a neutral helper module. This couples 4 sibling handlers into a directed dependency on one of them."
    evidence: |
      ```ts
      // src/server/handlers/recall.ts:11
      import { EMPTY_BODY, MALFORMED_BODY, safeJson, scopeOrValidationError } from './remember.js';
      // src/server/handlers/forget.ts:12
      import { EMPTY_BODY, MALFORMED_BODY, safeJson } from './remember.js';
      // src/server/handlers/reflect.ts:13
      import { EMPTY_BODY, MALFORMED_BODY, safeJson, scopeOrValidationError } from './remember.js';
      ```
      `remember.ts` exports `safeJson`, `scopeOrValidationError`, `EMPTY_BODY`, `MALFORMED_BODY` as utilities (line 63: `export { safeJson, scopeOrValidationError, EMPTY_BODY, MALFORMED_BODY }`). 3 sibling handlers depend on `remember.ts` for utilities they should share via a peer module. This is SRP violation (`remember.ts` has TWO reasons to change — `/v1/remember` semantics AND shared body-parsing utilities) and an avoidable directed coupling that breaks if `remember.ts` is ever refactored independently.

      Fan-in count on `remember.ts`: 3 sibling files. Pattern matches the "Manager / Helper / Utils dumping ground" anti-pattern called out in architecture.md § 13.1.
    recommended_action: |
      Extract `safeJson`, `scopeOrValidationError`, `EMPTY_BODY`, `MALFORMED_BODY` into `src/server/handlers/_body-parsing.ts` (or `src/server/_helpers.ts`). All 4 handlers then import from the neutral module. Restores SRP on `remember.ts`. Trivial refactor (cut + paste + 4 import updates); does not change test surface.

  # ===================================================================
  # MAJOR — runtime memory shim Proxy bypasses architectural design
  # ===================================================================
  - id: F-arch-4
    severity: MAJOR
    file: src/agent-tools/run-server.ts
    line: 138-147
    plan_ref: EC-33 readiness gate; ADR D11 — REST handlers compose Memory factory via DI
    summary: "`Memory` is injected into `createServer` via a `Proxy` shim that throws on get when the factory is not yet warm. This is defense-in-depth but couples the composition root to a runtime contract not declared anywhere in src/core/."
    evidence: |
      ```ts
      // src/agent-tools/run-server.ts:138-147
      const memoryShim = new Proxy({} as Awaited<ReturnType<typeof createLocalMemory>>, {
        get(_target, prop) {
          if (memory === undefined) {
            throw new Error(
              'Memory not ready: server is still warming up. Poll GET /v1/health until 200 before sending verb traffic.',
            );
          }
          return Reflect.get(memory, prop) as unknown;
        },
      });
      ```
      The Proxy is the runtime contract for "Memory may be undefined during warm-up". But:
      1. The `Memory` type at `src/core/memory-store.ts` does NOT acknowledge this — consumers reading the type signature have no reason to expect a get-time throw.
      2. The error message is a string blob — not a typed `MemoryNotReadyError` like other domain errors (`InvalidScope`, `MemoryNotFound`, etc. per architecture.md § 8).
      3. `Reflect.get(memory, prop) as unknown` returns Property as unknown — any caller method-invocation (e.g., `memory.user(id)`) silently casts away types.
      4. The readiness probe at `/v1/health` is the user-facing contract; the Proxy is defense-in-depth that SHOULD never fire in correct deployments. When it fires, it surfaces as a 500 (unmapped Error) instead of a structured 503 envelope.

      This pattern works for the test #47 but is non-idiomatic — the canonical Node pattern would be to wait for `warmPromise` before calling `serve()`, accepting a 1-2s longer cold-start window (acceptable for ECS/K8s rolling deploys which already gate on readinessProbe).
    recommended_action: |
      Replace the Proxy shim with explicit await on `warmPromise` BEFORE binding the port (option A — accept slower cold start, simpler architecture) OR introduce a typed `MemoryNotReadyError` exported from `src/core/errors.ts`, map it to 503 `warming_up` in `mapDomainErrorToResponse`, and have the Proxy throw the typed error (option B — preserves the eager-bind pattern with a clean error envelope). Either way, document the choice in ADR D11 amendment.

  # ===================================================================
  # MAJOR — agent-tools/run-server.ts wires DeterministicStubEmbedder by default; hides production unreadiness
  # ===================================================================
  - id: F-arch-5
    severity: MAJOR
    file: src/agent-tools/run-server.ts
    line: 110-122
    plan_ref: ADR D11 — REST handlers compose Memory factory via DI; CLAUDE.md § Honesty discipline (no production claims pre-v1.0)
    summary: "`themory server` wires `DeterministicStubEmbedder` + `StubLLM` as the default embedder/LLM with NO operator-visible signal. THE GOAL TEST round-trip works but produces semantically meaningless recall — the container is shipped 'wire-shape only' and disguises that as production-grade."
    evidence: |
      ```ts
      // src/agent-tools/run-server.ts:108-123
      const warmPromise = (async () => {
        memory = await createLocalMemory({
          vectorStore: new PgvectorStore(pool),
          // ... (long comment)
          embedder: new DeterministicStubEmbedder(),
          llm: new StubLLM(),
        });
        isReady = true;
      })();
      ```
      The JSDoc comment is honest about WHY (stub avoids NaN cosine + OpenAI quota dependency), but the consumer of `ghcr.io/usetheo/themory:0.1.0-alpha` has NO operator-visible signal that the running container will produce gibberish recall in production. There is no:
      - Startup warning to stderr (e.g., "WARNING: DeterministicStubEmbedder active — recall will not produce semantic results unless OPENAI_API_KEY or LOCAL_TRANSFORMER_ENABLED env is set");
      - README warning ("the default Docker image ships with a stub embedder; recall semantics require wiring an OpenAI or local embedder via env");
      - Env-var gate forcing the operator to explicitly opt into stub mode (e.g., `THEMEMORY_ALLOW_STUB=true`).

      THE GOAL TEST `tests/integration/docker-stack.test.ts:194-208` admits this:
      ```ts
      // StubEmbedder produces deterministic but uncorrelated vectors per distinct input,
      // so an exact-text query yields cosine 1.0 and bypasses any non-zero similarity threshold.
      // Real consumers wire OpenAILocalTransformer embedders for production semantic recall;
      // this E2E asserts the wire shape, not embedder quality
      ```
      The test acknowledges what is being shipped; the runtime does not.

      Inquebrável Rule 3 (Honestidade Extrema): consumers running `docker compose up` against the public GHCR tag will believe they are getting production-grade semantic recall. They are not. The stub presence MUST be surfaced at runtime.
    recommended_action: |
      Either (a) gate the stub behind explicit env opt-in `THEMEMORY_ALLOW_STUB=true` and fail-fast otherwise with stderr "OPENAI_API_KEY or LOCAL_TRANSFORMER_ENABLED required; set THEMEMORY_ALLOW_STUB=true to use the stub embedder explicitly"; OR (b) emit a loud one-time stderr warning at startup ("WARNING: running with DeterministicStubEmbedder; recall semantics will be coincidental until OPENAI_API_KEY is set") + add a section to README documenting the stub default + add a `themory health --deep` check that surfaces "stub embedder active" in stdout. Either way, document the trade-off in ADR D8 amendment or a new ADR D15.

  # ===================================================================
  # MAJOR — agent-tools/run-server.ts wires StubEmbedder + DeterministicStubEmbedder simultaneously
  # ===================================================================
  - id: F-arch-6
    severity: MAJOR
    file: src/agent-tools/run-health.ts, src/agent-tools/run-server.ts
    line: "run-health.ts:75, run-server.ts:120"
    plan_ref: ADR D11 — composition root locus; F-arch-5 (related)
    summary: "Two CLI composition roots wire DIFFERENT stub embedders for the same job: `run-server.ts` uses `DeterministicStubEmbedder`, `run-health.ts` uses `StubEmbedder`. Same composition, different semantics — drift waiting to happen."
    evidence: |
      ```ts
      // src/agent-tools/run-server.ts:31
      import { DeterministicStubEmbedder } from '../embedders/stub.js';
      // src/agent-tools/run-server.ts:120
      embedder: new DeterministicStubEmbedder(),

      // src/agent-tools/run-health.ts:31
      import { createLocalMemory, StubEmbedder, StubLLM } from '../local/index.js';
      // src/agent-tools/run-health.ts:75
      const embedder = new StubEmbedder();
      ```
      `run-server.ts` switched to `DeterministicStubEmbedder` (from `src/embedders/stub.js`) because `StubEmbedder` (from `src/local/index.js`) returns ZERO vectors that collapse cosine to NaN — confirmed by the long JSDoc comment in run-server.ts. But `run-health.ts` still imports `StubEmbedder` from `src/local/index.js`. The `--deep` health check calls `embedder.embed('ping')` on this StubEmbedder — and the comment in run-server.ts says this collapses cosine to NaN, which would break any actual smoke-test value.

      Result: `themory server` works (sort of — see F-arch-5); `themory health --deep` claims OK on a fundamentally broken embedder. Two composition roots, two different "stub" defaults — Inquebrável Rule 12 (DRY of knowledge: "what is the stub embedder for the standalone distribution") is violated.
    recommended_action: |
      Pick ONE stub embedder for the standalone CLI surface (likely `DeterministicStubEmbedder` per F-arch-5 fix). Apply the choice uniformly across `run-server.ts` + `run-health.ts` + future `run-mcp-server.ts` (currently still uses `StubEmbedder`). Document the choice as ADR amendment. Bonus: extract a `createDefaultStubMemory(pool: Pool)` helper to centralize the composition so future drift is impossible.

