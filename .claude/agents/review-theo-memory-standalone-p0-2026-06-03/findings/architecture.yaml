  # ===================================================================
  # MINOR — eslint disable comment on bearer-verifier.ts is honest but worth noting
  # ===================================================================
  - id: F-arch-8
    severity: MINOR
    file: src/server/auth/bearer-verifier.ts
    line: 56
    plan_ref: ADR D3 amended; ISP discipline architecture.md § 13.4
    summary: "BearerAuthVerifier.verify is declared async but is fully synchronous; eslint suppression `@typescript-eslint/require-await` carries an honest justification — DIP contract returns Promise<boolean> for future OAuth/JWT swap."
    evidence: |
      ```ts
      // src/server/auth/bearer-verifier.ts:56-57
      // eslint-disable-next-line @typescript-eslint/require-await -- DIP contract returns Promise<boolean> for future async impls (OAuth/JWT); bearer compare is sync.
      async verify(token: string): Promise<boolean> {
      ```
      This is honest YAGNI tension. The DIP method signature is `Promise<boolean>` because future OAuth/JWT impls WILL need async. Forcing sync today (drop the `async`) breaks the LSP contract: a JWT impl using `await jose.jwtVerify(...)` cannot substitute for `BearerAuthVerifier` without changing the interface. Current code is correct under LSP + future-proof under OCP; the lint suppression is the trade-off cost.

      Not a defect — flagged for traceability so any future architecture review knows this is intentional.
    recommended_action: |
      Keep as-is. The JSDoc on the method already explains the contract intent. If ISP review of v0.5 introduces a JWT impl, this trade-off pays off; otherwise consider whether `AuthVerifier` could declare `verify(token: string): boolean | Promise<boolean>` for both sync + async impls (canonical TypeScript idiom).

