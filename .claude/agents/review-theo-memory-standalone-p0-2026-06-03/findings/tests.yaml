  - id: F-tests-5
    severity: MINOR
    file: tests/integration/cli-consolidated.test.ts
    line: 155-187
    plan_ref: T2.4 § TDD — "themory migrate idempotent: second invocation no-op"
    summary: |
      Test #41 asserts both first + second invocations exit 0 and stdout matches
      `/applied/i`. But `themory migrate` writes "migrations applied successfully"
      UNCONDITIONALLY on success regardless of whether anything was actually applied
      (see src/agent-tools/run-migrate.ts:37 — process.stdout.write outside any
      conditional). So the test's regex match is a tautology for the second
      invocation: it cannot distinguish "second run was a no-op" from "second run
      did real work". The idempotency claim is asserted only by exit code 0 +
      absence of duplicate-table errors, which is necessary but not sufficient.
      Additionally the table-drop on line 160 only drops 3 specific tables
      (reflection_counters, consolidation_history, __drizzle_migrations) — it does
      NOT drop `memories`, `entities`, `entity_memories`, etc. Pre-existing rows
      from prior test runs in those tables COULD interfere with the migration
      run, but architecture.md § 10.2 documents that runMigrations() detects
      orphan-schema state (tables present + journal absent) and SKIPS migrate()
      with a console.warn. So the first invocation would emit the warn AND the
      "applied" success line — making the test's `/applied/i` match for FIRST
      invocation a tautology too, possibly masking the orphan-schema-skip path.
    evidence: |
      Line 160: 'DROP TABLE IF EXISTS reflection_counters, consolidation_history,
                __drizzle_migrations CASCADE'
                — does NOT drop memories/entities/etc.
      src/agent-tools/run-migrate.ts:37: process.stdout.write('themory migrate:
                migrations applied successfully.\n');
                — unconditional on success path.
      architecture.md § 10.2: orphan-schema → skip migrate() with warn.
    recommended_action: |
      (a) Drop ALL migration-managed tables in the table-reset block (drop schema
      public cascade + recreate would be cleanest, OR enumerate from drizzle schema)
      so the first invocation exercises the full migration set. (b) Assert
      additional invariants: second invocation stdout MUST NOT contain the
      orphan-schema warn from runMigrations(), AND the timestamp/duration of second
      invocation MUST be measurably shorter than first (no-op should be sub-100ms).
      (c) Alternatively, assert directly against the database: SELECT count(*) FROM
      __drizzle_migrations before/after must show identical row count on second
      invocation.

