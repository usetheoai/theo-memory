    plan_ref: T1.1 § Acceptance Criteria — "EC-5: tests use beforeEach to save + afterEach to restore process.env['THEMEMORY_API_KEY']"
    summary: |
      Test #11 mutates process.env['THEMEMORY_API_KEY'] directly (lines 270, 278)
      without try/finally OR beforeEach/afterEach guard. If the await app.fetch on
      line 271 throws OR if any assertion on lines 279-280 throws, the env var is
      LEAKED to subsequent tests. This violates EC-5 ("env var isolation between
      tests") which the plan absorbed as a test-recommended discipline.
    evidence: |
      Line 270: process.env['THEMEMORY_API_KEY'] = 'sk-test';
      Line 271: const res = await app.fetch(...);   ← throw-site
      Line 278: delete process.env['THEMEMORY_API_KEY'];  ← BEFORE assertions
      Line 279: expect(verifier.verify).toHaveBeenCalledWith('sk-test');
      The sibling bearer-verifier.test.ts properly uses vi.stubEnv + vi.unstubAllEnvs
      + an ORIGINAL_ENV_VALUE afterEach guard at lines 22-32. handlers.test.ts does
      not. Same anti-pattern at lines 237-245 (test 11a) and 252-261 (test 11b) —
      those at least wrap in try/finally so the leak is bounded; test #11 does not.
    recommended_action: |
      Refactor all process.env writes in handlers.test.ts (tests #11, #11a, #11b) to
      use vi.stubEnv + vi.unstubAllEnvs in beforeEach/afterEach hooks at the
      describe block level. The bearer-verifier.test.ts pattern (lines 22-32 +
      ORIGINAL_ENV_VALUE guard) is the canonical form per EC-5.

