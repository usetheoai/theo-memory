findings:
  - id: F-wire-1
    severity: MAJOR
    file: src/local/scoped-skill-memory.ts
    line: 117
    plan_ref: T4.1 + error-handling rule (architecture.md § 8 + global PARTE I-8)
    summary: |
      LocalScopedSkillMemory.add() throws EmptyScopeError when draft.description is empty,
      but EmptyScopeError's contract is "scope (userId/sessionId/agentId) is empty" — NOT
      "skill description is empty". This is a semantic mismatch that misleads consumers
      catching by error type.
    evidence: |
      src/local/scoped-skill-memory.ts:117:
        if (draft.description.trim().length === 0) {
          throw new EmptyScopeError();
        }
      But src/core/errors.ts:96-105 EmptyScopeError message:
        "Scope is empty: at least one of userId / sessionId / agentId must be non-empty.
         All-NULL scopes cannot be persisted in reflection_counters per the table CHECK
         constraint."

      The correct error type already exists: InvalidSkillError with kind 'empty-description'
      is thrown by assertSkillArgs at src/local/pgvector-store.ts:74 and
      src/local/in-memory-store.ts (T2.1) for the SAME failure condition at the store
      layer.

      Additionally, the LocalScopedSkillMemory.add() early throw is defensively redundant
      with the store-layer validation: the store would reject it with the correct error
      type one call later. The early throw is therefore both:
        (a) semantically wrong (wrong error type)
        (b) load-bearing in a way that shadows the correct type

      Consumers wiring try/catch by error name will see "EmptyScopeError" and assume
      they need to set userId/sessionId/agentId — they actually need to set a description.
      Error handling rules (architecture.md § 8): "Erros devem ser explícitos e tipados".
    recommended_action: |
      Replace `throw new EmptyScopeError()` with
      `throw new InvalidSkillError('empty-description', 'description is required and must
      not be whitespace-only (it is the embedding target)')` to match the store-layer
      precedent at pgvector-store.ts:74. Alternatively, drop the early throw entirely and
      let the store-layer assertSkillArgs handle it — the deduplication is preferable per
      DRY (architecture.md § 12). Recommend the latter: remove the early throw + drop the
      EmptyScopeError import from line 22 (currently unused after fix).

  - id: F-wire-2
    severity: MINOR
    file: src/local/skills/consolidate.ts
    line: 322
    plan_ref: T3.1 Phase 1 (Orient)
    summary: |
      Orient phase performs an N+1 read pattern — list() returns rows, then per row
      calls get(row.id) (discarded — only used for null check) followed by
      embedder.embed(skill.description). The get() is wasted work.
    evidence: |
      src/local/skills/consolidate.ts:315-329:
        const [rawRows] = await deps.vectorStore.list(orientFilters, ORIENT_PAGE_SIZE);
        const acc: { skill: Skill; embedding: readonly number[] }[] = [];
        for (const row of rawRows) {
          const skill = rowToSkill(row.id, row.payload, deps.scope);
          if (skill === null) {
            continue;
          }
          const get = await deps.vectorStore.get(row.id);  // <-- N+1 read
          // Conformance contract does not include direct vector access; re-embed
          // from the description as the deterministic source for clustering.
          if (get === null) {
            continue;
          }
          const embedding = await deps.embedder.embed(skill.description);  // <-- N embeds
          acc.push({ skill, embedding });
        }

      Page-size limit (ORIENT_PAGE_SIZE = 500) bounds the blast radius. Sleep-time work
      so latency is amortized. Not a wiring failure; performance smell.
    recommended_action: |
      Drop the `const get = await deps.vectorStore.get(row.id)` block (lines 322-327) —
      list() already confirmed row existence via `rawRows`. The comment about
      "Conformance contract does not include direct vector access" suggests the
      developer intended to use the vector from get() then fell back to re-embedding;
      the get() call is now vestigial.

      Alternative (preferred long-term): expose row.vector on the list() result shape so
      Orient does not need to re-embed — eliminates N+1 embed calls. Out of scope for
      v0.6 hardening; track as a v0.6.1 perf follow-up in voyager-skill-library-followups.md.

  - id: F-wire-3
    severity: MAJOR
    file: src/local/skills/index.ts
    line: 10-11
    plan_ref: cycle-implement.md § Wiring triad pillar (a) + role contract § 3 Dead exports
    summary: |
      The barrel `src/local/skills/index.ts` exports `consolidate` (named) and
      `ConsolidateDeps` (type) but is NEVER imported by any in-project caller AND
      is NOT re-exported from the root public barrel `src/index.ts`. The 2 export
      lines are dead.
    evidence: |
      src/local/skills/index.ts:10-11:
        export { consolidate } from './consolidate.js';
        export type { ConsolidateDeps } from './consolidate.js';

      Consumers verified via:
        grep -rn "from ['\"].*local/skills" src/ --include="*.ts"
          → empty
        grep -rn "from ['\"].*skills/index" src/ --include="*.ts"
          → empty

      The only callers of `consolidate` import directly from './skills/consolidate.js':
        src/local/scoped-skill-memory.ts:37: import { consolidate } from './skills/consolidate.js';

      And the test imports from '../consolidate.js' (relative to the test dir, also
      bypassing the barrel).

      Per role contract § 3 Dead exports: "every export in the diff: must be either
      (a) re-exported via src/index.ts (public API), or (b) used by at least one
      in-project caller. Otherwise, dead." Neither condition holds.

      The barrel file itself was added as part of T4.2 (per commit 3d87cf9 "docs(v0-6):
      public-API barrel + CHANGELOG entry"), but the 2 exports above leak the local-skills
      internals without wiring them into either the public surface OR an internal caller.
    recommended_action: |
      Pick ONE of:
        (a) Delete src/local/skills/index.ts entirely — the file is unreachable, and
            the consumer (LocalScopedSkillMemory) is content importing directly from
            './skills/consolidate.js'.
        (b) Update src/local/scoped-skill-memory.ts:37 to import via the barrel
            (`from './skills/index.js'`) so the barrel becomes the canonical import
            site for internal callers, justifying its existence.
        (c) Re-export `consolidate` and `ConsolidateDeps` from src/local/index.ts
            and ultimately src/index.ts if they are intended as public-surface
            building blocks (e.g., for adapter authors wiring custom orchestrators).
            This requires a CHANGELOG entry + plan-ADR-D5 reconsideration since
            ADR D5 says "Skill type is re-exported from @usetheo/memory/contract;
            NO new subpath in v0.6".

      Recommend (a) since the file is the smallest blast radius + matches the
      current behavior + does not require ADR revisit.

  - id: F-wire-4
    severity: INFO
    file: src/local/scoped-skill-memory.ts
    line: 86, 137
    plan_ref: T4.1 metadata projection
    summary: |
      Inconsistent metadata projection: payloadToSkill() (line 86) spreads ALL payload
      keys into metadata (leaks internal column names like 'kind', 'superseded_by',
      'derived_from'); add() (line 137) cleanly sets metadata = { kind: 'skill' }. The
      two read paths produce different shapes for the same Skill.
    evidence: |
      src/local/scoped-skill-memory.ts:86 (recall path):
        metadata: { ...payload },

      src/local/scoped-skill-memory.ts:137 (add path):
        metadata: { kind: 'skill' },

      Consumers calling skills.add(draft) then skills.recall(query) get two structurally
      different `metadata` Records for the same skill. The recall path leaks internal
      storage column names that consumers should not depend on (encapsulation bleed).

      The same shape inconsistency exists in v0.4a `rowToSkill` at consolidate.ts:274 —
      pre-existing pattern. Not a v0.6 regression in the strict sense, but the v0.6
      code makes the inconsistency MORE visible since skills/add() and skills/recall()
      are the two halves of the same scoped sub-object.
    recommended_action: |
      Pick a single projection contract for `metadata`. Either:
        (a) Always project { kind: 'skill', description?, supersededBy? } (curated whitelist)
            — explicit, encapsulation-respecting.
        (b) Always spread payload (mirror recall) — consistent but leaks shape.

      Recommend (a) and apply it to payloadToSkill at line 86 + propagate to
      consolidate.ts rowToSkill at line 274 to harmonize the v0.4a + v0.6 paths.
      Track as a v0.6.1 follow-up in voyager-skill-library-followups.md — INFO-level
      because no test currently depends on the spread shape and the consumer-facing
      Skill interface fields (id/text/code/description/codeLanguage/etc.) ARE
      consistent across both paths.

  - id: F-wire-5
    severity: INFO
    file: src/local/skill-store-args.ts
    line: 54-62
    plan_ref: T2.1 + ADR D2 (Code-as-skill, NL-spec deferred)
    summary: |
      VectorStoreWithSkillInsert.insertDerivedSkill (standalone, non-Atomic) and
      VectorStoreWithSkillInsert.markSuperseded (standalone) have ZERO production
      callers outside the store classes' own internal use by insertDerivedSkillAtomic.
      The consolidate orchestrator ONLY calls insertDerivedSkillAtomic (line 428).
    evidence: |
      grep -rn "\\.insertDerivedSkill\\b" src/ --include="*.ts" | grep -v Atomic | grep -v "\\.test\\."
        → only src/local/in-memory-store.ts:338 (internal call within insertDerivedSkillAtomic)
           and conformance-test calls in src/local/__tests__/vector-store-conformance.ts

      grep -rn "markSuperseded" src/ --include="*.ts" | grep -v "\\.test\\."
        → declaration in skill-store-args.ts:57, implementations in pgvector-store.ts:594
           + in-memory-store.ts:313, internal call from in-memory-store.ts:339 (within
           insertDerivedSkillAtomic), conformance suite references.

      Pgvector's insertDerivedSkillAtomic inlines the UPDATE (line 658-661); it does NOT
      call this.markSuperseded(). So markSuperseded is callable in principle but is dead
      from a flow-analysis standpoint on the pgvector production path.

      These methods are NOT orphan because they ARE part of the documented public
      interface (VectorStoreWithSkillInsert) + have conformance tests. But pillar (a)
      "production caller" is barely satisfied (only the internal in-memory-store self-call
      for insertDerivedSkill).
    recommended_action: |
      Acceptable for v0.6 as documented + conformance-tested API surface. INFO-level
      observation, NOT a finding requiring change. Two future paths to consider:
        (a) v0.6.1+ when consumers other than the consolidate orchestrator need
            non-atomic supersession (e.g., test fixtures, manual rollback flows), the
            symbols are ready.
        (b) If after 1 release cycle no external consumer materializes, consider
            making them @internal-only (move out of the public DIP shape) per YAGNI.

