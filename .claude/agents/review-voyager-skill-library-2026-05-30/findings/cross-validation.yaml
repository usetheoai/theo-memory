        Switched to a discriminated-union switch keyed off deps.scope.kind:
          - scope.kind === 'agent' → deps.scope.agentId
          - scope.kind === 'repo' → deps.scope.repoId
          - else → null
        Diff is 10 lines (3 deleted + 13 added; net +10 with comment).
      assessment:
        minimal: TRUE (changes ONLY the scopeForArgs literal; no other code paths altered)
        correct: TRUE (mirrors the EC-4 absorption in src/local/index.ts:123 filtersFromScope — the canonical mapping convention for RepoScope at the store layer)
        documented: TRUE (3-line JSDoc comment at the touch site explains the EC-4 link; commit body discloses the bug explicitly)
        regression_risk: LOW (touches only one private mapping; unit tests in consolidate.test.ts continue to pass; integration test newly green is the canary)
        scope_creep: NONE (the fix is a prerequisite for THE GOAL TEST to pass — directly serves T5.1's success criterion)
      severity_of_original_defect: HIGH (would have shipped a silent corruption — derived skills invisible in their own scope)
      severity_of_remediation: NONE (the fix is correct, minimal, and documented)
    acceptance_criteria: ALL_SATISFIED (THE GOAL TEST green against real pgvector when THEOMEM_PG_URI set; npm test 468 passing; npm run lint 0 warnings; typecheck 0 errors)
