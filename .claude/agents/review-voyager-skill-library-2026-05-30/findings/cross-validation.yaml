    bug_fix_audit:
      bug_summary: |
        consolidate.ts scopeForArgs construction was using a generic `'agentId' in deps.scope ? deps.scope.agentId : null` pattern — which is structurally TRUE for AgentScope but produces undefined-narrowing for RepoScope (no `agentId` property exists on RepoScope). Result: derived skills under RepoScope were persisted with agent_id=NULL → recall by repoId would not find them → integration test fails.
