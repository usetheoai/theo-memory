agent: review-voyager-skill-library-architecture
review_target: develop..HEAD for plan voyager-skill-library
plan: .claude/knowledge-base/plans/voyager-skill-library-plan.md
findings:
  - id: F-arch-1
    severity: CRITICAL
    file: src/local/skills/consolidate.ts
    line: 422
    plan_ref: ADR D2 ("v0.6 skill payload is {code, description, codeLanguage}") + T5.1 Goal metric
    summary: >-
      Consolidated derived skill writes `code = description` — discarding the executable
      payload of every source skill. The v0.4a `executeReflection` returns
      `DerivedMemoryDraft { text, derivedFrom }` (no code field) so the orchestrator
      stuffs the LLM's merged-description string into the `code` column. This
      contradicts ADR D2's "code-as-skill (Voyager pattern) is primary" mandate —
      consumers calling `consolidate()` then `recall()` will get rows whose `code`
      field is the description, not executable TypeScript. The Goal-metric test
      passes only because it asserts on `derivedFrom`, never inspecting `code`.
    evidence: |
      consolidate.ts:401-424
        const description = draft.text;
        ...
        const insertArgs: InsertDerivedSkillArgs = {
          embedding,
          hash,
          // LLM produces a single merged text; code = description until v0.6.1
          // expands the draft shape with structured code/description.
          code: description,
          description,
          codeLanguage: 'typescript',
          ...
      executeReflection signature (src/core/reflection/execute.ts:65):
        drafts.push({ text: candidate.text, derivedFrom: ids });
      Goal metric in T5.1 only checks derivedFrom (consolidate-two-skills.test.ts:9-15).
    recommended_action: >-
      Either (a) extend `DerivedMemoryDraft` with optional `code: string` + update
      reflection prompt to emit merged code when source memories carry a code field
      (preserves ADR D2 intent), OR (b) add an explicit ADR amendment to the plan
      documenting that v0.6 ships description-only consolidated skills and v0.6.1
      will add code merging. Current inline comment is not an ADR. Also add an
      integration assertion that `derivedSkills[0].code` differs from the LLM-merged
      description text when source skills carry code.

