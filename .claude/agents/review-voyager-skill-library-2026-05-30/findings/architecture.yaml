  - id: F-arch-3
    severity: MAJOR
    file: src/local/scoped-skill-memory.ts
    line: 117
    plan_ref: architecture.md § 8 (Error handling — "Domain errors are typed classes")
    summary: >-
      `LocalScopedSkillMemory.add()` throws `EmptyScopeError` on empty description.
      `EmptyScopeError`'s semantic per src/core/errors.ts:97 is "Scope is empty: at
      least one of userId / sessionId / agentId must be non-empty" — it refers to
      the reflection_counters CHECK constraint, NOT to skill descriptions. Wrong
      error type sent to consumer; debuggers reading the stack/message will be
      misled into looking at scope wiring instead of the description field.
    evidence: |
      scoped-skill-memory.ts:115-118
        async add(draft: SkillDraft): Promise<Skill> {
          if (draft.description.trim().length === 0) {
            throw new EmptyScopeError();
          }
      errors.ts:96-107 EmptyScopeError message refers to
        "userId / sessionId / agentId must be non-empty"
      The correct typed error already exists: InvalidSkillError('empty-description',...)
      and is the exact error thrown by the pgvector store boundary in
      assertSkillArgs at src/local/pgvector-store.ts:73.
    recommended_action: >-
      Replace `throw new EmptyScopeError()` with
      `throw new InvalidSkillError('empty-description', 'description must not be
      whitespace-only — it is the embedding target')`. Matches the store-level
      guard and the InvalidSkillError reason union.

  - id: F-arch-4
    severity: MAJOR
    file: src/local/skills/consolidate.ts
    line: 322
    plan_ref: T3.1 Phase 1 Orient ("count total skills … via embedding similarity") + architecture.md § 8 (no silent dropping)
    summary: >-
      Orient phase performs an unused `await deps.vectorStore.get(row.id)` for every
      candidate skill, then computes `embedding = await deps.embedder.embed(skill.description)`
      one-at-a-time. The `get()` result is checked for null and discarded; the
      embedding loop bypasses the bulk `embedBatch` interface and serializes N
      embedder calls. For a repo with 500 skills (the ORIENT_PAGE_SIZE cap) this is
      500 wasted DB round-trips plus 500 sequential LLM/embedder calls per
      consolidate() invocation. The follow-up comment ("Conformance contract does
      not include direct vector access; re-embed from the description as the
      deterministic source for clustering") acknowledges the issue but ships it
      anyway.
    evidence: |
      consolidate.ts:317-330
        for (const row of rawRows) {
          const skill = rowToSkill(row.id, row.payload, deps.scope);
          if (skill === null) continue;
          const get = await deps.vectorStore.get(row.id);
          // Conformance contract does not include direct vector access; re-embed
          // from the description as the deterministic source for clustering.
          if (get === null) continue;
          const embedding = await deps.embedder.embed(skill.description);
          acc.push({ skill, embedding });
        }
      Embedder DIP (src/core/dip/embedder.ts) exposes `embedBatch(texts)`.
    recommended_action: >-
      (a) Remove the dead `await deps.vectorStore.get(row.id)` call — no value used.
      (b) Replace the per-row `embed()` with a single `embedBatch(descriptions)`
      after the projection loop, mapping vectors back onto the skills array. (c) If
      direct vector access is needed later, extend the DIP with a typed
      `getVector(id)` method via ADR amendment rather than living with the
      re-embed workaround.

  - id: F-arch-5
    severity: MAJOR
    file: src/local/skills/consolidate.ts
    line: 395
    plan_ref: T3.1 Deep Dives ("for each cluster, call memory.reflect"); architecture.md § 8 (fail-loud, no silent dropping)
    summary: >-
      Phase 3 (Consolidate) silently drops every draft after `drafts[0]`. If the
      LLM returns N drafts for a single cluster (e.g., two distinct facets of the
      merged skill), only the first is consolidated; the others are discarded
      without log, span attribute, or even a comment acknowledging the drop. Per
      `executeReflection`'s signature (`Promise<DerivedMemoryDraft[]>`) and v0.4a
      `LocalScopedMemory.reflect` (src/local/index.ts loops over all drafts at
      line ~280), the multi-draft case is explicitly supported upstream. The v0.6
      orchestrator regresses that capability for skills.
    evidence: |
      consolidate.ts:394-400
        validateProvenance(drafts, cluster.sourceIds);
        const draft = drafts[0];
        if (draft === undefined || draft.derivedFrom.length < 2) {
          continue;
        }
        const description = draft.text;
      v0.4a LocalScopedMemory.reflect (src/local/index.ts ~277+) iterates ALL drafts.
    recommended_action: >-
      Either (a) iterate `for (const draft of drafts)` to consolidate each draft as
      its own derived skill, OR (b) document in the orchestrator comment + plan
      ADR D4 that v0.6 enforces "one derived skill per cluster" and reject drafts
      with length > 1 via a typed error (fail-loud per architecture.md § 8). The
      silent slice-to-first is the wrong middle ground.

  - id: F-arch-6
    severity: MAJOR
    file: src/local/skills/consolidate.ts
    line: 403
    plan_ref: architecture.md § 4 ("Hash dedup via MD5 of normalized text (exact match only)"); T3.1 Deep Dives ("Hash dedup invariant preserved")
    summary: >-
      Derived skill hash is generated via
      `Date.now() + Math.random().slice(2,8)` rather than the content-derived MD5
      hash used everywhere else in TheMemory (LocalScopedSkillMemory.add() at
      scoped-skill-memory.ts:120 uses
      `createHash('md5').update(code).update('|').update(description)`).
      Consequence: running `consolidate()` twice on identical inputs produces
      different `hash` values, defeating the v0.1 `memories_hash_unique_idx`
      constraint's purpose for skill rows AND breaking the EC-3 invariant
      ("running consolidate() twice → second call's derivedSkills.length === 0").
      Currently EC-3 happens to be honored only because Phase 1's
      `excludeSuperseded` filter masks the second-call cluster — but if the
      first call's derived skill hash collided with anything else, the second
      call's insert would still go through.
    evidence: |
      consolidate.ts:403
        const hash = `derived-skill-${String(Date.now())}-${String(Math.random()).slice(2, 8)}`;
      scoped-skill-memory.ts:120 (the canonical pattern)
        const hash = createHash('md5').update(draft.code).update('|').update(draft.description).digest('hex');
      architecture.md § 4: "Hash dedup via MD5 of normalized text (exact match only)"
    recommended_action: >-
      Compute hash as
      `createHash('md5').update(description).update('|').update(JSON.stringify([...draft.derivedFrom].sort())).digest('hex')`.
      Idempotent across repeated consolidate() invocations on the same source
      cluster; ON CONFLICT (hash) DO NOTHING then enforces single-write
      semantics at the SQL layer.

  - id: F-arch-7
    severity: MAJOR
    file: src/core/scope.ts
    line: 38
    plan_ref: architecture.md § 1 ("Three-tier scope. Never introduce a fourth tier without a strategic review.")
    summary: >-
      v0.6 adds a fourth scope kind `RepoScope` to the Scope discriminated union.
      architecture.md § 1 explicitly states "Never introduce a fourth tier without
      a strategic review." Neither the plan, nor the ADRs (D1-D5), nor CLAUDE.md
      reflect a strategic-review record approving the locked rule's relaxation —
      the plan ADR D5 talks about the public-API surface but does not address the
      § 1 invariant. The plan calls this a "NEW scope kind" in T4.1 Evidence and
      proceeds without citing the strategic-review trail. This is exactly the
      kind of architectural relaxation the locked rule guards against.
    evidence: |
      scope.ts:42 — Scope union now: UserScope | SessionScope | AgentScope | RepoScope
      architecture.md § 1: "Never introduce a fourth tier without a strategic review."
      CLAUDE.md § Locked names table lists only User/Session/Agent as the three tiers (strategic).
      Plan T4.1 Evidence: "The `repoId` scope is a NEW scope kind, distinct from User/Session/Agent"
      — admits the new tier but does NOT cite a strategic-review approval.
    recommended_action: >-
      Either (a) surface this as a strategic-review item explicitly and update
      architecture.md § 1 + CLAUDE.md § Locked names to reflect the fourth tier
      decision (with date, rationale, and reviewer), OR (b) drop the RepoScope
      kind and reuse AgentScope with a documented convention that
      `Memory.skills(repoId)` constructs `AgentScope { agentId: repoId, kind:
      'agent' }` underneath — the store-layer mapping (`repoId → agent_id`) already
      does this; the user-facing scope discriminator was unnecessary.

  - id: F-arch-8
    severity: MINOR
    file: src/local/index.ts
    line: 496
    plan_ref: architecture.md § 3 (DIP) + § 7 ("No `any`. If you must escape the type system, use `unknown` with a runtime assertion.")
    summary: >-
      `LocalMemory.skills(repoId)` casts the VectorStore via
      `as VectorStore & VectorStoreWithSkillInsert` without a runtime guard. The
      cast assumes the concrete store implements the extra duck-typed methods;
      if a consumer wires a custom VectorStore implementation (the DIP is public)
      lacking these methods, the cast silently succeeds and the failure surfaces
      far downstream at the first `insertSkill` call. Per architecture.md § 7,
      `unknown + runtime assertion` is required when escaping the type system.
    evidence: |
      src/local/index.ts:496
        const skillStore = this.config.vectorStore as VectorStore & VectorStoreWithSkillInsert;
        return new LocalScopedSkillMemory(repoId, { vectorStore: skillStore, ... });
      VectorStore DIP (src/core/dip/vector-store.ts) is public; consumers can
      ship custom implementations. No runtime typeof guard exists here.
    recommended_action: >-
      Add a runtime guard: e.g., a helper
      `assertSkillCapable(vs: VectorStore): asserts vs is VectorStore & VectorStoreWithSkillInsert`
      that checks `typeof vs.insertSkill === 'function'` etc., throwing a typed
      `Error('configured VectorStore does not implement skill methods — wire
      PgvectorStore or InMemoryVectorStore')` when missing. Mirrors the v0.4a
      `VectorStoreWithDerivedInsert` precedent the file comments cite.

  - id: F-arch-9
    severity: MINOR
    file: src/local/skills/consolidate.ts
    line: 240
    plan_ref: ADR-0001 ("UUID → integer mapping for LLM prompts; auto-detected embedding dimension via probe call"); plan T3.1 Deep Dives ("Reconstruct a Skill from a store row")
    summary: >-
      `rowToSkill()` synthesizes timestamps (`createdAt: new Date()`, `updatedAt:
      new Date()`, `tValid: new Date()`) instead of reading them from the row. Per
      MemoryItem semantics (src/core/memory-item.ts), these fields represent
      persistence facts ("when was this row written?") and synthesizing them at
      read time corrupts audit semantics — every read of the same row produces a
      different `createdAt`. Same defect repeats in `LocalScopedSkillMemory.recall()`
      payloadToSkill (scoped-skill-memory.ts:84-88) and in the orchestrator's
      derived-skill push (consolidate.ts:437-441).
    evidence: |
      consolidate.ts:272-277
        return {
          ...
          createdAt: new Date(),
          updatedAt: new Date(),
          ...
          tValid: new Date(),
          tInvalid: null,
          ...
        };
      scoped-skill-memory.ts:84-88 (same defect in recall projection)
      Pgvector schema (src/local/schema.ts) has actual createdAt/updatedAt
      columns; the v0.4a reflect path at src/local/index.ts:251 does the same
      synthesize-on-read trick — this is a pre-existing defect amplified by v0.6,
      not introduced by it.
    recommended_action: >-
      Extend the PgvectorStore SELECTs to include `created_at`, `updated_at` and
      project them through rowToResult.payload. Update rowToSkill/payloadToSkill
      to read them with safe fallbacks. File a follow-up to fix the same defect
      in the v0.4a reflect path under a separate commit.

