    plan_ref: plan v1.1 § T0.1 — relaxed CHECK includes 'skill' arm
    domain_anchor: 'src/local/schema.ts:88-92 (declarative source)'
    summary: 3-arm CHECK constraint is semantically equivalent between SQL migration, schema.ts source, and 0002_snapshot.json.
    evidence: |
      SQL 0002 lines 8-10:
        (kind='extracted' AND derived_from IS NULL)
        OR (kind='derived' AND jsonb_array_length(derived_from) >= 1)
        OR (kind='skill' AND (derived_from IS NULL OR jsonb_array_length(derived_from) >= 1))
      schema.ts:89-91 (drizzle `check()` body):
        same three-arm SQL via template literal.
      0002_snapshot.json:412-415 `checkConstraints.memories_kind_derived_from_check.value` mirrors the SQL.
      NULL-handling: `jsonb_array_length(NULL)` returns NULL in Postgres, but the 'derived' arm short-circuits on `derived_from IS NULL` being false (because if NULL, `kind='derived'` AND NULL>=1 → NULL, not TRUE). The 'skill' arm explicitly disjuncts `derived_from IS NULL OR jsonb_array_length(...) >= 1` so NULL is allowed for kind='skill' (fresh insertSkill rows) AND non-empty array is allowed (insertDerivedSkill rows). This matches the plan invariant: skill rows can be standalone OR derived.
    recommended_action: None — semantic equivalence confirmed.

