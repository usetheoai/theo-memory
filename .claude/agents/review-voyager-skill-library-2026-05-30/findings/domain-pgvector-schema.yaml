  - id: F-dom-pgvec-11
    severity: MINOR
    file: src/local/pgvector-store.ts
    line: 87-95
    plan_ref: plan v1.1 § T2.1
    domain_anchor: 'pgvector-store.ts:438 (insertDerivedMemory's local `vectorLiteral` shadow)'
    summary: Function-level shadow of `vectorLiteral` inside `insertDerivedMemory` (line 438) does NOT use the NaN/Infinity guard from the module-level `vectorLiteral` at lines 87-95. A malformed embedding for a derived memory would reach pgvector without the clear JS error.
    evidence: |
      Line 87-95 (module level): `vectorLiteral` validates each component is `Number.isFinite(n)`; throws clear error on NaN / Infinity / -Infinity.
      Line 438 (inside insertDerivedMemory): `const vectorLiteral = \`[${args.embedding.join(',')}]\`;` — bare template literal, no guard. This is a const variable that SHADOWS the module-level function within insertDerivedMemory's scope.
      Risk surface: v0.4a derived memory writes from `Memory.reflect()` bypass the F-dom-1 guard. New v0.6 `insertSkill` / `insertDerivedSkill` / `insertDerivedSkillAtomic` correctly call the module-level `vectorLiteral(args.embedding)` (lines 491, 534, 643) — only the older `insertDerivedMemory` path is affected.
      Severity is MINOR (not MAJOR) because: (a) this defect predates the v0.6 change (it's a v0.4a defect uncovered by review of v0.6 sibling paths); (b) v0.6 paths route through the guarded function. But the inconsistency is a latent footgun.
    recommended_action: |
      Either rename the local const at line 438 to avoid shadowing (`const literal = ...`) and call the module-level `vectorLiteral(args.embedding)` instead, OR document explicitly why insertDerivedMemory does not need the guard. Recommend the former for consistency with insertSkill / insertDerivedSkill / insertDerivedSkillAtomic which all call the guarded module-level function.

  - id: F-dom-pgvec-12
    severity: MINOR
    file: src/local/pgvector-store.ts
    line: 145-175
    plan_ref: plan v1.1 § T2.2 EC-3 absorption
    domain_anchor: 'plan v1.1 line 470 — Orient phase MUST call getAll({includeSuperseded:false}); EC-3 invariant'
    summary: composeFilters interprets the Filters interface field as `excludeSuperseded` (boolean), but plan v1.1 + scope.ts core docstring + EC-3 absorption text consistently refer to the user-facing flag as `includeSuperseded` (default false → exclude). The store-side polarity is correct, but the naming difference between core API surface (`includeSuperseded`) and store-internal filter (`excludeSuperseded`) increases cognitive load for future maintainers.
    evidence: |
      Plan line 384: "includeSuperseded (default false — exclude rows whose superseded_by IS NOT NULL)"
      Plan line 470: "scope.getAll({onlySkills: true, includeSuperseded: false})"
      core/scope.ts:107: `readonly excludeSuperseded?: boolean;` — store-internal Filters key (renamed inversion).
      pgvector-store.ts:167: `if (filters.excludeSuperseded === true) { ... superseded_by IS NULL ... }` — correct semantic: excluded when flag true.
      The inversion is intentional (avoids double-negative `includeSuperseded=false` in store SQL composition) but no JSDoc bridges the rename. A maintainer reading store code may miss that this corresponds to the API-surface `includeSuperseded` flag.
    recommended_action: |
      Add a one-line JSDoc above the `excludeSuperseded` block in composeFilters (line 167) noting: "Maps from the public-API `recall({includeSuperseded:false})` / `getAll({includeSuperseded:false})` flag — polarity inverted at the core→store boundary to express the SQL semantic directly." Alternatively, rename the Filters field to `includeSuperseded` and invert the SQL check (`if filters.includeSuperseded === false`). The latter reduces names but adds a double-negative read; the former is the lighter touch.

