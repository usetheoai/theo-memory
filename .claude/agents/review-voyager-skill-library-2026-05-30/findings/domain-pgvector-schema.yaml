    domain_anchor: 'plan v1.1 line 475 — atomicity insertDerivedSkill + markSuperseded via transaction'
    summary: EC-2 atomicity correctly absorbed — insertDerivedSkillAtomic wraps INSERT + UPDATE in a single withTransaction (BEGIN/COMMIT/ROLLBACK).
    evidence: |
      Lines 629-664: `return this.withTransaction(async (client) => { ... await client.query(INSERT ...); await client.query(UPDATE ...); return derivedId; });`
      withTransaction at lines 668-681 issues BEGIN before fn(), COMMIT on success, ROLLBACK on throw, release() in finally.
