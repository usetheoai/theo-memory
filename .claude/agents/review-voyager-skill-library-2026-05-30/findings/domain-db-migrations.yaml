      The project-wide convention is therefore "forward-only" — to roll back, the
      operator either restores from backup OR writes a follow-up migration that
      reverses the change. This is acceptable per industry convention for ADD-only
      schemas (memories table is append-only by design per ADD-only invariant in
      architecture.md § 2; rolling back column adds is rarely needed).

