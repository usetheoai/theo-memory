    line: 5-6
    plan_ref: "schema.ts:67-69 — supersededBy self-FK with onDelete='set null'"
    domain_anchor: "role-contract check #9 (self-FK + ON DELETE SET NULL audit-trail invariant)"
    summary: |
      Self-FK `memories.superseded_by → memories.id` is correctly declared with
      `ON DELETE set null ON UPDATE no action`. When an ancestor skill is hard-deleted,
      its successors' `superseded_by` pointer becomes NULL — preserving the row
      without dangling FK violation. Audit-trail invariant honored: the supersession
      chain is broken safely, not silently corrupted.
    evidence: |
      0002_skill_columns.sql:5-6:
          ALTER TABLE "memories" DROP CONSTRAINT IF EXISTS "memories_superseded_by_memories_id_fk";
          ALTER TABLE "memories" ADD CONSTRAINT "memories_superseded_by_memories_id_fk" FOREIGN KEY ("superseded_by") REFERENCES "public"."memories"("id") ON DELETE set null ON UPDATE no action;
      schema.ts:67-69 (source of truth):
          supersededBy: uuid('superseded_by').references((): AnyPgColumn => memories.id, {
            onDelete: 'set null',
          }),
      Identical semantics. ON DELETE cascade would have been the wrong choice here
      (would propagate ancestor deletion to all descendants, defeating the
      "preserve audit trail when source hard-deleted" invariant per the plan).
    recommended_action: None.

