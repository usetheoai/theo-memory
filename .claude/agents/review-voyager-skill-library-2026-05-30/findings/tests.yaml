findings:
  - id: F-tests-1
    severity: MINOR
    file: src/local/__tests__/scoped-skill-memory.test.ts
    line: 66
    plan_ref: T4.1 TDD RED test #2 (add() returns Skill)
    summary: Test name uses "and" — "persists a kind='skill' row and returns a Skill with valid id"
    evidence: |
      grep result line 66: test('persists a kind=\'skill\' row and returns a Skill with valid id', ...)
    rationale: |
      Per testing.md § Anti-patterns: "Tests with 'and' in the name — split into
      two tests". Borderline acceptable here because both clauses describe a
      single behavior (one call to add()), but for strict compliance the test
      could be split into "add() persists a kind='skill' row" + "add() returns
      a Skill with a valid id". Cosmetic; does not affect coverage.
    recommended_action: |
      Optionally split or rephrase to "add(skillDraft) returns a kind='skill' Skill
      with a valid id". Acceptable as-is for merge.

  - id: F-tests-2
    severity: MINOR
    file: src/local/__tests__/recall-filters.test.ts
    line: 115
    plan_ref: T2.2 TDD RED test (excludeSuperseded:false returns all)
    summary: Test name uses "and" — "returns BOTH the head and the superseded skill"
    evidence: |
      grep result line 115: test('list() WITHOUT excludeSuperseded returns BOTH the head and the superseded skill', ...)
    rationale: |
      Same anti-pattern as F-tests-1. Here the "and" describes the contents of a
      single result set (one query, one result of length 2). Defensible as one
      behavior; flag for awareness only.
    recommended_action: |
      Optionally rephrase to "list() WITHOUT excludeSuperseded returns the full
      version chain". Acceptable as-is for merge.

  - id: F-tests-3
    severity: MINOR
    file: tests/integration/skills/fixtures/two-similar-skills.ts
    line: 28, 44
    plan_ref: T5.1 fixture design
    summary: Both fixtures share an identical description string — invariant load-bearing for cluster threshold; not surfaced in fixture comment
    evidence: |
      SKILL_FETCH.description === SKILL_AXIOS.description === 'retry HTTP fetch on transient failures with exponential backoff'
      THE GOAL TEST uses a deterministic embedder where identical descriptions
      produce identical vectors → cosine 1.0 → cluster passes at any threshold
      ≤ 1.0. If a future maintainer alters one description to "look different",
      the cluster will dissolve and the test silently changes meaning.
    rationale: |
      Determinism invariant lives in 2 separate files; future maintainers may
      not connect them. A single guard comment on the fixture file would harden
      the contract.
    recommended_action: |
      Add a comment block at the top of two-similar-skills.ts noting "these two
      descriptions MUST stay byte-identical so the deterministic embedder in
      consolidate-two-skills.test.ts produces equal vectors. Changing either
      requires updating the test's clusterThreshold." Acceptable as-is for merge.

  - id: F-tests-4
    severity: INFO
    file: src/core/__tests__/scope.test-d.ts
    line: 44-45
    plan_ref: EC-4 (4-switch-site exhaustiveness)
    summary: EC-4 absorption is structurally covered but not tagged with an EC-4 comment marker like EC-1/EC-2/EC-3 are
    evidence: |
      grep for "EC-4" across tests returns 0 hits. EC-1, EC-2, EC-3, EC-17 all
      carry inline comment tags in their respective test files. scope.test-d.ts
      and scoped-skill-memory.test.ts cover the EC-4 surface (type-level union
      forces typecheck on all 4 switch sites; runtime tests exercise repo arm
      of filtersFromScope + assertScopeIsNonEmpty) but do not name the EC.
    rationale: |
      Audit-trail completeness — future readers tracing EC absorption via grep
      will miss EC-4. Cosmetic; does not affect coverage. The 2 reflection-site
      arms (threshold-reflection-policy.ts + prompt.ts) are typecheck-enforced
      per testing.md § Typecheck scope, which is appropriate.
    recommended_action: |
      Add a `// EC-4 absorption: RepoScope union triggers typecheck on all 4
      switch sites` comment near scope.test-d.ts:44. Acceptable as-is for merge.

summary: |
  Test suite for v0.6 voyager-skill-library is APPROVED with 4 MINOR/INFO nits,
  none blocking merge:

  STRENGTHS:
  - THE GOAL TEST (T5.1) is textbook integration depth — Given/When/Then comments,
    1 derived + provenance + supersession + DB-level row inspection + cross-repo
    scope isolation as a sibling test. 5 distinct assertions on a single
    consolidate() call.
  - 4/4 plan EC absorptions covered with strong fixtures (EC-1 verbatim
    constraint name; EC-2 atomicity sentinel via vi.spyOn throw; EC-3 list()
    + search() filter parity; EC-4 type-level + runtime arms).
  - 9 plan TDD sections (T0.1 → T5.1) all have RED tests landed with their
    impls in atomic commits — consistent with v0.4a project precedent and
    cycle-implement.md halt-loop discipline.
  - Determinism is rigorous: FixtureEmbedder + FixtureLLM are pure-function
    registries; THE GOAL TEST's descriptionVector hashes string content
    deterministically; no Math.random / wall-clock dependencies in assertions.
  - Pyramid balance preserved: 59 unit : 12 integration : 1 E2E baseline,
    v0.6 adds 8 unit + 1 integration — maintains the inverted shape per
    testing.md § Pyramid.
  - Pre-existing failures honestly logged in voyager-skill-library-followups.md
    with verified-on-develop reproduction methodology (Inquebrável Rule 3).
  - No .only / .skip / xit / xtest leaks; the single describe.skip is
    legitimately env-gated (EC-17) and fails loudly under CI=true.

  NITS (all MINOR/INFO, none blocking):
  - F-tests-1, F-tests-2: two test names contain "and" — defensible as
    describing single behaviors; cosmetic split optional.
  - F-tests-3: fixture descriptions byte-identical is a load-bearing
    invariant not commented in the fixture file; harden with a guard comment
    later.
  - F-tests-4: EC-4 absorption isn't tagged with an inline EC-4 comment
    (the other 4 ECs are); audit-trail nit.

  RECOMMENDATION: APPROVE for merge. Nits land as a follow-up commit OR are
  acceptable as-is given the strength of the underlying coverage.
