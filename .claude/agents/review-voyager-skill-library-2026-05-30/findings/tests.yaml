fixture_quality:
  file: tests/integration/skills/fixtures/two-similar-skills.ts
  shape: GOOD
  notes: |
    Two fixtures express the same intent (retry HTTP fetch with exponential backoff)
    via syntactically-different code (fetch vs axios). They share an IDENTICAL
    description string — which is the embedding target per ADR D2 — so the
    deterministic `descriptionVector()` in the goal test produces the same vector
    for both → cosine 1.0 → cluster above 0.9 threshold guaranteed. This is the
    correct calibration for THE GOAL TEST's deterministic determinism claim.
  determinism: STRONG  # no Math.random / Date.now / wall-clock in fixture; setTimeout calls are INSIDE the example skill code (a string literal — not executed by tests)
  minor:
    - The description text reads "retry HTTP fetch on transient failures with exponential backoff" — exactly the same on both fixtures. Authors may wish to add a 2nd-pair-of-eyes comment noting "these MUST stay identical or the cluster threshold check needs revision" so future maintainers don't drift them apart.

determinism:
  embedder: STRONG  # all 3 test embedders (FixtureEmbedder in consolidate.test.ts, FixedEmbedder in scoped-skill-memory.test.ts, descriptionVector in goal test) are pure functions; same input → same output
  llm_stubs: STRONG  # all 3 LLM stubs (FixtureLLM, consolidatingLlm, StubLLM) are pure functions; no random / no time
  time: ACCEPTABLE  # consolidate.test.ts:314-339 uses `new Date()` in projectSkillToMemoryItem fixture rows — only feeds into MemoryItem shape (text projection test); does NOT participate in assertions. Acceptable per testing.md § Determinism.
  db_reset: STRONG  # goal test truncates `memories, entities, history` in beforeEach + afterAll; in-memory tests create a fresh InMemoryVectorStore in beforeEach
  flake_risk: LOW

