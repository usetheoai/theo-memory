        return Promise.resolve({
          sourceClusters, derivedSkills, supersededIds, durationMs: Date.now() - startedAt,
        });
      });
    recommended_action: |
      Optional cleanup. If kept, add a few attributes on the report span so
      it's not a no-op observation; if removed, set the parent-span attributes
      directly. Not a blocker for v0.6.

