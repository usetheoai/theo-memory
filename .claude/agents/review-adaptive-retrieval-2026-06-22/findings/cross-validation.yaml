      - packages/core/src/infrastructure/adaptive/heuristic-policy.ts
    plan_ref: "Global Definition of Done line 362: 'No paper names in src/** (Self-RAG/CRAG cite the plan/blueprint, not code)' + .claude/rules/no-paper-names-in-code.md"
    summary: >
      The plan's own DoD explicitly requires NO paper names in src/**, yet the research-paper
      names "Self-RAG" and "CRAG" appear 20 times across src/**/*.ts JSDoc/comments (non-test).
    evidence: |
      grep -rniE '\b(self-rag|crag)\b' packages/core/src --include='*.ts' (excluding tests) => 20 hits:
        domain/dip/adaptive-retrieval-policy.ts (7), domain/retrieval/pipeline.ts (4),
        infrastructure/db/config.ts (2), infrastructure/db/scoped-memory.ts (2),
        domain/options.ts (2), domain/index.ts (1), domain/memory-event.ts (2),
        infrastructure/adaptive/heuristic-policy.ts (1).
      no-paper-names-in-code.md: "Research-paper and marketing names ... SHALL NOT appear in src/** ... JSDoc, inline comments".
      The rule's banned-token list does NOT literally enumerate Self-RAG/CRAG (it lists Voyager/Mem0/Letta/...),
      and no sentinel test greps them — which is why the contract suite stayed green. But the rule's
      scope is open-ended ("etc.") AND the plan's DoD names Self-RAG/CRAG SPECIFICALLY as the names to
      keep OUT of code. The DoD line 362 was therefore checked off (commit shipped) without being satisfied.
    recommended_action: >
      Either (a) replace "Self-RAG"/"CRAG" in src/** with neutral wording per the rule
      (e.g. "pre-embed retrieval gate" / "post-threshold grade-and-correct"), citing the plan/blueprint
      via @see for provenance; OR (b) if the project owner judges these acronyms acceptable, add an
      explicit exemption (an ADR amending no-paper-names-in-code.md, like the benchmark-vendor ADR-0017)
      AND correct the plan DoD line 362. Do NOT silently leave the DoD claim checked while violated
      (Inquebrável Rule 3).

