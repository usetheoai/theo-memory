      Shipped (adaptive-retrieval-policy.ts:101-105): assess(query, results, tuning?: AdaptiveTuning)
      AdaptiveTuning + the 3rd param are documented in JSDoc + the type test, and forward
      RecallOptions.adaptive per-call overrides — a reasonable need. The validate report mentions
      AdaptiveTuning but does not flag it as an ADR-D1 signature divergence.
    recommended_action: >
      Acceptable as-is (within ADR-0008; documented), but note the divergence in the implementation
      record so the ADR and code agree. Optionally amend ADR D1's signature to include the optional
      tuning param.

  - id: F-xval-3
    severity: LOW
    file: packages/core/src/infrastructure/adaptive/heuristic-policy.ts
