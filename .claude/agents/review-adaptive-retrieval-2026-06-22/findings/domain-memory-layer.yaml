  - id: F-dom-9
    severity: MEDIUM
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 185
    plan_ref: T3.1 § acceptance criteria EC-3
    summary: "RecallOptions.adaptive without wired retrievalPolicy: verify no-op claim in EC-3"
    evidence: |
      **Claim (plan EC-3)**: Setting `RecallOptions.adaptive` WITHOUT a wired
      `retrievalPolicy` is a no-op (byte-identical to plain recall).
      
      **Code path analysis**:
      1. `scoped-memory.ts` line 310: gate `if (adaptivePolicy !== undefined)` 
         → NO shouldRetrieve call if policy is absent ✓
      2. `pipeline.ts` line 352: gate `if (deps.retrievalPolicy !== undefined)`
         → NO assess call if policy is absent ✓
      3. `scoped-memory.ts` line 347: cache applicability gate includes
         `this.config.retrievalPolicy === undefined` → cache is NOT bypassed
         if no policy wired ✓
      
      **Observation**: When `RecallOptions.adaptive = { floor: 0.9 }` but NO policy
      is wired (both gates are false), the options are silently discarded with NO event
      or warning. This is correct per the plan (no-op), but a consumer might be surprised
      if they forgot to wire `retrievalPolicy` in config. This is an acceptable YAGNI —
      the silent no-op is more user-friendly than a WARNING or ERROR that would force
      every legacy caller to deal with the option.
      
      **Verdict**: EC-3 is correctly implemented as specified.
    recommended_action: None required; the no-op behavior is intentional per plan. Consider documenting in JSDoc that RecallOptions.adaptive is ignored when no policy is wired.

