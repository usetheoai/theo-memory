  - id: F-dom-2
    severity: INFO
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 160
    plan_ref: T3.1 § applyAdaptiveAssessStage, ADR D4
    summary: "Step 8.6 assess+correct correctly gate-guarded; EC-1 clamp properly enforced"
    evidence: |
      Function `applyAdaptiveAssessStage` (lines 160-217) implements:
      
      1. **Action branch tree** (lines 175-216):
         - accept → return unchanged (line 176)
         - reject → emit `retrieval_low_confidence` + return unchanged (lines 178-183)
         - relax → EC-1 clamp check (lines 189-191) BEFORE re-filter (line 192)
      
      2. **EC-1 clamp** (lines 189-191):
         ```ts
         if (rt === undefined || Number.isNaN(rt) || rt < 0 || rt >= threshold) {
           return scoredSorted;
         }
         ```
         - Rejects `undefined` (missing value)
         - Rejects `NaN` (payload corruption)
         - Rejects `rt < 0` (negative threshold is invalid)
         - Rejects `rt >= threshold` (non-narrowing; no widening allowed)
         
         When any condition fires, the relax is treated as `accept` (no correction,
         no event) — a clean fail-safe with NO false positives.
      
      3. **EC-2 absorption** (lines 195-200):
         After relax re-filters, if `relaxed.length <= scoredSorted.length`,
         the relax surfaced no new rows → emit `retrieval_low_confidence` +
         return original pool. The pooling boundary is `<=` (includes no-op
         widening as a failed relax).
      
      4. **Fail-soft try/catch** (lines 172-216):
         On `policy.assess()` throw, emit `retrieval_low_confidence` with
         reason `assess_failed:{ErrorName}` + return original results. Recall
         NEVER crashes (ADR D4 fail-soft, mirrors line 106-114 rerank fail-soft).
      
      All acceptance criteria met.
    recommended_action: None; this is correct.

  - id: F-dom-3
    severity: INFO
    file: packages/core/src/infrastructure/db/scoped-memory.ts
    line: 304
    plan_ref: T3.1 § shouldRetrieve gate, ADR D2
    summary: "Pre-embed shouldRetrieve gate correctly positioned BEFORE both cache and embed paths"
    evidence: |
      In `retrieveResults()`, the adaptive gate (lines 304-323) runs:
      - **When**: at the START of the method (line 304), BEFORE:
        - Cache applicability check (line 342-347)
        - Cache lookup (line 361)
        - Embed call (line 360 in cache-miss path OR line 350 in non-cache path)
      
      - **Skip logic** (lines 310-322):
        When policy is wired and `shouldRetrieve=false`:
          1. Emit `retrieval_skipped` event (line 314-317)
          2. Return `[]` (line 318)
          3. The embed is never invoked (embed-spy count 0)
      
      - **Guarding**: conditioned on `adaptivePolicy !== undefined` (line 310)
        → absent policy ⇒ entire gate is skipped, byte-unchanged default
      
      - **Fail-soft** (lines 320-322):
        On `shouldRetrieve()` throw, fall through to normal retrieval (do NOT skip).
        No event emitted on error (correct per Princípio 3: only decision-driven
        events, not failure-driven).
      
      - **Cache bypass interaction** (lines 336-347):
        Cache applicability explicitly gates on `this.config.retrievalPolicy === undefined`
        (line 347). This is correct: when a policy is wired, the cache is bypassed,
        because the v1.5 cache key does not encode the adaptive outcome. Serving a
        cached plain result for a wired-policy-using consumer would be a correctness bug.
        Mirrors the `options.rerank` and `options.asOf` bypass precedents (lines 346, 344).
      
      The gate is positioned and guarded correctly.
    recommended_action: None; this is correct.

  - id: F-dom-4
    severity: INFO
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 347
    plan_ref: T3.1 § Step 8.6, plan § Phase 3 Dependency Graph
    summary: "Step 8.6 position correct: AFTER Step 8 threshold filter, BEFORE Step 8.5a rerank, BEFORE MMR diversify"
    evidence: |
      Pipeline stage ordering (lines 291-410):
      
      1. **Step 8** (lines 291-308): threshold filter → `scored`
      2. **Step 8.6** (lines 347-367): adaptive assess+correct (if policy wired)
         - Input: `scored` from Step 8 (threshold-passing)
         - Output: potentially-relaxed `scored` (may have sub-threshold rows added)
         - The corrective reuses the pre-threshold `candidates` pool (line 9) to re-filter
           at a lower threshold (line 192 calls `filterAtThreshold` over the original
           pre-threshold `candidates`).
      
      3. **Step 8.5a** (lines 376-381): cross-encoder rerank (if requested)
         - Input: `scored` from Step 8.6 (or Step 8 if no policy)
         - Operates on the final pool (after any adaptive correction)
      
      4. **Step 8.5b** (lines 384-401): MMR diversify (if requested)
         - Input: `scored` (after rerank or Step 8.6, depending on which fired)
      
      **Ordering justification**:
      - Adaptive BEFORE rerank: the corrected pool is the input to rerank, matching the pattern
        "extend results if threshold is weak, then rerank the combined set for precision"
        (CRAG flow).
      - Adaptive BEFORE diversify: same logic — corrected pool is diversified.
      - Mutual exclusion: `options.rerank` and `options.diversify` are mutually exclusive
        (line 372-373 throws `RerankerConflict`), so no ambiguity.
      
      The 9-step pipeline numbering in JSDoc (lines 1-25) describes the logical 9 steps
      (preprocess, embed, semantic over-fetch, BM25, sigmoid, entity boost, combine,
      threshold, format). Step 8.6 is a POST-threshold extension; it does not disrupt
      the numbering.
    recommended_action: None; this is correct.

