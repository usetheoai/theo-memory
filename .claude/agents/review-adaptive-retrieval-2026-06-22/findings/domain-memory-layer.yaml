summary: |
  **Domain-layer review findings for adaptive-retrieval (Item 13):**
  
  The 9-step pipeline integrity is PRESERVED. The adaptive feature's two seams
  (shouldRetrieve pre-embed + assess post-threshold) are correctly positioned,
  guarded, and isolated.
  
  **Pipeline ordering verified**:
  - shouldRetrieve gate: top of retrieveResults, BEFORE embed (saves cost on skip)
  - assess+correct: Step 8.6, AFTER threshold filter, BEFORE rerank/diversify
  - Both are opt-in (guarded by policy presence)
  - Both are fail-soft (throw → normal path + observable event)
  
  **Princípio 2 (priorización > volume) honored**:
  - Skip path returns [] without embedding (cost savings)
  - Relax is bounded (in-memory, no re-embed, no external fallback)
  - Opt-in + default-OFF (no behavior change for existing callers)
  
  **Princípio 3 (auditability) fully implemented**:
  - 3 new events: retrieval_skipped, retrieval_corrected, retrieval_low_confidence
  - Every decision is observable (no silent IGNORE)
  - No-op observability discipline respected (events only on actual decisions)
  
  **EC-1 (clamp enforcement)**: filterAtThreshold reuse ensures byte-consistency
  between initial filter and relax correction. Clamp correctly rejects undefined,
  NaN, negative, and non-narrowing thresholds.
  
  **EC-3 (RecallOptions.adaptive without policy)**: Correctly silences to a no-op
  (byte-unchanged). Cache is NOT bypassed when no policy is wired (correct).
  
  **DIM interaction**: Pipeline is DIM-agnostic; GOAL test at DIM=8 validates
  end-to-end correctness.
  
  **No paper names in src/**: DIP and impl files use only technical prose
  (Self-RAG, CRAG not as identifiers, only in citations within JSDoc
  referencing blueprint/plan).
  
  **Zero fabricated citations**: All `.claude/knowledge-base/` refs resolve;
  all ADR citations (D1-D5) match the plan.
  
  **All findings are INFO or LOW severity.** No HIGH/BLOCKER defects detected.
