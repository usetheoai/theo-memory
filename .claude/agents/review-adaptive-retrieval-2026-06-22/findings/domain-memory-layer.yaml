  - id: F-dom-6
    severity: INFO
    file: packages/core/src/infrastructure/adaptive/heuristic-policy.ts
    line: 53
    plan_ref: ADR D3, plan § Phase 4 T4.1
    summary: "Heuristic impl: key-free, deterministic, pure in-memory"
    evidence: |
      `HeuristicAdaptiveRetrievalPolicy` (lines 53-98):
      
      1. **No new dependency**: Only imports from `domain/dip/` (the contract) and
         `domain/memory-item.ts` (the DTO). No external LLM SDK, no HTTP, no model.
      
      2. **Deterministic logic**:
         - `shouldRetrieve()` (lines 67-72): string lower-case + trim, set membership check.
         - `assess()` (lines 76-97): numeric comparison (`top.score < floor`).
         Both are pure functions, no randomness.
      
      3. **Default values** (lines 50-51):
         - `DEFAULT_CORRECTIVE_FLOOR = 0.5` — a typical cosine threshold
         - `DEFAULT_RELAXED_THRESHOLD = 0.05` — one-tenth the default floor,
           a conservative relax (EC-1 clamp ensures it's lower than the original
           threshold passed at recall time).
      
      4. **Per-call tuning honored** (lines 81-82):
         ```ts
         const floor = tuning?.correctiveFloor ?? this.correctiveFloor;
         const relaxedThreshold = tuning?.relaxedThreshold ?? this.relaxedThreshold;
         ```
         Allows per-call override from `RecallOptions.adaptive` (forwarded by pipeline).
      
      5. **Conservative by design**:
         - `shouldRetrieve` defaults to `true` (always retrieve), unless a
           no-retrieve marker is configured (default `[]` ⇒ always retrieve).
         - `assess` returns `accept` when `top >= floor` (no relax when strong).
         - Relax is opt-in via `correctiveFloor` tuning.
      
      The impl is production-ready as-is; an optional LLM-judged variant (ADR D3
      future work) would reuse the same DIP and be shipped behind the same config slot.
    recommended_action: None; this is correct.

