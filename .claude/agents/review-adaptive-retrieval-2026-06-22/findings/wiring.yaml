config_threading_verification:
  - config_type: LocalMemoryConfig
    extends: MemoryConfig (domain contract)
    new_field: retrievalPolicy?: AdaptiveRetrievalPolicy
    threading_path: |
      1. factory.createLocalMemory(config) receives config with optional retrievalPolicy.
      2. baseConfig spread (line ~108 of factory.ts) preserves all config keys including retrievalPolicy.
      3. LocalMemory constructor receives baseConfig.
      4. LocalScopedMemory instance reads this.config.retrievalPolicy (line 308 scoped-memory.ts).
      5. runRetrievalPipeline called with {..., retrievalPolicy: this.config.retrievalPolicy, ...} (line 335).
    verdict: FULLY_THREADED — retrievalPolicy flows from factory input → config → scoped-memory → pipeline deps

cache_bypass_verification:
  - cache_gating_line: packages/core/src/infrastructure/db/scoped-memory.ts:328
  - gate_logic: |
      const cacheApplicable = cache !== undefined &&
        options?.asOf === undefined &&
        options?.attributedTo === undefined &&
        options?.rerank === undefined &&
        this.config.retrievalPolicy === undefined;  // <-- KEY GATE
    
      When retrievalPolicy is wired ⇒ cacheApplicable = false ⇒ full pipeline runs.
      Rationale: v1.5 cache key does not encode adaptive outcome (shouldRetrieve skip
      or CRAG relax), so serving cached-non-adaptive result for adaptive recall would
      be a correctness bug (mirrors rerank/asOf/attributedTo bypass logic).
  - verdict: CORRECT — cache bypass prevents stale result serving

recursion_and_scope_check:
  - question: Do the shouldRetrieve / assess hooks reference back into Memory or recall recursively?
    answer: NO — both hooks are pure decision functions per DIP contract (dip/adaptive-retrieval-policy.ts:17-26).
             The policy NEVER performs I/O or invokes Memory methods. SRP separation preserved.
             All I/O is pipeline's responsibility; policy only DECIDES (ADR D1).
    verdict: NO_RECURSION — design is sound

