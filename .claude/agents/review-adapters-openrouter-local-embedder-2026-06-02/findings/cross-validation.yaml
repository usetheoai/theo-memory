  - id: F-xval-5
    severity: MINOR
    file: src/local/index.ts
    plan_ref: |
      Plan T0.2 § Files to edit #3: "src/local/index.ts — createLocalMemory
      passes config.embeddingDim through to PgvectorStore constructor when
      caller uses pgvector backend"
    summary: |
      Plan T0.2 declared `src/local/index.ts` as a file to edit so that
      `createLocalMemory` would plumb `config.embeddingDim` to the
      PgvectorStore constructor. The empirical reality (correctly surfaced
      by the implementation at SEPA iter-2 pre-RED C1, documented in
      commit 804f2fa) is that `createLocalMemory` NEVER constructs
      PgvectorStore — it receives an already-constructed `config.vectorStore`
      from the caller. The actual dim-plumbing happens at the demo level
      in T2.1's `examples/chat-with-memory/lib/memory.ts buildStore` (line
      165): `new PgvectorStore(pgPool, { embeddingDim })`. So plan T0.2
      Files to edit #3 is WRONG, surfaced honestly, and the implementation
      correctly skipped it. This is a plan defect, not an implementation
      defect, but `cycle-review.md` Step B flags "File missing from diff:
      MAJOR (declared but not edited; the task is partial OR the plan was
      wrong)" — for transparency.
    evidence: |
      src/local/index.ts:735 createLocalMemory signature:
        export async function createLocalMemory(config: LocalMemoryConfig)
      The function never instantiates PgvectorStore; config.vectorStore is
      ALREADY a VectorStore implementation. The dim is propagated via the
      `effectiveDim` probe at line 738-739, not through any PgvectorStore
      constructor call inside this function.

      The actual PgvectorStore({embeddingDim}) construction happens at:
        examples/chat-with-memory/lib/memory.ts:165
          vectorStore: new PgvectorStore(pgPool, { embeddingDim }),
      which is T2.1's commit c5425ec, not T0.2's commit 804f2fa.

      Commit 804f2fa log honestly flags:
        "Plan defect documented (C1 — see iteration-2-pre-red.md): plan T0.2
        § Files to edit #3 lists `src/local/index.ts — createLocalMemory
        plumbs config.embeddingDim to PgvectorStore constructor`. Empirical
        reality: createLocalMemory NEVER constructs PgvectorStore — it
        receives an already-constructed `config.vectorStore` from the caller.
        The actual plumbing site (demo passing `{ embeddingDim: 384 }`)
        lives at T2.1 consumer code. T0.2's scope is correctly REDUCED to
        constructor + guard + NEW test file."
    recommended_action: |
      Amend plan v1.2 T0.2 § Files to edit to remove the third line
      ("createLocalMemory plumbs config.embeddingDim to PgvectorStore
      constructor") since this is empirically not the case. Add a new note
      to T2.1 § Files to edit explicitly listing the
      `examples/chat-with-memory/lib/memory.ts buildStore` site as the
      actual dim-plumbing surface for the demo consumer. Net effect: no
      change to which files were edited; just plan-accuracy correction.

  - id: F-xval-6
    severity: MINOR
    file: src/embedders/index.ts
    plan_ref: |
      Plan ADR D7 § Alternatives considered (third bullet):
        "REJECT — single barrel under `./embedders` that exports all 3 (stub,
        openai, local) — works mechanically but loses the per-provider
        isolation that lets bundlers tree-shake unused providers."
      Plan T1.1 § Files to edit #3:
        "src/embedders/index.ts — re-export LocalTransformerEmbedder (sibling
        pattern to existing barrel)"
    summary: |
      Plan ADR D7 § Alternatives explicitly REJECTS a single barrel under
      `./embedders` that exports all 3 adapters. But plan T1.1 § Files to
      edit #3 explicitly mandates re-exporting `LocalTransformerEmbedder`
      from `src/embedders/index.ts` (the SAME barrel that ADR D7
      "rejects"). Implementation followed T1.1 (commit c488734 added the
      re-export). This is an INTERNAL plan contradiction: ADR D7
      "rejected" alternative is implemented as a mandatory step in T1.1.
      The internal `./embedders` barrel was a pre-existing precedent from
      Cycle 1 (commit e503aa8) + Cycle 2 (commit 9352d52), so the
      "rejection" in ADR D7 was actually about NOT MAKING THE BARREL the
      SOLE export path — the subpath `./embedders/local` was added
      ALONGSIDE the barrel re-export. The implementation is consistent
      with precedent, but the plan's framing is ambiguous.
    evidence: |
      package.json#exports has BOTH:
        "./embedders": { "default": "./src/embedders/index.ts" }
        "./embedders/local": { "default": "./src/embedders/local.ts" }

      src/embedders/index.ts (post-T1.1):
        export { DeterministicStubEmbedder } from './stub.js';
        export { OpenAIEmbedder } from './openai.js';
        export { LocalTransformerEmbedder } from './local.js';
      All 3 are re-exported from the single barrel.

      Plan T1.1 Tasks step 4: "Re-export from `src/embedders/index.ts`"
      Plan ADR D7 § Alternatives (rejected): "single barrel under `./embedders`"

      Resolution: the existing barrel was a Cycle 1/2 precedent; "single
      barrel" in ADR D7 likely meant "single barrel as the SOLE export
      path" (no per-provider subpath), and the implementation matches the
      precedent by providing BOTH the barrel AND the per-provider subpath.
      Plan framing could be tighter; implementation is consistent with
      cycle precedents.
    recommended_action: |
      Plan v1.2 § ADR D7 § Alternatives third bullet should be reworded
      from "single barrel under `./embedders`" to "single barrel as the
      sole export path (no per-provider subpath)" — the existing barrel
      precedent is preserved, and the subpath is additive. This is a
      doc-clarity nit; implementation behavior is correct.

