findings:
  - id: F-xval-1
    severity: MAJOR
    file: src/local/index.ts
    plan_ref: |
      Plan ADR D3 (T0.3) Decision text + § Deep Dives "HNSW index conflict (EC-4 absorption)"
      explicitly specifies the SQL sequence:
        ```
        ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ```
      Plan T0.3 Tasks #2 sub-step lists "the 2 `ALTER COLUMN TYPE ... USING NULL`".
    summary: |
      T4.1 follow-up fix at commit f7f822e replaced `ALTER COLUMN TYPE vector(N) USING NULL`
      with sequential `DELETE FROM memories; DELETE FROM entities; ALTER COLUMN TYPE vector(N);`
      because `USING NULL` collided with the existing `NOT NULL` constraint on
      embedding columns (PG error 23502). This is an ADR D3 contract divergence
      — the SQL used at runtime no longer matches the SQL specified in ADR D3.
      The divergence is documented in the commit message but no new ADR was
      authored. Per cycle-review.md Step F (Detect divergence from ADRs):
      divergence from ADR requires its own ADR in the implementation OR a
      plan revert.
    evidence: |
      src/local/index.ts:886-889 (current implementation):
        await client.query('DELETE FROM memories');
        await client.query('DELETE FROM entities');
        await client.query(`ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);
        await client.query(`ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);

      Plan ADR D3 (.claude/knowledge-base/plans/adapters-openrouter-local-embedder-plan.md:117-120):
        ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;

      Commit f7f822e log: "Replaced `ALTER ... USING NULL` with sequential
      `DELETE FROM memories; DELETE FROM entities; ALTER COLUMN TYPE vector(N);`
      inside the existing BEGIN/COMMIT atomic block."

      The semantic equivalent (destructive data drop) is preserved — both
      paths discard the existing embeddings — but the SQL contract surface
      is different (`DELETE` triggers + cascade behavior MAY differ from
      `USING NULL` + `NOT NULL` rejection, especially for FK rows pointing
      to memories).
    recommended_action: |
      Either (a) author a new ADR (D3-amend) documenting the empirical
      reality that `ALTER COLUMN TYPE vector(N) USING NULL` violates the
      `NOT NULL` constraint on `memories.embedding` and `entities.embedding`,
      justifying the DELETE+ALTER replacement; or (b) revert to the ADR D3
      SQL by dropping the `NOT NULL` constraint at migration time then
      restoring it; or (c) bump plan to v1.2 with the corrected ADR D3 SQL
      text. Option (a) is cheapest and matches the "honest divergence" pattern.

