    domain_anchor: |
      EC-3 absorption (edge-cases review §EC-3): the entire 6-statement
      sequence runs inside a single BEGIN/COMMIT; on any failure, ROLLBACK
      preserves the pre-ALTER schema atomically. Without an integration test
      that empirically forces the rollback path against real pgvector, the
      atomic guarantee remains a code-comment promise, not a verified
      invariant.
    summary: |
      The plan declared a dedicated RED test for EC-3 atomic rollback semantics
      and locked it in the Acceptance Criteria. The integration test file
      `tests/integration/migrations/dim-change.test.ts` SHIPPED WITH 5 tests
      (backward-compat, parametric ALTER, HNSW recreation, idempotency,
      explicit 1536 no-op) but NONE simulate a mid-sequence failure to verify
      ROLLBACK actually restores the pre-state. The plan's most load-bearing
      pgvector-schema invariant — "atomic transaction on a destructive
      multi-statement DDL sequence" — is unverified.

      Without the test, future regressions in `applyDimChange` could:
        - swap ROLLBACK for individual statement cleanup (silent half-state)
        - introduce a non-transactional autocommit path (e.g., reuse pool.query
          instead of client.query — explicit SEPA-iter-3 CRITICAL #1 risk)
        - lose the `client.release()` on error path (connection leak)

      A failing CREATE INDEX (e.g., simulate via pre-existing index name
      collision) is the minimal reproduction. The architecture reviewer
      already noted the contradictory atttypmod docstring comments in this
      file (F-arch-? if present); this finding is complementary.

    evidence: |
      tests/integration/migrations/dim-change.test.ts lines 58-172 contain
