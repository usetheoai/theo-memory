  - id: F-dom-pgvector-7
    severity: MINOR
    file: src/local/index.ts
    line: 849-856
    plan_ref: |
      plan T0.3 § Deep Dives "Idempotency" §413:
        "if the column is ALREADY `vector(${dim})`, the helper short-circuits
         — checks current `atttypmod` via `pg_attribute` BEFORE the ALTER
         sequence."
    domain_anchor: |
      pgvector-specific: pg_attribute.atttypmod for the `vector(N)` type
      stores the dim directly in v0.5.1 (empirically verified, per the
      iteration-3 retrospective). Future pgvector versions MAY change the
      encoding (e.g., introduce a +VARHDRSZ offset like other varlena
      types). The probe MUST be version-defensive.
    summary: |
      The `atttypmod` probe assumes "currentDim = atttypmod" verbatim
      (line 857). This is correct for pgvector v0.5.1 but assumes the
      encoding will remain stable. If a future pgvector release ships
      a different `typmodin` function (e.g., to support per-dim metadata
      like `vector(N, normalized=true)`), `atttypmod` could become an
      encoded value rather than the raw N — the short-circuit would
      silently misbehave (e.g., always think dim is wrong, re-running
      DROP+ALTER+RECREATE on every call).

      No version assertion exists in `runMigrations` / `applyDimChange`.
      The codebase already pins `ankane/pgvector:v0.5.1` in tests, but
      production consumers may run different versions.
    evidence: |
      src/local/index.ts:849-857:
        const probe = await pool.query<{ atttypmod: number }>(
          `SELECT a.atttypmod
             FROM pg_attribute a ...`,
        );
        const currentDim = probe.rows[0]?.atttypmod ?? -1;

      JSDoc at line 838-841:
        "pgvector v0.5.1 stores `vector(N)` dimension in `atttypmod`
         directly (NO +4 varlena offset — empirically verified against the
         ankane/pgvector:v0.5.1 container in RED test phase ..."

      No pgvector version probe / no fallback for encoding change.
    recommended_action: |
      Add a one-time defensive probe at the top of `applyDimChange` that
      queries pgvector's installed version (e.g.,
      `SELECT extversion FROM pg_extension WHERE extname = 'vector'`) and
      logs it. Optionally, gate the atttypmod-equals-N assumption on
      version `0.5.x` and fall back to a `format_type()`-based probe
      (`SELECT format_type(atttypid, atttypmod)` which returns the
      literal `vector(N)` and can be parsed) for unknown versions. This
      makes the short-circuit forward-compatible.

      Lower-touch alternative: add a single integration test against the
      pgvector version currently in CI that asserts the actual encoded
      atttypmod value matches expectations. Will catch any encoding shift
      when CI bumps the pgvector tag.

verdict_summary: |
  The pgvector-schema implementation for adapters-openrouter-local-embedder
  honored both critical EC absorptions (EC-3 atomic transaction + EC-4 HNSW
  drop-recreate). The HNSW recreate-with-cosine-ops sequence is correctly
  ordered inside the BEGIN/COMMIT. atttypmod idempotency probe works against
  pgvector v0.5.1 empirically.

  However, three significant gaps remain:

  1. **F-dom-pgvector-1 (CRITICAL)** — undocumented cascade destruction of
     history + consolidation_history + supersession chains when the
     destructive dim change runs. The CHANGELOG + warning log understate
     the blast radius.

  2. **F-dom-pgvector-2 (MAJOR)** — the plan-locked atomic-rollback RED test
