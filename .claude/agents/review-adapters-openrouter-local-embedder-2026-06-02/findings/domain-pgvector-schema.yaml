findings:
  - id: F-dom-pgvector-1
    severity: CRITICAL
    file: src/local/index.ts
    line: 877-907
    plan_ref: |
      plan T0.3 § Tasks #2 + Deep Dive "ALTER COLUMN incompatibility" + ADR D3
      "the helper logs `[runMigrations] WARN: dim change ${old} → ${new}
       truncates existing embeddings + drops/recreates HNSW indexes`"
    domain_anchor: |
      architecture.md § 10 — Build pipeline known gaps (migration discipline).
      CLAUDE.md § Inquebrável Rule 3 (Honestidade Extrema): destructive
      side effects MUST be surfaced explicitly to the operator.
    summary: |
      `applyDimChange` runs `DELETE FROM memories; DELETE FROM entities;` as
      part of the dim-change transaction (lines 886-887). The plan + ADR D3 +
      CHANGELOG only document the loss of EMBEDDING data ("USING NULL clause
      drops all existing data in those columns"). The actual implementation
      destroys ENTIRE ROWS, which triggers:

        (a) `history` table CASCADE delete via
            `history_memory_id_memories_id_fk` (0000_crazy_mimic.sql:42,
            `ON DELETE cascade`) — entire audit trail wiped silently.
        (b) `consolidation_history` SET NULL on `kept_memory_id` via
            `consolidation_history_kept_memory_id_fkey`
            (0007_distillation_columns.sql, `ON DELETE SET NULL`) — every
            v0.7 distillation audit row loses its provenance link.
        (c) `memories.superseded_by` self-FK SET NULL
            (0002_skill_columns.sql:6) — v0.6 Voyager skill supersession
            chains broken.

      Neither the warning log (line 868-870) nor the CHANGELOG entry mention
      these cascading destructions. The operator sees "truncates existing
      embeddings" and reasonably assumes the bi-temporal `t_invalid IS NOT
      NULL` audit history survives — it does NOT. This is a silent-correctness
      gap that violates Inquebrável Rule 3 and the v0.4b-fixes T7.1 soft-delete
      contract (forget preserves rows; dim-change destroys them).
    evidence: |
      src/local/index.ts:886-887
        await client.query('DELETE FROM memories');
        await client.query('DELETE FROM entities');

      Cascade graph (verified via grep across migrations):
        - 0000_crazy_mimic.sql:42  — history.memory_id → memories.id ON DELETE cascade
        - 0002_skill_columns.sql:6 — memories.superseded_by → memories.id ON DELETE set null
        - 0007_distillation_columns.sql:36 — consolidation_history.kept_memory_id → memories.id ON DELETE set null

      Warning log only says (src/local/index.ts:868-870):
        `[themory] runMigrations: dim change ${currentDim} → ${targetDim}
         truncates existing embeddings + drops/recreates HNSW indexes`

      ADR D3 (plan §118-122):
        "ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
         ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
         ... The `USING NULL` clause drops all existing data in those columns
         (pgvector does not support data-preserving dim change)."

      CHANGELOG (line 9): same framing — "truncates existing embeddings".

    recommended_action: |
      Option A (preferred, smallest change): extend the warning log + JSDoc on
      `applyDimChange` + CHANGELOG entry to honestly state the cascade
      consequences. E.g.:
        `[themory] runMigrations: dim change ${old} → ${new} DELETEs all
         memories + entities rows. CASCADE side effects: history rows for
         deleted memories are removed; consolidation_history.kept_memory_id +
         memories.superseded_by NULLed. To preserve audit trail before
         re-embedding, dump tables first.`

      Option B (heavier, future cycle): add a `preserveAuditTrail?: boolean`
      flag that disables the DELETE path and instead uses
      `ALTER COLUMN ... DROP NOT NULL` + `ALTER COLUMN TYPE vector(N)` (which
      will set every embedding to NULL but preserve row identity + audit trail
      + supersession chains). Then optionally re-add NOT NULL once data is
      re-embedded out-of-band.

      Option C (deferred): document loudly + ADD a CHANGELOG `**BREAKING**`
      marker so consumers running the dim-change path know to dump
      `history` + `consolidation_history` before invoking.

