  - id: F-dom-pgvector-4
    severity: MINOR
    file: src/local/index.ts
    line: 941-952
    plan_ref: |
      plan T0.3 § Deep Dives "Drizzle migration order" §415:
        "the helper runs Drizzle `migrate()` FIRST (using its own internal
         transaction); the DROP+ALTER+RECREATE transaction is SEPARATE and
         runs AFTER. The Drizzle journal `drizzle.__drizzle_migrations`
         remains consistent because the post-migration ALTER is invisible to
         Drizzle (no migration file hash registered for it)."
    domain_anchor: |
      architecture.md § 10.2 (drizzle-kit push vs runMigrations conflict) —
      the orphan-schema short-circuit path was shipped 2026-05-25 to handle
      the push-flow gracefully. Parametric dim must layer onto that path
      correctly.
    summary: |
      The orphan-schema short-circuit branch (lines 935-954) now also applies
      the dim change when `embeddingDim` is set (lines 950-952), per the T4.1
      follow-up comment at lines 944-949. This is correct intent — but it
      introduces a subtle deployment hazard.

      Orphan-schema deployments are dev-only by design (see architecture.md
      § 10.2). They typically host iteration data that operators may not
      expect to lose. The dim-change path now runs on push-flow DBs with
      ZERO interaction with the Drizzle journal, meaning subsequent
      `drizzle-kit push` re-introspections will see the new vector(384)
      schema and may try to "correct" it back to vector(1536) (Drizzle
      schema files are still vector(1536)). This race between operator
      tooling and the runtime ALTER is undocumented.

      The plan's Deep Dive §415 only covers the journal-tracked path; the
      orphan-schema interaction with parametric dim is not addressed.
    evidence: |
      src/local/index.ts:935-954:
        if (memoriesExists) {
          console.warn('[themory] schema present but `drizzle.__drizzle_migrations` ...');
          // T4.1 follow-up to T0.3: dim change must STILL apply on push-flow DBs.
          if (options?.embeddingDim !== undefined && options.embeddingDim !== MAX_EMBEDDING_DIM) {
            await applyDimChange(pool, options.embeddingDim);
          }
          return;
        }

      No corresponding warning text alerts the operator that subsequent
      `drizzle-kit push` runs will see vector(384) vs schema's vector(1536)
      and potentially try to drift the column back.

      Schema source of truth (`src/local/schema.ts` — not in this diff but
      load-bearing for the contradiction): declares vector(1536).
    recommended_action: |
      Extend the orphan-schema warning log to also note the dim-change
      hazard, e.g.:
        `[themory] schema present but journal missing — drizzle-kit push
         path. Dim change to vector(${dim}) applied; subsequent
         drizzle-kit push will see drift against schema.ts (vector(1536))
         and may try to revert. For local-openrouter mode, pin
         drizzle-kit push usage AND embeddingDim consistently.`

      OR (sturdier): refuse to apply dim change on orphan-schema path and
      surface a clear "use runMigrations on a fresh DB instead" message.
      Avoid silent dim drift between schema.ts and the live column type.

