        Line 83:  'backward compat: runMigrations(pool) without options ...'
        Line 97:  'parametric: runMigrations(pool, { embeddingDim: 384 }) ...'
        Line 109: 'EC-4: runMigrations parametric recreates HNSW indexes ...'
        Line 125: 'idempotent: 2nd call with same dim short-circuits ...'
        Line 151: 'no-op: runMigrations(pool, { embeddingDim: 1536 }) ...'

      Mention in docstring (line 14-15):
        " *   - EC-3 atomic: simulated failure inside the sequence triggers
          *     ROLLBACK; schema preserved at pre-change state."
      But no corresponding `it()` block implements this assertion.

      Compare against plan-required RED tests at plan §431-444:
        - test_runMigrations_atomic_rollback_on_mid_sequence_failure — MISSING
        - test_runMigrations_logs_warn_on_destructive_dim_change — MISSING
        - test_runMigrations_short_circuit_logs_noop_when_atttypmod_matches — MISSING (the no-op test exists but does NOT assert the log line)

      Acceptance Criteria line 451 (Mid-sequence failure rollback): NOT
