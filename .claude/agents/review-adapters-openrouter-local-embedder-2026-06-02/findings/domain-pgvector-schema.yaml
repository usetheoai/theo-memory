        "embedding" vector(1536) NOT NULL,

      The architecture reviewer also flagged this (their F-arch-2 / similar)
      from the architectural-divergence angle; this finding is the
      pgvector-domain-specific framing: the NOT NULL constraint + the
      data-preservation semantics of `ALTER COLUMN ... USING expression` are
