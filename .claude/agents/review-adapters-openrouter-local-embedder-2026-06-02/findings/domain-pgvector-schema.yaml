          ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;

      The implementation instead:

          DELETE FROM memories;
          DELETE FROM entities;
          ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim});  -- no USING clause
          ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim});

      The inline comment at lines 877-885 honestly explains WHY (the
      `vector(1536) NOT NULL` constraint at migration 0000:11,30 would block
      `USING NULL` with PG error 23502). This is correct engineering — but the
      plan ADR + CHANGELOG were NEVER amended to reflect the empirical
      correction.

      Per `cycle-plan.md` § Hard gates and the v0-4a T0.1 retrospective lesson
      (v1.5 fix #3 in `.claude/rules/cycle-implement.md`): when impl reality
      contradicts the plan, the plan MUST be revised. Today the plan remains
      v1.1 with the wrong SQL recipe. Future cycles consulting this plan as
      reference will think the `USING NULL` approach works.

    evidence: |
      Plan v1.1 (file frozen at b3d0968) §117-119:
        ```sql
        ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ```

      Plan v1.1 §400-401 (Deep Dive):
        "ALTER COLUMN incompatibility: pgvector `vector(N) → vector(M)` with
         N ≠ M does NOT preserve data even with `USING expression`. The
         `USING NULL` clause is the safest explicit data-drop. This is the
         ONLY way to change pgvector column dim short of `DROP COLUMN` +
         `ADD COLUMN`."

      Shipped impl (src/local/index.ts:886-889):
        await client.query('DELETE FROM memories');
        await client.query('DELETE FROM entities');
        await client.query(`ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);
        await client.query(`ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);

