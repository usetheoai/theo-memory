  - id: F-dom-db-4
    severity: MAJOR
    file: src/local/schema.ts
    line: 50
    plan_ref: "architecture.md § 10.2 — drizzle-kit push vs runMigrations() conflict"
    domain_anchor: "Drizzle ORM journal-vs-schema-introspection contract"
    summary: |
      `src/local/schema.ts:50` declares `embedding: vector('embedding', { dimensions: MAX_EMBEDDING_DIM })` (1536, frozen at the Drizzle schema layer). When `runMigrations(pool, { embeddingDim: 384 })` runs, the live DB ends up at `vector(384)` but the Drizzle schema declaration still claims 1536. This creates a known drift that is NOT covered by the existing `drizzle-kit push` orphan-schema detection (architecture.md § 10.2):

      Failure mode 1 — `drizzle-kit push` after the runtime ALTER:
        - The orphan-schema check at index.ts:927-955 only detects "schema present but journal missing"
        - If both the journal AND the runtime ALTER are present, push will compute a diff: 384 (live) ↔ 1536 (schema.ts) and propose a destructive ALTER back to 1536
        - Operator running `npm run db:push` in a dev session against the demo's local-openrouter DB would silently TRIGGER a revert that erases their data again

      Failure mode 2 — `drizzle-kit generate` writes a NEW migration file with `vector(1536)` because that's what schema.ts claims; the generated migration would never be applied to a vector(384) demo DB (or worse, would be applied and silently revert).

      The plan's ADR D3 says: "REJECT — parametric Drizzle migration template substitution — Drizzle migration files are static SQL; templating breaks the migration-journal hash discipline." This rejection is correct but does NOT address the post-ALTER schema-vs-live divergence at the schema.ts type layer.
    evidence: |
      src/local/schema.ts:50:
        embedding: vector('embedding', { dimensions: MAX_EMBEDDING_DIM }).notNull(),

      src/local/schema.ts:174 (entities):
        embedding: vector('embedding', { dimensions: MAX_EMBEDDING_DIM }).notNull(),

      architecture.md § 10.2 mitigation only covers the runMigrations-after-push case, NOT the push-after-runMigrations({embeddingDim:384}) case.

      No grep hit for any test or guard that warns when schema.ts.dimensions !== runtime atttypmod.
    recommended_action: |
      Three options ranked by ROI:

      (a) Lowest-cost: add a paragraph to README + a JSDoc warning on `runMigrations` documenting that after a parametric dim change, `npm run db:push` is no longer safe on that DB. Reference architecture.md § 10.2 inversely.

      (b) Medium-cost: extend the orphan-schema check at lines 919-955 with a 3rd branch: when journal is present AND embeddingDim option is set AND atttypmod (probed via the same pg_attribute query) does NOT match the requested dim, log a `console.warn` BEFORE running migrate() — so the operator sees the drift surfaced.

      (c) Highest-cost (out of scope for this cycle): add a runtime probe at PgvectorStore.initialize() that fetches atttypmod and asserts it matches `this.embeddingDim`. Fail-loud at boot instead of "INSERT silently fails with dim mismatch at first remember()".

      The plan declared the destructive nature of the ALTER as an accepted risk (EC-B), but the push-after-ALTER footgun is a SEPARATE concern not surfaced anywhere in the plan or ADRs. Surface it.

  - id: F-dom-db-5
    severity: MINOR
    file: src/local/index.ts
    line: 950,966
    plan_ref: "plan T0.3 Tasks line 419 — 'if options?.embeddingDim !== undefined && options.embeddingDim !== MAX_EMBEDDING_DIM'"
    domain_anchor: "Inquebrável Rule 3 + idempotency contract"
    summary: |
      The guard `options.embeddingDim !== MAX_EMBEDDING_DIM` short-circuits `applyDimChange()` whenever the requested dim equals 1536, regardless of the live DB's actual dim. Consequence: a DB previously ALTERed to `vector(384)` cannot be reverted to `vector(1536)` via `runMigrations(pool, { embeddingDim: 1536 })` — the call is a no-op.

      This is technically per-plan (the plan task spec at line 419 matches), but the resulting behavior is asymmetric and arguably wrong:
        - 1536 → 384: parametric ALTER runs (correct)
        - 384 → 1536: silently skipped (operator's intent to revert is ignored)
        - 1536 → 1536: silently skipped (idempotent — correct)
        - 384 → 384: applyDimChange called, then short-circuits via atttypmod probe (correct, but redundant guard)

      The atttypmod probe inside applyDimChange (lines 857-865) ALREADY handles idempotency correctly. The outer guard is redundant for the 1536→1536 case AND blocks the legitimate 384→1536 case.
    evidence: |
      src/local/index.ts:950:
        if (options?.embeddingDim !== undefined && options.embeddingDim !== MAX_EMBEDDING_DIM) {
          await applyDimChange(pool, options.embeddingDim);
        }

      src/local/index.ts:966 (same guard, journal-tracked branch):
        if (options?.embeddingDim !== undefined && options.embeddingDim !== MAX_EMBEDDING_DIM) {
          await applyDimChange(pool, options.embeddingDim);
        }

      src/local/index.ts:858 (idempotency already inside applyDimChange):
        if (currentDim === targetDim) {
          // Idempotency: schema already at requested dim, skip DROP+ALTER+RECREATE.
          ...
          return;
        }
    recommended_action: |
      Simplify the guard at both call sites (lines 950 + 966) to:
        if (options?.embeddingDim !== undefined) {
          await applyDimChange(pool, options.embeddingDim);
        }
      `applyDimChange`'s internal atttypmod probe already handles the idempotency short-circuit cleanly. The simplification unlocks the 384→1536 revert path AND removes the redundant outer guard.

      If the plan's intent was "never run applyDimChange when caller passed default-equivalent" for cost reasons (skip the pg_attribute query), the savings are negligible (one indexed SELECT) and not worth the asymmetric semantics. Update the plan ADR D3 to match if this is accepted.

  - id: F-dom-db-6
    severity: MINOR
    file: src/local/index.ts
    line: 890-891
    plan_ref: "plan T0.3 Deep Dives 'BEGIN ... CREATE INDEX ... USING hnsw (embedding vector_cosine_ops); ... COMMIT'"
    domain_anchor: "Postgres identifier-quoting convention — preserve fidelity with Drizzle-generated migration"
    summary: |
      The runtime CREATE INDEX statements use UNQUOTED identifiers:

        CREATE INDEX memories_embedding_hnsw_idx ON memories USING hnsw (embedding vector_cosine_ops)
        CREATE INDEX entities_embedding_hnsw_idx ON entities USING hnsw (embedding vector_cosine_ops)

      The source-of-truth migration `0000_crazy_mimic.sql:44,51` uses QUOTED identifiers:

        CREATE INDEX "memories_embedding_hnsw_idx" ON "memories" USING hnsw ("embedding" vector_cosine_ops);
        CREATE INDEX "entities_embedding_hnsw_idx" ON "entities" USING hnsw ("embedding" vector_cosine_ops);

      Functionally equivalent on PG14+ because Postgres lowercases unquoted identifiers and the quoted ones in the migration are already lowercase. But:

      1. Style drift between migration source-of-truth and runtime recreation.
      2. If a future migration introduces a case-sensitive identifier (e.g., `"memoriesEmbeddingHnswIdx"`), the runtime sequence would silently create the wrong index name.
      3. The plan's Deep Dives SQL snippet at lines 408-409 also uses unquoted form, matching the implementation — but neither matches the actual migration file's quoted convention.
    evidence: |
      0000_crazy_mimic.sql:44:
        CREATE INDEX "entities_embedding_hnsw_idx" ON "entities" USING hnsw ("embedding" vector_cosine_ops);

      0000_crazy_mimic.sql:51:
        CREATE INDEX "memories_embedding_hnsw_idx" ON "memories" USING hnsw ("embedding" vector_cosine_ops);

      src/local/index.ts:890-891 (unquoted):
        await client.query('CREATE INDEX memories_embedding_hnsw_idx ON memories USING hnsw (embedding vector_cosine_ops)');
        await client.query('CREATE INDEX entities_embedding_hnsw_idx ON entities USING hnsw (embedding vector_cosine_ops)');
    recommended_action: |
      Adopt the same quoting convention as the migration source-of-truth. Add quotes to the runtime statements:
        await client.query('CREATE INDEX "memories_embedding_hnsw_idx" ON "memories" USING hnsw ("embedding" vector_cosine_ops)');
        await client.query('CREATE INDEX "entities_embedding_hnsw_idx" ON "entities" USING hnsw ("embedding" vector_cosine_ops)');
      And matching DROP INDEX (lines 875-876) for symmetry.
      Single-commit doc-style fix; defensive vs future migrations using case-sensitive identifiers.

  - id: F-dom-db-7
    severity: MAJOR
    file: src/local/index.ts
    line: 944-953
    plan_ref: "architecture.md § 10.2 — drizzle-kit push orphan-schema mitigation"
    domain_anchor: "Drizzle ORM journal contract + dev/prod path consistency"
    summary: |
      The T4.1 follow-up fix at lines 944-953 places `applyDimChange` INSIDE the orphan-schema branch (push-flow DB). The inline comment correctly justifies this for the operator's explicit-intent case ("When the operator explicitly passes embeddingDim, intent is clear"). However, this creates a subtle invariant inversion that the plan's ADR D3 + architecture.md § 10.2 did NOT anticipate:

      The orphan-schema branch was originally documented (per architecture.md § 10.2) as "Production deployments use `runMigrations()` against a fresh DB. Never mix the two." The T4.1 fix now makes the orphan-schema branch a SUPPORTED runtime-ALTER path, but does NOT update architecture.md § 10.2 to reflect the new policy. The comment at line 936-942 still warns "this is a deployment-config smell" — but with the dim-change carved out, the smell is now context-dependent.

      The inconsistency means:
        (a) On a push-flow DB, runMigrations(pool) → console.warn + skip migrate (orphan-schema warning fires)
        (b) On a push-flow DB, runMigrations(pool, { embeddingDim: 384 }) → console.warn + applyDimChange + return (orphan-schema warning STILL fires, but the dim change DOES happen)
      The warning text at lines 939-942 advertises that runMigrations is being skipped, but it's now a partial no-op: the dim change WAS applied. The warning is misleading.
    evidence: |
      src/local/index.ts:935-953:
        if (memoriesExists) {
          console.warn(
            '[themory] schema present but `drizzle.__drizzle_migrations` journal missing. ' +
              'Likely `drizzle-kit push` was used — skipping runMigrations(). ' +  // <-- claim
              'For production reproducibility, prefer `runMigrations()` on a fresh DB (F-T7.1-2).',
          );
          // T4.1 follow-up to T0.3: dim change must STILL apply on push-flow DBs.
          ...
          if (options?.embeddingDim !== undefined && options.embeddingDim !== MAX_EMBEDDING_DIM) {
            await applyDimChange(pool, options.embeddingDim);  // <-- but this DOES run
          }
          return;
        }

      architecture.md § 10.2 (rule still says):
        Production deployments use `runMigrations()` against a fresh DB. Never mix the two.
        Dev/CI may use `npm run db:push` for fast iteration.
    recommended_action: |
      Two-step fix:
      (1) Update the orphan-schema warning to reflect the partial action when embeddingDim is set:
          'Likely `drizzle-kit push` was used — skipping runMigrations() body.' +
          (options?.embeddingDim !== undefined && options.embeddingDim !== MAX_EMBEDDING_DIM
            ? ' Applying parametric embeddingDim ALTER only (explicit-intent override).'
            : ' Schema unchanged.') +
          ' For production reproducibility, prefer `runMigrations()` on a fresh DB (F-T7.1-2).'

      (2) Update architecture.md § 10.2 to add a sentence: "Exception: when `runMigrations(pool, { embeddingDim: N })` is called against an orphan-schema DB, the parametric dim-change branch runs even though `migrate()` is skipped (explicit-intent override per ADR D3 T4.1 follow-up)."

      Both fixes together restore honest signaling: the operator can audit what the runtime did and the architecture rule book stays the source of truth.

