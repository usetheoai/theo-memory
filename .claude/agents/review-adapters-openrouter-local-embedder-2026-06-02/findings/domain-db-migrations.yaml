    plan_ref: "plan § T0.3 TDD lines 437-438 — test_runMigrations_atomic_rollback_on_mid_sequence_failure() — EC-3"
    domain_anchor: "deps-audit-golden-rule.md style: every EC absorbed in plan v1.1 MUST have a regression test before merge"
    summary: |
      Plan T0.3 TDD section explicitly enumerated `test_runMigrations_atomic_rollback_on_mid_sequence_failure() — EC-3: simulated ALTER failure leaves schema at original 1536-dim + indexes intact` as a mandatory RED test. The integration test file at `tests/integration/migrations/dim-change.test.ts` does NOT contain this test. The file's own docstring at lines 14-15 advertises coverage of `EC-3 atomic: simulated failure inside the sequence triggers ROLLBACK; schema preserved at pre-change state` — that promise is unfulfilled.

      The atomic-transaction discipline is the entire reason EC-3 was an absorbed MUST FIX. Without a regression test that injects a mid-sequence failure (e.g., `client.query` mocked to throw on the CREATE INDEX step, or stub pool that fails the 2nd ALTER), a future refactor that breaks the BEGIN/COMMIT/ROLLBACK envelope would ship silently.
    evidence: |
      Plan T0.3 (line 437-438):
        RED: test_runMigrations_atomic_rollback_on_mid_sequence_failure() — EC-3: simulated ALTER failure leaves schema at original 1536-dim + indexes intact

      dim-change.test.ts has 5 `it(...)` cases:
        1. backward compat: runMigrations(pool) without options produces vector(1536)
        2. parametric: runMigrations(pool, { embeddingDim: 384 }) alters both columns
        3. EC-4: HNSW indexes recreated after ALTER
        4. idempotent: 2nd call same dim short-circuits
        5. no-op: embeddingDim: 1536 (matches default) does not run ALTER

      None inject mid-sequence failure to exercise the ROLLBACK branch (lines 897-903 of src/local/index.ts).
    recommended_action: |
      Add a 6th integration test `it('EC-3 atomic: ROLLBACK on mid-sequence failure preserves vector(1536) + HNSW indexes')` that:
        (a) seeds a vector(1536) DB via runMigrations(pool)
        (b) wraps pool.connect() with a proxy whose `.query` throws on the second CREATE INDEX statement (or use pg_advisory_lock/pg_terminate_backend to inject a forced failure)
        (c) calls runMigrations(pool, { embeddingDim: 384 }) and expects it to reject
        (d) re-probes the schema: memories.embedding atttypmod === 1536, both *_embedding_hnsw_idx still exist with original relfilenode
      The test is required by both the plan's TDD section AND the existing file's docstring promise (lines 14-15).

  - id: F-dom-db-2
    severity: CRITICAL
    file: src/local/index.ts
    line: 877-887
    plan_ref: "plan ADR D3 line 117-120 + Tasks line 423-424 + Deep Dives line 406-407"
    domain_anchor: "Inquebrável Rule 3 (extreme honesty) + Drizzle ADR D3 'documented data loss' contract"
    summary: |
      The implementation deviates from ADR D3's documented SQL contract. ADR D3 (plan line 117-120) declared:

        ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;

      The actual code at lines 886-889 REPLACED `USING NULL` with `DELETE FROM memories; DELETE FROM entities; ALTER ... TYPE vector(${dim})` because `USING NULL` collides with the existing `NOT NULL` constraint on embedding columns (per the inline comment at line 877-885).

      Two domain-honesty issues:

      1. **ADR D3 is now stale.** The plan + ADR explicitly documents the `USING NULL` semantics; the code does something materially different. Future readers checking the contract first will be misled.

      2. **The data loss contract is wider than ADR-B (the accepted-risk row) declared.** ADR-B (plan line 46) states: "All existing memories are lost on dim switch." This is now ALSO true for the `history` table because `history.memory_id` has `ON DELETE CASCADE` (0000_crazy_mimic.sql:42) — `DELETE FROM memories` cascades and wipes the entire history table. The inline comment at line 884 says "DELETE preserves entity FK rows" (referring to `entities`'s lack of FK to memories) but omits the CASCADE on `history.memory_id`. This is a non-trivial additional data loss the operator is not warned about.
    evidence: |
      Plan ADR D3 (lines 117-120):
        ```sql
        ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ```
        The `USING NULL` clause drops all existing data in those columns

      Implementation (src/local/index.ts:886-889):
        await client.query('DELETE FROM memories');
        await client.query('DELETE FROM entities');
        await client.query(`ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);
        await client.query(`ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);

      FK chain proving CASCADE:
        0000_crazy_mimic.sql:42:
        ALTER TABLE "history" ADD CONSTRAINT "history_memory_id_memories_id_fk"
          FOREIGN KEY ("memory_id") REFERENCES "public"."memories"("id")
          ON DELETE cascade ON UPDATE no action;
    recommended_action: |
      Two parallel actions required:

      (1) Update plan ADR D3 + plan v1.1 § T0.3 Deep Dives to reflect the actual SQL (DELETE FROM + ALTER without USING NULL) AND document the T4.1 follow-up rationale (NOT NULL constraint collision). Without this, the plan-vs-code drift exposes the cycle to /review NEEDS_FIXES at plan-vs-code semantic verification.

      (2) Update the runtime warning at line 868-869 to surface the FULL data-loss scope:
        `[themory] runMigrations: dim change ${currentDim} → ${targetDim} TRUNCATES memories + entities + history (CASCADE) + drops/recreates HNSW indexes (T0.3 / EC-3 + EC-4)`

      Optionally also bump CHANGELOG.md to note that runMigrations({ embeddingDim }) deletes history rows by FK cascade.

