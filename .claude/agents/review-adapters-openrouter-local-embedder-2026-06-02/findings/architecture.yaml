  - id: F-arch-7
    severity: MINOR
    file: src/local/index.ts
    line: 706-708
    plan_ref: T0.1 EC-1 absorption + plan §276 "InvalidScope error message"
    summary: `validateEmbeddingDim` throws `InvalidScope` for an embedding-dim violation. `InvalidScope` is semantically about Scope objects (user/session/agent keys), not embedding dimensions. SEPA iter-1 pre-RED CRITICAL #1 (per JSDoc line 700) chose this as "uniform InvalidScope for all pre-flight failures" but it conflates two distinct error domains. The plan's own ADR D1 in §83 hint suggested `InvalidScope` "or a new dedicated error — defer naming to RED test design"; the impl picked `InvalidScope` without revising the plan to commit to that name.
    evidence: |
      src/local/index.ts:702-712:
        function validateEmbeddingDim(received: number | undefined): number {
          if (received === undefined) {
            return MAX_EMBEDDING_DIM;
          }
          if (!Number.isInteger(received) || received <= 0 || received > MAX_EMBEDDING_DIM) {
            throw new InvalidScope(
              `embeddingDim must be a positive integer ≤ ${String(MAX_EMBEDDING_DIM)}; got ${String(received)}`,
            );
          }
          return received;
        }
      `InvalidScope` is defined in `src/core/errors.ts` — used 7+ places in the
      SDK for malformed scope arguments. Using it for embedding-dim validation
      means a caller catching `InvalidScope` to recover from "bad userId"
      would also catch "bad embeddingDim", and vice versa. Cleaner: add a
      new `InvalidEmbeddingDim` error class (sibling to `EmbeddingMismatch`)
      OR reuse `EmbeddingMismatch`.
    recommended_action: |
      Either (a) introduce `InvalidEmbeddingDim` error class (cheap;
      ~10 LoC in errors.ts) — most semantically correct; OR (b) reuse
      `EmbeddingMismatch` with a constructor variant carrying the
      "preflight" intent. Option (a) preferred per architecture.md § 8
      "Domain errors are typed classes". Update plan ADR D1 + add to
      CHANGELOG once decided.
