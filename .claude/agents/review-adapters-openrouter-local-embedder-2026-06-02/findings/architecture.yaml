findings:
  - id: F-arch-1
    severity: MAJOR
    file: src/local/pgvector-store.ts
    line: 146-149
    plan_ref: T0.2 (ADR D2 / Sub-goal 2) + plan §178 "REJECT changing MAX_EMBEDDING_DIM"
    summary: PgvectorStore constructor signature changed in a SOURCE-BREAKING way (positional `tracer?: Tracer` 2nd arg → options object `{ embeddingDim?, tracer? }`); JSDoc claims "backward-compat preserved" but compat applies only to consumers using `new PgvectorStore(pool)` with NO 2nd arg.
    evidence: |
      Before:
        constructor(private readonly pool: Pool, private readonly tracer?: Tracer)
      After (b3d0968..ad1432f / iter-2):
        constructor(
          private readonly pool: Pool,
          options?: { readonly embeddingDim?: number; readonly tracer?: Tracer },
        )
      Any external consumer (post-1.0 release this lib is positioned to ship)
      passing the tracer positionally — `new PgvectorStore(pool, tracerInstance)` —
      breaks silently at runtime: `tracerInstance` is now interpreted as an
      options object, `options?.embeddingDim` is undefined (OK), but
      `options?.tracer` is also undefined (the WHOLE tracer becomes invisible).
      The internal sweep ("ZERO callers use the positional-tracer form anywhere
      in the SDK + tests + examples") only covers the in-tree audit; this is a
      PUBLIC API surface (`PgvectorStore` is re-exported via `src/local/index.ts`
      barrel at line 80). At minimum the plan should have flagged this as a
      `BREAKING` CHANGELOG entry (it does not — only the `forget()` BREAKING
      from v0.4b-fixes is mentioned). The Inquebrável Rule 6 changelog discipline
      requires this be surfaced under `Changed/BREAKING`.
    recommended_action: |
      Either (a) add a `BREAKING` entry under CHANGELOG `[Unreleased]` §
      Changed naming the signature change AND document the migration recipe
      (`new PgvectorStore(pool, tracer)` → `new PgvectorStore(pool, { tracer })`);
      OR (b) accept BOTH shapes via runtime discrimination
      (`if (options is Tracer-like) → treat as tracer; else → options object`).
      Option (a) is honest given pre-release status (CLAUDE.md § "Pre-release is
      honest"); option (b) is non-Inquebrável (silent magic) but preserves source-
      level compat. Pick (a).
  - id: F-arch-2
    severity: MAJOR
    file: src/local/index.ts
    line: 886-887
    plan_ref: T0.3 Deep Dive "ALTER COLUMN incompatibility" §400 + plan §117-119 (ALTER ... USING NULL)
    summary: Implementation silently diverged from the plan-locked ALTER strategy. Plan ADR D3 specifies `ALTER COLUMN ... TYPE vector(N) USING NULL` (line 117-122 of plan); the shipped code at `applyDimChange` instead runs `DELETE FROM memories; DELETE FROM entities;` BEFORE the ALTER (without `USING NULL`). This is a plan-vs-impl divergence that was NOT reflected back into the plan ADR.
    evidence: |
      Plan ADR D3 lines 117-122:
        ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
        ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${dim}) USING NULL;
      Plan deep-dive line 400:
        "the `USING NULL` clause drops all existing data in those columns
         (pgvector does not support data-preserving dim change). This is the
         ONLY way to change pgvector column dim short of `DROP COLUMN` + `ADD COLUMN`."
      Shipped impl src/local/index.ts:886-889:
        await client.query('DELETE FROM memories');
        await client.query('DELETE FROM entities');
        await client.query(`ALTER TABLE memories ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);
        await client.query(`ALTER TABLE entities ALTER COLUMN embedding TYPE vector(${String(targetDim)})`);
      Inline JSDoc lines 877-885 explain the divergence (NOT NULL constraint
      collision when USING NULL coerces existing rows) — but the PLAN was
      never updated. Stop Condition #4 of cycle-implement.md says "Plan task
      assumes behavior contradicted by reality → halt; loop back to cycle-plan."
      Instead the implementation silently substituted the recipe and the
      plan ADR is now stale.
    recommended_action: |
      Update plan ADR D3 in the same PR that closes this finding: replace the
      `USING NULL` recipe with the `DELETE; ALTER` recipe + reference the
      empirically-discovered NOT NULL constraint collision (the JSDoc text
      at src/local/index.ts:877-885 is the substitute rationale and should
      be lifted into the plan). Plan-vs-impl drift is a documented anti-pattern
      from `/implement` Anti-pattern #3 ("NEVER edit the implementation plan
      during /implement-execute — if the plan is wrong, halt and loop back").
  - id: F-arch-3
    severity: MAJOR
    file: tests/integration/migrations/dim-change.test.ts
    line: 18-19, 30-34
    plan_ref: T0.3 SEPA iter-3 pre-RED C2 ("atttypmod empirical correction") + plan T0.3 §413
    summary: Test docstring contains contradictory statements about atttypmod encoding. The block comment at line 18-19 says `atttypmod = N + 4` (the "varlena header encoding") while the helper docstring at 30-34 says `atttypmod` stores `N` directly (no +4 offset). Both claims appear in the same file with no resolution; one must be wrong.
    evidence: |
      tests/integration/migrations/dim-change.test.ts:18-19:
        *   - Idempotency: 2nd call with same dim short-circuits via atttypmod
        *     probe (atttypmod = N + 4 per pgvector's varlena header encoding).
      Same file lines 30-34:
        // pgvector v0.5.1 stores `vector(N)` dimension in pg_attribute.atttypmod
        // directly (NO +4 varlena offset — empirically verified against the
        // running ankane/pgvector:v0.5.1 container: vector(1536) → atttypmod=1536).
        // The SEPA pre-RED CRITICAL #2 claim of `N + 4` encoding was wrong for
        // this version; the actual decoder is the identity function.
      The shipped src/local/index.ts applyDimChange uses the identity decoding
      (line 857: `const currentDim = probe.rows[0]?.atttypmod ?? -1;` — direct
      comparison with `targetDim` without -4 adjustment). So lines 30-34 are
      correct AND lines 18-19 are stale (left over from the SEPA pre-RED
      hypothesis that was empirically refuted in the same iteration). This
      is the kind of contradiction-in-the-same-file defect that produces
      future bugs when someone refactors based on the stale claim.
    recommended_action: |
      Delete lines 18-19 from the top-of-file block comment; the helper
      docstring at 30-34 is the source of truth. Single edit.
  - id: F-arch-4
    severity: MINOR
    file: src/embedders/local.ts
    line: 53
    plan_ref: T1.1 Deep Dive "Model parameter (deferred to default)" §490
    summary: Model identifier hard-coded as a module-level constant; future cycles cannot supply alternative models without modifying this source file. The plan ADR D1 declares the `Xenova/all-MiniLM-L6-v2` choice as v1.0 default with "future cycle can add `new LocalTransformerEmbedder({ model: '...' })`" — but the current implementation has zero extension surface for that future cycle. OCP nuance: not a present violation because YAGNI applies (no consumer asked for a 2nd model), but the constructor signature is empty (`new LocalTransformerEmbedder()`) so adding the option later requires a SOURCE-BREAKING signature change unless an options object is introduced.
    evidence: |
      src/embedders/local.ts:53:
        const MODEL_ID = 'Xenova/all-MiniLM-L6-v2';
      src/embedders/local.ts:67:
        export class LocalTransformerEmbedder implements Embedder {
          async embed(text: string): Promise<readonly number[]> { ... }
          async embedBatch(...): Promise<readonly (readonly number[])[]> { ... }
        }
      No constructor declared → effectively `constructor()` with empty
      signature. Adding `constructor({ model?: string } = {})` later is
      additive at the call-site BUT changes the OUTPUT dim (different models
      have different dims — MiniLM is 384, mpnet is 768). The probe in
      src/local/index.ts already accommodates this via `embeddingDim` config,
      but ergonomically the consumer would have to set both the embedder
      model AND the LocalMemoryConfig.embeddingDim in sync — easy to misalign.
    recommended_action: |
      Either accept the current shape (YAGNI; document the deferral in
      JSDoc — currently lines 48-66 don't mention "constructor is intentionally
      0-arity for v1.0") OR add `constructor(options?: { model?: string; dim?: number } = {})`
      now with model defaulting to MODEL_ID. The first is more INQUEBRÁVEL
      (YAGNI > speculative API surface); just clarify it in JSDoc so the
      next maintainer doesn't think it was an oversight.
  - id: F-arch-5
    severity: MINOR
    file: src/embedders/local.ts
    line: 80-89
    plan_ref: T1.1 Deep Dive "Batch" §493 + Embedder DIP shape
    summary: The batch implementation builds `rows` as `number[][]` then returns it as `readonly (readonly number[])[]`. The cast is implicit at return; the inner rows are NOT readonly at constructor time. This is a Clean Code nit, not a defect, but the DIP signature MUTABLE-arrays-cast-to-readonly-on-return pattern is used inconsistently across the SDK (some implementations use `Object.freeze`, others use this implicit cast).
    evidence: |
      src/embedders/local.ts:84-90:
        const flat = output.data as Float32Array;
        const rows: number[][] = [];
        for (let i = 0; i < texts.length; i += 1) {
          const start = i * EMBEDDING_DIM;
          const end = start + EMBEDDING_DIM;
          rows.push(Array.from(flat.slice(start, end)));
        }
        return rows;
      The returned type at the function signature is
      `Promise<readonly (readonly number[])[]>` but a consumer who narrowed via
      `as number[][]` could mutate the inner arrays. Not a current bug (no
      consumer does this) but breaks the "deep readonly" intent of the DIP.
    recommended_action: |
      Lowest-cost fix: change `const rows: number[][] = []` to
      `const rows: readonly (readonly number[])[] = []` after construction
      (or just keep a mutable local and cast at return — what the code does
      now). YAGNI applies; this is INFO-adjacent. Document in DIP that "the
      returned arrays are treated as readonly by the consumer; the SDK does
      not deep-freeze for performance".
