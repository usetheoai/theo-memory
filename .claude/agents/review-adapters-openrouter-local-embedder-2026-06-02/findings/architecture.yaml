    plan_ref: T0.1 EC-1 absorption + plan §276 (Number.isInteger guard)
    summary: No issues found in the guard's logic — `Number.isInteger(received) || received <= 0 || received > MAX_EMBEDDING_DIM` correctly catches NaN (NaN <= 0 is false, NaN > MAX is false; Number.isInteger(NaN) is false), Infinity (Number.isInteger(Infinity) is false), float (Number.isInteger(384.5) is false), zero and negative (received <= 0), and > MAX. Error message includes literal received value via `String(received)`.
