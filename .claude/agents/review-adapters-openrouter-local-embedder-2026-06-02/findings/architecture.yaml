  - id: F-arch-12
    severity: INFO
    file: src/local/index.ts
    line: 847-907 (applyDimChange)
    plan_ref: T0.3 (EC-3 atomic tx + EC-4 HNSW DROP+RECREATE)
    summary: No SOLID issues found in `applyDimChange` — single-purpose function (SRP), wraps the 6-statement sequence in BEGIN/COMMIT/ROLLBACK (EC-3), drops/recreates HNSW indexes correctly (EC-4), idempotency short-circuit via atttypmod probe runs BEFORE the destructive sequence. The plan-vs-impl divergence on `USING NULL` is captured in F-arch-2; the transactional and index-handling shape is otherwise textbook.
    evidence: |
      applyDimChange at line 847-907 follows the canonical Postgres tx pattern:
        const client = await pool.connect();
        try {
          await client.query('BEGIN');
          ... 6 DDL statements ...
          await client.query('COMMIT');
        } catch (err) {
          await client.query('ROLLBACK');
          throw err;
        } finally {
          client.release();
        }
    recommended_action: None.
