triad_summary: |
  Net wiring verdict: HEALTHY-WITH-CAVEATS.

  - Pillar (a) static caller: all 5 new public surfaces have ≥1 real production caller.
    LocalTransformerEmbedder has exactly 1 real source caller (examples/chat-with-memory/lib/memory.ts:259);
    the check_wiring.py count of 5 is inflated by Next.js .next/server compiled artifacts
    which are not real callers. The single real caller is functionally necessary inside
    `resolveAdapters('local-openrouter')` switch case — not dead branch, not no-op.

  - Pillar (b) integration test: 6 of 7 new symbols genuinely exercised in tests/integration/
    OR src/__tests__/ + unit tests. The 1 caveat (BackendMode type) is n/a (compile-time).
    Real depth concern: the Goal-metric verbatim assertion (adapterSource=local-openrouter,
    embedderDim=384) only fires in CI when a live dev server is running on :3000 with
    THEOMEM_PG_URI set — see F-wire-4.

  - Pillar (c) runtime metric: plan declares only T2.2's `/api/info` JSON shape verbatim
    match (no Counter-style metric). Asserted in 1 integration test, skipIf'd when
    server unreachable — same caveat as pillar (b) above.

  - Boundary respect (DIP): clean. src/embedders/local.ts imports only @xenova/transformers
    (external) and ../core/dip/embedder.js (correct DIP). No cross-tier violations
    (src/core ⊆ src/local|theokit|agent-tools|embedders — boundary-check hook would have
    caught it).

  - Reachability: full path from HTTP request → Next.js handler → getSingleton() →
    resolveAdapters() → new LocalTransformerEmbedder() exists and is exercised when the
    integration test runs against a live dev server.

  - Concurrent safety: F-wire-1 (lazy Promise rejection cache) + F-wire-5 (no advisory
    lock on applyDimChange) are documented trade-offs for the demo's single-process
    lifecycle. Acceptable for v0.0 scope.

