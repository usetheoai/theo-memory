findings:
  - id: F-wire-1
    severity: MAJOR
    file: src/embedders/local.ts
    line: 59-65
    plan_ref: T1.1 + ADR D1 + SEPA iter-4 pre-RED (lazy Promise singleton)
    summary: Lazy Promise singleton `_pipelinePromise` permanently caches a REJECTED promise after first-load failure (no recovery until process restart)
    evidence: |
      Pattern at src/embedders/local.ts:59-65:
        let _pipelinePromise: Promise<FeatureExtractionPipeline> | null = null;
        function getPipeline() {
          if (_pipelinePromise === null) {
            _pipelinePromise = pipeline('feature-extraction', MODEL_ID);  // ← network call, can reject
          }
          return _pipelinePromise;
        }
      If `pipeline()` rejects (network failure on first model download), `_pipelinePromise` is set to the REJECTED promise. Every subsequent caller receives the same rejection. No retry. Process must restart to recover.

      The JSDoc justification at lines 21-26 cites `src/embedders/openai.ts:42-47` as precedent, but that precedent uses a SYNC `new OpenAI(...)` constructor which CANNOT reject. The local pattern is qualitatively different — `pipeline()` returns a Promise that may reject due to network/CDN failure.

      Documented as "race-safe per JS single-thread invariant" but NOT documented as "failure-recoverable". For the demo's lifecycle (long-running `npm run dev`) a transient network blip at first invocation poisons the singleton until restart.
    recommended_action: |
      Two paths:
      (a) Acceptable for v0.0 demo scope: add a JSDoc note that the lazy singleton does NOT retry on first-load failure, citing the trade-off (correctness vs DX).
      (b) Recoverable variant: catch rejection inside getPipeline() and reset `_pipelinePromise = null` so the next caller re-attempts. Add a contract test that simulates first-load rejection followed by retry success.

      Not BLOCKER because the failure mode is bounded to first-warmup (subsequent calls work fine after model is cached at ~/.cache/transformers-js/). The current demo path runs once per dev server lifetime.

  - id: F-wire-2
    severity: MAJOR
    file: tests/integration/migrations/dim-change.test.ts
    line: 83-172
    plan_ref: T0.3 § destructive-dim-change contract (src/local/index.ts:881-887)
    summary: Integration test never exercises the destructive DELETE FROM memories/entities path inside applyDimChange because tables are always freshly created and empty when runMigrations is invoked
    evidence: |
      The plan's T0.3 contract states (src/local/index.ts:880-886):
        "the destructive-dim-change contract documents that existing embedding data
        is lost on dim switch — DELETEing the rows first is the explicit form of
        that contract and avoids the constraint violation."
      The implementation at src/local/index.ts:886-887 runs:
        await client.query('DELETE FROM memories');
        await client.query('DELETE FROM entities');

      Yet the integration test at tests/integration/migrations/dim-change.test.ts:64-80 calls
      `DROP DATABASE IF EXISTS` + `CREATE DATABASE` in beforeEach — every test runs against
      an empty fresh DB. The DELETE FROM statements execute against empty tables and have
      no observable effect.

      No test seeds rows into memories/entities BEFORE calling runMigrations({ embeddingDim: 384 }),
      so the destructive behavior the contract documents is unverified in the wiring triad.

      Compare to the BLOCKER-grade documented contract on line 132 of the plan:
        "Demo callers that switch from `THEOMEM_DEMO_BACKEND=openai` to `local-openrouter`
        must accept that existing 1536-dim memories vanish. README documents this."
      The user-facing destruction is documented but not test-witnessed.
    recommended_action: |
      Add a test case to tests/integration/migrations/dim-change.test.ts:
        it('destructive: seeded 1536-dim rows are deleted when dim changes to 384 (contract witness)', async () => {
          // 1. runMigrations(pool) → fresh 1536-dim schema
          // 2. INSERT 5 rows into memories with 1536-dim embeddings
          // 3. SELECT count(*) → expect 5
          // 4. runMigrations(pool, { embeddingDim: 384 })
          // 5. SELECT count(*) → expect 0 (destructive contract witnessed)
          // 6. INSERT a 384-dim row → succeeds (schema migrated)
        });
      Without this test, a future refactor that silently breaks the DELETE (e.g., transaction
      ordering change) ships unobserved until a demo user loses their data.

