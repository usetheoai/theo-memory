  - id: F-wire-5
    severity: MINOR
    file: src/local/index.ts
    line: 847-907
    plan_ref: T0.3 § Concurrent safety
    summary: applyDimChange BEGIN/COMMIT does NOT acquire an advisory lock — concurrent runMigrations({ embeddingDim }) from two processes/pods would race on CREATE INDEX (second loses)
    evidence: |
      Pattern at src/local/index.ts:872-906 uses transaction:
        const client = await pool.connect();
        try {
          await client.query('BEGIN');
          await client.query('DROP INDEX IF EXISTS memories_embedding_hnsw_idx');
          ...
          await client.query('CREATE INDEX memories_embedding_hnsw_idx ON memories ...');
          await client.query('COMMIT');
        }

      No `SELECT pg_advisory_xact_lock(<key>)` precedes the BEGIN sequence. The existing
      eviction pipeline (src/local/eviction/pg-evictor.ts and PgHalfLifePersister) acquires
      advisory locks for similar concurrent-safety scenarios per the v0.4b plan; the new
      applyDimChange path does not follow this precedent.

      Race window:
        - Process A: probe currentDim=1536, BEGIN, DROP INDEX, ALTER, CREATE INDEX, COMMIT
        - Process B: probe currentDim=1536 (cached read before A's COMMIT), BEGIN, DROP INDEX
          (succeeds because IF EXISTS), ALTER (no-op because A already changed type), CREATE
          INDEX (DUPLICATE — fails with "relation already exists" since A's CREATE landed)

      In single-process startup-once semantics (the demo's actual usage), this race is
      unreachable — only one Next.js process boots. In multi-pod production, it could fire.
    recommended_action: |
      Acceptable for v0.0 demo scope. Document the single-process assumption in the JSDoc
      of runMigrations + applyDimChange. If multi-pod support is added later, wrap the
      BEGIN sequence with:
        await client.query('SELECT pg_advisory_xact_lock(hashtext($1))', ['themory_dim_change']);
      following the precedent in src/local/eviction/pg-evictor.ts.

      Not raising as MAJOR because the demo lifecycle is single-process and the plan's
      target consumer is the chat-with-memory demo, not a clustered deployment.

  - id: F-wire-6
    severity: MINOR
    file: src/embedders/index.ts
    line: 18-20
    plan_ref: ADR D7 (src/index.ts root barrel does NOT re-export per ADR; @usetheo/memory/embedders is the embedders barrel)
    summary: The src/embedders/index.ts barrel re-exports DeterministicStubEmbedder + OpenAIEmbedder + LocalTransformerEmbedder; the test asserts "default barrel does NOT auto-export" specifically against `@usetheo/memory` root (src/index.ts), but operator confusion is plausible
    evidence: |
      src/embedders/index.ts:18-20:
        export { DeterministicStubEmbedder } from './stub.js';
        export { OpenAIEmbedder } from './openai.js';
        export { LocalTransformerEmbedder } from './local.js';

      tests/integration/public-paths.test.ts:154-160 asserts the negative correctly:
        test('default barrel does NOT auto-export LocalTransformerEmbedder (subpath-only per ADR D7)', async () => {
          const mod = await import('@usetheo/memory');   // ← root, not /embedders
          expect(Object.keys(mod)).not.toContain('LocalTransformerEmbedder');
        });

      ADR D7's "REJECT — single barrel under ./embedders that exports all 3" is technically
      violated by the existing src/embedders/index.ts shape — but the package.json `./embedders`
      subpath export DOES point at this barrel, and the prior cycle (adapters-stub + adapters-openai)
      already included this 3-way re-export. So this is pre-existing pattern, not introduced
      by this plan. No test asserts the negative case against `@usetheo/memory/embedders`
      (i.e., "the /embedders subpath should NOT include local"). If the team's intent is
      "subpath-only, no umbrella barrel" then src/embedders/index.ts itself violates that intent.

      Net: ADR D7 § Alternatives § REJECT #2 reads "would lose the per-provider isolation" —
      but the implementation already exposes a 3-way umbrella. Future consumers who
      `import { LocalTransformerEmbedder } from '@usetheo/memory/embedders'` (instead of
      `/embedders/local`) will pull all 3 adapters into the bundle, defeating the
      tree-shake argument in ADR D7.
    recommended_action: |
      Decide and document explicitly:
        (a) The 3-way umbrella barrel at @usetheo/memory/embedders is intentional, and
            ADR D7's REJECT #2 only applies to the root package barrel. Update ADR D7
            wording to clarify.
        (b) The 3-way umbrella is unintentional drift; remove LocalTransformerEmbedder
            (and ideally OpenAIEmbedder) from src/embedders/index.ts to enforce subpath-only.
      Either path is shippable; the current state is ambiguous re ADR D7's stated intent.

