findings:
  - id: F-tests-1
    severity: MAJOR
    file: tests/integration/migrations/dim-change.test.ts
    line: 58-172
    plan_ref: "Plan § T0.3 TDD section line 438 — test_runMigrations_atomic_rollback_on_mid_sequence_failure() + edge-cases EC-3"
    summary: EC-3 atomic ROLLBACK on mid-sequence failure is unverified
    evidence: |
      Plan T0.3 explicitly enumerates `test_runMigrations_atomic_rollback_on_mid_sequence_failure() — EC-3: simulated ALTER failure leaves schema at original 1536-dim + indexes intact` as a RED test (line 438). The shipped dim-change.test.ts header (lines 14-15) declares EC-3 in-scope but contains NO test case for the failure path:
      grep -nE "rollback|simulated.*failure|inject.*failure" tests/integration/migrations/dim-change.test.ts → only 2 matches, both in the docstring.
      The 5 shipped tests (lines 83, 97, 109, 125, 151) all exercise happy paths.
      Failure-induced ROLLBACK preserving the pre-change schema is the EC-3 absorption checkpoint; its missing test is the riskiest gap because mid-sequence failure (e.g., HNSW CREATE INDEX OOM, statement_timeout mid-ALTER) is the entire reason the BEGIN/COMMIT wrapper exists.
    recommended_action: |
      Add a test that injects failure mid-sequence via either:
      (a) A short PG `statement_timeout` set on the connection that fires
          during the second `ALTER COLUMN TYPE` call, OR
      (b) A monkeypatched pool.connect() returning a client whose query()
          throws synthetically on the 4th statement.
      Assertions: pre-call atttypmod(memories) === 1536 + pre-call
      indexExists(memories_embedding_hnsw_idx) === true; post-call (after
      caught exception) atttypmod(memories) === 1536 + indexExists === true
      → schema preserved.

  - id: F-tests-2
    severity: MAJOR
    file: tests/integration/examples/chat-with-memory-local-openrouter.test.ts
    line: 122-161
    plan_ref: "Plan § T4.1 Acceptance Criteria line 918 + plan TDD #4 line 873"
    summary: T4.1 distill test does NOT verify consolidation_history row creation
    evidence: |
      Plan T4.1 Acceptance Criteria line 918 mandates "/api/memory/distill policy=`last-write-wins` creates a `consolidation_history` row with policy_name='last-write-wins'". The shipped test (lines 122-161) sends the POST and asserts:
      - line 158: expect(res.status).toBe(200)
      - line 160: expect(typeof json.invocationId).toBe('string')
      It does NOT issue a SELECT against `consolidation_history` to prove a row landed. The integration test could pass even if the distill endpoint returned 200 + an invocationId WITHOUT persisting any row (regression scenario: handler short-circuits after invocationId allocation).
    recommended_action: |
      After the POST succeeds, add:
      const row = await pool.query<{ policy_name: string }>(
        `SELECT policy_name FROM consolidation_history WHERE invocation_id = $1`,
        [json.invocationId],
      );
      expect(row.rows[0]?.policy_name).toBe('last-write-wins');

  - id: F-tests-3
    severity: MAJOR
    file: tests/integration/examples/chat-with-memory-local-openrouter.test.ts
    line: 97-110
    plan_ref: "Plan § T4.1 TDD list line 872 — test_api_chat_seeds_memory_with_384_dim_embedding"
    summary: T4.1 plan listed a /api/chat seeding test; shipped test asserts only schema atttypmod
    evidence: |
      Plan T4.1 TDD section line 872 enumerates `test_api_chat_seeds_memory_with_384_dim_embedding` as a RED test. The shipped test "memories.embedding column is vector(384)" (line 97) asserts the schema TYPE via atttypmod, which is a structural proxy: it proves the migration ran, not that POST /api/chat actually inserts a 384-dim row through the full request pipeline.
      The full end-to-end signal (chat completion → LLM extraction → embed → INSERT) is unverified by HTTP-level test.
    recommended_action: |
      Add a test that POSTs to /api/chat with a small prompt, then SELECTs:
      const r = await pool.query<{ vector_dims: number }>(
        `SELECT vector_dims(embedding) AS vector_dims FROM memories WHERE user_id = $1 LIMIT 1`,
        [TEST_USER],
      );
      expect(r.rows[0]?.vector_dims).toBe(384);
      Note: this requires OPENAI_API_KEY (OpenRouter key) at test time; gate
      with a 2nd reachability probe (chat-completion enabled) per EC-12.

  - id: F-tests-4
    severity: MAJOR
    file: src/embedders/__tests__/local.test.ts
    line: N/A (missing)
    plan_ref: "edge-cases-2026-06-01.md § SHOULD TEST EC-5 (empty string)"
    summary: EC-5 empty-string embed behavior is unverified
    evidence: |
      Plan edge-case review marked EC-5 as SHOULD TEST (line 74): assert canonical behavior of `LocalTransformerEmbedder.embed('')` — either zero vector OR throw — but NOT a NaN-poison vector that silently propagates.
      grep "empty\|''" src/embedders/__tests__/local.test.ts → 1 match (embedBatch([]) — different concern).
      Without this test, a regression where Xenova returns a vector containing NaN/Infinity for empty input would persist invalid embeddings into pgvector (silent corruption of recall).
    recommended_action: |
      Add: test('embed("") behavior is well-defined (no NaN-poison)', async () => {
        const emb = new LocalTransformerEmbedder();
        try {
          const v = await emb.embed('');
          // If returned, the vector must be finite (no NaN/Infinity).
          for (const x of v) expect(Number.isFinite(x)).toBe(true);
        } catch (e) {
          // Acceptable: clear error message instead of NaN poison.
          expect(e).toBeInstanceOf(Error);
        }
      });

  - id: F-tests-5
    severity: MAJOR
    file: src/embedders/__tests__/local.test.ts
    line: N/A (missing)
    plan_ref: "edge-cases-2026-06-01.md § SHOULD TEST EC-7 (warmup network failure)"
    summary: EC-7 warmup network failure surfaces clean error — untested
    evidence: |
      Plan edge-case review marked EC-7 as SHOULD TEST (line 79): mock fetch returning 503 from huggingface.co/*, assert embed() rejects with a clear Error containing "huggingface" in the message. Without this test, a CI run on a fresh cache without internet will timeout (~30 minutes) instead of failing loudly within seconds.
      grep "huggingface\|fetch.*mock\|503" src/embedders/__tests__/local.test.ts → 0 matches.
    recommended_action: |
      Add a test using vi.spyOn(globalThis, 'fetch') that returns Response with status 503 for any URL matching /huggingface\.co/. Assert: await embed('test') rejects, error.message matches /huggingface/i.
      Note: this depends on Xenova's transport using fetch (it does in v2.17.x).

  - id: F-tests-6
    severity: MAJOR
    file: tests/unit/examples/chat-with-memory-memory.test.ts
    line: N/A (missing)
    plan_ref: "edge-cases-2026-06-01.md § SHOULD TEST EC-10 (OPENAI_BASE_URL unset warn)"
    summary: EC-10 OPENAI_BASE_URL-unset console.warn in local-openrouter mode — untested
    evidence: |
      Plan edge-case review marked EC-10 as SHOULD TEST (line 84): setting THEOMEM_DEMO_BACKEND=local-openrouter without OPENAI_BASE_URL must emit console.warn warning that chat will route to api.openai.com. Without this test, the silent-misroute regression (user expects OpenRouter, gets OpenAI) is unprotected.
      grep "OPENAI_BASE_URL\|console.warn" tests/unit/examples/chat-with-memory-memory.test.ts → 0 substantive matches.
    recommended_action: |
      Add a test that sets THEOMEM_DEMO_BACKEND=local-openrouter, deletes OPENAI_BASE_URL, vi.spyOn(console, 'warn'), invokes the singleton builder, and asserts the warn mock was called with a string containing /OPENAI_BASE_URL not set/.

  - id: F-tests-7
    severity: MINOR
    file: src/embedders/__tests__/local.test.ts
    line: 67
    plan_ref: "testing.md § Anti-patterns: 'Tests with and in the name'"
    summary: Test name "embedBatch preserves input order and per-row dim is 384" combines two distinct assertions
    evidence: |
      Line 67: test('embedBatch preserves input order and per-row dim is 384', ...) asserts (a) row count, (b) per-row dim, (c) L2 norm per row, (d) order preserved (via .not.toEqual checks). Four behaviors under one test name.
    recommended_action: |
      Split into:
      - test('embedBatch returns one vector per input in input order') — order assertion only.
      - test('embedBatch per-row dim is 384') — dim assertion only.
      - test('embedBatch rows are L2-normalized') — norm assertion (moot if first single-embed test already proves this; could drop).

  - id: F-tests-8
    severity: MINOR
    file: src/embedders/__tests__/local.test.ts
    line: 81
    plan_ref: "testing.md § Anti-patterns: 'Tests with and in the name'"
    summary: Test name "embed and embedBatch agree on identical input" combines two paths under one assertion
    evidence: |
      Line 81: test('embed and embedBatch agree on identical input (batch path produces same output as singleton path)', ...) — defensible as a single convergence behavior, but the "and" trigger is honest.
    recommended_action: |
      Rename to test('batch-of-one matches singleton output for the same text') OR keep — this is a borderline case. Lower priority than F-tests-7.

  - id: F-tests-9
    severity: MINOR
    file: tests/integration/examples/chat-with-memory-local-openrouter.test.ts
    line: 64
    plan_ref: "testing.md § Determinism + cycle-implement soft warn"
    summary: Test-data scope is `TEST_USER` constant string — not unique per run
    evidence: |
      Line 65: const TEST_USER = 't4-1-local-openrouter-user'; beforeEach (line 75-82) deletes memories WHERE user_id = TEST_USER but does NOT delete consolidation_history rows tied to that user — only by policy_name. If two parallel test runs hit the same DB (unlikely but possible in shared dev env), the distill test could see cross-run consolidation_history rows.
    recommended_action: |
      Either:
      (a) Use a per-suite UUID — const TEST_USER = `t4-1-${crypto.randomUUID()}` — to guarantee isolation.
      (b) Document in test header that DB state isolation is per-suite-not-per-run (acceptable given the rest of the suite assumes single-runner dev env).

  - id: F-tests-10
    severity: INFO
    file: tests/integration/examples/chat-with-memory-local-openrouter.test.ts
    line: 59
    plan_ref: "testing.md § Determinism"
    summary: Top-level `await isReachable(DEV_SERVER)` runs at module load
    evidence: |
      Line 59: const reachable = await isReachable(DEV_SERVER); — top-level await in a test file. Works in Vitest's ESM context but means the reachability probe runs at file-load time, not at suite startup. Side effect is small (1.5s timeout) but worth flagging: if Vitest's worker pool loads the test file but the dev server hasn't booted yet, the suite skips for the rest of the worker's lifetime even after the server comes up.
    recommended_action: |
      For higher robustness, move the probe into a beforeAll (inside the describe.skipIf) OR document the load-time semantic. Not blocking — existing pattern (per the EC-2 reference to v0.7) already uses this shape.

  - id: F-tests-11
    severity: INFO
    file: src/embedders/__tests__/local.test.ts
    line: 38, 45, 52, 59, 79, 86
    plan_ref: "testing.md § Pyramid (Unit < 50ms each)"
    summary: Unit-pyramid tests for LocalTransformerEmbedder exceed the 50ms-per-test guideline
    evidence: |
      testing.md § Pyramid line 7 states "Unit ... < 50 ms each". The Xenova-based tests require model load (~10s warm, ~22s cold) so individual test cost is 60-90s. They sit in `src/embedders/__tests__/` which is included by vitest.contract.config.ts — i.e., treated as UNIT tests by the test runner.
      This is technically a layer-classification gap: the tests are unit by location but integration by cost.
    recommended_action: |
      Move src/embedders/__tests__/local.test.ts to tests/integration/embedders/local.test.ts (mirror the migration pattern). Update vitest.contract.config.ts include if needed. This keeps the unit test surface fast (no model-load overhead in `npm test`) while preserving the test coverage in `npm run test:integration`.
      Alternative: accept the cost and document in test header that the LocalTransformerEmbedder unit tests are "expensive unit" (model-bound).

