findings:
  - id: F-dom-dbmig-1
    severity: MINOR
    file: src/local/migrations/0010_recall_cache.sql
    line: 10-12, 38
    plan_ref: plan v1.1 § T0.2 Deep Dives migration SQL block (lines 373-376 of plan) + ADR D7 v1.1 amendment + EC-15
    domain_anchor: architecture.md § 10 (build pipeline + schema parity) + no-paper-names-in-code.md § How to apply (rules 1+3 — describe SHAPE, not inspiration)
    summary: |
      HNSW index comment (lines 10-12) claims "HNSW parameters `m=16, ef_construction=64` are pgvector v0.5.1 defaults",
      but the actual CREATE INDEX statement at line 38 omits the `WITH (m = ..., ef_construction = ...)` clause entirely.
      The plan v1.1 § T0.2 Deep Dives SQL block at lines 373-376 explicitly includes the `WITH (m = 16, ef_construction = 64)` clause.
      The implementation chose to rely on pgvector v0.5.1's documented defaults (which ARE m=16, ef_construction=64 — factually correct), so the runtime index shape is IDENTICAL.
      However: (a) deviation from plan template is not documented inline as "deferred to pgvector defaults"; (b) the `0010_snapshot.json` line 689 `"with": {}` reflects this — drizzle-kit generated the snapshot from the schema.ts declaration which also omits the params at line 311 (`index('recall_cache_scope_hnsw_idx').using('hnsw', table.queryEmbedding.op('vector_cosine_ops'))` has no `.with({...})`).
      (c) the migration SQL test at `migration-0010.test.ts:96-98` only asserts `/hnsw/` + `/vector_cosine_ops/` regex — does NOT lock the m/ef_construction values. So a future pgvector release that changes defaults would silently shift index quality without any test signal.
      Inquebrável Rule 3 (extreme honesty): the comment should either (a) match the SQL ("HNSW uses pgvector v0.5.1 defaults; m=16, ef_construction=64 at the version we ship against; tuning deferred per ADR D7 v1.1") or (b) the SQL should match the comment (add `WITH (m = 16, ef_construction = 64)` to lock the parameters explicitly).
    evidence: |
      Migration SQL line 38:
        CREATE INDEX IF NOT EXISTS "recall_cache_scope_hnsw_idx" ON "recall_cache" USING hnsw ("query_embedding" vector_cosine_ops);--> statement-breakpoint

      Migration SQL lines 10-12 (comment):
        -- HNSW parameters `m=16, ef_construction=64` are pgvector v0.5.1 defaults
        -- (EC-15 DOCUMENT absorption / ADR D7 v1.1 amendment) — tuning DEFERRED to
        -- v1.5.x dogfood-evidence-driven adjustment per Inquebrável Rule 11 (YAGNI).

      Plan v1.1 § T0.2 Deep Dives lines 373-376 (the contract the migration was supposed to implement):
        CREATE INDEX IF NOT EXISTS recall_cache_scope_hnsw_idx ON recall_cache
          USING hnsw (query_embedding vector_cosine_ops)
          WITH (m = 16, ef_construction = 64);

      Snapshot 0010_snapshot.json line 689 confirms the omission:
        "method": "hnsw",
        "with": {}
    recommended_action: |
      Pick ONE of the two paths (project-owner preference):
      Path A — make SQL match plan literally + lock against future pgvector default drift:
        Add `WITH (m = 16, ef_construction = 64)` to the CREATE INDEX in 0010_recall_cache.sql + add `.with({ m: 16, ef_construction: 64 })` to the schema.ts declaration + regenerate 0010_snapshot.json + tighten migration-0010.test.ts to assert m=16 + ef_construction=64 in pg_indexes.indexdef.
      Path B — make comment match SQL (honest "defaults" framing):
        Rewrite the comment to "Index uses pgvector v0.5.1 documented defaults (m=16, ef_construction=64 today); we DO NOT lock the parameters in SQL — future pgvector releases that change defaults will surface via the integration test if we tighten it. ADR D7 v1.1 records the deferral."
      Then surface either choice in a follow-up CHANGELOG entry citing F-dom-dbmig-1.

  - id: F-dom-dbmig-2
    severity: MINOR
    file: src/local/index.ts
    line: 1335-1350
    plan_ref: plan v1.1 § T5.1 applyDimChange cascade extension
    domain_anchor: architecture.md § 8 (fail-fast at boundaries) + Inquebrável Rule 3 (extreme honesty)
    summary: |
      `applyDimChange()` post-ALTER canary at lines 1335-1350 verifies `c.relname IN ('memories', 'entities')` but does NOT include `'recall_cache'` in the canary set, even though `recall_cache.query_embedding` is ALTERed inside the same BEGIN/COMMIT transaction (lines 1307-1312).
      The omission is defensible — PG guarantees both ALTERs succeed-or-fail atomically inside the same tx, so memories.atttypmod is a faithful proxy. However, the canary's own JSDoc at lines 1334 explicitly cites "the entities ALTER silently no-op'ing while memories ALTER succeeds" as a documented protected case. That documented protection does NOT extend to the `recall_cache.query_embedding` ALTER — which is wrapped in a `DO $$ IF EXISTS ... END $$` block that COULD silently no-op if the IF-EXISTS probe returns false for a transient PG catalog visibility reason inside the tx.
      Low actual risk (the recall_cache existence check reads from the same in-tx catalog state where the table was visible at the start of the BEGIN), but the canary's coverage doesn't match the cascade's scope.
    evidence: |
      Canary query at lines 1336-1342:
        const verify = await client.query<{ rel: string; dim: number }>(
          `SELECT c.relname AS rel, a.atttypmod AS dim
             FROM pg_attribute a
             JOIN pg_class c ON c.oid = a.attrelid
            WHERE c.relname IN ('memories', 'entities')           // <-- missing 'recall_cache'
              AND a.attname = 'embedding'                         // <-- recall_cache column is 'query_embedding'
              AND a.attisdropped = false
            ORDER BY c.relname`,
        );

      ALTERed table at lines 1307-1312 (inside same BEGIN/COMMIT):
        EXECUTE 'ALTER TABLE "recall_cache" ALTER COLUMN "query_embedding" TYPE vector(${String(targetDim)})';
    recommended_action: |
      Extend the canary query to UNION ALL the recall_cache.query_embedding probe (gated by IF EXISTS to handle pre-v1.5 DBs):
        SELECT c.relname AS rel, a.atttypmod AS dim
          FROM pg_attribute a
          JOIN pg_class c ON c.oid = a.attrelid
         WHERE (c.relname IN ('memories', 'entities') AND a.attname = 'embedding')
            OR (c.relname = 'recall_cache' AND a.attname = 'query_embedding'
                AND EXISTS (SELECT 1 FROM information_schema.tables
                            WHERE table_schema = 'public' AND table_name = 'recall_cache'))
           AND a.attisdropped = false
         ORDER BY c.relname
      Per-row assertion already handles the multi-rel case (line 1344-1350).
      Defer if the project-owner reads the residual risk as acceptable (PG tx atomicity is strong); document the decision in a follow-up ADR D7 amendment.

  - id: F-dom-dbmig-3
    severity: MINOR
    file: src/local/index.ts
    line: 1284
    plan_ref: plan v1.1 § T5.1 cascade extension (IF EXISTS guards)
    domain_anchor: architecture.md § 7 (module hygiene — symmetric I/O patterns) + KISS
    summary: |
      The 3 recall_cache ALTER paths at lines 1299-1304 (DELETE), 1307-1312 (ALTER COLUMN), and 1318-1323 (CREATE INDEX) are wrapped in `DO $$ IF EXISTS (information_schema.tables WHERE ...) THEN ... END $$` blocks.
      But the `DROP INDEX IF EXISTS recall_cache_scope_hnsw_idx` at line 1284 is NOT wrapped in the same guard — it executes UNCONDITIONALLY.
      Functionally safe: `DROP INDEX IF EXISTS` is itself idempotent and tolerates a missing index regardless of whether the parent table exists (PG resolves the index name in pg_class; missing index → no-op).
      However, asymmetric guarding makes the 4-step recall_cache cascade harder to read — the reader has to know PG's semantics to verify "DROP INDEX IF EXISTS without table-IF-EXISTS guard is safe" but "DELETE FROM table without table-IF-EXISTS guard is NOT safe".
      Low priority — pure code hygiene; no runtime defect.
    evidence: |
      Line 1284 (UNCONDITIONAL):
        await client.query('DROP INDEX IF EXISTS recall_cache_scope_hnsw_idx');

      Lines 1299-1304 (DO $$ IF EXISTS guarded):
        await client.query(`DO $$ BEGIN
          IF EXISTS (SELECT 1 FROM information_schema.tables
                     WHERE table_schema = 'public' AND table_name = 'recall_cache') THEN
            DELETE FROM recall_cache;
          END IF;
        END $$`);
    recommended_action: |
      Either: (a) wrap the DROP INDEX in the same DO $$ block for symmetry, OR (b) add a one-line comment at line 1283 noting "DROP INDEX IF EXISTS is itself safe regardless of parent-table existence; the DO $$ guards on lines 1299/1307/1318 are required because DELETE/ALTER are NOT safe against missing tables".

  - id: F-dom-dbmig-4
    severity: MINOR
    file: tests/integration/cache/migration-0010.test.ts
    line: 96-105
    plan_ref: plan v1.1 § T0.2 TDD T0.2-RED-3 + EC-15 absorption
    domain_anchor: testing.md (assert actual behavior with explicit values)
    summary: |
      The HNSW index assertion at lines 96-98 uses regex `/hnsw/` + `/vector_cosine_ops/` — verifies the index TYPE and opclass, but does NOT lock the `m` / `ef_construction` parameter values.
      This pairs with F-dom-dbmig-1: even if a future pgvector release changes the m/ef_construction defaults from (16, 64) to e.g. (32, 128), the migration-0010.test.ts T0.2-RED-3 would still PASS — and the v1.5.0 hit-rate target (≥ 0.50) was empirically calibrated against the m=16/ef_construction=64 index shape. Silent regression possible.
    evidence: |
      Lines 96-98:
        expect(byName.has('recall_cache_scope_hnsw_idx')).toBe(true);
        expect(byName.get('recall_cache_scope_hnsw_idx')).toMatch(/hnsw/);
        expect(byName.get('recall_cache_scope_hnsw_idx')).toMatch(/vector_cosine_ops/);
    recommended_action: |
      If F-dom-dbmig-1 Path A is chosen (add WITH clause to SQL), then also tighten this test to:
        expect(byName.get('recall_cache_scope_hnsw_idx')).toMatch(/m\s*=\s*'?16'?/);
        expect(byName.get('recall_cache_scope_hnsw_idx')).toMatch(/ef_construction\s*=\s*'?64'?/);
      (pg_indexes.indexdef formats WITH params as `WITH (m='16', ef_construction='64')` — the regex tolerates quoting variants.)
      If F-dom-dbmig-1 Path B is chosen (keep relying on defaults), then add a comment to the test acknowledging the silent-regression risk and citing ADR D7 v1.1 as the deferred-tuning anchor.

