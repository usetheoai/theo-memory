      `src/local/recall-cache/pgvector-recall-cache-store.ts`, depending
      ONLY on `pg` + the core DIP — correct DIP direction. Logged for
      traceability.
    evidence: |
      ```ts
      // src/core/dip/recall-cache-store.ts:107-145
      export interface RecallCacheStore {
        get(queryEmbedding, scope): Promise<CachedResult | undefined>;
        set(queryEmbedding, scope, results, ttlSeconds): Promise<void>;
        invalidateScope(scope): Promise<number>;
        clearExpired(): Promise<number>;
      }  // ← exactly 4 methods
