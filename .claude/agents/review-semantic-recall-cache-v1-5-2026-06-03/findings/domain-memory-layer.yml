findings:
  - id: F-dom-memory-1
    severity: MAJOR
    file: src/local/index.ts
    line: 977
    plan_ref: ADR D3 v1.1 amendment + T0.1 EC-3 absorption + RecallCacheStoreConfig.ttlSecondsByScopeTier with required `repo` tier
    domain_anchor: CLAUDE.md § Architectural Decisions Locked — RepoScope 4th tier (ADR-0010); plan v1.1 T0.1 RED-5/RED-6 declared the `skill`/`repo` tier as part of the cache contract
    summary: |
      `LocalMemory.skills(repoId)` does NOT plumb `recallCacheStore` into the
      returned `LocalScopedSkillMemory`. Consequence — `memory.skills(repoId).recall(query)`
      ALWAYS executes the full 9-step retrieval pipeline; the cache never
      observes a skill-scope hit, even though:
        (a) `ScopeTierTtlConfig.repo` is required + defaults to 3600s
            (`src/core/dip/recall-cache-store.ts:73`);
        (b) `deriveScopeKey(scope)` handles the `repo` discriminator and
            produces `'repo:${repoId}'` (`src/local/recall-cache/scope-key.ts:29`);
        (c) the `applyDimChange` ALTER TYPE cascade INCLUDES `recall_cache`
            (`src/local/index.ts:1278`), implying skill-scope rows are an
            expected workload.
      The contract surface advertises 4-tier caching; only 3 tiers (user /
      session / agent) actually wire end-to-end. v1.1 EC-9 honest-deferral
      precedent (skill-scope `asOf` deferred) was documented in CHANGELOG —
      the equivalent honest-deferral for skill-scope CACHE is NOT documented
      anywhere in the plan, the DIP JSDoc, or CHANGELOG. Either ship the
      skill wiring or document the boundary as an honest deferral mirroring
      v1.1's pattern.
    evidence: |
      ```ts
      // src/local/index.ts:977
      skills(repoId: string): ScopedSkillMemory {
        const skillStore = this.config.vectorStore as VectorStore & VectorStoreWithSkillInsert;
        return new LocalScopedSkillMemory(repoId, {
          vectorStore: skillStore,
          embedder: this.config.embedder,
          llm: this.config.llm,
          forgetDelegate: (id: string) => this.forget(id),
          getDelegate: (id: string) => this.get(id),
          ...(this.config.tracer !== undefined ? { tracer: this.config.tracer } : {}),
          // ← `recallCacheStore` NOT forwarded
        });
      }
      ```
      ```ts
      // src/local/scoped-skill-memory.ts:118-147 — recall() runs the
      // pipeline directly with NO cache lookup or populate
      async recall(query: string, options?: SkillRecallOptions): Promise<readonly SkillWithScore[]> {
        // ...filters composition...
        const results = await runRetrievalPipeline(query, filters, { ... }, options);
        // ← no cache.get(), no cache.set()
      }
      ```
      ```ts
      // src/core/dip/recall-cache-store.ts:73 (DIP REQUIRES repo tier)
      export interface ScopeTierTtlConfig {
        readonly user: number;
        readonly agent: number;
        readonly session: number;
        readonly repo: number;  // ← contract surface
      }
      ```
    recommended_action: |
      Either (a) plumb `recallCacheStore` into `LocalScopedSkillMemory` so
      skill-scope reads observe cache hits at `repo:${repoId}` scope_key, OR
      (b) document the v1.5.0 honest-deferral mirroring v1.1 EC-9: amend
      `ScopeTierTtlConfig.repo` JSDoc to "currently advertised; skill-scope
      cache wiring scheduled for v1.5.x" + CHANGELOG `[Unreleased] § Notes`
      block + plan v1.2 ADR D9 documenting the deferral. The current state
      is silently mis-advertised contract.

