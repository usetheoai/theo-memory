  - id: F-dom-memory-3
    severity: MAJOR
    file: src/local/index.ts
    line: 311
    plan_ref: T2.2 EC-10 absorption — "deriveScopeFromPayload reads user_id/session_id/agent_id... Most specific tier wins (session > agent > user)"
    domain_anchor: ADR-0010 (RepoScope 4th tier maps to `agent_id` column per EC-4); plan T2.2 Deep Dives — "scope derivable from memory record per EC-10 strategy"
    summary: |
      `deriveScopeFromPayload` cannot distinguish a v0.6 RepoScope skill row
      from a regular AgentScope memory row because both occupy the same
      persisted column (`agent_id`, per ADR-0010 EC-4 column-mapping). Today
      this defect is DORMANT (F-dom-memory-1: skill-scope cache wiring
      missing means no `repo:${repoId}` row ever lands in `recall_cache`).
      But the moment F-dom-memory-1 is closed, the silent collision becomes
      a real bug: `Memory.forget(skillId)` invoked directly (NOT through
      `memory.skills(repoId).forget()`) would `invalidateScope({kind:'agent',
      agentId})` while the cache holds a `repo:${repoId}` row that stays
      stale until TTL. Reading the row payload's `kind` field
      (`'skill'` vs absent → regular) is the canonical way to disambiguate;
      the persisted column shape exists for exactly this discrimination
      (the existing `SkillRecallOptions` already filters by `kind:'skill'`,
      proving the column exists).
    evidence: |
      ```ts
      // src/local/index.ts:311
      function deriveScopeFromPayload(payload: Readonly<Record<string, unknown>>): Scope | undefined {
        const userId = payload['user_id'];
        const sessionId = payload['session_id'];
        const agentId = payload['agent_id'];
        // session is the most specific tier; prefer it when present.
        if (typeof sessionId === 'string' && sessionId.length > 0) {
          return { kind: 'session', sessionId };
        }
        if (typeof agentId === 'string' && agentId.length > 0) {
          return { kind: 'agent', agentId };  // ← skill rows hit this branch
        }
        // ...
      }
      ```
      ```ts
      // src/local/scoped-skill-memory.ts:126 — confirms skill rows carry
      // the discriminator on the payload
      const filters: Filters = { ...this.filters, kind: 'skill', ... };
      ```
    recommended_action: |
      Read `payload['kind']` first; when `'skill'`, return `{kind:'repo',
      repoId: String(agentId)}`. Add unit test that `forget(skillId)` for a
      skill row derives `repo:${repoId}` scope_key — even though the wiring
      is dormant today, locking the test prevents regression when
      F-dom-memory-1 is closed. Without this, future skill-scope cache work
      will silently leak stale entries.

