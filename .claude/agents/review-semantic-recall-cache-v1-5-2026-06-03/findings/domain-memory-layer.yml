        - T2.2-RED-6 (EC-6: reflect() success invokes invalidateScope)
        - T2.2-RED-7 (EC-6: Item 19 AC#3 regression for reflect)
        - T2.2-RED-8 (EC-10: forget scope derivation — most-specific tier wins)
        - T2.2-RED-9 (EC-10 fallback when memory not found)
