    file: src/local/index.ts
    line: 340
    plan_ref: T2.1 Deep Dives — "Default fallback table (mirror DEFAULT_TTL_SECONDS_BY_SCOPE_TIER without importing the constant)"
    domain_anchor: Inquebrável Rule 12 (DRY) — same conhecimento represented in two places means a future TTL spread bump in `DEFAULT_TTL_SECONDS_BY_SCOPE_TIER` drifts silently
    summary: |
      `resolveCacheTtl` re-declares the 4-tier defaults inline as a
      module-private constant rather than importing
      `DEFAULT_TTL_SECONDS_BY_SCOPE_TIER` from
      `src/core/dip/recall-cache-store.ts:152`. The JSDoc admits the
      duplication is intentional ("keeps the wiring module readable"), but
      that rationale is weaker than the DRY violation: two sources of
      truth for the same TTL spread WILL drift the first time a v1.5.x
      dogfood-evidence-driven tune lands. Mirror discipline: the validator
      iterates `['user','agent','session','repo']` AND
      `DEFAULT_TTL_SECONDS_BY_SCOPE_TIER` lists the same 4 keys with the
      same values — adding a 3rd copy here triples the drift surface.
    evidence: |
      ```ts
      // src/local/index.ts:340
      function resolveCacheTtl(scope: Scope, cacheConfig: ...): number {
        // Default fallback table (mirror DEFAULT_TTL_SECONDS_BY_SCOPE_TIER
        // without importing the constant — keeps the wiring module readable).
        const defaults = { user: 86_400, agent: 3_600, session: 600, repo: 3_600 } as const;
        // ...
      }
      ```
      ```ts
      // src/core/dip/recall-cache-store.ts:152 — authoritative source
      export const DEFAULT_TTL_SECONDS_BY_SCOPE_TIER: ScopeTierTtlConfig = Object.freeze({
        user: 86_400, agent: 3_600, session: 600, repo: 3_600,
      });
      ```
    recommended_action: |
      `import { DEFAULT_TTL_SECONDS_BY_SCOPE_TIER } from
      '../core/dip/recall-cache-store.js'` and use it directly. Readability
      cost is one extra import line; DRY win is permanent. Alternatively,
      add a parity sentinel test that asserts the two literals are
      structurally equal — but importing is the canonical fix.

  - id: F-dom-memory-5
    severity: MINOR
    file: src/local/recall-cache/pgvector-recall-cache-store.ts
    line: 86
    plan_ref: T1.2 LRU eviction at max_size=1000 per scope (Blueprint Rec #8)
    domain_anchor: testing.md § Determinism — "No flaky tests... time-dependent tests use a frozen clock"; same-ms inserts via Promise.all collide in created_at resolution
    summary: |
      `DELETE_OLDEST_SQL` uses `ORDER BY created_at ASC LIMIT 1` with no
      secondary tiebreaker. PostgreSQL `now()` resolves to microseconds, but
      same-transaction or millisecond-burst inserts via `Promise.all`
      (precisely the EC-7 concurrent path the SERIALIZABLE transaction
      defends against) can produce two rows sharing the same `created_at`
      timestamp. The DELETE then picks one row non-deterministically — LRU
      semantics degrade to "delete any of the oldest" rather than "delete
      THE oldest". For a v1.5.0 cache the practical impact is small, but it
      makes the T1.2-RED-2 acceptance ("oldest row is gone, others stay")
      sometimes flaky. Adding `, id ASC` as a tiebreaker is one-token cost
      and gives deterministic eviction.
    evidence: |
      ```ts
      // src/local/recall-cache/pgvector-recall-cache-store.ts:86
      const DELETE_OLDEST_SQL = `DELETE FROM recall_cache
         WHERE id = (
           SELECT id FROM recall_cache
            WHERE scope_key = $1
            ORDER BY created_at ASC
            LIMIT 1
         )`;
      ```
    recommended_action: |
      Append `, id ASC` to the inner ORDER BY so eviction is deterministic
      under same-timestamp collisions. `ORDER BY created_at ASC, id ASC
      LIMIT 1`.

  - id: F-dom-memory-6
    severity: INFO
    file: src/local/index.ts
    line: 575
    plan_ref: ADR D8 cache applicability boundary
    domain_anchor: positive control — verifies the surface this review was tasked to find regressions in
    summary: |
      ADR D8 (cache applicability boundary) is correctly implemented at
      `LocalScopedMemory.recall()` — when `options.asOf !== undefined` OR
      `options.attributedTo !== undefined` (single OR combined), the wrap
      sets `cacheApplicable = false` and falls through to
      `runRetrievalPipeline` directly without consulting `cache.get` or
      writing `cache.set`. Bypass is verified by three unit tests
      (T2.1-RED-8 / RED-9 / RED-10) at
      `src/local/__tests__/factory-recall-cache.test.ts:116-141` that assert
      BOTH `cache.getCalls.length === 0` AND `cache.setCalls.length === 0`
      after the bypassed recall. Bi-temporal contract (ADR-0011 v1.1) and
      multi-peer attribution contract (ADR-0011 v1.1) both honored. This
      finding logged for cross-validation traceability.
    evidence: |
      ```ts
      // src/local/index.ts:575-585
      const cache = this.recallCacheStore;
      const cacheApplicable =
        cache !== undefined && options?.asOf === undefined && options?.attributedTo === undefined;
      if (!cacheApplicable || cache === undefined) {
        return runRetrievalPipeline(query, applySkillFilters(this.filters, options), { ... }, options);
      }
      ```
    recommended_action: |
      No action — implementation matches plan ADR D8 + EC-4 + EC-5
      absorption verbatim. Continue forward.

