  - id: F-dom-pgvector-2
    severity: MAJOR
    file: src/local/index.ts
    line: 1335-1350
    plan_ref: T5.1 cascade extension — recall_cache.query_embedding dim swap inside same BEGIN/COMMIT
    domain_anchor: applyDimChange post-ALTER value-based canary discipline (introduced by /review re-run F-dom-pgvector-rerun-2 for v1.4 adapters-openrouter-local-embedder cycle)
    summary: |
      The post-ALTER value-based canary asserts `atttypmod = targetDim` for `memories` and
      `entities`, but NOT for `recall_cache.query_embedding`. T5.1's cascade extension adds
      the `recall_cache` ALTER inside the same BEGIN/COMMIT, yet the canary `WHERE c.relname
      IN ('memories', 'entities')` excludes the third table. If a future PG side-effect, the
      `DO $$ ... END $$` block's `EXISTS` short-circuit silently no-op-ing, or a pgvector
      release with different ALTER semantics caused the recall_cache ALTER to silently fail
      while memories+entities succeed, the COMMIT would land — leaving recall_cache stuck at
      the OLD dim. The next `set()` call from the embedder (new dim) into recall_cache (old
      dim) would FAIL at the INSERT (vector dim mismatch), poisoning the cache write path
      until the operator runs `DELETE FROM recall_cache + drizzle-kit push` manually. The
      F-dom-pgvector-rerun-2 rationale (lines 1325-1334) EXPLICITLY listed "entities ALTER
      silently no-op'ing while memories ALTER succeeds" as a defended scenario; the same
      reasoning applies to recall_cache.
    evidence: |
      Lines 1335-1343 of src/local/index.ts:
        ```sql
        SELECT c.relname AS rel, a.atttypmod AS dim
          FROM pg_attribute a
          JOIN pg_class c ON c.oid = a.attrelid
         WHERE c.relname IN ('memories', 'entities')   -- recall_cache MISSING
           AND a.attname = 'embedding'                   -- query_embedding MISSING
           AND a.attisdropped = false
         ORDER BY c.relname
        ```
      Lines 1307-1312 of the SAME function DO include a conditional ALTER on
      recall_cache.query_embedding inside the BEGIN/COMMIT. The asymmetry between the
      conditional ALTER (guarded by EXISTS) and the unconditional 2-table canary means
      one of the two ALTERs being a no-op would go undetected.
    recommended_action: |
      Extend the canary to also probe recall_cache.query_embedding atttypmod when the
      recall_cache table is present in the database. Either:
      (1) Run a SECOND probe inside a conditional `IF EXISTS (...recall_cache...)` block
          before the COMMIT, asserting dim == targetDim;
      (2) OR extend the existing UNION query to include
          `OR (c.relname = 'recall_cache' AND a.attname = 'query_embedding')`, then
          conditionally validate that row only when present.
      Option (1) is more conservative and aligns with the IF EXISTS guards already used
      at lines 1307 / 1318. Acceptance test: pre-v1.5 DB (no recall_cache) → canary
      passes with only 2 rows; v1.5 DB (with recall_cache) → canary passes with 3 rows.

  - id: F-dom-pgvector-3
    severity: MINOR
    file: src/local/migrations/0010_recall_cache.sql
    line: 6, 38 + src/local/schema.ts:308-311
    plan_ref: Migration SQL comments + schema.ts schema annotation
    domain_anchor: Postgres index terminology (a PARTIAL index has a WHERE predicate filtering rows; a regular HNSW index without WHERE indexes ALL rows)
    summary: |
      Comments label the HNSW index `recall_cache_scope_hnsw_idx` as a "partial index" but
      the actual SQL declares NO `WHERE` predicate on this index — it indexes ALL rows of
      `query_embedding`. Only the B-tree on `expires_at` is genuinely partial (`WHERE
      expires_at IS NOT NULL`). The misnaming risks a future maintainer adding a `WHERE`
      predicate "to make the comment true" (e.g., `WHERE expires_at IS NULL OR expires_at >
      NOW()`) — which would invalidate the index for the rest of the query patterns
      (invalidateScope, clearExpired). Equally, the name `recall_cache_scope_hnsw_idx`
      suggests it's a scope-keyed index, but the indexed column is `query_embedding` (not
      `scope_key`). Scope filtering happens via the SEPARATE B-tree index.
    evidence: |
      Migration line 6: "HNSW partial index on `query_embedding` (vector_cosine_ops)"
      Schema.ts line 308: "HNSW partial index per blueprint § 3"
      Actual SQL line 38: `CREATE INDEX ... USING hnsw ("query_embedding" vector_cosine_ops);`
      — NO `WHERE` predicate.
      Index name `recall_cache_scope_hnsw_idx` contains "scope" but indexes query_embedding.
    recommended_action: |
      (a) Drop the "partial" qualifier from both migration line 6 and schema.ts line 308 —
          this is a REGULAR HNSW index, not partial. (Confirm: do we actually WANT it
          partial? Skipping expired rows would let the HNSW skip dead vectors. If yes,
          add `WHERE expires_at IS NULL OR expires_at > NOW()` to the index — but be aware
          that pgvector HNSW does NOT support partial indexes via WHERE on pgvector v0.5.x,
          per pgvector docs.)
      (b) Consider renaming the index to `recall_cache_query_embedding_hnsw_idx` for clarity
          — but this is COSMETIC and incurs a migration delta, so weigh against the cost.
          Acceptable to leave the misleading name with a one-line comment if the migration
          would otherwise touch user-deployed schemas.

  - id: F-dom-pgvector-4
    severity: MINOR
    file: src/local/migrations/0010_recall_cache.sql + src/local/schema.ts
    line: 38 (migration) / 311 (schema)
    plan_ref: ADR D7 v1.1 amendment + EC-15 absorption — HNSW m=16, ef_construction=64 conservative defaults
    domain_anchor: pgvector index parameter discipline — explicit > implicit per Inquebrável Rule 5 (Nomenclatura) "Better a long, clear name than a short, problematic one"
    summary: |
      The HNSW parameters `m=16, ef_construction=64` are CLAIMED in comments at both the
      migration SQL (line 10) and schema.ts (line 309) — but NOT actually set in the
      `CREATE INDEX` statement. They are implicit defaults of pgvector v0.5.1. If a future
      pgvector release changes its defaults (e.g., pgvector 0.6.x increases `m` to 32), the
      comments would silently lie and the actual index would diverge from the documented
      contract. The /review F-Mi8 pattern (defensive extversion canary in applyDimChange)
      already acknowledges that pgvector internals are version-sensitive — the same prudence
      applies to declared index parameters.
    evidence: |
      Migration line 38:
        `CREATE INDEX IF NOT EXISTS "recall_cache_scope_hnsw_idx" ON "recall_cache" USING hnsw ("query_embedding" vector_cosine_ops);`
      — no `WITH (m = 16, ef_construction = 64)` clause.
      Migration lines 10-12 documentation:
        "HNSW parameters `m=16, ef_construction=64` are pgvector v0.5.1 defaults (EC-15
         DOCUMENT absorption / ADR D7 v1.1 amendment) — tuning DEFERRED to
         v1.5.x dogfood-evidence-driven adjustment per Inquebrável Rule 11 (YAGNI)."
      applyDimChange line 1316-1317 (recreates index inside transaction with the SAME
      implicit defaults — but if pgvector defaults change, the original migration and the
      ALTER cascade would BOTH silently change with it).
    recommended_action: |
      Make the parameters explicit in BOTH the migration and the schema.ts index() call:
        Migration:
          CREATE INDEX IF NOT EXISTS "recall_cache_scope_hnsw_idx"
            ON "recall_cache"
            USING hnsw ("query_embedding" vector_cosine_ops)
            WITH (m = 16, ef_construction = 64);
        applyDimChange line 1321:
          EXECUTE 'CREATE INDEX IF NOT EXISTS "recall_cache_scope_hnsw_idx"
                   ON "recall_cache" USING hnsw ("query_embedding" vector_cosine_ops)
                   WITH (m = 16, ef_construction = 64)';
      This pins the contract regardless of pgvector default drift. Acceptance test: extend
      migration-0010.test.ts T0.2-RED-3 to assert `pg_index.indrelid + pg_class.reloptions`
      reflect `m=16, ef_construction=64`. (pgvector exposes index options via
      `pg_indexes.indexdef` text or `pg_class.reloptions` array.)

