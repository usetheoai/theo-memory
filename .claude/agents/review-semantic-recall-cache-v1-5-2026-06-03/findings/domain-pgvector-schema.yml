  - id: F-dom-pgvector-6
    severity: MINOR
    file: src/local/recall-cache/pgvector-recall-cache-store.ts
    line: 79-92, 172-197
    plan_ref: T1.2 LRU eviction via SERIALIZABLE transaction
    domain_anchor: LRU = Least Recently Used (eviction by last-USED timestamp); FIFO = First In First Out (eviction by INSERT timestamp). Industry standard caching terminology.
    summary: |
      The eviction strategy is misnamed in plan + comments. `DELETE_OLDEST_SQL` (line 86-92)
      orders by `created_at ASC LIMIT 1` — this is **FIFO**, NOT LRU. True LRU requires a
      `last_accessed_at` column updated on every cache hit, OR an LFU-style hit_count
      tracking. The current impl never updates `created_at` after INSERT, so "least
      recently USED" rows (those frequently hit but inserted long ago) are evicted ahead of
      "recently inserted but never hit" rows. Plan, blueprint, comments, and test names all
      use "LRU" but the discipline is FIFO. This is a TERMINOLOGY defect that risks future
      "LRU optimization" PRs that misunderstand the current state. Acceptable as a v1.5.0
      simplification (FIFO is cheaper and well-defined) but should be called out honestly.
    evidence: |
      Eviction SQL at pgvector-recall-cache-store.ts:86-92:
        DELETE FROM recall_cache
         WHERE id = (
           SELECT id FROM recall_cache
            WHERE scope_key = $1
            ORDER BY created_at ASC      <-- ORDER BY INSERT TIME, not access time
            LIMIT 1
         )
      `created_at` is set at INSERT (NOW() default) and never updated.
      `get()` does NOT bump `created_at` or `hit_count`.
      Plan v1.1 line 623 test name: "T1.2-RED-4 (EC-7) — 2 concurrent set() calls
        (Promise.all) on full scope: exactly 1 row deleted" — eviction strategy not
        examined.
      JSDoc lines 6-9 of pgvector-recall-cache-store.ts:
        "set ... capacity-bounded LRU eviction inside SERIALIZABLE tx (T1.2 / EC-7)"
        — claims LRU; the impl is FIFO.
    recommended_action: |
      Pick one:
      (a) Rename in code + plan + comments: change "LRU" → "FIFO" (or
          "oldest-first" / "insertion-order eviction") throughout. JSDoc lines 6-9,
          serializable-tx.ts header comment, plan T1.2 acceptance criteria, and the
          `DELETE_OLDEST_SQL` constant name remain accurate either way (it IS
          deleting the oldest by insertion); just the meta-name should align.
          This is cosmetic but honest.
      (b) If true LRU is the intended semantic (v1.5.1 may upgrade), add a
          v1.5.x roadmap row + ADR documenting "v1.5.0 ships FIFO as a simplification;
          v1.5.1 considers `last_accessed_at` column for true LRU if dogfood evidence
          shows benefit." This honors Inquebrável Rule 3 (extreme honesty about what
          v1.5.0 actually ships).
      THE GOAL TEST hit rate of 0.60 was measured against the current FIFO impl
      against 10 hand-authored pairs — switching to true LRU would not necessarily
      improve THAT number but would change production workload behavior. Decision:
      defer to project owner.

  - id: F-dom-pgvector-7
    severity: MINOR
    file: src/local/recall-cache/pgvector-recall-cache-store.ts + src/local/migrations/0010_recall_cache.sql
    line: 78-80 (INSERT_SQL) + 27-36 (table declaration)
    plan_ref: Blueprint D4 cache key composition `(scope_key, query_embedding)`
    domain_anchor: Postgres unique-constraint discipline — composite cache key uniqueness should be expressible at the DB layer per architecture.md "Defensive at boundaries"
    summary: |
      The cache key is documented as `(scope_key, query_embedding)` per blueprint D4
      (cited at migration line 5-6 and schema.ts:288), but the table has NO unique
      constraint on this pair. INSERT_SQL is plain `INSERT INTO recall_cache (...)`
      without `ON CONFLICT (scope_key, query_embedding) DO UPDATE SET ...`. Two
      concurrent `set()` calls with identical scope + identical query_embedding will
      land TWO duplicate rows (the SERIALIZABLE retry only defends against the LRU
      count read-then-evict race, not against the duplicate INSERT case). Concrete
      scenario: a stub embedder + same query text → identical embedding → 2 `set()`
      calls in a row (e.g., retry layer) → 2 duplicate rows in the same scope. Cache
      `get()` then has 2 rows with cosine distance 0 → PG picks ARBITRARY one for
      `LIMIT 1`. Not a correctness bug (both rows have same data, same threshold), but
      it bloats per-scope row count toward `maxSizePerScope` triggering premature
      eviction of OTHER rows. Worst case: a scope with `maxSizePerScope = 10` cached
      gets reduced to 5 unique queries because of duplicates.
    evidence: |
      Migration 0010 lines 27-36: no UNIQUE constraint on (scope_key, query_embedding).
      Schema.ts:296-318: no `unique()` annotation on the index() declarations.
      INSERT_SQL at pgvector-recall-cache-store.ts:79-80:
        `INSERT INTO recall_cache (scope_key, query_embedding, result_set, expires_at, threshold_used)
         VALUES ($1, $2::vector, $3, NOW() + ($4 || ' seconds')::INTERVAL, $5)`
        — no `ON CONFLICT` clause.
      Capacity check at line 184-188 does NOT examine whether a duplicate row exists
      — it just counts rows in scope and possibly evicts the OLDEST.
    recommended_action: |
      Pick one:
      (a) Add a UNIQUE constraint on `(scope_key, query_embedding)` at the table level
          (Note: pgvector + UNIQUE on a high-dim vector column has constant-time
          comparison cost for exact equality, which IS the semantic — two embeddings
          must match byte-for-byte to collide). Then INSERT_SQL becomes:
            `INSERT ... ON CONFLICT (scope_key, query_embedding) DO UPDATE SET
                 created_at = NOW(), result_set = EXCLUDED.result_set,
                 expires_at = EXCLUDED.expires_at, threshold_used = EXCLUDED.threshold_used`
          This converts a duplicate INSERT into a refresh, naturally extending TTL +
          updating result_set if it changed.
      (b) Document the duplicate-row tolerance as intentional + acceptable for
          v1.5.0 (e.g., "stub-embedder workloads may bloat per-scope row count by
          duplicate INSERTs; production embedders never produce byte-identical
          embeddings for non-identical queries so the duplicate path is bounded by
          retry-counter ≤ 1") + add a SHOULD TEST follow-up to surface the bloat in
          dogfood telemetry.
      Option (a) is the cleaner DB discipline + matches the documented cache-key
      semantic. Option (b) is YAGNI-aligned IF the embedder retry path is verifiably
      idempotent — which it is in the SERIALIZABLE wrapper but NOT in the upstream
      consumer's retry layer.

