    plan_ref: EC-8 absorption (T1.1 zero-norm-embedding NaN cosine handling)
    domain_anchor: PostgreSQL float docs § 8.1.4 ("NaN is treated as equal to itself and greater than all non-NaN values") + the file-level JSDoc at lines 22-27 of the same file
    summary: |
      Internal contradiction between the SQL constant docstring (lines 65-68 / 70-76 GET_SQL block)
      and the file-level JSDoc (lines 22-27). Lines 65-68 still carry the PRE-absorption claim
      that "(1 - NaN) >= 0.8 evaluates false, so zero-norm rows are excluded naturally without
      an explicit guard." This contradicts the file-level JSDoc + the in-`get()` `isZeroNorm()`
      guard which EXPLICITLY corrected the claim to "PG NaN > all values per PG docs § 8.1.4 —
      SQL `>=` filter does NOT exclude NaN rows; it INCLUDES them; application-level guard required."
      Same is true for the docstring fragment "Cosine similarity = `1 - (a <=> b)` ... NaN filtering
      (EC-8): ... zero-norm rows are excluded naturally without an explicit guard" — directly false
      per the corrected understanding. A future reader removing the `isZeroNorm()` short-circuit
      "because the SQL already filters NaN" would silently reintroduce the EC-8 cache-poisoning bug.
    evidence: |
      File lines 22-27 (file-level JSDoc — CORRECT):
        > "PostgreSQL float comparisons treat NaN as greater-than all non-NaN values
        > (per `numeric.h` + docs § 8.1.4) — so the SQL filter `(1 - distance) >= threshold`
        > does NOT exclude NaN rows; it INCLUDES them. The plan's original claim
        > (mirror IEEE 754 short-circuit) was wrong for PG."
      File lines 65-68 (SQL constant comment — STALE / WRONG):
        > "NaN filtering (EC-8): when query_embedding has zero norm, distance is NaN
        > and `(1 - NaN) >= 0.8` evaluates false, so zero-norm rows are excluded
        > naturally without an explicit guard."
      And the EC-8 absorption text in plan v1.1 line 515 + edge-cases report line 111
      both also carry the SAME pre-absorption (wrong-for-PG) claim. The plan-side text is
      load-bearing for the test name `T1.1-RED-9 (EC-8)` whose assertion (`get` returns
      undefined for zero-norm) is correct for the wrong reason in the plan but correct for
      the right reason in the code.
    recommended_action: |
      (a) Update lines 65-68 of pgvector-recall-cache-store.ts to match the file-level
          JSDoc — explicitly state that PG NaN >= 0.8 evaluates TRUE (NOT FALSE), and that
          the SQL filter does NOT defend against zero-norm input; the application-level
          `isZeroNorm()` short-circuit at `get()` entry IS the defense.
      (b) Add an inline comment at the GET_SQL declaration referencing the
          `isZeroNorm()` guard at line 148-150 as the load-bearing barrier so future
          maintainers do not delete it.
      (c) Open a non-blocking follow-up to amend EC-8 description in
