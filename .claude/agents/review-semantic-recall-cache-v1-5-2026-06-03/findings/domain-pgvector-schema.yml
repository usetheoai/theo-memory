  - id: F-dom-pgvector-10
    severity: INFO
    file: src/local/recall-cache/pgvector-recall-cache-store.ts
    line: 70-76
    plan_ref: Cosine similarity SQL discipline
    domain_anchor: pgvector cosine distance operator semantics — `<=>` returns 1 - cosine_similarity in [0, 2]; lower distance = closer match
    summary: |
      The cosine similarity SQL formula `1 - (query_embedding <=> $2::vector)` is
      CORRECT per pgvector docs. `<=>` is cosine distance ∈ [0, 2]; `1 - distance`
      gives cosine similarity ∈ [-1, 1] (in practice [0, 1] for normalized vectors).
      `ORDER BY query_embedding <=> $2::vector ASC` orders ascending by distance,
      so the closest (highest similarity) row wins LIMIT 1. The combined
      `WHERE (1 - (...)) >= $3` + `ORDER BY ... ASC` discipline is canonical for
      pgvector cosine-similarity-with-threshold lookups. Recording as INFO to
      pin the validation that this is correct.
    evidence: |
      pgvector docs https://github.com/pgvector/pgvector#querying:
        "<=>  cosine distance"
        "Get the nearest neighbors to a vector: SELECT * FROM items ORDER BY embedding <=> '[3,1,2]' LIMIT 5;"
      L2-normalized vectors (LocalTransformerEmbedder normalizes; OpenAI returns
      already-normalized) yield cosine distance ∈ [0, 2], similarity ∈ [-1, 1].
      Threshold default 0.8 corresponds to "highly similar" (cos ≥ 0.8 → distance ≤ 0.2).
    recommended_action: None — formula and ordering are canonical.

  - id: F-dom-pgvector-11
    severity: INFO
    file: src/local/recall-cache/serializable-tx.ts
    line: 30-54
    plan_ref: EC-7 absorption (SERIALIZABLE tx + 1-retry-on-40001 for LRU race)
    domain_anchor: PostgreSQL SERIALIZABLE isolation contract — sqlstate 40001 (serialization_failure) raised on read-write dependency cycle detection; retry SHOULD work because the second attempt sees the committed first-tx state
    summary: |
      The SERIALIZABLE wrapper + single retry on `40001` is the canonical PG pattern
