  - id: F-arch-11
    severity: INFO
    file: src/local/recall-cache/serializable-tx.ts
    line: 1-54
    plan_ref: T1.2 — SERIALIZABLE transaction wrapper for EC-7 LRU race
    summary: |
      Single-purpose module (54 LoC). Wraps SERIALIZABLE isolation BEGIN/COMMIT/
      ROLLBACK with single-retry-on-40001 semantics. JSDoc explains the race
      (concurrent set on a full scope) + rationale for retry-once-not-backoff.
      Pure functional pattern. Strong SRP. The unreachable-throw at line 53 is
      a defensive belt-and-suspenders against control-flow refactors — acceptable.
    evidence: |
      ```ts
      const PG_SERIALIZATION_FAILURE = '40001';

      export async function withSerializableTransactionAndRetry<T>(...): Promise<T> {
        for (let attempt = 0; attempt < 2; attempt++) {
          const client = await pool.connect();
          try {
            await client.query('BEGIN ISOLATION LEVEL SERIALIZABLE');
            const result = await work(client);
            await client.query('COMMIT');
            return result;
          } catch (err) {
            await client.query('ROLLBACK').catch(() => undefined);
            const code = (err as { code?: string })?.code;
            if (attempt === 0 && code === PG_SERIALIZATION_FAILURE) continue;
            throw err;
          } finally { client.release(); }
        }
        throw new Error('... exhausted 2 attempts (unreachable)');
      }
      ```
    recommended_action: |
      INFO: no issues found.

