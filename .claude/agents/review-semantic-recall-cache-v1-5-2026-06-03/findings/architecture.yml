        // Honor includeSuperseded (default false). Skills always require kind='skill'.
        const filters: Filters = { ...this.filters, kind: 'skill', excludeSuperseded: ... };
        const results = await runRetrievalPipeline(query, filters, { ... }); // <-- NO cache wrap
      }
      ```
      No integration test in tests/integration/cache/ exercises memory.skills(repoId).recall.
    recommended_action: |
      Pick one of two paths:
