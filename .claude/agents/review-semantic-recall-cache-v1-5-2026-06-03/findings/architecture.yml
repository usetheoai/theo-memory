    file: src/core/dip/recall-cache-store.ts
    line: 69-74
    plan_ref: T0.1 ADR D3 + Blueprint § D3
    summary: |
      `ScopeTierTtlConfig.repo` is part of the 13th DIP's public contract surface
      but no code path in this cycle invokes the cache wrap for skill scope.
      `LocalScopedSkillMemory.recall()` (src/local/scoped-skill-memory.ts:118)
      runs `runRetrievalPipeline` directly with NO `recallCacheStore` wrap —
      the cache is wired only into `LocalScopedMemory.recall()` (the 3-tier path).
      The `repo` TTL value is therefore dead-code in the wire-up: a consumer
      passing `recallCache: { ttlSecondsByScopeTier: { repo: 7200 } }` will see
      that value never honored on `memory.skills(repoId).recall(...)`. This is
      a speculative contract surface (YAGNI violation per Inquebrável Rule 11)
      AND a consumer-expectation mismatch (Inquebrável Rule 3 honesty).
    evidence: |
      Contract surface (claims repo support):
      ```ts
      // src/core/dip/recall-cache-store.ts:69-74
      export interface ScopeTierTtlConfig {
        readonly user: number;
        readonly agent: number;
        readonly session: number;
        readonly repo: number;
      }
      ```
      DIP JSDoc:
      ```
      // line 20-22: TTL gated by scope-tier: user 24h / agent 1h / session 10min / repo 1h.
      //   `repo` is the skill-scope tier per ADR-0010 (the 4th tier added by v0.6;
      //   surfaced via `Memory.skills(repoId)`).
      ```
      Actual wiring (no cache on skill path):
      ```ts
      // src/local/scoped-skill-memory.ts:118-138
