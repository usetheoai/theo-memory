findings:
  - id: F-wire-1
    severity: MAJOR
    pillar: b
    file: src/local/index.ts
    line: 882-930
    plan_ref: T2.2 / Item 19 AC#3 / EC-10 — LocalMemory.forget() write-trigger invalidation hook
    summary: forget()-side cache invalidation hook is wired but lacks end-to-end integration coverage against real pgvector
    evidence: |
      LocalMemory.forget() at src/local/index.ts:922-929 calls `this.recallCacheStore.invalidateScope(scopeFromMemory)` post-delete, with deriveScopeFromPayload(existing.payload) feeding the scope.
      Unit coverage exists in src/local/__tests__/factory-recall-cache.test.ts:166-181 via the FakeCache double — but the path only verifies the call shape, NOT that:
        (a) deriveScopeFromPayload correctly extracts a tier from a REAL persisted memory row (the FakeCache test uses InMemoryVectorStore which never persists payloads through the same pipeline as PgvectorStore);
        (b) the scope-key derivation matches what PgvectorRecallCacheStore expects after a real remember → forget round-trip;
        (c) targeted invalidation actually removes the right rows from real recall_cache (vs the remember-side which IS covered by T2.2 integration test).
      The plan's Acceptance Criteria for T2.2 list "remember/forget/reflect hooks invalidate" — but the integration suite at tests/integration/cache/* only covers remember-side (factory-wiring.test.ts:107-134). No tests/integration/cache/forget-invalidation.test.ts exists.
      Risk: an EC-10 regression (e.g., deriveScopeFromPayload returns undefined for a payload shape we did not anticipate) would silently leave stale cache rows after forget(), violating Item 19 AC#3 in production while unit tests stay green.
    recommended_action: Add an integration test at tests/integration/cache/forget-invalidation.test.ts that exercises (1) remember → recall (populate cache) → forget(memoryId) → recall (must MISS / fresh data); (2) verify the recall_cache row for the scope is gone via raw `SELECT count(*) FROM recall_cache WHERE scope_key = ...`. Mirror the T2.2 factory-wiring pattern.
  - id: F-wire-2
    severity: MAJOR
    pillar: b
    file: src/local/index.ts
    line: 756-768
    plan_ref: T2.2 / EC-6 — LocalScopedMemory.reflect() write-trigger invalidation hook (post-persisted derived memories)
    summary: reflect()-side cache invalidation hook is wired but has ZERO test coverage — neither unit nor integration
    evidence: |
      LocalScopedMemory.reflect() at src/local/index.ts:761-768 calls `this.recallCacheStore.invalidateScope(this.scope)` when `persisted.length > 0`. The hook is gated by `persisted.length > 0` to avoid wasted DELETE calls when reflection yielded zero derived rows.
      Grep across the repo confirms ZERO tests exercise this path:
        $ grep -rn "reflect.*invalidateScope" tests/ src/local/__tests__/factory-recall-cache.test.ts → 0 matches
      Unit test factory-recall-cache.test.ts at T2.2 covers ONLY the remember-side hook (line 167-181) — there is no T2.2-RED-2-reflect, no T2.2-RED-3-forget. The integration suite at tests/integration/cache/* contains no reflect-cache test.
      Risk: a regression in reflect() that drops the cache-invalidation hook (e.g., refactor that moves the hook out of the try-block, OR that changes the `persisted.length > 0` gate) would not be caught. Reflect() produces semantically NEW memories that should invalidate the cached recall result for that scope (EC-6 absorption); silent staleness here would surface only as a hard-to-diagnose recall-quality regression.
    recommended_action: Add (1) a unit test in src/local/__tests__/factory-recall-cache.test.ts under "T2.2 — write-trigger cache invalidation hooks" that uses FakeCache + a stub reflection policy that returns ≥1 derived memory, asserts FakeCache.invalidateCalls includes the scope; (2) an integration test exercising `memory.user('alice').recall(...)` → populate → `memory.user('alice').reflect()` → assert `SELECT count(*) FROM recall_cache WHERE scope_key='user:alice' = 0`.
  - id: F-wire-3
    severity: MINOR
    pillar: b
    file: src/local/index.ts
    line: 1278-1322
    plan_ref: T5.1 — applyDimChange cascade to recall_cache (DROP INDEX + DELETE + ALTER + RECREATE INDEX inside BEGIN/COMMIT)
    summary: applyDimChange cache cascade is exercised only INDIRECTLY by T5.1 GOAL TEST; tests/integration/migrations/dim-change.test.ts does not specifically assert the recall_cache cascade
    evidence: |
      The dim-change cascade for recall_cache was extended in src/local/index.ts at lines 1278 (DROP INDEX), 1299-1304 (DELETE FROM with IF EXISTS guard), 1307-1312 (ALTER COLUMN TYPE with IF EXISTS guard), 1318-1323 (CREATE INDEX with IF EXISTS guard), inside the existing BEGIN/COMMIT block (lines 1275/1351).
      Coverage today:
        - tests/integration/migrations/dim-change.test.ts (10 test cases) has ZERO grep hits for "recall_cache" — only memories + entities are verified at post-ALTER canary;
        - tests/integration/cache/semantic-recall-cache.test.ts:90 calls `runMigrations(pool, { embeddingDim: 384 })` AS A PRECONDITION for the goal test, meaning the cascade IS executed at integration time and must succeed for T5.1 to pass — but the test does not specifically assert that recall_cache.query_embedding atttypmod === 384 post-migration, nor does it assert the IF EXISTS guards behave correctly on a pre-v1.5 DB (table missing) vs a post-v1.5 DB (table present).
      Risk: a future edit to applyDimChange that breaks the recall_cache cascade (e.g., omits the IF EXISTS guard so pre-v1.5 DBs fail) would surface as a T5.1 test failure (good) BUT NOT as a focused dim-change.test.ts failure. The test failure would point to "T5.1 timed out / first recall failed" rather than "ALTER recall_cache failed", making root cause less obvious.
    recommended_action: Add 2 test cases to tests/integration/migrations/dim-change.test.ts: (1) `recall_cache cascade: post-ALTER atttypmod of query_embedding === targetDim`; (2) `recall_cache cascade idempotent on pre-v1.5 DB (table absent): IF EXISTS guard skips DELETE/ALTER without raising`. Both should sit alongside the existing `post-ALTER canary: both memories AND entities columns verified at target dim inside the transaction` case (line 317).
  - id: F-wire-4
    severity: MINOR
    pillar: a
    file: src/local/recall-cache/index.ts
    line: 17-39
    plan_ref: T4.1 — `@usetheo/memory/cache-pg` subpath barrel (consumer-facing escape hatch)
    summary: cache-pg subpath barrel exports surface PgvectorRecallCacheStoreOptions + 3 metric resolvers BUT no first-party src/ caller imports through the subpath; consumer-facing utility unverified end-to-end
    evidence: |
      The subpath @usetheo/memory/cache-pg is registered at package.json#exports."./cache-pg" → ./src/local/recall-cache/index.ts. Verified.
      The barrel re-exports: PgvectorRecallCacheStore (used internally via dynamic import only), 3 metric resolvers (used internally via direct import + dynamic import), 4 DIP types (mirrored from @usetheo/memory/contract), and 4 defaults+validator.
      `grep -rn "from '@usetheo/memory/cache-pg'" src/ tests/ examples/` returns ZERO matches today.
      `tests/integration/subpath-isolation.test.ts:134-142` does smoke-import `../../src/local/recall-cache/index.js` (the relative path, NOT the subpath) and asserts the 5 known symbols + DEFAULT_THRESHOLD === 0.8 — this validates that the BARREL FILE is loadable, but does NOT validate that the subpath RESOLVES from a consumer's package.json perspective (a published-package smoke).
      This is consistent with the cycle's positioning (consumers building custom wiring would use the subpath; v1.5.0 ships the primary surface as the factory POJO path). The risk is low — but a future package.json#exports tweak that breaks the subpath path resolution would not be caught.
    recommended_action: Add a tiny test at tests/integration/publish-readiness.test.ts (or sibling) that, on a `npm pack --dry-run`, asserts the cache-pg subpath entry resolves to src/local/recall-cache/index.ts and that the entry resolves through Node's package exports algorithm. This is a one-liner via require.resolve in a CJS sandbox OR a Node loader smoke. Optional — accept as deferred if v1.5.x ships a real consumer of the subpath that would smoke-test the resolution path organically.
  - id: F-wire-5
    severity: MINOR
    pillar: b
    file: src/local/index.ts
    line: 311-326
    plan_ref: T2.2 / EC-10 — deriveScopeFromPayload helper for forget()-side targeted invalidation
    summary: deriveScopeFromPayload returns undefined for the "no recognizable tier" case, but no test exercises this fallback path
    evidence: |
      deriveScopeFromPayload at src/local/index.ts:311-326 returns undefined when payload lacks user_id / session_id / agent_id. The caller at line 922 then short-circuits the invalidateScope call (`scopeFromMemory !== undefined` gate) — cache continues serving stale results bounded by TTL.
      grep across tests confirms ZERO tests exercise (a) deriveScopeFromPayload directly, or (b) the forget-path branch where scopeFromMemory === undefined.
      Risk: malformed or pre-v0.1 payloads silently bypass invalidation. The docstring at line 308-310 says "When the row is too old or malformed to carry a recognizable tier, return `undefined` so the caller can no-op" — but if the regex/field names ever drift (e.g., scope persisted under "user-id" instead of "user_id"), every modern row would silently fall through to the undefined branch and the cache would never be invalidated on forget.
    recommended_action: Add unit test cases (no DB needed): (a) `deriveScopeFromPayload({ user_id: 'alice' })` → `{ kind: 'user', userId: 'alice' }`; (b) `deriveScopeFromPayload({ session_id: 's1', user_id: 'alice' })` → `{ kind: 'session', sessionId: 's1' }` (specificity ordering); (c) `deriveScopeFromPayload({})` → undefined; (d) `deriveScopeFromPayload({ user_id: '' })` → undefined (empty string guard). The helper is currently un-exported — also consider exporting it from src/local/index.ts OR moving it to a sibling file so the test can import it without touching the public surface.

