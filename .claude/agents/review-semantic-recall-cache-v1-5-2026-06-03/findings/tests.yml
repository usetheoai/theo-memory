  - id: F-tests-2
    severity: CRITICAL
    file: src/local/__tests__/factory-recall-cache.test.ts
    line: "166-182 (T2.2 describe block)"
    plan_ref: "plan v1.1 § T2.2 — EC-10 (SHOULD TEST absorbed) + T2.2-RED-8 + T2.2-RED-9"
    summary: "EC-10 forget() scope-derivation strategy (SELECT scope_key + fallback to invalidateAll on not-found) NOT TESTED"
    evidence: |
      Plan T2.2 Acceptance Criteria § EC-10 absorption (concrete decision):
        "forget() scope derivation: `SELECT scope_key FROM memories WHERE id = $memoryId`
         BEFORE the DELETE; invalidate ONLY the derived scope. Fallback: if memory
         not found (already-deleted or invalid id), call `invalidateAll()` as
         conservative safety net."
      Plan T2.2 TDD RED list:
        T2.2-RED-8 — forget() scope derivation: SELECT scope_key FROM memories
                     WHERE id=$1; invalidate ONLY that scope (not all)
        T2.2-RED-9 — forget(memoryId) when memory NOT found (already deleted) →
                     invalidateAll() fallback
      No test exercises `memory.forget(memoryId)` at all in the cache test
      surface. The not-found fallback path is completely untested — a regression
      that turns the fallback into a no-op (silent drop) would not be caught.
    impact: |
      The fallback-to-invalidateAll branch is the CONSERVATIVE SAFETY NET for
      a real-world bug class (forget against a stale id, race against a
      concurrent delete). If this branch silently regresses to "do nothing",
      the cache would serve stale results for the wrong scope without any
      surface indication. This violates Inquebrável Rule 3 (Honesty —
      correctness over silent regression).
    recommended_action: |
      Add to tests/integration/cache/factory-wiring.test.ts:
        it('T2.2-RED-8 (EC-10) — forget(memoryId) invalidates ONLY the scope where the memory lived', ...);
        it('T2.2-RED-9 (EC-10 fallback) — forget(non-existent-id) falls back to invalidateAll', ...);
      The fallback test should pre-warm 2 scopes, call forget() on a UUID that
      does not exist, and assert both scopes were cleared (conservative safety
      net behavior).

