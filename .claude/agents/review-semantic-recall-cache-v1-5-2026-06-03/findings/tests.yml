skipped_or_only_audit:
  status: CLEAN
  evidence: "grep -c '\\.only\\|xit\\|xtest\\|\\.skip[^I]' across all 12 cache test files returned 0 in every file. describe.skipIf(ROOT_PG_URI === '') is the environment-conditional pattern documented as acceptable per v0.7 plan precedent — gates integration tests when THEOMEM_PG_URI is absent (CI hygiene). NOT a code smell."

flakiness_audit:
  status: MOSTLY_DETERMINISTIC_WITH_TIME_DEPENDENCIES
  observations:
    - "setTimeout(2000) waits for Postgres TTL expiry in cache-hit-miss.test.ts:127, cache-hit-miss.test.ts:146, semantic-recall-cache.test.ts:143. Necessary because pgvector NOW() cannot be frozen from JS-side via vi.useFakeTimers. Risk: heavily loaded CI runners + 2s sleep + 10s test timeout = tight margin. Mitigation: test timeout is 10_000ms explicitly. Acceptable per testing.md trade-off."
    - "setTimeout(5ms) spacer in lru-eviction.test.ts:87 — flagged at F-tests-10. Low but non-zero flake risk."
    - "Promise.all([set, set, set]) under SERIALIZABLE in lru-eviction.test.ts:124-128 — the SERIALIZABLE + retry-once helper is the correctness mechanism; failure mode under high contention is 'retry exhausted → throws'. Test asserts the success path; the throw path is not asserted. Cross-cutting concern with F-tests-3 (no MVCC consistency test)."
    - "Model download in semantic-recall-cache.test.ts is gated by 300_000ms timeout — generous, accounts for first-run @xenova/transformers Wasm fetch."

aaa_format_audit:
  status: PASS
  notes: |
    Sampled across the 12 test files: every it()/test() block follows
    Arrange-Act-Assert with the arrange block typically scoping setup to the
    block itself (no module-level shared mutable state). beforeEach/afterEach
    used for DB truncation + spy restoration only — acceptable per the
    Given-When-Then example in testing.md:45-59.

behavior_vs_implementation_naming:
  status: MOSTLY_BEHAVIOR
  notes: |
    Plan-tagged tests like 'T0.1-RED-N — accepts threshold = 0.8 ... (defaults
    pass)' describe the behavior post the dash. The T*-RED-N prefix is the
    traceability tag, not the test description per se. Pattern matches
    testing.md style (behavior-focused names with a contract reference).
    The 'T1.2-RED-5b' suffix variant is a deliberate split of a single RED
    bullet into positive (retry on 40001) + negative (no retry on 23503)
    — good practice.

