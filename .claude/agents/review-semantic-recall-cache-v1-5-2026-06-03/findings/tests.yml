  - id: F-tests-4
    severity: MAJOR
    file: src/local/__tests__/factory-recall-cache.test.ts
    line: "166-182"
    plan_ref: "plan v1.1 § T2.2 — EC-11 (SHOULD TEST absorbed) + T2.2-RED-10"
    summary: "EC-11 sequential-await discipline (remember/forget/reflect AWAIT invalidateScope before returning) NOT TESTED"
    evidence: |
      Plan T2.2 Acceptance Criteria § EC-11 absorption:
        "remember/forget/reflect AWAIT `invalidateScope()` before returning —
         no fire-and-forget. Sequential discipline prevents in-flight cache-hit
         serving stale post-write."
      Plan T2.2-RED-10 (EC-11):
        "remember() awaits invalidateScope BEFORE returning (sequential
         discipline); test: pre-warm cache; await memory.remember('...');
         cache.get() immediately after MUST return undefined"
      The current T2.2-RED-1 only asserts that invalidateScope WAS CALLED with
      the right scope (via FakeCache.invalidateCalls). It does NOT assert the
      ORDER — specifically, that the call completed BEFORE memory.remember()
      resolved. A regression that changes the hook to fire-and-forget
      (`void this.recallCacheStore.invalidateScope(...)`) would still pass
      T2.2-RED-1.
    impact: |
      A fire-and-forget invalidation introduces a race: a concurrent recall()
      after a remember() RESOLVED could observe the OLD cache row (the
      invalidation is still in flight). Item 19 AC#3 ("write to scope → next
      recall MUST miss") would be silently violated for the millisecond
      window where the invalidation hasn't landed. Plan v1.1 absorbed this
      explicitly; test was not delivered.
    recommended_action: |
      Add to factory-recall-cache.test.ts T2.2 describe block:
        test('T2.2-RED-10 (EC-11) — remember() awaits invalidateScope BEFORE resolving', async () => {
          let invalidateResolved = false;
          const cache = makeFakeCache();
          cache.invalidateScope = async (scope) => {
            await new Promise((r) => setTimeout(r, 50)); // simulate slow invalidation
            invalidateResolved = true;
            return 1;
          };
          const memory = await createLocalMemory(baseConfig(cache));
          await memory.user('alice').remember('I like dark mode');
          // The await above MUST have observed invalidateResolved=true before resolving.
          expect(invalidateResolved).toBe(true);
        });

