  - id: F-tests-10
    severity: MINOR
    file: tests/integration/cache/lru-eviction.test.ts
    line: 87
    plan_ref: "testing.md § Determinism"
    summary: "5ms setTimeout used to spread created_at across rows — relies on host clock precision"
    evidence: |
      for (let i = 0; i < SMALL_CAP; i++) {
        await store.set(vec(i + 1), ALICE, SAMPLE, 600);
        await new Promise((r) => setTimeout(r, 5));  // <-- timing-dependent
      }
    impact: |
      Postgres timestamptz precision is microseconds; INSERTs from a tight
      loop without the spacer could collide in `created_at`. With the 5ms
      spacer, collisions are extremely rare but NOT impossible on a heavily
      loaded CI runner. If two rows share an exact timestamp, "oldest" is
      ambiguous and the post-eviction check at line 96-100 could pick a
      different row than expected. Probability is low; if observed, this
      becomes a flaky-test bug per testing.md § Determinism.
    recommended_action: |
      Either (a) make the test deterministic by explicitly setting created_at
      via SQL UPDATE before the eviction-triggering set() — eliminates clock
      dependency, OR (b) accept current risk and document in a comment that
      the 5ms spacer is empirical; suggest bumping to 25ms if any flake is
      observed in CI.

