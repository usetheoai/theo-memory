      Plan v1.1 absorbed this as a convention; one of the new tests violates
      the convention.
    recommended_action: |
      Refactor the regression smoke to use vi.spyOn(process.stderr, 'write')
      in a top-level beforeEach + afterEach for the describe block (or scoped
