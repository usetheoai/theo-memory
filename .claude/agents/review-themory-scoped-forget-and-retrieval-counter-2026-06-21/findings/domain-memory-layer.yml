  bypass/hit/miss. (5) counter semantic counts HIT path too — matches "recall()
  calls tracked per scope". (6) bi-temporal soft-delete (t_invalid + IS NULL guard)
  preserved; hard delete cascades via verified 0018/0019 FKs (EC-1). One INFO-level
  awareness note (F-dom-5): a hypothetical two-tier SDK scope would key-split the
  counter vs single-tier metrics read, but the plan's consumer is the single-tier
  REST/gateway path where the metric is correct — not a defect of this diff.
