    assessment: "Intentional + documented (in-memory has no soft-delete column, so soft==hard is a correct semantic). Acceptable. Minor honesty nit: dropping the param rather than accepting `_hard: boolean` makes the contract-conformance less explicit at the call site, but it is harmless — the in-memory adapter is unit-test-only and bundle-isolation-safe."
    recommended_action: "Optional: accept `_hard: boolean` in the in-memory signature to make interface conformance explicit (matches the synthetic stub in vector-store.test-d.ts which also returns false). No functional impact; do not block."

