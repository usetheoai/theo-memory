findings:
  - id: F-xval-1
    severity: LOW
    file: tests/integration/scoped-forget.test.ts, tests/integration/scope-usage-counter.test.ts
    plan_ref: "T1.1 Files-to-edit (line 188: packages/core/src/infrastructure/db/scoped-memory.test.ts), T1.2 (line 272: scoped-forget.test.ts co-located), T2.1/T2.2/T2.3 (co-located *.test.ts), Final Phase (line 609: tests/integration/scoped-forget-and-counter.test.ts)"
    summary: "Test-file location diverged from plan: plan declared co-located unit test paths (e.g. scoped-memory.test.ts, pg-usage-counter-store.test.ts, metrics.test.ts) but all RED tests landed under tests/integration/ (scoped-forget.test.ts, scope-usage-counter.test.ts) + the API contract test extended metrics-entities.test.ts. The plan's single named GOAL file tests/integration/scoped-forget-and-counter.test.ts does NOT exist — it was split into scoped-forget.test.ts (Goal a) + scope-usage-counter.test.ts (Goal b)."
    evidence: |
      Plan T1.1 line 188: "packages/core/src/infrastructure/db/scoped-memory.test.ts — RED tests first" — file not created; tests in tests/integration/scoped-forget.test.ts.
      Plan Final Phase lines 48,609: "tests/integration/scoped-forget-and-counter.test.ts (NEW) — GOAL test" — file absent; two files cover (a)+(b).
      `ls tests/integration/scoped-forget-and-counter.test.ts` -> not found.
    assessment: "JUSTIFIED divergence, not an unfixed gap. The feature is genuinely scope-checked against a REAL Postgres (single-SQL workspace+tier WHERE) — a co-located unit test with a mocked store could only assert the wrapper calls deleteInScope, NOT that the SQL actually scope-isolates. Integration tests against ankane/pgvector are the CORRECT and stronger choice for this surface (mirrors the project's existing integration-heavy convention for SQL primitives). The GOAL split is cosmetic — both goals are proven at the e2e/REST layer. No ADR was written for the naming divergence; the implementation contract documents it. Recommend a one-line note in the implementation md (already largely covered)."
    recommended_action: "Accept the divergence; optionally add an explicit line in the implementation contract that the plan-named scoped-forget-and-counter.test.ts was realized as two integration files. No code change required."

