  - id: F-xval-4
    severity: LOW
    file: packages/core/src/infrastructure/db/in-memory-store.ts:208
    plan_ref: "T1.1 Pseudo-code (line 209) declares deleteInScope(id, filters, hard); VectorStore interface (vector-store.ts:139) requires 3 params"
    summary: "InMemoryVectorStore.deleteInScope is implemented with 2 params (vectorId, filters) — it silently drops the `hard` param the interface declares. TS structural typing allows the narrower impl (method param bivariance), so typecheck passes, but the in-memory adapter ignores `hard` entirely."
    evidence: |
      interface: deleteInScope(vectorId: string, filters: Filters, hard: boolean): Promise<boolean>  (vector-store.ts:139)
