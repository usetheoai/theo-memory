findings:
  - id: F-dom-api-1
    severity: INFO
    file: packages/api/src/server/handlers/metrics.ts
    line: 92
    plan_ref: ADR D3 (recall increment fail-soft) + ADR D4 (0-fallback when store absent)
    domain_anchor: "rules/architecture.md § 8 (error handling) + Princípio 3 (auditable); entities.ts:76-89 precedent"
    summary: >
      Read/write fail-soft asymmetry on the SAME counter. The recall() WRITE side is
      fail-soft (a counter increment failure NEVER fails the user's recall, per D3,
      with a retrieval_counted_failed OTel event). The metrics READ side is NOT
      fail-soft: usageCounterStore.getRecallCount is awaited without try/catch, so a
      transient counter-DB blip turns the WHOLE metrics endpoint into a 500 — even
      though total_memories / entity_count / add_events are computed independently from
      getAll() and would still be servable. This is CONSISTENT with the accepted
      entities-handler precedent (entities.ts deliberately propagates a port rejection
      to app.onError→500 rather than masking it as []), so it is acceptable as shipped
      and NOT a blocker. Flagging only so the asymmetry is a conscious choice on record.
    evidence: |
      ```ts
      // metrics.ts:91-99 — no try/catch; a throw escapes to app.onError → 500
      let retrievalApiUsage = 0;
      if (usageCounterStore !== undefined) {
        const principal = c.get('principal') as Principal | undefined;
        const workspaceId = principal?.workspaceId ?? DEFAULT_WORKSPACE_ID;
        retrievalApiUsage = await usageCounterStore.getRecallCount({
          workspace_id: workspaceId,
          ...filtersFor(typeParse.data, id),
        });
      }
      ```
    recommended_action: >
      No change required (matches entities precedent + the plan's honest-error stance).
      OPTIONAL future hardening if the metrics endpoint must degrade gracefully:
      wrap getRecallCount in try/catch and fall back to retrieval_api_usage:0 with a
      WARN/OTel event, so a counter outage does not blank the other 3 KPIs the gateway
      still needs. Defer to a follow-up; document the choice in the metrics JSDoc.
  - id: F-dom-api-2
    severity: INFO
    file: packages/api/src/server/openapi-registration.ts
    line: 207
    plan_ref: T1.2 — OpenAPI registers the DELETE path; D5 backward-compat
    domain_anchor: "rules/architecture.md § 9 (public API surface) — documented + typed"
    summary: >
      OpenAPI DELETE registration documents 204/404/422 but omits the 429 (rate-limit)
      response, even though app.delete('/v1/scopes/*', rateLimitMiddleware('write'))
      gates this path. The sibling GET scope paths in the same registry also omit 429,
      so this is CONSISTENT with the existing registry convention (not a regression and
      not specific to this change). Param schema (type:ScopeTypeEnum, id:min(1),
      memId:uuid) and query (hard:enum['true','false'].optional) are accurate and match
      the handler's validation exactly. Status-code documentation is otherwise correct
      and complete for the handler's own returns.
    evidence: |
      ```ts
      // openapi-registration.ts:198-213 — responses document 204/404/422; no 429.
      responses: {
        204: { description: 'Deleted (or already absent in scope).' },
        404: { description: 'Not found in this scope / workspace (no existence leak).' },
        422: { description: 'memId is not a UUID.' },
      },
      ```
    recommended_action: >
      Optional/cosmetic: add a 429 response to the DELETE (and, for parity, the GET
      scope paths) in a documentation-only follow-up. Not blocking — matches the
      established registry convention.
notes: |
  POSITIVE FINDINGS (domain checks that PASS — mandatory per anti-pattern #5 honesty):

  1. Endpoint shape matches the plan contract EXACTLY (Objective + ADR D1/D5):
     DELETE /v1/scopes/:type/:id/memories/:memId with ?hard=true.

  2. Status codes correct and complete:
     - type not in {user,session,agent} (incl. skill) → c.notFound() (404). CORRECT
       per D5 "skill type → 404 keeps the surface minimal".
     - memId not a UUID → 422 {code:'INVALID'} (malformed request, distinct from
       not-found). CORRECT — z.string().uuid().safeParse guard.
     - cross-scope / cross-workspace / missing → 404 via MemoryNotFound|WorkspaceMismatch,
       NEVER 403 — no existence leak. CORRECT — verbatim mirror of forget.ts:44-46.
     - success → c.body(null, 204). CORRECT (empty body, 204 No Content for DELETE).
     - subject from PATH, workspace from credential via workspaceBoundMemory; body never
       read (DELETE) → no IDOR. CORRECT (Deep Dive invariant honored).
     - ?hard query: `c.req.query('hard') === 'true'` exact match; anything else (incl.
       "false") → soft. CORRECT per Edge note.

  3. metrics.ts retrieval_api_usage now REAL via usageCounterStore?.getRecallCount;
     4-field response shape {total_memories, entity_count, add_events, retrieval_api_usage}
     byte-IDENTICAL — contract-tested via Object.keys(body).sort() equality
     (metrics-entities.test.ts). total_memories/entity_count/add_events UNCHANGED
     (still getAll-derived). 0-fallback when store absent is tested. CORRECT.

  4. READ key == WRITE key (EC-3) — VERIFIED end-to-end:
     - WRITE: recall handler → workspaceBoundMemory (workspaceId = principal?.workspaceId
       ?? DEFAULT_WORKSPACE_ID) → withWorkspace → filtersFromScope → this.filters →
       PgUsageCounterStore.increment normalizes workspace_id ?? 'default'.
     - READ: metrics.ts uses principal?.workspaceId ?? DEFAULT_WORKSPACE_ID + filtersFor
       (single-tier) → getRecallCount normalizes workspace_id ?? 'default'.
     - DEFAULT_WORKSPACE_ID === 'default' (principal.ts:84), identical to the store's
       'default' normalization. The ON CONFLICT arbiter, the getRecallCount WHERE, and
       the UNIQUE index all use the same COALESCE(col,'') idiom. Keys agree → the metric
       cannot be split. CORRECT (EC-3 fully closed).

  5. AppOptions.usageCounterStore?: UsageCounterStore mirrors AppOptions.memoryEntityStore
     (optional, JSDoc'd, threaded to metricsHandler). Backward-compatible: POST /v1/forget
     UNCHANGED; the option is optional → existing createServer callers compile + behave
     identically; metric reports 0 when omitted. CORRECT (D4 + D5).

  6. getRecallCount non-fail-soft (throw→500) is ACCEPTABLE — it matches the entities
     handler precedent (entities.ts:76 "A port rejection propagates → the app onError
     maps it to 500, never a masked []"). app.onError ships a sanitized 500 envelope
     (app.ts:362). See F-dom-api-1 for the read/write asymmetry note (non-blocking).

  7. rate-limit method-scoped: app.delete('/v1/scopes/*','write') does NOT disturb the
     existing app.get('/v1/scopes/*','read') limiter; CORS allowMethods already includes
     DELETE (app.ts:239). CORRECT.

  VERDICT (domain api-design): No HIGH or BLOCKER findings. The REST surface is
  correct, backward-compatible, status-code-accurate, leak-free (404-not-403), and the
  metrics shape/keys are preserved and contract-tested. Both findings are INFO-grade.
