plan: .claude/knowledge-base/plans/themory-scoped-forget-and-retrieval-counter-plan.md
summary_verdict: |
  Architecturally sound. DIP/ISP clean (UsageCounterStore 2-method port in domain,
  PgUsageCounterStore impl in infrastructure, factory injects; domain never imports
  the impl). The recall() -> retrieveResults() extraction is behavior-preserving (the
  entire prior recall body moved verbatim; only the asOf validation stays in the outer
  wrapper, before the fail-soft counter increment). EC-3 normalization is byte-identical
  across the UNIQUE index, the ON CONFLICT arbiter, and the getRecallCount WHERE; the
  workspace_id 'default' fallback agrees on write (recall) and read (metrics). No `any`,
  no new console.log, naming hygiene OK. Two real findings worth fixing: a DRY violation
  (scope-type mapping duplicated across two handlers — the plan's own REFACTOR step
  anticipated extracting it) and an SRP/coupling concern (the usage counter is gated
  behind `entityBoost`, an orthogonal concern). The rest are LOW/INFO.
findings:
  - id: F-arch-1
    severity: MEDIUM
    file: packages/api/src/server/handlers/scoped-forget.ts
    line: 21
    plan_ref: T1.2 TDD "REFACTOR: share pathParamsToScoped/scope-type enum with metrics.ts if duplicated (extract to _scope-params.ts)"
    summary: DRY violation — SCOPE_TYPES / ScopeTypeSchema / ScopeType / pathParamsToScoped duplicated verbatim between scoped-forget.ts and metrics.ts; the plan's own REFACTOR step prescribed extracting to a shared module and it was skipped.
    evidence: |
      scoped-forget.ts:21-34
      ```ts
      const SCOPE_TYPES = ['user', 'session', 'agent'] as const;
      const ScopeTypeSchema = z.enum(SCOPE_TYPES);
      type ScopeType = (typeof SCOPE_TYPES)[number];
      function pathParamsToScoped(memory: Memory, type: ScopeType, id: string): ScopedMemory {
        switch (type) { case 'user': return memory.user(id); ... }
      }
      ```
      metrics.ts:38-51 — byte-identical SCOPE_TYPES, ScopeTypeSchema, ScopeType, pathParamsToScoped.
      This is duplicated KNOWLEDGE (the scope-type -> scoped-memory routing), now present in 2 handlers (entities.ts/graph.ts/scopes.ts resolve the same concept too). The Rule-of-3 is met. The plan's T1.2 REFACTOR explicitly named the fix ("extract to _scope-params.ts"); the commit landed the handler without it.
    recommended_action: Extract SCOPE_TYPES + ScopeTypeSchema + ScopeType + pathParamsToScoped into packages/api/src/server/handlers/_scope-params.ts and import from both metrics.ts and scoped-forget.ts (and migrate the other scope handlers opportunistically). Single source of truth for the scope-tier routing.
  - id: F-arch-2
    severity: MEDIUM
    file: packages/core/src/infrastructure/db/factory.ts
    line: 182
    plan_ref: ADR D4 ("UsageCounterStore wired behind the same entityBoost/PgvectorStore factory gate")
    summary: SRP/coupling — the recall usage counter is wired ONLY when `config.entityBoost !== false`, coupling an orthogonal billing/usage concern to the entity-extraction feature flag. A consumer who disables entityBoost on the pg runtime silently gets retrieval_api_usage stuck at 0.
    evidence: |
      factory.ts:181-196
      ```ts
      const baseConfig: LocalMemoryConfig =
        config.entityBoost !== false && config.vectorStore instanceof PgvectorStoreClass
          ? { ...config,
              entityExtractor: ...,
              memoryEntityStore: ...,
              memoryGraphStore: ...,
              usageCounterStore: config.usageCounterStore ?? new PgUsageCounterStore(config.vectorStore.poolForEviction),
            }
          : config;
      ```
      `entityBoost` controls entity extraction (ADR-0007). The recall counter has nothing to do with entities — it is per-scope API-usage accounting. Bundling it in the same conditional means `createLocalMemory({ entityBoost: false })` on a real pg pool produces a metrics endpoint that under-reports retrieval_api_usage as 0 forever, even though the pool exists. The honest 0-fallback (D4) is intended for the in-memory adapter, not for a pg consumer who merely turned off entity boost.
    recommended_action: Gate usageCounterStore on the PgvectorStore-instance check ALONE (the only true prerequisite is the pool), independent of `entityBoost`. e.g. wire it whenever `config.vectorStore instanceof PgvectorStoreClass`, defaulting `config.usageCounterStore`. If the coupling is intentional, document it as a known limitation in the metrics JSDoc + ADR D4 consequences (currently neither says "0 also when entityBoost:false on pg").
  - id: F-arch-3
    severity: LOW
    file: packages/api/src/server/openapi-registration.ts
    line: 207
    plan_ref: T1.2 Acceptance "OpenAPI registers the DELETE path"
    summary: OpenAPI 204 description says "Deleted (or already absent in scope)" but the handler returns 404 (not 204) for an id absent in scope; the doc misdescribes the not-found contract.
    evidence: |
      openapi-registration.ts:
      ```ts
      204: { description: 'Deleted (or already absent in scope).' },
      404: { description: 'Not found in this scope / workspace (no existence leak).' },
      ```
      But scoped-forget.ts maps MemoryNotFound (which deleteInScope raises on 0-row match incl. already-soft-deleted, EC-4) to 404, never 204. "already absent in scope" yields 404, not 204. The 204 description is misleading for consumers reading the spec.
    recommended_action: Change the 204 description to "Deleted." and let the 404 row cover the absent/cross-scope case (it already does). Keeps the published contract truthful.
