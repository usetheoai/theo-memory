    summary: LSP nuance — InMemoryVectorStore.deleteInScope drops the `hard` parameter and always physically deletes, diverging from the VectorStore.deleteInScope(…, hard) contract semantics (soft vs hard). Documented in JSDoc, so acknowledged, but a hard/soft-sensitive consumer test against in-memory cannot distinguish the two.
    evidence: |
      in-memory-store.ts:207
      ```ts
      async deleteInScope(vectorId: string, filters: Filters): Promise<boolean> { ... this.rows.delete(vectorId); ... }
      ```
      vs vector-store.ts:139 `deleteInScope(vectorId, filters, hard): Promise<boolean>`. The omitted 3rd param is legal in TS (fewer params is assignable), and the interface JSDoc explicitly states "stores without t_invalid physically delete regardless of hard". This is a contract-acknowledged divergence (in-memory has no soft-delete model), so it is not a defect — flagged INFO-grade for completeness.
    recommended_action: None required (acknowledged in the interface JSDoc). Optionally accept `_hard: boolean` in the signature to make the no-op explicit and keep arity parity with the port.
