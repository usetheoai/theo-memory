pool_identity_verification:
  result: CONFIRMED
  detail: |
    run-server.ts builds ONE pool (:122) -> wireMemoryFromPool(pool) (:157) ->
    new PgvectorStore(pool) (agent-tools-memory.ts:166). Factory auto-wires the
    increment counter as new PgUsageCounterStore(config.vectorStore.poolForEviction)
    (factory.ts:194); poolForEviction getter returns this.pool (pgvector-store.ts:285)
    == the same pool. run-server SEPARATELY injects new PgUsageCounterStore(pool)
    into createServer for the metrics READ (run-server.ts:247) — SAME pool object.
    Therefore the counter recall() increments IS the counter metrics reads. The
    GOAL test mirrors this exact shape (one pool for both factory + createServer).

