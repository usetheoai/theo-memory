domain_specific_patterns_checked:
  - "migration additive-only (CREATE TABLE, no DROP/ALTER of existing tables)"
  - "drizzle journal sync (meta/_journal.json idx 20 + 0020_snapshot.json) so migrate() applies, not skips"
  - "drizzle schema.ts pgTable column types (uuid PK, text scope cols, bigint mode:number, timestamptz)"
  - "UNIQUE index COALESCE expression on (workspace_id, COALESCE(user_id,''), COALESCE(session_id,''), COALESCE(agent_id,''))"
  - "EC-3 expression-equivalence: ON CONFLICT arbiter + getRecallCount WHERE == UNIQUE index expression"
  - "deleteInScope raw SQL soft (UPDATE t_invalid WHERE ... AND t_invalid IS NULL) + hard (DELETE) scope+workspace WHERE"
  - "SQL-injection safety (parameterized values; column names from hardcoded const array)"
  - "EC-1 FK ON DELETE CASCADE on memory_entities.memory_id + entity_edges.source_memory_id (no FK violation on hard delete)"
