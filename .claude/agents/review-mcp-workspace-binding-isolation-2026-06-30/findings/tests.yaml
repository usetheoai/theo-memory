  BLOCKER: 0
  HIGH: 0
  MEDIUM: 1
  LOW: 4
  INFO: 0

verdict_input: >
  No BLOCKER/HIGH. The shipped #82 fix is well-tested at unit + integration level and all
  previously-flagged scenarios are present. The 1 MEDIUM (F-tests-1) is a regression-durability
  gap, not a current hole: production passes the invariant today but no test locks it. Recommend
  adding the structural "no bare memoryFactory" guard before merge; the LOWs are advisory.
