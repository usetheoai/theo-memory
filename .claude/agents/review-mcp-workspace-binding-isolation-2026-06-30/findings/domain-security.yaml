agent: review-mcp-workspace-binding-isolation-domain-security
review_target: main..HEAD for plan mcp-workspace-binding-isolation (theo-memory#82, CWE-441 / IDOR / tenant isolation)
domain: security
domain_specific_patterns_checked:
  - "CWE-441 both-halves (edge strips key + service enforces per-tenant scope)"
  - "workspace_id == tenant_id outer anchor bound at every memory-op site"
  - "Principal resolved from credential, never trusted from body/header (theo-data invariant 3 / ADR D2)"
  - "fail-closed completeness (resolvePrincipal null/blank -> 401, backend throw -> 503, verify-only -> 401)"
  - "workspaceScopedMemory single-tenant passthrough unreachable on the api-keys path"
  - "openmemory delete IDOR per-user guard preserved + workspace-bound"
  - "no secret/token logging on the new resolve_principal_failed warn path"
  - "prove isolation through the REAL edge (theo-data invariant 6)"

verdict_summary: >
  At the CODE level the cross-tenant leak #82 is CLOSED on the api-keys streamable-HTTP path
  the gateway exploits, with no residual bypass: all 12 memory-op sites are workspace-bound via
  the single workspaceScopedMemory seam (grep confirms zero bare deps.memoryFactory() at a
  memory op), the workspace is sourced ONLY from the auth-resolved Principal (symbol-keyed
  request property, never a client header), and every fail-closed branch (null/blank
  workspace -> 401, backend throw -> 503, verify-only verifier -> 401) is present and tested.
  An integration test proves cross-tenant recall=0 + cross-workspace forget-safe through real
  pgvector exercising the exact dispatch->withWorkspace path. Residual items are all OUT of
  #82's gateway reach (OIDC/SSE), but two deserve honest flagging: the OIDC/auth=both branch
  is NOT fail-closed (silently serves the default workspace), and the load-bearing LIVE
  edge-isolation proof (invariant 6) was not completed (the named evidence file is missing).

findings:
  - id: F-sec-1
    severity: MEDIUM
    file: packages/mcp/src/auth/with-bearer-auth.ts
    line: 213
    plan_ref: ADR D4 — OIDC workspace mapping deferred
    domain_anchor: "theo-data CLAUDE.md invariant 5 (fail closed) + invariant 3 (resolve a Principal)"
    summary: >
      OIDC / auth=both branch delegates WITHOUT binding a workspace -> every OIDC-authenticated
      request collapses to the `default` workspace, NOT fail-closed. In a multi-tenant OIDC
      deployment this is a silent cross-tenant read (every tenant reads the default bucket).
    evidence: |
      Path B (line 213-217):
        if (opts.oidc && (await opts.oidc.verify(token))) {
          await delegate(req, res);   // <-- no attachWorkspace(...) call
          return;
        }
      Downstream, scopeFromRequest (streamable-http.ts:77-85) finds no auth-attached workspace,
      so getScope().workspaceId is undefined and workspaceScopedMemory passes the UNBOUND memory
      through (workspace-scoped-memory.ts:33). resolveBearerAuth wires a real OidcAuthVerifier in
      both `oidc` and `both` modes (run-mcp-server.ts:393-405), so this branch is live, not dead.
      HONEST GATEWAY-REACH ASSESSMENT: the Model B gateway mints `theo_live_*` api-keys, never
      OIDC bearers, so this is OUT of #82's gateway reach — but it is a real residual hole for a
      direct `--auth=oidc|both` multi-tenant deployment, and unlike the api-keys path it does not
      fail closed. Deferral is documented (CHANGELOG Security; implementation summary § Scope
      deferrals) so this is an acknowledged-but-not-yet-mitigated gap, not a hidden one.
    recommended_action: >
      Until OIDC->workspace mapping ships, fail closed on the OIDC path rather than serve the
      default workspace: either reject auth=oidc|both at startup as unsupported-for-multi-tenant,
      or per-request 401/403 when an OIDC token resolves no workspace (mirror the EC-1 blank-
      workspace 401). At minimum, file the D4 follow-up issue and ensure it explicitly names
      "OIDC / auth=both multi-tenant workspace resolution" as unsupported-until-implemented
      (plan EC-4 DOCUMENT obligation).

  - id: F-sec-2
    severity: MEDIUM
    file: .claude/knowledge-base/implementations/mcp-workspace-binding-isolation-implementation.md
    line: 70
    plan_ref: T4.2 / theo-data invariant 6 — prove isolation through the REAL edge
    domain_anchor: "theo-data CLAUDE.md: a capability is NOT done until invariants 1, 4 and 6 are present (#113 e2e pattern)"
    summary: >
      The LIVE gateway cross-tenant probe (A's key -> B's canary -> 0 results WITH B's data
      present + B>=1 control, end-to-end through the real edge) was NOT completed, and the
      plan-specified evidence file is missing. The authority proof for CWE-441 closure
      (invariant 6) is therefore partial.
    evidence: |
      Implementation summary § "Honest limitation (Rule 3)" (lines 70-79): the clean live
      cross-tenant recall was "blocked by a dev bring-up mis-alignment unrelated to #82"
      (dev/memory-up.sh container-localhost vs host pg + embedder-dim drift). Only live
      fail-closed 401 + a live 503 + a live B-canary write were captured — NOT the
      cross-tenant=0 assertion. The plan T4.2 acceptance criterion ("Live GW-ISO: A's key ->
      B's canary -> 0 results (deny)") and DoD ("Evidence file written with the live
      transcript") are unmet: `.claude/knowledge-base/dogfood/evidence/2026-06-30-mcp-iso-fix-e2e.md`
      does NOT exist (verified by ls). The integration test (workspace-isolation.test.ts) proves
      the identical code path against real pgvector, so the isolation PROPERTY is established —
      this is an evidence/verification-completeness gap, not a known code leak.
    recommended_action: >
      Fix the dev bring-up alignment (point the host MCP listener and the canary-write at the
      same pg the gateway path reads) and re-run the live GW-ISO probe to capture A-side=0 with
      B-data-present + B-control>=1, then write the named evidence file. Treat invariant 6 as
