      for the real-edge proof the CLAUDE.md contract requires.

  - id: F-sec-3
    severity: LOW
    file: packages/mcp/src/run-mcp-server.ts
    line: 295
    plan_ref: ADR D4 — SSE/openmemory deferral
    domain_anchor: "theo-data invariant 2 (workspace_id == tenant_id) + ADR D4 (SSE not gateway-fronted)"
    summary: >
      The OpenMemory SSE compat path (connectSse) mounts NO bearerAuth and never attaches a
      workspace, so the workspaceScopedMemory wrapping added to the four openmemory handlers is
      effectively a no-op there (always passthrough to the default workspace). Multi-tenant
      isolation is absent on this transport; only the pre-existing per-user IDOR guard applies.
    evidence: |
      run-mcp-server.ts:295 connectSse({ host, port, serverFactory }) — no bearerAuth param
      exists on the SSE transport. openmemory/tools.ts now calls workspaceScopedMemory at
      :93/:101/:110/:139, but with no auth-attached workspace getScope().workspaceId is
      undefined -> passthrough (workspace-scoped-memory.ts:33). HONEST REACH ASSESSMENT: SSE is
      the direct-localhost dev path (default port 8765, no TLS guard, not gateway-fronted) and
      is explicitly out of #82's repro per ADR D4 — so this is genuinely out of reach for the
      gateway leak. Flagged for completeness: anyone exposing the SSE compat port to multiple
      tenants would have NO workspace isolation. The delete IDOR per-user guard
      (openmemory/tools.ts:136-159) IS correctly preserved.
    recommended_action: >
      Keep the documented deferral; ensure the SSE/openmemory multi-tenant hardening follow-up
      is filed and that operator docs state the OpenMemory SSE compat surface is single-
      workspace (per-user only) — not safe to expose to multiple tenants until bearerAuth +
      workspace binding are wired.

  - id: F-sec-4
    severity: INFO
    file: packages/mcp/src/auth/with-bearer-auth.ts
    line: 182
    plan_ref: T2.1 / EC-1 — blank workspaceId rejected
    domain_anchor: "rules/error-handling.md § fail-fast"
    summary: >
      The blank-workspace guard reads principal.workspaceId.trim() OUTSIDE the resolvePrincipal
      try/catch. The Principal type guarantees workspaceId: string, but a malformed verifier
      returning a Principal with an undefined workspaceId would throw a TypeError that surfaces
      as a generic 500 (via the outer requestHandler catch) rather than the intended 401.
    evidence: |
      Line 182: `if (principal.workspaceId.trim() === '')` — not wrapped; the surrounding
      try/catch (line 162-173) only covers the `await opts.apiKey.resolvePrincipal(token)` call.
      Still fail-CLOSED (500 short-circuits, never reaches the workspaceScopedMemory passthrough),
      so this is not a leak — only a less-precise status code on a contract-violating verifier.
    recommended_action: >
      Optional hardening: treat a missing/blank workspaceId uniformly as a 401 by null-checking
      before .trim() (e.g. `if (!principal.workspaceId || principal.workspaceId.trim() === '')`),
      keeping the malformed-principal case on the fail-closed 401 path rather than a 500.

  - id: F-sec-5
    severity: INFO
    file: packages/mcp/src/auth/with-bearer-auth.ts
    line: 168
    plan_ref: T2.1 — resolve_principal_failed logging (error-handling.md, never swallow)
    domain_anchor: "Issues rule: NUNCA incluir secrets/tokens nos logs"
    summary: >
      POSITIVE FINDING — verified no secret/token leakage in the new logging. The
      resolve_principal_failed warn logs only err.message; the prefix_collision_detected warn
      logs only token.slice(0,10) which is the public `theo_live_` prefix, never key material.
      The 503/401 client responses are generic (CWE-209 honored); the cause stays operator-side.
    evidence: |
      Lines 168-172 (resolve_principal_failed): logs { reason: err.message } only — no token.
      Lines 206-209 (prefix_collision_detected): logs { tokenPrefix: token.slice(0,10) } = the
      10-char "theo_live_" prefix; the 40+ secret chars are NOT logged. send401/send503 bodies
      carry only a generic message. No raw credential reaches any log sink.
    recommended_action: "No action — confirms the no-secret-in-logs invariant holds."
