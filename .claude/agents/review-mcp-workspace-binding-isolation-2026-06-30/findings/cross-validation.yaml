findings:
  - id: F-xval-1
    severity: HIGH
    commit: f73f13b
    file: packages/mcp/src/tools/handlers.test.ts
    plan_ref: >
      T3.1 #### Concurrency tests ("ALS isolation (HIGH risk) — concurrent test with
      happens-before observation ... the only proof AsyncLocalStorage.run isolates the
      workspace per concurrent request (Drawbacks risk #1)") + Coverage Matrix row
      "ALS isolation across concurrent tenants | T2.1, T3.1 (concurrency tests)"
    summary: >
      The plan-required ALS concurrency test (two interleaved dispatches under distinct
      withScope({workspaceId:'tn-A'}) / withScope({workspaceId:'tn-B'}) asserting no
      workspace bleed) is MISSING. It is the declared mitigation of the #1 HIGH risk in the
      Drawbacks table and the Coverage Matrix lists T3.1 as covering it. Only the T2.1
      per-request test (distinct IncomingMessage objects) exists, which proves request-object
      isolation, NOT AsyncLocalStorage.run isolation across concurrent dispatches.
    evidence: |
      grep for concurren|bleed|interleav|Promise.all in packages/mcp/src + tests/integration/mcp
      returns ONLY streamable-http-auth.test.ts:133 (the T2.1 per-req test) and the
      request-workspace.ts JSDoc. handlers.test.ts has no concurrent/interleaved dispatch test.
      Plan Drawbacks risk #1 (HIGH): "ALS scope bleed across concurrent requests" — mitigation
      = "Concurrency test (T3.1 #### Concurrency tests)".
    recommended_action: >
      Add the T3.1 ALS bleed test (two interleaved withScope dispatches, distinct workspaces,
      assert each resolves only its own workspace) OR amend the plan/Coverage Matrix with an
      ADR documenting that the AsyncLocalStorage.run lexical-isolation guarantee is accepted
      without a dedicated test. Do not leave the Coverage Matrix row claiming a test that does
      not exist.

  - id: F-xval-2
    severity: MEDIUM
    commit: f73f13b
    file: packages/mcp/src/tools/handlers.test.ts
    plan_ref: >
      T3.1 Acceptance Criteria ("the cross-tenant assertion boundWorkspace === 'tn-A' holds
      for all 12 verbs") vs implementation summary claim "12-verb isolation"
    summary: >
      The T3.1 AC requires the withWorkspace('tn-A') binding assertion "for all 12 verbs", but
      only 3 verbs are tested (recall, forget, add_skill). The implementation summary
      (mcp-workspace-binding-isolation-implementation.md) labels this "12-verb isolation",
      which over-claims; the commit message correctly says "3-verb isolation tests". The other
      9 verbs (remember, reflect, episodes, execute_skill, forget_skill, openmemory
      add/search/list/delete) are structurally wrapped at the site (AC grep passes) but have no
      isolation test asserting the bound workspace.
    evidence: |
      handlers.test.ts describe('workspace isolation across all tool verbs (T3.1, #82)') has
      exactly 3 it() blocks: recall (411), forget (421), add_skill (433).
      implementation summary: "handlers.test.ts (24): all verbs + 12-verb isolation
      (recall/forget/add_skill bind withWorkspace('tn-A') before the store op)."
    recommended_action: >
      Either extend the isolation assertions to the remaining 9 verbs (one-line each given the
      shared helper) OR correct the implementation summary + Coverage Matrix to read "3 of 12
      verbs spot-checked; the remaining 9 share the identical one-line seam". The binding IS
      present at every site, so this is a test-coverage + accuracy gap, not a leak.

  - id: F-xval-3
    severity: MEDIUM
    commit: f73f13b
    file: packages/mcp/src/tools/handlers.test.ts
    plan_ref: >
      T3.1 TDD ("dispatch surfaces the fail-closed throw as a typed tool error (EC-2 SHOULD
      TEST): when workspaceScopedMemory throws, the dispatch returns { isError: true }") +
      Coverage Matrix row "Fail-closed throw surfaced as typed tool error, not server crash
      (plan EC-2) | T3.1"
    summary: >
      The EC-2 test asserting that a workspaceScopedMemory fail-closed throw is surfaced by
      dispatch as { isError: true } (not an unhandled rejection wedging the singleton
      transport) is absent. A generic MissingScopeError->execution test and a MemoryStoreError
      ->Tool-Execution-Error test exist (so the classifier likely surfaces a plain thrown
      Error too), but the specific EC-2 case the plan required is not tested.
    evidence: |
      No handlers.test.ts test mounts a Memory without withWorkspace under a workspace-bearing
      scope and asserts dispatch -> isError:true. grep for fail.closed/unbound/withWorkspace
      undefined in handlers.test.ts returns only comments and the tn-A binding stub.
    recommended_action: >
      Add the EC-2 dispatch test (workspace-bearing scope + a Memory lacking withWorkspace ->
      dispatch result.isError === true with a sanitized message) OR mark the Coverage Matrix
      row as behaviorally-covered-by-the-generic-classifier with the supporting test cited.

  - id: F-xval-4
    severity: LOW
    commit: 2da3edc
    file: tests/integration/mcp/workspace-isolation.test.ts
    plan_ref: 'T4.1 #### Concurrency tests ("two concurrent withScope recalls (A and B) against the real store assert no cross-read")'
    summary: >
      The plan-required reinforcing concurrent two-recall integration test is absent. The core
      T4.1 ACs (A=0 of B, B>=1 control, cross-ws forget safe) are all present and pass, so the
      isolation property is proven sequentially; only the concurrent reinforcement is missing.
    evidence: |
      tests/integration/mcp/workspace-isolation.test.ts has 2 sequential test() blocks; no
      Promise.all / concurrent withScope.
    recommended_action: Add the concurrent two-recall test, or drop the T4.1 concurrency-test line from the plan via a one-line note.

  - id: F-xval-5
    severity: LOW
    commit: 5bdd508
    file: .claude/knowledge-base/implementations/mcp-workspace-binding-isolation-live-e2e-2026-06-30.md
    plan_ref: >
      T4.2 Acceptance Criteria ("Live GW-ISO: A's key -> B's canary -> 0 results (deny);
      fail-closed 4/4 401") + Coverage Matrix row "Live edge isolation proof (#82 flips to
      deny) + fail-closed probes | T4.2"
    summary: >
      The T4.2 live cross-tenant DENY transcript was NOT captured (env-blocked by a dev
      bring-up mis-alignment unrelated to the fix), and only 2 of the required 4 fail-closed
      401 probes are documented (no-cred edge + no-cred listener), plus a 503. This is
