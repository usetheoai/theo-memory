findings:
  - id: F-arch-1
    severity: HIGH
    file: packages/mcp/src/auth/with-bearer-auth.ts
    line: 190-199
    plan_ref: ADR D3(a) + T2.1 (pseudo-code + RED "verify-only verifier on api-keys path -> 401, no delegate") + Coverage Matrix row "Fail-closed: verify-only verifier rejected (blueprint EC-2) | T2.1, D3"
    summary: >-
      Verify-only verifier on the api-keys path DELEGATES (single-tenant
      passthrough to the default workspace) instead of REJECTING with 401 as the
      plan's locked ADR D3 mandates — an unreconciled divergence from a security
      ADR, with no amending ADR and no test for either behavior.
    evidence: |
      Plan ADR D3(a): "a verify-only verifier (no resolvePrincipal) -> reject (no
      DEFAULT_PRINCIPAL collapse), mirroring middleware.ts:116." Plan T2.1
      pseudo-code: `send401(...'verifier cannot resolve workspace (fail-closed)')`.
      Implementation does the opposite:
      ```ts
      // Verify-only verifier (no resolvePrincipal): single-tenant semantics —
      // a valid key delegates WITHOUT a workspace (-> default workspace at the store...).
      if (await opts.apiKey.verify(token)) {
        await delegate(req, res);
        return;
      }
      ```
      The change carries a defensible inline rationale (the production Model B
      gateway always wires a resolvePrincipal-capable ApiKeyAuthVerifier, so #82's
      exploit path always takes the resolve+bind branch at :158-187; a single
      workspace has no cross-tenant IDOR). Honest read: this is NOT exploitable in
      the shipped gateway configuration. BUT (a) it contradicts a LOCKED security
      ADR (D3) without an amending ADR — per cycle-implement anti-pattern "editing
      the plan during implementation"; (b) it falsifies the Coverage Matrix line
      that claims the verify-only-reject case is covered; (c) the plan-mandated
      T2.1 RED negative-case test ("verify-only verifier on api-keys path -> 401,
      no delegate") is ABSENT — grep of streamable-http-auth.test.ts shows
      success/null-401/blank-401/throws-503/concurrency, but no verify-only case;
      so the divergent branch ships with zero test coverage in either direction.
      It also softens CLAUDE.md data-plane invariant 5 (fail closed) on this path.
    recommended_action: >-
      Reconcile the contradiction one of two ways: (1) restore the plan's behavior
      — reject the verify-only branch on the theo_live_* api-keys path with 401
      (send401 'verifier cannot resolve workspace'), matching ADR D3/T2.1; OR (2)
      keep the single-tenant passthrough but write an amending ADR (D3') in the
      plan documenting the relaxation + its production-safety argument, correct the
      Coverage Matrix row, and ADD a test asserting the chosen behavior. Either
      way the verify-only api-keys branch MUST have an explicit test.

