agent: review-cross-encoder-reranker-wiring
review_target: main..HEAD for plan cross-encoder-reranker
plan: .claude/knowledge-base/plans/cross-encoder-reranker-plan.md
verdict: READY_TO_MERGE
summary: >
  The cross-encoder reranker wiring triad is HONEST and DEEP. The full caller
  path is connected end-to-end (no orphan module): createLocalMemory(config) →
  LocalMemoryConfig.reranker → LocalMemory(baseConfig) → ScopedMemory.config.reranker
  → threaded at scoped-memory.ts:321 → RetrievalDeps.reranker → pipeline Step 8.5a
  invokes reranker.rerank when options.rerank is set. The cache-aware pipeline call
  (scoped-memory.ts:338) deliberately omits the reranker, but that branch is only
  reachable when options.rerank === undefined (cacheApplicable guard at :315), so
  every rerank request flows through the reranker-threaded call at :318/:321 — the
  omission is correct, not a wiring gap. Integration GOAL test exercises the REAL
  path (real pgvector + real @xenova both models). Fail-soft OTel event
  recall_rerank_failed is in the MEMORY_EVENTS union (memory-event.ts:96) and
  asserted via a REAL tracer span (not a fabricated .wiring-evidence.json number).
  Bundle isolation verified by a static import-graph walk (strongest form). All 3
  new public symbols PASS check_wiring.py; 55 contract tests + 13 isolation tests green.

triad_revalidation:
  total_new_symbols: 3            # CrossEncoderReranker, Reranker (type), RerankerConflict
  pillar_a_honest_pass: 3 / 3     # check_wiring PASS + manually traced full path to entry point
  pillar_b_honest_pass: 3 / 3     # integration + contract tests genuinely exercise the symbols
  pillar_c_observed: 1 / 1        # recall_rerank_failed emitted + asserted via real OTel span

caller_path_trace:
  entry_point: createLocalMemory(config) (factory.ts:153)
  hops:
    - LocalMemoryConfig.reranker? slot (config.ts:138)
    - factory passes config/baseConfig to new LocalMemory(...) (factory.ts:184/196/216) — reranker preserved
    - ScopedMemory.recall threads this.config.reranker into runRetrievalPipeline (scoped-memory.ts:321)
    - RetrievalDeps.reranker (pipeline.ts:49)
    - pipeline Step 8.5a invokes reranker.rerank when options.rerank set + deps.reranker present (pipeline.ts:230-238)
  reachable: true
  orphan: false

findings:
  - id: F-wire-1
    severity: LOW
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 237
    plan_ref: T2.2 / ADR D4 — rerank-stage observability
    summary: >
      The rerank SUCCESS path emits the pre-existing `extraction_completed` event
      (lines 237 and 245), reusing an extraction-domain event name on a recall-path
      stage. The load-bearing fail-soft event (`recall_rerank_failed`) is correct,
      typed, and tested — this nit only concerns the success/fallback-success spans.
    evidence: |
      pipeline.ts:237  emitEvent(tracer, 'extraction_completed', { results: reranked.length });
      pipeline.ts:245  emitEvent(tracer, 'extraction_completed', { results: fallback.length });
      A dedicated `recall_rerank_completed` (or no success span, mirroring the MMR
      diversify stage which emits none) would be more semantically honest per
      Princípio 3 auditability. MMR diversify Step 8.5 emits no success event, so
      the rerank success span is arguably extra noise under a confusing name.
      Non-blocking: the failure path — the one that MUST be observable per ADR D4 —
      is correct and verified by a real OTel exporter span assertion
      (retrieval-pipeline.test.ts:306).
    recommended_action: >
      Optional post-merge polish — either drop the success-path emitEvent (match the
      diversify stage which emits none) or introduce a `recall_rerank_completed`
      literal in MEMORY_EVENTS. No action required for merge.

  - id: F-wire-2
    severity: INFO
    file: packages/core/src/infrastructure/db/scoped-memory.ts
    line: 338
    plan_ref: T4.1 / ADR D6 — cache bypass on rerank
    summary: >
      The cache-aware pipeline call (line 338) does NOT thread the reranker, while
      the cache-bypass call (line 318/321) does. This is CORRECT by construction:
      cacheApplicable (line 311-315) is false whenever options.rerank is set, so the
      cache-aware branch is unreachable for any rerank request. Verified, not a gap.
    evidence: |
      scoped-memory.ts:315  options?.rerank === undefined   // part of cacheApplicable
      scoped-memory.ts:317  if (!cacheApplicable || cache === undefined) { ... reranker threaded ... }
      A rerank request → cacheApplicable=false → always takes the :318 branch which
      threads this.config.reranker (:321). The :338 branch only runs for non-rerank
      cache-eligible recalls. ADR D6 bypass is implemented exactly as the shipped
      asOf/attributedTo bypass precedent.
    recommended_action: None — documented for the audit trail; the design is sound.

