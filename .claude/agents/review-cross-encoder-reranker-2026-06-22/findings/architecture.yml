  - id: F-arch-7
    severity: LOW
    file: packages/core/src/infrastructure/rerankers/cross-encoder.ts
    line: 162
    plan_ref: T3.1 (MUST NOT mutate input; sort)
    summary: The reranker overwrites the public `score` field with the cross-encoder sigmoid on the returned items. Immutability of the INPUT is preserved (new objects via spread), but consumers now see a sigmoid relevance score in `.score` that is on a DIFFERENT scale than the additive cosine `combined` score they get without rerank — a silent semantic shift in the same field across two recall modes.
    evidence: |
      ```ts
      const ranked = candidates
        .map((c, i): MemoryItemWithScore => ({ ...c, score: scores[i] ?? 0 }))  // score := sigmoid(logit) ∈ [0,1]
        .sort((a, b) => b.score - a.score).slice(0, topK);
      ```
      Non-rerank recall returns `score = combined additive score`; rerank recall returns `score = cross-encoder sigmoid`. Both are [0,1]-ish but not comparable across calls. This is an intentional design choice (the GOAL test asserts the score is "distinct from the cosine baseline — proving real re-scoring") and is acceptable, but it is not documented on MemoryItemWithScore.score.
    recommended_action: Document on the MemoryItemWithScore.score JSDoc (or the RecallOptions.rerank JSDoc) that when rerank is active, `.score` is the cross-encoder relevance score, not the additive cosine combined score — so consumers do not compare scores across rerank/non-rerank calls.

