  - id: F-arch-3
    severity: MEDIUM
    file: packages/core/src/infrastructure/rerankers/cross-encoder.ts
    line: 95
    plan_ref: architecture.md § 7 (no `any` in production code)
    summary: The cross-encoder narrows the @xenova tokenizer/model via `as unknown as <LocalType>` double-casts. No literal `any` survives (architecture.md § 7 satisfied), but the double-cast bypasses the type system at the most fragile boundary (model output shape) with no runtime guard — a silent shape drift in a future @xenova upgrade would surface as `undefined`/NaN scores, not a typed error.
    evidence: |
      ```ts
      const tokenize = tokenizer as unknown as TokenizePairs;
      const runModel = model as unknown as RunSequenceClassifier;
      const output = await runModel(inputs);
      const data = output.logits.data;            // assumed Float32Array
      const numLabels = data.length / batch.length;
      const raw = data[i * numLabels] ?? 0;       // ?? 0 masks shape drift silently
      ```
      architecture.md § 7 says "If you must escape the type system, use `unknown` with a runtime assertion." The `as unknown as` is the unknown escape, but there is NO runtime assertion that `output.logits?.data` is a Float32Array — the `?? 0` quietly substitutes a 0 score, which (combined with the pipeline fail-soft) could mask a real integration break as a silent precision regression rather than a `recall_rerank_failed` event.
    recommended_action: Add a minimal runtime guard after `runModel` (e.g. assert `output?.logits?.data` is a TypedArray of expected length; throw a typed error otherwise) so a real shape drift trips the ADR D4 fail-soft path (observable `recall_rerank_failed`) instead of silently producing 0 scores. Keeps the no-`any` discipline AND honors architecture.md § 7's "unknown WITH a runtime assertion".

  - id: F-arch-4
    severity: LOW
    file: packages/core/src/infrastructure/db/scoped-memory.ts
    line: 338
    plan_ref: T4.1 / ADR D6 (cache bypass when rerank set)
    summary: The cache-aware retrieval call (line 338) deliberately does NOT thread `reranker`, relying on the invariant that `options.rerank` set ⇒ cacheApplicable=false ⇒ this branch is unreachable for rerank requests. The invariant holds today but is implicit (the omission is correct only because of the cacheApplicable predicate three lines up).
    evidence: |
      ```ts
      const cacheApplicable = cache !== undefined && ... && options?.rerank === undefined;  // line 311-315
      if (!cacheApplicable || cache === undefined) { ...reranker threaded... }              // line 317-323 (bypass path)
      // cache-aware path (only reached when rerank === undefined):
      const results = await runRetrievalPipeline(query, applySkillFilters(this.filters, options), {
        vectorStore: this.config.vectorStore, embedder: this.config.embedder,
        ...(this.config.tracer !== undefined ? { tracer: this.config.tracer } : {}),     // no reranker — correct, but only by coupling
      }, options);
      ```
      Correct by construction, but the safety depends on a reader connecting the cacheApplicable predicate to the omission. A future edit that loosens cacheApplicable (e.g. adds a rerank-aware cache key per D6's rejected alternative) would silently drop reranking on the cache path.
    recommended_action: Add a one-line comment at line 338 stating "no reranker threaded here BY DESIGN — rerank requests bypass the cache via cacheApplicable (D6); if the cache ever becomes rerank-aware, thread reranker here too." Pure documentation; no behavior change.

