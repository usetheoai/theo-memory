verdict_contribution: >
  No domain-layer defects. All three TheMemory princípios are honored: Princípio 2 (rerank is a
  post-threshold priorização stage that truncates volume), Princípio 3 (the rerank-failure IGNORE
  decision emits the typed recall_rerank_failed OTel event), and the fail-soft discipline (a
  reranker outage degrades to cosine order and never throws out of recall, mirroring entity/skill
  enrichment). Cache bypass (ADR D6), cross-encoder sigmoid scoring with no input mutation, mutual
  exclusion with MMR diversify, and the byte-unchanged default path are all correctly implemented
  and tested. The single INFO note (success-path event reuse) follows a pre-existing pipeline
  convention and requires no change.
