  - id: F-tests-7
    severity: INFO
    file: tests/integration/cli/verbs-cli.test.ts
    line: 86-251
    plan_ref: testing.md § Pyramid — "Reset DB state between tests"
    summary: Per-test scope isolation via randomUUID() — correct testing.md compliance
    evidence: |
      11 tests use `const userId = randomUUID()` per-test (lines 86, 101, 118, 128, 137, 145,
      157, 170, 181, 189, 242). The 8 tests that do NOT use randomUUID (3, 4, 13, 14, 15, 16,
