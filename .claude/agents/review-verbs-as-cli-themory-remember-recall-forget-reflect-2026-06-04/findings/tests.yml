  - id: F-tests-6
    severity: INFO
    file: tests/integration/cli/verbs-cli.test.ts
    line: 82
    plan_ref: testing.md § Determinism — no flaky tests
    summary: describe.skipIf with 3-precondition LOUD warn correctly implemented
    evidence: |
      Lines 43-58 emit `console.warn('T0.1 SKIP — ...')` for each of the 3 missing preconditions
      (DIST_EXISTS / HAS_OPENAI / HAS_PG_URI) BEFORE the describe.skipIf gates the suite at
