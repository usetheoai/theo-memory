  Wiring triad is HONEST for all 7 new symbols. Pillar (a) static caller — every new
  symbol exists at a real call site, not gamed; Pillar (b) integration tests — 19/19
  PASS exercising each verb via real `node dist/agent-tools/cli.js`; Pillar (c) runtime
