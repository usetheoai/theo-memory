        ReflectionPolicy variant to wire — gap surfaced empirically and addressed
        in-cycle. Honestly disclosed in implement-validate report § "Surfaces" #2.
      severity_classification: MINOR (process — plan-completeness gap absorbed
        in-cycle; respects ADR-0005)
    - artifact: commander.exitOverride global wrap at cli.ts:71-79 + use of
        InvalidArgumentError throw in 3 bounds parsers
      justification: |
        Plan ADR D4 promised exit 2 on validator failure via `process.exit(2)`. Commander
        v12's default exit code on validator throw is 1 (NOT 2). The exitOverride
        mechanism specifically traps `commander.invalidArgument` +
        `commander.invalidOptionArgument` codes and maps to exit 2. Mechanism not named
        in plan ADR D4 but follows the spirit of the EC-3 amendment. Disclosed in
        implement-validate report § "Surfaces" #3.
      severity_classification: MINOR (process — implements the ADR D4 spirit; the
        specific mechanism is empirically required by commander v12 behavior, not a
        contract deviation)
    - artifact: DOTENV_CONFIG_QUIET=true env injected at verbs-cli.test.ts:73
      justification: |
        dotenv v17.4.2 transitive dep auto-emits "◇ injected env (0)" banner to stdout
        at module load. Without DOTENV_CONFIG_QUIET, JSON.parse(stdout) would fail on
        the leading banner lines. Runtime is dependency-driven (transitive surface),
        not introduced by this cycle. Honest disclosure in implement-validate report
        § "Surfaces" #4 + CHANGELOG [Unreleased] entry.
      severity_classification: INFO (test infrastructure; transitive surface)
    - artifact: src/__tests__/changelog-breaking-marker.test.ts version-agnostic refactor
