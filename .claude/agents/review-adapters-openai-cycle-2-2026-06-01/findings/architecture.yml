    line: 41-47
    plan_ref: ADR D3 (MOVE-only) + EC-8 (one client per process)
    summary: Lazy-singleton client is duplicated verbatim across `src/embedders/openai.ts` and `src/llms/openai.ts` — two singletons per process where one would suffice. The duplication is documented as an accepted trade-off in the JSDoc (EC-8 absorption) but it is a textbook DRY violation between sibling modules.
    evidence: |
      src/embedders/openai.ts:41-47
          let _openai: OpenAI | null = null;
          function client(): OpenAI {
            if (_openai === null) {
              _openai = new OpenAI({ apiKey: process.env['OPENAI_API_KEY'] });
            }
            return _openai;
          }
      src/llms/openai.ts:52-58 — IDENTICAL block, separate module-scope `_openai`.
      Result: when both adapters are instantiated (the standard demo path),
      the process holds TWO OpenAI client instances. They share API key, but
      each maintains its own internal connection pool / agent / etc.
    recommended_action: |
      ACCEPTED as MINOR for this cycle — the JSDoc already documents the
      trade-off as scope-creep avoidance per ADR D3 ("Sharing across modules
      would require a new shared file not present in the demo"). When the
      Cycle 2.X harden cycle lands (retry/backoff + structured errors), extract
      a `src/_internal/openai-client.ts` shared lazy singleton. Until then, the
      duplication is intentional and documented. NO action required this cycle;
      filing as MINOR so the v0.6.1-style fix-up cycle has a tracked entry.

