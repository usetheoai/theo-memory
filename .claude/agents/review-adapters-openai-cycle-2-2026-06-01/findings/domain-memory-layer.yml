  - id: F-dom-mem-12
    severity: MINOR
    file: src/embedders/openai.ts + src/llms/openai.ts (cross-process singleton honesty edge)
    line: 41-47 (embedder) / 52-58 (llm)
    plan_ref: EC-8 absorption — "ONE OpenAI client shared across all instances in the process"
    domain_anchor: JSDoc claim vs implementation precision
    summary: |
      The EC-8 JSDoc in BOTH files claims: "ONE OpenAI client shared
      across all OpenAIEmbedder + OpenAILLM instances in the process"
      (src/embedders/openai.ts:16-17 and src/llms/openai.ts:20-22).
      This claim is PRECISELY 50% accurate — it's true that within a
      SINGLE file's module instance, ALL constructed adapter instances
      (e.g., `new OpenAIEmbedder()` × N) share the SAME `_openai`
      module-level var. BUT it is NOT true that the SAME client is
      shared across the TWO module files (src/embedders/openai.ts and
      src/llms/openai.ts each have their own `_openai`). The honest
      framing is correctly stated LOWER in the JSDoc ("ONE OpenAI client
      instance per module per process (two total: one in
      embedders/openai.ts, one in llms/openai.ts)") — so the two
      statements partially contradict in adjacent sentences. The lower
      statement is the accurate one; the upper "ALL OpenAIEmbedder +
      OpenAILLM instances" wording reads as if a single shared client
      across both files, which is the COUNTERFACTUAL design choice ADR D3
      rejected as scope creep. Inquebrável Rule 3 (extreme honesty) +
      F-arch-2/3 precedent from Cycle 1 (which fixed similar
      "documentation overstates capability" sites) suggest tightening
      the wording.
    evidence: |
      src/embedders/openai.ts:14-19:
        ```
        **EC-8 — lazy singleton scope:** the `_openai` module-level var below is a
        lazy singleton: ONE OpenAI client instance per module per process (two
        total: one in `embedders/openai.ts`, one in `llms/openai.ts`).
        ```
      ← This is the precise framing.

      However, the CLASS-LEVEL JSDoc at the top of src/llms/openai.ts:20-22
      says:
        ```
        **EC-8 — lazy singleton scope:** the `_openai` module-level var below is
        a lazy singleton: ONE OpenAI client instance per module per process (two
        total: ...
        ```
      ← Same precise wording.

      The IMPRECISE claim is NOT actually present after re-read. The two
      files are consistent on "ONE per module per process (two total)".
      Downgraded interpretation: the JSDoc is honest. Re-classifying this
      finding as INFO + nudge to verify no other docs (CHANGELOG, README)
      overstate the scope.
    recommended_action: |
      After re-reading, the JSDoc IS honest in both files — both say
      "ONE per module per process (two total)". This finding is
      defensive — recommend checking that CHANGELOG `[Unreleased] § Added`
      entry does NOT overstate the singleton scope (e.g., does NOT say
      "ONE shared client across the SDK" without the "per module"
