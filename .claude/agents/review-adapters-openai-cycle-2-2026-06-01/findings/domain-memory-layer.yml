      original demo. The runtime behavior is byte-identical (no `as` is
      a no-op at runtime). Listed as MINOR because ADR D3 says "MOVE-only
      VERBATIM"; in strict terms this is a 1-character drift (cast
      removal). In pragmatic terms it's a strict improvement (less
      type-system noise). Acceptable trade-off; if a strict-MOVE-only
      reviewer flags this, restoring the redundant cast is a 1-token
      edit. Recommended: document this micro-divergence in the v1.2
      audit trail of the plan OR in CHANGELOG `[Unreleased] § Changed`.
    evidence: |
      Original demo (git show 75153fc:examples/chat-with-memory/lib/openai-adapters.ts:50-55):
        ```ts
        function toOpenAIMessages(messages): OpenAI.Chat.ChatCompletionMessageParam[] {
          return messages.map((m) => ({
            role: m.role,
            content: m.content,
          })) as OpenAI.Chat.ChatCompletionMessageParam[];   // <-- tail cast
        }
        ```
      SDK lift (src/llms/openai.ts:62-69):
        ```ts
        function toOpenAIMessages(
          messages: readonly Message[],
        ): OpenAI.Chat.ChatCompletionMessageParam[] {
          return messages.map((m) => ({
            role: m.role,
            content: m.content,
          }));   // <-- no tail cast
        }
        ```
    recommended_action: |
