  - id: F-dom-pgvector-2
    original_severity: MAJOR (consolidated into F-M1)
    status: CLOSED
    evidence:
      - "tests/integration/migrations/dim-change.test.ts:178-210 — `EC-3 atomic rollback: mid-sequence failure preserves pre-change schema state` test added"
      - "Mechanism: pre-creates a VIEW `v_embed_dep AS SELECT id, embedding FROM memories` BEFORE invoking runMigrations({embeddingDim:384}). PG raises SQLSTATE 0A000 `cannot alter type of a column used by a view or rule` when the wrapper reaches ALTER COLUMN TYPE"
      - "Post-rollback assertions verify (a) getColumnDim still 1536 (b) memories_embedding_hnsw_idx still present (c) entities_embedding_hnsw_idx still present — all 3 DROP+DELETE+ALTER side effects are undone by the single-tx ROLLBACK"
    mechanism_analysis: |
      The VIEW injection is a SOUND mid-sequence failure mechanism:
      - DROP INDEX IF EXISTS (× 2) — succeeds; index drop does not violate VIEW dependency
      - DELETE FROM memories — succeeds; VIEW permits SELECT over empty table; PG does not flag DELETE as schema-altering
      - DELETE FROM entities — succeeds; orthogonal table
      - ALTER TABLE memories ALTER COLUMN embedding TYPE vector(384) — FAILS with SQLSTATE 0A000 because the VIEW references the embedding column
      The composition is correct: failure happens INSIDE the BEGIN block, the catch arm calls ROLLBACK, and PG reverts both the DROP INDEXes and the DELETEs atomically. The test's post-assertions correctly verify schema preservation AND index preservation.
    verdict: HONEST AND COMPLETE — the test exercises the genuine rollback path; F-M1 closed.

