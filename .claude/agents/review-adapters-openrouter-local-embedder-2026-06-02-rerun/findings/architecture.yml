          const created = pipeline('feature-extraction', MODEL_ID);
          _pipelinePromise = created;
          created.catch(() => {
            if (_pipelinePromise === created) {
              _pipelinePromise = null;
            }
          });
        }
        return _pipelinePromise;
      }
      ```
