  - id: F-dom-db-rerun-N2-view-dependency-mechanism
    severity: INFO
    file: tests/integration/migrations/dim-change.test.ts:192-194
    plan_ref: F-M1 implementation choice
    domain_anchor: canonical Postgres ALTER COLUMN TYPE blocking via dependent view
    summary: VIEW dependency IS the correct PG mechanism to block ALTER COLUMN TYPE — confirmed canonical
    evidence: |
      `CREATE VIEW v_embed_dep AS SELECT id, embedding FROM memories` creates
      a view that references the `embedding` column. PG enforces type
      stability of columns referenced by views: attempting
      ALTER COLUMN TYPE produces "cannot alter type of a column used by
      a view or rule" (PG error code 2BP01 dependent_objects_still_exist).
      This is THE canonical mechanism documented in PG docs `ALTER TABLE`
      section. Alternative mechanisms (FK from another table, generated
      column, materialized view, CHECK constraint referencing column type)
      all work too but VIEW is the simplest + most readable + zero side
      effects on other tests (DROP DATABASE in beforeEach cleans it up).
      Sound choice — yes/no answer is YES.
    verification_method: cross-ref PostgreSQL docs (training-data, well-established) + test isolation via beforeEach DROP DATABASE
    status: CORRECT_MECHANISM

