  # ============= RESIDUAL / NEW MINOR =============

  - id: F-dom-db-rerun-residual-M1-extversion-string-prefix-rigor
    severity: MINOR
    file: src/local/index.ts:886
    plan_ref: F-Mi8 implementation
    domain_anchor: string-prefix matching semantics for semver
    summary: extversion canary uses `startsWith('0.5.')` — string-prefix match catches `0.5.0`/`0.5.1`/`0.5.2` but NOT `0.50.x` if it ever shipped (semver-prefix-not-numeric quirk)
    evidence: |
      `installedVersion.startsWith('0.5.')` will MATCH:
        - 0.5.0, 0.5.1, 0.5.2, ..., 0.5.99 ✓ (intended)
        - 0.5.x-rc1 ✓ (intended)
      Will FAIL TO MATCH:
        - 0.50.0 (would print canary even though pgvector unlikely to ship
          this — minor releases tend to be 0.x.0)
        - 1.0.0 (would print canary — correct intent: re-verify)
      Will NOT WARN ON when it should warn (false NEGATIVE):
        - 0.5 (without trailing dot, would not match — but pgvector reports
          full semver like `0.5.1` so this is N/A in practice)
      No actual functional defect today (pgvector 0.5.x is the current
      shipped range). The startsWith check is conservative + correct for
      the documented threat model. Recording as MINOR (cosmetic) for
      future awareness: if pgvector ever ships 0.50.x, the canary would
      misfire (warn unnecessarily) — still safer than missing the warning.
    recommended_action: NONE — the conservative behavior is acceptable. Defer until a real pgvector 0.50.x ships (unlikely; semver convention).
    status: COSMETIC

  - id: F-dom-db-rerun-residual-M2-getColumnDim-only-probes-memories
    severity: MINOR
    file: src/local/index.ts:896-905 (applyDimChange probe)
    plan_ref: F-Mi8 + idempotency design
    domain_anchor: idempotency probe scope (Inquebrável Rule 1 + 3)
    summary: idempotency probe queries ONLY `memories.embedding`; if a previous run partially failed leaving `entities.embedding` at a different dim, the no-op path would skip the second ALTER silently
    evidence: |
      Lines 897-904 query atttypmod for table `memories`, column
      `embedding`. The two ALTER statements at lines 943-944 act on
      `memories.embedding` AND `entities.embedding`. The current ROLLBACK
      semantics (BEGIN/COMMIT/ROLLBACK wrapper at 929-963) guarantee
      that the two columns evolve in lockstep — if one ALTER fails, both
      revert. So in normal operation, the two columns ALWAYS agree.
      The hypothetical failure mode: if a previous run was killed
      mid-COMMIT (kill -9 between the two ALTERs but after COMMIT was
      initiated) AND PG's WAL replay produced a partial state. PG's
      transactional guarantees prevent this in practice (a COMMIT either
      lands fully or not at all). No real-world failure mode.
    recommended_action: NONE — atomic transaction guarantees ensure memories.atttypmod is a valid proxy for entities.atttypmod. Single-column probe is sufficient AND minimal.
    status: ACCEPTABLE_BY_TRANSACTION_INVARIANT

