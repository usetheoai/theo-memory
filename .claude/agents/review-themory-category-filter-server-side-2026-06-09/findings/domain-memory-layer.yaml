    severity: MEDIUM
    file: src/local/index.ts
    line: 825-845
    plan_ref: Plan v1.2 § T1.1 (MemoryItem.category top-level field) + EC-12 dual-pathway projection
    domain_anchor: CLAUDE.md § Princípio 3 (auditability — top-level surface is consumer contract)
    summary: |
      LocalScopedMemory.getAll does NOT project the top-level MemoryItem.category field;
      consumers reading `item.category` (the documented JSDoc surface on MemoryItem)
      receive `undefined` even when the row has a category. The category IS reachable
      via `item.metadata.category` (because metadata spreads the whole payload), so the
      dashboard BFF (which reads payload['category']) works in practice. But the
      JSDoc contract on MemoryItem.category (memory-item.ts:123-136) advertises a
      top-level field which is not honored at this code path.
    evidence: |
      src/local/index.ts:825-845 — return shape lacks `category: r.payload['category']`:
        return {
          id: r.id,
          text: String(r.payload['text'] ?? ''),
          hash: String(r.payload['hash'] ?? r.id),
          scope: this.scope,
          createdAt,
          updatedAt: createdAt,
          metadata: { ...r.payload },     // <-- payload spread; category lives HERE
          tValid: createdAt,
          tInvalid: null,
        };                                  // <-- no top-level `category` projection
      For symmetry, `attributedTo` ALSO has the same gap (it lives only in metadata.attributed_to
      via the spread; no top-level `attributedTo: ...` field is set). This means the new code
      is CONSISTENT with the existing precedent — the gap is pre-existing, not newly introduced.
    recommended_action: |
      Either (a) lift the top-level projection at this site (low LoC; mirrors the JSDoc claim
      and the pgvector-store's `VectorStoreResult.category` projection at rowToResult); or
      (b) DOCUMENT explicitly in MemoryItem.category JSDoc that `getAll` populates the field
      via `metadata.category` only — a follow-up CHANGELOG note clarifying the asymmetry
      between the recall path (top-level + metadata) and the getAll path (metadata-only). Path (a)
      is cleaner; path (b) is honest disclosure.
    classification_for_plan: pre-existing-debt absorbed alongside this cycle; NOT a regression
    introduced by this plan
    blocker: false

  - id: F-dom-mem-2
    severity: LOW
    file: src/local/in-memory-store.ts
    line: 220-227
    plan_ref: Plan v1.2 § T3.1 (in-memory adapter mirrors pgvector EC-12 dual-pathway)
    domain_anchor: ADR D5 — in-memory store mirrors pgvector filter semantics
    summary: |
      In-memory adapter projects category by reading payload['category'], which differs
      from pgvector (which reads row.category — a top-level row field). Both arrive at the
      same VectorStoreResult.category, so the behavior is identical for the consumer. But
      the storage model diverges: pgvector hoists payload['category'] OUT of payload at INSERT
      and into a top-level column (then deletes payload['category']); in-memory stores it
      INSIDE payload only (no top-level row.category). This means in-memory's
      payload['category'] is always present (when set), while pgvector's payload['category']
      is reconstructed at read time from the column. Functionally equivalent; conceptually
      asymmetric. ADR D5's claim that "in-memory mirrors pgvector filter semantics" is honored;
      the storage model asymmetry is invisible to consumers.
    evidence: |
      in-memory-store.ts:121 — `this.rows.set(id, { vector, payload, createdAt: new Date() })`
        — no top-level row.category extraction; payload retains category key.
      in-memory-store.ts:80 — filter reads `payload['category']`, not a row-level field.
      pgvector-store.ts:378 — INSERT-side: `delete cleanedPayload['category']` hoists out.
      pgvector-store.ts:82 — SELECT-side: `payload['category'] = row.category` projects back.
    recommended_action: |
      ACCEPT as known asymmetry — filter results are byte-identical across adapters which is
      what ADR D5 promises. Optional follow-up: align in-memory to also hoist out of payload
      at insert time (cosmetic; no behavior change).
    blocker: false

