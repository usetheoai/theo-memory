cross_check_principios:
  princípio_1_frequency_recency_confidence:
    status: HONORED
    notes: |
      ADR D6 preserves first-write category through UPSERT collisions while still bumping
      `confirmation_count` (Princípio 1 frequency signal). Category and confirmation_count
      are orthogonal — one is operator-supplied vocabulary that should NOT mutate; the
      other is a derived signal that MUST bump on dedup-collision. The pgvector ON CONFLICT
      DO UPDATE clause correctly separates these concerns by listing ONLY confirmation_count
      in the SET clause.
  princípio_2_priority_over_volume:
    status: ENABLED
    notes: |
      Category enables BETTER filtering — operators can narrow recall/getAll results to a
      specific vocabulary tag, which is exactly the "priority over volume" pattern at the
      query layer. The filter operates on a btree-indexed column (T2.1) so the cost of
      filtering is O(log n) at the row level. No interaction with MMR/diversify (orthogonal
      pipeline concerns).
  princípio_3_auditability:
    status: HONORED
    notes: |
      EC-9 NULL findability is disclosed honestly in JSDoc on BOTH RememberOptions.category
      AND GetAllOptions.category. Operators know that legacy rows with `category=NULL` are
      NOT findable via any filter, and the canonical empty-state behavior is the no-filter
      call. ADR D1 explicitly forbids back-filling a synthetic default ('general' was the
      rejected alternative A2). This is the correct honest empty-state disclosure pattern.

summary: |
  All 8 domain-memory-layer concerns checked. The plan's memory-layer claims are
  empirically honored:

  - Mem0-shape eight-phase write pipeline preserved (extraction prompt UNCHANGED).
  - Nine-step search retrieval contract untouched (recall path NOT modified by this plan).
  - ADD-only contract (ADR-0003) preserved via ADR D6 first-write-wins UPSERT discipline.
  - Three-tier scope is orthogonal to category (no scope-tier coupling introduced).
  - Filters interface naming parity correct (single-token `category` needs no rename).
  - ADR-0008 method-count cap honored (zero new DIP methods).
  - MemoryItem projection consistency: in-memory ↔ pgvector return byte-identical
    VectorStoreResult shapes via EC-12 dual-pathway. ONE PRE-EXISTING GAP at
    LocalScopedMemory.getAll surfaces (F-dom-mem-1) — top-level MemoryItem.category not
    populated at getAll path; only metadata.category via payload spread is populated. The
    same gap exists for the v1.1 `attributedTo` precedent, so this is CONSISTENT with the
    existing pattern and NOT a regression.
  - LLM extraction prompt unchanged — verified by inspection of pipeline.ts:308 (the prompt
    is loaded verbatim from generateAdditiveExtractionPrompt with NO category-related
    customization). ADR D1 honored.
  - All three Princípios (frequency/priority/auditability) cross-checked and honored.

  Verdict: PASS_WITH_CAVEATS. The one MEDIUM finding (F-dom-mem-1) is pre-existing technical
  debt that should be addressed in a focused follow-up (either lift the projection at the
  getAll path, or amend the MemoryItem.category JSDoc to explicitly document the
  metadata-only surface). It does NOT block this plan's merge.

