concurrency_review:
  shared_resources_touched:
    - Postgres `memories` table (existing) — extended with new `category` column + named index
  atomicity:
    - INSERT … ON CONFLICT DO UPDATE excludes `category` from SET list (ADR D6
      immutability — first-write wins). No read-modify-write race because
      category is set on INSERT only and never mutated.
    - composeFilters parameterizes via $N + params.push() — no SQL injection
      (proven by EC-6 test in pgvector-store-category.test.ts).
    - btree index creation in migration is idempotent (CREATE INDEX IF NOT
      EXISTS … via Drizzle journal — verified by EC-11 test).
  verdict: PASS — no race condition plausible.

