        the original v0.1 shipped runtime violated; T7.1 makes runtime + contract
        align. InMemoryVectorStore consumers (dev/test) keep the v0.1 hard-delete
        behavior — branch is on `instanceof PgvectorStoreClass`.
    - adr: plan1 D12 (EvictionPolicy DIP 4-method shape)
      verdict: DIVERGED + RECONCILED via T8.1 with post-merge ADR-amendment note
      evidence: |
        Plan1 D12 declares method names `shouldEvict, selectVictims, evict,
        scoreMemory`. Shipped interface (src/core/dip/eviction-policy.ts:97-110)
        is `kind, score, selectVictims, onEvictionStart?, onEvictionEnd?`.
        Divergence FIRST surfaced during T1.1 design (commit 320f11e); the
        shipped shape stayed canonical because the consumer (TriadicScoringPolicy)
        + collaborators (PgEvictor, NN provider) were built against it.
        /review F-xval-1 MAJOR caught the drift. Plan2 T8.1 (commit 7ebc53c)
        reconciled by VERIFYING shape + logging F-T8.1-1 followup for post-merge
        amendment of completed-v0-4b plan's ADR D12 (verbatim amendment text in
        v0-4b-fixes-cycle-followups.md lines 27-45). Per cycle-implement.md
        anti-pattern #3, original plan text NOT edited mid-flight. This is
        documented divergence with explicit handover — not silent drift.
    - adr: plan2 D4 (T0.1 npm run db:generate vs hand-authored snapshots)
      verdict: DIVERGED + DOCUMENTED — mid-GREEN adaptation
      evidence: |
        Plan2 D4 + § Deep Dives lines 200-202 assumed `drizzle-kit generate`
        emits BOTH 0003 and 0004 snapshots incrementally. Drizzle ORM v0.45
        does NOT model triggers in pgTable (verified by grep on schema.ts —
        zero pgTrigger). drizzle-kit's delta is 1 even when 2 .sql files
        exist. Adaptation shipped in commit 614e588: drizzle-kit generates 0003
        canonical; 0004_snapshot.json is identity-copy with fresh UUID v7 +
        chained prevId; manual idx=4 journal entry mirrors idx=2 shape.
        Followup F1 tracks ADR D4 amendment as post-merge plan v1.4 candidate.
        Plan integrity preserved per cycle-implement.md anti-pattern #3.
    - adr: ADR-0002 (three-tier scope contract)
      verdict: HONORED via plan2 T3.1 (commit 88b9b3b)
      evidence: |
        Original v0.4b silently restricted triggers + multiplier to agent_id.
        F-dom-1 / F-dom-pg-3 CRITICAL surfaced this. T3.1 generalized to the
        Scope discriminated union via scope-where.ts helper + migration
        0005 + per-tier partial indexes. EC-5 absorption: getNeighborScopeId
        dispatches authoritatively on scope.kind (not column presence).
        T7.2 (commit f95322c) locks the User+Session multiplier coverage
        under integration tests.
    - adr: ADR-0006 (bi-temporal local schema)
      verdict: HONORED — soft-delete uniformly via t_invalid
      evidence: |
        T7.1 BREAKING change consolidates caller-driven + trigger-driven forget
        both routing through PgEvictor.evict(). UPDATE memories SET t_invalid
        = NOW() WHERE id = ANY(...) AND t_invalid IS NULL RETURNING id (per
        ADR D17). Audit trail preserved; WHERE t_invalid IS NOT NULL queries
        recover invalidated rows. Plan2 D7 ADR explicitly declares the
        consolidation closes the F-dom-3 inconsistency that ADR D17 §
        Consequences was already promising.
    - adr: ADR-0010 (RepoScope 4th tier)
      verdict: HONORED — preserved in T3.1 scope-tier generalization
      evidence: |
        scope-where.ts § scopeColumn dispatches on `scope.kind === 'repo'`
        and routes the predicate to agent_id (per ADR-0010 EC-4 mapping).
        getNeighborScopeId handles RepoScope same way. No regression to
        v0.6 voyager-skill-library Memory.skills(repoId) public surface.

