    - adr: plan2 D7 (T7.1 forget() PUBLIC API BREAKING)
      verdict: HONORED — declared in CHANGELOG.md with **BREAKING** prefix
      evidence: |
        CHANGELOG.md line 24 starts the entry with literal "**BREAKING**:" prefix.
        Commit message uses `!` conventional-commits BREAKING marker
        (3d178e4: `feat(local)(v0-4b-fixes)!:`). JSDoc contrast block lives at
        src/local/index.ts:489-499 + src/core/memory-store.ts:95-106.
        GDPR escape hatch preserved: forget(id, { hard: true }) routes to v0.1
