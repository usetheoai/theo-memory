new_findings:
  - id: F-arch-rerun-1
    severity: MINOR
    file: src/local/eviction/triadic-scoring-policy.ts
    line: 215-308
    plan_ref: v0-4b-fixes-cycle plan T1.1 + ADR D5
    summary: |
      Constructor overload discriminator relies on `'recency' in arg` — meaning a user
      who legitimately wants to pass a single options-object with weight fields
      `{ recency, frequency, importance }` style is ALWAYS routed to the deprecated
      positional path (treated as `TriadicWeights`). The unit tests at
      scoring-math.test.ts:126 + 141 + 155 rely on this exact behavior. Documented
      via deprecated-JSDoc + the `TriadicScoringPolicyOptions` shape names its weight
      field `weights:` to disambiguate, so this is by design — but the convention
      survives only as long as `TriadicWeights` keeps `recency` as a property name.
      A future refactor of weight property names will silently break the
      discriminator without warning.
    evidence: |
      ```ts
      // src/local/eviction/triadic-scoring-policy.ts:237-239
      function isOptionsObject(arg: unknown): arg is TriadicScoringPolicyOptions {
        return typeof arg === 'object' && arg !== null && !('recency' in arg);
      }
      ```
      A consumer typing
      `new TriadicScoringPolicy({ recency: 0.5, frequency: 0.3, importance: 0.2 })`
      gets the (legacy) positional weights path, NOT the options path. The TS overload
      types steer correctly via the `TriadicScoringPolicyOptions` shape (which has no
      `recency` field), but a TS-as-JS consumer or downstream consumer typing through
      `unknown` could hit the surprise.
    recommended_action: |
      Add a unit test that locks the property-name-as-discriminator contract:
      "isOptionsObject returns false when arg has `recency` field even with extra
      options-like fields". Track the brittleness via a follow-up note tied to the
      future deprecation removal (when the positional overload is removed in the
      next major bump, the discriminator can also go). Not blocking for merge —
      documented behavior + deprecation path is in place.

  - id: F-arch-rerun-2
    severity: MINOR
    file: src/local/eviction/triadic-scoring-policy.ts
    line: 318-323
    plan_ref: F-dom-10 INFO original — addressed via T8.1 documentation reconciliation
    summary: |
      `TriadicScoringPolicy.evict(memoryIds)` (concrete method) remains visible
      ONLY through the concrete type — not part of the `EvictionPolicy` DIP shape
      declared in src/core/dip/eviction-policy.ts. T8.1 commit (7ebc53c) confirmed
      the divergence is intentional + verified the shipped DIP is the canonical
      one (kind + score + selectVictims + lifecycle hooks). The method is called
      ONLY by `evict-soft-delete.test.ts` integration tests + the `__tests__/
      triadic-scoring-options.test.ts` smoke check — zero production callers
      (CapacityBasedTrigger + TimeBasedTrigger issue the soft-delete UPDATE
      INLINE rather than delegating to `policy.evict()`).
    evidence: |
      ```ts
      // src/local/eviction/triadic-scoring-policy.ts:318-323
      async evict(memoryIds: readonly string[]): Promise<EvictionResult> {
        if (this.evictor === null) {
          return { softDeleted: [], alreadyInvalid: [], errors: [] };
        }
        return this.evictor.evict(memoryIds);
      }
      ```
      No production caller. The `evictor: Evictor | null` collaborator is wired
      via `createLocalMemory({ eviction })` but is exercised only via the trigger
      paths (which issue UPDATE inline, not through `policy.evict()`).
    recommended_action: |
      Either (a) remove `TriadicScoringPolicy.evict()` since it's reachable only
      via test code and the integration tests can call `evictor.evict()` directly
      (dead code in production paths), OR (b) add the `evict` lifecycle to the
      EvictionPolicy DIP as an optional method so the contract is visible.
      Acceptable as MINOR for v0.4b ship; track as follow-up. Note that the
      `policy.evict()` API is currently the only ergonomic way for an
      integration test to verify the EvictionPolicy + Evictor wiring without
      reaching into private collaborators, so option (a) needs paired
      test refactor.

  - id: F-arch-rerun-3
    severity: INFO
    file: src/local/eviction/scope-candidate.ts
    line: 53-59
    plan_ref: T6.1 (post-extraction)
    summary: |
      `rowToMemoryItem` reconstructs MemoryItem['scope'] via the agent_id → session_id
      → user_id precedence (commented honestly: "reverses the WRITE-side rule that
      scope.kind is authoritative"). This is the correct READ-time fallback (the
      raw row has columns, not a discriminator), but it diverges from
      `getNeighborScopeId` (in triadic-scoring-policy.ts) which dispatches on
      `scope.kind` instead of column precedence. The two paths agree only when a
      row's `agent_id` column matches `scope.kind === 'agent'`. With multi-tier
      writes (a row with both `user_id='X'` AND `agent_id='Y'`), the read-side
      precedence picks the agent tier while the write-side scope token would have
      picked whichever the caller used.
    evidence: |
      ```ts
      // src/local/eviction/scope-candidate.ts:53-59
      const scope: MemoryItem['scope'] =
        row.agent_id !== null
          ? { kind: 'agent', agentId: row.agent_id }
          : row.session_id !== null
            ? { kind: 'session', sessionId: row.session_id }
            : { kind: 'user', userId: row.user_id ?? '' };
      ```
      No CHECK constraint at the schema layer forbids multi-tier-column-populated
      rows; F-dom-9 (LocalScopedMemory.get) is the upstream pre-existing v0.1
      defect that the rerun fix did not (and was not scoped to) touch. The
      EC-5 absorption in v0.4b-fixes T3.1 documents the discriminator-as-authority
      rule at the WRITE side, but the READ side still uses column precedence.
    recommended_action: |
      Defer to v0.4c / future cycle: either (a) introduce a schema-level CHECK
      constraint enforcing single-tier-column-per-row, OR (b) document the
      read-side fallback precedence as the canonical resolver via an ADR row.
      Not blocking for v0.4b — current consumer surface area exercises one
      scope per row.

  - id: F-arch-rerun-4
    severity: INFO
    file: src/local/index.ts
    line: 545-561
    plan_ref: F-dom-9 (original INFO — v0.1 pre-existing defect)
    summary: |
      `LocalScopedMemory.get(memoryId)` still hard-codes
      `scope: { kind: 'user', userId: ... }` regardless of which scope column
      the row actually carries. This was explicitly scoped OUT of v0.4b-fixes
      (classified as v0.1 pre-existing defect per the F-dom-9 disposition in
      the original review). The v0.4b eviction pipeline does NOT consume
      `LocalScopedMemory.get()` — only `loadCandidates` (which uses the correct
      scope-where path) — so the bug is dormant for the v0.4b code path. Flagging
      for awareness because F-dom-5's future expansion path (if scope coverage
      ever broadens through `get()`) will trip over it.
    evidence: |
      ```ts
      // src/local/index.ts:545-561 — unchanged from v0.1
      async get(memoryId: string): Promise<MemoryItem | null> {
        ...
        return {
          ...
          scope: { kind: 'user', userId: String(result.payload['user_id'] ?? '') },
          ...
        };
      }
      ```
    recommended_action: |
      No action for v0.4b ship — already classified as pre-existing v0.1 defect
      out of scope. Track as v0.4c / cycle-plan candidate when MemoryItem scope
      reconstruction needs to be uniform across get/list/recall return paths.

  - id: F-arch-rerun-5
    severity: INFO
    file: src/local/eviction/scope-where.ts
    line: 26-58
    plan_ref: T3.1 + T12.1 (advisory-lock key namespacing)
    summary: |
      The `scopeColumn` + `scopeValue` + `advisoryLockKey` helpers do correct
      single-responsibility column resolution and kind-namespaced advisory lock
      keys per F-dom-pg-5 T12.1 absorption. The RepoScope mapping (kind='repo' →
      agent_id column) is documented honestly via JSDoc but the trigger pipeline
      does NOT receive `kind='repo'` today (skills are NOT eviction-managed at
      v0.4b — see scope-where.ts:35-40 inline comment). The dead-code-but-correct
      mapping is preserved for symmetry with `getNeighborScopeId`.
    evidence: |
      ```ts
      // src/local/eviction/scope-where.ts:34-40
      case 'repo':
        // RepoScope persists into agent_id with the kind='skill' row discriminator
        // (ADR-0010). The trigger pipeline never receives `kind='repo'` today
        // because skills are not eviction-managed at v0.4b, but the mapping is
        // recorded here for symmetry with `getNeighborScopeId`.
        return 'agent_id';
      ```
    recommended_action: |
      No action — symmetry with the write-side `getNeighborScopeId` is the right
      call. Inline comment is the audit trail. INFO finding documenting that the
      shipped behavior matches the documented contract.

  - id: F-arch-rerun-6
    severity: INFO
    file: src/local/index.ts
    line: 512-543
    plan_ref: T7.1 BREAKING change absorption
    summary: |
      `LocalScopedMemory.forget()` correctly delegates to `PgEvictor` for the
      default soft-delete path (closes F-dom-3 MAJOR) and preserves
      `{ hard: true }` for GDPR-style physical delete. `InMemoryVectorStore` keeps
      the v0.1 hard-delete contract because `t_invalid` is a Postgres-only
      concept (well-documented in the JSDoc). The BREAKING change is honestly
      documented in CHANGELOG with the `**BREAKING**:` prefix per Inquebrável
      Rule 6.
    evidence: |
      ```ts
      // src/local/index.ts:518-529
      const hardDelete = options?.hard === true;
      const isPgStore = this.config.vectorStore instanceof PgvectorStoreClass;
      if (hardDelete || !isPgStore) {
        await this.config.vectorStore.delete(memoryId);
      } else {
        const evictor = new PgEvictor(this.config.vectorStore.poolForEviction);
        await evictor.evict([memoryId]);
      }
      ```
    recommended_action: |
      No action — clean. Architecturally consistent with the auto-eviction path.

  - id: F-arch-rerun-7
    severity: INFO
    file: src/local/index.ts
    line: 647-697
    plan_ref: T4.1 createLocalMemory wiring
    summary: |
      `createLocalMemory` factory cleanly composes the eviction pipeline when
      `config.eviction` is set, throws `EvictionNotSupported` if vectorStore
      is not PgvectorStore (per SEPA iter 5 pre-RED CRITICAL #3), and returns
      a `DisposableMemory` that releases the cron job on `dispose()`. Closes
      F-dom-2 + F-arch-5 + F-wire-2 + F-xval-3 — the public surface is now
      reachable via `createLocalMemory({ eviction: { trigger, ... } })`.
      Local factory return type widened to `DisposableMemory` per ADR
      preserves the cloud-runtime-agnostic `Memory` interface.
    evidence: |
      ```ts
      // src/local/index.ts:642-697
      if (config.eviction === undefined) { ... no-op dispose ... }
      if (!(config.vectorStore instanceof PgvectorStoreClass)) {
        throw new EvictionNotSupported(config.vectorStore.constructor.name);
      }
      // ... wire policy + trigger + return DisposableMemory ...
      ```
    recommended_action: |
      No action — clean factory composition; SRP + DIP honored.

solid_compliance_summary:
  SRP: |
    PASS — Each fixes-cycle change tightens SRP:
    - scope-candidate.ts owns the candidate-load contract (single SQL + single mapper)
    - scope-where.ts owns the column/value/lock-key resolution
    - pg-evictor.ts owns the soft-delete UPDATE + OTel counter
    - createLocalMemory owns wiring composition; LocalMemory owns the public Memory
      interface
    No God classes detected.

  OCP: |
    PASS — The EvictionPolicy DIP (kind + score + selectVictims + optional lifecycle
    hooks) is the explicit extension point. TriadicScoringPolicy is the only built-in
    impl; a 2nd policy can ship without touching the trigger or factory code.
    Trigger SQL composition delegates to scope-where helpers so a 4th tier could
    extend without trigger surgery (though dispatch is currently exhaustive switch).

  LSP: |
    PASS — No subtyping introduced. Discriminated-union Scope handling honors the
    contract (all 4 kinds covered in switch statements; getNeighborScopeId +
    scopeColumn + scopeValue + advisoryLockKey + rowToMemoryItem are all exhaustive).
    No NotImplementedException or thrown errors substitution-wise.

  ISP: |
    PASS — DIPs are role-shaped. EvictionPolicy is 2 required + 2 optional methods.
    HalfLifePersister has 1 method. NearestNeighborProvider has 1 method. Evictor
    has 1 method. No fat interface introduced by the fixes cycle.

  DIP: |
    PASS — `src/core/dip/eviction-policy.ts` imports only from `src/core/memory-item.js`
    + `src/core/scope.js`. T5.1 closed the F-arch-2 inversion (interfaces no longer
    live with their concrete consumer). Boundary-check hook enforces; spot-check
    confirms zero `src/core/` → `src/local/` or `src/cloud/` imports.

