  pillar_a_honest_pass: "10 / 11 production callers — all symbols have at least one functionally necessary caller under src/. The lone exception is `Evictor` (interface), which has no caller by definition because it's a contract; F-wire-rerun-2 INFO covers it."
  pillar_b_honest_pass: "11 / 11 — every symbol exercised by integration tests under tests/integration/forgetting/ + tests/integration/eviction/ + the in-tree barrel test."
  pillar_c_observed: "1 / 1 — OTel counter theo.memory.eviction.soft_deletes_total now lazy-resolved per T10.1; observed via the onSoftDelete test hook in tests/integration/eviction/evict-soft-delete.test.ts + the lazy-init unit test in src/local/eviction/__tests__/pg-evictor-meter-init.test.ts."

  triad_assessment_summary: |
    The 22-commit v0.4b-fixes cycle closes the two MAJOR wiring gaps from the
    2026-05-30 review. The forgetting pipeline is now reachable from the public
    API via TWO distinct surfaces:
      1. `memory.forget(id)` — BREAKING; soft-deletes via t_invalid through
         a fresh PgEvictor when vectorStore is PgvectorStore (default path).
      2. `createLocalMemory({ eviction: {...} })` — opt-in factory wires
         CapacityBasedTrigger (post-remember hook) OR TimeBasedTrigger
         (cron lifecycle) with full PgEvictor + PgHalfLifePersister +
         PgNearestNeighborProvider composition.
    Both surfaces are exercised end-to-end against real pgvector via integration
    tests. The bi-temporal audit-trail invariant (ADR D17) is preserved: writes
    set `t_invalid = NOW()` rather than deleting rows. PgvectorStore.search()
    + .list() already filter `t_invalid IS NULL` (verified in 2026-05-30 review
    F-wire-8), so the consumer-visible recall path honors the soft-delete.

    Scope-tier generalization (T3.1) is correctly composed: every WHERE clause
    in the eviction module routes through scope-where.ts helpers. PgNearestNeighborProvider,
    CapacityBasedTrigger, TimeBasedTrigger, AND the shared loadCandidates helper
    all consume scopeColumn/scopeValue/advisoryLockKey/scopeWhereClause. The
    F-arch-4 DRY violation surfaced in the 2026-05-30 review is fully closed —
    no module hardcodes `agent_id = $1` anymore.

