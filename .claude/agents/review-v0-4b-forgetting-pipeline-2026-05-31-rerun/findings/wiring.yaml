    - PgNearestNeighborProvider.distance (T3.1)    # src/local/eviction/pg-nearest-neighbor-provider.ts:30
    - scopeColumn/scopeValue/advisoryLockKey/scopeWhereClause (T3.1) # src/local/eviction/scope-where.ts
