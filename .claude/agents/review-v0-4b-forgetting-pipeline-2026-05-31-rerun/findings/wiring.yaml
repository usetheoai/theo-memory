      Per the v0.4b-fixes Inquebrável (no orphan interfaces): Evictor IS the
      contract that PgEvictor implements AND TriadicScoringPolicy depends on.
      The single implementor + single type-position-consumer pair is honest
      and consistent with DIP. No follow-up.
    recommended_action: |
