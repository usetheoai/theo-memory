  - id: F-wire-rerun-3
    severity: MINOR
    file: src/local/eviction/triadic-scoring-policy.ts
    line: 318
    plan_ref: 2026-05-30 F-wire-4 carryover
    summary: TriadicScoringPolicy.evict() preserves silent-empty-result trap when evictor is null
    evidence: |
      triadic-scoring-policy.ts:318-323 retains:
        async evict(memoryIds: readonly string[]): Promise<EvictionResult> {
          if (this.evictor === null) {
            return { softDeleted: [], alreadyInvalid: [], errors: [] };
          }
          return this.evictor.evict(memoryIds);
        }
      The MAJOR exposure surface from the 2026-05-30 review (Memory.forget
      routing through policy.evict()) was closed by T7.1 — forget() now
      constructs its OWN PgEvictor and calls evictor.evict() directly. But
      the trap is still latent for advanced consumers that wire
      TriadicScoringPolicy and call policy.evict([ids]) without injecting
      an evictor. The JSDoc at line 315-316 ("callers that need real
      persistence MUST inject one") documents the contract honestly, and
      T1.1's options-object constructor makes the omission explicit (named
      `evictor` field), but the silent-empty-result remains.

      Severity stays MINOR because the public surface (`Memory.forget`,
      `createLocalMemory({ eviction })`) does NOT expose the trap — both
      construct their own PgEvictor unconditionally.
    recommended_action: |
      Defer to v0.5 (or v1.0 contract-freeze) per F-wire-4's original
      recommendation: prefer option (a) — throw EvictorNotConfigured when
      evict() called with null evictor + non-empty input array. Tracked
      explicitly to avoid re-finding at v0.5 review.

  - id: F-wire-rerun-4
    severity: INFO
    file: src/local/eviction/time-based-trigger.ts
    line: 94
    plan_ref: cycle-implement.md § Hard gates #4 (pillar a — non-test caller)
    summary: TimeBasedTrigger.onTick(listener) + isStarted() have no production caller — test-only diagnostics
    evidence: |
