context:
  rerun_purpose: |
    The 2026-05-30 wiring review surfaced 8 findings against the original v0.4b
    forgetting pipeline (F-wire-1 MAJOR + F-wire-2 MAJOR + F-wire-3 INFO +
    F-wire-4 MINOR + F-wire-5 INFO + F-wire-6 MINOR + F-wire-7 INFO + F-wire-8
    INFO). The v0.4b-fixes-cycle then absorbed 22 commits to close them. This
    re-run verifies the closures are HONEST and not "test-only".

  prior_findings_disposition:
    F-wire-1 (MAJOR LocalScopedMemory.forget hard-deletes — bypasses PgEvictor):
      status: CLOSED
      closure_commit: 3d178e4 (T7.1)
      verification: |
        src/local/index.ts:512-543 — Memory.forget() now routes through
        `new PgEvictor(this.config.vectorStore.poolForEviction).evict([memoryId])`
        when the underlying store is `PgvectorStore` AND `options.hard !== true`.
        The hard-delete branch is preserved for `forget(id, { hard: true })`
        (GDPR-style erasure per the BREAKING contract in ADR D7). InMemoryVectorStore
        falls through to the physical-delete branch because `t_invalid` is a
        PG-only concept (documented at line 504-506). The integration test
        `tests/integration/forgetting/forget-soft-delete.test.ts` exercises ALL
        4 paths (default soft-delete, idempotent re-forget, hard delete, EC-12
        MemoryNotFound preservation). Cascade fix: `LocalScopedSkillMemory.forget`
        delegates via `forgetDelegate` → `LocalMemory.forget` (line 600-603) so
        the v0.6 skill consumers ALSO get the soft-delete contract — closes
        F-wire-1 cascade.

    F-wire-2 (MAJOR src/index.ts no v0.4b re-exports):
      status: CLOSED
      closure_commit: cf18b7b (T4.1)
      verification: |
        src/index.ts:27-58 — re-exports the full v0.4b eviction surface from
        `./local/index.js`: TriadicScoringPolicy, PgEvictor, PgHalfLifePersister,
        PgNearestNeighborProvider, CapacityBasedTrigger, TimeBasedTrigger,
        InvalidWeightsError, InvalidCronExpressionError, DEFAULT_TRIADIC_WEIGHTS,
        DEFAULT_TRIADIC_CONSTANTS, getNeighborScopeId, scopeColumn, scopeValue,
        advisoryLockKey, scopeWhereClause, computeRecency, computeFrequency,
        computeImportance, computeHalfLifeSeconds, computeOverflowFraction, plus
        the types (LocalEvictionConfig, TriadicScoringPolicyOptions, TriadicWeights,
        TriadicConstants, HalfLifePersister, NearestNeighborProvider, Evictor,
        TimeBasedTriggerConfig). Smoke tests at
        src/local/__tests__/eviction-barrel.test.ts assert the symbols are
        reachable via 3 paths (eviction/index.js, local/index.js, root index.js).

    F-wire-4 (MINOR TriadicScoringPolicy.evict silent no-op with null evictor):
      status: PARTIALLY CLOSED (acceptable for v0.4b but still latent)
      closure_commit: 22d5b93 (T1.1 — options-object refactor)
      verification: |
        triadic-scoring-policy.ts:318-323 — the silent-empty-result behavior is
        UNCHANGED at the function level. HOWEVER the trap exposure is materially
        reduced because Memory.forget no longer routes through
        TriadicScoringPolicy.evict() — it constructs `new PgEvictor(...)` directly
        (src/local/index.ts:527-528). The remaining trap is for advanced consumers
        wiring TriadicScoringPolicy without an evictor and calling
        `policy.evict([ids])` themselves. T1.1's options-object constructor
        improvement reduces the likelihood of accidental null-evictor injection
        (named field makes the omission explicit), but the silent-empty-result
        is still preserved. See F-wire-rerun-3 below.

    F-wire-3 + F-wire-5 + F-wire-7 + F-wire-8 (INFO):
      status: NO ACTION REQUIRED (per original disposition).

    F-wire-6 (MINOR no src/local/eviction/index.ts barrel):
      status: CLOSED
      closure_commit: cf18b7b (T4.1)
      verification: |
        src/local/eviction/index.ts now exists (56 LoC) — barrel re-exports the
        full v0.4b surface and ALSO declares `LocalEvictionConfig` as the
        discriminated union consumed by `createLocalMemory({ eviction })`.
        Barrel hygiene per architecture.md § 7 honored: shallow re-export chain,
        single source of truth, no deep imports needed by external code.

