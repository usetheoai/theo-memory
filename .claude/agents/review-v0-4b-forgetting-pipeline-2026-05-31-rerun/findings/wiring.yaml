    severity: INFO
    file: src/local/eviction/pg-evictor.ts
    line: 77
    plan_ref: cycle-implement.md § Hard gates #4 (pillar a)
    summary: Evictor interface has no production caller — by design (it's the contract)
    evidence: |
      `grep -rn "implements Evictor" src/` returns only `PgEvictor implements
