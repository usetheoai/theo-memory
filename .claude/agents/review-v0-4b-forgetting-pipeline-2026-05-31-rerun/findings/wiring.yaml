  notes: |
    `grep -rn "from '../local\|from '../../local\|from '../cloud\|from '../theokit\|from '../agent-tools'" src/core` returns
    ZERO matches. `cloud/` does not exist on the tree. T5.1 relocated
    HalfLifePersister + NearestNeighborProvider DIPs from
    src/local/eviction/triadic-scoring-policy.ts to
    src/core/dip/eviction-policy.ts (the canonical DIP location) so the
    eviction concrete (TriadicScoringPolicy) now correctly depends on the
    abstraction at src/core — closes F-arch-2 of the 2026-05-30 review.
    No boundary leak.

concurrent_safety:
  pg_advisory_lock_used: true
  atomic_evict: true
  notes: |
    Both CapacityBasedTrigger.fire() and TimeBasedTrigger.tickNow() acquire
    `pg_try_advisory_xact_lock(hashtext($1))` BEFORE the COUNT+evict path
    (capacity-based-trigger.ts:78-85; time-based-trigger.ts:149-156). The
    advisory-lock key is namespaced as `eviction_${scope.kind}_${scopeValue}`
    (scope-where.ts:78-80), so e.g. `userId='alice'` and `agentId='alice'`
    no longer collide on the same lock keyspace — closes F-dom-pg-5 MINOR.
    Concurrent fires on the same scope short-circuit to `null` rather than
    double-evict (verified by the EC-6 test in createLocalMemory-eviction.test.ts).

    PgEvictor.evict() is a single UPDATE...RETURNING with t_invalid IS NULL
    guard (pg-evictor.ts:39-43) — atomic at the PG layer, idempotent on
    already-soft-deleted rows.

    T9.2 (4601bdb) documents the 0004 trigger race window via an eventual-
    consistency test — orthogonal to the eviction pipeline but in the same
    cluster; no new concurrent-safety regression introduced.

