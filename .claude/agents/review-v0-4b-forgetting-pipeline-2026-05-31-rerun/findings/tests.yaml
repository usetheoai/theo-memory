           extended. Test 2 (line 51-73) correctly stubs `.mockResolvedValue({ rows: [...] })`.
        2. Per testing.md § Mocks: "Mocks in unit tests must be precise — mock the dependency, not the
           world." The bare `as any` cast is the minimum precision; a better-typed Pool stub helper
           reused across the v0.4b suite would surface fewer eslint-disable comments (currently 2
           per test). The eslint-disable trail is the architectural smell here.
    evidence: |
      pg-evictor-meter-init.test.ts:39-41 → `// eslint-disable-next-line ... { query: vi.fn() } as any`
      pg-evictor-meter-init.test.ts:60-62 → same pattern
      testing.md § Mocks → "Mocks in unit tests must be precise — mock the dependency, not the world."
    recommended_action: |
      Acceptable as-is. The test is correctly scoped and the eslint-disable is honest. Future
      cleanup: extract a `makeTestPgPool(opts?): jest.Mocked<Pool>` helper in
      `src/local/__tests__/test-helpers/pg-pool.ts` to consolidate the cast site (~20 LoC). Would
      eliminate the eslint-disable across 10+ test files in v0.4b. Not v0.4b-blocker.

