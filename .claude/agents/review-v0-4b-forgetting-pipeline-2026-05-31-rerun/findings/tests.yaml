summary: |
  v0.4b-fixes-cycle ships a strongly-disciplined test suite layered on top of the original v0.4b
  cycle. 17 net-new test files (5 unit + 12 integration) add ~3000 LoC of test coverage. The four
  user-flagged areas all check out at the contract level:

    1. T11.2 deterministic shuffle: helpers are correctly implemented + tested (7 unit tests in
       deterministic-hash.test.ts; LCG + Fisher-Yates invariants locked; same-seed = byte-
       identical permutation). EC-8 absorption verified. BUT the cleanup itself is partial:
       11 Math.random() sites remain across the v0.4b test surface vs the plan-declared
       "(~10 files)" scope. The commit message documents the conscious divergence ("per-test
       prefixes are already unique within a test scope") for 9 of the 11; the remaining 2
       (lazy-half-life.test.ts:70 + forget-soft-delete.test.ts:51) genuinely depend on
       Math.random(). See F-tests-NEW-1 MAJOR + F-tests-NEW-6 MINOR.

    2. T12.1 lifecycle hook integration tests: correctly verify onEvictionStart + onEvictionEnd
       fire from CapacityBasedTrigger (2 tests in lifecycle-hooks.test.ts). The TracingPolicy
       harness is well-scoped. BUT TimeBasedTrigger's symmetric hook wiring goes untested;
       plan-compliant per T12.1 § TDD but coverage gap surfaces if the cron-callback path
       regresses. See F-tests-NEW-4 MAJOR.

    3. T10.1 lazy-meter spy tests: correctly verify lazy init via spy on metrics.getMeter
       (2 tests in pg-evictor-meter-init.test.ts). Construction does NOT call getMeter;
       evict([]) does NOT call getMeter (EC-10 short-circuit); first non-empty evict() does;
       subsequent calls reuse the cached counter. BUT the named scenario "consumer registers
       MeterProvider AFTER importing @usetheo/memory" is NOT actually exercised — the test
       verifies lazy-init (necessary condition) but doesn't run setGlobalMeterProvider against
       a spy-routed MeterProvider. See F-tests-NEW-3 MAJOR.

    4. T7.1 BREAKING tests: GOLD STANDARD for the cycle. 5 tests in forget-soft-delete.test.ts
       lock the BREAKING contract from all three angles:
         (a) soft-delete via t_invalid (default behavior)
         (b) hard:true preserves GDPR physical-delete (opt-out)
         (c) EC-12 MemoryNotFound on unknown id (error path preserved)
       Plus idempotency on already-evicted rows and the EC-3 PUBLIC API BREAKING contract test
       asserting COUNT(*) == 1 post-forget (NOT 0 as v0.1) with inline contract-delta comment.
       This is exactly the kind of locked-contract-via-test that protects BREAKING changes
       from silent revert. ONE small gap: the cascade impact on v0.6 ScopedSkillMemory.forget()
       (JSDoc src/local/index.ts:499-501) is NOT integration-tested; nor is the InMemoryVectorStore
       hard-delete preservation (JSDoc src/local/index.ts:503-506). See F-tests-NEW-7 MINOR.

  Empirical evidence: 544/546 npm test pass; 67/67 integration eviction+forgetting pass; 2
  pre-existing failures (F3.5 + F3.6) honestly tracked in followups.md and pre-date v0.4b-fixes.
  No skipped tests outside env-gated `describe.skipIf(PG_URI === '')` (legitimate per integration
  test policy). Zero `it.only` / `xit` leaks. All v0.4b-fixes new test names describe BEHAVIOR;
  none use anti-pattern "and" conjunctions or test_N naming.

  TDD compliance: every v0.4b-fixes test file was committed in the SAME commit as its impl
  (atomic RED+GREEN+REFACTOR pattern). Plan-allowed; not strictly RED-first-committed but
  documented per file JSDoc + commit body declaring RED ordering.

  Verdict shape: 4 MAJOR (none release-blockers; all documented honest gaps), 3 MINOR (test-
  hygiene polish), 7 INFO (positive observations + plan-vs-impl deviations all documented).
  Recommend READY_TO_MERGE with the 4 MAJOR findings tracked as v0.4b.1 follow-ups OR closed
