additional_observations:
  - id: OBS-1
    severity: INFO
    file: src/local/eviction/scope-candidate.ts
    lines: 53-59
    summary: |
      `rowToMemoryItem` reads `row.agent_id !== null ? agent : row.session_id !== null
      ? session : user` precedence to rehydrate scope at READ time. The JSDoc at
      lines 44-52 is explicit that this REVERSES the write-side rule where
      `scope.kind` is authoritative (per T3.1 / EC-5). This is a deliberate
      asymmetry — when reading rows back, we only have columns (not kind), and the
      `agent → session → user` precedence is the canonical reproduction shape.
      Documented + correct. Not a regression. Flagged here so reviewers don't
      mistake it for a remaining F-dom-1 surface.

  - id: OBS-2
    severity: INFO
    file: src/local/eviction/triadic-scoring-policy.ts
    lines: 318-323
    summary: |
      `TriadicScoringPolicy.evict()` is a thin wrapper that delegates to the
      injected Evictor when wired, returning empty EvictionResult when null. This
      is correct for pure-math unit tests (no DB roundtrip) and acceptable for
      production paths (consumers wire the PgEvictor via the
      options-object constructor or the createLocalMemory factory). Not a defect.

  - id: OBS-3
    severity: INFO
    file: src/local/eviction/triadic-scoring-policy.ts
    lines: 226-239 + 285-307
    summary: |
      The dual-constructor design (T1.1 options-object + deprecated positional) is
      cleanly implemented via overload signatures + an `isOptionsObject` type guard
      that explicitly handles `undefined`/`null` per EC-2. The
      `Object.setPrototypeOf` pattern is used on both InvalidWeightsError and
      InvalidFractionError so `instanceof` survives ESM/CJS. Good DIP discipline.

  - id: OBS-4
    severity: INFO
    file: src/core/dip/eviction-policy.ts
    lines: 158-192
    summary: |
      T5.1 relocation of HalfLifePersister + NearestNeighborProvider interfaces into
      `src/core/dip/eviction-policy.ts` is architecturally correct per
      architecture.md § 3 (concrete depends on abstraction; abstraction MUST NOT
      live with concrete). The local/eviction barrel re-exports them via type-only
      `export type` for backward compatibility. The DIP file remains pure (no
      runtime impl, no I/O, no import from src/local). Closes F-arch-2 cleanly.

