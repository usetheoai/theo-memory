adr_findings:
  - id: ADR-0002
    status: PRESERVED
    summary: |
      Three-tier scope (User / Session / Agent) is now correctly honored by EVERY
      eviction code path. The Scope discriminated union flows through:
        - filtersFromScope (src/local/index.ts:158-176)
        - scopeColumn / scopeValue / scopeWhereClause / advisoryLockKey (scope-where.ts)
        - loadCandidates (scope-candidate.ts:89-102)
        - CapacityBasedTrigger (capacity-based-trigger.ts:62-148)
        - TimeBasedTrigger (time-based-trigger.ts:65 + 143-204)
        - PgNearestNeighborProvider (pg-nearest-neighbor-provider.ts:30-45)
        - TriadicScoringPolicy.getNeighborScopeId (triadic-scoring-policy.ts:107-118)
        - NearestNeighborProvider DIP (core/dip/eviction-policy.ts:181-192)
      No `scopeId: string` (agent-id-shaped) parameter remains in the trigger pipeline
      after T3.1. The contract is restored: User and Session tiers now evict with
      the same fidelity as Agent.

  - id: ADR-0010
    status: PRESERVED (NOT REGRESSED)
    summary: |
      RepoScope (4th tier) is exposed ONLY via `Memory.skills(repoId)` per ADR-0010.
      The Memory interface (src/core/memory-store.ts:91) declares
      `skills(repoId: string): ScopedSkillMemory`; the LocalMemory impl
      (src/local/index.ts:590-607) wires it to `LocalScopedSkillMemory`. The
      RepoScope kind is RECOGNIZED by every eviction scope-aware function
      (scopeColumn:34-40 maps `kind='repo' → agent_id` per ADR-0010 / EC-4; same for
      scopeValue, advisoryLockKey, getNeighborScopeId, filtersFromScope).
      assertScopeIsNonEmpty (src/local/index.ts:178-196) accepts `kind='repo'`. The
      skills surface itself is unchanged from v0.6 — no regression. EC-4's
      `agent_id`-column-aliasing with the `kind='skill'` row discriminator is
      preserved.

  - id: "ADR-D7-v0-4b-fixes"
    status: HONESTLY DECLARED + IMPLEMENTED
    summary: |
      The forget() BREAKING change is properly declared per the agent's contract
      requirement:
        (1) ADR D7 in .claude/knowledge-base/plans/v0-4b-fixes-cycle-plan.md:117-120
            explicitly marks "T7.1 forget() soft-delete is a PUBLIC API BREAKING CHANGE"
            and gives the rationale (F-dom-3 inconsistency vs ADR D17 § Consequences claim).
        (2) CHANGELOG.md:24 ships the `**BREAKING**:` prefix entry under [Unreleased]
            § Changed with: migration guidance (raw SELECT post-state contract change),
            recovery path (WHERE t_invalid IS NOT NULL), GDPR escape hatch
            ({ hard: true }), InMemoryVectorStore exception note, ScopedSkillMemory
            cascade declaration, and F-dom-3/F-wire-1 finding closure citation.
        (3) Two JSDoc surfaces (Memory.forget at src/core/memory-store.ts:97-110 +
            LocalMemory.forget at src/local/index.ts:484-511) carry the BREAKING
            annotation pointing back to CHANGELOG.md + plan T7.1 + ADR D7.
      Honesty discipline (Inquebrável Rule 3) satisfied — both `**BREAKING**:` CHANGELOG
      prefix AND ADR D7 declaration ship as the agent contract required.

