      Actual location: src/core/__tests__/embedder.test-d.ts
      Same for llm/history-manager/vector-store/reflection-policy.
      vitest.contract.config.ts uses pattern 'src/core/**/__tests__/**/*.test-d.ts'
      so both locations would be picked up; only ONE is used (the flat one).
      src/core/dip/__tests__/ exists but is empty.
    recommended_action: |
      No fix required for v0.0. Stylistic — flat colocate-tests-near-types layout is
