findings:
  - id: F-xval-1
    severity: INFO
    file: src/core/memory-store.ts
    plan_ref: T2.5 Tasks #1 (plan declares 7 types exported from memory-store.ts)
    summary: |
      Minor refactor — ReflectionResult and HistoryEntry are extracted into separate
      sibling files (reflection-result.ts + history-entry.ts) instead of being inline
      in memory-store.ts as the plan declared.
    evidence: |
      Plan T2.5 § Tasks #1 lists "MemoryStore, Memory, ScopedMemory, ReflectionResult,
      HistoryEntry, MemoryConfig, CloudMemoryConfig" as the seven types exported from
      memory-store.ts. Implementation re-exports HistoryEntry and ReflectionResult via
      separate files (src/core/history-entry.ts, src/core/reflection-result.ts).
      Barrel src/core/index.ts L42-44 re-exports both from those sibling files.
      Consumer-visible surface (@usetheo/memory/contract) is identical to plan intent.
    recommended_action: |
      No fix required. Acceptable per architecture.md §6 (one type per file is more
      SRP-aligned). However, the plan's T2.5 Acceptance Criteria checkbox "MemoryStore,
      Memory, ScopedMemory, ReflectionResult, HistoryEntry, MemoryConfig, CloudMemoryConfig
      exported (seven types)" technically reads "from memory-store.ts" — interpret
      semantically (exported via the barrel), not literally (defined in memory-store.ts).
      If a future audit cares about literal file-location: optional ADR noting the
      one-type-per-file split. Otherwise INFO.

  - id: F-xval-2
    severity: INFO
    file: src/core/__tests__/ (multiple)
    plan_ref: T3.1 / T3.2 / T3.3 / T3.4 Files to edit (declared src/core/dip/__tests__/)
    summary: |
      DIP test files (.test-d.ts and .test.ts) land under src/core/__tests__/ instead of
      src/core/dip/__tests__/ as declared in plan T3.x Files-to-edit.
    evidence: |
