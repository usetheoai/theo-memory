aaa_format_analysis:
  type_level_tests:
    format: ✓ PROPER
    example: "expectTypeOf<Memory['user']>().parameters.toEqualTypeOf<[string]>();
              expectTypeOf<Memory['user']>().returns.toEqualTypeOf<ScopedMemory>();
              — Arrange (load type) → Assert (expectTypeOf + matcher). No Act needed (types are static)."
    assessment: "All 92 type-level tests follow vitest/expectTypeOf idiom. Each test is a single, focused type assertion."

  runtime_tests:
    format: ✓ PROPER_ARRANGE_ACT_ASSERT
    examples:
      - "Test: 'MemoryNotFound: instanceof works on a fresh instance'
         Arrange: const e = new MemoryNotFound('mem-uuid-123');
         Act: (implicit — constructor call)
         Assert: expect(e instanceof MemoryNotFound).toBe(true); expect(e.name).toBe('MemoryNotFound'); expect(e.message).toContain(...)"
      - "Test: 'package.json#exports./contract.default is a real path (not null)'
         Arrange: const pkg = readPackageJson();
         Act: const contractEntry = pkg.exports?.['./contract'];
         Assert: expect(contractEntry?.default).not.toBeNull(); expect(typeof contractEntry?.default).toBe('string'); expect(contractEntry?.default).toMatch(/.../);"
    assessment: "All 22 runtime tests follow AAA. Test names describe behavior (not method names). No 'and' in names (split concerns)."

