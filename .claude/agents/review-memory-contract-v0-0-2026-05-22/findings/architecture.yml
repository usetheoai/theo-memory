findings:
  - id: F-arch-1
    severity: INFO
    file: src/core/scope.ts
    plan_ref: D2 (Three-tier scope)
    summary: Three-tier scope design via discriminated union (UserScope | SessionScope | AgentScope) enables strong TypeScript narrowing
    evidence: |
      interface UserScope {
        readonly kind: 'user';
        readonly userId: string;
      }
      interface SessionScope {
        readonly kind: 'session';
        readonly sessionId: string;
        readonly userId?: string; // optional cross-tier filter
      }
      interface AgentScope {
        readonly kind: 'agent';
        readonly agentId: string;
        readonly userId?: string;
      }
      type Scope = UserScope | SessionScope | AgentScope;
    recommended_action: No action needed. SRP respected (single file for scope definition). ISP clean (each scope variant is minimal, no bloated union). Type union vs separate classes is the correct choice per ADR-0002.

  - id: F-arch-2
    severity: INFO
    file: src/core/memory-store.ts
    plan_ref: D3 (ADD-only)
    summary: Public Memory/ScopedMemory interfaces correctly omit update() method; MemoryStore private contract exposes it for DIP use only
    evidence: |
      export interface ScopedMemory {
        remember(text: string, options?: RememberOptions): Promise<readonly MemoryItem[]>;
        recall(query: string, options?: RecallOptions): Promise<readonly MemoryItemWithScore[]>;
        reflect(options?: ReflectOptions): Promise<ReflectionResult>;
        getAll(options?: GetAllOptions): Promise<readonly MemoryItem[]>;
        // NO update method
      }
      export interface Memory {
        user(userId: string): ScopedMemory;
        session(sessionId: string): ScopedMemory;
        agent(agentId: string): ScopedMemory;
        forget(memoryId: string, options?: ForgetOptions): Promise<void>;
        get(memoryId: string): Promise<MemoryItem | null>;
        history(memoryId: string): Promise<readonly HistoryEntry[]>;
        reset(scope: Scope): Promise<void>;
        // NO update method
      }
      export interface MemoryStore {
        remember(text: string, scope: Scope, options?: RememberOptions): Promise<readonly MemoryItem[]>;
        // ... (primitives adapters implement; includes internal update() for DIP use)
      }
    recommended_action: No action needed. ADD-only invariant is correctly enforced at the public surface while allowing internal mutation at the DIP layer.

