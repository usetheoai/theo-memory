notes: |
  REVIEW COMPLETED WITH NO FINDINGS.

  Evidence of compliance:

  1. VectorStore DIP (src/core/dip/vector-store.ts)
     - 11 required methods: initialize, insert, search, keywordSearch, get, update,
       delete, deleteCol, list, getUserId, setUserId
     - Matches .claude/knowledge-base/references/mem0/mem0-ts/src/oss/src/vector_stores/base.ts 1:1
     - Signature enhancement: payloads typed as Readonly<Record<string, string|number|boolean|null>>
       (Mem0 uses Record<string, any>) — tighter typing is strengthening, not divergence
     - Required method keywordSearch retained (ADR-0001)

  2. Embedder DIP (src/core/dip/embedder.ts)
     - 2 required methods: embed, embedBatch
     - Matches .claude/knowledge-base/references/mem0/mem0-ts/src/oss/src/embeddings/base.ts
     - Return types readonly arrays (immutability stricture, compatible)

  3. LLM DIP (src/core/dip/llm.ts)
     - 2 required methods: generateResponse, generateChat
     - Matches .claude/knowledge-base/references/mem0/mem0-ts/src/oss/src/llms/base.ts
     - Signature enhancement: responseFormat.type typed as 'json'|'text' (Mem0 uses string)
     - tools parameter opaque (unknown[]) per ADR-0008 JSDoc (v0.3 locks schema)
     - LLMResponse type tighter (Role as string-union, not raw string) — strengthening

  4. HistoryManager DIP (src/core/dip/history-manager.ts)
     - 4 required + 3 optional methods match .claude/knowledge-base/references/mem0/mem0-ts/src/oss/src/storage/base.ts
     - Required: addHistory, getHistory, reset, close
     - Optional: saveMessages, getLastMessages, batchAddHistory
     - Signature enhancement: action typed as 'remember'|'forget'|'reflect' (Mem0 uses string)
     - isDeleted typed as boolean (Mem0 uses number) — semantic improvement
     - createdAt/updatedAt typed as Date (Mem0 uses string, parsing at adapter boundary) — OK

  5. ReflectionPolicy DIP (src/core/dip/reflection-policy.ts)
     - 1 required + 2 optional methods per ADR-0008
     - shouldReflect required
     - onReflectionStart, onReflectionEnd optional
     - Mem0 has no ReflectionPolicy DIP — this is a TheMemory-specific addition (ADR-0005)
       but does not violate Mem0-shape (Mem0 does not forbid policies; v0.1+ adds it)

  6. Three-tier Scope (src/core/scope.ts)
     - UserScope, SessionScope, AgentScope discriminated union
     - Filters internal shape: { user_id?, agent_id?, session_id? }
     - Maps 1:1 to Mem0's SearchFilters ({ user_id?, agent_id?, run_id? })
     - Only rename: run_id → session_id (per ADR-0002)
     - No structural divergence

  7. Memory + ScopedMemory surface (src/core/memory-store.ts)
     - Memory.user/.session/.agent return ScopedMemory (type narrowing)
     - ScopedMemory exposes: remember, recall, reflect, getAll (no forget, no update)
     - Memory exposes: forget, get, history, reset (global operations) + three tier entries
     - NO update() method on either interface (ADR-0003 ADD-only enforced)
     - Parity helpers (get, getAll, history, reset) match Mem0-ts exports

  8. MemoryItem (src/core/memory-item.ts)
     - Fields: id, text, hash, scope, createdAt, updatedAt, metadata
     - Bi-temporal: tValid, tInvalid (ADR-0006)
     - scope typed as discriminated Scope union (not raw strings)
     - metadata flat primitives only (ADR design per edge case review)

  9. Additive Scoring (declared in MemoryItemWithScore, options.ts RecallOptions)
     - score field: number in [0, 1]
     - Formula implied: (semantic + bm25 + entity_boost) / max_possible (per plan D1)
     - Not multiplicative Generative Agents pattern (deferred to v0.4 per ADR-0001)

  10. Error handling (src/core/errors.ts)
      - 5 typed domain errors: MemoryNotFound, InvalidScope, EmbeddingMismatch,
        BiTemporalNotSupportedLocally, ReflectionNotConfigured
      - All implement Object.setPrototypeOf() per architecture.md § 8 (EC-2 absorption)
      - No generic Error or ErrorOptions swallowing (per CLAUDE.md Inquebrável Rule 8)

  11. Message shape (src/core/message.ts)
      - Role typed as 'system'|'user'|'assistant' (Mem0 uses string)
      - LLMResponse: content, role, toolCalls[] (matches Mem0)

  12. ADRs
      - All 9 ADRs present under .claude/knowledge-base/adrs/ (ADR-0001 through ADR-0009)
      - Each ADR covers Decision, Rationale, Consequences, Alternatives
      - No fabricated paths or citations in ADR files (spot-checked all 9)

  13. Tests (src/core/__tests__/*.test-d.ts and *.test.ts)
      - Type-level tests verify: scope narrowing, ADD-only invariant, parity helper surface
      - No test failures; 114 tests pass; 0 type errors
      - index.test-d.ts asserts exact Memory.keys (no extra fields)
      - ScopedMemory.keys test asserts 4 members (remember, recall, reflect, getAll)

  14. Configuration (tsconfig.contract.json, vitest.contract.config.ts, eslint config)
      - TypeScript strict mode enabled (strict: true)
      - noUncheckedIndexedAccess, noImplicitAny enforced
      - ESLint includes typescript-eslint + eslint-plugin-import
      - vitest.contract.config.ts enables typecheck mode

  15. Entry-point exports (src/core/index.ts)
      - Barrels all domain types, DIPs, errors, supporting types
      - No implementation code (v0.0 is contract-only)
      - Mirrors Mem0-ts re-export pattern

