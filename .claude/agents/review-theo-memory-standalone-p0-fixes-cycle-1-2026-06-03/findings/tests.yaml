aaa_compliance:
  format_audit: all 10 new tests follow Arrange-Act-Assert
  test_names_describe_behavior: yes
  no_and_in_names: yes — no compound test names
  notes: |
    Naming convention: `FC1-T<task>-RED-<n>. <behavior>` for plan-tracked
    RED tests; `<n>. FC1-T<task> EC-<m> — <behavior>` for absorbed
    edge-case tests. Behavior-first descriptions throughout.

edge_cases_from_plan:
  covered: 7
  missing: []
  per_edge_case:
    EC-1:
      description: T2.1 envelope shape contradiction (Sub-goal 4 vs ADR D3)
      covered_by: handlers.test.ts FC1-T2.1-RED-1 lines 365-369
      assertion: 'expect(body.code).toBe(''CONTENT_TOO_LARGE''); expect(typeof body.message).toBe(''string'')'
      status: COVERED
    EC-2:
      description: T1.1 zod-strict path returns VALIDATION_ERROR (not INVALID_SCOPE)
      covered_by: handlers.test.ts FC1-T1.1-RED-1 line 320
      assertion: 'expect(body.code).not.toBe(''INTERNAL_ERROR'')'
      status: COVERED
      observation: |
        Negative-space assertion is honest acknowledgment of EC-2 — the
        actual code may be VALIDATION_ERROR / INVALID_BODY / INVALID_SCOPE
        depending on which zod issue fires first. The inline comment
        documents WHY (zod .strict() runs before superRefine). Pinning a
        specific positive code would be premature; the absence of
        INTERNAL_ERROR is the meaningful regression guard.
    EC-3:
      description: T1.2 test file import paths must update in same commit
      covered_by: implicit via test suite staying green (no separate test)
      status: COVERED
      observation: |
        Verified via grep that all 4 sibling handlers
        (forget/recall/remember/reflect.ts) import from './_body-parsing.js'
        in the same commit (703fc5a). No test files import the parsing
        helpers directly (they go through the handler surface), so EC-3
        rule is honored without a dedicated assertion.
    EC-4:
      description: T1.1 skill branch short-circuit BEFORE memory.skills()
      covered_by: scopes.test.ts #12b lines 184-198
      assertion: 'expect(skillsMock).not.toHaveBeenCalled()'
      status: COVERED
      observation: |
        Strong assertion — proves the 501 branch executes BEFORE the
        legacy dispatch (which would have crashed at getAll). The vi.fn()
        stub records the call; .not.toHaveBeenCalled() is deterministic.
    EC-5:
      description: T1.1 OpenAPI spec re-validation (skillRepoId absent)
      covered_by: openapi.test.ts #5 lines 81-96
      assertion: 'expect(Object.keys(props)).not.toContain(''skillRepoId'')'
      status: COVERED
      observation: |
        Iterates all 4 verbs. Defensive `if (props !== undefined)` skips
        verbs whose schema lacks request body (forget has none).
    EC-6:
      description: T2.2 stderr pollution from stub-embedder warning in legacy tests
      covered_by: run-server.test.ts beforeEach line 87
      assertion: stderrSpy = vi.spyOn(process.stderr, 'write').mockImplementation(() => true)
      status: COVERED
      observation: |
        Shared beforeEach spy suppresses noise across all 9 tests in the
        file. afterEach restores via stderrSpy.mockRestore(). Legacy
        test #50 layers a localStderrSpy (per inline comment) because it
        pre-dates EC-6 and needs scoped capture — pragmatic layering.
    EC-7:
      description: T2.1 middleware order regression (bodyLimit BEFORE bearer)
      covered_by: handlers.test.ts FC1-T2.1-RED-2 lines 371-393
      assertion: 'expect(res.status).toBe(413); expect(res.status).not.toBe(401)'
      status: COVERED
      observation: |
        Critical load-bearing regression guard for ADR D3 ordering.
        try/finally protects env state. The `.not.toBe(401)` assertion is
        tautological after `.toBe(413)` but harmless.
    EC-8:
      description: T2.2 warning conditional gating (future cycle)
      coverage: documented in run-server.ts inline comment (lines 106-109)
      status: DEFERRED — documentation-only per edge-case-plan classification
    EC-9:
      description: T2.1 gzip-compressed bodies bypass size limit
      coverage: deferred to README (not yet added)
      status: DEFERRED — documentation-only per edge-case-plan classification
      observation: |
        Plan task T2.1 acceptance does NOT require README update for EC-9
        (classified DOCUMENT, not SHOULD TEST). Reverse-proxy enforcement
        in production is the workaround. NOT a test gap.

