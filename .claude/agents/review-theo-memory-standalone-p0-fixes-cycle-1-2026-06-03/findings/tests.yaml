findings:
  - id: F-tests-1
    severity: MINOR
    file: src/server/__tests__/handlers.test.ts
    line: 375
    plan_ref: T2.1 / EC-7 absorption
    summary: |
      FC1-T2.1-RED-2 mutates process.env directly via try/finally instead
      of vi.stubEnv / vi.unstubAllEnvs. Consistent with the rest of the
      file would be vi.stubEnv pattern; same safety either way.
    evidence: |
      Line 375: process.env['THEMEMORY_API_KEY'] = 'sk-secret';
      Line 391: delete process.env['THEMEMORY_API_KEY'];

      Compare with the rest of run-server.test.ts which uses vi.stubEnv +
      vi.unstubAllEnvs in afterEach.
    recommended_action: |
      Replace direct env mutation with vi.stubEnv('THEMEMORY_API_KEY', 'sk-secret')
      and add vi.unstubAllEnvs() in finally — or rely on a per-file afterEach
      with vi.unstubAllEnvs() (already established in run-server.test.ts).
      Cosmetic; can be deferred to a future refactor cycle.
    deferred_ok: yes
    blocking_merge: no

  - id: F-tests-2
    severity: MINOR
    file: src/server/__tests__/handlers.test.ts
    line: 389
    plan_ref: T2.1 / EC-7 absorption
    summary: |
      Redundant negative assertion `expect(res.status).not.toBe(401)` after
      `expect(res.status).toBe(413)` is tautological. Documents intent
      but adds noise.
    evidence: |
      Line 388: expect(res.status).toBe(413);
      Line 389: expect(res.status).not.toBe(401);
      If status is 413, it's not 401 by definition.
    recommended_action: |
      Drop the redundant `.not.toBe(401)` OR keep as documentation. The
      inline comment "Order MUST be OTel → bodyLimit → bearer" already
      pins intent. Stylistic; not blocking.
    deferred_ok: yes
    blocking_merge: no

  - id: F-tests-3
    severity: MINOR
    file: src/server/__tests__/handlers.test.ts
    line: 395
    plan_ref: T2.1 / FC1-T2.1-RED-3
    summary: |
      FC1-T2.1-RED-3 asserts 201 but does NOT assert that
      scoped.remember was invoked. A stronger assertion would prove the
      handler path completed AFTER body-limit passthrough.
    evidence: |
      Lines 395-406: asserts only res.status === 201.
      Other 201-path tests (e.g., test #1 line 79) assert
      `scoped.remember toHaveBeenCalledWith(...)` to prove handler execution.
    recommended_action: |
      Add `expect(stubScopedMemory.remember).toHaveBeenCalled()` to
      strengthen the negative-space test (body-limit DID let small bodies
      reach the handler). Optional defense-in-depth.
    deferred_ok: yes
    blocking_merge: no

  - id: F-tests-4
    severity: INFO
    file: src/server/__tests__/handlers.test.ts
    line: 305
    plan_ref: T1.1 / EC-2 absorption
    summary: |
      FC1-T1.1-RED-1 uses `.not.toBe('INTERNAL_ERROR')` as a negative-space
      assertion rather than pinning the specific positive code. This is
      honest acknowledgment of EC-2 (zod .strict() runs before superRefine
      so VALIDATION_ERROR / INVALID_BODY / INVALID_SCOPE all possible),
      but a future refactor could surface a different specific code and
      the test would still pass.
    evidence: |
      Line 320: expect(body.code).not.toBe('INTERNAL_ERROR');
      Inline comment documents WHY (zod .strict() pre-superRefine).
    recommended_action: |
      Acceptable as-is — the negative assertion guards the regression
      (skillRepoId no longer crashes into 500). If the zod surface
      stabilizes around a specific code, tighten to positive assertion in
      a future cycle. Document as INFO, not actionable.
    deferred_ok: yes
    blocking_merge: no

  - id: F-tests-5
    severity: INFO
    file: tests/integration/
    line: n/a
    plan_ref: F-rev-1 (CRITICAL)
    summary: |
      No defense-in-depth integration test exercising /v1/scopes/skill/:id/memories
