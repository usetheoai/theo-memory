summary: |
  F-rev-1 CRITICAL absorption is GENUINE — not covered up. The double-cast was the
  symptom of a deeper LIE (MemoryLike falsely declared a `skills` member that returned
  ScopedMemoryLike with `remember/recall/reflect`, when the real Memory.skills returns
  ScopedSkillMemory with `add/recall/consolidate/forget`). The fix-up corrected the
  contract at the TYPE layer first (MemoryLike trimmed to user/session/agent only) +
  the SCHEMA layer (SCOPE_KEYS, ScopeFields, resolveScope) + the ROUTING layer
  (scopes.ts skill branch short-circuits before dispatch with Exclude<ScopeType,'skill'>
  signature narrowing) — making the double-cast redundant rather than smuggling it
  past the type system again.

  Plan ADR D1 Option A executed cleanly. The 'skill' enum entry at SCOPE_TYPES path
  level is intentionally preserved per EC-13 + the design distinction between
  501 NOT_IMPLEMENTED (we know about it, don't expose it via REST) vs 404 NOT_FOUND
  (we don't know about it). Mem0-shape architectural invariants are untouched —
  zero diff under src/core/.

  Test coverage is genuine: 30/30 tests PASS (handlers.test.ts + scopes.test.ts) +
  Type Errors: no errors per the contract tsconfig — confirming the type-clean
  call sites without the cast.
