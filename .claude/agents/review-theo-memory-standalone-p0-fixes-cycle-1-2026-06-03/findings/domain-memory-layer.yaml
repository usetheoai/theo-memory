design_coherence_skill_enum_at_path_level:
  question: "Is preserving SCOPE_TYPES = ['user','session','agent','skill'] at the path level while short-circuiting BEFORE dispatch a coherent design?"
  answer: "YES — coherent and intentional per plan T1.1 § Decision and § Consequences."
  rationale: |
    The source plan (theo-memory-standalone-p0) T1.3 + EC-13 declared SCOPE_TYPES as
    case-sensitive {user,session,agent,skill} for the path-param validation layer. This
    governs WHAT path strings are accepted as the :type segment. Preserving the 4-element
    enum keeps three properties:
    1. Path 'skill' returns 501 (an honest, intentional response) NOT 404 (which would
       falsely imply the route doesn't exist at the routing layer)
    2. Path 'Skill'/'SKILL' continue to return 404 (case-sensitive — EC-13 preserved)
    3. The dispatch function pathParamsToScoped is TypeScript-narrowed via
       Exclude<ScopeType, 'skill'> so the 'skill' branch is statically unreachable
       in the dispatch — the runtime short-circuit and the type system are aligned

    The alternative (drop 'skill' from SCOPE_TYPES too) would change the consumer
    contract from "501 NOT_IMPLEMENTED" to "404 NOT_FOUND" for a known-but-unsupported
    operation — strictly less honest. The current design correctly distinguishes
    "you asked for something we know about but don't expose via REST" (501) from
    "you asked for something we don't know about" (404).

