    summary: hono/body-limit landed verbatim per ADR D3 v1.1. Middleware order is OTel → bodyLimit → bearer (load-bearing per EC-7). The onError callback constructs `ContentTooLargeError` and routes through `mapDomainErrorToResponse` so the 413 envelope shape matches every other 4xx/5xx — EC-1 absorption is structurally honored.
    evidence: |
      ```ts
      // src/server/app.ts:87-109
      app.use('/v1/*', otelMiddleware(tracer));
      app.use('/v1/*', bodyLimit({
        maxSize: 1_000_000,
        onError: (c) => {
          const { status, body } = mapDomainErrorToResponse(
            new ContentTooLargeError(1_000_000, -1),
          );
          return c.json(body, status as Parameters<typeof c.json>[1]);
        },
      }));
      // ...
      app.use('/v1/*', bearerAuth(authVerifier));
      ```
      Two health endpoints land BEFORE `bearerAuth` so probes stay auth-exempt — pre-existing EC-22 ordering preserved. ContentTooLargeError exists in src/core/errors.ts:297, mapDomainErrorToResponse handles it at src/server/errors.ts:71 → returns `{ code: 'CONTENT_TOO_LARGE', message: 'Payload exceeds maximum allowed size.' }` with HTTP 413. Sanitized message hides the misleading "-1 bytes" sentinel from the wire.
    recommended_action: None — accept. Both RED tests in handlers.test.ts (FC1-T2.1-RED-1, RED-2, RED-3) cover the envelope shape + middleware order regression + small-body passthrough.
