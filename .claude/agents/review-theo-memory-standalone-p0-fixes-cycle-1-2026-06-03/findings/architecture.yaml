overall_verdict: |
  READY_TO_MERGE_WITH_CAVEATS — the 6 fix-up commits absorb F-rev-1 CRITICAL + 4 MAJOR cleanly. The skill-scope contract divergence is GENUINELY gone (not covered up): SCOPE_KEYS narrowed, ScopeFields narrowed, MemoryLike interface narrowed, resolveScope dispatch narrowed, scopesHandler short-circuits to 501 BEFORE the dispatch table, and pathParamsToScoped's signature uses `Exclude<ScopeType, 'skill'>` so TS refuses to compile if the safety net is removed.

  hono/body-limit landed verbatim per ADR D3 v1.1 with the correct middleware order (OTel → bodyLimit → bearer) and the EC-1 structured envelope wiring through `mapDomainErrorToResponse(new ContentTooLargeError(...))`. SRP refactor extracted `_body-parsing.ts` cleanly with all 4 verb handlers re-pointed.

  CAVEATS:
  1. F-arch-7 MAJOR — MCP-side stub-embedder warning has no RED test (TDD gap per Inquebrável Rule 5); plan absorbed implicitly but architectural review surfaces it. Recommended follow-up: add `run-mcp-server.test.ts` or extend `cli.test.ts` in the next maintenance cycle.
  2. F-arch-2 MINOR — OpenAPI `ScopeTypeEnum` still advertises 'skill' as a valid path param while the runtime returns 501. Codegen clients will emit guaranteed-501 calls. Either narrow the enum or document the 501 in the OpenAPI responses block.
  3. F-arch-4 MINOR — `_body-parsing.ts` location convention (shared helper next to verb-route files) is a hygiene smell; flagged for future layout cleanup.
  4. F-arch-6 MINOR — `ContentTooLargeError(1_000_000, -1)` sentinel produces a misleading message at the logger surface (wire is sanitized). Acceptable as-is until OTel exception events get recorded on 413s.

  No BLOCKER / CRITICAL findings. DIP boundary intact (zero `pg` imports added to src/server/, zero src/local|cloud imports added to src/server/). No `any` types introduced. No `console.*` in production paths. The fix-up cycle delivers what it promised; the 4 caveats are all follow-ups, none invalidate the absorption.
