reachability_summary: |
  End-to-end opt-in path is REACHABLE and HONEST:
    env (THEOMEM_SKILL_EXECUTION=true)
      -> resolveSkillExecutionEnabled()  (agent-tools-memory.ts:94)
      -> wireMemoryFromPool:190  new SandboxedSkillExecutor() conditionally spread into createLocalMemory
      -> reached by ALL three entrypoints:
           run-server.ts:157 (inside EC-33 warm promise)
           run-mcp-server.ts:278
           createAgentToolsMemory():236 (CLI verb handlers)
      -> ScopedSkillMemory.execute() -> SandboxedSkillExecutor (isolated-vm)
  Default OFF path is byte-preserving: conditional spread
    `...(skillExecutor !== undefined ? { skillExecutor } : {})` never passes
    `skillExecutor: undefined`, so env-unset createLocalMemory call is unchanged
    (unit test 'disabled by default' asserts `'skillExecutor' in cfg === false`).
  SandboxedSkillExecutor is exported from the core barrel (core/src/index.ts:82);
  resolveSkillExecutionEnabled is re-exported from the agent-core barrel
  (`export * from './agent-tools-memory.js'`) AND used internally AND unit-tested
  -> NOT a dead export.
  Dockerfile node-linker=hoisted is the load-bearing fix: it flattens
  node_modules so the distroless runtime (which copies only the root node_modules)
  can resolve isolated-vm + onnxruntime-node. The distroless-verify evidence file
  records HTTP 200 {"output":42} from a live container with the env enabled —
  consistent with the claim that the hoisted layout makes isolated-vm reach runtime.
findings:
  - id: F-wire-1
    severity: MEDIUM
    file: tests/integration/skill-execution-server-wiring.test.ts
    line: 74
    plan_ref: T2.1 GOAL — "build the REST app via the same wiring path with the env toggled"
    summary: >
      GOAL integration test proves the wired-vs-unwired BEHAVIOR but does NOT exercise
      the real wire site (wireMemoryFromPool with THEOMEM_SKILL_EXECUTION toggled). It
      replicates the wiring inline via a local buildMemory() helper. No single test
      proves env -> wireMemoryFromPool -> skillExecutor against the actual production
      construction site; the env->executor mapping is covered only at the unit tier
      with createLocalMemory mocked.
    evidence: |
      buildMemory() (line 73-83) reconstructs createLocalMemory({ ...skillExecutor })
      directly instead of calling wireMemoryFromPool. The file comment is explicit:
      "The exact wiring wireMemoryFromPool performs per THEOMEM_SKILL_EXECUTION" — i.e.
      a faithful COPY, not the wire itself. If a future edit to wireMemoryFromPool drops
      the conditional spread or the resolver call, the unit test (mocked createLocalMemory)
      would catch the mapping, but no integration test would catch a real-wire-to-real-execute
      regression. The plan's T2.1 step 1 ("build the REST app via the same wiring path")
      and Deep file dependency analysis ("Exercises wireMemoryFromPool/createServer with
      THEOMEM_SKILL_EXECUTION toggled via process.env") describe calling the real wire;
      the implementation diverged to an inline replica.
    recommended_action: >
      Add (or convert one GOAL case to) an integration assertion that sets
      process.env.THEOMEM_SKILL_EXECUTION='true', calls wireMemoryFromPool(pool)
      against real pg, then executes a skill and asserts output — closing the
      replica-vs-real-wire gap. The distroless live HTTP 200 evidence partially
      mitigates (it DOES hit the real wire end-to-end), so MEDIUM not HIGH.
  - id: F-wire-2
    severity: INFO
    file: .claude/knowledge-base/reviews/production-runtime-hardening-distroless-verify-2026-06-22.md
    line: 15
    plan_ref: T2.2 / ADR D3 — distroless live verification (the runtime metric / pillar c proof)
    summary: >
      Pillar (c) for T2.1/T2.2 is the distroless live verification (HTTP 200), not an
