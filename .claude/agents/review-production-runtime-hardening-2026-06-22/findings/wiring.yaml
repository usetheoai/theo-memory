  - id: F-wire-3
    severity: INFO
    file: packages/agent-core/src/agent-tools-memory.ts
    line: 190
    plan_ref: T1.1 / EC-1 / EC-4 — addon-free static import, no boot crash
    summary: >
      Boundary + lazy-load discipline verified honest. The static
