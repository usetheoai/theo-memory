  - id: F-dom-infra-2
    severity: INFO
    file: Dockerfile
    line: 121
    plan_ref: "ADR D4 — build resilience (bounded retry)"
    domain_anchor: "Inquebrável Rule 8 (fail loud, never silent-skip), no infinite loop"
    summary: >
      The bounded retry loop is correct and fails LOUD. `for i in 1 2 3` is a
      finite range (max 3 iterations — no infinite loop). On success `&& break`
      exits early. On the 3rd failure `[ "$i" = "3" ] && ... exit 1` aborts the
      build with non-zero status (RUN fails → image build fails). There is NO
      silent-skip path: a persistently failing install never produces an image.
      Same pattern correctly applied to both builder (line 64) and production-deps
      (line 122). Backoff (sleep $((i*5)) = 5s,10s) is sensible for a CDN flake.
    evidence: |
      Dockerfile:122-127
        for i in 1 2 3; do
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted $OPT_FLAG && break;
          echo "...retrying in $((i*5))s..."; sleep $((i*5));
          [ "$i" = "3" ] && echo "prod install failed after 3 attempts" && exit 1;
        done
    recommended_action: None — bounded and fail-loud as required.

  - id: F-dom-infra-3
    severity: LOW
    file: Dockerfile
    line: 122
    plan_ref: "ADR D4 — build resilience (bounded retry)"
    domain_anchor: "fail-loud completeness (non-CDN failure on 3rd attempt)"
    summary: >
      Minor robustness gap in the retry construct: the final `exit 1` is gated on
      `[ "$i" = "3" ]` AND fires only inside the loop body AFTER a failed attempt.
      Because the loop has exactly 3 iterations, this works. BUT the construct
      relies on the loop variable string-comparing to the literal "3"; if the
      range is ever edited (e.g. to `1 2 3 4 5`) without updating the "3" literal,
      the loop would exhaust silently and the RUN would exit 0 (last statement is
      the `sleep`/echo, success), shipping an image with a FAILED install. This is
      a latent footgun, not a current defect (range and literal agree today).
    evidence: |
      Dockerfile:126  [ "$i" = "3" ] && echo "prod install failed after 3 attempts" && exit 1;
      The cap literal ("3") is decoupled from the for-range ("1 2 3"); they must be
      kept in sync manually. A drift would convert fail-loud into silent-success.
    recommended_action: >
      Optional hardening: replace the in-loop literal-gated exit with a
      post-loop guard, e.g. `... && break; done; pnpm install ... || exit 1`
      using a trailing unconditional check, OR derive the cap from a single var
      (MAX=3; for i in $(seq 1 $MAX); ...; [ "$i" = "$MAX" ] && exit 1). Keeps
      fail-loud invariant resilient to future range edits. Non-blocking.

