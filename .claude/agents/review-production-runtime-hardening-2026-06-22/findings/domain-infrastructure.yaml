    domain_anchor: "--frozen-lockfile honored under node-linker=hoisted"
    summary: >
      `--frozen-lockfile` IS still honored alongside `--config.node-linker=hoisted`.
      node-linker controls the on-disk node_modules SHAPE (flat vs isolated); it
      does not alter dependency RESOLUTION (the resolved graph in pnpm-lock.yaml
      lockfileVersion 9.0). pnpm-lock.yaml declares no `node-linker` setting
      (grep: 0 hits), so the override is a layout-only directive applied at link
      time; the resolution step still validates against the frozen lockfile and
      aborts on any drift. No phantom deps are introduced — hoisting re-places the
      SAME resolved set at the top level, it does not add packages. Risk that
      hoisted "pulls phantom deps": NOT present (hoisting exposes already-resolved
      deps to a flatter path; it does not widen the dependency set).
    evidence: |
      pnpm-lock.yaml: lockfileVersion '9.0'; `grep -c node-linker pnpm-lock.yaml` = 0
      node-linker is a pnpm install/link directive orthogonal to the resolved graph;
      --frozen-lockfile guards resolution, not layout.
    recommended_action: None — combination is valid.

