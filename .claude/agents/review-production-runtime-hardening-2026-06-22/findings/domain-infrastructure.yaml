      discarded with the production-deps stage and never reach the distroless
      image. Additionally, the runtime does NOT need node_modules/@usetheo/*
      because postbuild:rewrite-aliases rewrites all @usetheo/* specifiers in
      dist/ to RELATIVE paths — so the flat third-party node_modules suffices.
    evidence: |
      packages/core/package.json optionalDependencies: { isolated-vm, @xenova/transformers, ... }
      Dockerfile:138-140 — runtime copies dist/ + node_modules/ + package.json ONLY (no packages/)
      scripts/rewrite-dist-aliases.mjs — rewrites @usetheo/* to relative dist paths
    recommended_action: None — correct; sources stay in the throwaway stage.

