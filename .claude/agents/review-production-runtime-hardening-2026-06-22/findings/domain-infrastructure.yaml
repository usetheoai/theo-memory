    domain_anchor: "runtime bloat (only node_modules copied to runtime)"
    summary: >
      `COPY packages/ ./packages/` in production-deps is NECESSARY and does NOT
      bloat the runtime. Necessary because pnpm requires each workspace
      package.json present to see packages/core's optionalDependencies
