documented_deviations_assessment:
  ec4_static_import:
    verdict: NOT_A_DIVERGENCE
    rationale: |
      The plan's Deep Dive (line 135) was UPDATED during edge-case absorption (v1.1) to specify the STATIC
      import as the chosen approach (EC-4 explicitly prefers static over the originally-proposed dynamic
      import, because createLocalMemory is already a static barrel import and SandboxedSkillExecutor's ctor is
      addon-free). The implementation matches the absorbed plan. No silent divergence.
  node_linker_hoisted_evolution:
    verdict: IN_SCOPE_HONEST_EVOLUTION
    rationale: |
      The plan T3.1/D4 scoped Docker work to "bounded retry around the native-optional install". The GOAL/D3,
      however, is "isolated-vm loads + executes in distroless". During implementation the real root cause of the
      live 503 was found to be pnpm's DEFAULT isolated node_modules layout (optional natives never reach the
      top-level node_modules the distroless runtime copies) — the toolchain pin alone was necessary-but-
      insufficient. The fix (--config.node-linker=hoisted + COPY packages/) is broader than the plan's literal
      "toolchain/retry" mechanism but is squarely in service of the plan's GOAL + D3 (and also fixes a latent
      onnxruntime-node/local-embedder bug). It is documented end-to-end (commit body, Dockerfile comments,
      evidence file). This is honest evolution toward the stated goal, NOT scope drift — flagged INFO for
      transparency, not as a defect.

