findings:
  - id: F-tests-1
    severity: HIGH
    file: tests/integration/skill-execution-server-wiring.test.ts
    line: 75
    plan_ref: T2.1 GOAL + "Deep file dependency analysis — Exercises wireMemoryFromPool/createServer with THEOMEM_SKILL_EXECUTION toggled via process.env in-test"
    summary: >
      The GOAL integration test does NOT exercise the real production wiring site
      (wireMemoryFromPool) nor toggle the THEOMEM_SKILL_EXECUTION env. It
      re-implements the env->executor decision inline via a local
      buildMemory(boolean) helper that hand-constructs createLocalMemory with/without
      a SandboxedSkillExecutor. As a result, no single test proves end-to-end that
      the ACTUAL runtime path (wireMemoryFromPool reading the env) wires the executor
      against real isolated-vm + real pg. The unit test proves env->config mapping
      with a MOCKED createLocalMemory; the integration test proves real execute with a
      HAND-WIRED config. The seam between them — the real wireMemoryFromPool honoring
      the real env at runtime — is covered by NO test.
    evidence: |
      tests/integration/skill-execution-server-wiring.test.ts:75-83 — buildMemory()
      calls createLocalMemory directly (not wireMemoryFromPool); never sets/reads
      process.env['THEOMEM_SKILL_EXECUTION']. The file header (line 13-15) acknowledges
      this: "The env->executor mapping itself is unit-tested ... (mocked
      createLocalMemory); this test proves the runtime BEHAVIOR of each path."
      But the plan T2.1 Deep file dependency analysis explicitly says the integration
      test should toggle the env and exercise wireMemoryFromPool/createServer.
      grep 'wireMemoryFromPool\|process.env' tests/integration/skill-execution-server-wiring.test.ts
      -> 0 matches in the test body (only a comment mentions wireMemoryFromPool).
    recommended_action: >
      Add one integration case that sets process.env['THEOMEM_SKILL_EXECUTION']='true',
      calls wireMemoryFromPool(pool) (the real site), and executes a skill (assert
      output) — and a mirror with the env unset asserting 501/SkillExecutionNotConfigured.
      Restore the env in afterEach. This closes the mock-vs-real wiring gap and matches
      the plan's stated T2.1 contract. Alternatively, document the deliberate split as
      an ADR if the inline-config approach is intended (but then the plan's "toggled via
      process.env in-test / Exercises wireMemoryFromPool" wording is inaccurate and
      should be corrected).

