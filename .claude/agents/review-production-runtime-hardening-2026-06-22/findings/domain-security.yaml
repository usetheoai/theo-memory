    summary: >
      The production-deps stage now ships the isolated-vm native addon (hoisted flat
      node_modules) even when THEOMEM_SKILL_EXECUTION is OFF. Shipping an unused
      RCE-capable addon is NOT a security concern here because (a) it is lazy-loaded
      — only `import('isolated-vm')` at execute() time, never at module-load or
      constructor (EC-1, regression-tested); (b) execute() is unreachable unless the
      gate is ON (no skillExecutor → SkillExecutionNotConfiguredError → REST 501);
      (c) presence of a dormant binary is not exploitable without an invocation path.
      Acceptable. Noted for the record so a future audit does not re-flag the addon's
      presence in the image as a surprise.
    evidence: |
      Dockerfile production-deps stage:
        pnpm install --prod --frozen-lockfile --config.node-linker=hoisted
      agent-tools-memory.ts:190 — executor only constructed when gate is true:
        const skillExecutor = resolveSkillExecutionEnabled() ? new SandboxedSkillExecutor() : undefined;
      isolated-vm is a type-only static import in the executor impl (EC-4); loads
      lazily at execute() (EC-1) — gated, so unreachable when OFF.
    recommended_action: >
      None required. Optionally document in the README/MCP setup guide that the
      production image bundles isolated-vm but skill execution remains inert until
      THEOMEM_SKILL_EXECUTION=true (defense-in-depth transparency).
