    recommended_action: Amend the :30-35 import-section note to call out the deliberate exception (SandboxedSkillExecutor is static-import-safe because isolated-vm is type-only + lazy-loaded at execute()), so the lazy-import invariant for @xenova/openai is not mistaken as universal.

