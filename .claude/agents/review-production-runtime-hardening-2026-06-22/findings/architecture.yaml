  - id: F-arch-5
    severity: MEDIUM
    file: Dockerfile
    line: 108
    plan_ref: T3.1 / ADR D4 (scoped to "sharp/libvips build resilience via install retry")
    summary: The Dockerfile diff lands two material architectural changes (`COPY packages/` into production-deps + `--config.node-linker=hoisted` flat layout) that are the actual distroless-503 root-cause fix, but neither is covered by any ADR — the plan's only Dockerfile ADR (D4) is scoped to the sharp retry. Significant arch change shipped without a design record.
    evidence: |
      ```dockerfile
      COPY package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc ./
      COPY packages/ ./packages/                                   # NEW — undocumented in ADRs
      ...
      RUN ... pnpm install --prod --frozen-lockfile --config.node-linker=hoisted $OPT_FLAG ...  # NEW layout change
      ```
      The CHANGELOG (Fixed) correctly attributes this as the distroless 503 fix
      ("production-deps stage used pnpm's default isolated node_modules, so the
      OPTIONAL native deps never reached the top-level node_modules the distroless
      runtime copies"). This is the SUBSTANTIVE architectural decision of the
      slice — changing the production-deps install layout from isolated to hoisted
      and feeding it the workspace package.json tree. Yet ADR D3 only commits to
      "live verification" and ADR D4 only to the sharp retry. There is no ADR
      capturing (a) why hoisted layout over isolated, (b) the COPY packages/ blast
      radius (sources discarded but still copied into the stage), or the
      alternatives (e.g. `pnpm deploy`, explicit optionalDeps allow-list). Per the
      project's own ADR discipline (plan ADRs gate /plan-confidence), a layout
      change to the published image with this blast radius warrants D6.
    recommended_action: Add an ADR (e.g. D6 — "production-deps hoisted node-linker + workspace COPY for distroless optional-native resolution") documenting the decision, the rejected alternatives (pnpm deploy / isolated+symlink-deref / OpenAI-only image), and the consequence (every prod dep flattens to root node_modules). Update the Coverage Matrix row 5 to cover the layout fix, not just the committed pin/toolchain review.

  - id: F-arch-6
    severity: LOW
    file: Dockerfile
    line: 60
    plan_ref: T3.1 / ADR D4 (bounded retry, fail-loud)
    summary: The retry loop is bounded and fails loud as required, but `[ "$i" = "3" ] && ... exit 1` runs AFTER `sleep` on the final iteration and relies on `&&` short-circuit for control flow — a brittle shell idiom that adds a needless final backoff sleep and could mask exit semantics under `set -e`-style strictness.
    evidence: |
      ```dockerfile
      for i in 1 2 3; do \
        pnpm install --frozen-lockfile && break; \
        echo "pnpm install attempt $i failed (transient CDN?); retrying in $((i*5))s..."; \
        sleep $((i*5)); \
        [ "$i" = "3" ] && echo "pnpm install failed after 3 attempts" && exit 1; \
      done
      ```
      Functionally correct (bounded 3, fails loud — D4 satisfied). Minor smells:
      (1) on attempt 3 it sleeps 15s THEN exits 1 — a wasted backoff before a
      guaranteed failure; (2) the `&&`-chained `exit 1` is load-bearing control
      flow inside a one-liner RUN — if the echo ever returned non-zero the exit
      would be skipped (theoretical here). KISS would put the cap check before the
      sleep. Not blocking — the contract (bounded + fail-loud) holds.
    recommended_action: Reorder to check the cap before sleeping (e.g. `if [ "$i" = 3 ]; then echo '...failed after 3 attempts'; exit 1; fi; sleep $((i*5));`) so the final attempt fails immediately without a dead 15s backoff, and the fail-loud path does not depend on `&&` short-circuit.

