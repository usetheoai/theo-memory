    summary: SandboxedSkillExecutor moved to a STATIC import while the file-level note (lines 30-35) still asserts optional-dep adapters are "dynamically imported inside wireMemoryFromPool" — the note is now partially inaccurate and the asymmetry vs the embedder/LLM lazy-import pattern deserves an inline rationale at the import site.
