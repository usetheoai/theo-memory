      ```
      vs the module note at :30-35: "`LocalTransformerEmbedder` ... and `OpenAILLM`
      ... are dynamically imported inside `wireMemoryFromPool` ... so that merely
      importing this module ... does NOT pull the heavy optional-dep graph."
      The new static import is SAFE — verified: sandboxed-skill-executor.ts:23 uses
      `import type { Isolate, ExternalCopy } from 'isolated-vm'` (type-only, erased)
      and the ctor (:99-101) only captures a lazy loader `() => import('isolated-vm')`,
