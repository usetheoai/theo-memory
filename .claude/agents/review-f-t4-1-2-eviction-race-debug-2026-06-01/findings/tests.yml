  - id: F-tests-1
    severity: MAJOR
    file: tests/integration/forgetting/f-t4-1-2-stub-reproduction.test.ts
    line: 371
    plan_ref: "Plan § EC-4 (dumpPgLocks visibility helper)"
    summary: dumpPgLocks helper called ONLY in T1.1 (line 371); T1.2 and T1.3 also accumulate failingTrials but don't capture lock state for post-mortem.
    evidence: |
      grep -c 'dumpPgLocks' tests/integration/forgetting/f-t4-1-2-stub-reproduction.test.ts -> 3 occurrences (1 docblock, 1 def, 1 call). Call site only in T1.1 line 371. T1.2 (line 278-283) and T1.3 (line 171-176) accumulate failingTrials with `details` array but no `locks` field. If T1.2 or T1.3 ever fires a regression, post-mortem diagnostic surface is poorer than T1.1.
    recommended_action: |
      Add `locks: await dumpPgLocks(pool)` to the failingTrials.push() calls at T1.2 line 279-282 and T1.3 line 172-175 for symmetric post-mortem capability.
  - id: F-tests-2
    severity: MAJOR
    file: tests/integration/forgetting/f-t4-1-2-stub-reproduction.test.ts
    line: 75
    plan_ref: "testing.md § Determinism (`No flaky tests... Embeddings in unit tests use deterministic fixtures`)"
    summary: SlowDeterministicEmbedder uses Math.random() for latency, introducing non-deterministic timing. This is the EXPLICIT design intent (widen race window to match real-OpenAI cadence per the inline comment lines 64-69) but is a controlled flakiness vector worth documenting.
    evidence: |
      Line 75: `const ms = this.minMs + Math.random() * (this.maxMs - this.minMs);`
      Embedding VALUES remain deterministic (super.embed delegates to parent's MD5-seeded LCG). Only setTimeout duration varies. Intent is honest (simulating real OpenAI latency variance to widen race window). Risk: if F-T4.1-2 ever re-emerges intermittently in production, this test could PASS or FAIL depending on scheduling dice. Today (post-investigation): the variance is FINE because the assertion is `failingTrials === []` and any reproduction would surface as failure regardless of timing — but if a future maintainer assumes "test passed = bug absent" they may miss a 1/200 race.
    recommended_action: |
      Add inline comment at the SlowDeterministicEmbedder class noting (a) embedding VALUES stay deterministic (parent's MD5+LCG), (b) only LATENCY varies, (c) the intent is widening the race window, NOT introducing flakiness in the assertion path. Consider seeding `Math.random()` via a deterministic per-trial seed if the team wants to lock the variance pattern for CI reproducibility.
  - id: F-tests-3
    severity: MINOR
    file: tests/integration/forgetting/f-t4-1-2-stub-reproduction.test.ts
    line: 105
    plan_ref: "testing.md § BDD format Given-When-Then"
    summary: AAA / Given-When-Then sections not visually demarcated in the 3 `it()` bodies. Test names describe behavior correctly (no method names, no "and"); structural separation is implicit in code order but no // Given: / // When: / // Then: comments.
