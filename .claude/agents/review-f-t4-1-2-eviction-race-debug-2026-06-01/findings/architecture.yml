    plan_ref: T1.3 SLOW-embedder variant
    summary: SlowDeterministicEmbedder is OCP-respecting decorator-via-inheritance; LSP-compliant override
    evidence: |
      ```ts
      class SlowDeterministicEmbedder extends DeterministicStubEmbedder {
        constructor(private readonly minMs: number = 20, private readonly maxMs: number = 80) {
          super();
        }
        override async embed(text: string): Promise<readonly number[]> {
          const ms = this.minMs + Math.random() * (this.maxMs - this.minMs);
          await new Promise((r) => setTimeout(r, ms));
          return super.embed(text);
        }
        override async embedBatch(texts: readonly string[]): Promise<readonly (readonly number[])[]> {
          const out: (readonly number[])[] = [];
          for (const text of texts) out.push(await this.embed(text));
          return out;
        }
      }
      ```
      - Preserves the Embedder contract signatures (return types unchanged).
      - Strengthens NO post-condition (returns same normalized vectors via super).
      - Adds latency-injection, a behavior orthogonal to extraction. Pure
        decorator pattern realized via inheritance. Could equivalently be
        composition (taking an inner Embedder), but inheritance is more
        ergonomic for test code that needs default-arg construction.
      - Scoped to one test file; not exported; not reachable from src/.
    recommended_action: No action. OCP/LSP-compliant. If this pattern
      needs to be reused (e.g., simulating Anthropic vs OpenAI cadence
      separately) a future plan could promote it to a shared
      `tests/helpers/latency-embedder.ts`. Not needed now.
