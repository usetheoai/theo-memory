  - id: F-arch-5
    severity: INFO
    file: packages/mcp/src/server.ts
    line: 88
    plan_ref: T0.1 / D1 (OCP — toolset branching)
    summary: >-
      Toolset selection via a single `options.toolset === 'openmemory'` boolean is
      a reasonable two-option branch; not yet a registry, but acceptable under
      YAGNI for exactly 2 toolsets.
    evidence: |
      ```ts
      // server.ts:88-92
      const openMemory = options.toolset === 'openmemory';
      this.sdkServer.setRequestHandler(ListToolsRequestSchema, () =>
        Promise.resolve(openMemory ? buildOpenMemoryToolsList() : buildToolsListResponse()));
      const dispatchFn = openMemory ? openMemoryDispatch : dispatch;
      ```
      OCP note: a THIRD toolset would require editing these two ternaries (the
      classic switch-grows-with-variants smell). With only native+openmemory
      (ToolsetKind union in agent-core/types.ts:27) this is KISS-correct; a
      `Map<ToolsetKind, { list, dispatch }>` registry is the OCP refactor IF a
      third surface ever lands. No action now (YAGNI).
    recommended_action: >-
      No change. If a third toolset is ever added, refactor the two ternaries into
      a ToolsetKind-keyed strategy map at that point (not before).

