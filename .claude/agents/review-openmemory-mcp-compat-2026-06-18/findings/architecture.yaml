      (tools.ts:89 addMemoriesHandler) calls `scoped.remember(parsed.text, opts)`
      with opts = `{ infer }` only — no `metadata: { mcp_client: clientName }`.
      Plan ADR D3 ("client_name is attached as memory metadata"), Q2 (key name
      `mcp_client`) and Coverage Matrix row 7 ("client_name -> metadata") are not
      satisfied. RememberOptions.metadata exists (options.ts:12) so the seam is
