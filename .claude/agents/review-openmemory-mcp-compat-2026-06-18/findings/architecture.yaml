      caveat per Inquebrável Rule 3 (no silent divergence from the plan).

  - id: F-arch-3
    severity: MEDIUM
    file: packages/mcp/src/openmemory/tools.ts
    line: 139
    plan_ref: T0.1 / D5 vs ADR D6 (native dispatch error contract)
    summary: >-
      openMemoryDispatch flattens ALL errors to a text "Error:" result, including
      protocol-level errors that the native dispatch deliberately throws as
      McpError — divergent error-handling contract between the two toolsets.
    evidence: |
      ```ts
      // openmemory/tools.ts:139-153
      export async function openMemoryDispatch(toolName, args, deps) {
        const handler = HANDLERS.get(toolName);
        if (handler === undefined) return errorResult(`Unknown tool: ${toolName}`);
        try { return await handler(args, deps); }
        catch (err) { return errorResult(err instanceof Error ? err.message : String(err)); }
      }
      ```
      Native dispatch (tools/dispatch.ts:39-58) classifies errors and THROWS
      McpError for Protocol Errors (-32601/-32602/-32603) per ADR D6, returning
      CallToolResult only for Execution Errors. The OpenMemory variant returns a
      tool-result string even for unknown-tool / malformed-params. This IS the
      documented OpenMemory parity (D5: result strings, not protocol errors), so
      it is a justified divergence — but the two dispatchers now diverge on the
      project's own ADR D6 contract without that divergence being called out as
      its own ADR in this plan. Risk: a future maintainer "fixes" one to match
      the other.
    recommended_action: >-
      Add a one-line ADR note in the plan (or a JSDoc @see) explicitly stating
      openMemoryDispatch INTENTIONALLY overrides ADR D6's throw-McpError contract
      for OpenMemory wire parity (D5), so the divergence is auditable and not
      mistaken for a bug. No code change required if the parity is the contract.

