findings:
  - id: F-arch-1
    severity: HIGH
    file: packages/mcp/src/openmemory/tools.ts
    line: 113
    plan_ref: T0.1 / D4 + Coverage Matrix #10 (per-user isolation)
    summary: >-
      deleteMemoriesHandler bypasses the scope gate the native forget handler
      deliberately enforces — per-user isolation is NOT held on the delete path.
    evidence: |
      ```ts
      // openmemory/tools.ts:113
      export async function deleteMemoriesHandler(args: unknown, deps: Deps): Promise<CallToolResult> {
        const parsed = DeleteMemoriesInput.parse(args);
        const memory = deps.memoryFactory();        // <- NO getScope() / memoryFromCtx
        for (const id of parsed.memory_ids) {
          try { await memory.forget(id); deleted.push(id); } catch { /* skip */ }
        }
      ```
      vs the native handler (tools/forget-handler.ts), which states:
      "Gate on scope even for forget — prevents anonymous bulk-delete via stdio."
      and calls `getScope()` before `memoryFactory().forget(id)`.
      `Memory.forget(memoryId)` (local-memory.ts:147-166) enforces only the
      WORKSPACE tenant boundary, NOT the within-workspace User tier. So a client
      connected as `user_id=alice` can delete `user_id=bob`'s memory in the same
      workspace by supplying its UUID — `search_memory`/`list_memories` ARE
      user-scoped (memoryFromCtx), but `delete_memories` is not. The plan's
      per-user-isolation claim (Coverage Matrix #10) holds for add/search but is
      broken for delete.
    recommended_action: >-
      Call getScope() at the top of deleteMemoriesHandler (matching the native
      forget handler's deliberate gate) so unauthenticated/unscoped delete is
      rejected; and resolve forget through the user-scoped memory where the
      contract allows, OR add an explicit cross-user ownership check before
      forget. At minimum the goal test must add a negative case: user alice
      cannot delete_memories an id belonging to bob.

