findings:
  - id: F-test-1
    severity: HIGH
    file: packages/mcp/src/transports/sse.test.ts
    line: 20
    plan_ref: T1.1 Acceptance Criteria (lines 185-188)
    summary: SSE unit test omits the THREE core T1.1 acceptance criteria — scope binding, POST-to-transport routing, and /http/ delegation.
    evidence: |
      Plan T1.1 AC (plan:185-188) requires:
        - "GET /<c>/sse/<u> ... getScope() returns { kind: 'user', userId: '<u>' } (asserted)"
        - "POST /<c>/sse/<u>/messages/ reaches the SSE transport's message handler (spy asserted call-count === 1)"
        - "/<c>/http/<u> delegates to connectStreamableHttp (spy asserted)"
      grep over sse.test.ts: getScope -> 0 hits; handlePostMessage/spy/toHaveBeenCalled -> 0 hits; /http/ delegation -> 0 hits.
      sse.test.ts only covers: TLS guard, accept-localhost, 404 unknown path, 404 unknown session.
      The scope-binding behavior (sse.ts:125 withScope) and /http/ branch (sse.ts:133-141) are the load-bearing
      D3 contract and are exercised ONLY indirectly via the integration GOAL TEST happy path. A regression in the
      withScope wiring or the /http/ branch would pass the unit suite.
    recommended_action: Add unit tests asserting (a) getScope().userId during a GET SSE handler equals the path user, (b) a POST to /<c>/sse/<u>/messages/?sessionId=<valid> reaches transport.handlePostMessage (spy), (c) a request to /<c>/http/<u> drives the streamable-http branch.
  - id: F-test-2
    severity: HIGH
    file: packages/mcp/src/openmemory/compat-resolution.test.ts
    line: 22
    plan_ref: T2.1 Acceptance Criteria (lines 229-231)
    summary: T2.1 acceptance criteria are not tested — only the narrow resolveCompat string-resolver is. resolveRunOptions resolution matrix (transport=sse, toolset=openmemory, port=8765) and the boot stderr disclosure are untested.
    evidence: |
      Plan T2.1 AC (plan:229-231) requires:
        - "resolveRunOptions({ compat: 'openmemory' }) returns { transport: 'sse', toolset: 'openmemory', port: 8765 }"
        - "THEOMEM_MCP_COMPAT=openmemory yields the same resolution as the flag"
        - "On boot in compat mode, the startup stderr string matches /compat=openmemory/ and contains the substring /sse/"
      compat-resolution.test.ts only asserts resolveCompat(undefined|'openmemory') -> 'openmemory'|undefined.
      It never asserts that compat resolution flips transport to 'sse', toolset to 'openmemory', or port to 8765,
      nor the stderr disclosure. The actual wiring of compat -> {sse, 8765} (the T2.1 "what") is unverified by any test.
      The test file is also renamed from the plan's declared run-mcp-server.test.ts (cosmetic; flagged in cross-validation scope).
    recommended_action: Extend the test to drive the full resolution path (resolveRunOptions or equivalent) asserting transport/toolset/port=8765 under both flag and env, and capture boot stderr to assert /compat=openmemory/ + /sse/.
  - id: F-test-3
    severity: MEDIUM
    file: packages/mcp/src/transports/sse.test.ts
    line: 20
    plan_ref: T1.1 Concurrency tests (lines 181-183) + Failure scenarios table (lines 193-201)
    summary: Declared concurrency invariant (N parallel SSE connections, no AsyncLocalStorage cross-bind) and the mid-stream-disconnect failure scenario are not unit-tested.
    evidence: |
      Plan T1.1 "#### Concurrency tests" (plan:181-183): "a parallel test opens N SSE connections with different user_id;
      each asserts getScope().userId equals its own (no cross-bind ...), and cancellation propagation resets the scope on disconnect."
      Plan Failure scenarios (plan:196): node:http SSE "client disconnects mid-stream -> abort the SSE request -> scope reset; no leak; server stays up."
      grep sse.test.ts: Promise.all|parallel|concurren -> 0 hits; disconnect/abort/close-on-stream -> 0 hits.
      The integration per-user isolation test (mcp-compat.test.ts:135) covers cross-user isolation END-TO-END with two
      parallel clients (good), but does NOT prove the per-connection AsyncLocalStorage no-cross-bind invariant at the
      transport unit level, nor the scope-reset-on-disconnect / no-leak guarantee (sse.ts:104-109 onclose + res.on('close')).
    recommended_action: Add a transport-level test opening 2+ concurrent SSE sessions with distinct users and asserting each message resolves its own scope; add an abort/disconnect test asserting the session is removed from the sessions Map (no leak).
  - id: F-test-4
    severity: LOW
    file: tests/integration/openmemory/mcp-compat.test.ts
    line: 53
    plan_ref: T3.1 Concurrency tests (lines 282-283)
    summary: T3.1 declared "cancellation propagation on client disconnect" is not asserted; the parallel-clients test proves isolation but not disconnect-cancellation.
    evidence: |
      Plan T3.1 "#### Concurrency tests" (plan:283): "two clients with distinct user_id that each recall only their
      own memory (per-user isolation; cancellation propagation on client disconnect)."
      mcp-compat.test.ts:135 covers per-user isolation via parallel clients (the isolation half), but no test
      forcibly disconnects a client mid-call to assert cancellation propagation / no orphaned session.
      The describe.skip at line 53 is a legitimate env-guard (skips ONLY when THEOMEM_PG_URI unset) — NOT a leaked
      skip, so it is correctly NOT flagged as a BLOCKER.
    recommended_action: Optionally add a disconnect-during-call assertion, or downgrade the plan claim — the isolation contract is otherwise well proven.
  - id: F-test-5
    severity: LOW
    file: packages/mcp/src/openmemory/tools.test.ts
    line: 122
    plan_ref: testing.md Anti-patterns ("no 'and' in test names")
    summary: One integration test name contains "and"/comma compound behavior (round-trips ... then delete) — two behaviors in one test.
    evidence: |
      tests/integration/openmemory/mcp-compat.test.ts:104
        test('add_memories -> search_memory round-trips, then delete_memories removes it', ...)
      This asserts both the round-trip AND the delete-removal in one test (per testing.md, split one-behavior-per-test).
      For an integration GOAL TEST this is a pragmatic/acceptable trade-off (shared expensive setup), hence LOW.
      tools.test.ts names are otherwise behavior-descriptive and single-purpose — good.
    recommended_action: Acceptable for the GOAL TEST given setup cost; if split, separate "round-trip recalls stored memory" from "delete removes memory".
  - id: F-test-6
    severity: INFO
    file: packages/mcp/src/openmemory/tools.test.ts
    line: 9
    plan_ref: testing.md (AAA/GWT, fixture hygiene)
    summary: Contract test quality is high — deterministic fixtures (frozen FIXED date), precise mocks (vitest-mock-extended), spy-asserted call-args, real JSON.parse on returns. No assert-nothing tests found.
    evidence: |
