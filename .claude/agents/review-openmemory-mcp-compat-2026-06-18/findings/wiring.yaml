findings:
  - id: F-wiring-1
    severity: MEDIUM
    file: packages/mcp/src/openmemory/tools.ts
    line: 113
    plan_ref: T0.1 / ADR D3 (path user_id -> user scope) + D4 (delete -> forget per id)
    summary: >
      deleteMemoriesHandler resolves the UNSCOPED Memory (deps.memoryFactory()) instead of the
      path-bound user scope, breaking the per-user isolation symmetry the other 3 handlers honor.
    evidence: |
      tools.ts:113-129 deleteMemoriesHandler:
        const memory = deps.memoryFactory();          // <-- raw, NOT memoryFromCtx(getScope(), ...)
        for (const id of parsed.memory_ids) { await memory.forget(id); ... }
      Contrast the other three handlers (tools.ts:91,99,108) which all do:
        const scoped = memoryFromCtx(getScope(), deps.memoryFactory());  // user-bound
      Memory.forget(memoryId) is global-by-UUID (local-memory.ts:147); the cross-workspace IDOR
      guard (local-memory.ts:156-166) only fires when `this.workspaceId !== undefined`, but the
      SSE composition root wires the raw SDK Memory (run-mcp-server.ts:263 wireMemoryFromPool ->
      workspaceId undefined). Therefore user `alice` connected at /cursor/sse/alice can delete
      `bob`'s memory by passing bob's id — no per-user check. add/search/list ARE isolated;
      delete is the asymmetric hole. Plan D3 says the path user_id binds the connection scope;
      delete does not consult it. Practical blast radius is bounded (memory IDs are non-enumerable
      UUIDs returned only by the caller's own scoped list/search), so MEDIUM not HIGH — but it is
      a genuine wiring deviation from the stated per-user-isolation contract.
    recommended_action: >
      Scope the delete the same way as the other handlers. Either resolve forget through the
      scoped memory (memoryFromCtx(getScope(), factory()) if ScopedMemory exposes forget) OR, if
      forget must stay on the root Memory, first verify the id is in the caller's scope via a
      scoped get/list before forgetting. Add an integration assertion: user B's delete_memories
      against user A's id returns "Error:" / leaves A's row intact.

  - id: F-wiring-2
    severity: MEDIUM
    file: packages/mcp/src/transports/sse.ts
    line: 133
    plan_ref: D2 + Coverage Matrix row 6 (/{client}/http/{user} -> streamable-http delegation) + Objective Phase 1
    summary: >
      The /{client}/http/{user} branch hand-rolls a fresh StreamableHTTPServerTransport inline
      instead of delegating to the existing connectStreamableHttp, diverging from plan D2/AC, and
      has ZERO test coverage (no unit test, not exercised by the goal test which uses SSE only).
    evidence: |
      Plan D2 decision: "the /{client}/http/{user} route delegates to the existing
      connectStreamableHttp"; Coverage Matrix #6: "/{client}/http/{user} -> streamable-http |
      T1.1 | delegation"; AC T1.1: "/<c>/http/<u> delegates to connectStreamableHttp (spy asserted)."
      Actual sse.ts:133-141:
        const httpMatch = HTTP_RE.exec(path);
        if (httpMatch) {
          const transport = new StreamableHTTPServerTransport({ sessionIdGenerator: () => randomUUID() });
          const server = options.serverFactory();
          await server.start(transport as unknown as Transport);
          await withScope({ session: { userId } }, () => transport.handleRequest(req, res));
        }
      connectStreamableHttp is imported at run-mcp-server.ts:41 but NOT imported in sse.ts — no
      delegation. sse.test.ts (44 lines) has no /http/ case; mcp-compat.test.ts goal test only
      connects via SSEClientTransport. The branch is reachable (regex routes to it) and scope-bound,
      so it is wired-but-untested + diverges from the planned reuse. The AC spy assertion is unmet.
    recommended_action: >
      Either (a) align to plan D2: have the /http/ branch delegate to connectStreamableHttp (DRY,
      single source of truth for the streamable-http session lifecycle + ADR-0015 TLS guard), OR
      (b) if the inline transport is intentional, amend the plan D2/Coverage-Matrix#6 + AC to drop
      the "delegate to connectStreamableHttp" wording (cross-validation honesty). EITHER WAY add a
      test that hits /{client}/http/{user} and asserts scope binding + a tools/call round-trip.

