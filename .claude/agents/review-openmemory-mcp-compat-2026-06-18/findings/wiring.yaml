summary: >
  The full production wiring chain is HONEST and reachable end-to-end:
  cli.ts (--compat openmemory, line 174-203) -> runMcpServer(options) ->
  resolveCompat (run-mcp-server.ts:186,211) -> compat branch (268-286) ->
  connectSse({ serverFactory: () => new McpServer({...toolset:'openmemory'}) }) ->
  McpServer ctor (server.ts:88-92) selects buildOpenMemoryToolsList + openMemoryDispatch ->
  SSE POST message binds withScope({session:{userId}}) (sse.ts:125-127) ->
  handlers call memoryFromCtx(getScope(), factory()) -> memory.user(userId) scoped verbs.
  NO orphan exports (every export in index.ts is also called in production), NO dead branches.
  The scope-binding contract (withScope {session:{userId}} -> getScope -> memoryFromCtx ->
