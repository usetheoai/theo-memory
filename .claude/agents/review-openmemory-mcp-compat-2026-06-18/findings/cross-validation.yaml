findings:
  - id: F-xval-1
    severity: MEDIUM
    file: packages/mcp/src/transports/sse.ts
    line: 185
    plan_ref: T1.1 Acceptance Criteria item 1 ("getScope() returns { kind: 'user', userId: '<u>' }")
    summary: Declared scope shape does not match the bound shape — plan says {kind:'user',userId}, impl binds {session:{userId}}; the asserting unit test was never written.
    evidence: |
      Plan T1.1 AC#1 (plan line 185):
        "during the handler, getScope() returns { kind: 'user', userId: '<u>' } (asserted)"
      Impl sse.ts:125 + 139:
        await withScope({ session: { userId: session.userId } }, () => ...)
      agent-core/scope.ts getScope() returns the ScopedContext verbatim — i.e.
      { session: { userId } }, NOT { kind: 'user', userId }. memoryFromCtx maps
      { session: { userId } } to memory.user(userId) downstream (tools.ts:91), so
      the BEHAVIOR (per-user scoping) is correct and the GOAL TEST proves isolation.
      BUT: (a) the plan's literal AC is a false claim against the chosen ScopedContext
      shape, and (b) sse.test.ts asserts ONLY the TLS guard + 404 routing — there is
      NO unit test asserting getScope() inside the handler at all (the declared
      assertion never landed).
    recommended_action: Either (a) correct the plan AC to the actual ScopedContext shape ({ session: { userId } }) since the GOAL TEST proves the behavior, or (b) add the missing sse.test.ts assertion that opening GET /<c>/sse/<u> binds the path user into the request scope. Behavioral risk is low (goal test covers isolation); this is a documentation-vs-code truthfulness gap.

  - id: F-xval-2
    severity: MEDIUM
    file: packages/mcp/src/transports/sse.ts
    line: 102
    plan_ref: ADR D3 + Coverage Matrix row 7 + Unresolved Question Q2 ("client_name -> metadata key mcp_client")
    summary: client_name is parsed and stored on the Session struct but never attached as memory metadata — the D3/Q2 "client_name -> metadata" half of the mapping is unimplemented.
    evidence: |
      Plan D3 (line 79-80): "client_name is attached as memory metadata."
      Plan Q2 (line 102): "Default: mcp_client (mirrors OpenMemory's mcp_client metadata). Resolved."
      Coverage Matrix row 7 (line 246): "path user_id -> user scope; client_name -> metadata (D3)".
      Impl: sse.ts:97 parses clientName; sse.ts:102 stores it on Session; grep shows
      clientName is NEVER read again and NO 'mcp_client' literal exists anywhere in
      packages/mcp/src/. addMemoriesHandler (tools.ts:89-95) passes only { infer } to
      remember() — no client metadata threaded through.
    recommended_action: Thread session.clientName into the add_memories path as metadata { mcp_client: clientName } (matching OpenMemory mcp_server.py:93), OR explicitly downgrade D3/Q2/row-7 to "client_name parsed but metadata-attach deferred" with a one-line rationale. Currently the Coverage Matrix claims a resolution that the code does not deliver.

  - id: F-xval-3
    severity: LOW
    file: packages/mcp/src/openmemory/compat-resolution.test.ts
    line: 1
    plan_ref: T2.1 Files to edit (declared "run-mcp-server.test.ts — resolution matrix") + T2.1 AC ("resolveRunOptions({ compat: 'openmemory' }) returns { transport:'sse', toolset:'openmemory', port:8765 }")
    summary: Implementation diverged from the plan's declared function/file names (resolveRunOptions / run-mcp-server.test.ts) to resolveCompat / compat-resolution.test.ts — functionally equivalent, but the declared resolution-matrix assertions (toolset+port together) were not written as declared.
    evidence: |
      Plan T2.1 (line 214): "packages/mcp/src/run-mcp-server.test.ts — resolution matrix (compat flag/env precedence)".
      Plan T2.1 AC#1 (line 229): resolveRunOptions({compat}) returns {transport:'sse', toolset:'openmemory', port:8765}.
      Impl: NO resolveRunOptions exists (grep: 0 hits). run-mcp-server.test.ts was NOT
      modified in db077aa..HEAD (git log -- that file is empty for the range). The new
      compat tests live in compat-resolution.test.ts and assert ONLY resolveCompat()
      precedence (flag/env/native) — they do NOT assert transport=='sse', toolset=='openmemory',
      or port==8765 as a combined tuple. resolveCompatPort (run-mcp-server.ts:193-198) hard-codes
      8765 default and runMcpServer:268-285 wires sse+openmemory, so the BEHAVIOR matches; only the
      declared unit-level tuple assertion is absent.
    recommended_action: Acceptable refactor (resolveCompat is cleaner than a god resolveRunOptions), but per anti-pattern #3 (scope/contract divergence without ADR) either add a one-line note to the plan/implementation doc recording the rename, OR add an assertion that compat mode resolves port 8765 + toolset openmemory. Low risk; documentation-fidelity only.

  - id: F-xval-4
    severity: LOW
    file: packages/mcp/src/run-mcp-server.ts
    line: 231
    plan_ref: T2.1 Acceptance Criteria item 3 ("startup stderr matches /compat=openmemory/ and contains substring /sse/ — asserted via captured stderr")
    summary: The stderr disclosure line is emitted correctly but NO test captures/asserts it; the declared "asserted via captured stderr" AC is unverified.
    evidence: |
      Plan T2.1 AC#3 (line 231): stderr "/compat=openmemory/" + substring "/sse/" asserted via captured stderr.
      Impl run-mcp-server.ts:271-273 emits:
        "themory mcp: compat=openmemory transport=sse on http://<host>:<port>/{client}/sse/{user}"
      — satisfies BOTH substrings at RUNTIME. But grep of *.test.ts shows no test
      captures process.stderr for the compat path (run-mcp-server.test.ts asserts the
      pre-existing transport/auth disclosure only; compat-resolution.test.ts asserts no stderr).
    recommended_action: Add a captured-stderr assertion for the compat boot path, OR mark the AC satisfied-by-inspection in the implementation doc. The string is provably correct by reading the source; only the automated guard is missing.

  - id: F-xval-5
    severity: INFO
    file: packages/mcp/src/openmemory/tools.ts
    line: 86
    plan_ref: ADR D4 (delete tool name resolution) + Context (line 17)
    summary: Delete tool name correctly resolved to delete_memories(memory_ids) per the source code, deliberately NOT delete_all_memories from the OpenMemory announcement — plan and implementation are consistent.
    evidence: |
      Plan Context (line 17) + D4 (line 85-89): delete tool is delete_memories(memory_ids),
      announcement's delete_all_memories is wrong (mcp_server.py:296); delete_all_memories
      NOT implemented.
      Impl tools.ts:36 DELETE_MEMORIES='delete_memories'; tools.ts:50-52 DeleteMemoriesInput
      requires memory_ids:string[]; tools.ts:113-129 maps to forget per id (best-effort).
      No delete_all_memories anywhere. Matches the plan exactly. Drop-in clients wired to
      the (incorrect) announcement name delete_all_memories will NOT find a matching tool —
      this is the deliberate, documented "match the code not the marketing" decision (D4),
      not a defect. Flagged INFO so the reviewer batch is aware of the intentional
      divergence from the public OpenMemory announcement.
    recommended_action: None required — consistent with plan + blueprint. Optionally document in README that the delete tool is delete_memories (not the announcement's delete_all_memories) so consumers wired to the announcement know.

  - id: F-xval-6
    severity: INFO
    file: packages/mcp/src/transports/sse.ts
    line: 133
    plan_ref: T1.1 Acceptance Criteria item 4 ("/<c>/http/<u> delegates to connectStreamableHttp (spy asserted)") + Coverage Matrix row 6
    summary: The /http/ route does NOT delegate to connectStreamableHttp() as the plan declared; it inlines StreamableHTTPServerTransport directly. Behavior is equivalent (streamable-http per connection) but the declared delegation + spy assertion do not hold.
    evidence: |
      Plan T1.1 AC#4 (line 188) + Matrix row 6 (line 245): "/{client}/http/{user} -> streamable-http"
      via delegation to connectStreamableHttp (spy asserted).
      Impl sse.ts:133-141 constructs `new StreamableHTTPServerTransport(...)` inline and
      calls server.start + transport.handleRequest directly — it does NOT call
      connectStreamableHttp (grep: connectStreamableHttp is imported only in run-mcp-server.ts,
      not in sse.ts). No spy test exists for this route. Functionally the /http/ path serves
      streamable-http; the divergence is the integration mechanism, not the outcome.
    recommended_action: Acceptable (the connectStreamableHttp helper binds its own node:http server, so it cannot be reused inside sse.ts's single shared http server — the inline transport is the correct shape). Update Matrix row 6 / T1.1 AC#4 wording to "inline StreamableHTTPServerTransport (shared http server)" instead of "delegates to connectStreamableHttp", and add a route test if /http/ is a supported surface.

