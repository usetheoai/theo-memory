  - id: F-dom-pgvec-2
    severity: INFO
    file: src/local/pgvector-store.ts
    line: 129, 430-443
    plan_ref: T3.1 / EC-2
    summary: Composition seam honors EC-2 atomicity. PgvectorStore.ctor passes `this.withTransaction.bind(this)` to PgvectorSkillStore, so the BEGIN/COMMIT/ROLLBACK wrapper still binds the SAME PoolClient across both INSERT and UPDATE inside the atomic write. No regression versus the pre-extraction in-process call.
    status: CLOSED
    evidence: |
      pgvector-store.ts:129
        this.skillStore = new PgvectorSkillStore(pool, this.withTransaction.bind(this));

      pgvector-store.ts:430-443 (unchanged from pre-extraction):
        async withTransaction<T>(fn: (tx: PoolClient) => Promise<T>): Promise<T> {
          const client = await this.pool.connect();
          try {
            await client.query('BEGIN');
            const result = await fn(client);
            await client.query('COMMIT');
            return result;
          } catch (err) {
            await client.query('ROLLBACK');
            throw err;
          } finally { client.release(); }
        }

      pgvector-skill-store.ts:163-198 uses the injected callback's `client`
      param for BOTH INSERT and UPDATE — same client, same transaction, EC-2
      atomicity intact.
    recommended_action: None.

