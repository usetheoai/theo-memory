    status: RESOLVED
    file: src/local/pgvector-store.ts
    lines: 43-59
    plan_ref: "Plan v1.3 § T3.3 (PgvectorStore — per-row fallback invariant)"
    domain_anchor: "CLAUDE.md § Architectural Decisions Locked; blueprint D1 (robust I/O fallbacks at every boundary)"
    summary: |
      vectorLiteral() guard prevents NaN / Infinity components from reaching pgvector.
      Without the guard, malformed vectors produce cryptic SQL errors downstream.
      With the guard, callers see a clear JavaScript error pointing at the offending index.
    evidence: |
      ```ts
      function vectorLiteral(vector: readonly number[]): string {
        for (let i = 0; i < vector.length; i += 1) {
          const n = vector[i] as number;
          if (!Number.isFinite(n)) {
            throw new Error(`vectorLiteral: vector[${i}] is not finite (${String(n)}); pgvector requires finite numbers`);
          }
        }
        return `[${vector.join(',')}]`;
      }
      ```
    coverage: "✓ Embedded in PgvectorStore.insertBatch() (line 113) and search() (line 233)"
    recommended_action: RESOLVED — guard is in place and covers both write + search paths.

