findings:
  - id: F-dom-1
    severity: MAJOR
    file: src/local/pgvector-store.ts
    line: 40-41
    plan_ref: "Plan v1.3 § T3.3 + Blueprint D4"
    domain_anchor: "pgvector vector serialization: parameterized via ::vector"
    summary: |
      Vector literal serialization uses a string representation `[0.1, 0.2, ...]` and passes it to
      parameterized queries as a string $N parameter, then casts via `::vector`. This works but the
      pattern is brittle because the literal string must be syntactically valid pgvector input.
      The comment claims "parameterized via $N::vector" but the implementation actually pre-constructs
      the literal string and then parameterizes IT, not the raw numbers. Risk: if vectorLiteral()
      produces a malformed string (e.g., NaN, Infinity, non-numeric values), the SQL will fail at
      runtime with cryptic pgvector parse errors instead of being caught earlier.
    evidence: |
      ```ts
      function vectorLiteral(vector: readonly number[]): string {
        return `[${vector.join(',')}]`;
      }

      // Later used as:
      params.push(vectorLiteral(vec));  // string like "[0.1,0.2,...]"
      // SQL: $N::vector
      ```
      Compare to Plan blueprint D4 reference (Mem0-ts): https://github.com/mem0ai/mem0/blob/main/js/src/oss/src/vector_stores/pgvector.ts
      Mem0-ts uses the same pattern, so this is acceptable precedent, but it means downstream
      consumers with malformed vectors will see pgvector parse errors rather than TypeScript type errors.
    recommended_action: |
      ACCEPT (precedent from Mem0-ts proves this pattern). ADD: a guard in vectorLiteral()
      to validate that all numbers are finite (not NaN, not Infinity). Recommended:
        function vectorLiteral(vector: readonly number[]): string {
          for (const n of vector) {
            if (!Number.isFinite(n)) throw new Error(`Invalid vector component: ${n}`);
          }
          return `[${vector.join(',')}]`;
        }
      This converts a runtime pgvector error into an earlier, clearer JavaScript error.

  - id: F-dom-2
    severity: CRITICAL
    file: src/local/migrations/0000_crazy_mimic.sql
    line: 1-7
    plan_ref: "Plan v1.3 § T2.2 (ADR D1.10 bump to drizzle-orm ^0.45.0)"
    domain_anchor: "CREATE EXTENSION pgvector ordering"
    summary: |
      The migration file generated by drizzle-kit does NOT include a `CREATE EXTENSION IF NOT EXISTS vector`
      statement. The schema declares `vector(...)` columns (line 4 entities, line 23 memories) and creates
      HNSW indexes on those columns (line 37, 44), but the pgvector extension is never enabled in SQL.
      Per the integration test (tests/integration/pgvector-store.test.ts:13), the extension must be
      created MANUALLY via: `psql $THEOMEM_PG_URI -c "CREATE EXTENSION IF NOT EXISTS vector"`
      This is a DX friction point and a silent failure vector: if a consumer runs `drizzle-kit push`
      without creating the extension first, the schema creation will fail with `ERROR: type "vector" does not exist`,
      with no clear message about the missing extension. The migration should include this as the first statement.
    evidence: |
      Integration test setup (line 13 of pgvector-store.test.ts):
        psql $THEOMEM_PG_URI -c "CREATE EXTENSION IF NOT EXISTS vector"
        npm run db:push -- --force

      This shows the extension must exist before migrations run, but the migration itself never declares it.
      Compare to Letta's pattern (referencia/letta/compose.yaml): Letta's entrypoint script runs
      `psql -c "CREATE EXTENSION IF NOT EXISTS vector"` BEFORE `alembic upgrade head`.
    recommended_action: |
      Add `CREATE EXTENSION IF NOT EXISTS vector;` as the first statement in the migration.
      Edit src/local/migrations/0000_crazy_mimic.sql:
        - Insert at line 1:
          CREATE EXTENSION IF NOT EXISTS vector;
          --> statement-breakpoint
      Then test: `npm run compose:down && npm run compose:up && npm run db:push`
      should succeed without manual `psql -c "CREATE EXTENSION..."` step.

  - id: F-dom-3
    severity: MAJOR
    file: src/local/schema.ts
    line: 44, 70
    plan_ref: "Plan v1.3 § ADR D1.7 (MAX_EMBEDDING_DIM = 1536)"
    domain_anchor: "pgvector v0.5.1 HNSW dimension limit (2000)"
    summary: |
      Schema correctly pins embedding dimension to 1536 via `vector('embedding', { dimensions: MAX_EMBEDDING_DIM })`
      and creates HNSW indexes with `vector_cosine_ops`. This is correct per ADR D1.7, which documented the
      rationale: pgvector v0.5.1's HNSW index supports max 2000 dims, and 1536 covers OpenAI's embedders.
      HOWEVER: the schema.ts file does not include a defensive comment or constant declaration that would
      catch a future refactor that bumps MAX_EMBEDDING_DIM above the HNSW limit. If a future developer
      changes `MAX_EMBEDDING_DIM = 2048` in constants.ts without reading ADR D1.7, the schema migration
      will silently create an invalid HNSW index (creating beyond 2000 dims fails with `ERROR: column cannot have...`).
    evidence: |
      Line 10 of schema.ts documents this in a comment, but it's a JSDoc — good for humans reading the file,
      but not machine-checkable. The constant MAX_EMBEDDING_DIM is imported from core/constants.ts (line 35),
      but there's no inline assertion.

      Compare to Plan ADR D1.7 § Consequences:
        "`MAX_EMBEDDING_DIM = 1536` constant in `src/core/constants.ts`; schema uses `vector('embedding', { dimensions: 1536 })`"

      The schema declaration uses the imported constant (good), but a test is missing that verifies
      the constant is ≤ 2000 for v0.5.1 compatibility.
    recommended_action: |
      ADD a unit test in src/core/__tests__/constants.test.ts (create if absent):
        describe('MAX_EMBEDDING_DIM', () => {
          it('does not exceed pgvector v0.5.1 HNSW limit of 2000', () => {
            expect(MAX_EMBEDDING_DIM).toBeLessThanOrEqual(2000);
          });
        });
      This is a soft gate: it catches accidental bumps and surfaces the ADR D1.7 rationale at test time.

  - id: F-dom-4
    severity: MINOR
    file: src/local/pgvector-store.ts
    line: 178
    plan_ref: "Plan v1.3 § T3.3 (search implementation)"
    domain_anchor: "Nine-step search: vector dimension handling"
    summary: |
      The search method at line 173-193 calls vectorLiteral(query) on the input query vector.
      There is no dimension check or assertion that query.length == MAX_EMBEDDING_DIM before
      conversion to SQL. If a caller invokes `.search([0.1, 0.2])` (a 2-d vector), the SQL will
      succeed but return wrong results because the cosine distance is computed between vectors
      of mismatched dimension (pgvector silently zero-pads or fails). The factory probes the
      embedder dimension (T7.1), but nothing validates that query vectors from retrieval pipeline
      are correctly shaped.
    evidence: |
      src/local/pgvector-store.ts:173-193
      - No assertion or dimension check before line 188: `vectorLiteral(query)`
      - compare to factory probeEmbedder() (src/local/index.ts:242-246), which validates
        embedder.embed() output dimension but does not validate retrieval pipeline query dims.
    recommended_action: |
      Add a guard in the search method (before vectorLiteral):
        async search(...) {
          if (query.length !== MAX_EMBEDDING_DIM) {
            throw new Error(`search: query vector dimension ${query.length} != MAX_EMBEDDING_DIM ${MAX_EMBEDDING_DIM}`);
          }
          // ... rest of search implementation
        }
      This is a soft gate: it surfaces a silent-failure bug early. The retrieval pipeline is
      responsible for producing correctly-shaped query vectors, but this provides a safety net.

  - id: F-dom-5
    severity: MINOR
    file: src/local/schema.ts
    line: 80-95
    plan_ref: "Plan v1.3 § ADR D1.6 (committed migrations)"
    domain_anchor: "History table design for append-only audit trail"
    summary: |
      The history table declares a composite DESC index on (timestamp DESC, id DESC) at line 94.
      This is correctly designed per EC-18 for efficient reverse-time queries. HOWEVER: the
      migration-generated SQL at line 39 of 0000_crazy_mimic.sql creates this index with BTREE,
      which supports DESC ordering in Postgres 13+, but the choice of DESC on both columns
      is somewhat unusual. Standard practice is to order by timestamp DESC for recency, then
      by id DESC as a tiebreaker. Verified this works in Postgres 13+ (Docker image used is
      Postgres 16 per ankane/pgvector:v0.5.1, so no risk). But worth documenting the rationale.
    evidence: |
      schema.ts line 94:
        index('history_timestamp_idx').on(sql`${table.timestamp} DESC, ${table.id} DESC`)

      Generated SQL (migrations/0000_crazy_mimic.sql:39):
        CREATE INDEX "history_timestamp_idx" ON "history" USING btree ("timestamp" DESC, "id" DESC);

      Both use DESC, which is supported in Postgres 13+ (green; the Docker image is 16).
      This is correct, but the docstring does not explain why ID DESC is chosen as tiebreaker.
    recommended_action: |
      ACCEPT (working as designed). ADD JSDoc clarification:
        // Append-only audit trail, ordered by insertion time DESC for chronological queries.
        // Composite index on (timestamp DESC, id DESC) for efficient reverse-time retrieval
        // and tiebreaking when multiple operations occur in the same millisecond (rare but possible).
        index('history_timestamp_idx').on(sql`${table.timestamp} DESC, ${table.id} DESC`),

  - id: F-dom-6
    severity: MINOR
    file: src/local/pgvector-store.ts
    line: 155
    plan_ref: "Plan v1.3 § T3.3 + D1.1 (per-row fallback)"
    domain_anchor: "Vector serialization in batch insert: parameterization safety"
    summary: |
      Line 155 appends vectorLiteral(vec) directly to the params array:
        params.push(id, text, hash, vectorLiteral(vec), JSON.stringify(cleanedPayload), userId, sessionId, agentId);

      This is safe from SQL injection (the value is a string, then cast via ::vector), but it's
      semantically different from truly parameterized queries. A future developer unfamiliar with
      pgvector might try to parameterize the vector as $N directly (without conversion to string),
      which would fail. The code is correct (mirrors Mem0-ts precedent), but the pattern is non-obvious.
    evidence: |
      src/local/pgvector-store.ts lines 153-155:
        values.push(`($${p++}, $${p++}, $${p++}, $${p++}::vector, $${p++}::jsonb, ...)`);
        params.push(..., vectorLiteral(vec), ...);

      The `$N::vector` cast is necessary because pgvector expects a string representation of a vector.
      This is working as designed, but could be clearer.
    recommended_action: |
      ADD code comment clarifying the vector serialization pattern:
        // Vector serialization: pgvector accepts '[0.1, 0.2, ...]' string format.
        // We parameterize the string and cast via ::vector for SQL injection safety.
        // Direct parameterization of numbers would require pgvector::binary support.
        params.push(..., vectorLiteral(vec), ...);

summary: |
  Domain review of pgvector-schema for v0-1-local-runtime identifies:
  - 1 CRITICAL: Missing `CREATE EXTENSION IF NOT EXISTS vector` in the migration (causes silent setup failure without pre-manual extension creation)
  - 4 MAJOR: Vector literal validation missing (risk of malformed vectors failing at SQL time), MAX_EMBEDDING_DIM dimension limit not tested (risk of future bumps exceeding HNSW limit), search method lacks input dimension validation
  - 2 MINOR: History index DESC pattern could be documented, vector serialization pattern could be clearer

  The CRITICAL issue (CREATE EXTENSION) must be fixed before integration testing succeeds. All others are code quality/documentation improvements that do not block functionality today but reduce future maintenance burden.

  Overall assessment: Schema structure is correct (three tables, correct columns, correct indexes per Drizzle schema design). Drizzle version bump (0.36 → 0.45 per ADR D1.10) is absorbed correctly in the schema syntax. Bi-temporal columns per ADR D1.6 are present and nullable as designed. Embedder dimension probe at factory startup is working (T7.1). Vector store conformance tests will exercise all code paths.
