findings:
  - id: F-tests-1
    status: RESOLVED
    severity: CRITICAL
    file: "src/core/__tests__/constants.test.ts"
    lines: "1-31"
    plan_ref: "Plan v1.3 § T8.1 Deep Dives (EC-5 absorption → F-dom-3)"
    summary: "MAX_EMBEDDING_DIM constant guard test added to prevent accidental dimension bump breaking pgvector HNSW index"
    evidence: |
      Previous review (b2445db) flagged F-dom-3 CRITICAL: no test guards
      against dimension bumps > 2000. The constant is locked at 1536 per ADR D1.7,
      but without a test, a future refactor could silently bump it and break
      the HNSW index creation at `drizzle-kit push` time.

      Current fix (a43e337):
      ```ts
      describe('MAX_EMBEDDING_DIM', () => {
        test('does not exceed pgvector v0.5.1 HNSW limit of 2000 dimensions (ADR D1.7)', () => {
          expect(MAX_EMBEDDING_DIM).toBeLessThanOrEqual(2000);
        });
        test('is a positive integer', () => {
          expect(MAX_EMBEDDING_DIM).toBeGreaterThan(0);
          expect(Number.isInteger(MAX_EMBEDDING_DIM)).toBe(true);
        });
        test('matches the v0.1 locked value of 1536 per ADR D1.7', () => {
          expect(MAX_EMBEDDING_DIM).toBe(1536);
        });
      });
      ```

      This RESOLVES F-dom-3 by introducing three complementary assertions:
      1. Hard ceiling @ 2000 (pgvector limit)
      2. Positive integer validation
      3. Exact 1536 lock-in test (triggers if dimension changed)

      The comment in test 3 explicitly directs maintainers to update ADR D1.7
      when the constant is bumped.
    analysis: |
      CRITICAL finding from previous /review has been FULLY RESOLVED.

      The test is well-positioned (src/core/__tests__/ where the constant lives)
      and uses clear assertion structure (no complex logic). The three tests
      form a defense-in-depth:
      - Test 1: guards the architectural constraint (HNSW limit)
      - Test 2: guards against accidental negatives/non-integers
      - Test 3: documents the EXACT locked value + update procedure

      The test does NOT mock or stub anything; it tests the actual exported
      constant. This is appropriate for a configuration constant.

      Wiring triad pillar (a) — callers: MAX_EMBEDDING_DIM is used in:
        - src/local/index.ts:243 (factory embedder dimension probe)
        - src/local/pgvector-store.ts:240 (search dimension validation)
        - tests/integration/local-runtime.test.ts:31 (mock embedder setup)
      All three sites call it successfully.

      Wiring triad pillar (b) — integration tests:
        - test_search_validates_query_vector_dimension uses the constant
        - integration test fixture uses mockEmbedding(MAX_EMBEDDING_DIM)
      Both confirm the constant is wired into the real pipelines.

      Wiring triad pillar (c) — runtime metric:
        - The constant itself is not a metric (no emit/count/observe)
        - Its use is proven by integration tests passing
      No specific metric emission needed for a constant; the integration
      test that creates a real 1536-dim vector confirms the dimension works.
    recommended_action: ACCEPT ✓ — this fix is structurally sound and completes the guard contract. Test count grew 226 → 229 (+3). All new tests are essential.

