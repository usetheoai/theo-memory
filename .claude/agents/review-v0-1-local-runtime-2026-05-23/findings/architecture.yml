  - id: F-arch-7
    severity: INFO
    file: src/core/retrieval/pipeline.ts
    line: 1-50
    plan_ref: T5.1 9-step search pipeline
    summary: No issues found. Pipeline correctly implements the additive scoring model from Mem0 (blueprint D2), with threshold-gate-BEFORE-combining invariant preserved.
    evidence: |
      - Nine steps clearly named and ordered per Mem0 comments (blueprint D2 citations)
      - Semantic threshold gates BEFORE combining (EC-9 invariant: semantic < threshold → skip BM25+entity combine)
      - Additive scoring uses `combineScores(scores, maxPossible(signals))` — dumb arithmetic, as spec'd
      - NaN handling per EC-8: threshold gate drops NaN-scored candidates
      - Entity boost is optional flag-gated; v0.1 ships without entity store but interface ready for v0.2
    recommended_action: None. This module exemplifies the retrieval design.

  - id: F-arch-8
    severity: INFO
    file: src/core/scoring.ts
    line: 1-103
    plan_ref: T5.1 Additive scoring primitives
    summary: No issues found. Pure functions, correct mathematical formulas, no side effects or state.
    evidence: |
      - Four exports: `sigmoidBm25`, `entityBoost`, `maxPossible`, `combineScores` — each is stateless
      - Sigmoid params tuned by query length (short vs long queries have different thresholds)
      - Entity boost uses spread-attenuation formula (1 / (1 + 0.001 * (n-1)^2)) matching Mem0 exactly
      - maxPossible correctly computes signal-active combinations {0, 1.0, 1.5, 2.0, 2.5}
      - combineScores guards divide-by-zero and caps at 1.0 per EC-1
    recommended_action: None. This module exemplifies pure-function design.

