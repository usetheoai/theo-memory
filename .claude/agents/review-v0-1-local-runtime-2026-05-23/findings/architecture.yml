  - id: F-arch-3
    status: RESOLVED
    severity: INFO
    file: src/local/pgvector-store.ts
    lines: 119-122, 141-159
    summary: PgvectorStore now accepts optional Tracer; per-row fallback emits persist_fallback events
    evidence: |
      Previous (b2445db):
      ```ts
      constructor(private readonly pool: Pool) {}

      // Per-row fallback (blueprint D1 / Recommendation 1)
      for (let i = 0; i < vectors.length; i += 1) {
        try {
          await this.insertSingle(...);
        } catch {
          // Log + skip; do not poison the rest of the batch
        }
      }
      ```

      Current (HEAD):
      ```ts
      constructor(
        private readonly pool: Pool,
        private readonly tracer?: Tracer,
      ) {}

      // Per-row fallback (blueprint D1 / Recommendation 1)
      // F-arch-3 absorption: emit persist_fallback event so consumers observing the
      // tracer can detect partial-batch degradation.
      emitEvent(this.tracer, 'persist_fallback', { count: vectors.length });
      let failed = 0;
      for (let i = 0; i < vectors.length; i += 1) {
        try {
          await this.insertSingle(...);
        } catch {
          failed += 1;
        }
      }
      if (failed > 0) {
        emitEvent(this.tracer, 'persist_fallback', { failed_rows: failed, total: vectors.length });
      }
      ```
    analysis: |
      CRITICAL finding from previous /review (F-arch-3) has been FULLY RESOLVED via two changes:

      1. Constructor signature extended with optional `tracer?: Tracer` parameter
         - Preserves backward compatibility (default behavior when tracer undefined)
         - Aligns with ADR D1.3 from the plan (observability via optional OTel tracer)
         - Non-breaking: existing callers passing only `pool` continue to work

      2. Per-row fallback now emits observability events
         - `emitEvent(tracer, 'persist_fallback', { count: vectors.length })` fires ONCE when batch fails
         - Inside the per-row loop: counts actual failures
         - Post-loop: `emitEvent(tracer, 'persist_fallback', { failed_rows, total })` summarizes the degradation
         - Zero-cost when tracer is undefined (emitEvent is a no-op per src/core/memory-event.ts)

      Architectural improvements:
      - Defense-in-depth observability: internal fallback path is now VISIBLE to consumers monitoring spans
      - Consumers can now detect partial-batch degradation without reading logs
      - Follows architecture.md rule § 8 (error handling + observability at I/O boundaries)
      - The `emitEvent` function (src/core/memory-event.ts) respects DIP (tracer is optional; no coupling when undefined)
    recommended_action: ACCEPT — this fix is architecturally sound. Observability was missing; now present. No further action needed.

  - id: F-arch-4
    status: NEW_FINDING
    severity: MINOR
    file: src/local/index.ts
    lines: 277-288
    summary: runMigrations helper function added; properly encapsulates the CREATE EXTENSION bootstrapping
    evidence: |
      New public function at src/local/index.ts:
      ```ts
      export async function runMigrations(pool: Pool): Promise<void> {
        // pgvector extension MUST exist before tables with vector columns can be created.
        await pool.query('CREATE EXTENSION IF NOT EXISTS vector');

        const here = dirname(fileURLToPath(import.meta.url));
        const migrationsFolder = resolvePath(here, 'migrations');

        const db = drizzleNodePostgres(pool);
        await migrate(db, { migrationsFolder });
      }
      ```

      Exported via src/index.ts:
      ```ts
      export { createMemory, createLocalMemory, runMigrations } from './local/index.js';
      ```
    analysis: |
      This is a POSITIVE architectural addition (not a defect). The F-dom-2 CRITICAL finding
      from the previous /review was that consumers had no API to run migrations — they either
      ran Drizzle CLI manually OR the schema was assumed to pre-exist.

      The fix introduces a consumer-facing runMigrations() function that:
      1. Handles the pgvector extension bootstrap (idempotent CREATE EXTENSION IF NOT EXISTS)
      2. Resolves the migrations folder from the package
      3. Delegates actual migration execution to drizzle-orm's migrate()

      Architectural considerations:
      - Function is correctly placed in src/local/ (runtime-specific)
      - Exported at the barrel level (src/index.ts) for public consumption
      - Idempotent (safe to re-run)
      - No new imports of problematic types (uses Pool from 'pg', not Drizzle internals)
      - Respects DIP: the pool is passed in, migrations folder is resolved at runtime

      Follows architecture.md rule § 4 (I/O boundaries). This is the canonical boundary
      for database initialization.
    recommended_action: ACCEPT — good architectural addition. Completes the v0.1 contract for consumers.

  - id: F-arch-5
    status: NEW_FINDING
    severity: MINOR
    file: src/local/pgvector-store.ts
    lines: 51-58
    summary: vectorLiteral() function now guards against NaN/Infinity components
    evidence: |
      New validation in vectorLiteral():
      ```ts
      function vectorLiteral(vector: readonly number[]): string {
        for (let i = 0; i < vector.length; i += 1) {
          const n = vector[i] as number;
          if (!Number.isFinite(n)) {
            throw new Error(`vectorLiteral: vector[${i}] is not finite (${String(n)}); pgvector requires finite numbers`);
          }
        }
        return `[${vector.join(',')}]`;
      }
      ```
    analysis: |
      This is a POSITIVE architectural addition (absorbs F-dom-1 edge case).

      Previous behavior: malformed vectors (with NaN/Infinity) would reach pgvector
      and fail with a cryptic "invalid input syntax for type vector" error at the SQL layer.

      New behavior: the validation is EARLY and CLEAR, throwing a domain-specific error
      before reaching pgvector.

      Architectural quality:
      - Follows PARTE I-8 of global CLAUDE.md (Error Handling — fail-fast with clear messages)
      - Boundary validation: catches malformed data at the VectorStore adapter entry point
      - No SRP violation: vectorLiteral is a single-purpose helper (format number[] to pgvector syntax)
      - Cost: O(n) loop once per insert, acceptable for typical vector sizes (~1536 dims)
    recommended_action: ACCEPT — good defensive programming. Aligns with error-handling principles.

