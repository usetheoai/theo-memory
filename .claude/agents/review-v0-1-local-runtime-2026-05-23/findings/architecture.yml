    analysis: |
      This is a POSITIVE architectural addition (absorbs F-dom-4 edge case).

      Previous behavior: mismatched query vectors would silently produce wrong results
      (pgvector computes distance on mismatched dimensions, returning garbage).

      New behavior: dimension mismatch is detected and fails loudly with a clear error.

      Architectural quality:
      - Follows PARTE I-8 of global CLAUDE.md (fail-fast principle)
      - The createLocalMemory factory already probes the embedder dimension at startup (EC-5)
      - This check is a second line of defense: even if the embedder breaks mid-run,
        the search catches it before producing silent wrong results
      - Cost: O(1) length comparison, negligible
    recommended_action: ACCEPT — good defensive programming. Defense-in-depth is appropriate for silent-failure risks.

