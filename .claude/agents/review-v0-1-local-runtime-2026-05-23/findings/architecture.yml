findings:
  - id: F-arch-1
    severity: CRITICAL
    file: src/local/history-manager.ts
    line: 30-31
    plan_ref: T6.1 Drizzle-backed HistoryManager implementation
    summary: Type safety violation—`NodePgDatabase<any>` erases Drizzle type information at constructor, breaking LSP for type-narrowing callers
    evidence: |
      ```ts
      constructor(private readonly db: NodePgDatabase<any>) {}
      ```
      The eslint-disable comment is a band-aid. Per architecture.md § Module hygiene ("No `any` in TypeScript"), this violates strict mode. While the adapter has an eslint-disable-line directive, the design pattern itself breaks Drizzle's generic type system for future schema extensions (e.g., v0.2 entity table integration). Callers cannot reliably infer column types or schema changes.
    recommended_action: Use a generic parameter `DrizzleHistoryManager<T extends Record<string, any>>` or accept `NodePgDatabase<typeof schema>` where schema is imported from ./schema.ts. This preserves type safety across versions and allows Drizzle's type guards to work end-to-end. The one-liner fix makes the class LSP-compliant for any future refactoring that adds typed schemas.

  - id: F-arch-2
    severity: MAJOR
    file: src/local/index.ts
    line: 99-162
    plan_ref: T7.1 LocalScopedMemory implementation
    summary: SRP violation—LocalScopedMemory couples scoping, filtering, and DIP wiring; constructor accepts full config instead of scoped dependencies
    evidence: |
      ```ts
      class LocalScopedMemory implements ScopedMemory {
        constructor(
          private readonly scope: Scope,
          private readonly filters: Filters,
          private readonly config: LocalMemoryConfig,  // <-- passes entire MemoryConfig
          private readonly reflectionPolicy: ReflectionPolicy | undefined,
        ) {}
      ```
      Every call to `remember`, `recall`, `getAll` extracts and passes sub-fields from `this.config` (vectorStore, embedder, llm, etc.). The class has ONE reason to change (scope/filter shape), but the constructor couples it to the entire config structure. If v0.2 adds a new DIP (e.g., `ReflectionTriggerPolicy`), every call site must thread it through `config`.
    recommended_action: Refactor constructor to accept minimal DIP shape: `constructor(scope: Scope, filters: Filters, vectorStore: VectorStore, embedder: Embedder, llm: LLM, ...)` OR use a frozen options object narrowed to only the DIPs each method actually uses. This applies OCP—adding a new DIP at v0.2 becomes an additive parameter, not a structural reshaping of the entire `config` object. Lower the constructor's visible parameter count from 4 to a DIP bundle matching the actual API surface.

  - id: F-arch-3
    severity: MAJOR
    file: src/local/pgvector-store.ts
    line: 113-126
    plan_ref: T3.3 Per-row fallback implementation (EC-3 error handling)
    summary: Silent error swallowing in per-row fallback loop—errors are caught and skipped with no logging or telemetry
    evidence: |
      ```ts
      try {
        await this.insertBatch(vectors, ids, payloads);
      } catch {
        for (let i = 0; i < vectors.length; i += 1) {
          try {
            await this.insertSingle(...);
          } catch {
            // Log + skip; do not poison the rest of the batch
          }  // <-- no actual logging; comment is aspirational
        }
      }
      ```
      The plan (T3.3) declares "per-row fallback at every I/O boundary" to honor Mem0's resilience. The code achieves the functional goal (insert continues despite failures) but VIOLATES global CLAUDE.md § PARTE I-8 (error handling). Errors silently disappear; callers have no visibility into partial failures. A batch of 10 vectors with 3 insertion failures returns success with zero indication that 30% of the write was lost.
    recommended_action: (a) Accept a `logger?: Logger` in the constructor (DIP), or (b) emit OpenTelemetry span events for per-row failures (plan ADR D1.4 declares tracer slots). Log structured data: `{ rowIndex: i, id: vectorId, error: e.message }`. Callers can then decide: ignore (current behavior), retry, or escalate. The comment says "Log + skip" but the implementation is silent—honor the plan's intent by actually emitting the event or passing a structured logger.

  - id: F-arch-4
    severity: MINOR
    file: src/core/lemmatization.ts
    line: 18-32
    plan_ref: T5.2 Optional stemmer selection via dynamic import
    summary: Dynamic require() at module load time complicates testing and tree-shaking; considered acceptable for optional peer but warrants a future refactor flag
    evidence: |
      ```ts
      import { createRequire } from 'node:module';

      let naturalModule: NaturalModule | null = null;
      try {
        const req = createRequire(import.meta.url);
        naturalModule = req('natural') as NaturalModule;
      } catch {
        naturalModule = null;
      }
      ```
      This pattern is pragmatic (matches blueprint D6 / Recommendation 4: "try-require + fallback") and TypeScript-correct. However, it blocks top-level execution and complicates dead-code analysis. Tree-shakers see the code path (even if unreachable) and cannot fully eliminate `simpleStem` when `natural` IS installed. This is acceptable for v0.1 (optional peer design is solid), but flag for v0.2+: lazy-load via `dynamicImport` after first call, not at module instantiation.
    recommended_action: Document in ADR D6 a v0.2 refactor goal: move the require into the first `stem()` call with a one-shot cache (same behavior, lazy execution). This allows tree-shakers to eliminate `simpleStem` at build time when `natural` is present. No code change required for v0.1 acceptance—this is a future optimization.

