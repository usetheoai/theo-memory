    line: 18-20
    plan_ref: ADR D1.0, blueprint D3 (hash dedup via MD5 of raw text)
    domain_anchor: architecture.md § 4 (Hash dedup via MD5 of normalized text — note: comment says "normalized" but code is raw utf-8)
    summary: |
      Hash dedup correctly uses MD5 of raw UTF-8 bytes, NO text normalization. Byte-level exactness matches Mem0's `referencia/mem0/mem0-ts/src/oss/src/memory/index.ts:735` and blueprint D3. Comment at dedup.ts lines 6-11 explicitly documents intentional NO normalization to avoid semantic drift between dedup-time and prompt-time hash. Unicode normalization (NFC vs NFD) creates distinct hashes deliberately — this is correct per design.
    evidence: |
      ```ts
      export function hashFact(text: string): string {
        return createHash('md5').update(text, 'utf8').digest('hex');  // Raw bytes, no normalization
      }
      ```
    recommended_action: |
      Clarify architecture.md § 4 line re: "normalized text" — the comment is misleading. The current code is correct (raw MD5). Consider updating the rule to: "Hash dedup via MD5 of raw UTF-8 bytes (exact byte-level match; no case, NFC/NFD, or whitespace normalization)."

