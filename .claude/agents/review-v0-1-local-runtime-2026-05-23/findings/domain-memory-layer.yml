    severity: INFO
    file: src/core/retrieval/pipeline.ts
    line: 139-151
    plan_ref: ADR D1.0, blueprint D2 (9-step search threshold gating)
    domain_anchor: architecture.md § 4 (Additive scoring with semantic threshold BEFORE combining)
    summary: Semantic threshold gate correctly applied BEFORE combining scores (lines 139-141 check `c.semantic < threshold` before calling `combineScores` at line 142-145). Invariant preserved — matches Mem0's architecture (blueprint D2 / referencia/mem0-ts:1117-120).
    evidence: |
      ```ts
      // Step 8: threshold filter (semantic gate BEFORE combining + final threshold AFTER)
      for (const [id, c] of candidates.entries()) {
        if (c.semantic < threshold) {  // <-- GATE HAPPENS HERE
          continue;
        }
        const combined = combineScores(
          { semantic: c.semantic, bm25: c.bm25, entityBoostScore: c.entity },
          maxScore,
        );
        if (combined < threshold) {  // <-- FINAL GATE AFTER COMBINING
          continue;
        }
      ```
    recommended_action: No action — pattern verified. EC-8 NaN drop also implemented (line 149).

  - id: F-mem-2
    severity: INFO
    file: src/core/scoring.ts
    line: 67-79
    plan_ref: ADR D1.4 (additive scoring, not multiplicative)
    domain_anchor: CLAUDE.md § Deferred to v0.4 (Generative Agents multiplicative scoring deferred)
    summary: |
      Additive scoring formula correctly ported from Mem0. `maxPossible(signals)` returns the sum of active signal maxima (semantic=1.0, bm25=1.0, entity=ENTITY_BOOST_WEIGHT=0.5 → totals of 1.0, 1.5, 2.0, or 2.5). No multiplicative Generative-Agents pattern (which would use recency × importance × relevance). Matches `referencia/mem0/mem0-ts/src/oss/src/utils/scoring.ts:108-130` exactly.
    evidence: |
      ```ts
      export function maxPossible(signals: ActiveSignals): number {
        let total = 0;
        if (signals.semantic) total += 1.0;     // Additive, not multiplicative
        if (signals.bm25) total += 1.0;
        if (signals.entity) total += ENTITY_BOOST_WEIGHT;  // 0.5
        return total;
      }
      ```
    recommended_action: No action — design locked and verified.

  - id: F-mem-3
