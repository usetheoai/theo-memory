    summary: |
      Prompt injection defense correctly implemented. `escapeMarkdownHeaders` function (lines 28-30) replaces `^## ` (line-start markdown header) with `\#\# ` BEFORE template interpolation. Applied to both existing-memory text (line 46) and new-message content (line 51) in the prompt composer. Defeats a user-text-as-fake-section-delimiter attack. Matches blueprint Recommendation 5 (markdown escape).
