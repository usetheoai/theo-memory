  - id: F-mem-12
    severity: MAJOR
    file: src/core/retrieval/pipeline.ts
    line: 77
    plan_ref: ADR D1.4 (MemoryEvent enum emission)
    domain_anchor: wiring triad pillar (c) — runtime metric proof via OpenTelemetry span attributes + MemoryEvent enums
    summary: |
      Retrieval pipeline emits event only ONCE per search (line 77: `emitEvent(tracer, 'extraction_started')`), reusing the name for "search started" with a TODO comment. Per ADR D1.4 + plan § T5.1, the 9-step search SHOULD emit events per step or per major boundary (e.g., semantic_search_complete, bm25_complete, threshold_filter_complete) to allow integration tests to verify non-zero metric counts per step. Current single event makes the wiring-triad pillar (c) metric assertion pass technically, but weakly — only one event instead of N per 9 steps.
    evidence: |
      ```ts
      // Step 1: preprocess
      emitEvent(tracer, 'extraction_started'); // reuse this event for "search started"; v0.2 may add dedicated names
      ```
      The comment explicitly notes this is a v0.2 TODO. Plan T5.1 Deep Dives should have captured "9 events, 1 per step" to match write pipeline's 8 events.
    recommended_action: |
      Not a blocker for v0.1 (plan acknowledges this as v0.2 scope via comment). However, document in CHANGELOG under "Known Limitations" that retrieval pipeline emits a single 'extraction_started' event vs the intended 9 per-step events — this will surface for the v0.2 implementer without needing re-discovery. Consider adding a TODO comment in plan T5.1 + retrieval-pipeline.ts to make the debt visible.

