findings:
  - id: F-dom-1
    severity: CRITICAL
    file: package.json
    line: null
    plan_ref: ADR D1.6 — committed migrations + npm package shipping
    domain_anchor: CLAUDE.md § Locked names; plan § D1.6 Consequences ("package.json#files includes src/local/migrations/")
    summary: The package.json does NOT declare a "files" field to include src/local/migrations/ in the npm package. Production consumers running npm install @usetheo/memory will NOT receive the migration SQL files, breaking the production migration path documented in the plan (migrate(db, {migrationsFolder: './migrations'})).
    evidence: |
      src/local/migrations/ contains committed, ready-to-ship files:
      - 0000_crazy_mimic.sql (initial schema, 44 lines, HNSW index + bi-temporal + scope columns all present)
      - meta/_journal.json (drizzle metadata, v7 format per drizzle-kit 0.31)

      Package.json has no "files" field (jq '.files' returns null). Without this declaration:
      - npm pack will exclude src/local/migrations/ from the tarball (npm default: include only /dist, /lib, /src)
      - Production consumers installing @usetheo/memory will have NO access to migration files
      - The fallback: "consumers run their own production Postgres apply migrations via the Drizzle migrator at app boot (migrate(db, { migrationsFolder: './migrations' }))" CANNOT WORK
      - Schema drift at deploy is guaranteed
    recommended_action: |
      Add to package.json:
      ```json
      "files": [
        "dist",
        "src/local/migrations"
      ]
      ```
      This ensures production consumers receive the migration directory alongside the compiled dist/ code. Validates via "npm pack" + "tar tzf theo-memory-0.1.0.tgz | grep migrations" before release.

  - id: F-dom-2
    severity: CRITICAL
    file: src/local/index.ts
    line: 255
    plan_ref: ADR D1.6 — production migration at app boot; T7.1 factory (createLocalMemory)
    domain_anchor: plan § D1.6 narrative ("Consumers who run their own production Postgres apply migrations via the Drizzle migrator at app boot (`migrate(db, {migrationsFolder: './migrations'})`)")
    summary: The createLocalMemory factory does NOT apply migrations at initialization time. The plan explicitly states production consumers MUST call migrate(...) at app boot, but the factory provides zero guidance, utilities, or examples to enable this. A production app using createLocalMemory will start against a schema that does NOT exist, causing immediate runtime failures on the first remember/recall.
    evidence: |
      createLocalMemory (lines 253-257) does:
      1. probeEmbedder (embedder dimension check)
      2. vectorStore.initialize() (PgvectorStore.initialize calls pool.query('SELECT 1') — connectivity only, NOT migration)
      3. return new LocalMemory

      There is NO call to drizzle-orm's migrate() function. The plan narrative (D1.6) says:
      "Consumers who run their own production Postgres apply migrations via the Drizzle migrator at app boot"

      But createLocalMemory provides zero:
      - No exported migrate() helper
      - No example in JSDoc of how to wire migrate(db, { migrationsFolder: './migrations' })
      - No error message if schema is missing (first INSERT will fail cryptically with "relation memories does not exist")

      DEV path works: npm run db:push applies schema directly (Drizzle Kit's dev-only feature).
      PROD path is broken: npm install @usetheo/memory → createLocalMemory(...) → error on first query.
    recommended_action: |
      Export a migration helper from src/local/index.ts:
      ```typescript
      export async function ensureSchemaUpToDate(db: NodePgDatabase): Promise<void> {
        const { migrate } = await import('drizzle-orm/node-postgres/migrator');
        const migrationsPath = new URL('./migrations', import.meta.url).pathname;
        await migrate(db, { migrationsFolder: migrationsPath });
      }
      ```

      Update createLocalMemory JSDoc to show usage:
      ```typescript
      /**
       * Production usage:
       * const db = drizzle(pool);
       * await ensureSchemaUpToDate(db);  // applies migrations
       * const memory = await createLocalMemory({ vectorStore: new PgvectorStore(pool), ... });
       */
      ```

      Alternatively, fold into the vectorStore.initialize() contract (if all stores own schema setup).

  - id: F-dom-3
    severity: MAJOR
    file: src/local/pgvector-store.ts
    line: 98-100
    plan_ref: T3.3 — VectorStore DIP; plan § phase 3 (adapters depend on schema)
    domain_anchor: CLAUDE.md § Locked names; ADR D1.6 (Drizzle schema migrations); blueprint D4 (raw SQL via pg.Pool)
    summary: PgvectorStore.initialize() only validates connectivity ('SELECT 1') but does NOT validate that the schema exists or is at the expected version. A production deployment where migrations failed silently or were skipped will pass initialize() and then fail cryptically at the first INSERT (MemoryItem or Entity row), breaking the ADD-only guarantee and causing opaque runtime errors.
    evidence: |
      src/local/pgvector-store.ts:98-100
      ```typescript
      async initialize(): Promise<void> {
        // Schema is owned by Drizzle migrations (T2.2). Just verify connectivity.
        await this.pool.query('SELECT 1');
      }
      ```

      Schema validation is missing. The comment acknowledges that "schema is owned by Drizzle migrations" but defers all responsibility. If:
      - An operator runs: createLocalMemory(...) WITHOUT running migrations
      - OR migrations failed but returned success (not a realistic failure, but possible)
      - OR schema was manually dropped in production (human error)

      Then initialize() will succeed, and the first query will fail with:
      ERROR: relation "memories" does not exist at character X

      This violates the fail-fast principle (CLAUDE.md § PARTE I-8 Error Handling): "The system should fail the most calmly possible, the most high possible, and with the message most clear possible."

      Suggested validation: check for the existence of the memories table (or a marker object in schema).
    recommended_action: |
      Add schema validation to PgvectorStore.initialize():
      ```typescript
      async initialize(): Promise<void> {
        // Verify connectivity
        await this.pool.query('SELECT 1');

        // Verify schema exists (tables required for operation)
        const tablesExist = await this.pool.query(
          `SELECT EXISTS(SELECT FROM information_schema.tables WHERE table_name='memories')`
        );
        if (!tablesExist.rows[0]?.exists) {
          throw new Error(
            'Schema missing: memories table not found. ' +
            'Run migrations first: await ensureSchemaUpToDate(db) or npm run db:push'
          );
        }
      }
      ```

      Or, simpler: attempt a harmless schema query (DESCRIBE memories) and wrap any "relation not found" in a clear error message.

  - id: F-dom-4
    severity: MAJOR
    file: drizzle.config.ts
    line: 20-21
    plan_ref: T0.4 — drizzle.config.ts configuration; ADR D1.10 (dialect + env var shape)
    domain_anchor: plan § D1.10 narrative ("CLI subcommand shape: `push` + `generate` (NOT `push:pg` / `generate:pg`)")
    summary: drizzle.config.ts correctly configures the PostgreSQL dialect and THEOMEM_PG_URI env var, but there is NO verification that the pgvector extension is installed before migration attempts. A developer running `npm run db:push` or `npm run db:generate` against a Postgres 16 container WITHOUT the pgvector extension installed will fail at the first `CREATE INDEX ... USING hnsw` statement with an obscure error ("type vector does not exist" or "access method hnsw does not exist").
    evidence: |
      drizzle.config.ts:19-28 does not check for extension.

      docker-compose.yaml uses ankane/pgvector:v0.5.1, which includes the extension pre-installed.
      README Quickstart says: "psql $THEOMEM_PG_URI -c 'CREATE EXTENSION IF NOT EXISTS vector'"

      However, there is NO automated check in the drizzle config or migration logic to ensure the extension exists. If a developer:
      1. Forgets the CREATE EXTENSION step (README step 3)
      2. OR uses a plain Postgres container instead of ankane/pgvector
      3. OR migrates to a prod DB where the extension was not pre-installed

      The error from drizzle-kit is cryptic and hard to debug.
    recommended_action: |
      Add a pre-migration hook or validation script. Drizzle does not support pre-migration hooks natively, so:

      Option A (recommended): Create a precheck script at scripts/verify-pgvector-extension.ts:
      ```typescript
      import { Pool } from 'pg';

      async function checkPgvectorExtension() {
        const pool = new Pool({ connectionString: process.env['THEOMEM_PG_URI'] ?? '...' });
        const result = await pool.query(
          "SELECT EXISTS(SELECT FROM pg_extension WHERE extname='vector')"
        );
        if (!result.rows[0]?.exists) {
          throw new Error(
            'pgvector extension not installed. ' +
            "Run: psql $THEOMEM_PG_URI -c \"CREATE EXTENSION IF NOT EXISTS vector\""
          );
        }
        await pool.end();
      }
      ```

      Option B: Document in README that `npm run db:push` expects the extension to be installed and provide a helper script.

      Option C (future): Integrate into createLocalMemory or PgvectorStore.initialize() to check extension presence at runtime.

  - id: F-dom-5
    severity: MINOR
    file: src/local/migrations/meta/_journal.json
    line: null
    plan_ref: ADR D1.10 — drizzle-kit v0.31.0; D1.6 (committed migrations)
    domain_anchor: plan § "Plan v1.3 changes: ... ADDED ADR D1.10 — forced bump of `drizzle-orm ^0.36.0` → `^0.45.0` + `drizzle-kit ^0.28.0` → `^0.31.0` for security"
    summary: The migration _journal.json uses version: "7" (drizzle-kit 0.31 metadata format), which is correct. However, the timestamp (1779543498602 — May 2026 Unix ms) is present but there is no downgrade SQL in the migration file, meaning v0.1.0 cannot be cleanly downgraded to a prior schema version (not a blocker for v0.1, but the migration is incomplete for a mature production library).
    evidence: |
      src/local/migrations/0000_crazy_mimic.sql contains only CREATE TABLE and CREATE INDEX statements.
      No DOWN SQL (DROP TABLE IF EXISTS / DROP INDEX IF EXISTS) is present.

      This is acceptable for v0.1 because:
      - v0.1 is pre-release (not production-deployed yet per dogfood gate)
      - No prior version exists to downgrade FROM
      - Downgrades are rare in fast-moving code

      But for a production library at v1.0+, migrations without downgrade paths limit the team's flexibility on recovery from failed deployments.
    recommended_action: |
      For v0.2+, when committing new migrations, ensure drizzle-kit generates BOTH UP and DOWN SQL.
      Drizzle-kit does not generate DOWN SQL by default; the team must:
      1. Hand-write the DOWN statements in the migration file (e.g., DROP TABLE memories CASCADE)
      2. OR document in the migration file that downgrade is not supported
      3. OR add a schema versioning strategy (migrations table with version tracking)

      For v0.1, this is a documentation note: the initial migration has no downgrade path. Accept as-is.

