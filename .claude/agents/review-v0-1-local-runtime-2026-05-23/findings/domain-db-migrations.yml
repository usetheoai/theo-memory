  - id: F-dom-7
    severity: INFO
    file: tests/integration/local-runtime.test.ts
    line: 92-102
    plan_ref: T8.1 — integration test against real pgvector; plan roadmap item 2 acceptance
    domain_anchor: CLAUDE.md § Testing Rules (pyramid, integration tests); plan § "TRUNCATE memories, entities, history CASCADE" cleanup
    summary: Integration test correctly uses TRUNCATE CASCADE to reset schema state between test cases, preventing test pollution. Schema isolation (alice/bob user scope) is verified. Fallback embed-batch path exercises the per-row insertion logic. OTel spans verify the wiring-triad pillar (c) metric emission. No schema-related defects found in the integration test harness.
    evidence: |
      Integration test setup:
      - afterAll: TRUNCATE memories, entities, history CASCADE (cleanup)
      - beforeEach: TRUNCATE memories, entities, history RESTART IDENTITY CASCADE (isolation)
      - pool.end() cleanup

      Tests cover:
      1. Canonical: remember + recall returns persisted memory in top-3
      2. Scope isolation: alice does NOT see bob memories
      3. Fallback: embed-batch failure triggers per-row fallback path
      4. OTel: wiring-triad pillar (c) — extraction_completed, embedding_batch_completed, persist_completed spans emitted
      5. Forget: deleted memory disappears from recall

      All tests are deterministic (fixed embeddings via mockEmbedding variant). No flaky time-dependent logic. Schema state is reset per test via TRUNCATE + RESTART IDENTITY, preventing cross-test pollution.
    recommended_action: No action. Integration test is thorough and schema-aware.

summary: 2 CRITICAL issues (missing package.json#files + no migration application at factory init) block production use. 2 MAJOR issues (PgvectorStore initialization lacks schema validation + missing pgvector extension check). These must be resolved before /review can advance to merge. The schema structure itself is correct and complete per the plan; the defects are in the production deployment story.
