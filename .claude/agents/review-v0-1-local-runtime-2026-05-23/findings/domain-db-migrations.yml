domain: db-migrations
domain_specific_patterns_checked:
  - drizzle-orm schema compliance (structure, indices, HNSW pgvector)
  - bi-temporal column shape per ADR-0006 (both t_valid and t_invalid nullable)
  - three-tier scope columns (user_id, session_id, agent_id all nullable)
  - migration committed format per ADR D1.6 (src/local/migrations/{timestamp}_{name}.sql)
  - hash dedup index uniqueness per ADR D1.3
