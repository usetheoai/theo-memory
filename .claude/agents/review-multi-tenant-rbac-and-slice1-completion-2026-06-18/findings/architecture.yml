findings:
  - id: F-arch-1
    severity: MEDIUM
    file: packages/api/src/server/handlers/admin-keys.ts
    line: 222
    plan_ref: ADR D4 "mint handler consults MembersRepository.getMemberRole"
    summary: >
      Anti-escalation guard re-implements the caller-role-join SQL + target-role
      lookup inline instead of delegating to MembersRepository.getMemberRole as
      the plan's ADR D4 prescribes. Knowledge of the role-join lives in three
      places now (api-key-verifier.SELECT_PRINCIPAL_BY_HASH_SQL, members-store-pg
      .getMemberRole, and this handler), violating DRY for a security-critical
      authz rule.
    evidence: |
      ```ts
      // admin-keys.ts:222 — inline caller-role join (duplicates api-key-verifier)
      const callerRow = await pool.query<{ workspace_id: string; role: string | null }>(
        `SELECT k.workspace_id, m.role
           FROM theo_api_keys k
           LEFT JOIN workspace_users m
             ON m.workspace_id = k.workspace_id AND m.user_id = k.user_id
          WHERE k.key_hash = $1 ...`, [callerHash]);
      // admin-keys.ts:238 — inline target-role lookup (duplicates getMemberRole)
      const targetRow = await pool.query<{ role: string }>(
        `SELECT role FROM workspace_users WHERE workspace_id = $1 AND user_id = $2 LIMIT 1`, ...);
      ```
      Plan T2.1 Deep Dives: "anti-escalation (mint): ... const tr = await
      members.getMemberRole(principal.workspaceId, rawUserId)". The DIP that
      exists for exactly this lookup is bypassed. The handler also re-derives the
      caller's role from the raw Authorization header (re-hashing the token)
      instead of reading the already-resolved `getPrincipal(c)` — the Principal
      injected by bearerAuth already carries workspaceId+role+userId.
    recommended_action: >
      Pass MembersRepository into createKeyHandler (DI like members handlers) and
      replace both inline queries with getPrincipal(c) for the caller +
      members.getMemberRole(workspaceId, targetUserId) for the target. Removes 2
      duplicated SQL strings and the double token-hash.

  - id: F-arch-2
    severity: MEDIUM
    file: packages/core/src/infrastructure/db/recall-cache/pgvector-recall-cache-store.ts
    line: 79
    plan_ref: ADR D6 "recall-cache scope key includes workspace_id"
    summary: >
      Workspace isolation in the recall cache is achieved ONLY via the scope_key
      prefix (deriveScopeKey embeds `ws:${workspaceId}|`). The `recall_cache
      .workspace_id` column (schema.ts:423, NOT NULL DEFAULT 'default') is never
      read or written by GET_SQL/INSERT_SQL/INVALIDATE_SCOPE_SQL — it is a dead
      column whose declared purpose (tenant isolation) is silently unmet at the
      column level. The plan ADR D6 says "the cosine lookup also ANDs
      workspace_id" — the SQL does not.
    evidence: |
      ```sql
      -- GET_SQL filters scope_key only; no workspace_id predicate
      WHERE scope_key = $1 AND (1 - (query_embedding <=> $2::vector)) >= $3 ...
      -- INSERT_SQL inserts scope_key, query_embedding, result_set, expires_at,
      -- threshold_used — workspace_id column is left to its DEFAULT 'default'
      ```
      All recall_cache rows across every workspace will physically carry
      workspace_id='default' even when serving ws-B traffic. Isolation holds
      functionally (scope_key prefix differs), but the column-level invariant the
      migration/schema advertises is violated, and ADR D6's stated AND-clause is
      absent.
    recommended_action: >
      Either (a) populate + filter workspace_id in the three cache SQL statements
      to match ADR D6 and make the column load-bearing (defense-in-depth +
      queryable by tenant), OR (b) drop the workspace_id column from recall_cache
      and document in ADR D6 that prefix-keying is the sole isolation mechanism.
      The current state — column present, advertised, but unused — is the worst
      of both (drift between schema intent and runtime).

  - id: F-arch-3
    severity: MEDIUM
    file: packages/core/src/infrastructure/db/pgvector-skill-store.ts
    line: 110
    plan_ref: ADR D6 "skill-store + eviction add the workspace_id insert"
    summary: >
      insertSkill and insertDerivedSkillAtomic thread workspace_id into the
      INSERT column list, but the non-atomic insertDerivedSkill (lines 102-138)
      does NOT include workspace_id — a derived skill written via this path lands
      in workspace_id='default' regardless of source. Latent isolation
      inconsistency. Today the live consolidate path uses insertDerivedSkillAtomic
      so it is not a live leak, but the three sibling methods now diverge in their
      column contract.
    evidence: |
      ```ts
      // insertDerivedSkill (NON-atomic) — column list omits workspace_id:
      `INSERT INTO memories (
         text, hash, embedding, payload,
         user_id, session_id, agent_id,            // <-- no workspace_id
         kind, derived_from, code, description, code_language
       ) VALUES (...)`,
      // vs insertDerivedSkillAtomic which DOES list workspace_id (line 170)
      ```
      Callers in production: only insertDerivedSkillAtomic (consolidate.ts) and
      the test/conformance harness use insertDerivedSkill. So no current data
      escapes, but a future caller of the non-atomic variant would silently
      cross-contaminate workspaces.
    recommended_action: >
      Add `workspace_id` (args.scope.workspaceId ?? 'default') to the
      insertDerivedSkill column list + VALUES for parity with its two siblings,
      or remove the now-redundant non-atomic insertDerivedSkill if the atomic
      variant fully supersedes it.

