  - id: F-arch-8
    severity: INFO
    file: packages/api/src/server/auth/middleware.ts
    line: 133
    plan_ref: ADR D5 (503 fail-closed) + T1.1
    summary: >
      The 503 fail-closed guard is correctly placed: resolvePrincipalFrom is
      wrapped in try/catch, the Principal is c.set ONLY on a non-null successful
      resolution, and a thrown verifier returns 503 service_unavailable without
      ever falling through to the privileged DEFAULT_PRINCIPAL. requireRole is
      mounted after bearerAuth so 401 precedes 403. Fail-closed semantics match
      ADR D5 exactly — no fail-open-to-owner path exists.
    evidence: |
      ```ts
      let principal: Principal | null;
      try { principal = await resolvePrincipalFrom(hoistedVerifier, token); }
      catch { return c.json({ code: 'SERVICE_UNAVAILABLE', ... }, 503); }
      if (principal === null) return 401;
      c.set('principal', principal);
      ```
    recommended_action: None — fail-closed correctly implemented.

