  - id: F-tests-5
    severity: LOW
    file: tests/integration/global-setup.ts
    line: 44
    plan_ref: testing.md § Determinism + § Integration (reset DB state)
    summary: >
      New shared global-setup applies all migrations to a single shared DB and swallows errors by
      string-matching on 'already exists' / 'duplicate key' / 'multiple primary keys'. This can mask
      genuine schema-drift or migration-ordering defects (a real "duplicate key" data error and an
      idempotent "already exists" are treated identically), and the shared-DB model removes per-file
      isolation that testing.md § Integration requires ("each test resets the DB").
    evidence: |
      tests/integration/global-setup.ts:44-58 — catch block continues on any message containing
      the three substrings; otherwise rethrows. Migrations applied once to the shared THEOMEM_PG_URI;
      tests needing a different dim "MUST create their own isolated database" (header comment) — an
      easily-violated convention rather than an enforced boundary.
    recommended_action: >
      Narrow the swallow to idempotent DDL only (prefer Postgres `IF NOT EXISTS` / SQLSTATE codes
      over substring matching), and document/enforce per-suite DB isolation so a shared-state leak
      cannot produce order-dependent flakiness.

