findings:
  - id: F-dom-1
    severity: MAJOR
    file: .claude/skills/review/scripts/spawn_reviewers.py
    line: 191
    plan_ref: Task T1.3 — Implementar resolução de modelo em spawn_reviewers.py
    domain_anchor: Help text clarity § metavar and role semantics
    summary: Help text for --model-override does not clarify the syntax "ROLE=MODEL" with example or explain which role values are valid
    evidence: |
      Current help:
        --model-override ROLE=MODEL
                          Override resolved model for a role (repeatable). Takes
                          precedence over rule entries.

      A user might confuse "role" with git role / user role and not understand
      that valid values are: "architecture", "tests", "wiring", "cross-validation",
      "domain" (and domain-X for secondary domains).

      Example clarification needed:
        --model-override ROLE=MODEL
                          Override resolved model for a role (repeatable, e.g.,
                          --model-override architecture=sonnet). Valid roles:
                          architecture, tests, wiring, cross-validation, domain,
                          domain-<secondary>. Takes precedence over rule entries.
    recommended_action: Update help text in _ModelOverrideAction.add_argument() or argparse definition to include example and valid role list, or point to docs/review-model-routing.md for reference.
  - id: F-dom-2
    severity: INFO
    file: .claude/skills/review/scripts/spawn_reviewers.py
    line: 56
    plan_ref: EC-6 — malformed rule lines (silent skip)
    domain_anchor: Fail-soft parsing of review-model-routing.txt
    summary: Malformed rule lines (missing colon) are silently skipped with no warning or audit trail — good for robustness, but users may not notice if they mistype the rule file
    evidence: |
      _load_routing_rule() at lines 42-68:
        if ":" not in stripped:
            continue  # malformed entry, silently skipped (EC-6)

      When a user writes "architecture haiku" (missing colon), the script
      continues without notice. The agent will fall back to default opus.
      This is intentional (EC-6 spec), but audit trail is missing.
    recommended_action: No code change needed — this behavior is correct per plan spec (EC-6). However, consider documenting in routing_rule_loaded JSON output whether parsing silently dropped entries (future enhancement, not blocking).
  - id: F-dom-3
    severity: INFO
    file: .claude/skills/review/scripts/spawn_reviewers.py
    line: 39, 40
    plan_ref: Task T1.3 — Fallback chain doc
    domain_anchor: Exit code semantics and default model
    summary: Exit code contract is correct (0=success, 1=write errors, 2=fatal), but comment on line 39 could clarify why opus is the default (backward-compatibility)
    evidence: |
      Line 39: DEFAULT_MODEL = "opus"
      Line 40: # Default fallback model when the routing rule is absent OR a role has no
               # entry (preserves pre-split behavior — all agents run on opus).

      Comment is clear, but the relationship between this default and the
      "teacher model" for cross-validation could be more explicit in docstring.
    recommended_action: Minor: add context to main() docstring noting that DEFAULT_MODEL = opus = teacher model archetype per plan, ensuring future maintainers understand the fallback semantics.
  - id: F-dom-4
    severity: MINOR
    file: .claude/skills/review/scripts/spawn_reviewers.py
    line: 183-192
    plan_ref: Task T1.3 — CLI ergonomics
    domain_anchor: Missing --dry-run flag for testing
    summary: No --dry-run flag exists — users cannot validate routing-rule or CLI arguments without actually writing agent files
    evidence: |
      Typical workflow when testing a new routing rule:
        1. Write rule file
        2. Invoke spawn_reviewers.py (creates files + modifies disk)
        3. Inspect output
        4. If rule is wrong, manually delete agent files
        5. Edit rule, repeat from step 2

      A --dry-run flag would let users validate without filesystem side-effects.
    recommended_action: Optional future enhancement (out of scope for v0.1 if not in plan) — add --dry-run flag that parses rule and outputs JSON preview of agent models without writing files. Adds ~15 LoC.
findings_summary: |
  CLI tooling surface is SOLID. All 5 RED tests pass. Exit code semantics correct
  (0/1/2 split honored), edge cases (EC-5 empty value, EC-6 malformed rule) handled
  properly. Only issue: --model-override help text lacks example + valid role list,
  making it slightly unclear for first-time users. Recommended: update help text
  (30-second fix). No other ergonomics concerns found; --dry-run is nice-to-have,
  not blocking.
