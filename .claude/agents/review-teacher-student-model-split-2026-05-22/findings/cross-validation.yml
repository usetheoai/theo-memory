divergences_assessment:
  count: 3
  classification: ALL_ACCEPTABLE_AND_DOCUMENTED
  details:
    - id: DIV-1
      task: T1.1
      summary: 9/10 tests RED (not 10/10)
      reason: |
        test_cli_override_with_empty_value_rejected asserts `rc != 0`. argparse exits with rc=2 on unknown arguments BEFORE T1.3 lands the flag definition. So this test "passes" incidentally on the pre-T1.3 code (no flag → argparse error → rc=2 ≠ 0). After T1.3, _ModelOverrideAction explicitly rejects empty values with parser.error → also rc=2 ≠ 0. Same assertion holds either way.
        Commit message df47b45 documents this honestly: "Status: 9/10 RED (correct), 1/10 incidentally-passing via argparse exit 2".
      severity: INFO
      assessment: Acceptable. Test still guards the contract (rc != 0 when empty value). The incidental-pass is a property of argparse's behavior, not a test design flaw. Honestly disclosed in the commit message.
    - id: DIV-2
      task: T2.2-A
      summary: Shipped INSTRUCTION-LEVEL infra only (rule + prompt instructions + cycle-implement docs), not the Python-test-backed GREEN cycle the plan literal described
      reason: |
        Plan T2.2-A § TDD declares: "test_phase_model_routing_resolves_green_to_haiku" and "test_phase_model_routing_fallback_when_rule_missing" as RED tests.
        Implementation per commit 23cebfe: "no Python parser added (rule format reuses spawn_reviewers mental model)" — because the rule is consumed by the LLM-driven halt-loop driver (prompt instruction), not by a Python script.
        Spike T2.1 recommended escopo enxuto = COMMIT phase only (NOT GREEN); GREEN deferred to 2026-08-22 per spike. So the GREEN-specific tests in the plan template would test code that wasn't shipped.
      severity: MINOR
      assessment: Acceptable. Documented in commit 23cebfe ("Plan T2.2-A AC for new tests is partially satisfied"), in implementation-contract.md § Known follow-ups #2, and in CHANGELOG.md ("INSTRUCTION-LEVEL infra"). The spike's recommendation is honored — shipping the literal tests would test deferred code. ADR D4 explicitly anchors this conditional branching ("baseado no resultado, T2.2 vira A (implementar) OU B (ADR-DEFER)") and the spike's recommendation legitimately narrowed the scope further within branch A.
    - id: DIV-3
      task: T2.2-A
      summary: Runtime validation of nested Agent tool invocation deferred to first real /implement run
      reason: |
        Plan T2.2-A AC: "Dry-run em scratch dir mostra GREEN rodando em Agent com model: haiku."
        Implementation: instruction is in implementation-prompt.md but no dry-run exercise was performed (committed at 23cebfe says "Integration validation of the nested Agent invocation deferred to first real /implement run").
        Backward-compat preserved: if rule file removed, COMMIT runs inline on session model (zero behavior change).
      severity: MINOR
      assessment: Acceptable. Documented in commit message, implementation-contract.md, and CHANGELOG.md. Rollback is single git rm; risk surface is low. Honest disclosure rather than fabricated pass.

