  - id: F-dom-api-2
    severity: LOW
    file: packages/api/src/server/handlers/episodes.ts
    line: 11
    plan_ref: ADR D6 — "invalid cursor -> 422"; v1.1 EC-4
    domain_anchor: agent recipe api-design "error response shape consistent across endpoints"
    summary: >
      Deliberate 422-vs-400 divergence is acceptable, NOT a consistency BLOCKER.
      episodes uses 422 for ALL query-validation (bad limit / after+before /
      invalid asOf). The older GET .../memories (scopes.ts:144) returns 400
      INVALID_CURSOR for a bad cursor while using 422 for other query errors —
      internally inconsistent itself. ADR D6 + the handler JSDoc explicitly
      document the episode surface choosing a single 422 for all query-validation
      and aligning with the 4-verb asOf->422 precedent. This is a documented,
      intentional design decision (the older endpoint predates it). Honest
      disclosure: a consumer hitting BOTH endpoints sees 400 for a bad memories
      cursor but 422 for a bad episodes cursor — a real (small) cross-endpoint
      inconsistency, mitigated by being documented and forward-consistent.
    evidence: |
      scopes.ts:144  -> return c.json({ code: 'INVALID_CURSOR', ... }, 400);
      episodes.ts:72 -> return c.json({ code: 'INVALID_QUERY', ... }, 422);   // all query validation
      ADR D6: "invalid asOf (NaN Date) -> 422; invalid cursor -> 422".
    recommended_action: >
      Accept as-is. Optionally note in the README/OpenAPI changelog that
      .../episodes standardizes on 422 for query validation (the .../memories
      400-on-cursor is legacy and not being retro-changed to avoid a breaking
      change). No code change required.

  - id: F-dom-api-3
    severity: LOW
    file: packages/api/src/server/handlers/episodes.ts
    line: 100
    plan_ref: Plan §151/§166 — "reuse MemoryItem as the item; EpisodePage { items, nextCursor? }"
    domain_anchor: agent recipe api-design "endpoint shapes match plan's contract section"
    summary: >
      The episode DTO drops the bi-temporal fields (t_valid / t_invalid),
      attributedTo, hash and updatedAt — surfacing only {id, text, scope_type,
      created_at, metadata}. This is internally consistent with the sibling
      shapes and acceptable for a v1 episode feed, BUT it is a mild contract
      tension: the endpoint's headline feature is bi-temporal `asOf` replay, yet
      the response gives the consumer no temporal validity window to interpret
      WHICH version they received. A consumer replaying at two asOf instants
      cannot distinguish a superseded row from a current one in the payload.
    evidence: |
      ```ts
      const items = page.items.map((m) => ({
        id: m.id, text: m.text, scope_type: typeParse.data,
        created_at: m.createdAt instanceof Date ? m.createdAt.toISOString() : String(m.createdAt),
        metadata: m.metadata,
      }));
      ```
      MemoryItem carries more (hash, attributedTo, t_valid/t_invalid) per
      packages/core/src/domain/memory-item.ts; none surface in the episode DTO.
    recommended_action: >
      Acceptable to ship as-is for M2 (KISS — a feed shape). Consider a
      follow-up to surface a `t_valid`/`t_invalid` (or a single `validAt`)
      field once a consumer of `asOf` replay needs to disambiguate versions.
      Document the omission in the OpenAPI description for `scopeEpisodes` so
      consumers know the DTO is a projection, not the full MemoryItem.

  - id: F-dom-api-4
    severity: INFO
    file: packages/api/src/server/openapi-registration.ts
    line: 206
    plan_ref: Plan T3.1 — "register route + OpenAPI"
    domain_anchor: agent recipe api-design "OpenAPI params match actual handler behavior"
    summary: >
      The OpenAPI scopeEpisodes `params.type` uses the shared ScopeTypeEnum
      (user|session|agent|skill) but the handler's ScopeTypeSchema only accepts
      user|session|agent — a `skill` path value yields 404 "Unknown scope type".
      So the spec advertises `skill` as a syntactically valid enum value for a
      param whose only documented response to it is 404. This is NOT new to this
      slice: metrics.ts and entities.ts reuse the identical ScopeTypeEnum while
      rejecting skill the same way, so the episode endpoint is CONSISTENT with
      its siblings. Flagged for completeness only.
    evidence: |
      openapi-registration.ts:206  params: z.object({ type: ScopeTypeEnum, id: ... })  // ScopeTypeEnum includes 'skill'
      episodes.ts:26               const SCOPE_TYPES = ['user','session','agent']      // skill -> 404
      (entities.ts / metrics.ts share the exact same ScopeTypeEnum-vs-handler gap)
    recommended_action: >
      No action needed for this slice (matches established sibling convention).
      If addressed, it should be a cross-endpoint cleanup (a 3-tier enum for the
      list/aggregation params) — out of scope for first-class-episodes.

