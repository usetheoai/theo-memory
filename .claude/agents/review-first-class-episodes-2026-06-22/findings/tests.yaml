    plan_ref: T4.1 GOAL — temporal order
    summary: >
      GOAL case 1 ("temporal order") asserts only asc === desc.reverse() and length 4 — it does NOT assert the actual
      chronological content (e.g. that order=asc yields e1,e2,e3,e4 in insertion order). asc===desc.reverse() is a
      symmetry tautology that holds for ANY stable total order, even a wrong one. The true "newest-first temporal"
      semantics are not pinned to insertion order.
    evidence: |
      integration/episodes.test.ts:96-99 — only expect(asc).toEqual([...desc].reverse()) + length.
      No assertion that asc[0].text==='e1' (oldest) / desc[0].text==='e4' (newest). The deterministic echoLlm makes the
      text content predictable, so the stronger assertion is available and cheap.
    recommended_action: >
      Strengthen case 1 to assert desc[0].text==='e4' and asc[0].text==='e1' (newest-first vs chronological), so a
      reversed-order or wrong-direction regression is caught (today only an asymmetry would be).
