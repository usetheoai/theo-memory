  - id: F-dom-db-1
    severity: INFO
    file: packages/core/src/infrastructure/db/pgvector-store.ts
    line: 753-761
    plan_ref: ADR D2 + EC-3 — cursor row-value comparison matching ORDER BY comparator
    domain_anchor: SQL cursor pagination correctness (4 combinations)
    summary: >
      VERIFIED CORRECT. All 4 cursor operator combinations are sound. With
      isAfter = (options.after !== undefined), laterIsSmaller = (order === 'DESC'),
      op = (isAfter === laterIsSmaller ? '<' : '>'):
      DESC+after -> '<' (older = smaller, correct);
      DESC+before -> '>' (newer = larger, correct);
      ASC+after -> '>' (newer = larger, correct);
      ASC+before -> '<' (older = smaller, correct).
      The row-value comparator (created_at, id) <op> ($a,$b) shares direction with
      ORDER BY created_at <order>, id <order>, so it is internally consistent.
      The in-memory impl (compareCreatedAtId * dir, isAfter ? seq>0 : seq<0)
      maps to the SAME 4 outcomes. No off-by-one, no overlap/gap defect.
    evidence: |
      ```ts
      const isAfter = options.after !== undefined;
      const laterIsSmaller = order === 'DESC';
      const op = isAfter === laterIsSmaller ? '<' : '>';
      extra.push(`(created_at, id) ${op} ($${idx}, $${idx + 1})`);
      ```
    recommended_action: None — correct. Documented here as positive verification.

