  - id: F-dom-db-9
    severity: INFO
    file: packages/core/src/infrastructure/db/pgvector-store.ts
    line: 763-768
    plan_ref: EC-2 — ILIKE metacharacter escape (% _ \\)
    domain_anchor: literal text filter, not wildcard
    summary: >
      VERIFIED CORRECT. queryText wraps escapeLikePattern(options.queryText) in
      `%...%` and uses `ILIKE $n ESCAPE '\\'`. escapeLikePattern escapes \\, %, _
      with a backslash prefix; the JS literal '\\\\' compiles to a single backslash
      so SQL sees ESCAPE '\'. Therefore a queryText of "50%" matches the literal
      "50%" and NOT "500" — confirmed by both the in-memory unit test and
      integration test #6. No injection (value is a bound param).
    evidence: |
      ```ts
      extra.push(`text ILIKE $${idx} ESCAPE '\\'`);
      params.push(`%${escapeLikePattern(options.queryText)}%`);
      // escapeLikePattern: text.replace(/[\\%_]/g, (c) => `\\${c}`)
      ```
    recommended_action: None — correct.
