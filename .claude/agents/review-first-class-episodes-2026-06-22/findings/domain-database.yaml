  - id: F-dom-db-5
    severity: LOW
    file: packages/core/src/infrastructure/db/pgvector-store.ts
    line: 771-779
    plan_ref: ADR D1 — "the read is bounded by the existing memories_session_id_idx"
    domain_anchor: Index usage — ORDER BY created_at has no supporting composite index
    summary: >
      ORDER BY created_at, id has NO supporting index. The memories indexes are
      single-column btrees on user_id / session_id / agent_id (+ category, hnsw,
      partial eviction indexes); there is NO (session_id, created_at, id) composite
      and NO created_at index at all. For a SCOPED query (session_id filter set),
      Postgres uses memories_session_id_idx to select the scope subset, then performs
      an in-memory sort of that (usually small) subset — acceptable, not a
      full-table scan. The risk is the UNSCOPED case (filters undefined): WHERE
      degrades to `t_invalid IS NULL` only, forcing a seq-scan + sort of the whole
      live table. The façade always supplies scope filters (this.filters), so the
      reachable SDK/REST path is bounded; but VectorStore.listEpisodes is a public
      DIP method that accepts `filters: undefined`. The plan's D1 claim ("bounded by
      memories_session_id_idx") is true only when a scope filter is present.
    evidence: |
      schema.ts:229 index('memories_session_id_idx').on(table.sessionId)
      // no created_at index; ORDER BY created_at DESC, id DESC -> sort node
      // pgvector-store.ts:733 listEpisodes(filters: Filters | undefined, ...)
    recommended_action: >
      Acceptable for M2 (scoped reads dominate; volumes are per-session). If
      large-scope episode pages become a hot path, add a partial composite index
      `(session_id, created_at DESC, id DESC) WHERE t_invalid IS NULL` (and
      user/agent equivalents) so the ORDER BY is index-served and the cursor
      seek is an index range scan. Track as a documented follow-up, not a blocker.

  - id: F-dom-db-6
    severity: LOW
    file: packages/core/src/infrastructure/db/in-memory-store.ts
    line: 69-73, 320-324
    plan_ref: EC-5 — in-memory ordering parity with pgvector (created_at, id)
    domain_anchor: id tie-break ordering parity (uuid type vs JS string)
    summary: >
      pgvector compares the `id` component as type `uuid` (schema.ts:141
      id: uuid(...)) both in the row-value cursor comparison and in ORDER BY ... id;
      the in-memory impl compares `id` with JS lexicographic string `<`. For
      canonical lowercase UUIDs the two orderings agree byte-for-byte (hex chars
      sort identically to their byte values), so parity holds for the real id
      generator (defaultRandom / uuid v4 lowercase). The divergence would only
      surface for non-canonical id casing/format, which the production path never
      produces. Worth recording so a future test fixture that injects upper-case
      or non-UUID ids does not silently diverge between the two stores.
    evidence: |
      ```ts
      // in-memory: JS string comparison
      return aId < bId ? -1 : aId > bId ? 1 : 0;
      // pgvector: (created_at, id) <op> ($a,$b) where id column is type uuid
      ```
    recommended_action: >
      No code change. Note in the in-memory listEpisodes JSDoc that id-tie ordering
      assumes canonical lowercase UUIDs (matching pgvector uuid ordering); keep
      fixtures using lowercase UUID-shaped ids.

