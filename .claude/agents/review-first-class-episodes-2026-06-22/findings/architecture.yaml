  - id: F-arch-6
    severity: INFO
    file: packages/core/src/infrastructure/db/pgvector-store.ts
    line: 740
    plan_ref: T2.1 EC-1 (asOf vs soft-delete mutually exclusive) + DRY
    summary: >-
      EC-1 (bi-temporal vs soft-delete mutual exclusivity) is structurally
      guaranteed, not merely asserted by tests: listEpisodes reuses the SAME
      composeTemporalWhere helper as list/search, which returns EITHER the
      ADR-0011 asOf predicate OR `t_invalid IS NULL` — never a conjunction. SQL is
      fully parameterized ($n placeholders); cursor is a row-value comparison
      reusing the ORDER BY comparator. Strong DRY + SRP on the WHERE-builder.
    evidence: |
      pgvector-store.ts:741
      ```ts
      const temporal = composeTemporalWhere(options.asOf, 1);
      const filter = composeFilters(filters, temporal.nextParamIndex);
      ```
      composeTemporalWhere (pgvector-store.ts:167) is an if/else by construction:
      ```ts
      if (asOf === undefined) { return { sql: 't_invalid IS NULL', ... }; }
      return { sql: '(t_valid IS NULL OR t_valid <= $N) AND (t_invalid IS NULL OR t_invalid > $N+1)', ... };
      ```
    recommended_action: No action — exemplary reuse of the existing query helpers.
