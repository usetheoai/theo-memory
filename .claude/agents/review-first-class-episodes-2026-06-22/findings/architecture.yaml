  - id: F-arch-4
    severity: LOW
    file: packages/core/src/infrastructure/db/in-memory-store.ts
    line: 65
    plan_ref: T2.1 REFACTOR "extract cursor encode/decode helper (shared, pure)"
    summary: >-
      Mild DRY duplication of the `(created_at, id)` comparator within the
      in-memory store: a dedicated `compareCreatedAtId` helper exists AND an
      inline comparator is hand-written in the sort step, expressing the same
      ordering concept two ways.
    evidence: |
      in-memory-store.ts:65 helper:
      ```ts
      function compareCreatedAtId(aDate, aId, bDate, bId): number {
        const dt = aDate.getTime() - bDate.getTime();
        if (dt !== 0) return dt;
        return aId < bId ? -1 : aId > bId ? 1 : 0;
      }
      ```
      ...then the sort re-implements it inline (in-memory-store.ts ~318):
      ```ts
      rows.sort((a, b) => {
        const dt = (a.createdAt?.getTime() ?? 0) - (b.createdAt?.getTime() ?? 0);
        if (dt !== 0) return dt * dir;
        return (a.id < b.id ? -1 : a.id > b.id ? 1 : 0) * dir;
      });
      ```
      Both encode the same "(created_at then id)" comparator. The duplication is
      benign now but is a maintenance trap if the tie-break rule ever changes
      (two edit sites, easy to drift). Note: pgvector delegates to SQL ORDER BY,
      so the canonical comparator only lives in the in-memory adapter — keeping a
      single helper there matters more.
    recommended_action: >-
      Reuse `compareCreatedAtId` in the sort (apply `* dir`), so the comparator
      has one authoritative implementation in the adapter.
