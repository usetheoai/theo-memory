findings:
  - id: F-xval-1
    severity: MAJOR
    file: src/agent-tools/run-mcp-server.ts:114-119, src/agent-tools/run-server.ts:128-133
    plan_ref: ADR D3 Decision + T2.1 § Tasks Steps 5+6 ("Replace run-mcp-server.ts createLocalMemory call with createAgentToolsMemory()" + same for run-server.ts) + Sub-goal 2
    summary: ADR D3 Step 5 + Step 6 NOT IMPLEMENTED — run-mcp-server.ts and run-server.ts retain direct createLocalMemory(...) calls instead of delegating to createAgentToolsMemory()
    evidence: |
      Plan says (T2.1 § Tasks):
        Step 5. Replace `run-mcp-server.ts` createLocalMemory call with `createAgentToolsMemory()`.
        Step 6. Replace `run-server.ts` createLocalMemory call with `createAgentToolsMemory()`.
      Plan says (ADR D3 Decision):
        "MCP + REST handlers retrofit ... their factory paths to call `createAgentToolsMemory()`"
      Plan says (ADR D3 Consequences):
        "run-mcp-server.ts line count reduces by ~25 LoC; run-server.ts reduces by ~22 LoC."
      Actual code (b06429e):
        - run-mcp-server.ts:27 still imports createLocalMemory from '../local/index.js'
        - run-mcp-server.ts:114 calls `const memory = await createLocalMemory({ vectorStore: new PgvectorStore(pool, ...), embedder: new LocalTransformerEmbedder(), llm: new OpenAILLM(), embeddingDim: LOCAL_EMBEDDER_DIM })` — i.e., the full provider wiring that createAgentToolsMemory() now encapsulates is INLINED here
        - run-server.ts:33 still imports createLocalMemory; line 128 has the identical inlined provider wiring
        - run-mcp-server.ts diff: actual reduction ~10 LoC (only env-fail block replaced), NOT the predicted ~25 LoC
        - run-server.ts diff: actual reduction ~7 LoC (only env-fail block replaced), NOT the predicted ~22 LoC
      Implementation-validate report § 17 claims "MCP + REST retrofitted" but the SDK retrofit (factory call) was NOT done; only the env-validation boundary was retrofitted. The implement-validate report does NOT honestly disclose this partial implementation.
      Resulting consequence: the DRY-hardening goal of ADR D3 ("single source of truth ... LocalTransformerEmbedder(), OpenAILLM(), LOCAL_EMBEDDER_DIM constant duplicated across 3 sites") is only HALF achieved. Provider wiring + pool construction + runMigrations + LOCAL_EMBEDDER_DIM=384 constant are STILL duplicated across run-mcp-server.ts + run-server.ts + agent-tools-memory.ts (3 sites, identical shape).
      ALSO: createAgentToolsMemory() returns `readonly [Memory, () => Promise<void>]` (memory + dispose tuple) which is incompatible with run-server.ts's EC-33 readiness-gate Proxy pattern (line 149 uses `Awaited<ReturnType<typeof createLocalMemory>>` for the memoryShim type). The retrofit may have been intentionally skipped because the dispose pattern doesn't fit either runner's lifecycle, but no ADR documents this divergence.
    recommended_action: |
      Either (a) ship the retrofit per the plan: change run-mcp-server.ts + run-server.ts to call `const [memory, dispose] = await createAgentToolsMemory()` and integrate dispose into the SIGTERM/SIGINT shutdown handler; OR (b) add an ADR-D3-supplementary entry to the plan v1.3 documenting that Steps 5+6 were NOT implementable because (i) run-mcp-server.ts has additional pre-memory steps (port resolution, transport selection) that need to fail before any pg connection; (ii) run-server.ts's EC-33 readiness-gate Proxy needs a synchronous memory reference that the tuple shape doesn't deliver; (iii) the EC-4 "single source of truth" gain is partial-by-design (env-fail boundary collapsed; factory-path duplication retained for lifecycle reasons). Update CHANGELOG accordingly. Sub-goal 2 partial-closure status should be honestly disclosed in the implement-validate report § 60 (which currently claims it CLOSED unconditionally).

