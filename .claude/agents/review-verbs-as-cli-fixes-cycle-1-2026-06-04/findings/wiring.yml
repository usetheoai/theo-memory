    severity: MINOR
    file: src/agent-tools/agent-tools-memory.ts
    line: 87-114
    plan_ref: T2.1 / ADR D3 (DRY env-validation collapse + alias retention)
    summary: createAgentToolsMemory has 0 direct (non-alias) production callers; all 4 verb handlers consume via createCliMemory alias.
    evidence: |
      grep -rn "createAgentToolsMemory" src/  →  5 lines, all inside agent-tools-memory.ts itself
      grep -rn "createCliMemory" src/  →  4 verb handlers (run-{remember,recall,forget,reflect}.ts)
      JSDoc at line 14 + 112 invites future call-sites to "prefer createAgentToolsMemory"
      yet 0 currently do so.
    technical_impact: NONE at runtime. `createCliMemory = createAgentToolsMemory` is a re-export
      of the same function value; calling alias = calling function. The dual name is a
      forward-compat affordance, not a wiring defect.
    recommended_action: Optional. Either (a) accept as honest forward-compat
      affordance and document the dual-name policy in a §note in
      agent-tools-memory.ts (single sentence) OR (b) deprecate the alias on a
      sunset schedule once consumers migrate (NOT urgent for this fix-cycle).
    blocking: NO

  - id: F-wire-fix-2
    severity: INFO
    file: src/agent-tools/run-server.ts + src/agent-tools/run-mcp-server.ts
    line: run-server.ts:96-115 / run-mcp-server.ts:98-118
    plan_ref: T2.1 partial DRY scope
    summary: T2.1 collapses ONLY the env-validation boundary (assertEnvOrExit + env specs)
      into the shared helper. The createAgentToolsMemory factory body (Pool + runMigrations +
      createLocalMemory) is NOT shared — run-mcp-server.ts and run-server.ts duplicate the
      assembly logic with the same constants (LOCAL_EMBEDDER_DIM = 384, identical wire shape).
    evidence: |
      run-mcp-server.ts:108-118 and run-server.ts:102-130 each duplicate:
        new Pool({ connectionString: pgUri })
        runMigrations(pool, { embeddingDim: LOCAL_EMBEDDER_DIM })
        createLocalMemory({ vectorStore, embedder, llm, embeddingDim })
      This is the same shape as createAgentToolsMemory:91-101.
    technical_impact: pre-existing DRY violation; NOT a regression from this cycle. Plan
      ADR D3 scoped T2.1 to env-validation only (the symptoms F-arch-2 + F-wire-1 surfaced
      there). Future cycle could extend the factory to be the universal composition root
      and have run-mcp-server / run-server consume it, but that's out of scope here.
    recommended_action: NOT BLOCKING for this fix-cycle. Track as MAJOR for a future
      DRY hardening cycle if a 4th caller (e.g., REST + MCP + CLI + Worker) emerges and
      the duplication becomes load-bearing.
    blocking: NO

