      const LOCKED_VERBS = ["'remember <text>'", "'recall <query>'", "'forget <id>'", "'reflect'"];
      readFileSync(CLI_SRC_PATH, 'utf8') — raw substring match.
    technical_impact: brittle to refactor but currently correct. CLAUDE.md amendment policy
