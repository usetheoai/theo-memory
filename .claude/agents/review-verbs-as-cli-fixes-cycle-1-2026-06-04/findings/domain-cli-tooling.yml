  - id: F-dom-cli-6
    severity: MINOR
    file: src/agent-tools/cli.ts
    line: 96-114
    plan_ref: T2.2 / ADR D4 (exitOverride mapping)
    domain_anchor: commander v12 exitOverride contract + ADR D4 promised exit 2 on invalid
    summary: |
      The exitOverride only maps `commander.invalidArgument` + `commander.invalidOptionArgument`
      to exit 2. Other commander error codes (`commander.missingArgument`,
      `commander.missingMandatoryOptionValue`, `commander.unknownCommand`,
      `commander.unknownOption`) fall through to `process.exit(err.exitCode)` — which
      for missingArgument is commander's default `1`. The ADR D4 contract advertised
      "InvalidArgumentError → exit 2" but the broader CLI fail-fast contract
      (architecture.md § 8) demands ALL boundary input failures exit 2 for shell
      composability (`themory remember 'fact' && echo OK` should NOT proceed on
      missing --user). Today: `themory remember` (missing positional) exits 1.
      `themory unknownVerb` exits 1. Inconsistent with the documented "invalid →
      exit 2" UX contract.
    evidence: |
      ```ts
      program.exitOverride((err) => {
        if (
          err.code === 'commander.invalidArgument' ||
          err.code === 'commander.invalidOptionArgument'
        ) {
          process.exit(2);
        }
        process.exit(err.exitCode);   // commander.missingArgument → 1
      });
      ```
    recommended_action: |
      Extend the mapping to cover all "invalid input from boundary" codes:
      ```ts
      const INVALID_INPUT_CODES = new Set([
        'commander.invalidArgument',
        'commander.invalidOptionArgument',
        'commander.missingArgument',
        'commander.missingMandatoryOptionValue',
        'commander.unknownCommand',
        'commander.unknownOption',
        'commander.excessArguments',
      ]);
      program.exitOverride((err) => {
        if (INVALID_INPUT_CODES.has(err.code)) process.exit(2);
        process.exit(err.exitCode);  // help (0), version (0) preserved
      });
      ```
      Add 2 RED tests: `themory remember` (no positional) → exit 2;
      `themory unknownVerb` → exit 2.

