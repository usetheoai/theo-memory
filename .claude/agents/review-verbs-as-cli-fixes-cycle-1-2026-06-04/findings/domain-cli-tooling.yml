  - id: F-dom-cli-4
    severity: MAJOR
    file: src/__tests__/cli-locked-names.test.ts
    line: 44-63
    plan_ref: Sub-goal 6 / T5.3 (CLAUDE.md § Locked names sentinel)
    domain_anchor: CLAUDE.md § Locked names (4 verbs + 9 flags)
    summary: |
      The Locked-names sentinel is too weak. It greps cli.ts for substring presence of
      the verb-command literals + flag strings, but a future refactor could MOVE the
      verb-command literal out of a `.command(...)` call into a comment, an unrelated
      log message, or a dead-code path while removing the actual `.command()` declaration.
      Sentinel passes; CLI contract silently broken. The locked-name discipline requires
      that the literal appears INSIDE an active `.option('--user', ...)` or
      `.command('remember <text>', ...)` call site. Two false-positive paths:
      (1) `parseIntInRange('--top-k', 1, 100)` already contains the flag string at the
      factory-helper level, NOT at the option declaration — the sentinel cannot
      distinguish factory invocation from option declaration. (2) Comments / JSDoc could
      retain the strings post-refactor. Sentinel must use AST traversal OR at minimum
      require the literal to appear within N chars of a `.option(` or `.command(`
      identifier on the same line cluster.
    evidence: |
      ```ts
      // cli-locked-names.test.ts:46
      for (const verb of LOCKED_VERBS) {
        expect(src).toContain(verb);  // substring grep — too weak
      }
      // Counter-example: if cli.ts removes `.command('remember <text>')` but keeps
      // `// 'remember <text>' is the future locked verb` in a comment, sentinel passes.
      ```
    recommended_action: |
      Strengthen the sentinel with ast-grep OR ts-morph for AST-level verification:
      ```ts
      // Assert each verb appears in a CallExpression named `.command(...)` with the
      // verb literal as the first argument.
      import { parse } from '@typescript-eslint/parser';
      // ... walk for CallExpression matching `.command(<literal>)`.
      ```
      Cheap intermediate: assert each verb literal appears within 30 chars of `.command(`
      via regex `/\.command\(\s*['"](?:remember <text>|recall <query>|forget <id>|reflect)['"]/`.
      Similarly for flags: `/\.option\(\s*['"]--(?:user|session|agent|top-k|...)/`. This
      shrinks the false-positive surface to "literal still inside `.option(`/`.command(`
      call".

