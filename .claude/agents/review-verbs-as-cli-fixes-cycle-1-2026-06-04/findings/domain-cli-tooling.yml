      step 2 EXPLICITLY noted: "Note: ESM imports are hoisted; mutation BEFORE imports
      requires either (a) CommonJS-style require + reorganization (loses ESM benefits),
      OR (b) accept that the mutation is hoisted to the top of the module body". The
      commit message claims the .ts variant works via "ESM source-order evaluation".
      That IS technically correct for the static-import-leaf path, but the deviation
      from the plan's explicit .cjs decision lacks ADR coverage. The plan declared the
      decision EXPLICITLY ("intentional .cjs extension so Node loads it synchronously
      BEFORE the ESM cli.js"). Switching to .ts without an ADR record is implicit
      authorization that defeats the cycle-implement.md ADR discipline. The empirical
      test passes, so it works — but the discipline gap should be closed.
    evidence: |
      ```
      Plan T3.1b § Files to edit: src/agent-tools/cli-preload.cjs (NEW)
      Actual: src/agent-tools/cli-preload.ts (NEW)

      Plan T3.1b § Tasks step 1:
        "Create src/agent-tools/cli-preload.cjs (intentional .cjs extension
        so Node loads it synchronously BEFORE the ESM cli.js)"
      Commit message:
        "fallback succeeded: new src/agent-tools/cli-preload.ts side-effect
        module imported FIRST by cli.ts via ESM source-order evaluation"
      ```
    recommended_action: |
      Add a 1-paragraph supplementary note to the cycle's `/implement-validate` report
      naming the ESM-source-order vs CommonJS-sync deviation + the rationale (avoids the
      .cjs file extension that violates the `"type": "module"` package config + avoids
      shipping a separate copy script for non-.ts assets per architecture.md § 10.1).
      Mark cli-preload.ts as the canonical preload entry. Add an ESLint rule pinning
      `import './cli-preload.js'` as the FIRST static import in cli.ts (no other static
      imports before it) — prevents accidental reorder via auto-import sorting plugins.

  - id: F-dom-cli-8
    severity: MINOR
    file: package.json
    line: 13-16
    plan_ref: out-of-cycle (pre-existing parent-cycle defect surfaced via review)
    domain_anchor: Node bin entries require shebang per Unix conventions
    summary: |
      `package.json#bin.themory` and `package.json#bin.themory-mcp` both map to
      `./dist/agent-tools/cli.js` — but the compiled cli.js has NO shebang line
      (`#!/usr/bin/env node`). On Linux/macOS, npm symlinks bin entries to user PATH;
      without a shebang, the OS does not know to invoke node and falls back to shell,
      which errors on the ES module syntax. npm's Windows shim wraps with .cmd files
      explicitly invoking node, but Unix relies on the shebang. This is a PRE-EXISTING
      defect from the parent verbs-cli cycle (T2.1 introduced the bin entries), NOT
      introduced by this fix-cycle. Flagged here because it's a CLI-tooling domain
      defect this reviewer is responsible for. It blocks `npx @usetheo/memory` from
      working post-install on any Unix host where the user does NOT explicitly invoke
      `node $(npm bin)/themory`.
    evidence: |
      ```sh
      $ head -1 dist/agent-tools/cli.js
      // verbs-as-cli-fixes-cycle-1 T3.1b / F-dom-cli-1 absorption: side-effect
      # No shebang.

      $ head -1 src/agent-tools/cli.ts
      // verbs-as-cli-fixes-cycle-1 T3.1b / F-dom-cli-1 absorption: side-effect
      # No shebang.

      $ grep '"bin"' package.json
      "bin": {
        "themory": "./dist/agent-tools/cli.js",
        "themory-mcp": "./dist/agent-tools/cli.js"
      }
      ```
    recommended_action: |
      Add a `postbuild:add-shebang` script that prepends the shebang AFTER tsc emit:
      ```json
      "postbuild:add-shebang": "node -e \"const{readFileSync,writeFileSync,chmodSync}=require('node:fs');const p='dist/agent-tools/cli.js';const src=readFileSync(p,'utf8');if(!src.startsWith('#!'))writeFileSync(p,'#!/usr/bin/env node\\n'+src);chmodSync(p,0o755);\"",
      "build": "tsc -p tsconfig.build.json && npm run postbuild:copy-migrations && npm run postbuild:add-shebang"
      ```
      Verify via a smoke test: `npm pack && cd /tmp/scratch && npm install /path/to/tarball
      && ./node_modules/.bin/themory --help`. The post-install bin invocation should
      succeed without explicit `node` prefix.

  - id: F-dom-cli-9
    severity: MINOR
    file: src/agent-tools/cli-output.ts
    line: 41-56
    plan_ref: T1.2 / ADR D2 (CLI emits raw ReflectionResult; renderer edge cases)
    domain_anchor: JSON-vs-text output portability for shell pipelines
    summary: |
      Two minor renderer edge cases unhandled:
      (1) `recall` text format interpolates `m.text` raw; if a memory text contains a
          literal newline, the "one item per line" layout breaks (item 2 appears as
          continuation of item 1). Same defect for `m.id` though IDs are UUIDs by
          contract.
      (2) `remember` text with empty items produces `Wrote 0 memories: ` (trailing space).
          Cosmetic only.
      (3) `reflect` text format ignores `result.reason?` field — when reflect short-circuits
          (e.g., no source memories), the text output is `Reflected 0 → 0 insights` with
          no hint at WHY. The reason field is part of the contract per `ReflectionResult`
          (parent ADR D3 carried it forward). JSON output exposes it; text users debugging
          "why no insights" miss it.
      None of these are blockers, but the plan ADR D2 § Consequences claimed "text becomes
      `Reflected ${sourceIds.length} → ${derivedMemoriesCreated} insights`" with no reason-
      field discussion. Honest gap.
    evidence: |
      ```ts
      case 'recall': {
        const lines = payload.items.map(m => `  - [${m.score.toFixed(3)}] ${m.id}: ${m.text}`);
        // m.text with embedded \n → break visual layout.
        return `Found ${String(payload.items.length)} memories:\n${lines.join('\n')}`;
      }

      case 'reflect':
        return `Reflected ${String(payload.result.sourceIds.length)} → ${String(payload.result.derivedMemoriesCreated)} insights`;
        // result.reason? is discarded.
      ```
    recommended_action: |
      (1) For `recall` text, normalize embedded newlines in `m.text` to ` / ` (or
          truncate at first \n + " ..." marker) before interpolation. Document the
          contract: text format is for HUMAN reading; for machine consumption use --json.
      (2) For `reflect` text when `result.reason !== undefined`, append `(${result.reason})`
          to the line. Update cli-output.test.ts test 6 to cover the reason path.
      (3) Add a 2-line invariant comment to the renderer: "text format is best-effort
          human-readable; pipelines should use --json".

  - id: F-dom-cli-10
    severity: INFO
    file: src/agent-tools/cli.ts
    line: 53-66
    plan_ref: parent verbs-cli plan (EC-27 themory-mcp backward-compat alias)
    domain_anchor: regex-based bin detection
    summary: |
      The `ALIAS_PATTERN` regex `themory-mcp(?:\.(?:js|mjs|cjs|ts))?$` triggers on
      `argv[1]` ending in `themory-mcp` plus optional extension. This is correct for
      npm-installed bin invocation (where argv[1] is the symlink target path). But
      `applyAliasArgvShim` uses `argv[2] === 'mcp'` as the idempotency guard — which
      ALSO trips for the valid invocation `themory-mcp mcp --transport stdio` (user
      explicitly typed the verb). EC-29 noted this and DID skip the splice in that case.
      Good. But: what if the user invokes `themory-mcp --help`? The detection passes
      (argv[1] ends with themory-mcp); applyAliasArgvShim splices `mcp` at position 2
      → argv becomes `[node, themory-mcp, mcp, --help]`; commander dispatches to
      `mcp` subcommand and prints its help (not the program help). Likely fine, but
      worth noting that the DEPRECATED stderr warning fires on `themory-mcp --help`
      too — slightly odd UX. INFO-only because behavior is technically correct +
      documented as deprecated path.
    evidence: |
      ```ts
      const ALIAS_PATTERN = /themory-mcp(?:\.(?:js|mjs|cjs|ts))?$/;
      // Tests: themory-mcp (Unix bin), themory-mcp.cmd (Windows), node themory-mcp.js
      // All correct.

      if (detectMcpAlias(live[1])) {
        process.stderr.write('DEPRECATED: themory-mcp ...');
        const shimmed = applyAliasArgvShim(live);
        // `themory-mcp --help` → splices mcp at position 2 → mcp subcommand help.
      }
      ```
    recommended_action: |
      Document the help-bypass behavior in the EC-27 JSDoc block: "Invocation
      `themory-mcp --help` (legacy users discovering the alias) emits the deprecation
      warning then dispatches to `themory mcp --help` (mcp subcommand help, NOT program
      help)." No behavior change needed — just documentation.

summary_for_consolidation:
  total_findings: 10
  by_severity:
    BLOCKER: 0
    CRITICAL: 0
    MAJOR: 5
    MINOR: 4
    INFO: 1
  recommendation: |
    The fix-cycle closes the 11 declared MAJORs at varying depth:
      - Theme 1 (reflect parity): CLOSED at source. ADR D2 honored; 3-way contract
        parity restored; CliReflectResult dropped; ADR-0005 v1.1 supplementary amendment
        + EC-2 3-path contract tests shipped.
      - Theme 2 DRY (env-validation): CLOSED via assertEnvOrExit + 2 EnvSpec constants
        retrofitted across MCP + REST + CLI. Single source of truth honored.
      - Theme 2 DRY (parser factories): partially regressed — F-dom-cli-1 introduces a
        NEW silent-coercion defect that ships across all 5 collapsed sites because the
