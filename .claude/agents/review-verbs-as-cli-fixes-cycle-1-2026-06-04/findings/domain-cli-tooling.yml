findings:
  - id: F-dom-cli-1
    severity: MAJOR
    file: src/agent-tools/cli.ts
    line: 75-94
    plan_ref: T2.2 / ADR D4 (parseIntInRange + parseFloatInRange factories)
    domain_anchor: architecture.md § 8 (fail-fast at boundaries)
    summary: |
      parseIntInRange silently coerces decimal + trailing-garbage input via Number.parseInt.
      `--top-k 5.7` → 5 (accepted). `--top-k 5abc` → 5 (accepted). parseFloatInRange has the
      same defect: `--threshold 0.5abc` → 0.5 (accepted). Boundary validation should reject
      malformed numeric input; instead the factory silently truncates. The parent test 16
      (verbs-cli.test.ts) only covered integer-out-of-range, never decimals-for-int or
      trailing-garbage, so this defect was not caught by RED tests. This MAJOR was the
      central refactor of Theme 2 — collapsing 5 byte-similar validators into 2 factories —
      so the silent coercion now ships across `--top-k`, `--threshold`, `--diversify`,
      `--port` (mcp), `--port` (server). Fail-fast principle violated at the canonical
      CLI boundary.
    evidence: |
      ```ts
      const parseIntInRange = (label: string, min: number, max: number) =>
        (raw: string): number => {
          const n = Number.parseInt(raw, 10);
          if (!Number.isInteger(n) || n < min || n > max) {
            throw new InvalidArgumentError(...);
          }
          return n;
        };

      // node -e "console.log(Number.parseInt('5.7', 10))" → 5
      // node -e "console.log(Number.parseInt('5abc', 10))" → 5
      // Both pass Number.isInteger(5) → silent acceptance.
      ```
    recommended_action: |
      Replace `Number.parseInt(raw, 10)` with strict number coercion + integer assertion:
      ```ts
      const n = Number(raw);
      if (!Number.isInteger(n) || !Number.isFinite(n) || n < min || n > max) {
        throw new InvalidArgumentError(
          `Invalid ${label}: ${raw} (must be an integer in ${min}..${max}).`,
        );
      }
      ```
      `Number('5.7') === 5.7` (not integer) → throws. `Number('5abc') === NaN` → throws.
      Same fix for parseFloatInRange: `const n = Number(raw)` rejects trailing garbage
      (Number('0.5abc') === NaN), preserving the `Number.isFinite` guard.
      Add 4 RED tests to tests/integration/cli/verbs-cli-fixes.test.ts covering
      `--top-k 5.7`, `--top-k 5abc`, `--threshold 0.5abc`, `--threshold NaN`.

