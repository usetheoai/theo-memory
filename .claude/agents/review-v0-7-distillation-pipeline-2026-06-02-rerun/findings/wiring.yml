new_findings_from_rerun:
  - id: F-wire-rerun-1
    severity: MINOR
    file: tests/integration/distillation/  (NEW test missing)
    plan_ref: F-C1 closure / plan v1.2 ADR D2 amendment
    summary: |
      F-C1 mass-tombstone guard (LWW.maxRejectionRatio default 0.95) has contract test coverage (5 new it()s) but NO integration test covering the end-to-end wiring chain — recallConsolidationCandidates → policy.consolidate → persistConsolidations — under the abstain condition.
    evidence: |
      Contract tests at src/core/conflict-resolution/__tests__/last-write-wins.test.ts:62-122 prove the policy LOGIC abstains at N=21. But the WIRING claim ("the demo / production flow correctly NO-OPs on a 21-row scope, writes 0 consolidation_history rows, tombstones 0 memories") is not asserted. A 1-it test similar to skill-isolation.test.ts (seed 21 unrelated extracted rows, call reflect({LWW}), assert `SELECT COUNT(*) FROM consolidation_history WHERE policy_name='last-write-wins'` = 0 AND `SELECT COUNT(*) FROM memories WHERE user_id=$1 AND t_invalid IS NOT NULL` = 0) would close the gap.
    recommended_action: |
      Add `tests/integration/distillation/lww-mass-tombstone-abstain.test.ts` — 1 it() against `ankane/pgvector:v0.5.1`, gated by THEOMEM_PG_URI. Cheap (~30 LoC); mirrors skill-isolation.test.ts shape. Defer to next touch of distillation tests if not blocking.
    note: |
      This is NOT a regression introduced by fix-up — it's a wiring-depth gap in a NEW guard. Classifying MINOR because (a) the contract correctness is asserted, (b) the deeper recall+persist wiring is already exercised by the 6 other distillation integration tests at non-abstain ratios.

  - id: F-wire-rerun-2
    severity: INFO
    file: src/core/conflict-resolution/last-write-wins.ts
    plan_ref: plan v1.2 ADR D2 amendment
    summary: |
      No OTel observability of the F-C1 abstain decision. An LWW invocation that returns [] (abstain) is observationally indistinguishable from an empty-cluster no-op; consumers debugging "why didn't reflect consolidate anything?" cannot tell whether (a) no candidates existed, (b) all candidates clustered into 1 (singleton path), or (c) the guard fired (mass-tombstone protection).
    evidence: |
      `last-write-wins.ts:103-109` (abstain branch) returns `[]` silently. No counter increment, no structured-log line. Plan v1.2 added the guard logic but skipped the observability companion that would let consumers detect mass-tombstone-class invocations in their telemetry.
    recommended_action: |
      In the same v1.0 benchmark cycle that ships the F-wire-1/F-wire-2 OTel integration depth, add a `distillation.consolidation.mass_tombstone_abstain` counter increment on the abstain branch. Cheap; documents the guard's runtime behavior alongside its existence. INFO because the absence does not affect correctness; only debuggability.

  - id: F-wire-rerun-3
    severity: INFO
    file: tests/integration/distillation/the-goal-test.test.ts:104
    plan_ref: F-C2 fix (kind filter)
    summary: |
      Pre-existing integration tests (the-goal-test, reflect-with-policy, etc.) seed rows via raw `INSERT INTO memories (...)` WITHOUT specifying `kind`. They rely on the table default `kind = 'extracted'`. The new WHERE clause guard (`AND kind = 'extracted'`) preserves their behavior, but the implicit-default coupling is fragile — a future schema migration that changes the default would silently break these tests.
    evidence: |
      `tests/integration/distillation/the-goal-test.test.ts:104-117` seedPair INSERT does not list `kind` in column list. `src/local/schema.ts:84` declares `kind: varchar('kind', { length: 20 }).notNull().default('extracted')`. As long as the default holds, the tests continue exercising the LWW happy path. If a future v0.8+ migration removes the default OR changes it, the tests would emit NOT NULL errors at the INSERT or accidentally seed `kind=NULL/derived` rows that the new guard correctly excludes — silent test-quality regression.
    recommended_action: |
      Defensive: extend pre-existing distillation integration tests to explicitly pass `kind, 'extracted'` in the INSERT column list, matching skill-isolation.test.ts:58 pattern. Cosmetic but harden against future schema changes. INFO because not breaking today.

