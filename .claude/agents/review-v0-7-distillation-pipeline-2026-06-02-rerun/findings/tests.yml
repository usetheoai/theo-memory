findings:
  - id: F-tests-rerun-1
    severity: MINOR
    file: tests/integration/distillation/skill-isolation.test.ts
    line: 149
    plan_ref: F-C2 regression test #2
    summary: |
      Test name says "derived rows are NOT re-consolidated on subsequent reflect()"
      but the test body invokes reflect() EXACTLY ONCE — not "subsequent" (i.e., it
      does not exercise the 2nd-reflect path the name promises).
    evidence: |
      Lines 162-164: single `await memory.agent(TEST_AGENT).reflect(...)` call.
      Lines 167-171: assertion that derivedId.t_invalid IS NULL.

      To match the name, the test would need:
        - first reflect() that produces a derived row, OR
        - explicit 2nd reflect() asserting the existing derived row was not
          consolidated AGAIN.

      The actual behavior verified is "derived rows are NOT consolidated on
      THIS reflect()" — which is the same kind-filter property as test #1,
      just for a different kind value. The test verifies the right behavior,
      but the name overstates what was tested.
    recommended_action: |
      Either:
      (a) Rename to "derived rows (kind=derived) are filtered out of the
          consolidation cluster" (matches actual coverage), OR
      (b) Add a 2nd reflect() call after a synthetic insertion of `kind='derived'`
          that the first reflect() created, then assert the derived row was
          not re-touched.
    severity_rationale: |
      MINOR not MAJOR — the test does verify the kind='derived' guarantee
      (the load-bearing assertion). The name mismatch is documentation drift,
      not a coverage gap.

  - id: F-tests-rerun-2
    severity: MINOR
    file: tests/integration/distillation/skill-isolation.test.ts
    line: 173-174
    plan_ref: F-C2 regression test #2
    summary: |
      Two seeded rows (`extractedOlderId`, `extractedNewerId`) are deliberately
      discarded via `void extractedOlderId; void extractedNewerId;`.

      The test asserts ONLY that the derived row survives — it does NOT assert
      that the older extracted row was consolidated (soft-deleted) NOR that
      the newer extracted row was kept. The 2 extracted candidates are setup
      noise that pads the cluster size without behavioral verification.
    evidence: |
      Lines 152-153: seedRow for extractedOlderId + extractedNewerId at
                     offsets -5_000 + +5_000.
      Lines 162-164: single reflect() call.
      Lines 167-171: ONLY derivedId.t_invalid assertion.
      Lines 173-174: `void extractedOlderId; void extractedNewerId;` — silently
                     discard the IDs without checking their t_invalid state.

      Combined with F-tests-rerun-1, this is a weaker test than its name
      promises. Test #1 already proves the same kind-filter property for
      skill rows; test #2 is partially redundant.
    recommended_action: |
      Add 2 assertions after line 171:
        ```ts
        const { rows: extractedRows } = await pool.query<{ id: string; t_invalid: Date | null }>(
          `SELECT id, t_invalid FROM memories WHERE id = ANY($1::uuid[])`,
          [[extractedOlderId, extractedNewerId]],
        );
        const byId = new Map(extractedRows.map(r => [r.id, r.t_invalid]));
        expect(byId.get(extractedOlderId)).not.toBeNull(); // soft-deleted
        expect(byId.get(extractedNewerId)).toBeNull();      // kept
        ```
      This proves the derived row guard does NOT also break the extracted-row
      consolidation that is supposed to happen alongside it.
    severity_rationale: |
      MINOR. The test still verifies the load-bearing F-C2 property (skill +
      derived survive) — the gap is "could be more thorough" not "wrong".

  - id: F-tests-rerun-3
    severity: INFO
    file: src/core/conflict-resolution/__tests__/last-write-wins.test.ts
    line: 124
    plan_ref: EC-1 stability test under F-C1 guard
    summary: |
      EC-1 lex tie-break stability test (10-run loop with 3 identical-timestamp
      candidates) correctly verifies that the new `maxRejectionRatio` guard
      does NOT regress the determinism path. Ratio 2/3 ≈ 0.667 < 0.95 → guard
      does not fire. Strong positive confirmation.
    evidence: |
      Line 124-144: existing T1.2 / EC-1 test untouched by this commit but
      exercises the new code path (the guard check is reached before the
      return statement). The 10-iteration stability assertion remains green.

      This is the canonical regression-safety net for F-C1 against EC-1.
    recommended_action: none (positive confirmation)

  - id: F-tests-rerun-4
    severity: INFO
    file: tests/integration/schema-snapshot-parity.test.ts
    line: 67
    plan_ref: F-C3 sentinel
    summary: |
      Bidirectional bijection check (snapshot→schema AND schema→snapshot)
      correctly defends against both directions of drift. Drizzle table-name
      introspection via `Symbol.for('drizzle:Name')` is the canonical
      runtime tag — robust against export-name renames.
    evidence: |
      Line 54-65: `collectSchemaTables` uses Symbol-tagged introspection
                  instead of fragile name-matching on export keys.
      Line 67-73: forward bijection (every snapshot table mirrored in schema).
      Line 75-80: reverse bijection (every schema pgTable surfaced via migration).

      Edge cases verified by inspection:
        - Empty META_DIR: `readdirSync` returns []; filter empty; loop runs
          0 times; snapshotTables empty. Test 1 passes (0 missing); test 2
          fails loudly if any schema export exists (correct behavior — empty
          meta dir IS an architectural defect).
        - Malformed snapshot JSON: `JSON.parse` throws SyntaxError; test fails
          loudly (fail-fast, no silent swallow). Acceptable.
        - Missing `tables` key in a snapshot: guarded by `if (parsed.tables ===
          undefined) continue`.

      The error message embedded in `expect(..., 'message')` second arg is
      excellent — points the operator at the failure cause AND the documented
      `drizzle-kit push` failure mode.
    recommended_action: none (positive confirmation)

  - id: F-tests-rerun-5
    severity: INFO
    file: src/core/conflict-resolution/__tests__/last-write-wins.test.ts
    line: 62-122
    plan_ref: F-C1 guard contract tests
    summary: |
      5 new contract tests cover the F-C1 boundary cleanly:
