  - id: F-arch-rr-NEW-1
    severity: MINOR
    file: src/core/conflict-resolution/last-write-wins.ts:104-111
    plan_ref: F-C1 closure (post-closure observability gap)
    summary: "F-C1 mass-tombstone guard ABSTAINS silently — no observability signal when LWW abstains due to rejectionRatio > maxRejectionRatio. Asymmetric with sibling LJM which emits a `cluster_too_large` counter on its analogous abort path."
    evidence: |
      LWW abstain path (lines 106-111):
        if (rejectionRatio > this.#maxRejectionRatio) {
          return [];
        }
      No counter emission. Consumer running `reflect({ conflictResolution: LWW })` against a 100-row scope gets back `{ derivedMemoriesCreated: 0 }` with no signal that the policy abstained (vs successfully consolidated 0 rows because of legitimately empty cluster).
      Compare LJM (llm-judged-merge.ts:97-100):
        if (candidates.length > this.#clusterCap) {
          getCounter(CTR.CLUSTER_TOO_LARGE).add(1);
          return [];
        }
      LJM has 4 distinct counters (KEPT / REJECTED / ABSTAIN / CLUSTER_TOO_LARGE) so an operator can distinguish "LJM decided no consolidation needed" from "LJM aborted because cluster too large".
      Architectural impact: the existing /review F-M3 already flagged "LWW wiring path emits ZERO distillation.consolidation.* counters; only LJM fires them from its own consolidate()" — adding mass-tombstone abstain WITHOUT a counter widens the observability gap. An operator who tunes maxRejectionRatio cannot measure how often it triggers.
    recommended_action: |
      DEFER to the F-M3 follow-up cycle (already in the plan v1.2 deferred list as "OTel integration depth"). When that cycle adds the policy-agnostic counters at the wiring layer, also emit a `distillation.consolidation.lww_mass_tombstone_abstain` counter for the F-C1 abstain path. Document in plan v1.2 deferred MAJOR list (NOT a new BLOCKER — the guard is correct; observability is a follow-up).

  - id: F-arch-rr-NEW-2
