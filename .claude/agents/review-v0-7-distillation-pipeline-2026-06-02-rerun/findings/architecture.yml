    file: src/core/conflict-resolution/last-write-wins.ts:80
    plan_ref: F-C1 closure (DRY observation)
    summary: "`DEFAULT_MAX_REJECTION_RATIO = 0.95` is a magic number with no shared abstraction across policy siblings. Sibling LJM has `DEFAULT_CLUSTER_CAP = 20` — both are anti-mass-tombstone guards but expressed in different units."
    evidence: |
      LWW guards by RATIO (rejectionRatio > 0.95 → abstain)
      LJM guards by COUNT (candidates.length > 20 → abstain)
      The two-policy/two-guard-mechanism shape risks DRY violation if v0.7.2+ adds more policies: each new ConflictResolutionPolicy impl might invent its own anti-mass-tombstone heuristic. The DIP (`ConflictResolutionPolicy`) does not declare a shared interface for "abstain due to scope size".
      Inquebrável Rule 12 (DRY) → only enact extraction when rule-of-3 hits. With 2 policies and 2 different mechanisms, the abstraction is premature. Document the design space.
      Note: the per-policy guards are LEGITIMATELY different (LJM caps cluster size to bound LLM cost; LWW caps rejection ratio to bound damage from over-clustering). They are NOT duplicating the same concept. So this is a documentation observation, not a refactor demand.
    recommended_action: Add a JSDoc cross-reference comment in last-write-wins.ts mentioning the sibling LJM clusterCap mechanism (and vice versa) so future policy authors understand the design space. Optional. Defer to refactor cycle that also addresses F-M1/M2 file-size budget.

