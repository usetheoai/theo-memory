  # F-dom-db-2 / F-M10 — DEFERRAL HONESTY AUDIT — MAJOR (deferral rationale needs strengthening)
  # ---------------------------------------------------------------------------
  - id: F-dom-db-2-rerun
    severity: MAJOR
    status: DEFERRAL_PARTIALLY_SOUND
    defers: F-M10 (FK constraint naming drift)
    file: src/local/migrations/0007_distillation_columns.sql:34-37
    cross_file_evidence:
      - src/local/migrations/0000_crazy_mimic.sql:42 → `history_memory_id_memories_id_fk` (Drizzle convention)
      - src/local/migrations/0002_skill_columns.sql:5-6 → `memories_superseded_by_memories_id_fk` (Drizzle convention)
      - src/local/migrations/meta/0007_snapshot.json:661-672 → expects `consolidation_history_kept_memory_id_memories_id_fk`
    plan_ref: v1.2 § Version note — "F-M10/M11 FK naming + ON UPDATE NO ACTION (cosmetic; renaming requires new migration for deployed DBs)"
    domain_anchor: architecture.md § 10.2 + Drizzle ORM convention (FK constraint name = `<from-table>_<from-col>_<to-table>_<to-col>_fk`)
    summary: |
      0007 SQL ships PG-default `_fkey` suffix:

          ADD CONSTRAINT "consolidation_history_kept_memory_id_fkey"

      while ALL prior migrations (0000-0002) use the Drizzle convention
      `_<to-table>_<to-col>_fk`:

          ADD CONSTRAINT "history_memory_id_memories_id_fk"          (0000:42)
          ADD CONSTRAINT "memories_superseded_by_memories_id_fk"     (0002:6)

      AND the corresponding snapshot at 0007_snapshot.json:661 expects:

          "consolidation_history_kept_memory_id_memories_id_fk"

      So `drizzle-kit generate` from the (now-correct) schema.ts would emit a
      cleanup ALTER on any DB that ran the original 0007 SQL.

      DEFERRAL ASSESSMENT:

      The deferral DECISION is sound (cosmetic; FK behavior is identical at
      the catalog level — naming difference does not affect ON DELETE / FK
      semantics). The RATIONALE wording is partially sound but understates
      the engineering picture:

      (a) "cosmetic" — correct in terms of runtime behavior. ✓
      (b) "renaming requires new migration for deployed DBs" — TECHNICALLY
          CORRECT but understates the trivial fix path. Postgres natively
          supports `ALTER TABLE consolidation_history RENAME CONSTRAINT
          consolidation_history_kept_memory_id_fkey TO
          consolidation_history_kept_memory_id_memories_id_fk;` since 9.2.
          Cost: 1 new migration file (~10 SQL lines) + 1 line in package.json.
          NOT prohibitive — it's "one migration's worth of churn", which is
          the same cost as any other minor schema correction.

      The architecturally sound deferral rationale (per the brief) is:
      "Minimize migration churn until v0.8 benchmark cycle (Roadmap Item 10)
      bundles all schema corrections in a single cleanup migration alongside
      the benchmark-driven schema changes." This is honest because:
        - v0.8 is the next major cycle that will touch migrations anyway
          (benchmark CI introduces new fixtures + potentially new index types).
        - Coalescing all 4 deferred MAJOR items (F-M1, F-M2, F-M3/M4, F-M10/M11)
          into a single v0.8-prep cycle avoids 4 separate migration churns.
        - The Drizzle convention IS the future canonical form (snapshot proves
          it); a single rename in v0.8 brings the codebase back to bijection
          between schema.ts → SQL → snapshot.

      The "cosmetic; renaming requires new migration for deployed DBs" wording
      in plan v1.2 acknowledges (a) but elides (b)'s timeline justification.

      CONFIRMATION FROM PRIOR PRECEDENT: no `ALTER ... RENAME CONSTRAINT`
      statement exists anywhere in the migrations history (`grep -rn`
      returned zero hits), so the team has not yet established a pattern
      for this kind of fix. v0.8 is the natural place to introduce it.

      ARCHITECTURAL RISK OF KEEPING THE DRIFT:
        - LOW for runtime correctness (constraints behave identically).
        - LOW for the `drizzle-kit push` workflow (the constraint name is
          INTERNAL — neither user nor app code references it by name).
        - MEDIUM for ops audit clarity (a future operator running
          `pg_dump` or `\d+ consolidation_history` will see two different
          naming conventions in a single schema, raising questions).
        - MEDIUM for `drizzle-kit generate` emitting a cleanup ALTER on
          the FIRST regen post-fix — a future contributor may be confused
          by the "phantom" diff against a deployed DB.
    evidence: |
      ```sql
      -- 0007_distillation_columns.sql:34-37
      ALTER TABLE "consolidation_history"
        ADD CONSTRAINT "consolidation_history_kept_memory_id_fkey"
        FOREIGN KEY ("kept_memory_id") REFERENCES "memories"("id")
        ON DELETE SET NULL;

      -- vs. 0000_crazy_mimic.sql:42 (Drizzle convention)
      ALTER TABLE "history" ADD CONSTRAINT "history_memory_id_memories_id_fk"
        FOREIGN KEY ("memory_id") REFERENCES "public"."memories"("id")
        ON DELETE cascade ON UPDATE no action;
      ```

      ```json
      // meta/0007_snapshot.json:661-672 (the canonical expectation)
      "foreignKeys": {
        "consolidation_history_kept_memory_id_memories_id_fk": {
          "name": "consolidation_history_kept_memory_id_memories_id_fk",
          "tableFrom": "consolidation_history",
          "tableTo": "memories",
          "columnsFrom": ["kept_memory_id"],
          "columnsTo": ["id"],
          "onDelete": "set null",
          "onUpdate": "no action"
        }
      }
      ```
    recommended_action: |
      ACCEPT THE DEFERRAL with rationale strengthening: amend plan v1.2 § Version note
      to explicitly tie the deferral to v0.8 benchmark cycle (Roadmap Item 10),
      e.g.:

          "F-M10/M11 FK naming + ON UPDATE NO ACTION — runtime-cosmetic
          (constraints behave identically); coalesced with F-M1/M2/M3/M4
          into a single v0.8 prep migration to avoid 4 separate migration
          churns ahead of benchmark fixture introduction."

      The rename itself is mechanical (~10 SQL lines via `ALTER TABLE ...
      RENAME CONSTRAINT`). The deferral DECISION is sound; the WORDING
      understates the cost and elides the timing rationale.

      OPTIONAL hardening: add a sentinel test similar to schema-snapshot-parity
      that asserts every FK in any `*_snapshot.json` has a matching constraint
      name in its source migration SQL. This would prevent the same drift
      class in any future migration (sibling to the F-C3 sentinel).

