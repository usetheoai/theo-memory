  # F-dom-db-3 / F-M11 — DEFERRAL HONESTY AUDIT — MAJOR (same shape as F-M10)
  # ---------------------------------------------------------------------------
  - id: F-dom-db-3-rerun
    severity: MAJOR
    status: DEFERRAL_PARTIALLY_SOUND
    defers: F-M11 (ON UPDATE NO ACTION omitted from 0007 SQL)
    file: src/local/migrations/0007_distillation_columns.sql:34-37
    cross_file_evidence:
      - src/local/migrations/0000_crazy_mimic.sql:42 → "ON DELETE cascade ON UPDATE no action" (explicit)
      - src/local/migrations/0002_skill_columns.sql:6 → "ON DELETE set null ON UPDATE no action" (explicit)
      - src/local/migrations/meta/0007_snapshot.json:672 → "onUpdate": "no action"
    plan_ref: v1.2 § Version note — same line as F-M10
    domain_anchor: PG referential integrity defaults (PG defaults to NO ACTION when ON UPDATE not specified; the cost of omission is the runtime IS correct but the SQL surface no longer self-documents the policy)
    summary: |
      0007 SQL declares only `ON DELETE SET NULL` and OMITS `ON UPDATE NO ACTION`:

          ADD CONSTRAINT "..._fkey" FOREIGN KEY (...) REFERENCES ...
          ON DELETE SET NULL;

      while ALL prior migrations declare both explicitly:

          0000:42 → ON DELETE cascade ON UPDATE no action
          0002:6  → ON DELETE set null ON UPDATE no action

      AND the snapshot at 0007_snapshot.json:672 declares:

          "onUpdate": "no action"

      DEFERRAL ASSESSMENT:

      Runtime semantically: ZERO drift. PG treats unspecified `ON UPDATE`
      as `NO ACTION` by default (per PG docs § REFERENCES). The deployed
      DB and the snapshot expectation agree at the runtime catalog level
      (`pg_constraint.confupdtype = 'a'` in both cases — 'a' = NO ACTION).

      SQL-surface convention: drift. The migration no longer self-documents
      its policy, and is INCONSISTENT with the project's per-migration
      convention of always declaring both.

      Same deferral rationale as F-M10 applies. The wording
      "cosmetic; renaming requires new migration" understates that:
        (a) F-M11 does NOT need a "rename" — it needs only an additive
            convention-restore (the constraint already has the implicit
            policy; making it explicit is a cosmetic ALTER, NOT a
            rebuild). Cost: same `ALTER TABLE ... DROP CONSTRAINT +
            ADD CONSTRAINT` cycle as F-M10, OR just consistent SQL in
            the v0.8 prep migration alongside F-M10.
        (b) The "deployed DBs" concern is also weaker for F-M11 since the
            runtime behavior IS what the snapshot expects — the deployed
            DBs are NOT drifted at the catalog level, only the source
            SQL file is non-self-documenting.

      The deferral DECISION is sound. The WORDING is acceptable but does
      not distinguish F-M11 from F-M10 cleanly — they have different
      runtime impacts (F-M10 = name-only drift; F-M11 = source-SQL
      documentation drift but catalog-equivalent).
    evidence: |
      ```sql
      -- 0007:34-37 — ON UPDATE clause MISSING
      ALTER TABLE "consolidation_history"
        ADD CONSTRAINT "..._fkey" FOREIGN KEY ("kept_memory_id")
        REFERENCES "memories"("id") ON DELETE SET NULL;
      --                          NOTE: no "ON UPDATE NO ACTION" trailer

      -- 0000:42 — explicit convention
      ALTER TABLE "history" ADD CONSTRAINT "history_memory_id_memories_id_fk"
        FOREIGN KEY ("memory_id") REFERENCES "public"."memories"("id")
        ON DELETE cascade ON UPDATE no action;

      -- 0002:6 — explicit convention
      ALTER TABLE "memories" ADD CONSTRAINT "memories_superseded_by_memories_id_fk"
        FOREIGN KEY ("superseded_by") REFERENCES "public"."memories"("id")
        ON DELETE set null ON UPDATE no action;
      ```
    recommended_action: |
      ACCEPT THE DEFERRAL with the same rationale strengthening as F-M10
      (coalesce into v0.8 prep migration). Additionally, the plan v1.2
      wording should distinguish F-M11 from F-M10:

          "F-M10 FK name drift (`_fkey` vs `_..._fk`) — pure naming;
          F-M11 omitted explicit `ON UPDATE NO ACTION` — runtime IS
          NO ACTION (PG default) but source SQL no longer self-documents.
          Both coalesced into v0.8 prep migration."

      The omitted ON UPDATE clause is a smaller honesty risk than F-M10
      because the runtime catalog IS correct; only the SQL file's
      self-documentation is incomplete.

