  - id: F-dom-db-1-rerun
    severity: INFO
    status: VERIFIED_CLOSED
    closes: F-C3 (previously CRITICAL across 4 reviewers — db-migrations, pgvector-schema, architecture, wiring)
    closing_commit: 9d16db4
    file: src/local/schema.ts:226-254
    plan_ref: v1.2 § Version note (a) + T0.1 + ADR D3
    domain_anchor: architecture.md § 10.2 (drizzle-kit push vs runMigrations conflict)
    summary: |
      `consolidationHistory` pgTable export was added to `src/local/schema.ts`
      mirroring the migration + snapshot shape. Column-by-column verification:

      - id           : uuid('id').primaryKey().defaultRandom()
        SQL          : "id" uuid PRIMARY KEY DEFAULT gen_random_uuid() NOT NULL
        Snapshot     : uuid, primaryKey, default gen_random_uuid()
        → MATCH

      - keptMemoryId : uuid('kept_memory_id').references(() => memories.id, { onDelete: 'set null' })
        SQL          : "kept_memory_id" uuid + ALTER ADD CONSTRAINT ... ON DELETE SET NULL
        Snapshot     : uuid, nullable, FK → memories.id, onDelete: "set null"
        → MATCH (nullability + onDelete preserved)

      - rejectedMemoryIds   : jsonb('rejected_memory_ids').notNull().default(sql`'[]'::jsonb`)
      - originalEpisodeIds  : jsonb('original_episode_ids').notNull().default(sql`'[]'::jsonb`)
        SQL          : jsonb DEFAULT '[]'::jsonb NOT NULL
        Snapshot     : jsonb, notNull, default '[]'::jsonb
        → MATCH

      - reason       : text('reason').notNull()
      - policyName   : text('policy_name').notNull()
        SQL          : text NOT NULL
        Snapshot     : text, notNull
        → MATCH

      - createdAt    : timestamp('created_at', { withTimezone: true }).defaultNow().notNull()
        SQL          : timestamp with time zone DEFAULT NOW() NOT NULL
        Snapshot     : "timestamp with time zone", notNull, default now()
        → MATCH

      - indexes      : idx_consolidation_history_kept (kept_memory_id),
                       idx_consolidation_history_created (created_at DESC)
        → MATCH (both names + columns preserved)

      `drizzle-kit push` against a v0.7-migrated DB no longer computes a
      destructive `DROP TABLE consolidation_history` diff. The column shape,
      FK targets, JSONB defaults, indexes, and ON DELETE SET NULL semantics
      are all preserved.

      The sentinel `tests/integration/schema-snapshot-parity.test.ts` (81 LoC,
      pure file-inspection, no pgvector container needed) enumerates every
      table named in any `meta/*_snapshot.json` via JSON parsing AND every
      pgTable export in `src/local/schema.ts` via Drizzle's runtime tag
      `Symbol.for('drizzle:Name')`, then asserts **bijection both directions**.
      Re-ran locally via `npm run test:integration -- tests/integration/schema-snapshot-parity.test.ts`:
      → 2/2 PASS in 245ms. The sentinel will catch this exact class of drift
      for any future migration (CRITICAL preventative value).
    evidence: |
      ```ts
      // src/local/schema.ts:239-254
      export const consolidationHistory = pgTable(
        'consolidation_history',
        {
          id: uuid('id').primaryKey().defaultRandom(),
          keptMemoryId: uuid('kept_memory_id').references(() => memories.id, { onDelete: 'set null' }),
          rejectedMemoryIds: jsonb('rejected_memory_ids').$type<string[]>().notNull().default(sql`'[]'::jsonb`),
          reason: text('reason').notNull(),
          policyName: text('policy_name').notNull(),
          originalEpisodeIds: jsonb('original_episode_ids').$type<string[]>().notNull().default(sql`'[]'::jsonb`),
