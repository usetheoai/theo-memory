      Lines 99-107: rejectionRatio = rejected.length / candidates.length; ABSTAIN if > maxRejectionRatio.
      Math: 20 candidates → ratio 0.95 (consolidate), 21 candidates → ratio ~0.952 (abstain), 50 candidates
      with default → 0.98 abstain. Empirical line behaves as documented.
      Tests verified: __tests__/last-write-wins.test.ts adds 5 new tests at lines 61-117 (count 5 confirmed).
