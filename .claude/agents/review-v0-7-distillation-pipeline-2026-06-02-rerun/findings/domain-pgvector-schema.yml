sql_guard_audit:
  finding_id: F-C2 (kind filter) + F-M7 (t_valid forward-compat)
  fix_commit: ffa92d1
  file: src/local/pgvector-store.ts:555-577

  guard_text: |
    where = [
      "kind = 'extracted'",
      "t_invalid IS NULL",
      "(t_valid IS NULL OR t_valid <= NOW())"
    ]

  bi_temporal_safety_per_adr_0006:
    verdict: SOUND
    reasoning: |
      ADR-0006 mandates local memory writes always set tValid = now() (defaultNow() in schema.ts:79).
      Thus, for any committed row on local: tValid IS NOT NULL AND tValid <= NOW() trivially holds.
      The OR-branch `t_valid IS NULL` is defensive for rows where the default somehow doesn't fire
      (raw SQL insert in tests, future migration path). The `t_valid <= NOW()` half is the actual
      forward-compat hook: when v0.5 cloud lights up asOf-style insertion of future-valid rows
      (per ADR-0006 § Decision), those rows MUST stay out of consolidation until tValid arrives.
      This guard documents that contract today, at zero cost on local v0.1 (no future-valid rows exist).

  v0_4b_eviction_compatibility:
    verdict: COMPATIBLE
    reasoning: |
      v0.4b eviction (pg-evictor.ts, capacity-based-trigger.ts, time-based-trigger.ts,
      pg-nearest-neighbor-provider.ts, scope-candidate.ts) uniformly uses `t_invalid IS NULL`
      to filter active rows. F-C2's guard adopts the same convention — both consolidation and
      eviction agree on "active means not-yet-soft-deleted". A row consolidated via
      reflect({ conflictResolution }) AND then targeted by eviction's capacity trigger gets
      `t_invalid = NOW()` set EXACTLY ONCE (the `RETURNING id` in pg-evictor's UPDATE filters
      out already-invalidated rows). No double-count regression.
    cross_check_paths:
      - src/local/eviction/pg-evictor.ts:40-42 — UPDATE memories SET t_invalid=NOW() WHERE id=ANY($1) AND t_invalid IS NULL
      - src/local/eviction/capacity-based-trigger.ts:104 — load WHERE t_invalid IS NULL
      - src/local/pgvector-store.ts:571 (post-fix) — recallConsolidationCandidates WHERE t_invalid IS NULL
    eviction_then_reflect_ordering:
      scenario: row X gets evicted (t_invalid=NOW()), then operator calls reflect()
      outcome: X is excluded from recallConsolidationCandidates (t_invalid IS NOT NULL); consolidation runs only over active rows. CORRECT.
    reflect_then_eviction_ordering:
      scenario: row X gets consolidated (t_invalid=NOW() via persistConsolidations), then capacity trigger fires
      outcome: X is excluded from capacity-based-trigger.ts:104 load (t_invalid IS NOT NULL); eviction targets only active rows. CORRECT.

  kind_filter_audit:
    verdict: SOUND
    reasoning: |
      The schema.ts:84 column declares kind as varchar(20) NOT NULL default 'extracted', with values
      'extracted' | 'derived' | 'skill' per migration 0002+ chain. The F-C2 fix's `kind = 'extracted'`
      string equality matches Postgres ANSI semantics (case-sensitive). No collation gotcha.
      The CHECK constraint at schema.ts:144 ('memories_kind_derived_from_check') enforces that
      'extracted' rows have derivedFrom IS NULL — so the filter strictly carves out the v0.1 raw
      episode space, leaving derived semantic facts (v0.4a output) AND v0.6 skills isolated.
      The episodic→semantic boundary is preserved as plan T2.1 intent declared.

