closure_verification:
  finding_id: F-C3 (originally F-dom-pgvector-1 + F-arch-1 + F-wire-4 + F-dom-db-1)
  finding_title: consolidation_history table NOT declared in src/local/schema.ts
  status: CLOSED
  fix_commit: 9d16db4
  fix_commit_title: "fix(v0-7-distill): F-C3 — declare consolidation_history in schema.ts + parity sentinel"
  files_modified:
    - src/local/schema.ts (+30 lines)
    - tests/integration/schema-snapshot-parity.test.ts (+81 lines, NEW)

  shape_parity_audit:
    audit_source_a: meta/0007_snapshot.json:577-680 (Drizzle journal canonical)
    audit_source_b: src/local/schema.ts:239-254 (post-9d16db4)
    audit_method: column-by-column verification of name + type + null + default + FK + indexes

    columns:
      id:
        snapshot: { type: uuid, primaryKey: true, notNull: true, default: gen_random_uuid() }
        schema_ts: "uuid('id').primaryKey().defaultRandom()"
        verdict: MATCH
        note: defaultRandom() resolves to gen_random_uuid() in pg-core; canonical Drizzle idiom.

      kept_memory_id:
        snapshot: { type: uuid, primaryKey: false, notNull: false, FK_onDelete: "set null", FK_onUpdate: "no action" }
        schema_ts: "uuid('kept_memory_id').references(() => memories.id, { onDelete: 'set null' })"
        verdict: MATCH
        ec_3_gdpr_survival: VERIFIED — nullable + ON DELETE SET NULL preserves audit row when memories.id hard-deleted via Memory.forget(id, { hard: true })
        onUpdate_note: Drizzle's `references()` defaults `onUpdate` to 'no action' implicitly when omitted; matches snapshot. F-M11 from initial /review (re ON UPDATE NO ACTION in 0007 SQL) is a SQL migration concern, not a schema.ts concern.

      rejected_memory_ids:
        snapshot: { type: jsonb, notNull: true, default: "'[]'::jsonb" }
        schema_ts: "jsonb('rejected_memory_ids').$type<string[]>().notNull().default(sql`'[]'::jsonb`)"
        verdict: MATCH
        type_safety_note: $type<string[]>() narrows the TS surface; runtime cast via JSONB.

      reason:
        snapshot: { type: text, notNull: true }
        schema_ts: "text('reason').notNull()"
        verdict: MATCH

      policy_name:
        snapshot: { type: text, notNull: true }
        schema_ts: "text('policy_name').notNull()"
        verdict: MATCH

      original_episode_ids:
        snapshot: { type: jsonb, notNull: true, default: "'[]'::jsonb" }
        schema_ts: "jsonb('original_episode_ids').$type<string[]>().notNull().default(sql`'[]'::jsonb`)"
        verdict: MATCH

      created_at:
        snapshot: { type: "timestamp with time zone", notNull: true, default: "NOW()" }
        schema_ts: "timestamp('created_at', { withTimezone: true }).defaultNow().notNull()"
        verdict: MATCH

    indexes:
      idx_consolidation_history_kept:
        snapshot: { method: btree, columns: [kept_memory_id], asc: true, NULLS: last }
        schema_ts: "index('idx_consolidation_history_kept').on(table.keptMemoryId)"
        verdict: MATCH
        note: Drizzle default ordering is asc + NULLS LAST; no explicit declaration needed in schema.ts.

      idx_consolidation_history_created:
        snapshot: { method: btree, columns: [created_at], asc: false, NULLS: last }
        schema_ts: "index('idx_consolidation_history_created').on(sql`${table.createdAt} DESC`)"
        verdict: MATCH
        desc_note: SQL template required for DESC because Drizzle's `.on(table.col)` API defaults to asc. Pattern is consistent with the history table's `history_timestamp_idx` at schema.ts:222.

    bijection_test_audit:
      test_file: tests/integration/schema-snapshot-parity.test.ts
      test_method: Introspects via Drizzle's runtime tag Symbol.for('drizzle:Name')
      coverage:
        forward: snapshot ⊆ schema (every table in meta/*_snapshot.json is declared in schema.ts)
        reverse: schema ⊆ snapshot (every pgTable export appears in at least one snapshot)
      verdict: COMPREHENSIVE
      reasoning: |
        Both directions asserted. The Symbol.for('drizzle:Name') runtime tag is
        the canonical introspection mechanism used by drizzle-kit itself for
        diff computation. Reading every *_snapshot.json file iteratively (not
        just 0007) catches future drift across all historical migrations.
        The test runs WITHOUT a pgvector container — pure file inspection —
        so it executes in CI even when THEOMEM_PG_URI is absent.
      strength_signals:
        - Glob pattern endsWith('_snapshot.json') excludes _journal.json and any meta artifacts
        - Strip "public." prefix from snapshot keys correctly maps schema-qualified to bare table name
        - Test names are BDD-shaped ("every table in any *_snapshot.json is declared...")
        - Failure messages name the offending tables AND explain the failure mode (DROP TABLE diff)
      gap_observations:
        - Test asserts table-level parity ONLY, not column-level. A future drift where a column is renamed in the snapshot but not in schema.ts (or vice versa) would slip past this sentinel. Note: this is a soft observation — column-level bijection would require Drizzle's `getTableConfig()` introspection AND parsing the snapshot's columns map. The trade-off is acceptable for v0.7 because (a) the failure mode in F-C3 was table-MISSING, not column-renamed; (b) drizzle-kit generate would catch column-rename drift on the next migration generation.

