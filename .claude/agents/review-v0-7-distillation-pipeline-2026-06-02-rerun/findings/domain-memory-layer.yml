architectural_honesty_assessment:
  plan_v1_2_dismissal_of_cosine_clustering:
    rationale: |
      Plan v1.2 dismisses T2.1's Mem0 cosine-clustering precedent at the recall layer
      and pivots to the per-policy decision-layer guard. The dismissal arguments are:
        (a) backporting cosine clustering rewrites the entire v0.7 wiring contract
        (b) per-policy guard is the minimal surface that mitigates risk
        (c) preserves the existing 9/9 task delivery

      Honesty verdict: ACCEPTABLE per Inquebrável Rule 3, with caveats.

      (a) is technically TRUE — cosine clustering at recall would change the SQL shape
          (currently a flat WHERE, would become a self-join or sub-query with vector
          distance) and the candidate-bag semantics (currently scope-bag, would become
          per-cluster bag). Significant blast radius.
      (b) is TRUE for the egregious case (100-row scope → 99 deleted) but is INCOMPLETE
          for the semantically-correct case: a consumer with 30 ACTUAL semantic duplicates
          AT N=30 (ratio 29/30 = 0.967) gets ABSTAINED inappropriately. The 0.95 threshold
          is an empirical floor that protects against unrelated scopes BUT also misfires
          on legitimate large-cluster consolidations. Future cosine clustering would solve
          BOTH; the guard solves only the first.
      (c) is TRUE for shipping velocity. Acceptable trade-off for fix-up cycle.

      Verdict: the dismissal is HONEST about (a), partially honest about (b), and explicit
      about the trade-off in (c). The "what this does NOT solve" framing in plan v1.2 §
      ADR D2 AMENDMENT could be expanded to spell out the "legitimate-large-cluster"
      false-negative case for downstream consumers. Worth a JSDoc amendment on
      maxRejectionRatio (currently the JSDoc mentions opt-out but not the false-negative).
    verdict: HONEST_WITH_INCOMPLETE_FRAMING

  add_only_invariant:
    verdict: PRESERVED
    evidence: |
      No public update() introduced. Soft-delete via t_invalid is canonical per ADR-0006.
      consolidation_history is pure audit (write-once). LWW pure function — zero I/O,
      zero state mutation.

  letta_sleeptime_rejection:
    verdict: PRESERVED
    evidence: |
      Zero new files under src/core/reflection/ or any background worker scaffolding.
      Diff inspection: `git diff 1ab70c2..HEAD --name-only` returns 11 files, none of
      which is a worker, scheduler, or sleep-time agent. ADR D1 honored.

  derived_from_non_empty:
    verdict: PRESERVED
    evidence: |
      No changes to insertDerivedMemory. JSONB derived_from constraint at the insert
      path remains intact. T4.3 + ADR D7 provenance fail-fast unbroken.

  three_scope_preservation_under_filter:
    verdict: PRESERVED
    evidence: |
      pgvector-store.ts:575-587 — user_id, session_id, agent_id filter conditions
      unchanged. New filter clauses (kind, t_invalid, t_valid) are appended via the
      shared `where` array. Three-tier scope semantics intact.

  ec_1_lex_tie_break_under_guard:
    verdict: PRESERVED
    evidence: |
      Traced: 3 candidates → rejectionRatio 0.667 → not > 0.95 → policy proceeds →
      lex DESC sort returns 'ccc' as kept, ['bbb', 'aaa'] as rejected. 10-run determinism
      test unbroken (last-write-wins.test.ts:124-144).

