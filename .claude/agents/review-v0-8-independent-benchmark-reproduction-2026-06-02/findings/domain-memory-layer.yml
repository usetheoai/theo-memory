# Summary: TheMemoryBenchmarkAdapter is architecturally clean — uses ONLY the
# public verbs `memory.user(id).remember/recall`, never bypasses MemoryStore,
# never pretends ADD-only is mutable, never re-implements the Mem0-shape
# pipeline (which is honored end-to-end by createLocalMemory). DIP boundary is
# respected — production code in src/benchmarks/ never imports from src/local/
# or src/cloud/. The modelId → SearchResult.modelUsed flow is correct across
# all 4 adapters (themory + mem0 + zep + letta). EC-5 scopedUserId composition
# is consistent with the locked three-tier convention. TWO findings — both
# MINOR — surface paper-name violations in JSDoc prose (the rule allows vendor
# class identifiers, but bans paper/marketing names in JSDoc/comments) and a
# soundness gap in coerceMetadata for an explicit `undefined` metadata value.

