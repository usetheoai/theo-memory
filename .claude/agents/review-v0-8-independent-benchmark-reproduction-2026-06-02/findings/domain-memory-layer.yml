#   Plan EC-5 absorption explicitly notes this choice as "preserves multi-speaker
#   boundary per fixture (LongMemEval, LoCoMo each have ≥ 2 speakers per
#   conversation)". The alternative (Session tier) would lose long-lived
#   persistence across benchmark queries — User tier is correct.
