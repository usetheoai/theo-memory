findings:

  - id: F-xval-1
    severity: MAJOR
    file: src/benchmarks/fixtures/longmemeval-loader.ts
    plan_ref: T2.1 § Deep Dives "throw new InvalidFixtureFormat(...)" + TDD RED "test('longmemeval-loader throws on unexpected type')"
    summary: |
      Plan T2.1 explicitly declared a fail-fast pattern via `throw new InvalidFixtureFormat`
      for unexpected answer field types. Implementation chose `return JSON.stringify(raw)` as
      a forgiving fallback, with the test rewritten to "returns JSON string fallback for
      unexpected shapes (honest, not silent)".

      This is a documented design shift (fail-fast → forgiving-with-fallback) that is NOT
      surfaced as an explicit Drift-T2.1-2 marker. Only Drift-T2.1-1 (.mjs vs .ts) is
      documented; the loader semantic-divergence is sub-declared.

      Risk: per architecture.md § 8 + global CLAUDE.md § Error Handling, "validate at
      boundaries; fail-fast" is the canonical pattern. The forgiving-fallback choice is
      DEFENDABLE (the LongMemEval HF dataset has known mixed-type answer fields per blueprint
      Q6 finding; aborting the whole fixture load on one bad row would be costly) but the
      shift from the plan's explicit "throw" intent deserved its own Drift-T2.1-2 marker.
    evidence: |
      Plan v1.2 line ~519 (Deep Dives sketch):
        "throw new InvalidFixtureFormat(`LongMemEval answer field has unexpected type: ${typeof raw}`);"
      Plan v1.2 line ~528 (TDD RED):
        "RED: test('longmemeval-loader throws on unexpected type')"
      Implementation longmemeval-loader.ts:43:
        "return JSON.stringify(raw);"  // honest, not silent
      Test loader.test.ts:36-37:
        "it('returns JSON string fallback for unexpected shapes (honest, not silent)', () => {"
        "  expect(normalizeLongMemEvalAnswer({ unexpected: true })).toBe('{\"unexpected\":true}');"
    recommended_action: |
      Add Drift-T2.1-2 marker to v0.8.md Drift trail AND CHANGELOG.md AND the loader file
      JSDoc, explaining: "Plan declared throw-on-unexpected; implementation chose
      JSON.stringify fallback because (a) the LongMemEval HF dataset has documented
      mixed-type fields per blueprint Q6, (b) aborting an N-record load on one bad row is
      too expensive, (c) JSON.stringify preserves the original data for downstream audit
      rather than throwing it away. The 'honest, not silent' label is correct (the fallback
      is recorded, not suppressed)."

      No code change required — the implementation choice is defensible. The fix is
      documentation alignment.

  - id: F-xval-2
    severity: MAJOR
    file: docs/benchmarks/v0.8.md + tests/e2e/benchmarks/matrix-publication.test.ts
    plan_ref: |
      Plan Goal (line 11): "docs/benchmarks/v0.8.md existing with all 12 (4 adapter × 3
      benchmark) matrix cells populated AND tests/e2e/benchmarks/matrix-publication.test.ts
      PASSING against the live published artifact."
      Plan T8.1 acceptance #2: "Per-cell columns: BLEU + F1 + LLM-judge accuracy + P95
      latency + cost/session"
      Plan T8.2 TDD RED #2: "test('every cell has BLEU + F1 + judge + P95 + cost')"
    summary: |
      The Goal contract's literal "12 cells populated" + "every cell has 5 sub-metrics" was
      rewritten by the implementation to "every cell is Smoke OR Deferred+DriftRef" — a more
      HONEST contract per Inquebrável Rule 3 but a documented contract DIFFERENCE from the
      plan. Drift-T8.x-1 captures the choice. Plan v1.2 was NOT amended.

      Cross-validation accepts this as Plan-Driven-Correction drift in the same family as
      Drift-T5.1-1 (modelUsed contract addition). The honesty_judgment section above
      analyzes this in depth. The implementation's choice is defensible:
        - Real numbers don't exist for 9 of 12 cells (vendor SDKs not wired per Drift-T6.x-1)
        - Smoke numbers for the 3 TheMemory cells would be benchmark theater (publishing them
          as "headline accuracy = X%" without disclosure would mislead)
        - The /dogfood gate is INDEPENDENTLY held closed; the v0.8 publication does NOT
          claim production-ready
        - The CLAUDE.md row 10 status flip from `Planned` → `Shipped 2026-06-02` is documented
          as a POST-MERGE action contingent on /review verdict + plan archival

      Risk: a third party reading the Goal contract literally MIGHT interpret v0.8 as
      "all 12 cells filled with real numbers" and be surprised by the deferral. The plan
      ITSELF anticipated this (ADR D2 says "v0.8 milestone may ship with LongMemEval-only
      if budget tight ... accept honest residual scope") so the design space contemplated
      partial coverage. But the Goal one-line summary did not foreshadow it.
    evidence: |
      docs/benchmarks/v0.8.md matrix table line 26-29 shows 3 'Smoke ✅' + 9 'Deferred —
      Drift-T6.x-1' cells.
      docs/benchmarks/v0.8.md § Headline numbers (line 61): "None published."
      docs/benchmarks/v0.8.md § Drift trail (lines 74-95): 6 explicit drift markers traceable
      to plan v1.2 task IDs.
      docs/benchmarks/v0.8.md § Honesty discipline (lines 97-108): cites Inquebrável Rule 3 +
      /dogfood gate disclaimer.
      tests/e2e/benchmarks/matrix-publication.test.ts:94-107: assertion contract is
      "every cell is Smoke OR Deferred+DriftRef" — NOT "every cell has 5 sub-metric columns".
      Plan v1.2 T8.2 TDD RED #2 (line ~830): "test('every cell has BLEU + F1 + judge + P95
      + cost')" — the original test contract that was rewritten.
    recommended_action: |
      Two options:

      Option 1 (FAVORED — accept the drift): Surface this as Drift-T8.x-2 (currently only
      Drift-T8.x-1 covers "Deferred + DriftRef markers vs fake numbers"). Add a Drift-T8.x-2
      marker explicitly stating: "Plan T8.2 TDD RED #2 declared 5-sub-metric-per-cell
      contract; implementation chose structural-honesty-marker contract via Drift-T8.x-1
      decision. Plan Goal 'populated' is interpreted as 'structurally populated with audit
      trail', honoring ADR D2 'accept honest residual scope'."

      Option 2 (STRICTER): Bump plan to v1.3, amending the Goal contract one-line summary
      to explicitly say "12 cells populated WITH SMOKE OR DEFERRED+DRIFTREF MARKERS,
      headline numbers gated on BENCH_RUN=full CI run". This makes the contract literal +
      removes any read-the-Goal-literally surprise.

      Option 1 is the cycle's documented pattern (drift surfaced via DriftRef markers,
      plan stays at v1.2 as the frozen contract). Choose Option 1 unless the reviewer
      prefers the contract literalism of Option 2.

