findings:
  - id: F-wire-1
    severity: MINOR
    file: src/benchmarks/metrics/exact-match.ts
    line: 15
    plan_ref: T1.1 — metric primitives EM
    summary: |
      `calculateExactMatch` is exported from `src/benchmarks/metrics/index.ts`
      and tested but has ZERO production callers. The runner uses BLEU + F1
      only; the public barrel re-exports calculateExactMatch alongside them.
      This is a pillar (a) failure — the symbol "exists" as an orphan in the
      metrics surface.
    evidence: |
      grep "calculateExactMatch" src/ benchmarks/ tests/:
        - src/benchmarks/metrics/index.ts:7 — barrel re-export
        - src/benchmarks/metrics/exact-match.ts:15 — declaration
        - src/benchmarks/metrics/__tests__/exact-match.test.ts (4 unit tests)
        ZERO non-test, non-barrel callers.

      Plan T1.1 lists BLEU + F1 + EM as the three primitives; runner consumes
      BLEU + F1 + judge label only (see benchmark-runner.ts:161-162). EM was
      built per plan scope but not wired into the runner pipeline.
    recommended_action: |
      EITHER (a) wire EM into PerQueryRecord (line up with BLEU + F1 in
      result-aggregator) so it appears in v0.8.md matrix entries —
      cheap (+~10 LoC in benchmark-runner + result-aggregator + PerQueryRecord
      shape); OR (b) demote calculateExactMatch from the public barrel and
      mark as private-future-use with a `// TODO(v0.8.x): wire into runner when
      EM becomes a matrix axis` comment + remove the barrel export. The
      symbol passes its own contract tests; classification is "orphan export
      from public barrel" per cycle-review.md hard gate § 3 "Dead exports".
      Not a BLOCKER because matrix publication is HONEST (BLEU/F1/Judge/P95/Cost
      explicitly enumerated in v0.8.md cell text) — EM was not promised to
      be observable in the smoke cells.
    blocker_decision: NOT_BLOCKER # plan-derived (BLEU+F1 sufficient for matrix)

  - id: F-wire-2
    severity: INFO
    file: tests/e2e/benchmarks/{longmemeval,locomo,dmr}-themory.test.ts
    line: n/a (architectural observation)
    plan_ref: T5.1/T7.1/T7.2 + Global DoD § Runtime-metric proof
    summary: |
      The 3 smoke e2e tests import the `main()` function from the
      `benchmarks/scripts/run-*.ts` callers and assert RunReport shape
      (questionCount, perQuery length, final flag, judgeLabel + latency +
      cost fields). They do NOT assert OTel span emission count or names
      directly — that coverage lives ONLY at `src/benchmarks/runner/__tests__/runner.test.ts`
      against a hand-built adapter stub.
    evidence: |
      grep -n "spans\|InMemorySpanExporter\|getFinishedSpans"
        tests/e2e/benchmarks/*.test.ts returned 0 hits.
      grep -n "spans" src/benchmarks/runner/__tests__/runner.test.ts:
        line 231 const spans = exporter.getFinishedSpans();
        line 232 expect(spans.length).toBeGreaterThanOrEqual(3);
    recommended_action: |
      Acceptable for v0.8 ship. The runner-level unit test exercises the same
      `withSpan()` instrumentation that the e2e path traverses (the e2e
      tests call main() which constructs a BasicTracerProvider + SimpleSpanProcessor
      + InMemorySpanExporter and feeds the BenchmarkRunner). Adding a span
      assertion to the e2e suite would be defense-in-depth but is not
      load-bearing — the metric is emitted by the same code path. If the
      e2e suite ever bypasses BenchmarkRunner (e.g., a direct adapter call),
      promote this finding to MAJOR.
    blocker_decision: NOT_BLOCKER # documented observation; runner-level OTel assertion is the load-bearing pillar-c

