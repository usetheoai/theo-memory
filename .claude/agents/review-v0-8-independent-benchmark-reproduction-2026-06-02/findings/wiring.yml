summary: |
  17 of 17 new symbols pass the wiring triad with discipline. Pillar (a):
  16 PASS + 1 orphan-export (calculateExactMatch — MINOR F-wire-1).
  Pillar (b): 17 of 17 covered by either unit + integration + e2e
  combinations. Pillar (c): all 3 runtime metrics observed and asserted
  (OTel spans via InMemorySpanExporter; pricing_table_miss; process.exitCode=1
  on all-judges-fail abort).

  The 3 vendor adapters (Mem0/Zep/Letta) are NOT BLOCKER orphans — they ship
  with VendorClient DIPs (ADR D6) per Drift-T6.x-1 deferred wiring, the
  deferral is documented in (a) adapter JSDoc, (b) docs/benchmarks/v0.8.md
  matrix cells, (c) CHANGELOG roadmap entry, (d) matrix-publication.test.ts
  invariant that every cell is "Smoke" OR "Deferred+DriftRef". This is the
  honest residual scope per Inquebrável Rule 3, not dead code.

  DIP boundary respected: src/core/ never imports from src/benchmarks/ (and
  vice-versa for runtime types — only Protocol types flow up). The composition
  root (createLocalMemory + StubEmbedder + InMemoryVectorStore) lives in
  benchmarks/scripts/ as the canonical orchestration locus per ADR D1.

  No OTel `setGlobalTracerProvider` calls anywhere — local BasicTracerProvider
  per run, exactly per ADR D8 / EC-13 protection against cross-test contamination.

  VERDICT: READY_TO_MERGE. F-wire-1 is a MINOR housekeeping item (orphan
  EM export) that can be closed in a follow-up commit OR by wiring EM into
  the runner as a 3rd primitive axis. F-wire-2 is INFO (e2e tests could
  cross-check spans, but runner-level assertion covers the contract).
