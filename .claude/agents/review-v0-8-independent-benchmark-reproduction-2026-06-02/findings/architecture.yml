  - id: F-arch-5
    severity: MINOR
    file: src/benchmarks/runner/benchmark-runner.ts
    line: 120
    plan_ref: T4.1 + EC-2 (all-judges-fail policy)
    summary: |
      Domain class mutates the global `process.exitCode` from inside the
      orchestration loop. This couples the benchmark runner to the Node
      process host: any non-CLI consumer (test, library mode, future
      hosted runner) inherits an exit-code side effect from a domain
      method.
    evidence: |
      ```ts
      // src/benchmarks/runner/benchmark-runner.ts:118-121
      aborted = true;
      abortReason = `all-judges-fail policy: ...`;
      process.exitCode = 1;
      break;
      ```

      The runner already returns the `RunReport` with `aborted: true`
      + `abortReason` set. Callers can derive exit code from that. The
      runner does not need to know it is running inside a CLI host.
    recommended_action: |
      Remove `process.exitCode = 1` from line 120. Move the exit-code
      decision into the CLI entry-points (the `isMain` blocks at the
      bottom of run-longmemeval.ts / run-locomo.ts / run-dmr.ts) which
      can inspect `report.aborted` and call `process.exit(1)` themselves.
      Honors SRP: the runner orchestrates; the script wrapper translates
      the result into a host signal.
    accept_with_caveat_ok: true

  - id: F-arch-6
    severity: MINOR
    file: src/benchmarks/runner/benchmark-runner.ts
    line: 35, 191-219
    plan_ref: T4.1 + EC-9 (incremental persistence)
    summary: |
      The runner imports `writeFileSync` from 'node:fs' directly and
      hardcodes JSON-file persistence. EC-9 absorption describes the
      incremental-write contract, but the persistence sink is not
      abstracted, so any future "stream results to a remote endpoint",
      "tee to multiple destinations", or "test persistence inline" use
      case has to mock `node:fs`.
    evidence: |
      ```ts
      // src/benchmarks/runner/benchmark-runner.ts:35
      import { writeFileSync } from 'node:fs';
      // ...
      // line 198
      writeFileSync(this.config.resultsPath, JSON.stringify(payload, null, 2), 'utf8');
      ```

      No `ResultsSink` / `PersistencePort` injection point; the runner
      knows about filesystem layout.
    recommended_action: |
      Optional refactor: introduce a `ResultsSink` interface with one
      method `persist(payload: unknown, final: boolean): void`. Default
      implementation writes JSON to the configured path; tests can inject
      an in-memory sink. Not urgent (single consumer today, real-tree
      writeFileSync is correct for v0.8 scope), but worth flagging as a
      seam for future evolution.
    accept_with_caveat_ok: true

  - id: F-arch-7
    severity: MINOR
    file: src/benchmarks/runner/benchmark-runner.ts
    line: 222-226
    plan_ref: architecture.md § 9 Public API surface
    summary: |
      The runner module re-exports CostTracker, PricingTableMiss,
      aggregate, PerQueryRecord, RunAggregate as a "caller convenience".
      Architecture.md § 6 says "Module barrels: index.ts only when
      there's a public surface to expose; avoid deep re-export chains."
      benchmark-runner.ts is a class file, not a barrel, but it acts
      as one — and these symbols are already importable directly from
      their canonical source (cost-tracker.ts, result-aggregator.ts).
    evidence: |
      ```ts
      // src/benchmarks/runner/benchmark-runner.ts:222-226
      // Re-export for caller convenience
      export { CostTracker } from './cost-tracker.js';
      export { PricingTableMiss } from './pricing-table-miss.js';
      export { aggregate } from './result-aggregator.js';
      export type { PerQueryRecord, RunAggregate } from './result-aggregator.js';
      ```
    recommended_action: |
      Either remove the re-exports (callers import from canonical
      modules), OR create an explicit `src/benchmarks/runner/index.ts`
      barrel and move the re-exports there. The current pattern blurs
      the class-file/barrel distinction.
    accept_with_caveat_ok: true

  - id: F-arch-8
    severity: MINOR
    file: src/benchmarks/llm-judge/single-judge.ts
    line: 36-51
    plan_ref: T1.2 SingleJudge shape
    summary: |
      `extractRawString` opaquely probes the LLM result for `text`,
      `content`, `raw` shapes, falling back to JSON.stringify. The
      LLM DIP signature `generateResponse(...): Promise<unknown>` is
      sufficiently open that this is unavoidable, but the helper grows
      whenever a new LLM provider emerges with a different shape. It
      would be cleaner if the LLM DIP returned a discriminated union
      or a canonical envelope so single-judge does not have to guess.
    evidence: |
      ```ts
      // src/benchmarks/llm-judge/single-judge.ts:36-51
      function extractRawString(result: unknown): string {
        if (typeof result === 'string') return result;
        if (result !== null && typeof result === 'object') {
          const obj = result as Record<string, unknown>;
          if (typeof obj['text'] === 'string') return obj['text'];
          if (typeof obj['content'] === 'string') return obj['content'];
          if (typeof obj['raw'] === 'string') return obj['raw'];
          ...
        }
      }
      ```
    recommended_action: |
      Not urgent; the LLM DIP's `generateResponse(...): Promise<unknown>`
      is intentionally open per existing precedent. Consider a follow-up
      to canonicalize the JSON-mode response shape in the LLM DIP, then
      simplify this helper. Document as a known seam in the JSDoc.
    accept_with_caveat_ok: true

