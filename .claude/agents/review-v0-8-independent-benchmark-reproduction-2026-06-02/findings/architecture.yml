  - id: F-arch-INFO-2
    severity: INFO
    file: src/benchmarks/zep/adapter.ts, src/benchmarks/letta/adapter.ts, src/benchmarks/mem0/adapter.ts
    line: throughout
    plan_ref: T6.1 + T6.2 + T6.3 + Drift-T6.x-1
    summary: |
      The three vendor adapters apply VendorClient DIP pattern uniformly:
      each declares a `{Vendor}VendorClient` interface that the adapter
      consumes via constructor DI, deferring real SDK wiring to a
      follow-up cycle. This honors OCP (new vendors land via new files,
      not new switch/case branches) and isolates SDK CVE surface per
      Drift-T6.x-1 plan rationale.

      The three adapter implementations are themselves nearly identical
      in shape (DRY rule-of-three border — see F-arch-2 trio of runner
      scripts for analogous concern), but the duck-typed VendorClient
      shape diverges intentionally (sessionId vs agentId vs userId
      conventions per vendor), so a shared base class would be a
      premature abstraction. Composition via interface is correct.
    evidence: |
      Compare src/benchmarks/{mem0,zep,letta}/adapter.ts — each class
      ~85 LoC, structurally homologous but with `client.add(sessionId|
      agentId|userId, text)` differing per vendor.
    recommended_action: None — clean. The Drift-T6.x-1 deferral is
      honest (documented in v0.8.md publication matrix).

