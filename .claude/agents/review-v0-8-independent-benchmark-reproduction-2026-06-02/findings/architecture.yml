findings:
  - id: F-arch-1
    severity: MAJOR
    file: src/benchmarks/themory/adapter.ts
    line: 35-37
    plan_ref: Drift-T3.1-3 (deferred) + Drift-T4.1-1 (deferred)
    summary: |
      Tokenizer interface OWNED by the TheMemory vendor adapter file,
      yet consumed by 5 unrelated modules — rule-of-three threshold
      not just crossed but exceeded by 2x. Architectural coupling smell:
      sibling vendor adapters (mem0/, zep/, letta/) and the runner subdir
      (cost-tracker, tiktoken-tokenizer) all reach into src/benchmarks/themory/
      to import a contract that has nothing to do with TheMemory.
    evidence: |
      grep -rn "from '../themory/adapter" src/benchmarks/ produces 5 hits:
        src/benchmarks/mem0/adapter.ts:24
        src/benchmarks/letta/adapter.ts:20
        src/benchmarks/zep/adapter.ts:20
        src/benchmarks/runner/cost-tracker.ts:33
        src/benchmarks/runner/tiktoken-tokenizer.ts:18

      ```ts
      // src/benchmarks/themory/adapter.ts:35
      export interface Tokenizer {
        count(text: string): number;
      }
      ```

      Plan Drift-T4.1-1 wrote "Cost-tracker is the 2nd consumer; promotion
      to src/core/dip/ waits for a 3rd consumer (rule-of-three)." We are
      now at 5 consumers and the contract still ships from the TheMemory
      adapter's source file. mem0/zep/letta importing Tokenizer FROM the
      direct competitor's adapter file is structurally absurd and would
      surface as a vendor-isolation defect the moment one adapter's
      dependencies (e.g., TheMemory's Memory import) needs to evolve.
    recommended_action: |
      Promote Tokenizer to src/core/dip/tokenizer.ts (11th DIP).
      Move the interface declaration unchanged; update the 5 import sites
      to point at the new location. This is a single-commit MOVE-only
      refactor (no behavior change). Surface the promotion in
      src/core/index.ts barrel. tests/__tests__/no-tokenizer-cross-vendor.test.ts
      could regression-guard the future locus.
    accept_with_caveat_ok: false
    reason_for_severity: |
      This is a real ISP violation that surfaces today: mem0/letta/zep adapters
      structurally depend on themory/. The "rule-of-three" excuse in the
      plan's Drift-T4.1-1 is no longer accurate (5 ≠ 3). Not BLOCKER because
      the type works at compile time and there is no runtime defect; but it
      is a MAJOR architectural debt that should be closed before the next
      cycle widens consumers.

  - id: F-arch-2
    severity: MAJOR
    file: benchmarks/scripts/run-longmemeval.ts, benchmarks/scripts/run-locomo.ts, benchmarks/scripts/run-dmr.ts
    line: throughout (all 3 files)
    plan_ref: T5.1 + T7.1 + T7.2 + Inquebrável Rule 12 (DRY rule-of-three)
    summary: |
      3 nearly-identical runner scripts duplicate OTel setup, StubAnswerLlm
      class definition, buildSmokeJudgePanel(), main() scaffolding, and CLI
      entry-point pattern. The trio (LongMemEval / LoCoMo / DMR) is the
      canonical rule-of-three threshold; the third copy SHOULD have
      triggered extraction.
    evidence: |
      wc -l on the three scripts: 176 + 163 + 151 = 490 LoC; 9 identical
      import or symbol references per file (BasicTracerProvider,
      InMemorySpanExporter, StubAnswerLlm, buildSmokeJudgePanel, etc).

      Examples of structural duplication:
      - All three define their own private `StubAnswerLlm implements LLM`
        with identical generateResponse + generateChat semantics.
      - All three define their own `buildSmokeJudgePanel()` returning a
        canned "CORRECT" verdict.
      - All three set up BasicTracerProvider + InMemorySpanExporter +
        SimpleSpanProcessor identically.
      - All three follow the same `main() + isMain` CLI scaffold.
      - Cost-tracker, TiktokenTokenizer, BenchmarkRunner instantiation
        is byte-identical except for the fixture loader call.

      This violates Inquebrável Rule 12 (DRY rule-of-three) — three
      instances of the same knowledge means time to extract.
    recommended_action: |
      Extract a `benchmarks/scripts/_runner-scaffold.ts` helper that
      exposes `buildSmokeJudgePanel()`, `buildStubAnswerLlm()`, and
      `buildRunner({fixturePath, resultsPath, modelId, corpusBuilder,
      benchmarkName})`. Each per-benchmark script becomes 30-40 LoC of
      benchmark-specific corpus-building + a single helper call. Saves
      ~250 LoC of duplication and reduces the surface for the
      "add a 4th benchmark" story to a single function call.
    accept_with_caveat_ok: true
    accept_with_caveat_reason: |
      The duplication is contained inside benchmarks/scripts/ (not src/),
      and the smoke runner story is shipping. Reasonable to absorb in a
      follow-up DRY cycle. But should NOT ship more benchmarks (a 4th
      runner) without first extracting.

  - id: F-arch-3
    severity: MAJOR
    file: tests/integration/benchmarks/themory-adapter-pg.test.ts
    line: 48
    plan_ref: T3.1 integration coverage
    summary: |
      Integration test's reset() function uses `WHERE agent_id LIKE $1`
      to clean state, but the adapter writes to `user_id` (the adapter
      uses memory.user(scopedUserId).remember(), which maps to user_id
      per architecture.md § 1 Three-tier scope). The DELETE matches
      zero rows. Silent failure — the reset does nothing but the test
      passes because only one `it()` block exists.
    evidence: |
      ```ts
      // tests/integration/benchmarks/themory-adapter-pg.test.ts:48
      async function reset(): Promise<void> {
        await pool.query(`DELETE FROM memories WHERE agent_id LIKE $1`,
                         [`${TEST_CONVERSATION}::%`]);
      }
      ```

      Yet src/benchmarks/themory/adapter.ts:96:
      ```ts
      await this.memory.user(userId).remember(item.text, {...});
      ```
      `memory.user(userId)` maps to filters.user_id (architecture.md § 1
      table; src/local/pgvector-store.ts:265 INSERT statement).

      Run grep confirms:
      grep "agent_id\|user_id" src/local/pgvector-store.ts:265
        INSERT INTO memories (..., user_id, session_id, agent_id)
    recommended_action: |
      Change line 48 to `WHERE user_id LIKE $1`. Add a second `it()` block
      (e.g., "isolates state across consecutive runs") that would actually
      fail if reset() were a no-op. This is the kind of silent test-hygiene
      defect the testing.md rule warns about ("Tests must be independent
      between tests; reset between tests is mandatory").
    accept_with_caveat_ok: false
    reason_for_severity: |
      Real test-isolation defect. Not BLOCKER because there is only one
      it() today, but the moment a second test lands the state leaks
      become a real flake.

