summary_line: >
  DIP boundary is clean and exemplary (port in domain/dip, impl in infrastructure/db,
  domain never value-imports the addon, lazy dynamic import gated behind execute()).
  The Strategy/opt-in seam (SkillExecutor port + gated factory wiring) is applied correctly.
  Main architectural defects are an OCP seam shipped WITHOUT backing impl or test
  (tool-call-cap / maxToolCalls), an ISP dead member surfaced all the way to REST+MCP
  schemas, and a couple of minor hygiene items.
findings:
  - id: F-arch-1
    severity: MEDIUM
    file: packages/core/src/infrastructure/db/sandboxed-skill-executor.ts
    line: 86
    plan_ref: T1.3 Deep Dives DEC-7 + Guard mapping #7 (per-execute tool-call cap)
    summary: >
      The `tool-call-cap` guard / `maxToolCalls` option seam is declared across the
      port, the errors union, and both transport schemas but has ZERO implementation
      and ZERO test — the plan's DEC-7 required a `#deny`-based private cap helper with
      a DIRECT unit test "to avoid a dead branch". The executor has neither.
    evidence: |
      `SandboxedSkillExecutor.execute()` never reads `opts.maxToolCalls`, never counts
      host-callback invocations, and never throws `'tool-call-cap'`:
        grep tool-call-cap|maxToolCalls packages/core/src/infrastructure → 0 hits
        grep maxToolCalls in executor → 0 hits (only maxOutputBytes consumed, line 133/180)
      Yet the seam is fully surfaced:
        domain/errors.ts: ToolInvocationDeniedReason includes 'tool-call-cap'
        domain/dip/skill-executor.ts:41  `readonly maxToolCalls?: number`
        api .../handlers/skills.ts:218    `maxToolCalls: z.number()....optional()`
        mcp .../execute-skill-schema.ts:31 `maxToolCalls: z.number()....optional()`
      No `#deny`/cap helper exists; the only `#deny` is the generic denial triad (line 96).
      Plan DEC-7 (T1.3): "tool-call-cap ... covered by a DIRECT unit test of the private
      cap helper to avoid a dead branch." No such helper, no such test.
    recommended_action: >
      Either (a) honor DEC-7 by adding the private cap helper + its direct unit test so
      the literal + option are reachable, OR (b) per YAGNI, REMOVE `maxToolCalls` from
      SkillExecutionOptions and both zod schemas and drop `'tool-call-cap'` from the
      reason union (keep a one-line ADR note that the host-bridge cap lands with the Q3
      host-callback follow-up). Do not ship a declared-but-unreachable OCP seam silently.
  - id: F-arch-2
    severity: MEDIUM
    file: packages/core/src/domain/dip/skill-executor.ts
    line: 41
    plan_ref: T1.1 Deep Dives (SkillExecutionOptions) + ISP (architecture.md / Inquebrável ISP)
    summary: >
      `SkillExecutionOptions.maxToolCalls` is an ISP dead member — declared on the public
      port, accepted + validated by the REST handler (T2.3) and the MCP schema (T2.4),
      cast into the executor, but consumed by no implementation. A consumer who passes it
      gets silent no-op behavior, which violates the honesty discipline at the public
      surface (the option claims a capability the only impl does not provide).
    evidence: |
      Port: packages/core/src/domain/dip/skill-executor.ts:41
        `/** Maximum host-callback invocations allowed per execute() call. */
         readonly maxToolCalls?: number;`
      REST: packages/api/src/server/handlers/skills.ts:218 validates it (positive int)
      MCP:  packages/mcp/src/tools/execute-skill-schema.ts:31 validates it
      Executor: never references it (see F-arch-1 evidence).
      A public option that no impl honors is the ISP "consumer forced to depend on a
      member nobody implements" smell, plus an Inquebrável Rule 3 honesty gap (the API
      advertises a bound it does not enforce).
    recommended_action: >
      Tie to F-arch-1: if the cap is implemented, document the default + enforce it; if
      deferred per YAGNI, remove the member from the port + both schemas until the Q3
      host-bridge cycle reintroduces it WITH an impl. Keep the public surface honest.
