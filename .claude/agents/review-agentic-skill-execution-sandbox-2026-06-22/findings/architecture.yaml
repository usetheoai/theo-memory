      Actual: execute-skill-schema.ts:13 `export const TOOL_NAME = 'execute_skill' as const;`
      No EXECUTE_SKILL_NAME added to constants.ts.
    recommended_action: >
      Acceptable as-is IF the codebase's other skill tools already keep TOOL_NAME in their
