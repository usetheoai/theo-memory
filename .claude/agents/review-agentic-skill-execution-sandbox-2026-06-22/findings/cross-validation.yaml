findings:
  - id: F-xval-1
    severity: LOW
    file: packages/core/src/infrastructure/db/sandboxed-skill-executor.ts
    plan_ref: >-
      T1.3 DEC-7 ("tool-call-cap ... covered by a DIRECT unit test of the private cap helper to
      avoid dead branch") + T3.1 TDD (test_goal_tool_call_cap_denied)
    summary: >-
      DOCUMENTED DIVERGENCE — DEC-7 said tool-call-cap would get a DIRECT unit test of a private cap
      helper; the impl instead left tool-call-cap as a RESERVED union literal with NO #cap helper,
      NO enforcement branch, and NO behavioral cap test. The GOAL test substitutes
      non-cloneable-result for the plan's tool_call_cap case. The union JSDoc + plan DEC-7 honestly
      call it "reserved / structurally unreachable in v1 (no host bridge)".
    evidence: |
      errors.ts:409-411 JSDoc: "Nine literals are wired by the v1 SandboxedSkillExecutor; 'tool-call-cap'
        is a RESERVED seam for the future host-callback bridge — not yet reachable in v1".
      grep tool-call-cap: only the union member + errors.test.ts reason-union construction (the literal
        IS constructed in a test, so it is NOT a dead union member) + maxToolCalls option plumbed
        through schemas (never enforced). No #cap helper exists.
      GOAL test malicious set: node-binding, fs, timeout, output-cap, non-cloneable-result (no tool-call-cap).
    assessment: >-
      Honest, disclosed divergence — NOT a hidden gap. Rationale (Q3 host-bridge deferred → tool-call-cap
      structurally unreachable in v1 → a direct cap-helper test would test a path that cannot fire, i.e.
      contrived) is YAGNI-consistent and is documented at both the union JSDoc and the plan DEC-7. The
      DEC-7 "avoid dead branch" intent is satisfied a different way: the literal is exercised by the
      reason-union construction test, so it is not a dead union member. No security weakening (v1 injects
      zero host capabilities, so there are no tool calls to cap). Classified LOW because the plan text
      (post-backfill) and the code disagree on HOW tool-call-cap is covered, even though both agree it is
      reserved/unreachable.
    recommended_action: >-
      Accept as a documented divergence. Optionally tighten the plan DEC-7 wording (drop "DIRECT unit
      test of the private cap helper" since no helper ships) OR add a 1-line note to followups.md that
      maxToolCalls enforcement + its test land with the Q3 host-bridge follow-up. Non-blocking.

  - id: F-xval-2
    severity: LOW
    file: packages/core/src/infrastructure/db/config.ts + local-memory.ts (plan pointed to factory.ts)
    plan_ref: T2.2 "Files to edit: packages/core/src/infrastructure/db/factory.ts — accept + thread optional skillExecutor"
    summary: >-
      LOCUS REFINEMENT — the plan declared the skillExecutor option would be threaded in factory.ts;
      the impl placed the option TYPE on LocalMemoryConfig (config.ts, the shared config interface
      createLocalMemory already consumes) and the threading-into-skills() in local-memory.ts.
      factory.ts was NOT modified.
    evidence: |
      config.ts:79 `readonly skillExecutor?: SkillExecutor;` on LocalMemoryConfig.
      local-memory.ts:283-286 threads config.skillExecutor into LocalScopedSkillMemory deps.
      factory.ts:153 createLocalMemory(config: LocalMemoryConfig) receives the option and passes
        config to new LocalMemory(...) at lines 216/265 — so the option DOES flow through createLocalMemory.
      grep skillExecutor in factory.ts: none.
    assessment: >-
      Wiring is CORRECT end-to-end through createLocalMemory (the public entrypoint the plan named in
      prose: "createLocalMemory accepts an optional skillExecutor"). The architecture splits config
      type (config.ts) from the factory body (factory.ts) and the per-scope threading (local-memory.ts);
      the impl placed each concern in the right existing file. The plan's single "factory.ts" file
      pointer was an approximation of "the createLocalMemory wiring locus". Not scope creep, not a
      missing edit — a faithful locus refinement.
    recommended_action: None required. Optionally note the config.ts/local-memory.ts split in the plan for future readers. Non-blocking.

  - id: F-xval-3
    severity: LOW
    file: packages/core/src/infrastructure/db/scoped-skill-memory.test.ts (plan declared factory.test.ts)
    plan_ref: T2.2 "Files to edit: .../__tests__/factory.test.ts — RED: wired executor reaches skills().execute; default off"
    summary: >-
      TEST-LOCUS DIVERGENCE — the T2.2 factory opt-in RED tests
      (test_factory_optin_skill_executor_reaches_execute + test_factory_default_off_execute_throws_not_configured)
      were added to scoped-skill-memory.test.ts, NOT to factory.test.ts. Both tests use
      createLocalMemory({skillExecutor}), so the factory wiring IS tested through the public factory.
    evidence: |
      git show 70e2083 added describe('createLocalMemory({ skillExecutor }) — T2.2 factory gated wiring')
        with the two named tests to scoped-skill-memory.test.ts.
      A separate factory.test.ts exists but was not the locus for these two tests.
    assessment: >-
      The Acceptance Criterion (factory opt-in reaches execute; default off preserved) IS verified by
      named tests that exercise createLocalMemory. Co-locating them with the other skill-execute tests
      is reasonable. Cosmetic file-locus divergence only.
    recommended_action: None required. Non-blocking.

  - id: F-xval-4
    severity: INFO
    file: tests/integration/skill-execution-sandbox.test.ts
    plan_ref: T3.1 Acceptance "All suites green (unit + integration); events observed non-zero"
    summary: >-
      The GOAL integration test + several T*.x DoD items asserting integration-suite green / events
      non-zero require a live THEOMEM_PG_URI + installed isolated-vm and were NOT executed in this
      review environment (the test skips cleanly without the DB).
    evidence: |
      Test guards on PG_URI (process.env.THEOMEM_PG_URI) with describe.skip when unset.
      Verified instead: test structure (6 cases, real pg + real isolated-vm, event assertions, zero-host-escape
      sanity), plus the implement validation report 7806508 (PASS 9/9) + code-quality audit c54b187 (100, 0 findings).
    assessment: >-
      Not a defect — standard integration-suite gating convention. Flagged so the merge gate runs the
      integration job (CI with pgvector + isolated-vm) before release, per the plan's mandatory
      Integration Validation phase + Global DoD (npm run test:integration green).
    recommended_action: Confirm the CI integration job (real pgvector + isolated-vm) is green before merge. Non-blocking for code review; gate item.

