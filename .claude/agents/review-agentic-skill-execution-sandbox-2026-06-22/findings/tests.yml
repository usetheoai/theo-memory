summary: >
  The test suite is strong: the GOAL integration test exercises real pgvector + real
  isolated-vm with 1 benign + 5 per-guard malicious cases + an instanceof check (7 total,
  satisfies the plan GOAL of 6). The dispose-asymmetry invariant (pre-isolate denials =
  count 0, post-isolate denials = count 1) is asserted explicitly per case via a Proxy
  loader seam. "Zero host escape" is asserted behaviorally (host process intact + a benign
  re-execution succeeds after each denial), not via vibes. All 10 reason literals are
  covered at the error layer; EC-1..EC-7 are all exercised. No .only / .skip / xit leaks.
  Findings are minor: one structurally-dead reason literal (tool-call-cap) has NO behavioral
  test despite the plan DEC-7 mandating a direct unit test, and a couple of fixture-honesty
  nits.

