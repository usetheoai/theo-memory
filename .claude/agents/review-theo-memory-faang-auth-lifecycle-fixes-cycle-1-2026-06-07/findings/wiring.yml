findings:
  - id: F-wire-1
    severity: MAJOR
    file: src/agent-tools/__tests__/
    line: n/a
    plan_ref: T3.1 Acceptance Criteria — 8 RED tests promised
    summary: Plan T3.1 required src/agent-tools/__tests__/run-server-issuer.test.ts AND src/agent-tools/__tests__/run-mcp-server-oidc.test.ts as NEW test files with 8 RED tests covering CLI --issuer flag propagation; both files DO NOT exist.
    evidence: |
      Plan v1.1 § T3.1 line 232-234 lists the files explicitly.
      `ls src/agent-tools/__tests__/` shows: agent-tools-memory, cli-output, cli-scope, cli, error-classifier,
      oidc-cli-resolver, package-deps, run-health, run-keys, run-mcp-server, run-migrate, run-server, scope,
      server, streamable-http-auth, streamable-http. The two T3.1 test files are absent.
      The 8 RED tests promised by the plan included:
        - run_server_with_issuer_flag_passes_oidcDiscovery_to_createServer
        - run_server_with_issuer_constructs_OidcAuthVerifier_and_passes_as_authVerifier
        - run_mcp_server_with_auth_oidc_constructs_OidcAuthVerifier_passed_in_bearerAuth
        - run_mcp_server_oidc_no_longer_emits_stderr_disclosure_when_issuer_provided
        - EC-2/EC-5/EC-6/EC-9 absorptions
      Only EC-2/EC-5/EC-6/EC-9 are covered (via oidc-cli-resolver.test.ts which tests the helper in
      isolation). The 4 runner-integration sentinel tests are missing.
    impact: |
      The CLI flag → runner → resolver → adapter → verifier → createServer end-to-end chain has NO
      regression sentinel. If a future refactor breaks the propagation (e.g., a typo dropping
      `oidcDiscovery` from the createServer call), no test catches it. Pillar (b) for
      RunServerOptions.issuer/clientId + RunMcpServerOptions.issuer/clientId is PARTIAL —
      static traceability confirms wiring exists today, but tests don't lock the contract.
    recommended_action: |
      Open follow-up cycle to add src/agent-tools/__tests__/run-server-issuer.test.ts (4 tests) +
      src/agent-tools/__tests__/run-mcp-server-oidc.test.ts (4 tests) per plan T3.1 spec. Each
      should mock createServer / connectStreamableHttp + assert the oidcDiscovery + authVerifier
      args carry the expected shape when --issuer is supplied. Existing run-server.test.ts +
      run-mcp-server.test.ts already use the same vi.mock pattern — extend them in-place.

  - id: F-wire-2
    severity: MINOR
    file: tests/integration/auth/fixes-cycle-1-e2e.test.ts
    line: 28-29
    plan_ref: T4.1 scenario 6 — well_known_resolves_when_oidcDiscovery_propagated_via_CLI
    summary: Plan T4.1 scenario 6 named "well_known_resolves_when_oidcDiscovery_propagated_via_CLI" but the test as-implemented calls createServer({ oidcDiscovery: {...} }) DIRECTLY — does not invoke runServer or exercise the CLI flag chain.
    evidence: |
      Plan v1.1 § T4.1 line 305 says scenario 6: "boot via runServer({ issuer }); fetch well-known".
      Actual test at fixes-cycle-1-e2e.test.ts:280-308 boots via createServer({ memory: stubMemory,
      oidcDiscovery: {...} }) — bypasses runServer entirely. `grep -n "runServer" tests/integration/auth/fixes-cycle-1-e2e.test.ts`
      returns 0 matches.
    impact: |
      The integration test verifies createServer correctly serves the well-known endpoint when
      oidcDiscovery is supplied (good). It does NOT verify that the CLI's runServer composition
      correctly DERIVES + propagates oidcDiscovery from --issuer / --host / --port. Combined with
      F-wire-1 (missing unit tests for that derivation), the end-to-end CLI → well-known path has
      ZERO test coverage.
    recommended_action: |
      Either rename the scenario to truthfully say "createServer-direct" (honest disclosure of
      scope) OR extend the scenario to spawn runServer in-process with stubbed env + verify the
      well-known endpoint returns the issuer URL derived from --issuer flag. Acceptable lower-cost
      mitigation is the F-wire-1 unit test for runServer that asserts the oidcDiscovery payload
      shape.

  - id: F-wire-3
    severity: INFO
    file: src/agent-tools/run-mcp-server.ts
    line: 71-72
    plan_ref: T3.2 Acceptance Criteria — stderr disclosure removed when issuer provided
    summary: JSDoc on RunMcpServerOptions.auth still says "Currently plumbing-only — the production-grade `oauth4webapi` IntrospectFn adapter ships in a follow-up cycle alongside T5.1. Selecting `oidc` / `both` today emits a stderr warning + falls back to `api-keys` until the adapter lands." This was true in the parent cycle but is now stale post-fixes-cycle-1.
    evidence: |
      run-mcp-server.ts:67-77 documents the deferral.
      Actual behavior (resolveBearerAuth at line 190-221) NOW constructs the real OidcAuthVerifier
      via createOauth4webapiIntrospect when --auth=oidc or both AND --issuer supplied.
      There is no fallback-to-api-keys path remaining (line 201-204 hard-fails if --auth=oidc/both
      without --issuer).
    impact: |
      JSDoc misleads future maintainers + IDE users (hover-doc lies). No runtime regression.
    recommended_action: |
      Update RunMcpServerOptions.auth JSDoc to reflect fixes-cycle-1 closure. Plan T3.2 explicitly
      promised "stderr disclosure removed when issuer provided" — the BEHAVIOR is correct; only the
      docstring is stale.

