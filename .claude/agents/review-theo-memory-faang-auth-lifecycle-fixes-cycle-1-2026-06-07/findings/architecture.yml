  - id: F-arch-7
    severity: INFO
    file: src/server/auth/scope-verifier.ts
    line: 92
    plan_ref: Plan T3.2 EC-2 absorption (defense-in-depth)
    summary: |
      EC-2 defense-in-depth change to `scope-verifier.ts:92` correctly extended `opts.bootstrapToken.length > 0` → `opts.bootstrapToken.trim().length > 0`. Defense-in-depth is the intended pattern (CLI resolver normalizes at one layer; the middleware also guards at its layer). Minimal blast radius; correct DRY application (the normalization logic is NOT centralized — both layers honestly trim independently, which is correct for defense-in-depth).
    evidence: |
      src/server/auth/scope-verifier.ts:86-97
      ```ts
      // Bootstrap bypass (D7) — exact-match against the env-sourced token.
      // EC-2 absorption (fixes-cycle-1): post-trim length-check defends against
      // `export THEMORY_ADMIN_BOOTSTRAP_TOKEN="   "` whitespace-only env. The
      // CLI resolver normalizes empty/whitespace to undefined; this is defense-
      // in-depth at the middleware layer (any caller bypassing the CLI resolver
      // still gets the no-bypass guarantee).
      if (opts.bootstrapToken && opts.bootstrapToken.trim().length > 0) {
        if (constantTimeEqual(token, opts.bootstrapToken)) {
          await next();
          return;
        }
      }
      ```
    recommended_action: |
      No action. EC-2 absorbed at two layers per the plan. Sentinel test 5 in oidc-cli-resolver.test.ts asserts the normalization at the resolver; defense-in-depth at the middleware is honest belt-and-suspenders.

