findings:
  - id: F-arch-1
    severity: MAJOR
    file: src/agent-tools/run-server.ts
    line: 186
    plan_ref: Plan T3.2 + ADR D1 (opt-in adminApi)
    summary: |
      Admin REST sub-app is auto-mounted whenever THEMEMORY_API_KEY is set (apiKey !== undefined), even when the operator did NOT supply a bootstrap token. This silently changes behavior for pre-cycle deployments running `themory server` with only THEMEMORY_API_KEY set — previously `/v1/admin/keys/*` returned 404; now it answers 401 SCOPE_INSUFFICIENT for the env Bearer because the env key has no `memory:admin` scope row in theo_api_keys. The behavior is not a security defect (401 still rejects) but it violates ADR D1's "opt-in" contract: the plan says admin routes mount "ONLY when the caller passes CreateServerOptions.adminApi". The runner makes that decision implicitly based on `apiKey !== undefined`, which is broader than the plan/ADR D1 contract.
    evidence: |
      src/agent-tools/run-server.ts:185-196
      ```ts
      const bootstrapToken = resolveBootstrapToken();
      const adminApi = bootstrapToken !== undefined || apiKey !== undefined
          ? {
              pool,
              ...(bootstrapToken !== undefined ? { bootstrapToken } : {}),
            }
          : undefined;
      // Use ApiKeyAuthVerifier instead of the env-secret one when admin path is
      // active AND no OIDC issuer (lets theo_live_* keys auth via SHA-256 lookup).
      if (adminApi !== undefined && oidcCfg === null) {
        authVerifier = new ApiKeyAuthVerifier(pool);
      }
      ```
      Plan ADR D1 § Decision: "createApp() mounts /v1/admin/keys/* ONLY when the caller passes CreateServerOptions.adminApi: { pool, bootstrapToken? }".
      The runner couples adminApi auto-opt-in to apiKey-presence — not in the plan. Two side-effects:
        (a) Existing operators using only THEMEMORY_API_KEY now have /v1/admin/* exposed (401-gated, but reachable).
        (b) The authVerifier swap from BearerAuthVerifier to ApiKeyAuthVerifier (line 195) is a separate breaking change — pre-cycle, env-secret Bearer worked; post-cycle, only theo_live_* keys auth on the 4 verbs when this branch fires.
    recommended_action: |
      Either (a) gate adminApi mounting EXCLUSIVELY on `bootstrapToken !== undefined` per the plan's opt-in contract (current line 186 condition is over-broad), OR (b) add a dedicated `--admin-api` CLI flag / env var to make the opt-in explicit per ADR D1's "Auto-detect (`if pool present in factory`) — implicit; violates KISS" alternative-rejected note. The current branch is exactly the rejected pattern dressed differently.

  - id: F-arch-2
    severity: MAJOR
    file: src/agent-tools/run-mcp-server.ts
    line: 198
    plan_ref: Plan T3.2 ADR D4 + EC-5/EC-6
    summary: |
      `resolveBearerAuth` calls `resolveOidcConfig(oidcInput)` UNCONDITIONALLY for any mode != 'none' / undefined — including `--auth=api-keys`. If the operator runs `themory mcp --auth=api-keys` in an environment that has `THEMORY_OIDC_ISSUER` set (or invalid OIDC env state from a prior debug session), the resolver throws EC-5 (invalid URL) or EC-6 (missing client secret) at boot, even though the operator explicitly chose api-keys only. Fail-loud is correct policy for the OIDC mode but inappropriate when OIDC was not selected.
    evidence: |
      src/agent-tools/run-mcp-server.ts:195-205
      ```ts
      if (mode === undefined || mode === 'none') return undefined;

      // OIDC resolver throws synchronously on EC-5 / EC-6 — propagate to fail-loud at boot.
      const oidcCfg = resolveOidcConfig(oidcInput);

      if ((mode === 'oidc' || mode === 'both') && oidcCfg === null) {
        throw new Error(
          `themory mcp: --auth=${mode} requires --issuer (or THEMORY_OIDC_ISSUER env)`,
        );
      }
      ```
      `resolveOidcConfig` reads `process.env['THEMORY_OIDC_ISSUER']` directly (oidc-cli-resolver.ts:78) — so an unrelated env var causes EC-5/EC-6 throws even for `--auth=api-keys`. Same pattern in run-server.ts:164-180 where resolveOidcConfig fires regardless of any auth-mode signal (and there is no mode selector on `themory server` at all — OIDC just "happens" if env vars are set).
    recommended_action: |
      Short-circuit when `mode === 'api-keys'`: skip `resolveOidcConfig` entirely. For `run-server.ts`, either (a) introduce an `--auth` flag mirroring `themory mcp` so the operator explicitly picks OIDC, or (b) only call `resolveOidcConfig` when `options.issuer !== undefined || process.env['THEMORY_OIDC_ISSUER'] !== undefined` AND verify the input is non-trivial — never throw EC-6 when the operator didn't select OIDC. Honest fail-loud is correct when OIDC is selected; it's overreach when OIDC was not requested.

  - id: F-arch-3
    severity: MINOR
    file: src/agent-tools/run-mcp-server.ts
    line: 27
    plan_ref: Plan T3.2 (DRY across runners)
    summary: |
      OIDC verifier wiring is duplicated between `run-server.ts:172-180` and `run-mcp-server.ts:207-215`. Both call sites: (1) resolveOidcConfig, (2) createOauth4webapiIntrospect with identical args, (3) new OidcAuthVerifier({ introspect }). The two callers diverge slightly downstream (run-server assigns to authVerifier + propagates oidcDiscovery; run-mcp-server assembles a BearerAuthOptions bag), so a full helper is over-engineering — but the createOauth4webapiIntrospect + OidcAuthVerifier construction tuple is verbatim duplicated.
    evidence: |
      run-server.ts:172-180:
      ```ts
      if (oidcCfg !== null) {
        const introspect = await createOauth4webapiIntrospect({
          issuer: oidcCfg.issuer,
          clientId: oidcCfg.clientId,
          clientSecret: oidcCfg.clientSecret,
        });
        authVerifier = new OidcAuthVerifier({ introspect });
        oidcDiscovery = oidcCfg.oidcDiscovery;
      }
      ```
      run-mcp-server.ts:207-215:
      ```ts
      let oidc;
      if (oidcCfg !== null && (mode === 'oidc' || mode === 'both')) {
        const introspect = await createOauth4webapiIntrospect({
          issuer: oidcCfg.issuer,
          clientId: oidcCfg.clientId,
          clientSecret: oidcCfg.clientSecret,
        });
        oidc = new OidcAuthVerifier({ introspect });
      }
      ```
    recommended_action: |
      Add a `buildOidcVerifier(cfg: ResolvedOidcConfig): Promise<OidcAuthVerifier>` helper to `oidc-cli-resolver.ts` (or a sibling) returning the OidcAuthVerifier. Both runners call the helper. Keeps the wiring single-source per Inquebrável Rule 12 (DRY for true duplication of business logic — the {issuer, clientId, clientSecret} pass-through IS the same logic).

  - id: F-arch-4
    severity: MINOR
    file: src/server/auth/oidc-introspect-oauth4webapi.ts
    line: 106
    plan_ref: Plan T2.2 + commit 972ff8d (typecheck-fix)
    summary: |
      Two `as unknown as Parameters<typeof X>[N]` bridges (lines 106 + 130) escape the type system to compose oauth4webapi's symbol-keyed options literal. The bridge is documented + justified (oauth4webapi types use exactOptionalPropertyTypes-incompatible `?:` on symbol keys) but the comment is misleading: the literal shape `{ [customFetch]: fetchImpl }` IS structurally compatible with `DiscoveryRequestOptions` — the issue is purely the literal-narrow vs `?:` interaction. A typed factory `function makeOpts(fetchImpl?, allowInsecure?): DiscoveryRequestOptions { ... }` whose return type is the upstream type would compile without the `as unknown` escape. Architecture.md § 7 says: "If you must escape the type system, use `unknown` with a runtime assertion." The unknown casts here have NO runtime assertion — they're pure type-system bypass.
    evidence: |
      src/server/auth/oidc-introspect-oauth4webapi.ts:99-106
      ```ts
      const requestOptionsBase = {
        ...(fetchImpl !== undefined ? { [customFetch]: fetchImpl } : {}),
        ...(opts.allowInsecure === true ? { [allowInsecureRequests]: true } : {}),
      } as unknown as Parameters<typeof discoveryRequest>[1];
      ```
      and lines 127-130:
      ```ts
      const introOpts = {
        ...requestOptionsBase,
        signal,
      } as unknown as Parameters<typeof introspectionRequest>[4];
      ```
    recommended_action: |
      Wrap the options-build in a typed factory whose return type is the upstream `DiscoveryRequestOptions` / `IntrospectionRequestOptions`. If the upstream types genuinely cannot be satisfied via spread (TS literal-narrow + exactOptionalPropertyTypes), document why a typed cast (`as DiscoveryRequestOptions` without `unknown` bridge) is rejected — the current comment claims runtime contract authority but architecture.md requires a runtime assertion to justify any `unknown` escape.

  - id: F-arch-5
    severity: MINOR
    file: src/agent-tools/run-server.ts
    line: 224
    plan_ref: Plan T1.1+T3.2 (composition root coupling)
    summary: |
      `serve()` return is bridged via `as unknown as HttpListener` — same anti-pattern as F-arch-4. The local `HttpListener` interface (lines 98-102) is a minimal shape declaration; bridging through `unknown` rather than typing the `serve()` import correctly perpetuates type-system bypass. Both bridges are tactical workarounds for upstream type imperfections — not architectural defects on their own, but accumulate as the project ages.
    evidence: |
      src/agent-tools/run-server.ts:98-102, 222-224
      ```ts
      interface HttpListener {
        close: (cb?: (err?: Error) => void) => void;
        on?: (event: string, cb: (err: Error) => void) => void;
      }
      ...
      const listener = serve({ fetch: app.fetch, port, hostname: host }, (info: { port: number }) => {
        process.stdout.write(`themory server: listening on ${host}:${String(info.port)}\n`);
      }) as unknown as HttpListener;
      ```
    recommended_action: |
      Either (a) declare `HttpListener` as a structural type derived from `ReturnType<typeof serve>` so the cast becomes a narrowing assertion, or (b) accept the upstream `@hono/node-server` return type directly — the local `HttpListener` shape is exactly what `serve` returns. The `unknown` cast hides a maintenance landmine if `serve`'s signature ever changes.

