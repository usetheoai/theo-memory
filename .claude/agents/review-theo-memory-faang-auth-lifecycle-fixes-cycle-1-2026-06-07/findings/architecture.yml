      Integration test uses `@ts-expect-error` to call `listener.close()` on `@hono/node-server`'s return. Same upstream typing imperfection as F-arch-5; `@ts-expect-error` is the test-side workaround. INFO-only because test-side type escapes are less load-bearing than production-side ones, but the same recommendation applies: type the `serve()` return correctly at one place and reuse it.
    evidence: |
      tests/integration/auth/fixes-cycle-1-e2e.test.ts:70-82 (spawnHonoOnPort)
      ```ts
      async function spawnHonoOnPort(app: Hono | ReturnType<typeof createServer>): Promise<HttpHandle> {
        return new Promise((resolve) => {
          const listener = serve({ fetch: app.fetch, port: 0, hostname: '127.0.0.1' }, (info: { port: number }) => {
            resolve({
              port: info.port,
              close: () =>
                new Promise<void>((done) => {
                  // @ts-expect-error @hono/node-server returns http.Server-like
                  listener.close(() => done());
                }),
            });
          });
        });
      }
      ```
    recommended_action: |
      Bundled with F-arch-5: once `HttpListener` interface is properly typed against `ReturnType<typeof serve>` (or `@hono/node-server` exports a structural close-able type), test-side `@ts-expect-error` becomes unnecessary.

