    summary: |
      `themory server` (no `--auth` flag exists) REPLACES the env-secret
      BearerAuthVerifier with ApiKeyAuthVerifier when admin path is active
      AND no OIDC issuer. When OIDC issuer IS supplied, BearerAuthVerifier is
      replaced by OidcAuthVerifier only (no dual). The plan T3.2 Deep Dive
      explicitly mentions dual-validation in `--auth=both` mode — applies to
      `themory mcp`, but `themory server` has no equivalent `--auth=both`
      composition path. Operators who want both apiKey + oidc on the REST
      server need to construct it themselves via the lower-level
      `dualValidationAuth({ apiKey, oidc })` helper (which IS exposed and
      covered by T4.1 scenario 5).
    evidence: |
      `themory server` cli.ts:195-210 has no `--auth` flag.
      run-server.ts:194-196 replaces authVerifier conditionally:
        if (adminApi !== undefined && oidcCfg === null) {
          authVerifier = new ApiKeyAuthVerifier(pool);
        }
      No code path constructs dualValidationAuth({ apiKey: ApiKeyAuthVerifier,
      oidc: OidcAuthVerifier }) inside runServer.
    recommended_action: |
      ACCEPT — plan did not explicitly require `themory server` to support
      a `--auth=both` composition path. T4.1 scenario 5 validates
      dualValidationAuth works when manually composed. This is a future
      enhancement (potentially a v0.X+2 cycle) — not a regression against
      the v1.1 plan.

