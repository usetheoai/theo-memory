  - id: F-xval-5
    severity: MINOR
    file: src/server/auth/oidc-introspect-oauth4webapi.ts
    plan_ref: T2.1 § Acceptance Criteria — "Zero use of `any` in adapter source"
    summary: |
      The adapter contains 2 `as unknown as Parameters<typeof X>[N]`
      type-bridge sites (lines 106 + 130) introduced by commit 972ff8d to
      satisfy `exactOptionalPropertyTypes: true` when passing symbol-keyed
      options (`[customFetch]`, `[allowInsecureRequests]`) into oauth4webapi
      typed signatures. Strictly speaking, the AC ("Zero use of `any`") is
      SATISFIED — no literal `any` token appears. But the spirit of the AC
      (no escape hatches) is relaxed via `as unknown as ...` bridges.
      Per Inquebrável Rule 7 (TypeScript strict — "If you must escape the
      type system, use unknown with a runtime assertion"), the bridge is
      ACCEPTABLE because:
        (a) it uses `unknown` per the rule,
        (b) the contract is set by an upstream typed library (oauth4webapi),
        (c) commit 972ff8d justifies the bridge in its message,
        (d) the alternative (a typed wrapper for symbol-keyed options) would
            duplicate oauth4webapi's internal types — Rule 9 violation.
      But the AC text says "Zero use of `any`" and the bridge is functionally
      `any`-equivalent at the type-system level. Lowering severity to MINOR
      because the bridge has a documented rationale tied to upstream typing.
    evidence: |
      Plan T2.1 AC: "- [ ] Zero use of `any` in adapter source"
      Implementation (lines 106 + 130):
        } as unknown as Parameters<typeof discoveryRequest>[1];
        } as unknown as Parameters<typeof introspectionRequest>[4];
      Commit 972ff8d rationale: "oauth4webapi's DiscoveryRequestOptions +
        IntrospectionRequestOptions types use symbol-keyed `?:` properties
        which exactOptionalPropertyTypes rejects when assigning a literal
        with matching symbol keys. Fix: build the options literal omitting
        undefined keys entirely (already the pattern), bridge via
        `as unknown as Parameters<typeof X>[N]` since the runtime contract
        is set by oauth4webapi, not our local type (Inquebrável Rule 9 —
        don't reinvent symbol-keyed types)."
    recommended_action: |
      ACCEPT as-is. The bridge is documented in the commit and the upstream
      type situation justifies it. Optionally, file an upstream issue with
      oauth4webapi to expose a non-symbol-keyed builder API to eliminate the
      bridge. Until then, the comment explaining the bridge at each site
      should be added to the source (currently only in the commit message).

