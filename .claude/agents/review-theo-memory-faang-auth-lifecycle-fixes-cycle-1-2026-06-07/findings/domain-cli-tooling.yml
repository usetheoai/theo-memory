  # ────────────── F-dom-cli-8: backward-compat for resolveBootstrapToken return-value semantic ──────────────
  - id: F-dom-cli-8
    severity: MINOR
    file: src/agent-tools/oidc-cli-resolver.ts
    line: 70-75
    plan_ref: Plan EC-2 § ADR D4 — "empty-string env values MUST be treated as undefined; trim() applied"
    domain_anchor: Plan EC-2 SECURITY-CRITICAL bypass prevention
    summary: |
      `resolveBootstrapToken` correctly normalizes empty/whitespace to
      `undefined` (EC-2 absorption — closes the
      `constantTimeEqual('', '')` bypass). BUT the function returns the
      ORIGINAL `raw` value when non-empty, NOT the trimmed value:
      ```ts
      return trimmed.length === 0 ? undefined : raw;
      ```
      Effect: a token like `'  valid-token  '` (with surrounding whitespace
      from an operator's broken shell heredoc) passes the gate AND is
      returned WITH the surrounding whitespace, then handed to
      `constantTimeEqual(bearer, '  valid-token  ')`. The Bearer header
      comparison MAY still fail (if `bearer = 'valid-token'` no whitespace)
      OR succeed (if the operator literally pastes the whitespace into a
      curl `-H` header).

      This is NOT a bypass — non-empty whitespace gates correctly. It IS a
      determinism concern: the env-source returns raw, the bearer comparison
      site does (or does not) trim independently. Single source of truth
      principle suggests returning `trimmed`.

      Tested explicitly in `oidc-cli-resolver.test.ts:84` only with a
      `'valid-token-' + 'x'.repeat(32)` value (no surrounding whitespace),
      so the divergence is not exercised.
    evidence: |
      oidc-cli-resolver.ts:70: export function resolveBootstrapToken(): string | undefined {
      oidc-cli-resolver.ts:71:   const raw = process.env['THEMORY_ADMIN_BOOTSTRAP_TOKEN'];
      oidc-cli-resolver.ts:72:   if (raw === undefined) return undefined;
      oidc-cli-resolver.ts:73:   const trimmed = raw.trim();
      oidc-cli-resolver.ts:74:   return trimmed.length === 0 ? undefined : raw;
      # returns raw, not trimmed
    recommended_action: |
      Change line 74 to `return trimmed.length === 0 ? undefined : trimmed;`
      Then add a RED test in `oidc-cli-resolver.test.ts` asserting
      `process.env['THEMORY_ADMIN_BOOTSTRAP_TOKEN'] = '  valid-token  '`
      returns `'valid-token'` (trimmed). Defense-in-depth: also trim in
      `scope-verifier.ts` at the Bearer-comparison call site (already done
      per plan T3.2 Deep Dive). Two-layer trim is acceptable; single-source
      preferred.

