  # ────────────── F-dom-cli-10: process.exit / promise rejection contract honored ──────────────
  - id: F-dom-cli-10
    severity: INFO
    file: src/agent-tools/cli.ts
    line: 449-454
    plan_ref: cycle-implement.md § Step 5.5 wiring + Inquebrável Rule 8 fail-loud
    domain_anchor: Domain concern #7 from agent contract
    summary: |
      The top-level `main().catch(...)` at line 450-453 honors the
      process.exit + Promise rejection contract: any async rejection from
      `parseAsync` (commander) OR from the `.action()` callbacks (which
      `await runServer` / `await runMcpServer`) propagates to a single sink
      that writes a structured error to stderr + `process.exit(1)`.

      Verified flows:
       1. `themory server --issuer not-a-url` → parseIssuerUrl throws
          InvalidArgumentError → exitOverride catches → process.exit(2)
       2. `themory server` with `THEMORY_OIDC_ISSUER=https://x.com` + missing
          secret → resolveOidcConfig throws → action rejects → parseAsync
          rejects → main catches → process.exit(1)
       3. `themory mcp --auth=oidc` (no issuer) → resolveBearerAuth throws
          → similar path → process.exit(1)

      Difference: case (1) exits 2 (commander invalid arg), cases (2)+(3)
      exit 1 (generic CLI failure). Plan does NOT specify exit codes for
      cases (2)+(3); the difference is acceptable. The error MESSAGE is the
      contract per plan T3.1 RED tests EC-5/EC-6 (regex match).
    evidence: |
      cli.ts:449-453:
        if (isDirectInvocation) {
          main().catch((err: unknown) => {
            process.stderr.write(`themory CLI failed: ${...}\n`);
            process.exit(1);
          });
        }
      cli.ts:130-138: exitOverride → exit(2) for invalidArgument
    recommended_action: NONE. Contract honored.

