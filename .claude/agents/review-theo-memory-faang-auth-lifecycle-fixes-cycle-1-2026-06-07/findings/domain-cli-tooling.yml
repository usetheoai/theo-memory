  # ────────────── F-dom-cli-6: EC-6 vs ADR D4 wording divergence ──────────────
  - id: F-dom-cli-6
    severity: MINOR
    file: src/agent-tools/oidc-cli-resolver.ts
    line: 90-105
    plan_ref: Plan ADR D4 § EC-6 absorption — "when `--client-id` supplied OR `THEMORY_OIDC_CLIENT_ID` set, `THEMORY_OIDC_CLIENT_SECRET` MUST be present"
    domain_anchor: Plan EC-6 cross-field validation phrasing
    summary: |
      Plan EC-6 wording: "when `--client-id` supplied OR `THEMORY_OIDC_CLIENT_ID`
      set, `THEMORY_OIDC_CLIENT_SECRET` MUST be present + non-empty post-trim".

      Implementation: the EC-6 client_secret check at lines 99-105 is GATED
      behind the OIDC enablement path (i.e., issuer must be set first).
      Consequence: `themory server --client-id foo` (no `--issuer`, no
      `THEMORY_OIDC_ISSUER`) silently returns null with NO error. The plan's
      EC-6 wording would suggest this case SHOULD fail loud ("client-id
      supplied → secret required").

      Operationally, `--client-id` without issuer is meaningless so the
      lenient behavior is sensible. But the literal plan text contradicts
      the implementation. Either the plan wording should be amended or the
      validator should fire on the OR condition as written.
    evidence: |
      oidc-cli-resolver.ts:78:  const issuer = input.issuer ?? process.env['THEMORY_OIDC_ISSUER'];
      oidc-cli-resolver.ts:79:  if (issuer === undefined || issuer.trim().length === 0) {
      oidc-cli-resolver.ts:80:    return null;  // ← exits early; --client-id check never runs
      oidc-cli-resolver.ts:90:  const clientId = input.clientId ?? process.env['THEMORY_OIDC_CLIENT_ID'];
      oidc-cli-resolver.ts:99:  const clientSecretRaw = process.env['THEMORY_OIDC_CLIENT_SECRET'];
      # EC-6 fires ONLY in the issuer-set branch
    recommended_action: |
      Add a guard BEFORE the early-return at line 80:
      ```ts
      // EC-6 strict: --client-id without --issuer is meaningless; fail-loud.
      if ((input.clientId !== undefined || process.env['THEMORY_OIDC_CLIENT_ID'] !== undefined) && (issuer === undefined || issuer.trim().length === 0)) {
        throw new Error('--client-id supplied without --issuer (or THEMORY_OIDC_ISSUER env) is a misconfiguration; either remove --client-id or set --issuer.');
      }
      ```
      OR amend plan ADR D4 EC-6 wording to: "when `--issuer` is set AND
      `--client-id` is set, `THEMORY_OIDC_CLIENT_SECRET` MUST be present".
      Minor — pick the less disruptive path.

