  # ────────────── F-dom-cli-3: implicit OIDC enablement on themory server ──────────────
  - id: F-dom-cli-3
    severity: MAJOR
    file: src/agent-tools/run-server.ts
    line: 164-180
    plan_ref: Sub-goal 5 (Backward-compat sentinel) + plan T3.2 Deep Dive
    domain_anchor: Plan § Objective sub-goal 5 — `themory server` without `--issuer` MUST boot identically to pre-cycle behavior
    summary: |
      `runServer` unconditionally calls `resolveOidcConfig({ ..., host, port })`
      at line 164. The resolver treats env-var-only-set `THEMORY_OIDC_ISSUER`
      as implicit opt-in (line 78 of oidc-cli-resolver.ts:
      `const issuer = input.issuer ?? process.env['THEMORY_OIDC_ISSUER']`),
      then throws on the EC-6 `--client-id requires THEMORY_OIDC_CLIENT_SECRET`
      guard when secret is missing. Effect: an operator running this build who
      had ANY value (stale, leftover, sibling-tool) in `THEMORY_OIDC_ISSUER`
      will see `themory server` BOOT-FAIL where the pre-cycle build silently
      ignored OIDC entirely. This is a backward-compat regression NOT covered
      by the sub-goal 5 sentinel.

      Unlike `themory mcp` which has an explicit `--auth=oidc/both/api-keys/none`
      gate (and the env-only path is unreachable without `--auth`), `themory
      server` has NO equivalent opt-in flag. The env var IS the opt-in. The
      plan's intended behavior here is ambiguous: ADR D4 § Consequences says
      operators set both env vars at install time (implying env-driven
      enablement is desired), but sub-goal 5 promises backward-compat. Both
      cannot be simultaneously true for an upgrader who has only `THEMORY_OIDC_ISSUER`
      set.

      No integration test catches this — the only assertion against
      `runServer` flow is the resolver's unit tests (which test resolver
      directly, not the runServer composition). Plan T3.1 listed RED tests at
      `src/agent-tools/__tests__/run-server-issuer.test.ts` — that file does
      NOT exist in HEAD; coverage gap below in F-dom-cli-5.
    evidence: |
      run-server.ts:164:  const oidcCfg = resolveOidcConfig({
      run-server.ts:165:    ...(options?.issuer !== undefined ? { issuer: options.issuer } : {}),
      run-server.ts:166:    ...(options?.clientId !== undefined ? { clientId: options.clientId } : {}),
      ...
      oidc-cli-resolver.ts:78:  const issuer = input.issuer ?? process.env['THEMORY_OIDC_ISSUER'];
      oidc-cli-resolver.ts:79:  if (issuer === undefined || issuer.trim().length === 0) {
      oidc-cli-resolver.ts:80:    return null; // OIDC disabled
      # ... when issuer is non-empty AND clientSecret is missing → throw EC-6
    recommended_action: |
      Pick ONE of two paths and document in CHANGELOG + plan ADR D4 amendment:

      (a) **Strict opt-in path** (mirrors `themory mcp --auth`): add `--oidc`
          (or `--auth=oidc`) flag to `themory server`; resolveOidcConfig is
          invoked ONLY when the flag is present OR the user explicitly passes
          `--issuer`. Bare env-only `THEMORY_OIDC_ISSUER` → silent no-op +
          one-line stderr warning. Preserves sub-goal 5 backward-compat.

      (b) **Env-driven enablement is intentional**: document in CHANGELOG
          under `Changed` (NOT `Fixed`): "BREAKING for upgraders who had
          `THEMORY_OIDC_ISSUER` set without `THEMORY_OIDC_CLIENT_ID` +
          `THEMORY_OIDC_CLIENT_SECRET`; previous behavior was silent ignore,
          new behavior fails loud at boot." Add a release-notes section
          documenting the migration path (unset the env var OR provide all
          three).

      Recommend (a) for v0.x stability; (b) acceptable post v1.0.

  # ────────────── F-dom-cli-4: themory mcp --auth=api-keys still exercises resolveOidcConfig ──────────────
  - id: F-dom-cli-4
    severity: MAJOR
    file: src/agent-tools/run-mcp-server.ts
    line: 190-204
    plan_ref: Plan T3.2 + EC-2/5/6 absorption
    domain_anchor: Plan § sub-goal 5 backward-compat; cycle-implement.md Inquebrável Rule 8 fail-loud only where intended
    summary: |
      `resolveBearerAuth` short-circuits on `mode === 'none' || undefined` at
      line 195, BUT does NOT short-circuit on `mode === 'api-keys'`. The
      resolver `resolveOidcConfig(oidcInput)` runs at line 198 regardless.
      Effect: when an operator runs `themory mcp --auth=api-keys` (deliberate
      opt-out of OIDC) AND has `THEMORY_OIDC_ISSUER=https://...` lingering in
      env (sibling tool, stale config), the resolver THROWS at the EC-5/EC-6
      guard — even though the user explicitly chose api-keys-only.

      The api-keys path does NOT need OIDC config; the resolver call is purely
      collateral. The guard at line 200-204 (`(mode === 'oidc' || mode ===
      'both') && oidcCfg === null → throw`) shows the author intended to
      treat OIDC as opt-in per `mode`; the resolver invocation above it
      contradicts that intent.

      No test covers `--auth=api-keys` with env `THEMORY_OIDC_ISSUER` set
      (the existing `oidc-cli-resolver.test.ts` tests the helper standalone;
      no test wires `resolveBearerAuth(mode='api-keys', { issuer in env })`).
    evidence: |
      run-mcp-server.ts:195:  if (mode === undefined || mode === 'none') return undefined;
      run-mcp-server.ts:198:  const oidcCfg = resolveOidcConfig(oidcInput);
      run-mcp-server.ts:200:  if ((mode === 'oidc' || mode === 'both') && oidcCfg === null) {
      # api-keys mode falls through to line 198 with NO guard, will throw if env has issuer + missing secret
    recommended_action: |
      Gate the `resolveOidcConfig` call on mode requiring OIDC:

      ```ts
      const oidcCfg = (mode === 'oidc' || mode === 'both')
        ? resolveOidcConfig(oidcInput)
        : null;
      ```

      Also add a RED test to `src/agent-tools/__tests__/run-mcp-server.test.ts`:

      ```ts
      it('api-keys mode does NOT trip OIDC env validation', async () => {
        process.env['THEMORY_OIDC_ISSUER'] = 'https://auth.example.com';
        // intentionally NO client_id / client_secret
        await expect(runMcpServer({
          transport: 'streamable-http', auth: 'api-keys', port: 0
        })).resolves.not.toThrow();
      });
      ```

