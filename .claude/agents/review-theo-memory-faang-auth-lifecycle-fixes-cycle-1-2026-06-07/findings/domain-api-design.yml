    plan_ref: "ADR D4 § EC-12 DOCUMENT (token char policy) — 'env-controlled tokens are opaque bytes... Minimum 32 chars enforced softly via documentation'"
    domain_anchor: "Plan § EC-12 absorption — `openssl rand -base64 32` recommended"
    summary: |
