verdict_recommendation: READY_TO_MERGE_WITH_CAVEATS

verdict_rationale: |
  No BLOCKER or CRITICAL findings. ADR D1 (opt-in adminApi), D2 (separate adapter file),
  D3 (discovery cached at construction), D4 (env-only secrets), D11 (DIP via AuthPool —
  no `pg` import in `src/server/`), EC-1 (pool runtime guard), EC-3 (introspection_endpoint
  fail-loud), and EC-7 (admin BEFORE generic bearerAuth) are all correctly implemented and
  test-covered. RFC 8414 discovery shape is honored via `oauth4webapi.processDiscoveryResponse`.
  3 MAJORs are public-surface + envelope consistency + RFC 7662 narrowing — non-blocking
  but should be addressed before promoting OIDC out of fix-cycle hardening. F-dom-api-1
  (missing exports) is the highest-leverage fix: contradicts T2.2 Files-to-edit verbatim
  and blocks third-party SDK consumers. F-dom-api-2 (envelope consistency) and F-dom-api-3
  (RFC 7662 narrowing — `aud`/`iss` discarded) carry SECURITY undertones (token-confusion
  attack surface unaddressed) but are inherited from the parent cycle, not introduced here.
