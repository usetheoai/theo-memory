    - "Fixture file with `.ts.skip` suffix correctly stays out of test discovery globs (EC-5)"
    - "skipIf-LOUD discipline implemented in subpath-smoke-import + mcp-cli-boot (EC-3 + EC-6) — vitest reports name missing deps in skip reasons"
    - "Tolerant assertions in pack-manifest.test.ts (toBeGreaterThanOrEqual) avoid npm version drift false-fails (EC-12)"
    - "Failure attribution via 6 nested describe blocks in full-public-surface.test.ts (EC-10) gives surgical failure isolation"
    - "All 125 active assertions PASS on local re-run; no flake observed; runtime 13s well under 30s soft warn"
  weaknesses:
    - "Two named RED tests (T3.1: test_no_paper_names_in_src + EC-8: test_reflection_prompt_shape_stable_post_rename) are MISSING — paper-name regression sentinel lives only inside GOAL TEST; reflection-prompt-shape stability has zero coverage"
    - "Two vacuous tests (subpath-smoke-import.test.ts:121, mcp-cli-boot.test.ts:74) — assertions tautologically pass; violate Inquebrável Rule 3 (a test that always passes is not a test)"
    - "@see fabrication check (plan T1.1 Acceptance #2) not asserted — JSDoc tests check PRESENCE, not path resolution; coverage theater latent (no actual fabrication present)"
    - "TDD order non-observable in git log — test + impl in same commit; can't verify RED-before-GREEN post-hoc"
    - "DRY violation: findExportBlocks + findJsdocBlock duplicated across exports-root.test.ts + exports-contract.test.ts"
    - "Bundle-isolation walker (_helpers/static-walk.ts) is regex-based with no sibling unit tests; correctness of the walker itself is untested (coverage theater at one layer of indirection)"
