    file: tests/integration/p0-audit/run-server-stub-removal.test.ts
    line: 28-58
    plan_ref: T3.2 plan § TDD § RED test_run_server_hard_fails_without_openai_key
    summary: |
      T3.2 RED #2 specifies behavioral assertion ("spawn `node dist/agent-tools/cli.js server`
