summary_verdict: >
  The core behavior change IS wired: default-on auto-categorization fires through the real
  remember() -> LocalScopedMemory -> runExtractionPipeline path (deps.autoCategorize is undefined
  from the factory, so autoCategorizeEnabled defaults to true and DEFAULT_CATEGORY_TAXONOMY is used).
  The OTel event has a real production emitter (pipeline.ts:328). All new symbols have real production
  callers. HOWEVER the config knob half of ADR D3 (the autoCategorize off-switch + custom taxonomy) is
  STRUCTURALLY UNREACHABLE from any real caller: neither MemoryConfig/LocalMemoryConfig declares an
  autoCategorize field, nor does scoped-memory.ts thread it into ExtractionDeps. That off-switch is
  exercisable ONLY via the direct runExtractionPipeline(deps) test path, never via the SDK/factory/REST.
  This is a real wiring gap for one plan Objective, not a blocker for the primary UX goal.

