findings:
  - id: F-wire-1
    severity: HIGH
    file: packages/core/src/infrastructure/db/scoped-memory.ts
    line: 196
    plan_ref: ADR D3 (default-on WITH an off-switch) + Objective "Auto-categorization is default-on with an off-switch in config; disabling it restores operator-only behavior" + Coverage Matrix row 4
    summary: >
      The autoCategorize config knob is never threaded from the Memory factory into ExtractionDeps, so
      the off-switch (autoCategorize.enabled=false) and the custom-taxonomy override are UNREACHABLE
      through any real caller (SDK createLocalMemory/wireMemoryFromPool, REST POST /v1/remember, MCP).
    evidence: |
      scoped-memory.ts:196-213 builds the ExtractionDeps literal and threads EVERY other optional dep
      (historyManager, tracer, customInstructions, entityExtractor, memoryEntityStore, memoryGraphStore,
      ontology) but OMITS autoCategorize. There is no `...(this.config.autoCategorize !== undefined ? ...)` line.
      grep 'autoCategorize' across packages/**/*.ts (excluding the 3 pipeline files + tests) = 0 hits.
      MemoryConfig (packages/core/src/domain/memory-store.ts:224-277) declares entityBoost, customInstructions,
      ontology — but NO autoCategorize field. LocalMemoryConfig (config.ts:32) extends MemoryConfig and adds none.
      Consequence: at runtime deps.autoCategorize is ALWAYS undefined for a real remember(), so
      `deps.autoCategorize?.enabled !== false` (pipeline.ts:107) is ALWAYS true and the taxonomy is ALWAYS
      DEFAULT_CATEGORY_TAXONOMY. The DEFAULT-ON UX goal works, but ADR D3's off-switch + custom-taxonomy are
      dead config: a deployment CANNOT set autoCategorize.enabled=false to restore operator-only behavior, and
      CANNOT supply a custom taxonomy list. The Drawbacks table itself says "a deployment that wants the old
      behavior sets autoCategorize.enabled = false" — but there is no surface to set it.
    recommended_action: >
      Add `autoCategorize?: AutoCategorizeConfig` to MemoryConfig (or LocalMemoryConfig) and thread it in
      scoped-memory.ts:196 exactly like ontology: `...(this.config.autoCategorize !== undefined ?
      { autoCategorize: this.config.autoCategorize } : {})`. Add ONE integration test that drives
      memory.user(id).remember(text) (through the factory) with autoCategorize disabled and asserts the
      persisted row has no category — proving the off-switch is reachable, not just the direct-pipeline path.

  - id: F-wire-2
    severity: MEDIUM
    file: packages/core/src/domain/extraction-pipeline-autocategory.test.ts
    line: 96
    plan_ref: Phase 4 T4.1 "prove the whole chain end-to-end" + Global DoD "THE GOAL TEST"
    summary: >
      The "integration" test suite for this feature never exercises the real remember() composition —
      every case calls runExtractionPipeline(deps) directly with an explicit autoCategorize in the deps
      literal. No test proves the factory/SDK path (LocalScopedMemory.remember) actually produces the
      auto-categorized write. The default-on behavior that ships to users is inferred, not tested.
    evidence: |
      Every test in extraction-pipeline-autocategory.test.ts (lines 96,107,118,130,148,163,175,186,197,210,222,233)
      injects `autoCategorize: { enabled: ... }` directly into the runExtractionPipeline deps argument.
      grep for auto-categorization across tests/ (the integration-suite tree that drives real factories) = 0 hits.
      There is NO test where deps.autoCategorize is omitted (the shape the real factory produces) to confirm the
      default-on path fires end-to-end. Result: the direct-pipeline path is well covered; the SDK path — the one
      the dashboard UX depends on — has zero coverage and would not catch a future factory regression (e.g. if a
      later change added `autoCategorize: { enabled: false }` at the factory).
    recommended_action: >
      Add at least one factory-level test (createLocalMemory or a wired LocalScopedMemory with a stub LLM/store)
      that calls .remember() with NO autoCategorize configured and asserts the persisted payload.category is set —
      this is the actual Goal ("without caller input") and is currently unproven through the real caller.

  - id: F-wire-3
    severity: INFO
    file: packages/core/src/domain/extraction/taxonomy.ts
    line: 13
    plan_ref: Baseline Context / public API surface
    summary: >
      None of the new symbols (DEFAULT_CATEGORY_TAXONOMY, classifyCategorySource, boundedAutoCategory,
      AutoCategorizeConfig, CategorySource, renderCategoryDirective) are re-exported via src/index.ts or
      domain/index.ts. They are internal-only. That is FINE (each has a real internal caller — no dead export),
      but note it means AutoCategorizeConfig is not a public type a consumer could pass — reinforcing F-wire-1:
      even if the factory threaded it, there is currently no public export for a consumer to construct one.
    evidence: |
      grep of packages/core/src/index.ts + domain/index.ts for the 6 symbols = 0 hits.
      Per-symbol internal reference counts (non-test, non-defn): boundedAutoCategory=2, classifyCategorySource=3,
      DEFAULT_CATEGORY_TAXONOMY=3, renderCategoryDirective=1, AutoCategorizeConfig=2, CategorySource=1 — all > 0,
      so no dead exports.
    recommended_action: >
      When closing F-wire-1, also re-export AutoCategorizeConfig from the public surface so a consumer can type a
      createLocalMemory({ autoCategorize }) argument.

