  - id: F-dom-db-4
    severity: LOW
    file: packages/core/src/domain/extraction/pipeline.ts
    line: 327
    plan_ref: EC-2 — normalize stored auto-category (trim + lowercase) so it matches the exact-match ?category=X dashboard filter
    domain_anchor: pgvector-store.ts:218 filter clause `category = $N` (case-sensitive exact match); prompt lowercase hint is a soft LLM instruction only
    summary: >
      PARTIAL-NORMALIZATION GAP (consistency, not correctness). The stored auto-category is `.trim()`ed
      (boundedAutoCategory) but is NOT lowercased at the store boundary — lowercase is only *requested*
      of the LLM in the prompt (a non-deterministic soft hint). The dashboard/REST filter is a
      case-SENSITIVE exact match (`category = $N`, pgvector-store.ts:218). So if the LLM ignores the
      lowercase hint and emits `"Work"`, the row persists as `"Work"` and will NOT match a
      `?category=work` filter, whereas a taxonomy label `"work"` would. The plan's EC-2 wording ("the
      stored value is .trim()ed (and the prompt requests lowercase)") technically matches the code —
      trim is enforced, lowercase is only prompt-hinted — so this is arguably as-designed. But it means
      auto labels are only *probabilistically* filter-consistent, not deterministically. Note the
      operator path ALSO does not lowercase, so auto and operator paths are at least mutually consistent
      (both store verbatim-after-trim); the residual risk is auto labels drifting in case because their
      source (the LLM) is the only one told to lowercase and may not comply.
    evidence: |
      # stored auto value: trim only, no toLowerCase
      pipeline-helpers.ts:38  const trimmed = raw.trim();  return (1..64) ? trimmed : null;   // no .toLowerCase()
      # filter is case-sensitive exact match:
      pgvector-store.ts:218-220  if (filters.category !== undefined && filters.category !== '') { parts.push(`category = $${idx}`); ... }
      # lowercase is a soft prompt request only (classify normalizes for the OTel source attr, not the stored value):
      taxonomy.ts:  classifyCategorySource(label) { const normalized = label.trim().toLowerCase(); ... }  // used ONLY for the event `source`, NOT for persistence
    recommended_action: >
      Decide explicitly (LOW — the plan may accept this as-designed). Option A (deterministic
      consistency): lowercase the stored auto value at the store boundary in the fail-soft branch
      (`boundedAutoCategory` could return `trimmed.toLowerCase()`), so an LLM `"Work"` is filterable via
      `?category=work` exactly like the `"work"` taxonomy label. Option B (accept): document in the plan
      that auto-label case-consistency is best-effort (prompt-hinted, not enforced) and that the OTel
      `source` classifier is case-insensitive so `"Work"` still counts as `taxonomy`. Given the operator
      path also stores verbatim, do NOT introduce a case-fold on only the auto path without confirming
      the filter contract — a one-sided change could make auto and operator labels diverge. Flag for a
      human decision.

