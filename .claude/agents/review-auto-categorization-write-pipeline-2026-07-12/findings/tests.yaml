findings:
  - id: F-tests-1
    severity: LOW
    file: packages/core/src/domain/extraction-pipeline-autocategory.test.ts
    line: 141
    plan_ref: ADR D2 + T3.1 "source attribute (taxonomy vs suggested)"
    summary: >
      The OTel event source-attribute is only asserted for the 'taxonomy' branch.
      No pipeline/integration test drives a free-form (unlisted) LLM label to
      assert source === 'suggested' end-to-end.
    evidence: |
      test_emits_category_auto_assigned_event_with_source uses category:'work'
      -> asserts setAttribute('source','taxonomy'). The 'suggested' branch of
      classifyCategorySource is unit-tested in taxonomy.test.ts:16, but the
      pipeline never proves an unlisted label emits source='suggested' via the
      real emitEvent path. ADR D2's whole value (ops measuring the suggested/other
      ratio) rests on this attribute being correct for BOTH branches through the pipeline.
    recommended_action: >
      Add one test: LLM draft category:'side-hustle' (unlisted) + assert
      setAttribute('source','suggested'). ~6 lines, mirrors the existing test.

  - id: F-tests-2
    severity: LOW
    file: packages/core/src/domain/extraction-pipeline-autocategory.test.ts
    line: 156
    plan_ref: T1.1 "attributes (source, fact_count)" + T3.1 emit "source + fact_count"
    summary: >
      The event test asserts only the 'source' attribute; the second declared
      attribute fact_count (emitted at pipeline.ts:330) is never asserted.
    evidence: |
      pipeline.ts:328-331 emits { source, fact_count: 1 }; the test only checks
      setAttribute('source','taxonomy'). If fact_count regressed (or the per-fact
      count assumption Q2 changed), no test would catch it.
    recommended_action: >
      Add expect(setAttribute).toHaveBeenCalledWith('fact_count', 1) to the
      existing event test. One line.

  - id: F-tests-3
    severity: LOW
    file: packages/core/src/domain/extraction-pipeline-autocategory.test.ts
    line: 20
    plan_ref: T4.1 Deep file dependency analysis "reuse the StubVectorStore/stub-LLM harness (DRY)"
    summary: >
      The StubVectorStore + makeEmbedder + makeLlm harness is duplicated ~75
      lines from extraction-pipeline-category.test.ts rather than shared, despite
      the plan explicitly saying "reuse ... do not reinvent the stubs (DRY)".
    evidence: |
      extraction-pipeline-autocategory.test.ts:20-91 is a near-verbatim copy of
      extraction-pipeline-category.test.ts:30-109 (the autocategory copy drops the
      private `rows` Map it does not use). Two independent StubVectorStore classes
      now mirror the VectorStore DIP; a future DIP method addition must be patched
      in both.
    recommended_action: >
      Acceptable as-is (matches the existing per-file stub convention across this
      codebase's test suite, and duplicated test stubs are lower-risk than shared
      production code). If touched again, extract a shared test-support
      StubVectorStore into a __fixtures__/test-support module. NOT a merge blocker.

  - id: F-tests-4
    severity: INFO
    file: packages/core/src/domain/extraction-pipeline-autocategory.test.ts
    line: 93
    plan_ref: Unresolved Question Q2 (per-fact vs batch-level category on multi-fact input)
    summary: >
      All auto-category tests use a single-fact LLM draft. No test exercises the
      multi-fact case (N>1 extracted facts, each with its own category) to prove
      per-fact propagation + one event per assigned fact.
    evidence: |
      Every makeLlm({ memory: [ ... ] }) fixture has exactly one entry. The
      per-fact loop (pipeline.ts:322-333) with fact_count:1 hardcoded is untested
      for N>1. The existing extraction-pipeline-category.test.ts:125 already proves
      the operator-category multi-fact path, so the harness supports it trivially.
    recommended_action: >
      Optional: add a 2-fact draft with distinct categories ('work','preferences')
      and assert both payloads + 2 event emissions. Closes the Q2 gap with a test
      rather than leaving it purely to the plan's per-fact design assertion.

  - id: F-tests-5
    severity: INFO
    file: packages/core/src/domain/extraction-pipeline-autocategory.test.ts
    line: 1
    plan_ref: Coverage Matrix rows 16 (EC-6 verbatim path) + 17 (EC-7 re-remember)
    summary: >
      EC-6 (infer:false verbatim path is NOT auto-categorized) and EC-7
      (re-remember does not overwrite category) are marked "(documented)" in the
      Coverage Matrix and have no test. EC-6 in particular is a cheap regression
      guard against a future change accidentally routing the verbatim path through
      auto-categorization.
    evidence: |
      pipeline-helpers.ts:212 (verbatim path) only sets payload['category'] from
      options.category — correct, but no test asserts that remember(text,{infer:false})
      with NO operator category yields an uncategorized row. The plan intentionally
      left these documented-only (design invariants), so this is INFO not a gap.
    recommended_action: >
      Optional: a single test — infer:false + no operator category + a stub LLM
      that WOULD emit a category -> assert payload.category is undefined — locks
      EC-6 as a behavior, not just a comment.

