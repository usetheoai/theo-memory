findings:
  - id: F-xval-1
    severity: MEDIUM
    file: packages/core/src/infrastructure/db/scoped-memory.ts:196
    plan_ref: >
      T3.1 task step 4 ("Thread the configured taxonomy/enabled flag from the Memory
      config into the prompt builder + this branch") + ADR D3 ("Add an autoCategorize
      config knob ... a deployment that wants the old behavior sets
      autoCategorize.enabled = false") + Coverage Matrix row 4 + Objective bullet
      "Auto-categorization is default-on with an off-switch in config".
    summary: >
      The ADR-D3 off-switch is not reachable through the top-level Memory config in
      production. runExtractionPipeline is invoked from the real remember() path at
      scoped-memory.ts:196, and that ExtractionDeps object threads every other optional
      dep (ontology, entityExtractor, reranker, memoryGraphStore, ...) from this.config,
      but does NOT thread `autoCategorize`. deps.autoCategorize is therefore always
      undefined at the production call site, so `deps.autoCategorize?.enabled !== false`
      is always true — default-on works, but a caller CANNOT set
      autoCategorize.enabled=false via createLocalMemory. There is no autoCategorize field
      on any factory/config type (grep of packages/core/src/index.ts + infrastructure
      returns 0 non-test hits). The disabled-flag AC and Coverage-Matrix row 4 are proven
      ONLY at the ExtractionDeps layer (the test passes { autoCategorize: { enabled:false } }
      directly into runExtractionPipeline), not end-to-end through the shipped factory.
    evidence: |
      scoped-memory.ts:196-213 — ExtractionDeps spread threads ontology/entityExtractor/
        memoryEntityStore/memoryGraphStore/customInstructions/tracer from this.config but
        NOT autoCategorize.
      pipeline.ts:107 — const autoCategorizeEnabled = deps.autoCategorize?.enabled !== false;
        (undefined ⇒ true; off-switch dead in production).
      grep "autoCategorize" over packages/core/src (non-test): only the extraction/
        module + ExtractionDeps.autoCategorize?: — NO ScopedMemoryConfig / LocalMemoryConfig
        / createLocalMemory field, NO thread at the remember() call site.
      Contrast: reranker/ontology ARE threaded from config at scoped-memory.ts:212/361.
    recommended_action: >
      Add an `autoCategorize?: AutoCategorizeConfig` field to the ScopedMemory config
      (and surface it on createLocalMemory / LocalMemoryConfig), then thread it into the
      ExtractionDeps at scoped-memory.ts:196 exactly like ontology/reranker
      (`...(this.config.autoCategorize !== undefined ? { autoCategorize: this.config.autoCategorize } : {})`),
      and add one integration test proving createLocalMemory({ autoCategorize: { enabled:false } })
      yields an uncategorized memory through remember(). Default-on behavior is unaffected;
      this only makes the documented off-switch reachable. Alternatively, if config
      plumbing was intentionally deferred, add a one-line ADR/followup declaring the
      off-switch as ExtractionDeps-only for now (honesty per Rule 3) — but the plan text
      as written ("sets autoCategorize.enabled = false") implies the factory path.

  - id: F-xval-2
    severity: INFO
    file: packages/core/src/domain/extraction/taxonomy.ts:33
    plan_ref: T1.2 (AutoCategorizeConfig) + commit 88fd2ec
    summary: >
