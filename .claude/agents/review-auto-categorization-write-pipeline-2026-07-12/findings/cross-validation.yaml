      ("defer to its consumer" — phase-1 mini-review flagged it as an orphan type with no
      caller), then RE-ADDED to taxonomy.ts in 842da7c (T3.1) once ExtractionDeps consumes
      it (pipeline-helpers.ts:90 `readonly autoCategorize?: AutoCategorizeConfig`). Net
      result is correct and now has a real consumer; noted only so the two-step history is
      not mistaken for a lost type.
    evidence: |
      git log -S AutoCategorizeConfig -- taxonomy.ts → dd9bf3b (add) / 88fd2ec (remove) / 842da7c (re-add).
      pipeline-helpers.ts:27 import type { AutoCategorizeConfig }; :90 field on ExtractionDeps.
    recommended_action: None. Resolved by design; the type is consumed by ExtractionDeps.

