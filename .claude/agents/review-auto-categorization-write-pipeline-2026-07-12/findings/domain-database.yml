      export function boundedAutoCategory(raw: unknown): string | null {
        if (typeof raw !== 'string') {
          return null;
        }
        const trimmed = raw.trim();
        return trimmed.length >= 1 && trimmed.length <= 64 ? trimmed : null;
      }
      ```
