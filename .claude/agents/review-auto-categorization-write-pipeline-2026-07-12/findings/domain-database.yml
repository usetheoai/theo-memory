  - id: F-dom-db-2
    severity: PASS
    file: packages/core/src/domain/extraction/pipeline.ts
    line: 322-336
    plan_ref: auto-categorization-write-pipeline-plan § T3.1
    domain_anchor: CLAUDE.md § Princípio 3 (auditabilidade — never silent IGNORE)
    summary: "NO REGRESSION: category payload hoisting unchanged; F-M1 adds observability event when LLM-proposed category is dropped (fail-soft)"
    evidence: |
      Before fix (implicit):
      ```ts
      const autoCategory = boundedAutoCategory(extracted[i]?.category);
      if (autoCategory !== null) {
        payload['category'] = autoCategory;
      }
      // else: silent drop
      ```
      After fix (explicit):
      ```ts
      const rawCategory = extracted[i]?.category;
      const autoCategory = boundedAutoCategory(rawCategory);
      if (autoCategory !== null) {
        payload['category'] = autoCategory;
        emitEvent(tracer, 'category_auto_assigned', { ... });
      } else if (typeof rawCategory === 'string') {
        emitEvent(tracer, 'category_auto_dropped', { reason: 'out_of_bounds' });
      }
      ```
      • Payload hoisting path unchanged (extracted → boundedAutoCategory → payload['category'])
      • Event only emitted when LLM proposed a STRING that failed bounds (not when absent)
      • Satisfies Princípio 3: real drops are now observable
    assessment: |-
      • No migration needed (the `category_auto_dropped` is an OTel event, not a table column)
      • Event is correctly conditioned: only fires when `typeof rawCategory === 'string'`
      • This prevents event spam when LLM simply didn't extract a category
      • Silent drop converted to observable drop; fail-soft behavior unchanged
    recommended_action: "NONE — F-M1 closes honest gap identified in /review. Merge as-is."

