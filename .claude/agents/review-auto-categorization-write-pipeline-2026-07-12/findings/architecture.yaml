  - id: F-arch-4
    severity: INFO
    file: packages/core/src/domain/extraction/pipeline.ts
    line: 313-334
    plan_ref: T3.1 (ADR D1/D3/D4) — operator-precedence + fail-soft LLM-category branch + OTel
    summary: >
      The T3.1 behavior branch is SOLID-clean. Operator precedence preserved verbatim; the LLM
      branch delegates bound-checking to the pure `boundedAutoCategory` helper (SRP), classifies via
      `classifyCategorySource`, emits the typed event, and cannot throw (total function → fail-soft
      per ADR D4). `attributed_to` propagation (309-312) untouched; verbatim path unchanged.
    evidence: |
      ```ts
      if (options?.category !== undefined) {
        payload['category'] = options.category;              // operator wins (unchanged)
      } else if (autoCategorizeEnabled) {
        const autoCategory = boundedAutoCategory(extracted[i]?.category);
        if (autoCategory !== null) {
          payload['category'] = autoCategory;
          emitEvent(tracer, 'category_auto_assigned', {
            source: classifyCategorySource(autoCategory, autoCategorizeTaxonomy),
            fact_count: 1,
          });
        }
      }
      ```
      `extracted[i]?.category` is `string|undefined` under noUncheckedIndexedAccess;
      `boundedAutoCategory(raw: unknown)` handles non-string → null. No try/catch needed (KISS —
      guards over exceptions, exactly as the plan's Deep Dive prescribes). Branch is ~10 lines, well
      under the complexity budget; extraction into `boundedAutoCategory` kept the function within SRP.
    recommended_action: No action.

