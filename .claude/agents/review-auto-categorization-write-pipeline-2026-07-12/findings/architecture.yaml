findings:
  - id: F-arch-1
    severity: MEDIUM
    file: packages/core/src/infrastructure/db/scoped-memory.ts
    line: 196-213
    plan_ref: ADR D3 + Objective bullet "disabling it restores the operator-only behavior" + T3.1 threading task 4
    summary: >
      The `autoCategorize` config knob (D2 custom taxonomy + D3 off-switch) is defined on
      `ExtractionDeps` and honored in the pipeline, but it is NEVER threaded from the public
      `Memory` factory into the deps object — the composition root does not wire it. Default-on
      WORKS (undefined → enabled), but the documented off-switch and custom-taxonomy config are
      architecturally unreachable through the public API.
    evidence: |
      `scoped-memory.ts` assembles ExtractionDeps from `this.config` but omits autoCategorize:
      ```ts
      const result = await runExtractionPipeline(messages, this.filters, {
        vectorStore: this.config.vectorStore,
        embedder: this.config.embedder,
        llm: this.config.llm,
        ...(this.config.entityExtractor !== undefined ? { entityExtractor: ... } : {}),
        ...(this.config.ontology !== undefined ? { ontology: resolveOntology(...) } : {}),
        // NO: ...(this.config.autoCategorize !== undefined ? { autoCategorize: ... } : {})
      }, options);
      ```
      `LocalMemoryConfig` (config.ts) declares entityExtractor / ontology / reranker /
      recallCache but NOT `autoCategorize`; `factory.ts` never references it. `grep autoCategorize`
      across packages/ (excluding the 4 slug files + tests) returns ZERO hits — the knob is only
      reachable by directly constructing `ExtractionDeps` (internal wiring, not the public surface).
      Consequence: ADR D3's "non-breaking escape hatch" and the Objective bullet
      "disabling it restores the operator-only behavior" cannot be exercised via `createLocalMemory`.
      The `disabled_flag_restores_operator_only` unit test passes only because it injects
      ExtractionDeps directly, not through the factory.
    recommended_action: >
      Add `readonly autoCategorize?: AutoCategorizeConfig` to `LocalMemoryConfig` and thread it in
      scoped-memory.ts remember() the same way ontology/entityExtractor are threaded
      (`...(this.config.autoCategorize !== undefined ? { autoCategorize: this.config.autoCategorize } : {})`),
      plus a factory pass-through. Deferring: the caller/integration-test half is the wiring agent's
      remit — this finding covers the composition-root DIP gap (architecture.md §1: the composition
      root wires concretes; a config knob with no root connection is a dangling seam).

