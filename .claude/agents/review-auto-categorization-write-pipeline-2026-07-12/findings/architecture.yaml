overall_architecture_note: >
  The design is clean and SOLID-compliant. The F1 split is behavior-preserving with correct
  public-surface re-export and no import cycle (entity-linking deliberately narrows its deps to
  avoid one). taxonomy.ts is a well-cohered leaf; boundedAutoCategory / classifyCategorySource are
  single-responsibility pure helpers; the T3.1 branch preserves operator precedence and is fail-soft
  by construction; ExtractionDeps widening with an optional autoCategorize is a cohesive ISP-clean
  addition. The one non-INFO finding (F-arch-1, MEDIUM) is a composition-root wiring gap: the D2/D3
  config knob is defined and honored in the domain but never connected from LocalMemoryConfig /
  factory / scoped-memory, so the default-on feature works but the documented off-switch and custom
  taxonomy are unreachable through the public Memory factory. No BLOCKER/HIGH architectural defects.
