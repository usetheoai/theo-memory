fixture_hygiene:
  constant_embedder_rationale:
    verdict: SOUND
    notes: |
      Test header lines 25-32 explicitly justify why ConstantEmbedder (and not DeterministicStubEmbedder) is chosen: the goal test exercises SQL-layer MECHANICS (column hoist, WHERE filter composition, temporal predicate, scope isolation), NOT semantic relevance. ConstantEmbedder makes ALL rows trivially pass the threshold so the SQL contract is the ONLY variable. Semantic plumbing is covered by the existing 670+ contract tests. Cross-validation agent already documented this as divergence-4-honest and accepted it.
      RISK: ConstantEmbedder also means that recall() rankings are degenerate (all distances zero, score=1). If recall() ever started failing to RETURN rows when distances are exactly zero (e.g., a future "tied-distance-tiebreaker" change), this test would silently hide the bug. Recommend: add a counter-assertion `expect(all.length).toBeLessThanOrEqual(N + tolerance)` or document this as a known property of the fixture. Treat as F-tests-2 below.
  beforeach_reset:
    verdict: SOUND
    notes: |
      `beforeEach(async () => { await resetTestRows(pool); })` at line 80-82 truncates the alice + bob test rows before each test. Good isolation. Note: relies on userId scoping (resetTestRows DELETEs WHERE user_id = ANY(...)); any future test that seeds other userIds would skip cleanup. NOT a current bug.
  deterministic:
    verdict: SOUND_WITH_FLAKINESS_CAVEAT
    notes: |
      ConstantEmbedder + DeterministicStubLLM are fully deterministic. BUT scenario 2 (forgotten memory recoverable by historical asOf) uses three `await new Promise(resolve => setTimeout(resolve, 50))` calls at lines 165, 169, 214 to manufacture time gaps between `Date.now()` snapshots. See F-tests-3 below.

flakiness_concerns:
  - id: F-tests-3 surface
    location: tests/integration/v1-1-multi-peer-bitemporal.test.ts:165, 169, 214
    description: |
      Three 50ms `setTimeout` sleeps to manufacture temporal separation between `tBeforeForget` / `forget(id)` / `tAfterForget` and between `remember()` / `tBefore`. On a slow CI runner (containerized clock skew, GC pauses, Postgres NOW() resolution), 50ms is the minimum spacing that still beats Postgres `now()` granularity (microseconds in PG14+) and JS `Date.now()` (1ms resolution). In practice 50ms is fine for most CI environments. But:
        - There is NO documented justification for the 50ms specifically.
        - If the goal test ever flakes on a CI runner, the first symptom would be a non-deterministic Scenario 2 test 1.
        - Alternative: use `vi.useFakeTimers()` for the JS clock + advance Postgres clock via raw SQL `SELECT pg_sleep(...)` OR inject explicit Date stamps as parameters to forget/recall. The current 50ms approach is the simplest and trusts the OS scheduler, which is reasonable for a goal test against a real container.
      Verdict: ACCEPTABLE today; recommended to add a brief comment justifying the 50ms or upgrade to fake timers in a follow-up if flake surfaces.

