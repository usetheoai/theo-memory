concurrent_safety:
  - resource: pgvector + Postgres columns memories.attributed_to + t_valid + t_invalid
    operations: |
      INSERT (write path) — single-row or batched insert under ON CONFLICT(hash) DO NOTHING.
      SELECT (recall path) — single read with WHERE clause; no read-modify-write.
      Migration 0008 — ADD COLUMN IF NOT EXISTS + CREATE INDEX IF NOT EXISTS;
      idempotent under concurrent invocation (Postgres handles via internal lock).
    races_observed: none
    rationale: |
      v1.1 does NOT introduce new RMW patterns. The attributed_to column is
      append-only on insert; never updated. The asOf filter is a pure read
      predicate. composeTemporalWhere does not mutate any state. EC-10 (concurrent
      dedup) was a SHOULD TEST item absorbed at T2.1 inline + T4.1 (per the
      cross-validation report) — no new races introduced.

findings:
  - id: F-wire-1
    severity: MAJOR
    file: src/local/scoped-skill-memory.ts:122-128 + src/core/skill.ts:102-114 + tests/integration/v1-1-multi-peer-bitemporal.test.ts (missing skill+asOf scenario)
    plan_ref: |
      T3.1 § Tasks step 10 — "EC-9: Write RED integration test: skill row recall with `asOf` honors bi-temporal predicate."
      T3.1 § TDD — "RED: test('integration: skill row recall with asOf honors bi-temporal predicate', ...) — EC-9"
      T3.1 § Acceptance Criteria — "EC-9: Skill rows honor `asOf` filter at the WHERE-clause level."
      Coverage Matrix gap 29 (EC-9 SHOULD TEST)
      Global DoD § Plan-specific criterion 4 — "All 5 SHOULD TEST items shipped as RED tests in their owning tasks (EC-6/EC-7/EC-8/EC-9/EC-10)"
    summary: |
      EC-9 (skill rows + asOf interaction) is NOT WIRED at the public API surface
      and has NO integration test. From a WIRING perspective, this is a missing
      pillar-(b) — the SQL composer is uniform (composeTemporalWhere applies on
      every search() invocation including skill recall via runRetrievalPipeline),
      but a consumer calling memory.skills(repoId).recall('q', { asOf: t }) gets
      a TypeScript type-rejection because SkillRecallOptions does not declare
      asOf. The wiring chain in scoped-skill-memory.ts:124-128 builds Filters
      inline ({...this.filters, kind:'skill', excludeSuperseded}) without
      threading asOf from options. /implement-validate report's wiring triad
      table (line 75) claims "Scenario 2.1 + 2.3 + 3.1" exercise composeTemporalWhere
      for the skill path — but those scenarios use memory.user(ALICE).recall(),
      NOT memory.skills(...).recall(). Cross-validation already flagged this as
      F-xval-1; I confirm it from the wiring lens: the public-API thread for the
      4th tier (RepoScope skill) is broken; the integration test that would
      validate it is absent.
    evidence: |
      - src/core/skill.ts:102-114 — SkillRecallOptions has topK/threshold/includeSuperseded only
      - src/local/scoped-skill-memory.ts:124-128 — Filters built without options.asOf widening
      - grep -rn "skill.*asOf\|asOf.*skill" tests/ src/ → zero matches
      - tests/integration/v1-1-multi-peer-bitemporal.test.ts → 7 test() bodies, all
        memory.user(ALICE), no memory.skills() invocation
      - Compare to src/local/index.ts:172,182-187 applySkillFilters — non-skill path
        DOES route asOf into Filters.asOf
    recommended_action: |
      Option A (preferred): Widen SkillRecallOptions to include attributedTo?:
      string + asOf?: Date in src/core/skill.ts; thread both into Filters in
      src/local/scoped-skill-memory.ts:124-128 (mirror applySkillFilters lines
      182-187); add an integration RED test exercising memory.skills(repoId)
      .recall('q', { asOf }) — assert temporal predicate honored on skill rows.
      Option B (honest narrowing): Author an ADR D4 amendment declaring EC-9
      deferred to v1.2 + remove the T3.1 AC + DoD claim. Add CHANGELOG note
      under `Changed` deferring the skill+asOf surface.
      Option A keeps the plan's Coverage Matrix claim honest; Option B narrows
      the contract.
  - id: F-wire-2
    severity: MINOR
    file: src/local/__tests__/factory.test.ts:115-131
    plan_ref: T3.2 (rejects.toThrow → positive returns-time-correct-results assertion)
    summary: |
      Plan T3.2 said to REPLACE the existing rejects.toThrow(BiTemporalNotSupportedLocally)
      assertion with a positive "returns time-correct results" assertion. The
      current factory.test.ts:125-131 retains a guard test asserting the class
      is still EXPORTED (forward-compat for cloud runtime); this is consistent
      with cross-validation's divergence-acknowledgement BUT does not include a
      positive local-runtime assertion that asOf returns time-correct results
      at THAT test file. The positive assertion is moved to
      tests/integration/v1-1-multi-peer-bitemporal.test.ts (scenario 2). Net
      effect is identical (positive coverage via integration), but the factory
      test file's surface no longer guards the lifted behavior at unit level.
      Not a wiring failure — coverage exists at integration tier. Surface for
      acknowledgment only.
    evidence: |
      git diff 2341426..HEAD -- src/local/__tests__/factory.test.ts shows the
      old assertion was changed (rejects.toThrow no longer present at lines 105-110
      in the new file body; only the export-still-present guard remains at 125-131).
    recommended_action: |
      Acceptable as-is given the integration-tier replacement. If consumers
      want a unit-level positive smoke, add a one-liner: assert that
      createLocalMemory + ConstantEmbedder + recall({asOf: new Date()}) does
