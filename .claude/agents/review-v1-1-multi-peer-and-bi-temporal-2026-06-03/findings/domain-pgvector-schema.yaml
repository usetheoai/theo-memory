  - id: F-dom-pg-5
    severity: MINOR
    file: src/local/migrations/0008_attributed_to.sql
    line: 27
    plan_ref: "T1.1 Deep Dives — Partial index rationale + EC-6 idempotency"
    domain_anchor: |
      Production deploys of partial indexes on large tables typically use `CREATE INDEX CONCURRENTLY` to avoid blocking writes during the index build. The Drizzle-generated convention is non-CONCURRENT for transactional migrations (CONCURRENTLY cannot run inside a transaction block). Migration 0008 uses `CREATE INDEX IF NOT EXISTS` (correct for idempotency) but NOT `CONCURRENTLY`. Acceptable for v1.1 milestone because the column is brand-new and table-write throughput at any consumer is presumably low — but worth noting for the CHANGELOG migration runbook.
    summary: |
      Migration 0008 creates `idx_memories_user_attributed_to` without `CONCURRENTLY`. For consumers running this migration against a live production DB with active write traffic on `memories`, the CREATE INDEX will hold a SHARE lock blocking writes (no writes blocked by SHARE-on-SHARE per Postgres docs, but ROW EXCLUSIVE write attempts will queue). The lock duration is proportional to the number of NON-NULL `attributed_to` rows — at v1.1 launch this is exactly zero (per EC-1 honest no-backfill clarification: pre-v1.1 rows have NULL attribution permanently), so the partial index build will be instantaneous. The issue is forward-looking: any FUTURE migration that adds an index on a populated column should ship a runbook note about `CONCURRENTLY` for prod.
    evidence: |
      0008_attributed_to.sql:27:
        CREATE INDEX IF NOT EXISTS "idx_memories_user_attributed_to"
          ON "memories" ("user_id", "attributed_to")
          WHERE "attributed_to" IS NOT NULL;
      No CONCURRENTLY keyword. Drizzle generated migrations run inside an implicit transaction so CONCURRENTLY would error anyway — switching it on would require restructuring as a non-transactional migration step.
    impact: |
      Zero impact at v1.1 launch (partial index over zero rows). Pattern-level worth documenting: future migrations adding indexes on populated columns should ship a separate non-transactional step OR a runbook note.
    recommended_action: |
      No code change required for v1.1. Recommend adding a comment to migration 0008 (or to architecture.md § 10.x as a new bullet) noting "future migrations adding non-partial indexes on populated columns should consider a non-transactional CONCURRENTLY step OR runbook note for prod deploys".

