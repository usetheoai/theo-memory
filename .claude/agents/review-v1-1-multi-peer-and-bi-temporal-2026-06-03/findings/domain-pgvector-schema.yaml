    plan_ref: "T1.1 § Files to edit + ADR D2 (partial composite index `(user_id, attributed_to) WHERE attributed_to IS NOT NULL`)"
    domain_anchor: |
      `.claude/rules/architecture.md § 10.2` documents the exact failure mode this finding is about — `drizzle-kit push` introspects the live DB and computes a destructive diff when schema.ts diverges from migrations. `src/local/schema.ts` lines 240-244 explicitly cite the F-C3 prior precedent: "previously declared only in migration `0007_distillation_columns.sql` + `meta/0007_snapshot.json` but NOT here; `drizzle-kit push` would have computed a destructive diff (DROP TABLE) and silently lost all GDPR-survival audit rows".
    summary: |
      `idx_memories_user_attributed_to` partial index is declared in migration `0008_attributed_to.sql` (lines 27-29) and `meta/_journal.json` idx=8 but is NOT mirrored in `src/local/schema.ts`. The 3 sibling partial indexes (`idx_memories_eviction_score`/`_user`/`_session` at schema.ts lines 141-149) ARE declared via the `.where(sql\`${table.tInvalid} IS NULL\`)` pattern — establishing precedent that partial indexes belong in schema.ts. The `attributedTo` column declaration at line 87 lacks the corresponding sibling index entry in the table-builder array at lines 121-158. Identical drift hazard documented in v0.7 F-C3 review (consolidation_history table) + architecture.md § 10.2.
    evidence: |
      Migration 0008 (lines 27-29):
        CREATE INDEX IF NOT EXISTS "idx_memories_user_attributed_to"
          ON "memories" ("user_id", "attributed_to")
          WHERE "attributed_to" IS NOT NULL;
      schema.ts indexes block (lines 121-158) — present:
        index('idx_memories_eviction_score').on(table.agentId).where(sql`${table.tInvalid} IS NULL`),
        index('idx_memories_eviction_score_user').on(table.userId).where(sql`${table.tInvalid} IS NULL`),
        index('idx_memories_eviction_score_session').on(table.sessionId).where(sql`${table.tInvalid} IS NULL`),
      schema.ts indexes block — MISSING:
        // expected sibling:
        // index('idx_memories_user_attributed_to').on(table.userId, table.attributedTo).where(sql`${table.attributedTo} IS NOT NULL`),
    impact: |
      Consumer running `npm run db:push` (the dev path) gets the `attributed_to` column but NOT the partial index. The recall path `WHERE attributed_to = $N` then degrades to a sequential scan instead of the O(log N) index hit promised by T1.1 ADR D2 (Q3 Mem0 promoted-key precedent). Worse: any future `drizzle-kit push` run AFTER `runMigrations()` applied 0008 would compute a `DROP INDEX idx_memories_user_attributed_to` diff (silent index loss). Same hazard the v0.7 F-C3 + architecture.md §10.2 explicitly warns against.
    recommended_action: |
      Add the partial index declaration in the table-builder array, immediately after the 3 eviction-score partial indexes (around schema.ts:150). Use the same `.where()` pattern with a `sql\`${table.attributedTo} IS NOT NULL\`` predicate:
        index('idx_memories_user_attributed_to')
          .on(table.userId, table.attributedTo)
          .where(sql`${table.attributedTo} IS NOT NULL`),
      Then regenerate `meta/0008_snapshot.json` via `drizzle-kit generate` (or hand-add the `indexes` entry under the memories table block) so future push/migrate runs see identical state. Document the convergence in a JSDoc cross-reference to migration 0008 (mirroring how lines 240-244 cite the v0.7 F-C3 precedent).

