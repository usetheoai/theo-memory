    evidence: |
      Plan T2.1 line 473:
        "EC-10: Write RED integration test for concurrent `Promise.all([remember(text, opts1), remember(text, opts2)])`..."
      Plan T2.1 TDD § line 482:
        "RED: test('integration: concurrent remember(text, {attributedTo: a/b}) — dedup keeps first writer attribution', ...) — EC-10"
      Plan T2.1 Acceptance Criteria line 496:
        "- [ ] **EC-10:** Concurrent-remember test passes deterministically (dedup-hash collision behavior documented)."
      pgvector-store.insertBatch line 330: `ON CONFLICT (hash) DO NOTHING` — the dedup race surface.
      Verification grep over src/ + tests/ for "concurrent.*remember", "Promise.all.*attributedTo", "first writer" — zero hits.
    impact: |
      The race-condition contract that motivated EC-10 is documented in the plan + pgvector-store comments BUT not verified by code. A future regression that changes the dedup semantics (e.g., switching `ON CONFLICT DO NOTHING` to `ON CONFLICT DO UPDATE` with `attributed_to = EXCLUDED.attributed_to`) would flip the "first writer wins" invariant silently, breaking consumers depending on attribution determinism. The plan's acceptance checkbox is unverifiable as-shipped.
    recommended_action: |
      Add a new test block to `tests/integration/v1-1-multi-peer-bitemporal.test.ts` titled "Scenario 5 — EC-10 concurrent-remember dedup attribution determinism" with at least one test:
