  - id: F-dom-pg-8
    severity: MINOR
    file: src/local/pgvector-store.ts
    line: 116
    plan_ref: "T3.1 + ADR-0011 — composeTemporalWhere parametric Date binding"
    domain_anchor: |
      Symmetric defensive-cast pattern. The pgvector path uses explicit `$N::vector` cast (see vectorLiteral + all INSERT/UPDATE/SELECT sites). The jsonb path uses explicit `$N::jsonb`. The uuid array path uses explicit `$N::uuid[]` (recordAccess line 406; persistConsolidations line 700). Date binding to `timestamp with timezone` columns relies on implicit pg-node serialization (Date.toISOString() → ISO string with `Z` suffix), which Postgres coerces correctly against `timestamptz` columns IF the server timezone GUC is not pathological. Defensive ::timestamptz cast would harmonize with the rest of the codebase's explicit-cast discipline.
    summary: |
      `composeTemporalWhere()` line 116 binds `Date` instances directly: `t_valid <= $${startParamIndex}` with `params: [asOf, asOf]`. No explicit `::timestamptz` cast on `$N` positions. The pg-node driver serializes Date via `Date.toISOString()` (UTC-marked); Postgres CAN coerce text→timestamptz, but the coercion is implicit and depends on the session's TimeZone GUC for parsing ambiguous strings. ISO-8601 with `Z` suffix is unambiguous (RFC 3339), so practical risk is LOW — but the codebase's pattern is to add explicit type casts on every parametric position ($N::vector, $N::jsonb, $N::uuid[]). Adding `::timestamptz` would harmonize and pre-empt a future ts-utc serialization quirk.
    evidence: |
      pgvector-store.ts:116:
        sql: `(t_valid IS NULL OR t_valid <= $${startParamIndex}) AND (t_invalid IS NULL OR t_invalid > $${startParamIndex + 1})`,
        params: [asOf, asOf],
      Sibling pattern with explicit cast (pgvector-store.ts:706-707 persistConsolidations):
        `UPDATE memories SET t_invalid = NOW() WHERE id = ANY($1::uuid[]) AND t_invalid IS NULL`
    impact: |
      Practically zero in current runtime: Date.toISOString() produces RFC 3339 with `Z`; Postgres parses unambiguously regardless of session TimeZone. Risk surfaces only if pg-node ever changes Date serialization (unlikely) or a custom Date subclass overrides toISOString. Defensive cast eliminates the latent dependency without performance cost.
    recommended_action: |
      Change to:
        sql: `(t_valid IS NULL OR t_valid <= $${startParamIndex}::timestamptz) AND (t_invalid IS NULL OR t_invalid > $${startParamIndex + 1}::timestamptz)`,
      Symmetric with $N::vector / $N::jsonb / $N::uuid[] patterns elsewhere in the file. Cost-free polish; harmonizes with the file's "explicit cast at every $N" discipline.

