  # ============================================================
  # Design pattern usage
  # ============================================================
  - id: F-arch-14
    severity: INFO
    file: src/local/pgvector-store.ts
    line: 108-167 + 343-382
    plan_ref: T2.2 + T3.1 (Composer pattern for SQL fragment composition)
    summary: composeTemporalWhere + composeFilters pattern is a sound application of the Composer/Builder seam — both are pure functions that thread a `nextParamIndex`
    evidence: |
      Both helpers honor the same shape:
        - Input: optional value(s) to filter on + startParamIndex.
        - Output: { sql, params, nextParamIndex }.
        - Composition: search/keywordSearch call composeTemporalWhere FIRST
          (so its $2/$3 params hit the temporal predicate), then composeFilters
          (which picks up at temporal.nextParamIndex).
      The ordering matters because asOf reuses the same Date twice (start +
      end-of-validity bound), so the param-index threading is non-trivial.
      The chosen pattern is the simplest readable form (KISS); no Strategy
      abstraction needed.
      Pattern is "justified" by ADR-0011 (cited in JSDoc) + applied correctly
      (parameterized; no SQL injection surface; same shape as pre-existing
      composeFilters). Not "invented" mid-implementation; the helper extracts
      a previously-inlined `t_invalid IS NULL` fragment.

