  # ============================================================
  # SOLID — applySkillFilters widening (T2.2 + T3.1)
  # ============================================================
  - id: F-arch-2
    severity: MAJOR
    file: src/local/index.ts
    line: 170
    plan_ref: T2.2 + T3.1 (applySkillFilters widening for attributedTo + asOf)
    summary: applySkillFilters() options parameter is an ad-hoc inline structural type rather than the public RecallOptions / GetAllOptions union; risks drift on future widenings
    evidence: |
      ```ts
      function applySkillFilters(
        baseFilters: Filters,
        options?: { onlySkills?: boolean; includeSuperseded?: boolean; attributedTo?: string; asOf?: Date },
      ): Filters {
      ```
      The helper is called from BOTH `recall(query, options?: RecallOptions)`
      (line 345) and `getAll(options?: GetAllOptions)` (line 509). The
      structural inline type silently drops RecallOptions fields (`topK`,
      `threshold`) and GetAllOptions fields (`filters`) at this boundary; this
      v1.1 commit grew the parameter by two more fields (`attributedTo`, `asOf`)
      without addressing the drift. Consequence: when future
      RecallOptions/GetAllOptions widenings land, the inline type either
      accumulates every new option OR silently drops the new field at the
      boundary, depending on where the maintainer remembers to add it.
    recommended_action: |
      Declare a narrow internal `SkillFilterOptions` type
      (e.g., `Pick<RecallOptions, 'onlySkills' | 'includeSuperseded' | 'attributedTo' | 'asOf'>`)
      and have `applySkillFilters` accept that. The pick keeps the helper's
      surface explicit AND tracks future widenings automatically via TS error
      when a Pick'd field is renamed. Non-blocking for v1.1 merge; tracked as
      DRY-debt.

