  - id: F-arch-15
    severity: LOW
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 264
    plan_ref: T3.1 / ADR D3 implementation note
    summary: Banded score formula uses `Math.min(...scoredSorted.map(...))` to extract floor, but includes rows beyond topK; consider optimizing to only topK for clarity
    evidence: |
      Current (lines 273-274):
      ```ts
      const lowestSeedScore = Math.min(...scoredSorted.map((r) => r.score));
      const floor = lowestSeedScore > 0 ? lowestSeedScore : 0.000_001;
      ```
      
      The `lowestSeedScore` is derived from ALL rows in `scoredSorted`, not just the topK seeds used in the traversal (line 264 `seedIds = scoredSorted.slice(0, topK).map(...)`).
      
      ADR D3 says graph score is "strictly below the lowest genuine threshold-passing score" — the threshold-passing set is `scoredSorted` (all of it). But semantically, the graph expansion is seeded from topK only, so using the min of all scored rows might be inconsistent if the plan intended "lowest of topK seeds" (ambiguous in the plan language).
      
      In practice: if scoredSorted has 100 rows (all threshold-passing, sorted desc), the floor uses the min of all 100. The topK-seeded expansion graph hits will score between floor and the 100th score. This is conservative (extra sub-floor margin) and safe, but worth documenting.
    recommended_action: Add clarifying comment: `// Use min of entire threshold-passing pool (not just topK seeds) as floor — conservative margin ensures graph hits rank strictly below all genuine hits` OR adjust if plan intended "topK only": `const lowestSeedScore = Math.min(...scoredSorted.slice(0, topK).map(...))`.

