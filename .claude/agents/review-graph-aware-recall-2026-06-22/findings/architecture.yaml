    summary: InMemoryGraphExpansionStore mirrors PG semantics — shared-entity weight, seed exclusion, candidate-side scope confinement, limit
    evidence: |
      ```ts
      export class InMemoryGraphExpansionStore implements GraphExpansionStore {
        async expandByEntities(params: ExpandByEntitiesParams): Promise<readonly GraphExpansionRow[]> {
          // EC-1: seed exclusion (line 57)
          if (seedSet.has(n.memoryId)) continue;
          // EC-2: scope confinement (line 58)
          if (!scopeMatches(n.filters, params.filters)) continue;
          // Shared-entity weight (line 59)
          const shared = n.entityIds.filter((e) => seedEntities.has(e)).length;
        }
      }
      ```
      - Seed exclusion ✓
      - Scope match enforced (candidate-side, EC-2) ✓
      - Shared-entity weight computed ✓
      - Ordered by shared-entity count DESC ✓
    recommended_action: No action — complies with plan

  - id: F-arch-4
    severity: HIGH
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 457
    plan_ref: T3.1 / ADR D3 (banded score) + plan § Phase 3 dependency note
    summary: Spread-operator reassignment pattern `scored = [...]` is non-idiomatic for a mutable rebind; should use standard array reassignment for clarity
    evidence: |
      Current (line 457-468):
      ```ts
      scored = [
        ...(await applyGraphExpansionStage(
          scored,
          deps.graphExpansionStore,
          filters,
          options.graphExpand,
          topK,
          scope.kind,
          tracer,
        )),
      ];
      ```
      
      Standard pattern (mirrors adaptive Step 8.6, e.g., line 378 `let scored: ScoredRow[] = filterAtThreshold(...)`):
      ```ts
      scored = await applyGraphExpansionStage(...);
      ```
      
      The spread-operator-in-array assignment `[...(await applyGraphExpansionStage(...))]` is semantically equivalent to direct assignment but adds unnecessary wrapping (the helper already returns `readonly ScoredRow[]`, which is assignable to `ScoredRow[]`). The original `applyAdaptiveAssessStage` (lines 210, 227) follows the direct assignment idiom.
    recommended_action: Simplify the assignment to match the adaptive/rerank pattern: `scored = await applyGraphExpansionStage(...)` (no spread, no array wrapper). This improves readability without changing behavior.

  - id: F-arch-5
    severity: MEDIUM
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 264
    plan_ref: T3.1 / ADR D3 (banded score formula)
    summary: Banded score formula `floor * 0.999 * (sharedEntities / (sharedEntities + 1))` uses a magic constant 0.999; should be named or justified in comment
    evidence: |
      ```ts
      score: floor * 0.999 * (e.sharedEntities / (e.sharedEntities + 1)),
      ```
      The formula is:
      - `floor`: lowest genuine semantic score (or 0.000_001 fallback)
      - `0.999`: multiplier to ensure graph hits strictly rank BELOW floor (not at floor)
      - `(sharedEntities / (sharedEntities + 1))`: normalized weight ∈ (0, 1), ordered by count
      
      The 0.999 constant is not explained. The plan (ADR D3) says "strictly below the lowest genuine threshold-passing score" but does not specify the multiplier value. The comment at line 280-281 explains the normalization but not the 0.999 choice.
      
      Risk: future maintainers may not understand why 0.999 (vs 0.99 or 0.5) is correct, and may accidentally change it, weakening the "never outrank" guarantee.
    recommended_action: Name the constant (e.g., `const GRAPH_SCORE_SUB_FLOOR_MARGIN = 0.999; score: floor * GRAPH_SCORE_SUB_FLOOR_MARGIN * ...`) OR add a line comment explaining the choice: `// 0.999 ensures graph hits strictly rank BELOW the floor, never at floor (a small 0.1% margin prevents floating-point edge cases)`

