  **ARCHITECTURE REVIEW COMPLETE: graph-aware-recall**
  
  **Verdict: READY_TO_MERGE with ONE NON-BLOCKING recommendation (F-arch-4: idiomatic improvement)**
  
  **SOLID Compliance:**
  - SRP ✓ — GraphExpansionStore is a single read concern (traversal); MemoryGraphStore (2 methods) is NOT widened
  - OCP ✓ — GraphExpansionStore is a new DIP port (composition), not modification of existing code
  - LSP ✓ — both PgGraphExpansionStore and InMemoryGraphExpansionStore correctly implement the contract
  - ISP ✓ — GraphExpansionStore has exactly 1 method (ADR-0008 cap); params/result types are minimal
  - DIP ✓ — domain declares port, infrastructure implements; pipeline depends on abstraction only
  
  **DIP Boundaries:**
  - src/domain/ imports domain DIPs only (graph-expansion-store.ts has zero infrastructure imports)
  - src/infrastructure/ implements ports (pg/in-memory impls)
  - pipeline.ts depends on GraphExpansionStore TYPE, not concrete PgGraphExpansionStore
  - factory.ts auto-wires concrete impl (PgGraphExpansionStore) when pool available
  
  **Design Patterns:**
  - GraphExpansionStore mirrors Reranker/AdaptiveRetrievalPolicy opt-in DIP pattern
  - applyGraphExpansionStage mirrors applyRerankStage fail-soft pattern + applyAdaptiveAssessStage rebind pattern
  - Observability mirrors recall_rerank_failed / retrieval_policy_failed pattern (Princípio 3)
  
  **Coupling & Cohesion:**
  - GraphExpansionStore is a leaf DIP (no new upward dependencies in src/core/)
  - factory.ts already depends on PgMemoryGraphStore (same gate); adding PgGraphExpansionStore is natural composition
  - scoped-memory.ts correctly threads store into deps when wired
  
  **Naming & Module Hygiene:**
  - No paper names (GraphRAG, Self-RAG, CRAG, etc.) in src/ (read-only spot check ✓)
  - Files: kebab-case ✓ (graph-expansion-store.ts, pg-graph-expansion-store.ts)
  - Classes: PascalCase ✓ (GraphExpansionStore, PgGraphExpansionStore, InMemoryGraphExpansionStore)
  - Functions: camelCase ✓ (expandByEntities, applyGraphExpansionStage)
  - Constants: none added (magic 0.999 should be named — F-arch-5)
  - No `any` in TypeScript
  - rowToResult export is deliberate DRY reuse, correctly typed
  
  **Coverage & Testing:**
  - GOAL integration test (T5.1) proves default-OFF byte-unchanged + graphExpand ON surfaces connected memory
  - Scope isolation test (EC-2, ADR D5) enforced
  - Event emission tested (recall_graph_expanded present in spans)
  - Plan §Coverage Matrix 100% (9/9 claims mapped)
  
  **Non-Blocking Issues:**
  1. (MEDIUM) F-arch-5: Magic constant 0.999 should be named for maintainability
  2. (HIGH) F-arch-4: Spread-operator assignment `scored = [...]` is non-idiomatic; simplify to direct assignment
  3. (LOW) F-arch-15: Banded floor derivation uses all scoredSorted rows, not just topK seeds; document or clarify intent
  
  **No Blockers** — all findings are improvement-level, not correctness-level. Ship as-is or incorporate the three recommendations above.

