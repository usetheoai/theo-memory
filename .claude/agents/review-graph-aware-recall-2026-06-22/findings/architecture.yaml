      export class PgGraphExpansionStore implements GraphExpansionStore {
        async expandByEntities(params: ExpandByEntitiesParams): Promise<readonly GraphExpansionRow[]> {
          // ... 1-hop shared-entity self-join (line 72-73)
          const expandedEntitiesCte = hops >= 2 ? <2-hop relation JOIN> : <1-hop only>;
          // EC-2: candidate scope filter (lines 83-86)
          WHERE m.workspace_id = $2 AND COALESCE(m.user_id,'') = COALESCE($3::text,'')
          // EC-1: seed exclusion (line 82)
          WHERE me.memory_id <> ALL($1::uuid[])
          // Dedup against pool (returned to caller): the seeded ids are filtered at SQL boundary
        }
      }
      ```
