  - id: F-mem-9
    severity: INFO
    file: packages/core/src/domain/retrieval/pipeline.ts
    line: 249-299
    plan_ref: T4.1 Step 8.7 ADR D3 D4
    summary: Graph-expansion stage preserves 9-step pipeline ordering; banding ensures graph hits rank below semantic hits
    evidence: |
      Step 8.7 (lines 249-299):
      1. Opt-in guard: only runs when graphExpansionStore is wired AND options.graphExpand is set (line 456).
      2. Seed selection: top-K threshold-passing results (line 264).
      3. Fresh dedup: filters out already-scored candidates (line 268).
      4. No-op discipline: emits no event when fresh.length = 0 (line 270).
      5. Banding: graph hits scored strictly below lowest semantic hit via:
         ```ts
         const floor = lowestSeedScore > 0 ? lowestSeedScore : 0.000_001;
         score: floor * 0.999 * (e.sharedEntities / (e.sharedEntities + 1))
         ```
         This ensures every graph hit ranks BELOW every semantic hit (Princípio 2 — priorização via genuine signal).
      6. Fail-soft: exception degrades to cosine order, recall never throws (line 291-298).
      7. Sorting: merged pool re-sorted descending (line 283).
      
      The ordering ensures: genuine semantic results → graph-expanded results → final topK truncation.
      Byte-identical to v1.5 when graphExpand is undefined (opt-in per ADR D3).
    recommended_action: No action required; Step 8.7 is correct.

