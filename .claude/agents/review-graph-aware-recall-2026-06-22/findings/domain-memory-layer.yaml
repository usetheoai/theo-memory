  - id: F-mem-4
    severity: HIGH
    file: packages/core/src/infrastructure/db/pg-graph-expansion-store.ts
    line: 87
    plan_ref: T4.1 ADR D2
    summary: GROUP BY m.id lacks Postgres functional-dependency justification in JSDoc; technically valid but risky for future maintainers
    evidence: |
      Line 87: `GROUP BY m.id`
      
      The query projects m.id, m.text, m.hash, m.payload, m.workspace_id, m.user_id, m.session_id, m.agent_id,
      m.attributed_to, m.category, m.kind, m.code, m.description, m.code_language, m.derived_from, m.superseded_by,
      m.confirmation_count — 17 columns from memories table in aggregate without aggregation functions.
      
      In Postgres, this is LEGAL because m.id is the PRIMARY KEY, making all other columns functionally
      dependent per the PK constraint (memories PK on id, line 2 of 0000_crazy_mimic.sql).
      However, the JSDoc (lines 1-14) does not DOCUMENT this assumption. A future maintainer adding
      a non-aggregated column from a different table (e.g., a JOIN to entity) without GROUP BY inclusion
      would create a silent correctness defect (Postgres would raise an error, but the risk is documented
      indistinctly).
      
      Risk: moderate. Postgres will error if the assumption breaks, preventing silent data corruption.
      But the JSDoc should note the functional-dependency constraint.
    recommended_action: Add a one-line comment above GROUP BY explaining the functional-dependency assumption, e.g. "// PK dependency: m.id → all other m.* columns".

  - id: F-mem-5
    severity: INFO
    file: packages/core/src/infrastructure/db/pg-graph-expansion-store.ts
    line: 48-68
    plan_ref: T4.1 ADR D2
    summary: Hop-2 CTE expansion is correct; UNION correctly de-duplicates seed entities and edge targets
    evidence: |
      Hop-1 (default): expanded_entities = seed_entities (identity).
      
      Hop-2: expanded_entities = seed_entities UNION (edge targets FROM seed sources) UNION (edge sources TO seed targets).
      
      The UNION (lines 51-68) correctly dedups the entity_id set so `expanded_entities` contains:
      - All seed entity_ids (seed_entities)
      - All entity_ids REACHABLE via one edge hop (both directions: source→target and target←source)
      
      The two UNION branches correctly enforce edge-side scope filtering (EC-2), so only same-scope edges
      contribute targets/sources. The self-join pattern (JOIN seed_entities on source/target) is correct.
    recommended_action: No action required; CTE hop logic is sound.

