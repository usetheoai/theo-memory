findings:
  - id: F-sec-1
    severity: HIGH
    file: packages/core/src/infrastructure/db/pg-graph-expansion-store.ts
    line: 49-68
    plan_ref: T4.1, ADR D2 (hop-2 CTE construction)
    summary: |
      CTE for hops >= 2 is conditionally constructed via string concatenation,
      but the hop count IS safely bounded (numeric literal 2 from TypeScript enum);
      however, the SQL template is string-interpolated with ZERO type-safety, and
      a future maintainer could weaken the type constraint from `hops: 1|2` to a
      numeric parameter. The conditional logic is correct TODAY but fragile.
    evidence: |
      Lines 49-68 in pg-graph-expansion-store.ts:
      ```ts
      const expandedEntitiesCte =
        hops >= 2
          ? `expanded_entities AS (
               SELECT entity_id FROM seed_entities
               UNION
               SELECT ee.target_entity_id AS entity_id
                 FROM entity_edges ee JOIN seed_entities s ON ee.source_entity_id = s.entity_id
                WHERE ee.workspace_id = $2
                  AND COALESCE(ee.user_id,'') = COALESCE($3::text,'')
                  ...
             )`
          : `expanded_entities AS (SELECT entity_id FROM seed_entities)`;
      ```
      The `hops` variable is typed `1|2` (ExpandByEntitiesParams), so it is
      correctly narrowed. BUT the SELECT statement inside the template is a
      raw string; if the type constraint were to relax in a future PR
      (e.g., `hops: number`), no compilation error would flag the risk.
    recommended_action: |
      ACCEPT — the type constraint is the control today (hops is 1|2 enum at TS
      compile time). Add a JSDoc guard: "// IMPORTANT: hops MUST remain typed as
      1|2 enum; widening to number would create SQL injection surface. Do not
      relax this constraint without reviewing pg-graph-expansion-store.ts line
      50 conditional." This documents the constraint for future maintainers.

