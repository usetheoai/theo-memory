summary: |
  **DOMAIN SECURITY REVIEW SUMMARY**
  
  The graph-aware-recall implementation is **SECURE from injection/isolation defects**.
  All critical constraints are met:
  
  1. **SQL injection**: CLOSED. All parameters ($1..$6) are correctly bound; no string
     interpolation of user data.
  
  2. **Cross-scope isolation (EC-2, ADR D5)**: CORRECT. Both pg and in-memory impls
     filter candidates by the recall scope (workspace + user/session/agent).
     Multi-tenant isolation is enforced.
  
  3. **Fail-soft error handling (ADR D4)**: CORRECT. Graph-store failures emit an
     observable event and degrade to non-graph results; recall NEVER crashes.
  
  4. **Observability (Princípio 3)**: CORRECT. Two new events fire on success and
     failure; no-op discipline is respected (no event when nothing surfaced).
  
  5. **Cache correctness**: CORRECT. Graph-expand bypasses the recall cache (mirrors
     rerank and adaptive-retrieval precedent).
  
  **FINDINGS**: 3 MEDIUMs (fragile CTE type constraint, missing error message in
  logs, seed-set documentation) and 1 HIGH (same as MEDIUM — type constraint is
  the control today). All recommend JSDoc or comments to strengthen maintainability,
  not code changes. The implementation is PRODUCTION-READY from a security
  perspective.
