    plan_ref: T5.1 TDD (GOAL integration test)
    summary: |
      THE GOAL TEST — end-to-end against REAL pgvector + REAL PgGraphExpansionStore JOIN + REAL entity-linking write path. Two test scenarios validate: (1) graphExpand ON + same-entity below-threshold memory surfaces + recall_graph_expanded event, default OFF + byte-unchanged; (2) scope isolation + cross-user shared-entity memory never surfaces. This is the gate that PROVES the feature works in production (real DB + real JOIN + real embedder + real extraction). CRITICAL because it exercises the FULL STACK.
    evidence: |
      Line 77-122: "graphExpand ON ⇒ a shared-entity below-threshold memory surfaces + recall_graph_expanded; default OFF ⇒ absent"
        Scenario: Two memories stored (A = MATCH, near query; B = FAR, far from query).
        Both linked to the SAME entity via sharedEntityExtractor (deterministic stub).
        Setup (line 96-105):
          - Real PgvectorStore + runMigrations (DIM=8).
          - Real createLocalMemory (with queue-LLM stub + crafted embedder + shared-entity stub extractor).
          - Crafted embedder (axis 0 for alpha-bearing text, axis 1 for others; query 'alpha' → [1,0,0,...]).
        Test 1 — Baseline (line 111-113):
          - recall(QUERY, {topK: 10, threshold: 0.1}) — no graphExpand.
          - Assertion: MATCH present, FAR absent (byte-unchanged).
        Test 2 — Graph-expanded (line 116-121):
          - recall(QUERY, {topK: 10, threshold: 0.1, graphExpand: {}}) — graph-expand ON.
          - Assertion: both MATCH + FAR present; MATCH ranks first (banding); event 'recall_graph_expanded' emitted.
        
      Line 124-142: "scope isolation ⇒ a DIFFERENT user's shared-entity memory does NOT surface"
        Scenario: carol and dave store memories (same entity name via stub extractor).
        carol's memory = MATCH (near query), dave's = FAR (far, same entity name).
        Assertion: carol's recall with graphExpand returns only MATCH, NOT dave's FAR (scope isolation at SQL boundary).
    infrastructure:
      - Database: isolated test DB created on setup (line 81-88; cleanup on teardown).
      - Query crafting: deterministic via crafted embedder (axis-based orthogonal vectors) — NO randomness.
      - Entity linking: stub extractor returns SAME entity for all memories (deterministic); the JOIN traverses real memory_entities + entity_edges.
      - LLM: queue-LLM stub (echo the input as fact verbatim) — NO real LLM call.
      - Embedder: crafted (axis 0/1 orthogonal) — NO real embedder call; allows precise control.
    test_structure:
      - GWT: Given (setup memories + embedder), When (recall), Then (assert surface/absence + event).
      - Isolation: each it() sets up its own store + memory (no shared state between tests).
      - Determinism: crafted vectors + queue LLM + stub extractor → fully deterministic (no flakiness).
      - Skipped when THEOMEM_PG_URI is missing (non-flaky CI).
    assertions_detail:
      - Line 112: baseline.map(r => r.text).toContain(MATCH) — real semantic match surfaces.
      - Line 113: baseline.map(r => r.text).not.toContain(FAR) — below-threshold memory absent (default).
      - Line 118: expanded.map(r => r.text).toContain(FAR) — graph expansion surfaces connected memory.
      - Line 120: expanded[0]?.text = MATCH — banding: genuine hit ranks first (not tied with graph hit).
      - Line 121: exporter.getFinishedSpans().map(s => s.name).toContain('recall_graph_expanded') — event fired.
      - Line 140: carol.map(r => r.text).not.toContain(FAR) — scope isolation at DB boundary.
    verdict: PASS — EXEMPLARY. This is the canonical GOAL integration test. It exercises: (1) real pgvector + JOIN, (2) full write pipeline (embedding + extraction + entity linking), (3) full recall pipeline (semantic + threshold + graph expansion + banding), (4) event emission (Princípio 3), (5) scope isolation (EC-2 / multi-tenant). The test is deterministic (no flakiness), well-structured (GWT), and directly maps to plan acceptance criteria (T5.1 AC-1 + AC-2 + AC-5).
    recommended_action: NONE — This test is production-grade. It is the gate that unblocks v1 status.

