findings:
  - id: F-xval-1
    severity: LOW
    file: .claude/knowledge-base/reviews/graph-aware-recall-implement-validate-2026-06-22.md:44
    plan_ref: implement-validate "Plan refinements" — EC-2 structural-impossibility claim
    summary: >
      The implement-validate report states a cross-scope shared-entity-id leak is "STRUCTURALLY impossible
      (entities partitioned by (scope, normalized_key) UNIQUE — two scopes can never share an entity row id)."
      This is TRUE given the schema: migration 0018 `entities_scope_type_key_uq` UNIQUE over
      (workspace_id, COALESCE user/session/agent, type, normalized_key) means the same entity name in two scopes
      produces two DISTINCT entity rows; memory_entities references entity_id, so a shared entity_id implies same
      scope. So the structural claim is accurate. The only nuance: structural impossibility holds ONLY IF entity
      resolution always writes scope-correct rows (it does, per the UNIQUE). The implementation correctly does NOT
      rely on this alone — it applies an explicit candidate-side scope filter (defense-in-depth), which is the right
      call. No code defect; the report's wording is defensible, not an overclaim.
    evidence: |
      0018_entity_nodes.sql:15 CREATE UNIQUE INDEX entities_scope_type_key_uq ON entities (workspace_id, COALESCE(user_id,''), COALESCE(session_id,''), COALESCE(agent_id,''), COALESCE(type,''), COALESCE(normalized_key,''))
      pg-graph-expansion-store.ts:82-86 candidate-side scope predicate (defense-in-depth).
    recommended_action: None required. Claim is accurate. (Documentation note only.)

  - id: F-xval-2
    severity: LOW
    file: packages/core/src/domain/retrieval/pipeline.ts:283-289
    plan_ref: ADR D3 banded score function
    summary: >
      Plan ADR D3 specifies the graph score = `min(lowestSeedScore, threshold) * (sharedEntities/(sharedEntities+1))`.
      Implementation uses `floor * 0.999 * (sharedEntities/(sharedEntities+1))` where `floor = lowestSeedScore > 0 ? lowestSeedScore : 1e-6`.
      Because the pool is post-threshold (every seed score >= threshold), `min(lowestSeedScore, threshold) == threshold <= lowestSeedScore`;
      the implementation bands relative to lowestSeedScore*0.999 instead of threshold. Both satisfy the ADR D3 invariant
      ("strictly below the lowest genuine threshold-passing score") since 0.999 < 1 and (shared/(shared+1)) < 1. The GOAL test
      and pipeline test #1 both assert the genuine semantic hit ranks ABOVE the graph hit, which holds. Honest minor refinement,
      not a divergence that breaks the contract — but the exact formula differs from the literal ADR D3 text and is NOT called out
      as a refinement in the ADR (only the DIP one-query refinement is documented).
    evidence: |
      pipeline.ts: const floor = lowestSeedScore > 0 ? lowestSeedScore : 0.000_001;
                   score: floor * 0.999 * (e.sharedEntities / (e.sharedEntities + 1))
      plan ADR D3: min(lowestSeedScore, threshold) * (sharedEntities / (sharedEntities + 1))
    recommended_action: >
      Optional: add a one-line note in ADR D3 (or the implement-validate "Plan refinements" section) that the banded score
      uses lowestSeedScore*0.999 rather than min(lowestSeedScore,threshold) — same invariant, fewer moving parts. No code change needed.

  - id: F-xval-3
    severity: INFO
    file: .claude/knowledge-base/reviews/graph-aware-recall-implement-validate-2026-06-22.md:14,22
