  - id: F-tests-8
    severity: MINOR
    file: tests/integration/distillation/the-goal-test-llm-measured.test.ts
    line: 45-59 (env-var mutation block)
    plan_ref: testing.md § Determinism — "Tests devem ser independentes entre si"
    summary: |
      Lines 51-58 unconditionally mutate process.env at module-load time:
        process.env['OPENAI_API_KEY'] = OPENROUTER_KEY  (when OPENROUTER_KEY set)
        process.env['OPENAI_BASE_URL'] = 'https://openrouter.ai/api/v1'  (UNCONDITIONAL when empty)
        process.env['OPENAI_CHAT_MODEL'] = 'openai/gpt-4o-mini'  (UNCONDITIONAL when empty)
      This module-load side effect leaks into ANY other test file that subsequently imports the
      OpenAILLM and reads OPENAI_BASE_URL — even when this describe.skipIf block skips. The leak
      depends on vitest's module loader ordering, which is not deterministic across pool=threads.
    evidence: |
      Lines 51-58 — top-level `if (...)` blocks mutate process.env unconditionally on module load.
      No corresponding cleanup in afterAll.
    recommended_action: |
      Move the env-shift into beforeAll(), inside the describe.skipIf scope. Restore originals
      in afterAll(). Pattern:
        const originalBaseUrl = process.env['OPENAI_BASE_URL'];
        beforeAll(() => { /* set */ });
        afterAll(() => { process.env['OPENAI_BASE_URL'] = originalBaseUrl; });
      This contains the side effect to the test's lifecycle. Currently MINOR because OPENROUTER_KEY
      empty (CI lane) makes the file inert, but the leak is real under any local run with
      OPENROUTER_KEY set.

