        (B) Promote the test to E2E and force the failure via a pg.Pool error injector
            (cheaper now; documents the deep concern).
      The current implementation works AS A POINT-IN-TIME proof but creates a maintenance hazard.
      MINOR because the test currently asserts the right behavior; impact is future-facing.

