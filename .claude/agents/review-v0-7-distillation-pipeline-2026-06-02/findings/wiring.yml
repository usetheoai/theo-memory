verdict_summary: |
  Wiring triad rigor — 11 / 11 symbols PASS pillar (a) static-caller depth
  check (no orphans, no dead branches, no `if (false)` gaming). 10 / 11 PASS
  pillar (b) integration-test depth check (only the OTel-MeterProvider
  end-to-end scenario is missing per F-wire-2). 0 / 5 PASS pillar (c)
  runtime-metric observation when the canonical T3.3 GOAL TEST policy (LWW)
  is wired — F-wire-1 closes the gap if either (a) the wiring layer emits
  policy-agnostic counters OR (b) the plan's acceptance criteria are
  narrowed to LJM-only.

  Reachability is clean — every new module is traceable from at least one
  production entry point (HTTP route OR integration-test seed). No dead
  exports beyond the MINOR `compareCandidatesDesc` re-export caveat.
  Boundary respect is clean (zero core → local reverse imports).
  Concurrent safety is enforced via `withTransaction` BEGIN/COMMIT with
  end-to-end ROLLBACK proof at reflect-atomic-rollback.test.ts.

  Overall wiring verdict: PASS_WITH_CAVEATS — 2 MAJOR (F-wire-1, F-wire-2)
  + 2 MINOR (F-wire-3, F-wire-4). Neither MAJOR is a BLOCKER:
  F-wire-1 is a honesty/observability gap that consumers can route around by
  using LJM; F-wire-2 is an integration-test-thinness gap that the unit-test
  spy partially covers. Both should land before v1.0 benchmarks (CLAUDE.md
  Item 10) so the production-readiness claim is honest about observability
  end-to-end.
