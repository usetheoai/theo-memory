findings:
  - id: F-xval-1
    severity: MINOR
    file: tests/integration/distillation/the-goal-test.test.ts
    plan_ref: T3.3 Acceptance Criteria item "every persisted fact has non-empty derived_from"
    summary: T3.3 oracle test does NOT directly assert non-empty derived_from on persisted memories
    evidence: |
      Plan T3.3 acceptance: "asserts precision ≥ 0.75 + recall ≥ 0.70 + accuracy ≥ 0.80
      + every persisted semantic fact has non-empty derived_from".

      Shipped test:
      - Asserts precision/recall/accuracy thresholds at lines 224-226. ✓
      - Recovers decisions via consolidation_history JOIN (correctly).
      - Does NOT directly assert SELECT derived_from FROM memories WHERE id =
        keptMemoryId AND derived_from <> '[]'::jsonb.

      Mitigation evidence:
      - The "non-empty derived_from" guarantee is upheld by v0.4a invariants
        (executeReflection ensures derived rows always have ≥ 1 source ID).
      - The v0.7.1 LLM-measured test similarly does not assert it.
      - The reflect-with-policy.test.ts (EC-1 absorption test, NEW T2.1)
        does cover the derived_from chain indirectly via end-to-end pipeline.
      - CHANGELOG line 18 confirms: "persisted derived rows have non-empty
        derived_from" was claimed as proven. Plan asked for it AS PART OF T3.3.
