  - id: F-arch-1
    severity: MAJOR
    file: src/local/schema.ts
    line: 167
    plan_ref: T0.1 ADR D3 (migration 0007 architecture)
    summary: |
      `consolidation_history` table missing from Drizzle pgTable schema —
      exists only as raw SQL in migration 0007 + raw INSERT/SELECT queries
      in pgvector-store.ts + raw SQL in the consolidation-history route.
    evidence: |
      `grep -n "consolidationHistory\|consolidation_history" src/local/schema.ts`
      returns ZERO matches. Yet:
        - src/local/migrations/0007_distillation_columns.sql:14 — `CREATE TABLE`
        - src/local/pgvector-store.ts:603 — `INSERT INTO consolidation_history (...)`
        - examples/chat-with-memory/app/api/memory/consolidation-history/route.ts:63 — `SELECT ch.id ... FROM consolidation_history ch`

      Compare against every other v0.x table in the codebase: memories
      (schema.ts:68), entities (schema.ts:193), history (schema.ts:209),
      reflectionCounters (schema.ts:168). All declared in pgTable form.
      `consolidation_history` breaks the convention.

      Per architecture.md § 10.2, `drizzle-kit push` introspects the live DB
      and synchronizes the schema based on schema.ts. The current state
      means `drizzle-kit push` is now inherently lossy in the
      pgvector-store direction — it will detect `consolidation_history` as
      "extra" and could potentially drop it (depends on the drizzle-kit
      version behavior). At minimum, the orphan-schema mitigation does NOT
      cover this case.
    recommended_action: |
      Add `consolidationHistory` pgTable to src/local/schema.ts mirroring
      0007_distillation_columns.sql exactly: uuid id, kept_memory_id uuid
      with FK to memories.id `onDelete: 'set null'`, rejected_memory_ids
      jsonb, reason text, policy_name text, original_episode_ids jsonb,
      created_at timestamp. The migration SQL stays the source-of-truth
      for prod (runMigrations path); the pgTable declaration protects
      against drizzle-kit push drift. Add an INFO row in architecture.md
      § 10.2 noting consolidation_history follows the standard pattern now.

  - id: F-arch-2
    severity: MAJOR
    file: src/local/pgvector-store.ts
    line: 555
    plan_ref: T2.1 EC-7 absorption (reflect() conflict-resolution phase)
    summary: |
      `recallConsolidationCandidates` does NOT filter by `kind` — pulls
      previously-derived rows AND skill rows (kind='skill') into the
      consolidation cluster. Breaks the episodic→semantic boundary the
      pipeline is supposed to enforce.
    evidence: |
      pgvector-store.ts lines 555-577:
        ```ts
        const where: string[] = ['t_invalid IS NULL'];
        // composes user_id / session_id / agent_id only
        // — NO `kind` clause
        ```

      Consequence: after a `reflect({ conflictResolution })` run produces
      a derived memory (kind='derived'), the NEXT reflect() call pulls
      both raw episodes AND the prior derived row. LJM sees them as a
      cluster of "facts about the same subject" and may pick a derived
      memory as the keeper, soft-deleting the raw episodes. Per ADR D2
      and the plan's "episodic→semantic distillation" framing, derived
      rows should NEVER be candidates of a consolidation pass — they are
      the OUTPUT, not the input.

      Same risk for skill rows when the scope is `agent` with a repoId
      reused as agentId per ADR-0010 (RepoScope maps to agent_id).
    recommended_action: |
      Add `AND kind = 'extracted'` (or equivalent default-discriminator
      filter) to the WHERE clause in recallConsolidationCandidates. Update
      the JSDoc to make the contract explicit: "only kind='extracted' rows
      are candidates; derived + skill rows are excluded by construction".
      Mirrors the existing list()-level filter convention via composeFilters
      (line 107: `if (filters.kind !== undefined) parts.push(...)`).

