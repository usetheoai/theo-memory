reviewer_note: |
  Architecture review across 200+ files. Focus: ConflictResolutionPolicy 9th
  DIP shape, 3 impls (Noop/LWW/LJM), reflect() wiring, migration 0007 SQL
  hygiene, OTel lazy-init, demo separation, DIP boundary, naming. Read all
  files cited in finding `evidence` blocks directly; no fabrication.

  HIGH-LEVEL VERDICT: Architecture is largely sound and follows v0.4a/v0.6
  precedents faithfully. The DIP itself is clean and minimal. However, three
  areas surface real concerns:
    (1) The new `consolidation_history` table is NOT declared as a Drizzle
        pgTable in src/local/schema.ts — only the raw SQL migration + raw
        SQL queries exist. This couples the architecture to direct SQL
        forever and is a real divergence from the v0.6 / v0.4a pattern where
        every table has both forms.
    (2) `recallConsolidationCandidates` semantics + the lack of `kind`
        discriminator filtering creates a real episodic↔semantic boundary
        violation: previously-derived rows + skill rows can be pulled into
        a consolidation cluster.
    (3) Two of the production paths (src/local/index.ts at 1078 LoC,
        pgvector-store.ts at 686 LoC) blow the 500 LoC module hygiene budget
        substantially. Pre-existing inheritance from prior cycles but v0.7
        added meaningfully.

