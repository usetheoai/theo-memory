  - id: F-arch-18
    severity: INFO
    file: src/local/pgvector-store.ts
    line: 620
    plan_ref: T2.1 EC-8 atomic persist
    summary: |
      `withTransaction` wraps `persistConsolidations` correctly: dedicated
      `pool.connect()` client, BEGIN/COMMIT/ROLLBACK, client.release()
      in finally. No nesting hazards. Cancellation/rollback semantics
      match the JSDoc claim.
    evidence: |
      Lines 620-633:
        ```ts
        async withTransaction<T>(fn: (tx: PoolClient) => Promise<T>): Promise<T> {
          const client = await this.pool.connect();
          try {
            await client.query('BEGIN');
            const result = await fn(client);
            await client.query('COMMIT');
            return result;
          } catch (err) {
            await client.query('ROLLBACK');
            throw err;
          } finally {
            client.release();
          }
        }
        ```

      Canonical Node pg transaction pattern. Matches the v0.7 SDK
      iter-3 SEPA pre-RED CRITICAL #1 (dedicated client, never reuse
      pool.query). Honest.
    recommended_action: None.

