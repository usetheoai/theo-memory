summary:
  total: 10
  critical: 2
  major: 4
  minor: 2
  info: 2
  notes: |
    Three load-bearing memory-layer concerns dominate the v0.7 review:
    (1) Cosine clustering at threshold 0.95 declared by plan T2.1 is
    UNIMPLEMENTED — `recallConsolidationCandidates` pulls the entire
    active scope as a single bag. Combined with LWW's
    `kept + rejected: ALL_OTHERS` shape, this is a mass-tombstoning
    failure mode in production-shape usage (50+ memories in scope =
    49 soft-deleted on one reflect call). Tests with 2 memories do not
    catch the regression.
    (2) Voyager v0.6 supersession + v0.7 consolidation coexistence is
    NOT guarded — `recallConsolidationCandidates` does not filter
    `kind='skill'` nor `superseded_by IS NOT NULL`. A consumer that
    runs reflect() on an agent_id scope that ALSO holds a skill library
    (RepoScope per ADR-0010) risks the skill library being mass-
    tombstoned by an LWW policy.
    (3) Plan-vs-code drift: T2.1 declared the wiring lives in
    src/core/reflection/execute.ts; the actual wiring lives in
    src/local/index.ts. Functionally OK but plan + ADR D1 read as
    incorrect.
    The v0.7.1 LLM-MEASURED test methodology is honest (acknowledges
    the LWW oracle limitation) but its skipIf gate means CI/no-cost
    lanes ship without ANY LLM-quality signal.
    ADD-only invariant (ADR-0003), derived_from non-empty (T3.3
    acceptance #4), and the Letta sleeptime rejection (ADR D1) are all
    correctly honored.
