  - id: F-dom-mem-6
    severity: MAJOR
    file: src/local/pgvector-store.ts
    line: 589-617
    plan_ref: |
      T2.1 EC-8 — "the withTransactionFn wrapping t_invalid updates +
      insertConsolidationHistory MUST roll back ATOMICALLY if
      insertConsolidationHistory throws mid-transaction"
    domain_anchor: |
      ADD-only invariant (ADR-0003) means audit trail integrity is THE
      moat per blueprint R8. A half-applied state corrupts the trail.
    summary: |
      `persistConsolidations` correctly wraps the soft-delete UPDATE + the
      audit INSERT in `withTransaction`. However, the wiring at
      `src/local/index.ts:402-404` invokes `persistConsolidations` AFTER
      `executeReflection` — line 408 calls `executeReflection` which can
      throw `ReflectionLLMResponseError` on malformed LLM output (per
      execute.ts:35-40). If the consolidation phase has ALREADY persisted
      (rows soft-deleted + audit written) and THEN the executeReflection
      LLM call throws, the consolidation IS committed but no derived
      memory is written — net: rejected memories soft-deleted, no kept
      memory promoted, no derived memory added. Reads as the right
      outcome ONLY if the policy already promoted the kept candidate as
      the new "kept" row. The plan's intent at T2.1 is "consolidation
      runs BEFORE executeReflection so LLM-extraction failure paths don't
      mask the consolidation's own failure modes" — but it does not
      consider the REVERSE: extraction failure AFTER consolidation
      commits leaves consolidation intact + extraction missing, with no
      compensating action. EC-8 covers WITHIN-persistConsolidations
      rollback but NOT the wider reflect() transaction.
    evidence: |
      src/local/index.ts:374-412 wiring order:
        1. consolidate() → results
        2. persistConsolidations(results) — COMMITS soft-deletes + audit
        3. executeReflection() — can throw
        4. validateProvenance() — can throw
        5. insertDerivedMemory() — can throw mid-batch
      Steps 2 commits independently; steps 3-5 are unguarded by an outer
      transaction.
    recommended_action: |
      Option A (preferred): wrap the ENTIRE reflect() phase (consolidation
      + derivation + provenance + persist) in a single outer transaction.
      Option B: declare in ADR D2 + plan T2.1 that "consolidation is
      eventually-consistent with derivation; partial reflect() failures
      do NOT roll back the consolidation phase". Either way, the
      decision MUST be explicit + tested via a regression test
      `reflect-extraction-failure-rolls-back-consolidation.test.ts`.

