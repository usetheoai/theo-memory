findings:
  - id: F-dom-db-1
    severity: CRITICAL
    file: src/local/schema.ts
    line: 224
    plan_ref: T0.1 / ADR D3 — Migration `0007_distillation_columns.sql` adds `consolidation_history` table
    domain_anchor: architecture.md § 10.2 (`drizzle-kit push` vs `runMigrations()` conflict) + drizzle.config.ts (`schema: './src/local/schema.ts'`)
    summary: |
      schema.ts does NOT declare a `pgTable('consolidation_history', ...)` export
      while migration 0007_distillation_columns.sql + meta/0007_snapshot.json
      DO add the table. drizzle-kit's `push` command uses schema.ts as the
      schema source of truth and synchronizes the live DB to match it —
      against a v0.7-migrated DB, `npm run db:push` would produce a destructive
      DROP TABLE diff that wipes consolidation_history (and its audit rows
      tied to GDPR-compliance EC-3).
    evidence: |
      File listing schema.ts exports (lines 68, 168, 193, 209):
      ```
      export const memories = pgTable('memories', ...)
      export const reflectionCounters = pgTable('reflection_counters', ...)
      export const entities = pgTable('entities', ...)
      export const history = pgTable('history', ...)
      ```
      Notably ABSENT: `export const consolidationHistory = pgTable('consolidation_history', ...)`.

      `drizzle.config.ts` confirms: `schema: './src/local/schema.ts'`.

      Verified via grep — zero references to `consolidation_history` or
      `consolidationHistory` in schema.ts.

      Note: architecture.md § 10.2 already documents the push-flow vs migrate()
      conflict; F-T7.1-2 mitigation skips migrate() when journal absent. But
      neither mitigation prevents the DROP-on-push direction for a table
      declared in migrations but absent from schema.ts.

      The same gap exists for the v0.4a `reflection_counters` table in 0001
      and the v0.6 supersession columns in 0002 — those ARE present in
      schema.ts. The consolidation_history omission is asymmetric and
      makes the demo's `db:push` dev workflow silently destructive after
      every restart against the consolidation table.
    recommended_action: |
      Add `export const consolidationHistory = pgTable('consolidation_history', {...})`
      to src/local/schema.ts declaring all 7 columns + the 2 indexes + the
      FK with `onDelete: 'set null'`. The declaration should mirror the
      snapshot exactly (NOT NULL nullability, JSONB defaults, btree DESC
      on idx_consolidation_history_created via sql template).

      Also: add an integration test asserting `drizzle-kit push --strict --dry-run`
      produces zero schema diff against a freshly-migrated v0.7 DB —
      precedent: tests/integration/config-parity.test.ts in testing.md.

  - id: F-dom-db-2
    severity: MAJOR
    file: src/local/migrations/0007_distillation_columns.sql
    line: 31-38
    plan_ref: T0.1 / ADR D3 (FK declaration via ALTER ADD CONSTRAINT)
    domain_anchor: prior FK naming convention across 0000-0006 + 0007 snapshot (`consolidation_history_kept_memory_id_memories_id_fk`)
    summary: |
      FK constraint name mismatch between migration SQL and Drizzle snapshot.
      SQL creates `consolidation_history_kept_memory_id_fkey` (PostgreSQL-style
      `_fkey` suffix), but the snapshot expects
      `consolidation_history_kept_memory_id_memories_id_fk` (Drizzle convention
      used by every other FK in this repo: `history_memory_id_memories_id_fk`,
      `memories_superseded_by_memories_id_fk`).

      Consequence: a future `drizzle-kit generate` against the live DB would
      detect the divergence and emit a DROP/ADD pair to "fix" the name — and
      because the SQL probes for the `_fkey` suffix to decide idempotency, a
      re-run after rename would create a SECOND FK with the new name (leaving
      both live; PG allows multiple FKs on the same column pair with different
      names). The information_schema check in 0007 lines 31-32 would not see
      the new `_memories_id_fk` name and would re-add the `_fkey` constraint.
    evidence: |
      Prior FK names (all `_<table>_<col>_fk`):
      - 0000 line 42: `history_memory_id_memories_id_fk`
      - 0002 line 6: `memories_superseded_by_memories_id_fk`

      0007 SQL line 32 + 35: `consolidation_history_kept_memory_id_fkey` (PG default suffix)

      0007 snapshot line 662: `consolidation_history_kept_memory_id_memories_id_fk` (Drizzle convention)

      grep verified:
      ```
      $ grep -hE 'ADD CONSTRAINT' src/local/migrations/*.sql
      "memories_kind_derived_from_check"
      "history_memory_id_memories_id_fk"      ← Drizzle convention
      "consolidation_history_kept_memory_id_fkey"   ← DIVERGES
      "memories_superseded_by_memories_id_fk"   ← Drizzle convention
      ```

      The repair script at `scripts/db-repair-v0-7-partial-state.mjs:60`
      ALSO probes the `_fkey` name, so a hypothetical
      drizzle-kit-generated rename would render the repair-state check
      incorrect (would report FK absent when it actually exists under
      the Drizzle name).
    recommended_action: |
      Rename the FK constraint in the migration SQL + the information_schema
      probe to `consolidation_history_kept_memory_id_memories_id_fk` to match
      Drizzle's snapshot expectation + the convention used by every other FK
      in the repo. Update `scripts/db-repair-v0-7-partial-state.mjs:60` to
      probe the same name.

      No risk of breaking already-applied migrations because the v0.7 cycle
      has not shipped to consumers yet; the only live DB carrying this FK
      is the dev one which can be re-migrated.

  - id: F-dom-db-3
    severity: MAJOR
    file: src/local/migrations/0007_distillation_columns.sql
    line: 34-37
    plan_ref: T0.1 (FK declaration)
    domain_anchor: 0000_crazy_mimic.sql line 42 (`ON UPDATE no action` explicit) + 0002 line 6 (`ON UPDATE no action` explicit) + 0007 snapshot `"onUpdate": "no action"`
    summary: |
      The 0007 SQL omits `ON UPDATE NO ACTION` while every other FK in this
      repo declares it explicitly AND the 0007 snapshot expects it
      (`"onUpdate": "no action"` at meta/0007_snapshot.json:672). Functionally
      equivalent (PG defaults FK ON UPDATE to NO ACTION) but stylistically
      diverges from in-repo precedent and creates snapshot/SQL drift that a
      future `drizzle-kit generate` could "normalize" away with an unnecessary
      ALTER.
    evidence: |
      0000 line 42: `ON DELETE cascade ON UPDATE no action`
      0002 line 6:  `ON DELETE set null ON UPDATE no action`
      0007 line 37: `ON DELETE SET NULL;`  ← missing `ON UPDATE no action`
      0007 snapshot line 671-672:
      ```
      "onDelete": "set null",
      "onUpdate": "no action"
      ```
    recommended_action: |
      Append `ON UPDATE NO ACTION` to the ALTER ADD CONSTRAINT in the
      migration SQL. Both for consistency with the snapshot's explicit
      declaration AND with the in-repo convention.

  - id: F-dom-db-4
    severity: MINOR
    file: package.json
    line: scripts block
    plan_ref: T0.1 (repair script registration precedent set by v0.4b)
    domain_anchor: v0.4b `T11.1b` precedent (`db:repair-v0-4b-partial-state` registered as npm script)
    summary: |
      The v0.7 repair script `scripts/db-repair-v0-7-partial-state.mjs`
      exists at the path the runbook expects, BUT it is NOT registered as
      an npm script. The v0.4b precedent (`db:repair-v0-4b-partial-state`)
      IS registered in package.json:
      ```
      "db:repair-v0-4b-partial-state": "node scripts/db-repair-v0-4b-partial-state.mjs",
      ```
      Operators following ops muscle-memory (`npm run db:repair-...`) will
      get "missing script" instead of an actionable invocation hint. The
      runbook documents bare `node scripts/...` invocation which is
      internally consistent, but the asymmetry with v0.4b is a regression.
    evidence: |
      $ grep "db:repair" package.json
      "db:repair-v0-4b-partial-state": "node scripts/db-repair-v0-4b-partial-state.mjs",

      $ ls scripts/db-repair-v0-7-partial-state.mjs
      scripts/db-repair-v0-7-partial-state.mjs   ← exists; not in package.json

      runbook-v0-7-rollback.md line 102:
      THEOMEM_PG_URI=... node scripts/db-repair-v0-7-partial-state.mjs   ← bare node
    recommended_action: |
      Add to `package.json#scripts`:
      ```
      "db:repair-v0-7-partial-state": "node scripts/db-repair-v0-7-partial-state.mjs",
      ```

