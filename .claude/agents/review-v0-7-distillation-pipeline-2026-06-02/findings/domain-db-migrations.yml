verdict_recommendation: NEEDS_FIXES
verdict_rationale: |
  F-dom-db-1 (schema.ts gap) is CRITICAL because consumers running
  `npm run db:push` against a v0.7-migrated DB will silently lose the
  consolidation_history table + all its audit rows (which carry GDPR-survival
  regulatory data per EC-3). The fix is a small, mechanical addition to
  schema.ts that mirrors the snapshot — no behavioral change.

  F-dom-db-2 (FK naming convention) and F-dom-db-3 (missing ON UPDATE clause)
  are MAJOR because they create drizzle-kit-generate drift surface — every
  future migration cycle in this repo will detect the divergence and propose
  cleanup ALTERs that complicate the journal.

  F-dom-db-4 is a small ops UX miss (precedent regression).

  F-dom-db-5 is purely cosmetic in the runbook docs.

  F-dom-db-6 and F-dom-db-7 are POSITIVE confirmations that idempotency,
  push-flow trigger discipline, cross-migration interaction, journal sync,
  and cross-cycle dim-change cascade are all correctly handled. The migration
  is structurally sound; the gaps are at the declarative-parity layer
  (schema.ts) and the naming convention layer.
