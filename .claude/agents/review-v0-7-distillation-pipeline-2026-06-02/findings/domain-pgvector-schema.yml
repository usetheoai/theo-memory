  - id: F-dom-pgvector-4
    severity: INFO
    file: src/local/pgvector-store.ts
    line: 589-617, 620-633
    plan_ref: ADR D2 + T2.1 EC-8 (atomic rollback)
    domain_anchor: v0.6.1 `insertDerivedSkillAtomic` withTransactionFn precedent (plan T2.1 cites it)
    summary: |
      `persistConsolidations()` correctly wraps the batch of `UPDATE memories SET t_invalid = NOW()`
      + `INSERT INTO consolidation_history` operations inside a single `withTransaction()`
      call. The transaction helper is well-formed: `BEGIN` → `fn(client)` → `COMMIT`
      with `ROLLBACK` in the catch + `client.release()` in finally (lines 620-633).

      EC-8 atomicity is honored: if any iteration of the `for (const r of results)` loop
      throws (whether at the UPDATE or the INSERT step), the catch block ROLLBACKs,
      so the consumer never observes a half-applied state where some memories are
      soft-deleted but no audit rows exist (nor the inverse). The integration test
      `reflect-atomic-rollback.test.ts:75-93` exercises this contract via a spy that
      throws in `persistConsolidations` mid-batch.

      The bi-temporal column compatibility (ADR-0006) is preserved: `t_invalid = NOW()`
      uses the same write path as the v0.4b eviction soft-delete and the v0.4a
      reflection invalidation, with the additional `AND t_invalid IS NULL` guard
      preventing double-soft-delete of an already-invalidated row.

      JSONB columns (`rejected_memory_ids`, `original_episode_ids`) are serialized
      via `JSON.stringify([...r.rejectedMemoryIds])` — explicit array spread defends
      against the readonly-array contract from `ConflictResolutionResult`. The
      `::jsonb` cast on the parameter is required because pg's parameter binding
      doesn't infer JSONB from a JSON-string param.

      No reentrance concern: `persistConsolidations` is called from `reflect()`
      execute orchestration AFTER the policy's `consolidate()` returns; the policy
      runs OUTSIDE any tx (per the DIP contract — pure types only, no I/O), so
      there is no nested-tx risk.

      No defect found. Surfacing as INFO so reviewer can cross-validate the
      tx discipline used for the new persistence shape.
    evidence: |
      Lines 589-617: persistConsolidations implementation
      Line 593: this.withTransaction(async (client) => {
      Line 598: AND t_invalid IS NULL guard — defends against double-invalidation.
      Lines 620-633: withTransaction helper with BEGIN/COMMIT/ROLLBACK + finally release.
      tests/integration/distillation/reflect-atomic-rollback.test.ts:75-93 exercises rollback.
    recommended_action: No action; persistConsolidations matches the v0.6.1
      atomic-tx precedent and honors the EC-8 contract.

