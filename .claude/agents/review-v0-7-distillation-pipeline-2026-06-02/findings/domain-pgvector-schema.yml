findings:
  - id: F-dom-pgvector-1
    severity: MAJOR
    file: src/local/schema.ts
    line: 1-225
    plan_ref: ADR D3 / T0.1 + Coverage Matrix row #1 (Schema)
    domain_anchor: architecture.md § 10.2 (drizzle-kit push vs runMigrations conflict); plan T3.2 EC-11 ("npm run db:push" listed as required pre-condition for npm run eval:distillation)
    summary: |
      `consolidation_history` table is declared in migration SQL (`0007_distillation_columns.sql`)
      AND in the Drizzle journal snapshot (`meta/0007_snapshot.json:577-680`),
      BUT it is NOT declared in `src/local/schema.ts` (the canonical Drizzle pgTable source).
      This creates a silent dev-vs-prod schema drift along the documented two-path workflow.

      `drizzle.config.ts:20` points drizzle-kit at `./src/local/schema.ts`. Per
      `architecture.md § 10.2`, `drizzle-kit push` introspects the live DB and
      synchronizes the schema based on `schema.ts` — it would see
      `consolidation_history` as an "extra" table not declared in schema and
      may (a) leave it in `--strict` mode + emit a warning, or (b) in a future
      drizzle-kit version, attempt to DROP it as a destructive sync.

      The plan REQUIRES `npm run db:push` as a pre-condition for
      `npm run eval:distillation` (plan T3.2 § EC-11; docs/distillation-evaluation/README.md:48;
      docs/distillation-evaluation/run.ts:128) AND as the RED-phase setup for T0.1
      (plan line 228: "npm run db:push against fresh ankane/pgvector:v0.5.1 shows pre-migration").
      Per `package.json:76`, `db:push` chains `drizzle-kit push && node scripts/apply-trigger-migrations.mjs`
      — neither step applies SQL migration files from `src/local/migrations/0007_*.sql`.

      Consequence: an operator who follows the documented dev workflow (`db:push`)
      ends up with a database that lacks the `consolidation_history` table. The
      integration tests (forget-hard-survives-audit.test.ts, reflect-atomic-rollback.test.ts,
      reflect-empty-scope.test.ts, reflect-with-policy.test.ts, the-goal-test.test.ts)
      would all fail with `relation "consolidation_history" does not exist`.

      The only path that creates the table is `runMigrations(pool)` (called explicitly by
      `tests/integration/adapters-or-local-e2e-smoke.test.ts:50` and `tests/integration/migrations/dim-change.test.ts`,
      but NOT by the distillation integration suite which relies on the DB being
      pre-migrated externally via `PG_URI`). The distillation integration tests
      currently pass ONLY if the operator ran `runMigrations()` first; running
      `db:push` against a fresh container produces a broken state.
    evidence: |
      `src/local/schema.ts` — final export is `history` (line 209-224); no `consolidationHistory` table export.
      `grep "consolidation" src/local/schema.ts` returns zero matches.
      `package.json:76 "db:push"`: chains `drizzle-kit push && node scripts/apply-trigger-migrations.mjs` — NO migration replay step.
      `docs/distillation-evaluation/README.md:48`: documents `npm run db:push` as the migration step for eval.
      `meta/0007_snapshot.json:577`: declares `public.consolidation_history` (snapshot has it — runMigrations path works).
      `architecture.md § 10.2`: documents the orphan-schema-state mitigation but warns "Never mix the two paths".
    recommended_action: |
      Add the `consolidationHistory` pgTable declaration to `src/local/schema.ts`
      with the same column shape declared in `meta/0007_snapshot.json` (`id uuid PK`,
      `keptMemoryId uuid` with `.references(() => memories.id, { onDelete: 'set null' })`,
      `rejectedMemoryIds jsonb $type<string[]>().default([])`, `reason text NOT NULL`,
      `policyName text NOT NULL`, `originalEpisodeIds jsonb $type<string[]>().default([])`,
      `createdAt timestamptz`). Plus two btree indexes: `idx_consolidation_history_kept`
      on `keptMemoryId` and `idx_consolidation_history_created` on `createdAt DESC`.

      After adding, run `npm run db:generate` against an empty DB to verify drizzle-kit
      now considers schema in sync with migration 0007 (no diff). The new declaration
      must NOT alter the journal id chain (`0007.id` stays at the current value).

      As a defensive guard, extend `tests/integration/config-parity.test.ts` (per
      `testing.md § Typecheck scope`) to assert that every table referenced in any
      `meta/*_snapshot.json` is also declared in `schema.ts` — same shape guard that
      F-T6.1-1 motivated for tsconfig coverage.

  - id: F-dom-pgvector-2
    severity: INFO
    file: src/local/migrations/0007_distillation_columns.sql
    line: 14-42
    plan_ref: ADR D3 + EC-3 + T0.1 acceptance ("Migration file ≤ 100 LoC; uses IF NOT EXISTS guards throughout")
    domain_anchor: v0.4b T9.1 idempotency precedent + plan T0.1 "RED→GREEN-EC-3: add ON DELETE SET NULL clause"
    summary: |
      Migration `0007_distillation_columns.sql` is well-crafted for idempotency.
      Split-step pattern is documented inline:
      (a) `CREATE TABLE IF NOT EXISTS consolidation_history` declares ALL columns + PK
          but DEFERS the FK clause (lines 14-22),
      (b) a `DO $$ BEGIN IF NOT EXISTS (...catalog probe...) THEN ALTER TABLE ... ADD CONSTRAINT
          ... ON DELETE SET NULL` block adds the FK conditionally (lines 28-39),
      (c) two `CREATE INDEX IF NOT EXISTS` clauses (lines 41-42).

      The rationale (in the file's leading comment) correctly notes:
      "CREATE TABLE IF NOT EXISTS skips the whole statement when the table exists,
      dropping any embedded FK clause." This is accurate Postgres behavior and
      matches the v0.4b T9.1 precedent.

      EC-3 is honored: FK is `ON DELETE SET NULL`. EC-9 is honored: no schema
      change to `memories`. The integration test
      `tests/integration/distillation/forget-hard-survives-audit.test.ts:73`
      directly exercises this contract (FK survives hard-delete; row preserved with
      `kept_memory_id = NULL`).

      File LoC = 42 (≤ 100 budget). The migration passes the file-size budget
      asserted in plan T0.1 acceptance.

      All four idempotency invariants verified:
       1. Table create is `IF NOT EXISTS` — second run no-ops at statement level.
       2. FK constraint guarded by `information_schema.referential_constraints`
          name-lookup — second run sees the FK exists, no-ops.
       3. Both indexes `IF NOT EXISTS` — second run no-ops.
       4. Journal `_journal.json` entry IDX 7 is registered with stable hash `b1aa9b27-2026-4607-b007-c6d3e2f4abcd`; `prevId` references `0006`'s `a0af2165-11bc-40ff-a273-5495de22cbc0` — chain continuity verified.

      No defect found in the migration itself. Surfacing as INFO so reviewer
      cross-validates the audit posture.
    evidence: |
      Line 28-39: DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.referential_constraints WHERE constraint_name = 'consolidation_history_kept_memory_id_fkey') THEN ALTER TABLE ... ADD CONSTRAINT ... ON DELETE SET NULL; END IF; END $$;
      Line 16: "kept_memory_id" uuid (NULLABLE — required by ON DELETE SET NULL semantics)
      Line 17-21: JSONB columns with NOT NULL + DEFAULT '[]'::jsonb — value-stored arrays; no FK on `rejected_memory_ids` (EC-3 mitigation: survives hard-delete by construction)
      _journal.json IDX 7: tag "0007_distillation_columns" with `when: 1780341763029` — registered.
    recommended_action: No action; INFO only. Use as positive precedent for future
      v0.x migrations that need post-table FK additions for idempotency.

