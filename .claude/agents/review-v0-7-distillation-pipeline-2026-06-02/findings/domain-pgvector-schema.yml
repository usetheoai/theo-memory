  - id: F-dom-pgvector-6
    severity: INFO
    file: src/local/migrations/0007_distillation_columns.sql
    line: 14-42
    plan_ref: ADR D3 + bi-temporal compatibility (ADR-0006)
    domain_anchor: ADR-0006 bi-temporal local schema; v0.7 must honor t_valid/t_invalid semantics
    summary: |
      Bi-temporal compatibility check: `consolidation_history` itself does NOT
      have bi-temporal columns (`t_valid` / `t_invalid`) — this is CORRECT by design.
      The audit table records consolidation EVENTS (point-in-time facts: "at time T,
      policy P kept memory A and rejected memories [B,C] with reason R"), not
      bi-temporal claims about the world. Events are immutable; they don't need
      `t_valid` / `t_invalid` semantics.

      The bi-temporal contract (ADR-0006) is honored by the BUNDLED operation in
      `persistConsolidations`: the soft-delete of rejected memories via
      `UPDATE memories SET t_invalid = NOW()` uses the same v0.4b precedent for
      eviction soft-delete + matches the `BiTemporalNotSupportedLocally` rule
      (local recall does not honor `asOf` queries) because `t_invalid` is still
      filtered out by the existing `WHERE t_invalid IS NULL` guards in
      `pgvector-store.ts` search.

      The `created_at` column on `consolidation_history` is a wall-clock timestamp,
      NOT a bi-temporal `t_valid` field. The `idx_consolidation_history_created`
      index is `DESC` ordered to support "show me the most recent consolidations
      first" queries cheaply. This is the right shape.

      No defect found. Surfacing as INFO because the review prompt explicitly
      asked about bi-temporal compatibility.
    evidence: |
      Migration line 14-22: column list shows no t_valid / t_invalid — correct for an event-shape table.
      Migration line 21: created_at timestamptz NOT NULL DEFAULT NOW() — wall-clock event timestamp.
      Migration line 42: idx_consolidation_history_created btree DESC — supports recent-first audit queries.
      v0.4b soft-delete precedent: src/local/pgvector-store.ts:597 SET t_invalid = NOW() — bi-temporal contract preserved on the memories table side.
    recommended_action: No action; bi-temporal compatibility is correctly preserved
      by NOT adding t_valid/t_invalid to the audit event table.

  - id: F-dom-pgvector-7
    severity: INFO
    file: src/local/pgvector-store.ts
    line: 595-600
    plan_ref: EC-8 atomic rollback + integration test coverage
    domain_anchor: ON DELETE SET NULL behavior verification + double-invalidate idempotency
    summary: |
      The `UPDATE memories SET t_invalid = NOW() WHERE id = ANY($1::uuid[]) AND t_invalid IS NULL`
      query on line 597-599 has a subtle correctness property worth noting: the
      `AND t_invalid IS NULL` predicate makes the operation idempotent — if a
      memory was already soft-deleted (e.g., by a parallel eviction pass), the
      UPDATE is a no-op for that row, NOT an overwrite.

      This matters because the v0.7 consolidation can race with v0.4b eviction
      (both write `t_invalid` on the same memory row, potentially from different
      transactions). The idempotency guard means the first writer wins (its NOW()
      stays); subsequent writers no-op. This matches `architecture.md § 10.2`
      "Production deployments use runMigrations() against a fresh DB. Never mix
      the two paths" by NOT introducing data corruption when the operator does
      mix paths.

      No defect found. Surfacing as INFO because the cross-cutting interaction
      with v0.4b eviction soft-delete was a plausible concern that the
      implementation handled correctly.
    evidence: |
      Line 597-599: UPDATE memories SET t_invalid = NOW() WHERE id = ANY($1::uuid[]) AND t_invalid IS NULL
      The trailing `AND t_invalid IS NULL` is the load-bearing idempotency guard.
    recommended_action: No action; the guard is correctly placed and matches
      v0.4b eviction pattern.

summary: |
  pgvector-schema domain review for v0.7 distillation pipeline:
  - 1 MAJOR finding (F-dom-pgvector-1) — schema.ts ↔ migration 0007 drift will silently
    break the documented `db:push` dev workflow. Fix: add `consolidationHistory` pgTable
    declaration to `src/local/schema.ts` matching the snapshot column shape.
  - 1 MINOR finding (F-dom-pgvector-5) — missing per-column rationale comment for
    `kept_memory_id` (plan T0.1 acceptance bullet #3).
  - 5 INFO findings (F-dom-pgvector-2/3/4/6/7) confirming positive properties:
    migration idempotency well-crafted, applyDimChange cascade disclosure accurate,
    persistConsolidations atomic-tx correct, bi-temporal compatibility preserved,
    `t_invalid IS NULL` idempotency guard correctly placed against v0.4b eviction races.

  The one MAJOR finding is reachable via the documented dev workflow (eval script
  pre-conditions in docs/distillation-evaluation/README.md:48) and would surface
  as a hard test failure (`relation "consolidation_history" does not exist`)
  rather than silent corruption — so the blast radius is loud-fail-loud,
  not silent-corruption. Recommended remediation is one new pgTable export
  in schema.ts plus a config-parity regression test.

