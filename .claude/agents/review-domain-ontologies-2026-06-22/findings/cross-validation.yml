findings:
  - id: F-xval-1
    severity: MEDIUM
    file: packages/core/src/domain/extraction/entity-linking.ts
    plan_ref: T4.1 (commit b1d56c2) + blueprint ADR D3 ("entities.type carries domain types, NO migration")
    summary: >
      In-scope but architecturally-significant behavior change to the DEFAULT (no-ontology) path,
      shipped under a T4.1 commit without its own ADR. entity-linking.ts changed the LLM-entity
      persist type from a hardcoded `'PROPER'` to `e.type ?? 'PROPER'`. This is REQUIRED for the
      feature (without it, ontology-coerced domain types would be discarded at persistence — D3's
      "entities.type carries domain types" would be false in practice). BUT it ALSO changes the
      default path: when the configured LLM returns typed `entities[]` (the `useLlmEntities`
      branch) and NO ontology is set, entities now persist with the LLM's emitted type
      (PERSON/ORG/CONCEPT/...) instead of the previous constant 'PROPER'. Because the entity
      UNIQUE identity is `(scope, COALESCE(type,''), normalized_key)` (entities_scope_type_key_uq),
      pre-existing rows written as 'PROPER' will NOT dedup against new typed rows for the same
      entity — they become distinct identities. This is a real, observable change to a shipped
      surface (the slice-1/2 entity nodes), in the default path, made under the T4.1 GOAL-test
      commit.
    evidence: |
      Before: type: 'PROPER' as const  (hardcoded; slice-1/2 discarded the LLM type)
      After:  type: e.type ?? 'PROPER' (persists the LLM-emitted/ontology-coerced type)
      UNIQUE: ON CONFLICT (workspace_id, ..., COALESCE(type,''), COALESCE(normalized_key,''))
              (pg-memory-entity-store.ts:27-28) — type IS part of entity identity (EC-1).
      Blast radius assessed (NOT broken): the project's default-path integration tests
      (entities/extract.test.ts, list.test.ts) use an LLM stub WITHOUT an `entities` field, so
      they exercise the compromise FALLBACK branch (still emits 'PROPER'/'COMPOUND') and remain
      GREEN (verified: 8/8 passing vs real pgvector). The behavior change only manifests when the
      consumer's real LLM returns typed entities[].
    risk: >
      (a) NECESSARY: yes — without it the GOAL test (domain type persists) cannot pass; D3 demands it.
      (b) HONESTLY IN-SCOPE: yes — directly serves the Goal; not gratuitous scope creep.
      (c) BEHAVIOR-CHANGE RISK on the default path: YES — entity dedup identity for the LLM-entity
          path silently shifts from 'PROPER' to real LLM types. For pre-Item-15 data this means
          old 'PROPER' rows and new typed rows for the same entity no longer merge. Pre-release
          status (acceptable per CLAUDE.md), but it is an undocumented semantic change to a shipped
          feature riding inside the GOAL-test commit.
    recommended_action: >
      Document the entity-linking type-persist change as a short ADR (D5) in the plan/CHANGELOG —
      "LLM-path entities now persist their emitted/ontology-coerced type instead of the 'PROPER'
      placeholder; entity dedup identity (which includes type) therefore changes for the LLM path;
      pre-Item-15 'PROPER' rows do not retro-merge (no backfill, honest per the entity-slice
      no-backfill precedent)." Either (a) add the ADR + a one-line CHANGELOG `Changed` note, or
      (b) confirm with the owner that the pre-release breaking-change is acceptable un-ADR'd. The
      code itself is correct; the gap is documentation/traceability (Rule 3 honesty).

