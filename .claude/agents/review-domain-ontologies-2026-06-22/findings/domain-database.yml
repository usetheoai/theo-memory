most_important_finding: >
  F-dom-db-1 (HIGH): including `type` in the entity dedup UNIQUE arbiter, combined
  with the entity-linking change from a hardcoded `type='PROPER'` to `e.type ??
  'PROPER'`, changes dedup semantics for the DEFAULT no-ontology path too — the same
  entity name with a different (non-deterministic LLM) type now produces a SEPARATE
  entity row, fragmenting memory_count / the graph node / the dashboard. Needs an
  explicit accept-by-design ADR + regression test, or a decision to drop type from
  the dedup key. Not a BLOCKER (the GOAL behavior is correct and shipped surfaces
  still function) but must be consciously decided + documented before merge.
