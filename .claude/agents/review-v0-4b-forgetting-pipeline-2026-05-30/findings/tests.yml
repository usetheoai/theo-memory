    file: tests/integration/forgetting/fixtures/rare-target-seed.ts
    line: 88, 108
    plan_ref: T7.1 Tasks 1 — "Write deterministic seed fixture (1000 memories, 50 rare-tagged)"
    summary: Fixture claims "deterministic seed" in its module JSDoc + filename, but the `hash` column is populated via Math.random() (line 88 cluster members + line 108 rare targets). The embedding topology IS deterministic (cluster + rare index math), and the hash is only used to satisfy the NOT NULL `hash` column — it does not feed any assertion. Test outcomes are not affected because the recall@10 measurement depends on embedding geometry only. However, "deterministic" is a load-bearing claim for T7.3's "reproducible artifact" framing — a strict reading would have the fixture be byte-identically reproducible (e.g., `h-t7-1-cluster-${c}-${m}` with no random suffix). The current shape may also leak undetermined state if a future assertion ever reads the hash. Same pattern repeats across recall-bookkeeping.test.ts:55, guardrail-long-tail.test.ts:78/98, multiplier-integration.test.ts:157, evict-soft-delete.test.ts:51, capacity-trigger.test.ts:75, time-trigger.test.ts:100, nearest-neighbor.test.ts:55, lazy-half-life.test.ts:70 — Math.random() is used as a "uniqueness suffix" for `hash` across the entire v0.4b test surface.
    evidence: |
      grep -rn "Math.random" tests/integration/eviction tests/integration/forgetting | wc -l → 11 occurrences
      Fixture JSDoc line 2: "T7.1 deterministic seed fixture for THE GOAL TEST."
    recommended_action: Either (a) replace `Math.random().toString(36).slice(2)` with a deterministic suffix derived from the loop index (e.g., `h-t7-1-cluster-${c}-${m}-${runId}` where runId is fixed per test); OR (b) loosen the JSDoc claim from "deterministic" to "deterministic geometry, unique-suffixed hash". Acceptable as-is for correctness (no flake observed in 559-test pass; beforeEach DELETE ensures cross-run isolation), but the contract honesty per Inquebrável Rule 3 favors option (a). Track as opportunistic cleanup when these files are next touched.

  - id: F-tests-2
    severity: MAJOR
    file: docs/forgetting-evaluation/run.ts
    line: 78
    plan_ref: T7.3 Acceptance — "npm run eval:forgetting reproduces the matrix"
    summary: The "random eviction" baseline uses `Array.prototype.sort(() => Math.random() - 0.5)`, which is NOT a uniform Fisher-Yates shuffle. V8's TimSort interacts non-uniformly with a non-transitive comparator; the bias is documented quantitatively in docs/forgetting-evaluation.md § Caveats line 72-81 (observed range 0.70-0.98 vs theoretical 0.7±0.06). The artifact IS honest about this — the caveat is explicit and the locked threshold (0.70) is robust against the bias direction (the bias inflates random scores, making (d)'s perfect 1.0 a STRONGER signal of multiplier value, not weaker). Still, the "reproducible artifact" promise in CLAUDE.md Item 6 acceptance is weakened — strict reproduction of the random-row recall@10 value is impossible across runs. Caveat-documentation is a partial mitigation, not a fix.
    evidence: |
      docs/forgetting-evaluation/run.ts:78
        `const shuffled = [...allIds].sort(() => Math.random() - 0.5);`
      docs/forgetting-evaluation.md:72-81 — Caveat #1 documents the bias explicitly
    recommended_action: Replace with Fisher-Yates: `for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }`. Optionally seed via a deterministic PRNG (e.g., mulberry32 with a fixed seed) so the matrix is byte-reproducible. ~5 LoC change; preserves the honest caveat #2 and #3 that (d) is deterministic. Acceptable shipping as-is given the caveat is documented honestly and the (d) row (the load-bearing measurement) is deterministic.

