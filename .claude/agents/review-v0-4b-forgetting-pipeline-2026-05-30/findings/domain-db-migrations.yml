  - id: F-dom-db-6
    severity: INFO
    file: tests/integration/forgetting/triadic-eviction.test.ts
    line: 59
    plan_ref: v0-4b plan § T7.1 (THE GOAL TEST)
    domain_anchor: testing.md § Integration — "Real Postgres + pgvector via Docker"
    summary: >
      THE GOAL test `triadic-eviction.test.ts` and `lazy-half-life.test.ts`
      both assume the DB schema (including columns and trigger from 0003 + 0004)
      is already present — `beforeAll` only opens a Pool, does not apply
      migrations. With the F-dom-db-1 journal gap, this means the
      test ONLY passes if the dev manually applied 0003 + 0004 via psql OR
      ran `npm run db:push` (which still misses the 0004 trigger per F-dom-db-2).
      The test suite cannot serve as a regression gate for the F-dom-db-1
      production deployment failure because the test harness silently
      relies on out-of-band schema setup. This explains why CI may have been
      green on this PR despite the journal gap.
    evidence: |
      $ grep -n "beforeAll\|psql\|runMigrations\|migrations/" \
          tests/integration/forgetting/triadic-eviction.test.ts \
          tests/integration/eviction/lazy-half-life.test.ts
      # only beforeAll() opening the Pool; zero migration-apply calls.
    recommended_action: >
      Add a single integration test at `tests/integration/migrations.test.ts`
      that drops `__drizzle_migrations`, runs `runMigrations(pool)` end-to-end,
      and asserts every expected column + index + trigger from 0003 + 0004
      exists (via `information_schema.columns` + `pg_trigger` queries). This
      gate would have caught F-dom-db-1 + F-dom-db-2 automatically and
      should be a permanent regression guard going forward, not v0.4b-specific.

