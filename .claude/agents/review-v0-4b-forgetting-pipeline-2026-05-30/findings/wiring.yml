  - id: F-wire-8
    severity: INFO
    file: src/local/pgvector-store.ts
    line: 234
    plan_ref: T6.1 + ADR D17
    summary: PgvectorStore.search() correctly filters t_invalid IS NULL; soft-delete semantics are honored in the recall path
    evidence: |
      pgvector-store.ts:234 — semantic search WHERE clause: "WHERE t_invalid IS NULL${filter.sql}"
      pgvector-store.ts:297 — keyword search same guard: "AND t_invalid IS NULL${filter.sql}"

      Confirms: when (and only when) some caller writes t_invalid (via PgEvictor),
      subsequent searches will respect the soft-delete. The data path is
      correctly composed; only the producer-side wiring (F-wire-1) is dormant.
    recommended_action: |
      No action. This is positive evidence that the architectural composition
      will work end-to-end the moment F-wire-1 lands.

boundary_check:
  src_core_imports_src_local: 0   # no violations
  src_local_imports_src_cloud: 0  # cloud/ does not exist yet
  src_theokit_imports_src_local: 0
  notes: Eviction module respects DIP — TriadicScoringPolicy imports EvictionPolicy from src/core/dip/eviction-policy.js (correct direction). PgEvictor imports EvictionResult from same core DIP. No core/ → local/ leak.

concurrent_safety:
  pg_advisory_lock_used: true     # CapacityBasedTrigger + TimeBasedTrigger use pg_try_advisory_xact_lock per T5.1 EC-2
  atomic_evict: true              # PgEvictor uses single UPDATE...RETURNING (atomic) per T6.1
  notes: T5.1 advisory-lock serialization + T6.1 atomic UPDATE were both flagged in cycle-implement progress notes as architecturally correct. Spot-checked pg-evictor.ts:39-43 (single UPDATE statement, no read-modify-write race). PASS.

final_verdict: |
  Wiring triad PASS as reported by /implement-validate is HONEST under the
  precedented "defer-foundation" interpretation of pillar (a). The v0.4b
  acceptance verbatim (CLAUDE.md Item 6) is fully met. NO BLOCKER findings.

  Two MAJOR findings (F-wire-1 + F-wire-2) document the gap between "v0.4b
  acceptance met" and "v0.4b primitives reachable via public API" — that gap
  must be closed before any v0.X+1 milestone claims production-ready usage of
  forgetting, and should be tracked explicitly (CLAUDE.md roadmap entry OR
  ADR under v0.4b plan).

  One MINOR finding (F-wire-4) flags a silent-no-op trap in
  TriadicScoringPolicy.evict() that should be tightened BEFORE public wiring
  exposes consumers to it.

  Recommendation: READY_TO_MERGE conditional on:
    1. F-wire-1 and F-wire-2 resolution decisions captured in PR description
       OR plan addendum (defer to v0.4c documented vs ship inline now).
    2. F-wire-4 disposition (fix now / defer to v0.4c) acknowledged.
    3. F-wire-3, F-wire-5, F-wire-6, F-wire-7, F-wire-8 require no action.
