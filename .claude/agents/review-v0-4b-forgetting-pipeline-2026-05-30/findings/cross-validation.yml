findings:

  - id: F-xval-1
    severity: MAJOR
    file: src/core/dip/eviction-policy.ts
    plan_ref: Plan v1.2 ADR D12 (lines 78-91)
    summary: EvictionPolicy interface shape diverged from ADR D12 without an inline ADR-deviation marker
    evidence: |
      Plan ADR D12 (verbatim, line 82-91):
        export interface EvictionPolicy {
          shouldEvict(scope: ScopeFilter, currentSize: number): Promise<boolean>;
          selectVictims(scope: ScopeFilter, fraction: number): Promise<MemoryId[]>;
          evict(ids: MemoryId[]): Promise<EvictionResult>;
          scoreMemory(memory: PersistedMemory, context: ScoreContext): Promise<number>;
        }

      Actual implementation (src/core/dip/eviction-policy.ts:97-111):
        export interface EvictionPolicy {
          readonly kind: string;
          score(memory: MemoryItem, context: ScoreContext): Promise<number>;
          selectVictims(candidates: readonly MemoryItem[], fraction: number, context: ScoreContext): Promise<readonly string[]>;
          onEvictionStart?(scope: Scope, fraction: number): Promise<void>;
          onEvictionEnd?(scope: Scope, result: EvictionResult | Error): Promise<void>;
        }

      Substantive differences:
      1. `shouldEvict` REMOVED — moved into CapacityBasedTrigger.fire() + TimeBasedTrigger.tickNow() (probably the right call, but ADR D12 made shouldEvict a DIP-level concern).
      2. `evict(ids)` REMOVED from interface — exists only as a public method on the TriadicScoringPolicy class (lines 237-242). Delegated to injected Evictor. Consumers using the EvictionPolicy interface type CANNOT call evict.
      3. `scoreMemory` RENAMED to `score`.
      4. `selectVictims` signature changed: takes `candidates: readonly MemoryItem[]` (not `scope: ScopeFilter`); takes `context: ScoreContext` (not implicit).
      5. Two NEW optional lifecycle hooks added (`onEvictionStart`, `onEvictionEnd`) — these are NEVER called anywhere in the implementation (grep returns zero call sites).
      6. NEW `kind: string` discriminator field — not in ADR D12.

      The T1.1 commit body says "Interface shape (4 method entries + kind discriminator)" but does NOT explicitly cite this as a deviation from ADR D12's declared shape (which had different method names + a required `evict` on the interface). The plan's ADR D12 § Rationale (line 96) specifically defended the 4-method shape: "4 methods separate the lifecycle: decision (shouldEvict), selection (selectVictims), execution (evict), scoring (scoreMemory exposed for testing)." That rationale is now stale; the shipped interface only directly exposes 2 of those concerns.
    recommended_action: |
      Either (a) add an ADR D19 to the plan documenting the interface-shape decision
      (rationale: triggers absorb shouldEvict; evict moves to TriadicScoringPolicy class via Evictor
      DIP; score/scoreMemory rename per ScoreContext signature), OR (b) tighten the EvictionPolicy
      interface back to match ADR D12 verbatim. Path (a) is honest absorption per cycle-plan.md
      pattern; path (b) is needless rework. The onEvictionStart/onEvictionEnd hooks should also be
      either WIRED in (CapacityBasedTrigger could call them) OR REMOVED (currently they are
      dead code on the interface — see F-xval-2 below).

  - id: F-xval-2
    severity: MINOR
    file: src/core/dip/eviction-policy.ts (lines 108-110)
    plan_ref: ADR D12 4-method shape
    summary: Optional lifecycle hooks `onEvictionStart` / `onEvictionEnd` declared on interface but NEVER invoked anywhere in src/
    evidence: |
      The interface declares two optional hooks:
        onEvictionStart?(scope: Scope, fraction: number): Promise<void>;
        onEvictionEnd?(scope: Scope, result: EvictionResult | Error): Promise<void>;

      grep -rn "onEvictionStart\|onEvictionEnd" src/ returns ZERO call sites outside the interface
      definition itself. CapacityBasedTrigger.fire() and TimeBasedTrigger.tickNow() never invoke
      them. TriadicScoringPolicy doesn't implement them.

      Per the no-paper-names-in-code.md style rule + KISS + YAGNI, optional methods on an interface
      that have zero callers AND zero implementations are dead surface area. They were apparently
      added to compensate for the removal of `shouldEvict` + `evict` from the original 4-method
      ADR D12 shape, but the triggers never wired them.
    recommended_action: |
      Either (a) wire CapacityBasedTrigger.fire() and TimeBasedTrigger.tickNow() to invoke
      onEvictionStart before the COUNT+evict path AND onEvictionEnd after the UPDATE returns
      (5-10 LoC each), enabling consumers to inject telemetry/audit policies, OR (b) remove
      the two optional methods from the interface. Decision can ride alongside F-xval-1's
      ADR D19.

  - id: F-xval-3
    severity: MAJOR
    file: src/local/index.ts
    plan_ref: Plan v1.2 § Global Definition of Done > Wiring triad > (a) line 1089
    summary: Global DoD wiring-triad pillar (a) verbatim — "TriadicScoringPolicy referenced in src/local/index.ts user-facing barrel" — is UNMET
    evidence: |
      Plan Global DoD line 1089 (verbatim):
        "(a) Static caller: `TriadicScoringPolicy` referenced in `src/local/index.ts` user-facing barrel"

      Actual state of src/local/index.ts:
        $ grep -n "TriadicScoring\|CapacityBased\|TimeBased\|PgEvictor\|EvictionPolicy\|eviction" src/local/index.ts
        (no matches)

      The TriadicScoringPolicy / CapacityBasedTrigger / TimeBasedTrigger / PgEvictor /
      PgNearestNeighborProvider / PgHalfLifePersister are NOT exported via the user-facing barrel.
      A consumer doing `import { ... } from '@usetheo/memory'` cannot reach any v0.4b symbol.

      The validation report at .claude/knowledge-base/reviews/v0-4b-forgetting-pipeline-implement-validate-2026-05-30.md
      claims pillar (a) PASS with "6 pass + 8 defer-foundation" but the 6 PASS are all internal
      callers (triggers consuming TriadicScoringPolicy; tests invoking it directly). The plan's
      verbatim acceptance was specifically "user-facing barrel" — the consumer-facing surface.

      The T8.1 commit body acknowledges this reframing ("8 tasks marked defer-foundation via
      documented absorption pattern — consumer tasks wire the symbol; T6.1/T7.1 satisfy the chain")
      but the validation gate's PASS verdict is over-strong: the user-facing barrel was named
      specifically because the Global DoD wanted v0.4b to be reachable from outside the eviction
      subtree. As-shipped, a consumer would have to import directly from
      `src/local/eviction/triadic-scoring-policy.ts` — a deep-path import that the user-facing
      barrel was meant to abstract over.
    recommended_action: |
      Either (a) export the v0.4b public surface via src/local/index.ts (single new export block:
      `export { TriadicScoringPolicy, type TriadicWeights, type TriadicConstants } from './eviction/triadic-scoring-policy.js';`
      plus triggers + Pg* impls), satisfying the Global DoD verbatim — likely a 10-15 LoC change.
      OR (b) revise the Global DoD entry to reflect the "consumer of the consumer" interpretation
      shipped at T8.1 — but this is a CONTRACT softening that requires user approval.
      Path (a) preferred — small, mechanical, honors the plan.

