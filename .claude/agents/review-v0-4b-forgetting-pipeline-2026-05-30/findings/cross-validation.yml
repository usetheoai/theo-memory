  - id: F-xval-8
    severity: INFO
    file: src/local/eviction/triadic-scoring-policy.ts
    plan_ref: T2.1 § Deep Dives line 479
    summary: T2.1 recency formula sign typo in plan absorbed with explicit documentation
    evidence: |
      Plan T2.1 § Deep Dives line 479 declares `recency = 1 - 2^(-Δ/h)`.
      Implementation (line 152): `return Math.pow(2, -deltaSeconds / halfLifeSeconds);` — i.e.,
      `recency = 2^(-Δt/h)` WITHOUT the `1 -` prefix.

      The plan's adjacent RED test names (line 497-499) demand:
        test_recency_zero_when_last_accessed_null
        test_recency_approaches_one_for_just_accessed
        test_recency_approaches_zero_for_long_idle
      which require the impl form (high score = recently accessed). With `1 - 2^(-Δ/h)`,
      just-accessed would give 0 (close to formula) → test would fail.

      T2.1 commit body (553cc20) explicitly documents the typo absorption: "PLAN DEFECT
      absorbed: plan T2.1 § Deep Dives line 479 declares `recency = 1 - 2^(-Δ/h)` which
      contradicts adjacent RED test names... Implemented as `recency = 2^(-Δt/h)` (no `1 -`)
      which matches the tests + the 'higher score = more valuable, less likely to be evicted'
      contract."
    recommended_action: Update plan T2.1 § Deep Dives line 479 to `recency = 2^(-Δt/h)` in
      a plan-archival commit so future re-reads cite the correct formula.

  - id: F-xval-9
    severity: INFO
    file: src/local/eviction/triadic-scoring-policy.ts (long-tail multiplier)
    plan_ref: T4.2 § Deep Dives line 712
    summary: T4.2 plan-prose "LOWER multiplier = STRONGER protection" inversion absorbed via convention switch
    evidence: |
      Plan T4.2 § Deep Dives line 712 reads "LOWER multiplier = STRONGER protection (lower
      eviction-score = stays longer)" which assumes EVICTION-SCORE convention (LOW = stays).

      T2.1 ships VALUE-SCORE convention (HIGH = stays). T4.2 implementation (line 257-276 +
      278-315) ships the multiplier formula `clamp(0.1, 1.0, isolation/mean_isolation)` and
      multiplies the value score by it. Under value-score convention, LOWER multiplier =
      LOWER final score = MORE likely to be evicted — the opposite of plan prose framing,
      but the OUTCOME is correct (clustered → low isolation → low multiplier → low score →
      evicted; isolated → high isolation → high multiplier → high score → survives).

      T4.2 commit body (044e16c) documents the prose-inversion absorption explicitly: "PLAN
      PROSE INVERSION absorbed... The formula produces correct long-tail protection in EITHER
      convention — clustered memories get penalized into the victim band; isolated memories
      survive at baseline."

      THE GOAL TEST result (recall@10 = 1.000) confirms the behavior is correct end-to-end.
    recommended_action: Update plan T4.2 § Deep Dives line 712 to align with the shipped
      value-score convention.

  - id: F-xval-10
    severity: INFO
    file: docs/forgetting-evaluation.md
    plan_ref: T7.3 § Deep Dives line 973 (4-row matrix)
    summary: docs/forgetting-evaluation.md matrix shows (b)/(c)/(a) all at 0.960 — collapse caveat honestly disclosed
    evidence: |
      Plan T7.3 expected a matrix that "VALIDATES the multiplier's contribution honestly" via
      4 strategies: (a) random, (b) pure LRU, (c) triadic no multiplier, (d) triadic + multiplier.

      Observed (docs/forgetting-evaluation.md lines 65-68):
        (a) random:                                0.960 (48/50)
        (b) pure LRU (uniform last_accessed → collapses to random):  0.960
        (c) triadic, no multiplier (uniform base → collapses to random):  0.960
        (d) triadic + multiplier:                  1.000 (50/50)

      Why (b)/(c) collapse: uniform-base-score seed means LRU and pure-triadic have no
      information to rank candidates on; selectVictims picks arbitrary 30%. The matrix
      genuinely VALIDATES the multiplier's contribution (1.000 vs 0.960 = 2 saved rare
      targets per pass) but the differential between (d) and (a)/(b)/(c) is smaller than
      expected because (a) baseline benefits from the test fixture's sort-not-shuffle
      determinism.

      The doc transparently discloses this in lines 75-80: "for a rigorous random baseline,
      replace the sort with Fisher-Yates. The observed 0.96 is on the high tail because
      [seed is sort-order-deterministic]. (d) achieves the perfect 1.0 every run because
      the multiplier is [topology-deterministic]."

      Honesty signal: the differential exists + is documented + is reproducible. Item 6
      acceptance does NOT require differential > X; just recall@10 ≥ 0.70. (d) at 1.000 meets.
    recommended_action: None — honest disclosure satisfies Inquebrável Rule 3.

