agent: review-v0-4b-forgetting-pipeline-architecture
review_target: main..HEAD for plan v0-4b-forgetting-pipeline
plan: .claude/knowledge-base/plans/v0-4b-forgetting-pipeline-plan.md
summary: |
  v0.4b forgetting pipeline lands with the DIP boundary clean (src/core/dip/eviction-policy.ts is pure
  types; src/local/* concrete impls correctly import from core, not the other way around). The Strategy +
  Adapter patterns are applied honestly and the MemoryItem extension is verifiable via the locked-shape
  test-d.ts (4 new fields, all optional+nullable, backward-compat preserved). Real architectural debt
  surfaces in three areas: (1) TriadicScoringPolicy has a 5-positional-optional-param constructor that
  callers already invoke as `new TriadicScoringPolicy(undefined, undefined, null, null, evictor)` — the
  call-site shape is the smell SOLID predicts and warrants refactor before the public surface lands
  (CRITICAL); (2) two collaborator interfaces (HalfLifePersister, NearestNeighborProvider) are declared
  inside src/local/eviction/triadic-scoring-policy.ts, the file of their primary CONSUMER — this is a
  DIP inversion (concrete depends on abstraction, but the abstraction LIVES with the concrete) and
  should move to src/core/dip/ alongside their sibling EvictionPolicy interface (MAJOR); (3) the two
  trigger classes (CapacityBasedTrigger + TimeBasedTrigger) duplicate ~60 LoC each of identical
  ScopeCandidateRow + rowToMemoryItem + candidate-fetch SQL + soft-delete SQL — load-bearing DRY
  violation that will compound when a third trigger lands (MAJOR). Two further architectural concerns
  surface: (4) triggers hardcode `WHERE agent_id = $1` and accept `scopeId: string`, silently dropping
  the User/Session tiers of the locked 3-tier scope contract (MAJOR — partial impl of architecture.md
  § 1); (5) the v0.4b classes are NOT wired into createLocalMemory and have no barrel export — the
  pipeline ships unreachable from the public surface (MAJOR — overlaps wiring reviewer's scope).
findings:
  - id: F-arch-1
    severity: CRITICAL
    file: src/local/eviction/triadic-scoring-policy.ts
    line: 214
    plan_ref: T2.1 + T4.1 + T6.1 (TriadicScoringPolicy constructor evolution)
    summary: |
      TriadicScoringPolicy constructor takes 5 positional optional/nullable parameters
      (weights, constants, halfLifePersister, neighborProvider, evictor); callers already exhibit
      the SOLID smell with `new TriadicScoringPolicy(undefined, undefined, null, null, evictor)`
      and `new TriadicScoringPolicy(undefined, undefined, null, neighborProvider, evictor)` —
      positional placeholders defeat readability + force every future collaborator addition to
      either break call sites or extend the param list (SRP + OCP + ergonomics regression).
    evidence: |
      ```ts
      // src/local/eviction/triadic-scoring-policy.ts:214
      constructor(
        weights: TriadicWeights = DEFAULT_TRIADIC_WEIGHTS,
        constants: TriadicConstants = DEFAULT_TRIADIC_CONSTANTS,
        halfLifePersister: HalfLifePersister | null = null,
        neighborProvider: NearestNeighborProvider | null = null,
        evictor: Evictor | null = null,
      ) { ... }

      // tests/integration/eviction/evict-soft-delete.test.ts:67
      policy = new TriadicScoringPolicy(undefined, undefined, null, null, evictor);

      // tests/integration/forgetting/triadic-eviction.test.ts:64
      policy = new TriadicScoringPolicy(undefined, undefined, null, neighborProvider, evictor);
      ```
    recommended_action: |
      Refactor to a single options-object constructor:
        ```ts
        export interface TriadicScoringPolicyOptions {
          readonly weights?: TriadicWeights;
          readonly constants?: TriadicConstants;
          readonly halfLifePersister?: HalfLifePersister | null;
          readonly neighborProvider?: NearestNeighborProvider | null;
          readonly evictor?: Evictor | null;
        }
        constructor(options: TriadicScoringPolicyOptions = {}) { ... }
        ```
      Call sites become `new TriadicScoringPolicy({ evictor })` /
      `new TriadicScoringPolicy({ neighborProvider, evictor })` — readable, append-only
      forward, no positional shifting. Update the 8 production+test call sites in the same PR.
      Add an ADR row to the plan documenting the options-object convention as the policy
      for future EvictionPolicy collaborators.
