findings:
  - id: F-dom-1
    severity: CRITICAL
    file: src/local/eviction/capacity-based-trigger.ts
    line: 142
    plan_ref: "plan T5.1 § Deep Dives + ADR-0002 + ADR-0010"
    domain_anchor: "architecture.md § 1 — three-tier scope User/Session/Agent (+ Repo for skills via agent_id mapping)"
    summary: >
      CapacityBasedTrigger silently drops User-scope + Session-scope memories
      from eviction. The COUNT + candidate SELECT both filter exclusively
      `WHERE agent_id = $1 AND t_invalid IS NULL`; user_id-scoped and
      session_id-scoped scopes are NEVER counted, NEVER selected as candidates,
      and therefore NEVER evicted. `scopeId: string` collapses the typed
      Scope discriminated union into one stringly-typed parameter without a
      `kind` discriminator. The same defect is reproduced in
      `time-based-trigger.ts` (lines 188-196) and the partial index
      `idx_memories_eviction_score` in migration 0003 (line 4: keyed on
      `agent_id`). This is a contract violation of three-tier scope
      (ADR-0002): a User-scope memory that should be evicted by capacity
      grows unbounded silently. The plan goal text repeatedly says
      "per-scope" / "in one scope" without a tier qualifier, and ADR D17
      cross-references ADR-0006 (which is tier-uniform). Either the runtime
      MUST honor the three tiers (preferred — implies refactoring
      `scopeId: string` → typed `Scope` + scope-key-aware SQL) OR the plan
      MUST add an explicit ADR declaring agent-tier-only restriction at
      v0.4b with a roadmap note for User/Session tiers at v0.4c+.
    evidence: |
      capacity-based-trigger.ts L140-160:
        const countResult = await client.query(
          `SELECT COUNT(*)::text AS count
             FROM memories
            WHERE agent_id = $1
              AND t_invalid IS NULL`,
          [scopeId],
        );
        ...
        WHERE agent_id = $1 AND t_invalid IS NULL  (candidate SELECT, same)

      time-based-trigger.ts L188-196: identical agent_id-only filter.

      migrations/0003_eviction_columns.sql L4:
        CREATE INDEX ... ON "memories" USING btree ("agent_id","last_accessed_at")
        WHERE "t_invalid" IS NULL

      Architecture says three tiers; impl honors only one. RepoScope works
      because it maps to agent_id internally (ADR-0010); User/Session do not.
    recommended_action: >
      Either (preferred) refactor triggers to accept `Scope` (the typed
      discriminated union) and derive the WHERE clause via
      `filtersFromScope` shape — matching how `pgvector-store.search()`
      already composes filters — OR add an explicit ADR D19 declaring
      "v0.4b eviction is agent-tier-only (User/Session deferred to v0.4c)"
      AND constructor-validate that the caller supplied an agent-scope
      identifier, throwing a typed error on misuse. Bump the public-copy
      framing in CLAUDE.md Item 6 + docs/forgetting-evaluation.md to declare
      the tier restriction honestly per Inquebrável Rule 3.

