  - id: F-dom-5
    severity: MAJOR
    file: src/local/eviction/triadic-scoring-policy.ts
    line: 271
    plan_ref: "Blueprint D9 + plan T4.2 § Deep Dives line 712"
    domain_anchor: "blueprint D9 — long-tail multiplier semantics; OPEN PROBLEM #1 claim"
    summary: >
      The long-tail multiplier (blueprint D9) is the ONLY mechanism that
      makes v0.4b "ship the OPEN PROBLEM #1 solution." The current
      implementation only ENGAGES the multiplier for scopes whose
      memories carry `kind: 'agent'` or `kind: 'repo'` per
      `getNeighborScopeId` (L109-117): `user` and `session` scopes return
      `null`, which causes `computeProtectionMultiplier` (L304-307) to
      short-circuit to `MAX_PROTECTION_MULTIPLIER` (1.0 — no penalty).
      Combined with F-dom-1 (User/Session never reach the trigger anyway)
      the deficiency is not user-visible today, but the JSDoc on
      `NearestNeighborProvider.distance(memoryId, agentId)` bakes the
      tier limitation into the DIP shape — `agentId: string` instead of
      a generic scope key. This means even if F-dom-1 is fixed at the
      trigger level, the multiplier remains agent-only. The CLAUDE.md
      framing "OPEN PROBLEM #1 — no competitor solved this" is therefore
      weaker than advertised: TheMemory ships triadic + multiplier ONLY
      for one of three tiers. Honest framing requires either fixing the
      tier coverage OR scoping the claim ("v0.4b solves long-tail
      preservation in the agent-tier surface; User/Session tiers will land
      in v0.4c per ADR-X").
    evidence: |
      triadic-scoring-policy.ts L109-117:
        function getNeighborScopeId(scope: MemoryItem['scope']): string | null {
          if (scope.kind === 'agent') return scope.agentId;
          if (scope.kind === 'repo') return scope.repoId;
          return null;   // ← user + session collapse to null
        }

      Same file L302-307:
        const scopeId = getNeighborScopeId(memory.scope);
        if (scopeId === null) {
          return MAX_PROTECTION_MULTIPLIER;  // ← no protection penalty
        }

      NearestNeighborProvider DIP shape (L94-96):
        distance(memoryId: string, agentId: string): Promise<number>;
        ← `agentId: string` baked into the interface signature.
    recommended_action: >
      (1) Either generalize `NearestNeighborProvider.distance(memoryId,
      scope: Scope)` to accept the typed scope union, OR keep the
      restriction and rename the parameter (`scopeKey: string`) plus
      `getNeighborScopeId` should fall back to userId/sessionId when
      present (the schema columns exist).
      (2) Adjust the CLAUDE.md Item 6 framing + docs/forgetting-evaluation.md
      to honestly scope the OPEN PROBLEM #1 claim to the agent tier at
      v0.4b, with a roadmap pointer to tier expansion.

