  - id: F-dom-3
    severity: MAJOR
    file: src/local/index.ts
    line: 430
    plan_ref: "ADR D17 — 'forget() public API (v0.1) ALSO uses t_invalid UPDATE (already true) — auto-eviction is consistent with caller-driven forget'"
    domain_anchor: "ADR-0006 bi-temporal local schema + ADR D17 soft-delete; architecture.md § 4 ADD-only"
    summary: >
      ADR D17 § Consequences asserts: "forget(id) public API (v0.1) ALSO uses
      t_invalid UPDATE (already true) — auto-eviction is consistent with
      caller-driven forget." This is FALSE in the shipped runtime.
      `LocalScopedMemory.forget()` at src/local/index.ts:430 calls
      `vectorStore.delete(memoryId)`, which at the pgvector adapter
      (pgvector-store.ts:345-347) issues `DELETE FROM memories WHERE id = $1`
      — physical delete, no `t_invalid` UPDATE, no RETURNING audit trail,
      no `MemoryNotFound` separation between already-deleted vs missing.
      Caller-driven forget therefore PERMANENTLY drops the audit row,
      while auto-eviction (PgEvictor) keeps it. The "bi-temporal local
      schema" promise in ADR-0006 is half-honored: schema has the columns,
      forget() bypasses them. This also creates an asymmetry consumers
      cannot reason about: a row evicted via CapacityBasedTrigger is
      recoverable via raw `SELECT WHERE t_invalid IS NOT NULL`, but the
      same row evicted via caller's `memory.forget(id)` is gone forever.
    evidence: |
      src/local/index.ts L424-444:
        async forget(memoryId: string, options?: ForgetOptions): Promise<void> {
          ...
          await this.config.vectorStore.delete(memoryId);  // ← physical
          ...
        }

      src/local/pgvector-store.ts L345-347:
        async delete(vectorId: string): Promise<void> {
          await this.pool.query('DELETE FROM memories WHERE id = $1', [vectorId]);
        }

      ADR D17 § Consequences:
        "forget(id) public API (v0.1) ALSO uses t_invalid UPDATE (already true)"
        ← contradicts the shipped code.

      MemoryItem.tInvalid JSDoc (core/memory-item.ts L38):
        "Set by forget(id) (soft delete)." ← also false.
    recommended_action: >
      Refactor `LocalScopedMemory.forget()` to issue the same soft-delete
      UPDATE as `PgEvictor.evict()` — preferably by delegating to a shared
      `evict()` primitive on a `VectorStore` extension or by injecting
      `PgEvictor` into `LocalMemoryConfig`. Update the JSDoc on
      `MemoryItem.tInvalid` and the wording of ADR D17 § Consequences if
      the contract is intentionally split (caller-driven = hard delete,
      trigger-driven = soft delete), OR fix the implementation if the
      contract is what ADR D17 claims. Both options are valid; pick one
      and document the chosen split. Add an integration test asserting
      the post-state of forget() (physical absence vs t_invalid set).

