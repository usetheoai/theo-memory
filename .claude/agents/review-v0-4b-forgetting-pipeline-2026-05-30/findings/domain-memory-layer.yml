  - id: F-dom-9
    severity: MINOR
    file: src/local/index.ts
    line: 460
    plan_ref: "ADR-0002 three-tier scope"
    domain_anchor: "ADR-0002 + memory-item.ts L19-20 scope discriminated union"
    summary: >
      `LocalScopedMemory.get(memoryId)` hard-codes `scope: { kind: 'user',
      userId: String(result.payload['user_id'] ?? '') }` regardless of
      what the row actually carries (agent_id / session_id). This is a
      v0.1 defect, NOT introduced by v0.4b, but the v0.4b code path
      depends on it: the TriadicScoringPolicy reads `memory.scope` to
      derive the nearest-neighbor scope key in `getNeighborScopeId`. If
      v0.4b ever broadens (per F-dom-1) to accept rows fetched via
      `get()`, scope misidentification will silently route an agent
      memory through the user-tier nearest-neighbor query (which
      returns 0 rows → multiplier = 1.0). Surfacing here because
      F-dom-5's expansion path will trip over it.
    evidence: |
      src/local/index.ts L446-462:
        async get(memoryId: string): Promise<MemoryItem | null> {
          const result = await this.config.vectorStore.get(memoryId);
          if (result === null) return null;
          return {
            ...
            scope: { kind: 'user', userId: String(result.payload['user_id'] ?? '') },
                  // ↑ always user, regardless of stored agent_id/session_id
            ...
          };
        }
    recommended_action: >
      Reconstruct the Scope discriminated union from the row's payload
      (`agent_id` if present → agent; `session_id` → session; otherwise
      user). Pattern already exists in `capacity-based-trigger.ts`
      L65-70 (`rowToMemoryItem`) — extract it to a shared helper and
      reuse in `get()`. Out of v0.4b scope but blocks the tier-expansion
      path opened by fixing F-dom-1.

  - id: F-dom-10
    severity: INFO
    file: src/local/eviction/triadic-scoring-policy.ts
    line: 237
    plan_ref: "ADR D17 + EvictionPolicy DIP shape"
    domain_anchor: "DIP method-count semantics (ADR-0008 spirit) + KISS"
    summary: >
      `TriadicScoringPolicy.evict()` (L237-242) delegates to the injected
      `Evictor` — which is good composition — but `evict` is NOT part of
      the `EvictionPolicy` DIP declared at
      `src/core/dip/eviction-policy.ts` (the DIP shape declares only
