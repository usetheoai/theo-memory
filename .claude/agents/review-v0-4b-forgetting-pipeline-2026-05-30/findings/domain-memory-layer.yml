      cross-talk through the concrete type. INFO severity because it
      may be intentional staging (the DIP declared evict as future
      hook), but the asymmetry deserves a clarifying ADR row OR
      removal of the impl method to keep the DIP+impl boundary clean.
    evidence: |
      eviction-policy.ts L97-111 (DIP shape): no `evict` method.
      triadic-scoring-policy.ts L237-242 (extra method on the impl).
      capacity-based-trigger.ts L168-173: issues UPDATE inline; does
      NOT call `policy.evict(victimIds)`.
    recommended_action: >
      Decide: either lift `evict` into the EvictionPolicy DIP (declare
      it as the 5th method; bump the v0.4b ADR D12 method count from
      4 to 5) OR remove `evict` from TriadicScoringPolicy and route
      eviction strictly through the injected `Evictor` from the
      trigger. The current state is "half-public" which makes
      future refactors brittle.

