findings:
  - id: F-tests-1
    severity: MINOR
    file: tests/integration/publish-readiness.test.ts
    line: n/a (not edited)
    plan_ref: T2.1 § Edge Case Review EC-5 (SHOULD TEST)
    summary: >
      EC-5 SHOULD TEST not absorbed — publish-readiness.test.ts was NOT extended
      to assert that `npm pack --dry-run` tarball contains the new subpath files
      (src/embedders/stub.ts, src/embedders/index.ts, src/llms/stub.ts,
      src/llms/index.ts).
    evidence: |
      grep -n 'embedders/stub\|llms/stub\|embedders/index\|llms/index' \
        tests/integration/publish-readiness.test.ts
        -> 0 matches
      Plan EC-5 wording: "extender para também grep `npm pack --dry-run` por
      src/embedders/stub.ts + src/llms/stub.ts + src/embedders/index.ts +
      src/llms/index.ts. Garante que `files` array em package.json não exclui
      acidentalmente."
      The manual `npm publish --dry-run` at T4.1 verified ONCE; the recurring
      regression guard against accidental `files` array edits is absent.
    recommended_action: >
      Add 4 assertions to tests/integration/publish-readiness.test.ts that the
      pack manifest includes the 4 new files. ~6 lines of code, prevents
      regressions from future package.json edits.

  - id: F-tests-2
    severity: MINOR
    file: src/embedders/__tests__/stub.test.ts
    line: 58-64
    plan_ref: T1.1 § Acceptance Criteria + testing.md § Determinism
    summary: >
      EC-1 stress test seeds its 1000 inputs with `Math.random()`, violating
      testing.md § Determinism ("No flaky tests" / "Embeddings in unit tests use
      deterministic fixtures"). The test exercises DIFFERENT inputs every run.
    evidence: |
      grep -n 'Math.random' src/embedders/__tests__/stub.test.ts
        -> 61:      const v = await embedder.embed(`text-${i}-${Math.random().toString(36)}`);

      testing.md § Determinism: "No flaky tests. A failing test is a bug with
      maximum priority; fix or delete, never @skip."
    recommended_action: >
      Replace `Math.random().toString(36)` with a deterministic generator
      (e.g., `seedFromText(i)` via a tiny LCG or just `String(i)`-based suffix).
      The NaN-guard tests existential property — "no input ever produces NaN" —
      is better served by a deterministic enumeration than by a random sample
      whose seed varies per CI run. Failure-mode probability (~2^-128) means
      flakiness is practically impossible, but the rule is rule.

  - id: F-tests-3
    severity: MINOR
    file: src/llms/__tests__/stub.test.ts
    line: 40, 47
    plan_ref: testing.md § Anti-patterns ("Tests that only assert structure")
    summary: >
      Two `it` blocks assert `typeof r.content` is "string" without asserting an
      actual content value. The "returns LLMResponse with role=assistant" test
      gives partial coverage (role=assistant is a concrete value), but the
      content-typeof check is the kind of structural-only assertion testing.md
      bans. Same issue at line 47 for the empty-messages variant.
    evidence: |
      L40:    expect(r.role).toBe('assistant');
      L41:    expect(typeof r.content).toBe('string');

      testing.md anti-pattern: "Tests that only assert structure
      (`expect(result).toBeDefined()`) — assert actual behavior with explicit
      values."
    recommended_action: >
      Replace `expect(typeof r.content).toBe('string')` with
      `expect(r.content).toMatch(/^stub-response:[0-9a-f]{4}$/)` to assert the
      ADR D3 contract (`"stub-response:<hex-tag>"` format with 4-hex-char tag).
      That's the actual observable behavior; the typeof check is a tautology
      since TypeScript already guarantees `content: string` on `LLMResponse`.

  - id: F-tests-4
    severity: INFO
    file: src/embedders/__tests__/exports.test.ts + src/llms/__tests__/exports.test.ts
    line: 13
    plan_ref: testing.md § Anti-patterns ("Tests that only assert structure")
    summary: >
      The smoke tests use `expect(...).toBeDefined()` which testing.md flags as
      a structure-only assertion. In context this is the appropriate idiom for a
      "barrel re-exports symbol X" smoke test (there's no behavior beyond
      module-resolution); a stricter `toBe(FromStub)` follow-up immediately
      checks identity, which IS behavior. Combined, the pair gives enough
      signal. INFO-only — not a fix request, just flagged for transparency.
    evidence: |
      L12-13:  it('barrel re-exports DeterministicStubEmbedder', () => {
      L13:       expect(barrel.DeterministicStubEmbedder).toBeDefined();
    recommended_action: >
      None required. The structural assertion at L13 is followed at L17 by
      `expect(barrel.X).toBe(FromStub)` which closes the behavior gap. Leave
      as-is.

  - id: F-tests-5
    severity: INFO
    file: examples/chat-with-memory/lib/memory.ts
    line: 157-161
    plan_ref: T3.1 + plan § ADR D5 "RED n/a"
    summary: >
      T3.1 demo env-wiring shipped with ZERO automated test coverage — plan
      ADR D5 explicitly states "ADR D5 of previous cycle — demo has no unit-test
      infra; manual boot verification". The fallback is the manual smoke test in
      T4.1 § "Optional manual smoke". Out-of-scope for this cycle per the plan
      itself, but worth tracking for the adapters portfolio roadmap: as more
      adapter swap-paths land in the demo, manual smoke alone will not scale.
    evidence: |
      git log --oneline 1d0a373..HEAD -- examples/chat-with-memory/
        -> b88105c feat(examples)(adapters)(cycle-1)... (no test file)
      Validation report (2a149d7) line for T3.1: "Manual smoke deferred (per
      ADR D5)".
    recommended_action: >
      None for this cycle (plan exempted). For the next adapters cycle, consider
      adding a minimal Vitest config under examples/chat-with-memory/ to assert
      `resolveAdapters()` returns `source: "stub"` when env is set and
      `source: "openai"` when unset — pure-function unit test, no Next.js boot
      required.

  - id: F-tests-6
    severity: INFO
    file: src/embedders/__tests__/stub.test.ts
    line: 42-49
    plan_ref: T1.1 § Acceptance Criteria
    summary: >
      The L2 norm test ("returns L2-normalized unit vector OR all-zeros fallback
      (EC-1)") uses an OR-branched assertion `norm === 0 || abs(norm-1)<1e-6`.
      For the deterministic input "test", only ONE branch can be true on any
      given run; the test passes regardless of which. This is a weak assertion
      in the sense that a regression that flips the "test" embedder output to
      all-zeros (EC-1 fallback) would pass silently when in fact the correct
      behavior on a non-degenerate input is to return a unit vector. Better:
      two tests — one asserts `norm ≈ 1.0` on a normal input (e.g., "test"),
      another asserts `norm === 0` only on a verified degenerate input (via a
      controlled stub of the LCG or by direct unit-test of `l2Normalize`).
    evidence: |
      L42-49: the OR branch lets either outcome pass. Plan acceptance criterion
      reads: "Returned array L2 norm === 1.0 within `1e-6` tolerance OR
      all-zeros (EC-1 fallback)." So this satisfies the AC literally, but the
      OR semantics weaken the regression guard.
    recommended_action: >
      Split into two tests: (1) for a known non-degenerate input, assert
      `norm` is within 1e-6 of 1.0 strictly (no OR). (2) For the EC-1 path,
      either inject a controlled all-zero LCG output or unit-test the
      `l2Normalize` helper directly (extract it as a named export from stub.ts
      or move to a small helper module). Tightens the regression net without
      changing behavior.

