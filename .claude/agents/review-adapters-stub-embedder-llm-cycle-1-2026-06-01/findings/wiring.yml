      imports only `node:crypto` and
      `src/core/{dip/llm,message}`. No upward import (no
      `src/local/`, `src/cloud/`, `src/theokit/`, `src/agent-
      tools/`). Architecture.md § 3 honored.

      Note: architecture.md § 3 dependency-direction diagram does
      NOT yet list `src/embedders/` or `src/llms/` as sibling
      branches of the core tree. The principle ("siblings of
      local/cloud may only depend on core") is honored, but a
      future architecture.md edit should declare the new sibling
      branches explicitly so the boundary-check hook
      (`.claude/hooks/boundary-check.sh`) can enforce them
      automatically. Logging this here, not as a finding —
      architecture.md edits live outside this cycle's scope.

  reachability_from_entry_points:
    status: PASS
    notes: |
      Entry-point trace:
        `@usetheo/memory/embedders/stub` →
          src/embedders/stub.ts → DeterministicStubEmbedder
        `@usetheo/memory/llms/stub` →
          src/llms/stub.ts → DeterministicStubLLM
        `@usetheo/memory/embedders` →
          src/embedders/index.ts → re-exports DeterministicStubEmbedder
        `@usetheo/memory/llms` →
          src/llms/index.ts → re-exports DeterministicStubLLM
      All four subpaths are declared in package.json#exports and
      land in npm publish --dry-run per the validation report
      (line 19).

  dead_exports:
    status: PASS_WITH_NOTE
    notes: |
      No truly dead exports (every new symbol has at least the
      smoke-test caller). Barrel re-exports have only smoke-test
      callers (acceptable per ADR D4 — see F-wire-3).

  concurrent_safety:
    status: PASS
    notes: |
      Both stubs are pure functions with NO instance state
      (`grep this. src/embedders/stub.ts src/llms/stub.ts`
      surfaces only `this.embed(text)` method dispatch in
      `embedBatch`; no field mutation). LCG is recomputed per
      call (no shared `state` field). No `setInterval`, no
      `setTimeout`, no file handle, no DB pool, no cache. Race
      conditions are not plausible.

      The `embedBatch` implementation iterates sequentially with
      `await`. For a real OpenAI adapter this would be a
      perf concern; for a pure-function stub it's correct + cheap.

