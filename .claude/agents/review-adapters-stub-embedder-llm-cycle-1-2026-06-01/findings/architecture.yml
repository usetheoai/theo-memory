      for (let i = 0; i < v.length; i++) out[i] = v[i]! / norm;
      ```
      The `!` non-null assertion bypasses TS's noUncheckedIndexedAccess (if enabled in strict). Since the
      loop iterates by integer index < length, the assertion is safe. But the rule prefers `unknown` +
      runtime check OR pure refactor; assertions on indexed access are the same shape of "trust me" escape.
    recommended_action: |
      Refactor to `for (const x of v) out.push(x / norm);` (push, no pre-allocated length) OR use `v.map`.
      Single readability improvement; no behavior change. Optional — flag for cosmetic cleanup in the next
      cycle that touches this file. NOT a blocker.

