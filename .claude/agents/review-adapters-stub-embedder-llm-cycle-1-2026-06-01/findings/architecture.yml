    plan_ref: Global DoD "npm publish --dry-run lists src/embedders/ + src/llms/ files in the tarball" + Final Phase chain step 5
    summary: Build tsconfig does NOT include src/embedders or src/llms, so any future migration from "ship source" to "ship dist" silently drops the new adapters.
    evidence: |
      ```json
