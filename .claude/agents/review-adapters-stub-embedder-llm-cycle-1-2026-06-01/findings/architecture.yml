    summary: ADR D3 stage 1 says hex tag is "4-hex-char tag derived from MD5(stringify(messages)).slice(0,2)"
      (i.e., 2 bytes → 4 hex chars). Implementation `digest('hex').slice(0, 4)` produces 4 hex chars but via
