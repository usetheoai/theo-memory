      }
      ```
      Output: 4 hex characters, equivalent to plan ADR D3 stage 1 "hex(MD5(...).slice(0,2))" semantically.
      Slight ADR phrasing rot is a non-issue; the code is correct.
    recommended_action: No action — INFO acknowledgement. Could amend ADR D3 phrasing in a doc-cleanup cycle.

