  - id: F-arch-6
    severity: MINOR
    file: src/llms/stub.ts
    line: 73-85
    plan_ref: T1.2 Acceptance Criteria item 4 "generateResponse(msgs, {type:'text'}) matches generateChat shape"
    summary: Plan AC says `{type:'text'}` should "match generateChat shape" but implementation returns
      `{ text: ... }` shape, while `generateChat` returns `{ content: ..., role: 'assistant' }` (LLMResponse).
      The two shapes are NOT equal even though the test at line 119 asserts `text.text === chat.content`.
    evidence: |
      ```ts
      // src/llms/stub.ts:73-85
      async generateResponse(messages, responseFormat?, _tools?) {
        if (responseFormat?.type === 'json') {
          return { memory: extractFacts(...) };
        }
        const tag = tagFromMessages(messages);
        return await Promise.resolve({ text: chatContent(tag) });  // <-- shape: { text: string }
      }

      // vs generateChat shape (line 66-70)
      async generateChat(messages): Promise<LLMResponse> {
        return { content: chatContent(tagFromMessages(messages)), role: 'assistant' };  // shape: { content, role }
      }
      ```
      Test at `src/llms/__tests__/stub.test.ts:120-130` asserts `text.text === chat.content` — which holds
      because the strings agree — but does NOT assert shape equivalence. The plan AC is loosely interpreted:
      it could mean "same string content" (current impl) or "same object shape" (would require `{ content,
      role }`). Since the DIP returns `Promise<unknown>` for `generateResponse`, both shapes type-check.
      Pre-existing zero-vector stub at `src/local/stubs.ts:91-93` returns `{}` for any non-chat call —
      different shape again. There's no canonical "generateResponse text shape" in the DIP, so the
      divergence is genuine ambiguity, not a bug. Worth surfacing in the next iteration so the DIP can be
      tightened OR an explicit ADR documents the chosen shape.
    recommended_action: |
      Option A: amend plan ADR D3 with a one-line note: "generateResponse({type:'text'}) returns
      `{ text: string }` (NOT `LLMResponse` shape) — caller branches on responseFormat to interpret".
      Option B: make `generateResponse({type:'text'})` return `LLMResponse` for shape symmetry; update
      the test to assert deep equality with `await generateChat(...)`. Either choice is acceptable;
      undocumented divergence is the smell.

