      Today the package ships .ts source verbatim via `package.json#exports` → `./src/...` and `files: ["src/**/*.ts"]`,
      so the resolution works at install time. But `npm run build` is invoked by `pretest:e2e` and is the
      assumed exit path for any future shift to a compiled tarball. The asymmetry between contract/build
      tsconfigs is the same shape of defect that produced `F-T7.1-3` (assets silently skipped at build) called
      out as a learned lesson in `architecture.md § 10.1`. The plan did not amend tsconfig.build.json even
      though T0.1 explicitly widened tsconfig.contract.json — the divergence is unjustified.
    recommended_action: |
      Add `src/embedders/**/*.ts` + `src/llms/**/*.ts` to `tsconfig.build.json#include` in a follow-up commit
      under the same plan (or open a quick fix). One-line change. Honors `architecture.md § 10.1` consistency:
      every tsconfig include set should track every other one OR have an explicit ADR for divergence.

  - id: F-arch-2
    severity: MAJOR
    file: src/embedders/stub.ts
    line: 41
    plan_ref: ADR D2 (deterministic algorithm) + Deep Dive "L2-normalize the resulting vector to lie on the unit hypersphere"
    summary: LCG_HALF_MODULUS_F64 is computed via BigInt floor-division and loses the trailing 0.5, producing an
      asymmetric output map; JSDoc claims `[-1, 1]` but actual range is approximately `[-0.9999999990686774, 1.0]`.
    evidence: |
      ```ts
      // src/embedders/stub.ts:39-41
      const LCG_MODULUS = 2147483647n;                 // 2^31 - 1 (odd)
      const LCG_HALF_MODULUS_F64 = Number(LCG_MODULUS / 2n);  // BigInt: 1073741823n → 1073741823 (lost .5)

      // src/embedders/stub.ts:58
      out[i] = (Number(state) - LCG_HALF_MODULUS_F64) / LCG_HALF_MODULUS_F64;
      ```
      Numerical verification (run via `node -e "..."`):
        - max mapped value: `(2_147_483_646 - 1_073_741_823) / 1_073_741_823 = 1.0` exactly
        - min mapped value: `(1 - 1_073_741_823) / 1_073_741_823 ≈ -0.9999999990686774`
      The JSDoc at line 8 promises "fills MAX_EMBEDDING_DIM floats in `[-1, 1]`" and the plan ADR D2 stage 3
      says "fill 1536 floats in `[-1, 1]`". The implementation produces `[-1+eps, 1]` with a DC bias of
      ~4.7e-10 toward positive — negligible for stub determinism but a doc-vs-code mismatch that will surface
      the next time someone tries to extend the algorithm.
    recommended_action: |
      Replace `Number(LCG_MODULUS / 2n)` with the precise half: `Number(LCG_MODULUS) / 2` (i.e., `1073741823.5`).
      Single-line change, no API impact, restores symmetric `[-1, 1)` range matching the JSDoc + plan claim.
      Alternative: keep the value as-is and amend JSDoc + ADR D2 to read `[-1+eps, 1]`. Either resolves the
      divergence; the math fix is cleaner.

  - id: F-arch-3
    severity: MAJOR
    file: src/embedders/stub.ts
    line: 28
    plan_ref: T1.1 Deep Dive "Collision analysis" + AC item 2 "embed(t1) !== embed(t2) for distinct texts"
    summary: JSDoc collision-analysis claim is incorrect — effective seed space after `seed % LCG_MODULUS` is
      ~2^31, giving birthday-50% at ~46k inputs, NOT 2^32 as documented. Stub workloads stay safe but the
      analysis as written is wrong and will mislead future cycles that rely on it.
    evidence: |
      ```ts
      // src/embedders/stub.ts:20-22  (JSDoc claim)
      *   - `embed(t1) !== embed(t2)` for distinct texts (collision probability
      *     bounded by MD5 first-8-byte birthday ~ 2^32 inputs for 50% chance).
      ```
      But:
      ```ts
      // src/embedders/stub.ts:48-49
      const raw = digest.readBigUInt64BE(0);
      return raw === 0n ? 1n : raw % LCG_MODULUS === 0n ? raw + 1n : raw;

      // src/embedders/stub.ts:54
      let state = seed % LCG_MODULUS;        // entropy collapses here to ~31 bits
      ```
      Two distinct 64-bit seeds `A ≠ B` produce IDENTICAL embed output whenever `A ≡ B (mod 2^31 - 1)`.
      Effective entropy is `log2(LCG_MODULUS) ≈ 31 bits`. Birthday boundary is √(2^31) ≈ 46_340 distinct
      texts, NOT 2^32. The plan's own T1.1 Deep Dive (line 229) carries the same incorrect claim — the
      defect was inherited verbatim into the source JSDoc.
    recommended_action: |
      EITHER (preferred): change `seedFromText` to seed the LCG with a value that preserves more entropy
      (e.g., interleave two 4-byte words from the MD5 digest as `(hi * a + lo) mod m` for a wider seed
      space) — preserves the original birthday claim. The JSDoc + plan deep-dive can stay as written.

      OR: amend the JSDoc + plan ADR D2 / Deep Dive to declare the actual ~46k birthday boundary. Add a
      sentence: "For demo/test workloads ≤10k distinct texts, collision probability is < 0.1%; not
      suitable for higher cardinalities without a richer seed derivation." Honest, accurate, and surfaces
      the math limit for future extensions.

