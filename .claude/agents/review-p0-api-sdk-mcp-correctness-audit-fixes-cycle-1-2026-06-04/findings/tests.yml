findings:
  - id: F-tests-1
    severity: MINOR
    file: tests/integration/p0-audit-fixes/post-install-bin.test.ts
    line: 161
    plan_ref: T0.1 test 2 + ADR D2
    summary: >-
      Test name says "cli require() round-trip" but body uses dynamic
      `import()`. ADR D2 prescribed `node -e "require()"` — the impl
      diverged because the package is `"type": "module"` (ESM-only)
      and `require()` of an ESM file throws ERR_REQUIRE_ESM. Behavioral
      check is sound (module-resolution + dependency resolution
      exercised end-to-end), but the test name is misleading vs the
      semantic actually being tested.
    evidence: |
      Line 161: `test('2. cli require() round-trip succeeds post-extract', ...)`
      Line 165: `node -e "import(${...}).then(...)"` — dynamic import, not require
      package.json#type === "module"
    recommended_action: >-
      Rename test to "2. cli dynamic-import resolves all transitive
      siblings post-extract" OR add an inline comment explaining why
      `import()` is the ESM-aware analog of `require()` per the ADR D2
      intent. No behavioral change needed.
  - id: F-tests-2
    severity: MINOR
    file: tests/integration/p0-audit-fixes/post-install-bin.test.ts
    line: 136-142
    plan_ref: T0.1 § Deep Dives
    summary: >-
      symlinkSync(REPO_ROOT/node_modules → extractDir/package/node_modules)
      simulates post-install dependency resolution. The comment block
      (lines 136-142) discloses this honestly. However, the test asserts
      "post-install simulation" while reusing the dev tree's
      node_modules — if a runtime dep is listed in devDependencies
      (not in dependencies / peerDependencies), the test would
      false-PASS today but break in a real `npm install` (where only
      `dependencies` resolve). Honest disclosure exists per ADR D2's
      "honest-disclosure: this test exercises the EXTRACTED tree, NOT
      a fully-published-then-installed tree" — but the gap deserves a
      tracked follow-up.
    evidence: |
      symlinkSync(join(REPO_ROOT, 'node_modules'), join(extractedPackageDir, 'node_modules'), 'dir');
    recommended_action: >-
      Track a follow-up to harden test 2 by spawning a fresh
      `npm install --prefix <tmp> <tarball-path>` flow (instead of the
      symlink shortcut). Out of scope for this fix-cycle (ADR D2
      already documents the limitation). The symlink approach is
      acceptable for now; the gap is honest and bounded.
  - id: F-tests-3
    severity: MINOR
    file: tests/integration/p0-audit-fixes/post-install-bin.test.ts
    line: 77-82
    plan_ref: T0.1 — implicit
    summary: >-
      SIBLINGS hardcodes 4 module names (run-mcp-server, run-server,
      run-migrate, run-health). Future plan tasks that extract a new
      subcommand from cli.ts (e.g., `themory dogfood`) would add a 5th
      sibling and silently bypass tests 1+3 — the dist/**/*.js glob
      ships it, but test 1+3 only check the 4 hardcoded names. The
      test would NOT regress, but would have a coverage hole. The
      pack-manifest test #4 (D3 pattern) uses readdirSync for dynamic
      enumeration — this same pattern would close the gap here.
    evidence: |
      const SIBLINGS = [
        'run-mcp-server.js', 'run-server.js', 'run-migrate.js', 'run-health.js',
      ] as const;
      // No dynamic enumeration; new sibling extracted in a future cycle would
      // not be exercised by tests 1 or 3.
    recommended_action: >-
      Out of scope for this fix-cycle. Future hardening: enumerate
      dist/agent-tools/run-*.js via readdirSync (mirror of ADR D3's
      pattern for pack-manifest test #4) so any new sibling auto-enrolls.
      Acceptable today — the 4 siblings cover the empirical CRITICAL.
