      Also Drawbacks row 3 names this type-level disjointness test as the mitigation for the
      "discriminator collision if LocalMemoryConfig ever gains a `postgres` field" risk.
    summary: >
      Declared file NOT edited; declared TYPE-LEVEL tests replaced by a RUNTIME dispatch test.
      Divergence from the plan without an in-implementation ADR.
    evidence: |
      - `git log 17296fe..HEAD -- packages/core/src/domain/index.test-d.ts` → NO commits.
      - `grep -n "preset|CreateMemoryPresetConfig|postgres" index.test-d.ts` → NO matches.
      - Instead, T2.1 (7c1c94b) added `packages/core/src/infrastructure/db/factory-dispatch.test.ts`
        with `test_createMemory_dispatches_preset_shape_to_resolvePreset` — a RUNTIME test that
        mocks resolvePreset and asserts routing. It proves dispatch behavior but does NOT prove the
        plan's TYPE-LEVEL claims (`expectTypeOf(createMemory).toBeCallableWith(...)`) nor the
        SHAPE-DISJOINTNESS guard the Drawbacks table relies on.
      - Consequence: the "createMemory({preset}) AND createMemory(fullConfig) both type-check"
        Acceptance Criterion (T2.1 AC1) is verified only implicitly by whole-suite typecheck, not by
        the intentional type test; and the future-collision tripwire (Drawbacks row 3) is absent.
    mitigating_context: >
      The non-breaking guarantee IS proven at the surface level: matrix.test.ts (name preserved) and
      full-public-surface.test.ts both green (54/54), full typecheck green, and the union parameter
      type `CreateMemoryPresetConfig | LocalMemoryConfig` compiles. So the risk is low TODAY; the gap
      is the lost intentional regression tripwire, not a broken feature.
    recommended_action: >
      Either (a) add the declared type-level tests to index.test-d.ts (preset-shape callable,
      full-config callable, shapes-disjoint) to restore the Drawbacks-row-3 collision tripwire, OR
      (b) record a one-line ADR in the implementation summary documenting the deliberate swap
      (runtime dispatch test in lieu of type test) and the accepted loss of the disjointness guard.

