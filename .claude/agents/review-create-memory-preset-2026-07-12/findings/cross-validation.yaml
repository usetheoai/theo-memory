    severity: MEDIUM
    file: packages/core/src/domain/index.test-d.ts
    line: "n/a (file unchanged)"
    plan_ref: >
      T2.1 — "Files to edit" declares `packages/core/src/domain/index.test-d.ts — add RED type test:
