  - id: F-tests-3
    severity: LOW
    file: packages/core/src/infrastructure/db/preset.test.ts
    line: 137
    plan_ref: testing.md § 4.1 (negative case asserts the SPECIFIC typed error AND message)
    summary: >
      The EC-4 negative test asserts the typed error class (InvalidPresetConfig)
      but not the message, and does not cover the whitespace-only `postgres`
      branch that resolvePreset explicitly guards (`.trim() === ''`).
    evidence: |
      preset.test.ts:137 asserts `.rejects.toThrow(InvalidPresetConfig)` — good
      (typed, not bare Error). But preset.ts:153 guards BOTH empty AND
      whitespace-only (`config.postgres.trim() === ''`); the whitespace branch
