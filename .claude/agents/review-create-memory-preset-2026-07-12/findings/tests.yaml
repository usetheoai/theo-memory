      `.trim()` would pass. Per testing.md § 4.1 a negative test should also
      pin the message to lock the fail-CLEAR contract.
    recommended_action: >
      Add a case for `{ postgres: '   ' }` rejecting with InvalidPresetConfig,
      and assert `.rejects.toThrow(/non-empty .*postgres/)` to lock the message.

