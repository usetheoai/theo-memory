findings:
  - id: F-tests-1
    severity: MEDIUM
    file: packages/core/src/domain/index.test-d.ts
    line: 115
    plan_ref: >
      T2.1 "#### Files to edit" (plan:336) + TDD block (plan:356-357:
      test_createMemory_accepts_preset_shape / test_createMemory_accepts_full_config
      via expectTypeOf.toBeCallableWith) + Drawbacks table (plan:120:
      "Add a type-level test asserting the two shapes are disjoint")
    summary: >
      The plan's declared compile-time type test for the createMemory overload
      was NEVER added; it was replaced by the runtime factory-dispatch.test.ts,
      which cannot detect a type-level regression (the shape-disjointness
      tripwire is lost).
    evidence: |
      grep 'CreateMemoryPresetConfig|isPresetConfig|toBeCallableWith' over
      packages/core/src/domain/*.test-d.ts -> 0 matches.
      index.test-d.ts:100-114 tests only a SYNTHETIC `CreateMemoryFactory =
      (config)=>Memory` that does NOT import the real `createMemory`, so it
      would never break on an overload/return-type regression.
      Test-quality impact:
        1. No test guards the D1 non-breaking claim at the type level. The
           real createMemory returns Promise<DisposableMemory> (factory.ts:298-302),
           but the only "type test" asserts a decoupled synthetic `=> Memory`.
        2. The Drawback-mitigation tripwire is absent: if LocalMemoryConfig ever
           gains a `postgres` field, isPresetConfig would silently misroute a
           full config to the preset branch, and NO test — runtime or type —
           would fail. The plan named this exact risk (Drawbacks line 120) and
           assigned a type test as its mitigation; the mitigation did not ship.
        3. factory-dispatch.test.ts only asserts the preset->resolvePreset
           direction (one runtime path). It does NOT assert the full-config
           ->createLocalMemory direction, nor the disjointness invariant.
    recommended_action: >
      Add the promised type test to index.test-d.ts, e.g.
      `expectTypeOf(createMemory).toBeCallableWith({ postgres: 'x', openai: 'k' })`
      AND `expectTypeOf(createMemory).toBeCallableWith(fullLocalMemoryConfig)`,
      plus a disjointness assertion (e.g. a `postgres` key is NOT assignable to
      LocalMemoryConfig). This is the mitigation the plan's own Drawbacks table
      committed to and is the ONLY guard for the non-breaking overload contract.

