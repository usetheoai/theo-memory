  - id: F-arch-2
    severity: INFO
    file: packages/core/src/infrastructure/db/preset.ts
    line: 132
    plan_ref: D3 + T1.2 (dispose-wrap, no-spread)
    summary: >-
      wrapDisposeWithPoolEnd correctly mutates the instance in place instead of spreading —
      preserving LocalMemory prototype methods — and guards pool.end() to run exactly once.
    evidence: |
      ```ts
      function wrapDisposeWithPoolEnd(memory: DisposableMemory, pool: Pool): DisposableMemory {
        const innerDispose = memory.dispose.bind(memory);
        let disposed = false;
        (memory as { dispose: () => Promise<void> }).dispose = async (): Promise<void> => {
          if (disposed) return;
          disposed = true;
          await innerDispose(); await pool.end();
        };
        return memory;
      }
      ```
      In-place mutation (not `{ ...memory }`) preserves user/session/agent/recall prototype
      methods (D3 invariant). `bind(memory)` preserves inner-dispose receiver. `disposed` flag
      makes double-dispose idempotent (Drawbacks row 2). SRP: assembly, dispose-wrap, and
      resolve are three small single-purpose functions (D5).
    recommended_action: None. Design is sound.
