  - id: F-arch-1
    severity: MEDIUM
    file: packages/agent-core/src/agent-tools-memory.ts
    line: 207
    summary: >-
      Switching THEOMEM_EMBEDDER on a populated DB silently auto-triggers the
      DESTRUCTIVE dim-change cascade on next boot — loud-logged but ungated.
    evidence: |
      // createAgentToolsMemory + both runners call unconditionally on startup:
      await runMigrations(pool, { embeddingDim: embeddingDimForKind(resolveEmbedderKind()) });
      // migrations-runner.ts::applyDimChange (currentDim 384 -> 1536):
      //   "DESTRUCTIVE cascade: DELETE FROM memories ... DELETE FROM entities
      //    + DROP/RECREATE HNSW indexes"  (console.error then runs it)
      // It is idempotent (no-op when dim matches) but auto-runs the wipe when
      // the operator flips local<->openai against existing data.
    recommended_action: >-
      The embedder selection is correct and dim-coupling is internally consistent
      (resolve once, reuse for both migration + store). The residual risk is the
      destructive auto-cascade on a live dim flip. Add a refusal/confirmation gate
      (e.g. require THEMEMORY_ALLOW_DESTRUCTIVE_DIM_CHANGE=true to proceed when
      currentDim != targetDim AND row count > 0), or at minimum surface this in
      the README embedder-switch docs. Loud stderr alone is insufficient for a
      one-way data-loss path on a routine env-var change.

  - id: F-arch-2
    severity: INFO
    file: packages/agent-core/src/agent-tools-memory.ts
    line: 73
    summary: >-
      resolveEmbedderKind + embeddingDimForKind + buildEmbedder: clean fail-loud
      composition-root placement; SOLID/DIP respected.
    evidence: |
      export function resolveEmbedderKind(): EmbedderKind {
        const k = process.env['THEOMEM_EMBEDDER'];
        if (k === undefined || k === '' || k === 'local') return 'local';
        if (k === 'openai') return 'openai';
        throw new Error(`Unknown THEOMEM_EMBEDDER='${k}' (expected 'local' or 'openai').`);
      }
      // buildEmbedder lazy-imports ONLY the chosen backend (verified: embedders/openai.ts
      // imports `openai` only; embedders/local.ts imports @xenova/transformers).
    recommended_action: >-
      No change. The selection lives at the agent-core composition layer (correct —
      not in core/), reads the public @usetheo/memory subpaths (DIP boundary intact),
      and fails loud on unknown values with no silent fallback (Inquebrável Rule 8).
      buildEmbedder keeps the openai path free of @xenova as required.

