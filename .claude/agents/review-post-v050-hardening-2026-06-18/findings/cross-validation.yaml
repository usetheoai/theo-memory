verifications:
  - id: V1
    claim: ".dockerignore un-excludes pnpm-lock.yaml + scripts/"
    verdict: CONFIRMED
    evidence: |
      git show d0382fd -- .dockerignore: removed "pnpm-lock.yaml" from the
      exclude list; "scripts/" exclusion replaced with a NOTE explaining it is
      kept (postbuild:rewrite-aliases needs it). Both un-excluded as claimed.
  - id: V2
    claim: "Dockerfile copies all workspace packages (not just packages/cli)"
    verdict: CONFIRMED
    evidence: |
      git show d0382fd -- Dockerfile: builder stage now `COPY packages/ ./packages/`
      + `COPY scripts/ ./scripts/` + tsconfigs BEFORE `pnpm install`. The old
      `COPY packages/cli/ ./packages/cli/` line is gone. INCLUDE_OPTIONAL ARG
      default flipped false→true; TRANSFORMERS_CACHE=/tmp/.transformers-cache ENV added.
  - id: V3
    claim: "package.json build runs build:core before the main tsc"
    verdict: CONFIRMED
    evidence: |
      git show d0382fd -- package.json: build script reordered to
      `prebuild:clean && build:core && tsc -p tsconfig.build.json && ...`.
      Previously build:core ran LAST. Matches CHANGELOG clean-checkout claim.
  - id: V4
    claim: "Embedder default stays 'local' (back-compat)"
    verdict: CONFIRMED
    evidence: |
      resolveEmbedderKind() (packages/agent-core/src/agent-tools-memory.ts):
      unset / '' / 'local' → 'local'. Unit tests in agent-tools-memory.test.ts:
      "defaults to local when unset (back-compat)", "treats empty string as local",
      "fails loud on an unknown value". buildEmbedder() imports ONLY the selected
      backend (openai path never pulls @xenova) — matches the CHANGELOG no-@xenova
      runtime claim for the openai path.
  - id: V5
    claim: "No disclosure-string regression for the default path"
    verdict: CONFIRMED
    evidence: |
      run-server.ts / run-mcp-server.ts build embedderLabel conditionally; the
      'real providers wired' prefix is retained. Existing assertions use the
      regex /real providers wired/i (run-mcp-server.test.ts:119/159/175,
      run-server.test.ts:209) — NOT the exact old "LocalTransformerEmbedder..."
      literal — so they stay green. The only file matching the literal label
      (tests/integration/adapters-or-local-e2e-smoke.test.ts) uses it in a
      comment + a direct `new LocalTransformerEmbedder()` construction, not as a
      disclosure-string assertion. No regression.
  - id: V6
    claim: "PgvectorStore.list() excludes soft-deleted rows (t_invalid IS NULL)"
    verdict: CONFIRMED
    evidence: |
      git show be6c0cd -- pgvector-store.ts: both countSql and the page SELECT
      changed `WHERE 1=1` → `WHERE t_invalid IS NULL`. Matches the CHANGELOG
      Fixed entry; regression tests added (pgvector-store-list-temporal.test.ts +
      openmemory mcp-compat list-after-delete).
  - id: V7
    claim: "README THEOMEM_EMBEDDER doc matches code behavior"
    verdict: CONFIRMED
    evidence: |
      git show d9a1d51 -- README.md: documents local (default, 384, downloads
      model) vs openai (1536, requires OPENAI_API_KEY, no on-device model / no HF
      download), and that the migration dim follows the selection — all of which
      match resolveEmbedderKind/embeddingDimForKind/buildEmbedder. Accurate.

