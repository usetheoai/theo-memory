domain: database (pgvector-schema + bi-temporal soft-delete + HNSW dim migration)
domain_specific_patterns_checked:
  - "list() soft-delete predicate parity with search()/recall() (t_invalid IS NULL)"
  - "composeFilters parameter-index continuity (literal predicate adds no param)"
