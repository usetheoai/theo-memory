summary_verdict: >
  The operator/CLI/Docker surface is largely sound. stderr disclosure is HONEST and
  byte-back-compatible on the default path (no sentinel regression). THEOMEM_EMBEDDER
  fails loud on unknown values. The Docker fixes (build:core-first, COPY packages/,
  INCLUDE_OPTIONAL=true default, TRANSFORMERS_CACHE) are operationally correct and
  well-commented. The one genuine operator footgun is the destructive dim-change that
  fires automatically on startup when an operator flips THEOMEM_EMBEDDER against an
  existing DB — the warning is emitted AS the data is wiped, not BEFORE, so it cannot
  prevent loss. Plus two documentation gaps (image-size / INCLUDE_OPTIONAL=false slimming;
  OPENAI_API_KEY-wrong-vs-missing failure mode).

findings:
  - id: F-dom-cli-1
    severity: HIGH
    file: packages/core/src/infrastructure/db/migrations-runner.ts
    line: 102
    plan_ref: "post-v050-hardening — THEOMEM_EMBEDDER selectable embedder (CHANGELOG Added)"
    domain_anchor: "Inquebravel Rule 8 (Fail-Fast, Fail-Clear) + CLAUDE.md Principio 3 (auditable, IGNORE never silent)"
    summary: >
      Flipping THEOMEM_EMBEDDER (e.g. local->openai) on an EXISTING populated DB triggers
      the DESTRUCTIVE dim-change cascade automatically during migrate-on-startup
      (run-server.ts:127 runMigrations(pool,{embeddingDim}) and run-mcp-server.ts:227 same).
      applyDimChange runs DELETE FROM memories + DELETE FROM entities + DROP/RECREATE HNSW
      with NO operator confirmation gate. The DESTRUCTIVE-cascade warning at line 216-225 is
      emitted INSIDE the same runMigrations call, on the same code path that then performs the
      wipe at lines 229-231+ — i.e. the operator reads the warning only AFTER (or as) the data
      is already being deleted. On migrate-on-startup (ADR D8, port binds AFTER migrate) this
      is silent-to-the-operator data loss: a single env-var typo or an intentional embedder
      swap wipes all memories + the history audit trail + v0.7 provenance + v0.6 supersession
      chains. This is the highest-blast-radius operator footgun in the diff.
    evidence: |
      run-server.ts:126-128
        const embedderKind = resolveEmbedderKind();
        const embedderDim = embeddingDimForKind(embedderKind);
        ...
        await runMigrations(pool, { embeddingDim: embedderDim });   // startup, pre-port-bind

      migrations-runner.ts:215-231 (warning then wipe, same call):
        console.error(`[themory] runMigrations: dim change ${currentDim} -> ${targetDim} -- DESTRUCTIVE cascade: DELETE FROM memories ...`);
        const client = await pool.connect();
        try {
          await client.query('BEGIN');
          await client.query('DROP INDEX IF EXISTS memories_embedding_hnsw_idx');
          ...
    mitigating_factors: >
      (1) The sequence IS idempotent (lines 206-213: if currentDim === targetDim, no-op) — a
      RESTART with the same embedder does NOT re-wipe. (2) The warning is detailed and honest
      about the full FK cascade. (3) THEOMEM_SKIP_MIGRATIONS (shouldSkipMigrations) lets a
      cautious operator bind without migrating. The risk is specifically the FIRST startup
      after an embedder flip on a non-empty DB.
    recommended_action: >
      Add a guard so an embedder swap does NOT silently destroy data on startup. Options for
      the human to choose (95% rule): (a) require an explicit opt-in env (e.g.
      THEOMEM_ALLOW_DESTRUCTIVE_DIM_CHANGE=1) before applyDimChange will DELETE when
      currentDim != targetDim AND row count > 0 — otherwise fail-LOUD with exit!=0 and a
      "refusing to wipe N memories; set THEOMEM_ALLOW_DESTRUCTIVE_DIM_CHANGE=1 to proceed"
      message (fail-closed, Rule 8); (b) at minimum, probe row count and emit the DESTRUCTIVE
      warning with the concrete count BEFORE the BEGIN, and document the footgun in README
      next to the THEOMEM_EMBEDDER section. (a) is the Rule-8-correct fix.

