    plan_ref: "post-v050-hardening — Dockerfile INCLUDE_OPTIONAL default flip true"
    domain_anchor: "operator ergonomics — image-size trade-off disclosure"
    summary: >
      Dockerfile INCLUDE_OPTIONAL default flipped false->true (Dockerfile:71) so
      onnxruntime-node ships by default — correct for the default local embedder. But the
      image-size impact is NOT documented for operators, and neither README nor
      docker-compose.prod.yaml mentions the slim path. The Dockerfile comment (lines 67-72)
      correctly says "Set the arg to false ONLY for an OpenAI-embedder-only deployment", but
      an OpenAI-embedder operator has no README signal that they can pass
      --build-arg INCLUDE_OPTIONAL=false to drop onnxruntime-node. HONEST CAVEAT that MUST be
      stated if this is documented: @xenova/transformers (and thus sharp) is a REGULAR
      dependency, so INCLUDE_OPTIONAL=false only strips the OPTIONAL onnxruntime-node — sharp
      and @xenova still install. The slimming benefit is partial, not full; documenting it
      without that caveat would overstate the savings.
    evidence: |
      Dockerfile:71  ARG INCLUDE_OPTIONAL=true
      Dockerfile:67-72 comment: "Set the arg to false ONLY for an OpenAI-embedder-only deployment ..."
      README.md:88-94  embedder-selection block — no INCLUDE_OPTIONAL / image-size mention
      grep INCLUDE_OPTIONAL docker-compose*.yaml -> none
      CLAUDE.md:155  "Docker stack (distroless ... 199.7 MB)" — pre-flip size, now larger with onnxruntime-node
    recommended_action: >
      Add an operator note (README Docker section) that the default image now ships
      onnxruntime-node (larger image) to support the default local embedder, and that an
      OpenAI-embedder-only deployment MAY build with --build-arg INCLUDE_OPTIONAL=false to
      drop it — WITH the explicit caveat that @xenova/transformers + sharp remain (regular
      deps) so the saving is partial. Also update the CLAUDE.md "199.7 MB" figure or note
      it is now larger, to avoid a stale-size claim (Rule 3 honesty).

