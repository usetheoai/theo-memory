      The second assertion (graphExpand: undefined) is correct: when graphExpand is absent
      from the request, the destructuring + pass-through sets it to undefined, which is
      correctly passed to recall.
    context: Per testing.md § BDD, the test name describes behavior: "graphExpand is passed through to scoped.recall (REST → SDK mapping)". The `objectContaining()` choice is appropriate for a focused test.
    recommended_action: APPROVED. The use of objectContaining is correct for this scope. The assertion that graphExpand: undefined is also correct (mirrors the handler's line 44 destructure).
    status: APPROVED

