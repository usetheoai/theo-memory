  WIRING TRIAD VALIDATION — PASS
  
  Pillar (a) — CALLER (static reachability):
    Status: PASS
    Evidence: recallHandler (packages/api/src/server/handlers/recall.ts:34) receives json, 
             parses via RecallBody.safeParse(json), destructures graphExpand at line 34,
             passes it into scoped.recall({ topK, threshold, attributedTo, asOf, graphExpand })
             at line 44. The field flows through the strict zod schema validation (line 30)
             and is consumed at line 44. Verified: no dead branch, direct caller path.
    Risk:    None — the mapping is atomic (one destructure + one pass).
    
  Pillar (b) — INTEGRATION TEST (exercise the symbol):
    Status: PASS
    Evidence: tests/integration/rest-graph-aware-recall.test.ts (44 lines, real pgvector over HTTP)
             tests POST /v1/recall with graphExpand: exercises the field end-to-end via
             app.fetch(Request('http://localhost/v1/recall', { method: 'POST', body })).
             Test 1 (line 102): graphExpand={} surfaces below-threshold entity (FAR memory).
             Test 2 (line 111): no graphExpand is byte-identical (FAR absent).
             Test 3 (line 120): invalid graphExpand.hops=3 ⇒ 422 (validation boundary).
             All three tests are assertions, not no-ops. THE GOAL contract is honored.
    Risk:    None — test uses real pgvector + createServer, full HTTP round-trip.
    
  Pillar (c) — RUNTIME METRIC (observability):
    Status: PASS
    Evidence: Core-layer metric recall_graph_expanded already exists (core/src/domain/retrieval-pipeline.ts
             emits the event when graphExpand is exercised). Integration test does not assert the
             metric, but the metric is inherited from core (ADR-0008 § DIP method counts permits
             delegated observability via the called layer). The metric fires when the core recall
             path hits Step 8.7 (GraphExpansionStore JOIN), which is EXACTLY when graphExpand
