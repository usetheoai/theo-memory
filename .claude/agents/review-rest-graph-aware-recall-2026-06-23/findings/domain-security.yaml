  - id: F-sec-8
    severity: INFO
    file: packages/api/src/server/schemas.ts
    line: 65-86
    plan_ref: T1.1 Acceptance Criteria "scope tier isolation preserved"
    summary: Multi-tenant workspace isolation is NOT bypassed by graphExpand
    evidence: |
      RecallBody schema (lines 65-86):
      ```ts
      export const RecallBody = z
        .object({
          ...ScopeFields,        // userId, sessionId, agentId
          query: z.string().min(1),
          topK: z.number().int().min(1).max(100).optional(),
          threshold: z.number().min(0).max(1).optional(),
          attributedTo: z.string().optional(),
          asOf: z.string().datetime().optional(),
          graphExpand: z.object({ ... }).optional(),  // ← NEW
        })
        .strict()
        .superRefine(SingleScopeRefine);
      ```
      
      The RecallBody schema includes:
      - ScopeFields (userId/sessionId/agentId) — exactly one MUST be present (superRefine)
      - graphExpand — optional, does NOT include a workspace override
      - .strict() — unknown keys rejected (no scope-widening via extra fields)
      - No `graphExpandScope` / `workspaceId` / or other scope-override fields
      
      Handler binding (recall.ts:36):
      ```ts
      const scoped = resolveScope(
        workspaceBoundMemory(c, memory),  // ← workspace from Principal (auth layer)
        parsed.data  // ← parsed body includes only the allowed tier
      );
      ```
      
      CONCLUSION: graphExpand is an OPTION on the recall, not a scope tier. 
      The workspace is bound from the authenticated Principal, not from the body. 
      The scope tier is resolved from exactly one of userId/sessionId/agentId. 
      graphExpand CANNOT override or widen either.
    recommended_action: No action — scope isolation is correctly preserved.

