  - id: F-sec-10
    severity: INFO
    file: packages/api/src/server/handlers/_body-parsing.ts
    line: 29-32
    plan_ref: ADR D3 (Multi-tenant workspace isolation)
    summary: Workspace binding is applied before scope resolution (correct ordering)
    evidence: |
      The workspaceBoundMemory function (lines 29-32):
      ```ts
      export function workspaceBoundMemory(c: Context, memory: Memory): Memory {
        const principal = c.get('principal') as Principal | undefined;
        const workspaceId = principal?.workspaceId ?? DEFAULT_WORKSPACE_ID;
        return memory.withWorkspace !== undefined ? memory.withWorkspace(workspaceId) : memory;
      }
      ```
      
      Called in recall handler (recall.ts:36):
      ```ts
      const scoped = resolveScope(
        workspaceBoundMemory(c, memory),  // ← (1) bind workspace FIRST
        parsed.data                        // ← (2) resolve tier SECOND
      );
      ```
      
      Execution order:
      1. Principal extracted from context (set by auth middleware, not the request body)
      2. Workspace extracted from Principal (NOT from body)
      3. Memory bound to workspace (all subsequent operations are workspace-confined)
      4. Scope tier resolved from the request body (user/session/agent)
      5. The result is a doubly-filtered ScopedMemory: workspace-confined AND tier-scoped
      
      This ordering prevents:
      - Body-based workspace override (workspace comes from auth, not body)
      - Tier override (exactly one tier is enforced by zod superRefine)
      - Scope widening via graphExpand (graphExpand is just an option, not a scope)
      
      CONCLUSION: The function-call ordering is correct. 
      Workspace binding occurs before scope resolution, preventing body-based bypasses.
    recommended_action: No action — ordering is correct.
