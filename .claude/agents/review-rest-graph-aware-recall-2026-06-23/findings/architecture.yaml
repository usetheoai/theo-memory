  VERDICT: CLEAN — no architectural defects.
  
  REST graphExpand surface is a textbook minimal additive API extension:
  
  1. Zod schema (T1.1): Correctly bounds graphExpand, mirrors SDK type, .strict() inner,
     optional outer. Field placement inside RecallBody, .superRefine() intact.
  
  2. Handler mapping (T1.2): One destructure + one pass, mirrors topK/threshold pattern.
     No hand-validation. Factory + SDK do the work.
  
  3. OpenAPI (T1.2): Auto-derives from RecallBody reference. No manual edit.
  
  4. Unit tests (T1.2): Four tests cover pass-through, default, validation.
  
  5. Integration test (T2.1): Against real pgvector with entity-graph seeding.
     Proves REST→handler→SDK→Step 8.7→JOIN end-to-end. Default byte-unchanged, 
     invalid input 422 at boundary.
  
  6. Boundaries & principles:
     - DIP: API depends on core; core untouched.
     - Scope (ADR D3): Only graphExpand exposed; rerank/adaptive deferred.
     - Non-breaking: Optional field on strict schema widens acceptance only.
     - Principles: Opt-in prioritization (Princípio 2), fully auditable (Princípio 3).
  
  7. Code hygiene: No paper names, naming conventions respected, typecheck green,
     tests pass, CHANGELOG updated.
  
  Ready for merge.
