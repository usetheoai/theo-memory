findings:
  - id: F-xval-1
    severity: INFO
    file: packages/api/src/server/schemas.ts
    plan_ref: ADR D1 / core options.ts:241-244
    summary: "REST zod limit is bounded (int 1..100) while the core SDK type RecallOptions.graphExpand.limit is an open number. This is an INTENTIONAL REST-tier DoS-guard narrowing explicitly authorized by ADR D1 (parity with topK), documented in the field comment + CHANGELOG. Not a divergence — recorded for transparency."
    evidence: |
      core: readonly limit?: number
      zod:  limit: z.number().int().min(1).max(100).optional()
    recommended_action: none (compliant with ADR D1)
  - id: F-xval-2
    severity: LOW
    file: packages/api/src/server/__tests__/openapi.test.ts
    plan_ref: T1.2 Acceptance Criteria item 3 ("OpenAPI /v1/recall request schema includes graphExpand")
    summary: "The OpenAPI auto-derive AC is satisfied at runtime (reviewer empirically confirmed GET /v1/openapi.json contains 'graphExpand'), but NO committed test asserts it. The AC relies on the structural fact that openapi-registration.ts uses {schema: RecallBody}. A one-line regression assertion would lock the AC against a future refactor that inlines a hand-written recall schema."
    evidence: |
      openapi-registration.ts:90 -> request body schema: RecallBody (auto-derive)
      grep graphExpand in openapi.test.ts => no match
      reviewer ad-hoc test: JSON.stringify(spec).includes('graphExpand') === true
    recommended_action: "Optional: add a graphExpand assertion to openapi.test.ts. Non-blocking — the AC is met; this only hardens the regression guard."
