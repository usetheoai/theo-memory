post_review_summary: |
  ALL THREE CRITICAL CLOSURES FROM RE-RUN #1 REMAIN CORRECT AND COMPLETE:
    - F-C1 (mass-tombstone guard): LastWriteWinsConflictPolicy.maxRejectionRatio
      abstention verified — test coverage 5 cases; clamped [0,1]; produces
      ZERO partial state via the `length > 0` gate in src/local/index.ts:403.
    - F-C2 (episodic↔semantic boundary): `kind = 'extracted'` filter verified
      against the exhaustive schema CHECK constraint enumeration. Regression
      test in skill-isolation.test.ts asserts both skill and derived rows survive.
    - F-C3 (consolidation_history schema declaration): table declared in
      src/local/schema.ts with FK ON DELETE SET NULL; drift-protected by the
      schema-snapshot-parity.test.ts sentinel which checks both directions
      (snapshot → schema AND schema → snapshot).

  THREE-TIER SCOPE SEMANTICS preserved: distillation respects user_id /
  session_id / agent_id filters in recallConsolidationCandidates via the
  standard `filters` object propagated from `scopeToFilters`. No cross-scope
  contamination possible.

  ADD-ONLY INVARIANT preserved: persistConsolidations soft-deletes via
  `t_invalid = NOW()` (pgvector-store.ts:612-616); never UPDATE on memories
  text/payload, never DELETE FROM memories.

  BI-TEMPORAL SEMANTICS: candidate query honors t_invalid IS NULL AND
  (t_valid IS NULL OR t_valid <= NOW()) — forward-compatible with v0.5 cloud
  asOf bi-temporal queries when ADR-0006 backports asOf.

  MEM0-SHAPE PIPELINE INTEGRITY: extracted (default) and derived rows correctly
  discriminated by `kind` column. Procedural memory (kind='skill') from v0.6
  Voyager skill library is isolated from semantic consolidation — preventing
  the mass-tombstone failure mode F-C2 was named after.

