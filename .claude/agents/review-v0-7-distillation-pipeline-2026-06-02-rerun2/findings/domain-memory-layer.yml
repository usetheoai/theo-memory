evidence_collected:
  - file: src/local/pgvector-store.ts
    lines: 555-593
    finding: |
      `recallConsolidationCandidates` SQL WHERE clause is correctly bounded:
        - `kind = 'extracted'` excludes both 'derived' (already-consolidated semantic) and
          'skill' (v0.6 procedural memory). The schema CHECK constraint
          `memories_kind_derived_from_check` enforces kind ∈ {'extracted','derived','skill'}
          (schema.ts:147-149), so the filter is exhaustive — no fourth kind can leak in.
        - `t_invalid IS NULL` honors ADD-only soft-delete semantics.
        - `(t_valid IS NULL OR t_valid <= NOW())` forward-compats with v0.5 cloud asOf.
        - Three-tier scope filters (user_id, session_id, agent_id) applied via parameterized
          `$N` placeholders — no SQL injection vector.
      The `'summary'` concern noted in the spawn brief is N/A: `history` (DrizzleHistoryManager)
      lives in a separate table; only `memories` rows have the kind column.

  - file: src/core/conflict-resolution/last-write-wins.ts
    lines: 82-122
    finding: |
      LastWriteWinsConflictPolicy abstention path verified clean:
        - Constructor clamps maxRejectionRatio to [0, 1] (line 91).
        - Default 0.95: 20 candidates → ratio 0.95 (consolidates); 21 candidates →
          ratio ~0.952 (abstains).
        - Abstain path returns `[]` — caller (src/local/index.ts:403) gates
          `persistConsolidations` on `length > 0`, so abstention produces ZERO
          tombstones, ZERO consolidation_history rows, ZERO soft-deletes. No
          partial state possible.
        - Test coverage: 5 abstention-related tests in last-write-wins.test.ts:61-115
          (default boundary at 20/21, opt-out at 1.0, no-op at 0, clamping ±2.5/-0.5).

  - file: src/local/index.ts
    lines: 373-406
    finding: |
      Conflict-resolution phase wired BEFORE LLM-driven derivation (line 374-406 vs
      line 408+). EC-8 absorbed: persistConsolidations runs the soft-delete + history
      INSERT inside a single withTransaction (pgvector-store.ts:609-633). Empty
      results array short-circuits at line 403 — no transaction opened, no audit
      noise. Scope-isolation: `this.filters` (derived from scopeToFilters) propagates
      through unchanged.

  - file: src/local/schema.ts
    lines: 239-254
    finding: |
      consolidation_history table declared in schema.ts with kept_memory_id FK
      `ON DELETE SET NULL` for GDPR survival. F-C3 closure verified — previously
      table only lived in 0007_distillation_columns.sql + meta/0007_snapshot.json
      and `drizzle-kit push` would have computed a destructive DROP TABLE diff.
      Now drift-protected by tests/integration/schema-snapshot-parity.test.ts.

  - file: src/core/conflict-resolution/llm-judged-merge.ts
    lines: 92-120
    finding: |
      LlmJudgedMergeConflictPolicy abstention paths:
        - Cluster cap (EC-6): candidates.length > clusterCap (default 20) → counter
          increment + return `[]`. No LLM call.
        - Parse-null (EC-2): semantic validation of `kept_id ∈ clusterIds`,
          `rejected_ids ⊂ clusterIds`, `kept_id ∉ rejected_ids`. parseConsolidationResponse
          null → abstain counter + return `[]`.
        - Both abstention paths produce ZERO tombstones via the same
          `consolidationResults.length > 0` gate in src/local/index.ts:403.
      EC-4 lazy counter pattern matches v0.4b T10.1 (pg-evictor.ts:56-75) precedent —
      consistent with F-dom-6 OTel lazy-init idiom.

  - file: tests/integration/distillation/skill-isolation.test.ts
    lines: 101-190
    finding: |
      F-C2 regression test verified honest:
        - Test 1 (skill rows survive): seeds 2 skill + 2 extracted in same agent_id
          scope; assertion that skill rows have t_invalid IS NULL post-reflect.
        - Test 2 (derived rows NOT re-consolidated): F-tests-rerun-1 test name
          corrected (body invokes reflect ONCE, not "subsequent reflect");
          F-tests-rerun-2 void discards replaced with 4 actual t_invalid assertions
          (lines 178-187) covering both extracted_older (rejected) and
          extracted_newer (kept). Honest test passes when behavior is correct.

