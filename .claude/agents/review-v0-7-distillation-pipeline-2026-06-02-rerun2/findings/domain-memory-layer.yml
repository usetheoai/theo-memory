      would mirror the LlmJudgedMergeConflictPolicy.ABSTAIN counter pattern
      (llm-judged-merge.ts:34) — a future MOVE-only refactor candidate. Does
      not affect correctness of the F-C1 guard, only observability.

  - id: F-dom-mem-rerun-5
    severity: MINOR
    status: deferred-acceptable
    summary: |
      consolidation_history has kept_memory_id but no reciprocal `superseded_by_consolidation_id`
      pointer on the memories table for rejected rows — must traverse via the JSONB
      `rejected_memory_ids` array.
    deferral_rationale: |
      Deferred because the public API `history(memoryId)` covers the lineage need
