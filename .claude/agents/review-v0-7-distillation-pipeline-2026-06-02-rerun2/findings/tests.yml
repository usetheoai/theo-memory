determinism:
  random_data_in_assertions: |
    seedRow + seedPair + seed functions use `Math.random()` for hash uniqueness
    (collision avoidance). The random suffix is NEVER asserted against — it
    only enters the hash column to avoid PK collisions across seeded rows.
    Acceptable per testing.md (random IDs OK if not asserted).
  time_dependent_assertions: |
    relative-offset seeding (NOW() + ($offset || ' milliseconds')::interval)
    is deterministic per insert order. No vi.useFakeTimers() needed
    because comparisons are relative (older < newer), not absolute.
  db_state_reset_between_tests: |
    Every integration test has beforeEach(async () => { await reset(); })
    that DELETEs both consolidation_history rows for the policy + memories
    rows for the test user. Reset is scoped to the test's user_id / agent_id
    — does NOT touch other test data. Correct isolation pattern.

