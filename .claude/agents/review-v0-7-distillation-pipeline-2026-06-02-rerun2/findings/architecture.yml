      Future cycle (v0.8?) should ship cosine clustering at the recall layer
      to honor the original ADR D1 intent. Note that the F-C1 guard makes
      LWW essentially equivalent to "consolidate the most recent vs a small
      group" — usable but lower power than ADR D1 promised.

