      every DDL statement + DO-block probe on the FK. Comment at lines
      24-27 explicitly documents the CREATE-TABLE-IF-NOT-EXISTS embedded-FK
      gotcha and why the FK is split into a separate ALTER.
    recommended_action: None. Idempotency discipline is sound.

