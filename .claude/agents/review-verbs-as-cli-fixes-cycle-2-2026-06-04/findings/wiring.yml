findings:
  - id: F-wire-1
    severity: MAJOR
    file: src/agent-tools/cli-scope.ts
    line: 36
    plan_ref: T2.3 / ADR D5 — internal-tag retrofit; implement-validate report § Highlights row 2 claims this was done
    summary: validateScopeOpts MISSING @internal JSDoc tag despite implement-validate report claiming it was tagged
    evidence: |
      $ grep -B 2 'export function validateScopeOpts' src/agent-tools/cli-scope.ts
       * @throws Error with the same message resolveCliScope used to throw.
       */
      export function validateScopeOpts(opts: CliScopeOptions): void {

      implement-validate-2026-06-04.md line 19 claims:
        "6 exports tagged @internal at agent-tools-memory.ts + cli-scope.ts (..., validateScopeOpts)"

      But the JSDoc block (lines 26-35) describes the function as "Boundary-only validator. Throws when zero OR more than one scope field is defined. No Memory dependency..." with NO @internal tag.

      Confirmed via grep against architecture-review F-arch-1 (already flagged this MAJOR).
    recommended_action: |
      Add `* @internal` line to the JSDoc block immediately before `* @throws` line. Brings validateScopeOpts to parity with the 5 other agent-tools-subpath helpers tagged in T2.3 (assertEnvOrExit, PG_URI_ENV_SPEC, OPENAI_API_KEY_ENV_SPEC, wireMemoryFromPool, createAgentToolsMemory). Single-line fix; no behavior change.

  - id: F-wire-2
    severity: MAJOR
    file: src/agent-tools/{agent-tools-memory.ts:34, run-mcp-server.ts:43, run-server.ts:48}
    line: multiple
    plan_ref: T3.1 / ADR D4 — extract single source of truth for provider tuple composition
    summary: LOCAL_EMBEDDER_DIM = 384 declared in 3 separate const sites despite T3.1 extracting the composition body to wireMemoryFromPool
    evidence: |
      $ grep -rn 'const LOCAL_EMBEDDER_DIM = 384' src/agent-tools/
      src/agent-tools/agent-tools-memory.ts:34:const LOCAL_EMBEDDER_DIM = 384;
      src/agent-tools/run-mcp-server.ts:43:const LOCAL_EMBEDDER_DIM = 384;
      src/agent-tools/run-server.ts:48:const LOCAL_EMBEDDER_DIM = 384;

      All three files import wireMemoryFromPool from agent-tools-memory.ts (which already declares LOCAL_EMBEDDER_DIM at module scope), yet run-mcp-server.ts and run-server.ts each re-declare the same magic number for their own `runMigrations(pool, { embeddingDim: LOCAL_EMBEDDER_DIM })` call.

      Confirmed via grep against architecture-review F-arch-2 (already flagged this MAJOR). The duplication is a Rule 12 violation (DRY — duplicated knowledge: the embedder dimension is a single fact about the local provider tuple).
    recommended_action: |
      Promote LOCAL_EMBEDDER_DIM as an additional named export in agent-tools-memory.ts (consider re-using or co-located near wireMemoryFromPool). Update run-mcp-server.ts + run-server.ts to import it instead of re-declaring. Mark the export @internal alongside the others. JSDoc-cross-ref it as "the embedder dimension consumed by both runMigrations (caller-owned) and wireMemoryFromPool (composition helper)." Single source of truth restoration; preserves the runMigrations boundary semantics (each caller still owns its own migration call point per ADR D4 — only the magic number is centralized).

  - id: F-wire-3
    severity: MINOR
    file: src/agent-tools/__tests__/agent-tools-memory.test.ts
    line: 1-74
    plan_ref: T3.1 / EC-3 — pillar (b) integration coverage
    summary: wireMemoryFromPool has NO direct integration-test reference (only unit-tier contract test + transitive integration via 3 callers). check_wiring.py reports HALT.
    evidence: |
