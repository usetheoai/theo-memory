findings:
  - id: F-xval-1
    severity: MAJOR
    file: src/agent-tools/cli-scope.ts
    plan_ref: Sub-goal 5 (M9 closure) + T2.3 § Tasks step 1
    summary: |
      `validateScopeOpts` AND `resolveCliScope` are exported without @internal tag.
      Plan T2.3 explicitly listed `validateScopeOpts` as one of the 6 exports to
      tag. M9 not fully closed.
    evidence: |
      Plan T2.3 § Tasks step 1 says: "Add `@internal Shared boundary helper for
      agent-tools subpath. NOT part of the public @usetheo/memory/agent-tools
      API surface.` JSDoc tag to: `assertEnvOrExit`, `PG_URI_ENV_SPEC`,
      `OPENAI_API_KEY_ENV_SPEC`, `createAgentToolsMemory`, `wireMemoryFromPool`
      (new from T3.1), `validateScopeOpts`."

      Code at src/agent-tools/cli-scope.ts:36-43 (validateScopeOpts) and
      src/agent-tools/cli-scope.ts:55-60 (resolveCliScope):
      ```ts
      /**
       * Boundary-only validator. Throws when zero OR more than one scope field is
       * defined. No Memory dependency — invoke at the CLI boundary BEFORE warming
       * the expensive Memory factory (closes F-dom-cli-2: fail-fast ordering must
       * not pay the ~2-5s factory cost just to reject malformed input).
       * ...
       */
      export function validateScopeOpts(opts: CliScopeOptions): void { ... }
      ```
      No `@internal` JSDoc tag present.

      Empirical grep: `grep -c "@internal" src/agent-tools/cli-scope.ts` → 0.

      Architecture review agent also surfaced this same defect.
    recommended_action: |
      Add the canonical `@internal Shared boundary helper for agent-tools subpath
      (CLI). NOT part of the public @usetheo/memory/agent-tools API surface.`
      JSDoc tag to BOTH `validateScopeOpts` AND `resolveCliScope` in
      src/agent-tools/cli-scope.ts. The plan only enumerated `validateScopeOpts`,
      but `resolveCliScope` is the same shape and same boundary; tagging it
      together honors the plan SPIRIT + closes the consistency gap.

  - id: F-xval-2
    severity: MINOR
    file: src/agent-tools/run-mcp-server.ts:43, src/agent-tools/run-server.ts:48
    plan_ref: ADR D4 § Decision + Sub-goal 8 ("Single source of truth for the provider tuple")
    summary: |
      ADR D4's "Single source of truth for the provider tuple" was honored
      literally for the `createLocalMemory(...)` call SITE (extracted to
      wireMemoryFromPool) but the `LOCAL_EMBEDDER_DIM = 384` constant is
      triplicated across 3 files (agent-tools-memory.ts:34, run-mcp-server.ts:43,
      run-server.ts:48). Two of the three sites also use the constant in their
      own `runMigrations(pool, { embeddingDim: LOCAL_EMBEDDER_DIM })` call
      OUTSIDE the helper, so simply moving it to wireMemoryFromPool would not
      fully consolidate. Architecture agent flagged as MAJOR; cross-validation
      grades MINOR because ADR D4 § Decision literally targets the
      `createLocalMemory({ vectorStore + embedder + llm + embeddingDim })` body,
      not the LOCAL_EMBEDDER_DIM constant. Plan intent vs literal scope gap.
    evidence: |
      Plan ADR D4 § Decision: "extract `wireMemoryFromPool(pool: Pool):
      Promise<Memory>` helper at `agent-tools-memory.ts` that contains the
      `createLocalMemory({ vectorStore + embedder + llm + embeddingDim })`
      body... Single source of truth for the provider tuple."

      grep LOCAL_EMBEDDER_DIM src/agent-tools/ (3 file declarations):
        agent-tools-memory.ts:34: const LOCAL_EMBEDDER_DIM = 384;
        run-mcp-server.ts:43:    const LOCAL_EMBEDDER_DIM = 384;
        run-server.ts:48:        const LOCAL_EMBEDDER_DIM = 384;

      run-mcp-server.ts:106 uses LOCAL_EMBEDDER_DIM in runMigrations call
      (outside wireMemoryFromPool's scope); same in run-server.ts:106.
    recommended_action: |
      Two options:
      (a) Promote LOCAL_EMBEDDER_DIM to an exported `@internal` constant from
          agent-tools-memory.ts; have run-mcp-server.ts + run-server.ts import
          it and use it both inside their runMigrations call AND for their
          stderr log message.
      (b) Accept as honest known-debt + document in a follow-up plan with
          rationale (the JSDoc at run-server.ts:43-47 already says "Mirrors
          run-mcp-server.ts LOCAL_EMBEDDER_DIM constant ... so the REST + MCP
          composition roots stay in lockstep per architecture.md § 5" — that
          discipline pattern is acceptable per architecture.md but the JSDoc
          comment does not enforce the lockstep mechanically).

  - id: F-xval-3
    severity: MINOR
    file: .claude/knowledge-base/reviews/verbs-as-cli-fixes-cycle-2-implement-validate-2026-06-04.md
    plan_ref: T2.3 + Sub-goal 5 (M9 closure)
    summary: |
      Implement-validate report falsely claims T2.3 closure: "6 exports tagged
      @internal at agent-tools-memory.ts + cli-scope.ts (assertEnvOrExit,
      PG_URI_ENV_SPEC, OPENAI_API_KEY_ENV_SPEC, wireMemoryFromPool,
      createAgentToolsMemory, validateScopeOpts)". Empirical grep shows
      validateScopeOpts has NO @internal tag (see F-xval-1). The report
      enumerates a tag that does not exist in the code. Honest-disclosure
      regression against Inquebrável Rule 3.
    evidence: |
      Report § Tasks completed row T2.3: "6 exports tagged `@internal` at
      agent-tools-memory.ts + cli-scope.ts (assertEnvOrExit, PG_URI_ENV_SPEC,
      OPENAI_API_KEY_ENV_SPEC, wireMemoryFromPool, createAgentToolsMemory,
      validateScopeOpts)".

      Actual: grep "@internal" cli-scope.ts → 0 hits; validateScopeOpts is
      undocumented at cli-scope.ts:36 (only ordinary JSDoc, no @internal tag).
    recommended_action: |
      After fixing F-xval-1 (adding the tags), update the implement-validate
      report row T2.3 to honestly reflect the state — OR roll the missing tag
      forward as a known-debt explicitly named. Do not let the false-claim
      survive into /review handoff.

  - id: F-xval-4
    severity: INFO
    file: CHANGELOG.md
    plan_ref: T5.1 (M10 closure)
    summary: |
      The fix-cycle-1 mega-bullet (CHANGELOG.md line 50, ~3000 chars) is
