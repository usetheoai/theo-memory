  - id: F-tests-4
    severity: INFO
    file: tests/integration/cli/verbs-cli-fixes-cycle-2.test.ts
    line: 33-40
    plan_ref: T0.1 Acceptance Criteria
    summary: |
      The `describe.skipIf(!DIST_EXISTS)` pattern silently SKIPs all 8 integration tests when dist/
      is missing. While this is the canonical pattern (mirrors verbs-cli-fixes.test.ts), it means
      a future CI failure where prebuild:clean accidentally removed dist/cli.js (T1.2 over-zealous)
      would cause silent SKIP rather than RED. Test 5 (the dist-clean sentinel) ALSO becomes
      effectively skipped when the negation of its sibling (DIST_EXISTS) holds — circular skip
      semantics: test 5 cannot fail-detect a broken build because the build-broken state skips it.
    evidence: |
      Lines 33-40: `if (!DIST_EXISTS) console.warn(...)` + line 61 `describe.skipIf(!DIST_EXISTS)`.
    recommended_action: |
      OPTIONAL: keep test 5 OUTSIDE the skipIf block (it's a pure filesystem check, not dependent
      on cli.js being runnable). Move it to a sibling describe that always runs. Closes the skip-loop.

