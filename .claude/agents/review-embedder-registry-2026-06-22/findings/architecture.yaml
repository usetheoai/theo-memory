    summary: Unknown provider error correctly typed and informative — lists valid keys per fail-loud design
    evidence: |
      ```ts
      export async function createEmbedder(spec: EmbedderSpec): Promise<Embedder> {
        const loader = EMBEDDER_REGISTRY[spec.provider] as ... | undefined;
        if (loader === undefined) {
          const valid = Object.keys(EMBEDDER_REGISTRY).join(', ');
          throw new EmbedderError(
            `Unknown embedder provider '${String(spec.provider)}'. Valid providers: ${valid}.`,
          );
        }
        return loader(spec);
      }
      ```
      - Throws EmbedderError (not a generic Error) — typed exception per architecture.md § 8
      - Message includes the invalid key AND valid keys list → operationally actionable
      - Matches mem0's unsupported-provider pattern (blueprint Q1)
    recommended_action: None — complies with plan ADR D1 + Inquebrável Rule 8.

