    summary: OllamaEmbedder correctly implements Embedder DIP (2 methods per ADR-0008) with injectable fetch for testability
    evidence: |
      ```ts
      export class OllamaEmbedder implements Embedder {
        private readonly model: string;
        private readonly baseUrl: string;
        private readonly fetchImpl: typeof fetch;

        constructor(options: OllamaEmbedderOptions = {}) {
          this.model = options.model ?? DEFAULT_MODEL;
          this.baseUrl = (options.baseUrl ?? DEFAULT_BASE_URL).replace(/\/+$/, '');
          this.fetchImpl = options.fetchImpl ?? fetch;
        }

        async embed(text: string): Promise<readonly number[]> {
          const [vec] = await this.embedBatch([text]);
          return vec ?? [];
        }

        async embedBatch(texts: readonly string[]): Promise<readonly (readonly number[])[]> {
          if (texts.length === 0) return [];
          // HTTP fetch + error handling
        }
      }
      ```
      - Implements Embedder (2 methods: embed + embedBatch, per ADR-0008)
      - fetch injected via ctor option (testability, default to global)
      - embed() delegates to embedBatch() (DRY, single HTTP path)
      - Empty batch short-circuit at line 47
    recommended_action: None — DIP compliance verified. Identical structure for Voyage and Google adapters.

