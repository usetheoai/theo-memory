    summary: isModuleNotFound() guard correctly detects ERR_MODULE_NOT_FOUND across contexts (dynamic import, CJS, Node versions)
    evidence: |
      ```ts
      function isModuleNotFound(err: unknown): boolean {
        if (typeof err !== 'object' || err === null) return false;
        const code = (err as { code?: unknown }).code;
        if (code === 'ERR_MODULE_NOT_FOUND' || code === 'MODULE_NOT_FOUND') return true;
        const message = (err as { message?: unknown }).message;
        return typeof message === 'string' && /cannot find (module|package)/i.test(message);
      }
      ```
      - Defensive type narrowing (unknown → object → optional code/message)
      - Checks both error.code (ESM standard) and error.message regex (CJS fallback)
      - Used in SDK-backed loaders (openai, local) at lines 65 + 78
    recommended_action: None — error detection is robust and follows Node.js conventions.

