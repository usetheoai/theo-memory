# Labels de runner que o actionlint deve aceitar em `runs-on`.
#
# O DEFEITO QUE ISTO PREVINE: o actionlint valida `runs-on` contra a lista de labels
# GitHub-hosted que ele conhece e REJEITA qualquer outra ("label ... is unknown"). Enquanto
# o runner deste repo saia de uma expressao (`fromJSON(vars.CI_RUNNER)`), a checagem era
# pulada — actionlint nao avalia expressao estaticamente, entao a label nunca era vista.
# Ao fixar a label literal da Blacksmith, ela passa a ser vista, e sem esta declaracao o
# proprio gate de workflows falharia em todos os 6 arquivos.
#
# `self-hosted-runner.labels` e a chave prevista para exatamente isto: labels servidas por
# uma frota que nao e a do GitHub. As da Blacksmith entram aqui apesar do nome da chave —
# do ponto de vista do actionlint, qualquer runner nao-GitHub-hosted e "self-hosted".
self-hosted-runner:
  labels:
    - blacksmith-8vcpu-ubuntu-2404
