# GHCR build + Trivy scan workflow for @usetheo/memory standalone image.
#
# Triggers:
#   - tag push matching `v*` (release path; publishes ghcr.io/usetheo/themory:$TAG)
#   - push to `main` (preview path; publishes ghcr.io/usetheo/themory:edge)
#   - manual dispatch (operator-driven smoke build)
#
# EC-43 absorption — Trivy gate aligned with deps-audit-golden-rule.md:
#   - severity CRITICAL,HIGH → fail the job (exit-code 1)
#   - .trivyignore at repo root carries sunset-dated allowlist entries
#     (mirror of deps-audit-allowlist.txt format: CVE-ID|REASON|SUNSET-DATE)
#
# EC-44 absorption — permissions declared at job level:
#   - contents: read (checkout)
#   - packages: write (push to GHCR)
#
# @see Plan theo-memory-standalone-p0 § T3.3 + EC-43 + EC-44
# @see .claude/rules/deps-audit-golden-rule.md § Severity rubric

name: docker-publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository_owner }}/themory
  DOCKERHUB_IMAGE: usetheo/themory

jobs:
  build-and-publish:
    name: Build, scan, publish
    runs-on: [self-hosted, linux, x64] # GitHub-hosted minutes are billing-blocked — the theo-ci-theo-memory runner on the theo-ci-runner droplet (docker + buildx present; trivy comes from aquasecurity/trivy-action). See theo-data/CI-RUNNER-VM-GUIDE.md.
    permissions:
      contents: read
      packages: write
    env:
      # The `secrets` context is NOT allowed in a step `if:` (GitHub rejects the workflow
      # with "Unrecognized named-value: 'secrets'"). Lift the token to a JOB-level env var
      # — a job-level env CAN reference secrets — so the presence-guards below use `env.*`,
      # which IS valid in `if:`. The value stays masked in logs (GitHub masks secrets in env).
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # EC-1: guard on the JOB-level env.DOCKERHUB_TOKEN (mapped from the secret above).
      # `secrets.*` is invalid inside `if:`; `env.*` is the supported presence-check and
      # is non-empty exactly when the DOCKERHUB_TOKEN secret is set.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract GHCR metadata
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      # Docker Hub: stable tags only (x.y.z + x.y + latest) per ADR D2.
      # edge tag goes to GHCR only — prevents accidental production use of unstable builds.
      - name: Extract Docker Hub metadata
        if: ${{ env.DOCKERHUB_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') }}
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build image (load locally for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: themory:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (CRITICAL + HIGH gate per EC-43)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: themory:scan-target
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      # EC-2: single push step with combined tags from BOTH metadata steps.
      # Uses the same build cache as the scan step so the pushed image is the
      # EXACT digest Trivy scanned. A separate build-push would rebuild from
      # scratch, producing a potentially different image that bypasses the gate.
      - name: Push image to registries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
