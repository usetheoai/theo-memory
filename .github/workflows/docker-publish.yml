# GHCR build + Trivy scan workflow for @usetheo/memory standalone image.
#
# Triggers:
#   - tag push matching `v*` (release path; publishes ghcr.io/usetheo/themory:$TAG)
#   - push to `main` (preview path; publishes ghcr.io/usetheo/themory:edge)
#   - manual dispatch (operator-driven smoke build)
#
# EC-43 absorption — Trivy gate aligned with deps-audit-golden-rule.md:
#   - severity CRITICAL,HIGH → fail the job (exit-code 1)
#   - .trivyignore at repo root carries sunset-dated allowlist entries
#     (mirror of deps-audit-allowlist.txt format: CVE-ID|REASON|SUNSET-DATE)
#
# EC-44 absorption — permissions declared at job level:
#   - contents: read (checkout)
#   - packages: write (push to GHCR)
#
# @see Plan theo-memory-standalone-p0 § T3.3 + EC-43 + EC-44
# @see .claude/rules/deps-audit-golden-rule.md § Severity rubric

name: docker-publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/themory

jobs:
  build-and-publish:
    name: Build, scan, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build image (load locally for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: themory:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (CRITICAL + HIGH gate per EC-43)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: themory:scan-target
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
