name: vendor-benchmarks

# Runs vendor real-SaaS integration tests against Mem0, Zep, Letta.
#
# Per plan v0-9-vendor-client-impls v1.3 § Phase 5 / T5.1:
# - `schedule` cron triggers daily at 06:00 UTC for continuous drift detection
# - `workflow_dispatch` allows manual runs from main with `gh workflow run`
# - NO `pull_request` trigger per EC-14: GitHub does NOT expose secrets to fork
#   PRs by design — gating on pull_request would either leak nothing (vendor
#   tests SKIP infinitely, masking regressions) or require pull_request_target
#   + safe-to-test labels (out of scope for v0.9; tracked as follow-up).
#
# Cost note (EC-12 documented risk): cron daily × 3 vendors × ~5 calls/test
# ≈ 450 SaaS API calls/month. Operator monitors billing on each vendor's free
# tier. Pause the schedule via `gh workflow disable vendor-benchmarks` if
# quota exhaustion is observed.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  vendor-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (legacy-peer-deps for mem0ai pg pin)
        run: npm ci --legacy-peer-deps

      - name: Run vendor integration tests against real SaaS
        run: npx vitest run tests/integration/benchmarks/vendor-mem0.test.ts tests/integration/benchmarks/vendor-zep.test.ts tests/integration/benchmarks/vendor-letta.test.ts
        env:
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          LETTA_API_KEY: ${{ secrets.LETTA_API_KEY }}
          LETTA_AGENT_ID: ${{ secrets.LETTA_AGENT_ID }}
