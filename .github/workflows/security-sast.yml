# Security SAST (OWASP A05 / CWE-1059) — M5 CD pipeline (playbook Phase 2). The
# production surface is 100% TypeScript; this workflow runs semgrep with the
# TypeScript + OWASP Top-Ten rulesets on every PR and push to the protected
# branches, failing the build on any finding.
#
# Third-party study material under .claude/knowledge-base/references/ is excluded
# (other projects' code, not ours).
name: Security SAST

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep (TypeScript / OWASP)
    # Self-hosted (theo-ci-theo-memory) — GitHub-hosted minutes are billing-blocked
    # for the org.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run semgrep
        # semgrep runs in a `docker run` (NOT a job-level `container:`). A container
        # job runs EVERY step — including actions/checkout — as root, leaving
        # root-owned files in the shared self-hosted `_work` that break the next
        # host-run job's checkout. Here the checkout runs on the host (runner-owned)
        # and only the scan runs in the container, mounting the workspace.
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan \
              --config p/typescript \
              --config p/javascript \
              --config p/owasp-top-ten \
              --error \
              --exclude '.claude/knowledge-base/references' \
              --exclude node_modules \
              --exclude dist \
              /src
