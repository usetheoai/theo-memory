# Security SAST (OWASP A05 / CWE-1059) — M5 CD pipeline (playbook Phase 2). The
# production surface is 100% TypeScript under `packages/*/src`; this workflow runs
# semgrep with the TypeScript + JavaScript + OWASP Top-Ten rulesets against that
# surface on every PR and push to the protected branches, failing the build on any
# finding.
#
# Scope discipline (matches the "production TypeScript surface" intent above):
#   - Target is `packages` (the shipped TS), NOT the whole repo. Supply-chain /
#     IaC hardening (Dockerfile non-root, pnpm minimum-release-age / trust-policy)
#     is a SEPARATE concern tracked as a follow-up, not this TS-SAST gate.
#   - Test files (`*.test.ts`) are excluded — a test that deliberately exercises an
#     insecure path (e.g. `rejectUnauthorized:false` against a self-signed dev cert
#     to prove the TLS handshake) is not production code.
#   - Reviewed-and-accepted production findings carry an inline `// nosemgrep: <rule>`
#     with a justification (audit trail), e.g. the unauthenticated CORS preflight in
#     the Bearer-auth wrappers (no credentials mode → reflected Origin is safe).
name: Security SAST

# GATILHOS: PR para `develop` ou `main` (gate antes de entrar no trunk) + push em `develop`
# (verificação pós-merge). Ver o racional completo em `ci.yml`.
on:
  # SEM paths-ignore, de proposito. O gitleaks aqui procura CONTEUDO, nao codigo:
  # credencial vaza por acidente justamente em prosa — exemplo de configuracao,
  # runbook, passo-a-passo de setup — e em script de hook. Filtrar por caminho um
  # gate que procura conteudo inverte o proposito dele.
  #
  # Os gates de TESTE (ci, integration, eval) podem ignorar prosa, porque markdown
  # nao muda comportamento de runtime. Este nao pode.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

# One run per ref — a new push cancels the in-flight run (single self-hosted runner;
# matches integration.yml / publish.yml).
concurrency:
  # #129: key on the branch so a push and its PR share one group (see integration.yml).
  group: sast-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep (TypeScript / OWASP)
    # Blacksmith (#156) — ver integration.yml para as duas pré-condições que atrasaram a migração.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Medido: max ~3 min (semgrep + gitleaks em container). 15 cobre pull de imagem em runner frio.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run semgrep
        # semgrep runs in a `docker run` (NOT a job-level `container:`). A container
        # job runs EVERY step — including actions/checkout — as root, leaving
        # root-owned files in the shared self-hosted `_work` that break the next
        # host-run job's checkout. Here the checkout runs on the host (runner-owned)
        # and only the scan runs in the container, mounting the workspace.
        run: |
          docker run --rm -v "$PWD:/src" \
            semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941 \
            semgrep scan \
              --config p/typescript \
              --config p/javascript \
              --config p/owasp-top-ten \
              --error \
              --exclude node_modules \
              --exclude dist \
              --exclude '*.test.ts' \
              --exclude '*.spec.ts' \
              /src/packages
      - name: Secret scan (gitleaks — theo_live_ keys, #126)
        # ESCOPO = A RAIZ, nao `packages/`. Ate 2026-07-28 este scan lia so `/src/packages`,
        # enquanto o workflow ja tinha perdido o `paths-ignore` sob a justificativa de que
        # "prosa e onde credencial vaza por acidente". A justificativa estava certa e o
        # escopo a contradizia: README, runbook, `docs/` e `.claude/` ficavam de fora, e o
        # unico efeito da remocao do filtro era rodar o job em push so-de-docs sem ganhar
        # cobertura alguma. Gate cuja justificativa nao corresponde ao que ele faz e pior
        # que gate ausente — alguem le a justificativa e para de procurar.
        #
        # Targeted preventive gate: a hardcoded theo_live_ API key added to the production tree
        # fails CI. Scans the working tree (not git history) with `.gitleaks.toml`, so it does not
        # re-flag the already-exposed keys #126 tracks for the OWNER to rotate (history rewrite is
        # forbidden — Rule 4). Rule 9: gitleaks is the standard scanner; not reinvented.
        run: |
          docker run --rm -v "$PWD:/src" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /src --config /src/.gitleaks.toml --no-banner --exit-code 1
