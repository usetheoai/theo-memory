# CÓPIA VENDORIZADA do reusable `usetheodev/theo/.github/workflows/build-publish.yml@develop`.
#
# POR QUE ESTA CÓPIA EXISTE (2026-07-27, #156): este repo foi transferido para a organização
# `usetheoai` (pré-requisito da Blacksmith, que não serve repositórios de conta pessoal). O
# `theo`, dono do reusable original, continua em `usetheodev` E É PRIVADO — e o GitHub só permite
# compartilhar workflow reusável privado DENTRO DO MESMO DONO:
#
#     "Accessible from repositories in the 'ORGANIZATION-NAME' organization"
#
# Não existe mecanismo cross-owner. A chamada passou a falhar no parse ("workflow was not found"),
# derrubando o workflow inteiro — nem o job de deploy chegava a ser criado.
#
# DÍVIDA CONSCIENTE, COM DATA DE VALIDADE: SUNSET 2026-10-26.
#
# O original existe para ser "the single hardened image pipeline for the whole org"; esta cópia
# duplica exatamente aquilo que deveria ser único, e já divergiu em quatro pontos (abaixo).
# QUANDO `usetheodev/theo` MIGRAR PARA `usetheoai`, APAGUE ESTE ARQUIVO e devolva o `publish.yml`
# para `uses: usetheoai/theo/...`. O teste `tests/integration/publish-workflow.test.ts` fixa qual
# referência está em uso e tem de ser atualizado no mesmo commit.
#
# A data acima é VERIFICADA por teste (`a divida da copia vendorizada tem sunset`), que fica
# vermelho depois dela. Isso é deliberado: até 2026-07-28 a dívida dizia ter "data de validade"
# sem ter data nenhuma — prosa que não expira não é prazo, é intenção. Ao vencer, há duas saídas
# honestas, e ambas exigem um commit: migrar (apagar a cópia) ou estender a data reconhecendo que
# a divergência cresceu mais um trimestre.
#
# DIFERENÇAS EM RELAÇÃO AO ORIGINAL — quatro, e nenhuma é cosmética:
#   1. `registry` default → `ghcr.io/usetheoai`. Um run de `usetheoai` recebe GITHUB_TOKEN de
#      outro escopo e NÃO tem push no namespace `ghcr.io/usetheodev`.
#   2. `runner` default → label da Blacksmith. O build original morria por `No space left on
#      device` no droplet compartilhado (run 30293925364); runner efêmero sobe com disco limpo.
#   3. `--certificate-identity-regexp` do cosign → aponta para ESTE caminho. A identidade de
#      assinatura keyless é derivada do repo+path do workflow; mantê-la apontando para
#      `usetheodev/theo` faria a verificação de release falhar — ou, pior, aceitar assinatura
#      produzida por outro workflow. É o guard de confused-deputy, tem de acompanhar a cópia.
#   4. `attest` separado de `sign` (+ `platforms` e os `outputs` de digest). No original, `sign`
#      empacotava cosign + SBOM + proveniência `mode=max` num input só — e como `mode=max` é caro,
#      a única escolha viável era "tudo na release". O efeito era que o artefato REALMENTE
#      IMPLANTADO (`:develop`, que o reconciliador puxa a cada 5 min) não tinha assinatura alguma:
#      a garantia vivia num canal diferente do que roda. Separados, assina-se sempre (segundos) e
#      atesta-se só onde a auditoria consome. PORTAR ESTA MUDANÇA PARA O ORIGINAL — senão o retorno
#      ao reusable, quando `theo` migrar, silenciosamente desfaz a assinatura do canal implantado.
#
# Todo o resto é idêntico ao original, incluindo os SHAs pinados de cada action.
name: build-publish (vendored)
on:
  workflow_call:
    inputs:
      image:           { required: true,  type: string }
      dockerfile:      { required: true,  type: string }
      context:         { required: false, type: string,  default: "." }
      registry:        { required: false, type: string,  default: "ghcr.io/usetheoai" }
      sign:            { required: false, type: boolean, default: false }   # cosign keyless sign by digest — barato (~segundos)
      verify:          { required: false, type: boolean, default: false }   # identity-pinned cosign verify (needs sign=true)
      # SBOM + proveniencia SLSA (mode=max). SEPARADO de `sign` de proposito.
      #
      # O input `sign` original empacotava tres coisas de custo muito diferente:
      # cosign (segundos), SBOM e proveniencia mode=max (export grande — o
      # proprio comentario do cache-to abaixo registra que o servico de cache do
      # GHA devolve 500/BlobNotFound justamente nesses exports).
      #
      # Empacotadas, a unica escolha era "tudo na release" — e isso deixava o
      # artefato REALMENTE IMPLANTADO (`:develop`, que o reconciliador puxa) sem
      # assinatura nenhuma. A garantia existia num canal diferente do que roda.
      # Separadas, da para assinar sempre e atestar so onde a auditoria consome.
      attest:          { required: false, type: boolean, default: false }
      trivy:           { required: false, type: boolean, default: false }   # CRITICAL/HIGH Trivy gate before push (uses .trivyignore if present)
      dockerhub_image: { required: false, type: string,  default: "" }      # e.g. "usetheo/themory" — also push to Docker Hub when DOCKERHUB_TOKEN is set
      # Arquiteturas do manifesto publicado. Default `linux/amd64` — o mesmo
      # comportamento de antes, custo zero.
      #
      # POR QUE E INPUT E NAO CONSTANTE: arm64 aqui e construido por EMULACAO
      # (QEMU), e este build ja leva ~14 min a frio pelo double-build do gate
      # Trivy (ver comentario no login do GHCR). Ligar arm64 em todo push de
      # develop cobraria esse preco em cada iteracao. Quem chama decide onde a
      # portabilidade vale o tempo.
      #
      # O ganho e concreto quando o destino e ARM: uma imagem so-amd64 nao roda
      # em no Graviton, e o erro no cluster e obscuro. O custo medido da
      # alternativa (familia AMD em vez de Graviton) foi ~$100/mes numa unica
      # maquina de 8 vCPU / 32 GB.
      platforms:       { required: false, type: string,  default: "linux/amd64" }
      runner:          { required: false, type: string,  default: '["blacksmith-8vcpu-ubuntu-2404"]' }   # JSON array
    secrets:
      GOMOD_TOKEN:        { required: false }   # cross-repo read for the pinned private theo-contracts module
      DOCKERHUB_USERNAME: { required: false }
      DOCKERHUB_TOKEN:    { required: false }
    outputs:
      # O digest e o UNICO identificador imutavel do que foi publicado. Sem ele
      # exportado, quem consome so tem a tag — e tag se move: `:develop` de hoje
      # nao e `:develop` de amanha. Um deploy que resolve tag no momento do pull
      # nao e idempotente, porque duas aplicacoes "da mesma versao" podem trazer
      # imagens diferentes. O digest ja era calculado aqui, usado para assinar
      # (linha ~157) e descartado no fim do job.
      digest:
        description: "Digest imutavel (sha256:...) da imagem publicada."
        value: ${{ jobs.build-publish.outputs.digest }}
      image_ref:
        description: "Referencia completa fixada por digest, pronta para deploy."
        value: ${{ jobs.build-publish.outputs.image_ref }}
permissions:
  contents: read
  packages: write
  id-token: write   # consumed only when sign=true (keyless cosign); harmless otherwise
jobs:
  build-publish:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # 30 min contra um p95 medido de 305 s na era Blacksmith — margem de ~6x, generosa
    # o bastante para o caso frio (~14 min pelo double-build do gate Trivy) e para o
    # build multi-arch da release, sem deixar o teto padrao de 360 min de pe.
    #
    # TEM DE FICAR AQUI. O GitHub nao honra `timeout-minutes` em job `uses:`, entao
    # aplica-lo no publish.yml — o lugar obvio — seria silenciosamente inerte.
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
    env:
      # `secrets` is NOT allowed in step `if:` — lift the token to a job-level env so the
      # Docker Hub guards below can use `env.*` (valid in if/with). Stays masked in logs.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # QEMU so e necessario para construir arquitetura diferente da do runner.
      # Condicional porque o setup nao e de graca e a maioria dos runs e amd64
      # nativo — pagar por ele em todo push seria taxa sem contrapartida.
      - name: Set up QEMU (emulacao cross-arch)
        if: ${{ inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Compute tags (community-standard channels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          # Docker Hub image is added ONLY when both the input and the token are present,
          # so a missing secret never produces an un-pushable docker.io tag.
          images: |
            ${{ inputs.registry }}/${{ inputs.image }}
            ${{ (inputs.dockerhub_image != '' && env.DOCKERHUB_TOKEN != '') && format('docker.io/{0}', inputs.dockerhub_image) || '' }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=develop-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # --- Optional Trivy gate (build locally, scan, THEN push the cache-identical image) ---
      - name: Build for scan (Trivy gate)
        if: ${{ inputs.trivy }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image }}:scan-target
          cache-from: type=gha,scope=${{ inputs.image }}
          # ignore-error: the GitHub Actions cache service (type=gha) intermittently 500s /
          # returns BlobNotFound on export (esp. large mode=max exports on self-hosted
          # runners). Cache is a build-time optimization, not a correctness input — a cache
          # miss/failure must never fail the build. Warns and continues instead.
          # Condicional ao canal, de proposito. Os dois canais dividem UM escopo mas
          # tem frequencia e tamanho muito diferentes: develop e todo push, amd64,
          # quente; tag e rara, multi-arch, export mode=max (grande). O cache do GHA
          # tem teto por repositorio e despeja por LRU — o export raro e grande da
          # release despeja as camadas quentes do develop, e os builds de develop
          # passam a rodar frios. Pior: a entrada escrita pela release quase certamente
          # e despejada antes da proxima tag, entao o upload e pago sem nunca ser lido.
          #
          # LER continua sempre (`cache-from` acima): a release aproveita as camadas do
          # develop de graca. So ESCREVER e que fica fora de tag.
          cache-to: ${{ startsWith(github.ref, 'refs/tags/') && '' || format('type=gha,mode=max,ignore-error=true,scope={0}', inputs.image) }}
          secrets: |
            gomod_token=${{ secrets.GOMOD_TOKEN }}

      - name: Trivy vulnerability scan (CRITICAL + HIGH gate)
        if: ${{ inputs.trivy }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:scan-target
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      # Registry login happens HERE — AFTER the (slow, cold-cache) Trivy build-for-scan — so the
      # GHCR token is FRESH at push time. A long build (e.g. a native-compile image via the Trivy
      # double-build, ~14 min cold) would otherwise outlive a token fetched at job start → buildkit
      # re-auths anonymously → 403 on the attestation push. The build-for-scan above needs no
      # registry login (it loads locally + uses the GHA cache + a public base image).
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        if: ${{ inputs.dockerhub_image != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build + push (cache-identical to the scanned image when trivy=true) ---
      - name: Build + push (SBOM + SLSA mode=max quando attest=true)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          # O gate Trivy acima permanece SINGLE-ARCH de proposito: ele usa
          # `load: true`, e o docker local nao carrega manifest list. Scanear a
          # arch nativa do runner e o que da para fazer sem um segundo job por
          # arquitetura — e as CVEs de sistema operacional sao as mesmas base
          # image, nao variam por arch na pratica.
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ inputs.attest }}
          provenance: ${{ inputs.attest && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ inputs.image }}
          # ignore-error: the GitHub Actions cache service (type=gha) intermittently 500s /
          # returns BlobNotFound on export (esp. large mode=max exports on self-hosted
          # runners). Cache is a build-time optimization, not a correctness input — a cache
          # miss/failure must never fail the build. Warns and continues instead.
          # Condicional ao canal, de proposito. Os dois canais dividem UM escopo mas
          # tem frequencia e tamanho muito diferentes: develop e todo push, amd64,
          # quente; tag e rara, multi-arch, export mode=max (grande). O cache do GHA
          # tem teto por repositorio e despeja por LRU — o export raro e grande da
          # release despeja as camadas quentes do develop, e os builds de develop
          # passam a rodar frios. Pior: a entrada escrita pela release quase certamente
          # e despejada antes da proxima tag, entao o upload e pago sem nunca ser lido.
          #
          # LER continua sempre (`cache-from` acima): a release aproveita as camadas do
          # develop de graca. So ESCREVER e que fica fora de tag.
          cache-to: ${{ startsWith(github.ref, 'refs/tags/') && '' || format('type=gha,mode=max,ignore-error=true,scope={0}', inputs.image) }}
          secrets: |
            gomod_token=${{ secrets.GOMOD_TOKEN }}

      - name: Install cosign
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign by digest
        if: ${{ inputs.sign }}
        run: cosign sign --yes "${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}"

      # Confused-deputy guard (EC-2): accept ONLY signatures produced by THIS workflow
      # (path-pinned) via the GitHub OIDC issuer.
      #
      # A identidade foi REPINADA para este caminho vendorizado. A identidade keyless deriva de
      # repo + path do workflow, então manter o regexp do original (`usetheodev/theo/...`) faria a
      # verificação falhar em toda release — e, pior, um regexp frouxo aqui aceitaria assinatura
      # produzida por outro workflow, que é exatamente o ataque que este guard existe para barrar.
      - name: Verify the signature (identity-pinned)
        if: ${{ inputs.sign && inputs.verify }}
        run: |
          cosign verify "${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp '^https://github\.com/usetheoai/theo-memory/\.github/workflows/build-publish\.yml@refs/(heads|tags)/.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # O digest exportado (workflow_call.outputs) serve a um workflow consumidor.
      # O deploy de hoje e um reconciliador systemd que puxa TAG, e nao le outputs
      # de workflow — entao sem isto o digest continuaria invisivel para quem
      # opera. Publicar no resumo do run e o caminho mais barato para tornar a
      # referencia imutavel utilizavel HOJE, sem inventar um canal novo.
      - name: Publicar a referencia imutavel no resumo do run
        env:
          IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          {
            printf '## Imagem publicada\n\n'
            printf 'Referencia fixada por digest — use ESTA no deploy, nao a tag:\n\n'
            printf '    %s\n\n' "$IMAGE_REF"
            printf 'Tag e mutavel: develop de hoje nao e develop de amanha.\n'
            printf 'Fixar o digest e o que torna o deploy idempotente.\n'
          } >> "$GITHUB_STEP_SUMMARY"
