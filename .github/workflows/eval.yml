# LLM-stage eval (M21) — conditional regression gate for @usetheo/memory-eval.
#
# Two tiers (ADR D4):
#   - LLM-FREE (unconditional): the package test suite (structural runners +
#     the baseline regression gate via run.test.ts) plus the explicit `eval`
#     gate. Deterministic, keyless, cheap — always runs.
#   - LLM-MEASURED (key-gated): the real-LLM tier runs ONLY when the
#     OPENROUTER_KEY secret is present. Without it the tier SKIPs honestly and
#     never fabricates a passing score.
name: eval

on:
  pull_request:
  push:
    branches: [develop, main]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  eval:
    name: LLM-stage eval (free gate always, measured tier key-gated)
    # Self-hosted (GitHub-hosted minutes are billing-blocked for the org),
    # matching security-sast.yml / integration.yml.
    # Blacksmith tentada e revertida 2026-07-27 (#156) — ver integration.yml.
    runs-on: [self-hosted, linux, x64]
    # Medido: max 1,3 min. 15 e' folga larga para o tier LLM-measured, que so roda com a chave presente.
    timeout-minutes: 15

    # #155 — the key MUST be lifted to job-level `env` here, NOT read as `secrets.*` in the
    # step `if:` below. The `secrets` context does not exist in `if:` expressions (only in
    # `env:`, `with:` and a reusable workflow's `secrets:` block), and GitHub rejects the
    # file at PARSE time: "Unrecognized named-value: 'secrets'" — which surfaces as a
    # startup_failure (run created, zero jobs, 0s) rather than a step error. The gate was
    # therefore dead for 30/30 runs while looking merely "red".
    #
    # Unset secret renders as the empty string, so `env.OPENROUTER_KEY != ''` preserves the
    # ADR D4 intent exactly: the measured tier SKIPs honestly instead of fabricating a score.
    env:
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.34.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # LLM-FREE — always runs. The test suite includes run.test.ts, which gates
      # the deterministic stage scores against the committed baseline.
      - name: LLM-free eval (structural tier + regression gate)
        run: pnpm --filter @usetheo/memory-eval test

      - name: LLM-free regression gate (explicit)
        run: pnpm --filter @usetheo/memory-eval eval

      # LLM-MEASURED — only when the OpenRouter key secret is configured. Without
      # it, this step is skipped entirely (the tier would SKIP anyway).
      - name: LLM-measured tier (real OpenRouter LLM)
        # `env`, unlike `secrets`, IS a valid context in a step `if:` — see the job-level
        # `env:` block above (#155).
        if: ${{ env.OPENROUTER_KEY != '' }}
        # Target ONLY the measured tests (vitest path filter) — the LLM-free step
        # above already ran the full suite; rerunning it here would double the
        # compute and bury the measured pass/fail in a full-suite rerun.
        run: pnpm --filter @usetheo/memory-eval test -- llm-measured
