# Image publish.
#   develop push → build ./Dockerfile → ghcr.io/usetheoai/themory:develop (+ :develop-<sha>)
#                  atrás do gate Trivy CRITICAL/HIGH.
#   v* tag       → :X.Y.Z + :X.Y + :latest, SBOM + SLSA + keyless cosign.
#
# ESTE WORKFLOW NÃO FAZ DEPLOY — E ISSO É DELIBERADO (2026-07-27).
#
# Até esta data ele carregava um job `deploy-dev` que fazia SSH para um host nosso. Isso obrigava o
# repositório a conhecer — e versionar — o usuário, o caminho e a topologia de um ambiente
# específico, além de manter uma chave SSH com shell nos secrets do CI. Para um projeto que vai ser
# ABERTO, é inaceitável: nada disso é do produto, é da nossa operação.
#
# O deploy passou a ser PULL: o host roda um reconciliador que converge para a tag publicada.
# A troca elimina três coisas de uma vez — o repo público não sabe que existe um host, o CI não
# guarda mais credencial de acesso a ele, e a reconciliação passa a ser contínua em vez de um
# evento pontual. O ambiente é responsabilidade de quem o opera; este repo publica a imagem.
#
# O contrato entre os dois lados é UMA COISA SÓ: a tag da imagem. Nada mais.
name: publish
# GATILHOS: push em `develop` (publica `:develop` + `:develop-<sha>`) e tag `v*` (imagem de release
# assinada).
#
# POR QUE ESTE WORKFLOW NÃO SEGUE A REGRA DOS OUTROS: ele é CD, não gate. O que ele faz é
# consequência de um merge já aprovado, não verificação de um candidato. Release disparado por TAG,
# e não por clique humano, é o que mantém a publicação reproduzível e auditável.
#
# POR QUE NÃO RODA EM PULL REQUEST: o reusable SEMPRE dá push da imagem; não há modo build-only.
# Rodar em PR publicaria artefato de código não mergeado. O custo dessa escolha é honesto — uma
# quebra de Dockerfile só aparece pós-merge — e é preferível a poluir o registry.
#
# O `workflow_dispatch` fica como escape hatch (exercitar mudança neste arquivo, republicar).
on:
  push:
    branches: [develop]
    tags: ["v*"]
    # #116: um push em develop que só mexe em docs pula a esteira inteira de build.
    #
    # DELIBERADAMENTE lista de EXCLUSÃO, não filtro positivo: este workflow escuta `tags: ["v*"]`,
    # e filtro de path se aplica TAMBÉM a push de tag. Um filtro positivo faria um release cujo
    # commit não casasse a lista ser ignorado em silêncio — nenhuma imagem publicada, nenhum erro.
    # Exclusão erra para o lado de publicar a mais, que aqui é o lado certo.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      # Adicionados em 2026-07-27: nada aqui entra na imagem. Medido no commit `6b333d9`,
      # que tocou só workflows + CHANGELOG e mesmo assim disparou build + push de
      # uma imagem idêntica, além de CI, SAST, eval e integration — seis runs numa fila
      # serial compartilhada por cinco repositórios.
      - 'docs/**'
      - 'agents/**'
      # `.github/**` NAO entra aqui (ADR-5). O comentario anterior dizia "mudar um workflow
      # nao muda a imagem" — falso para `build-publish.yml`, que DEFINE como a imagem e
      # construida (Dockerfile, plataformas, cache, assinatura). Confundia CONTEUDO da imagem
      # com PROCESSO de construcao. E, como este workflow agora invoca os gates, ignorar
      # `.github/**` faria mudanca de workflow deixar de rodar os testes que a validam.
  workflow_dispatch:
# Pushes sucessivos em develop devem SUPERSEDER (cancelar) o run mais antigo em vez de empilhar:
# só a imagem mais nova interessa, e build cancelado é minuto de runner economizado. Antes de o
# deploy sair daqui havia um risco extra — cancelar sem sucessor deixava o host sem deploy (incidente
# 2026-07-22) —; hoje isso não se aplica, porque quem converge o ambiente é o reconciliador no
# próprio host, não este workflow. Runs de tag têm grupo próprio e nunca são cancelados por develop.
concurrency:
  # #129 note: publish listens on push + tag ONLY (no pull_request), so it does NOT
  # double-run — the push/PR key-mismatch that #129 fixes for integration/sast does not
  # apply here. Left on github.ref deliberately: a tag build (v*) and a develop push MUST
  # stay in separate groups, and cancel-in-progress is already tag-aware below. Changing
  # the key would risk the signed release build for zero dedup benefit.
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign via GitHub OIDC (release only)
jobs:
  # A TAG DE RELEASE TEM DE ESTAR EM `main` — senão `:latest` sai de código não promovido.
  #
  # `:latest` é a referência que a reconciliação de PRODUÇÃO consome. Ela já era condicionada a
  # `refs/tags/v*`, mas tag não é promoção: nada impedia taggear um commit de `develop`, de um
  # branch de trabalho ou de um fork-merge e publicar `:latest` a partir dele. O contrato do ciclo
  # de release (`develop → main` por PR, tag no merge) era DISCIPLINA, não enforcement — e a
  # diferença só aparece no dia em que alguém taggeia no lugar errado, com produção puxando.
  #
  # Usa a API em vez de `git merge-base`: dispensa checkout (o histórico completo deste repo é caro
  # de buscar só para responder sim/não) e roda em segundos.
  #
  # `compare/main...<sha>` devolve a posição do commit RELATIVA a main:
  #   identical -> a tag é exatamente o head de main            (ok)
  #   behind    -> a tag é um ancestral de main; main avançou   (ok — foi promovida)
  #   ahead     -> a tag tem commits que main não tem           (NÃO promovida)
  #   diverged  -> históricos separados                         (NÃO promovida)
  guard-release-on-main:
    runs-on: ${{ fromJSON('["blacksmith-8vcpu-ubuntu-2404"]') }}
    steps:
      - name: A tag esta em main?
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .status)"
          echo "posicao de ${SHA} em relacao a main: ${STATUS}"
          case "${STATUS}" in
            identical|behind)
              echo "OK — a tag esta em main; :latest pode ser publicada." ;;
            *)
              echo "::error::A tag ${GITHUB_REF_NAME} NAO esta em main (${STATUS})." >&2
              echo "::error::':latest' alimenta a reconciliacao de PRODUCAO e so pode sair de codigo promovido." >&2
              echo "::error::Promova develop -> main por PR e taggeie o commit de merge." >&2
              exit 1 ;;
          esac

  # Os gates rodam AQUI, invocados por `workflow_call` — uma definicao, dois invocadores
  # (PR chama direto; push chega por este workflow). `workflow_call` e sincrono no mesmo
  # run e preserva `github.sha`, ao contrario de `workflow_run`.
  gate-ci:
    uses: ./.github/workflows/ci.yml

  gate-contract:
    uses: ./.github/workflows/integration.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # Chama a CÓPIA VENDORIZADA local, não o reusable de `usetheodev/theo`.
  #
  # POR QUÊ: `usetheodev/theo` é privado e de outro dono desde a transferência deste repo para a
  # org `usetheoai`, e o GitHub só compartilha reusable privado dentro do mesmo dono. A chamada
  # cross-owner falhava no PARSE ("workflow was not found"), o que derrubava o workflow inteiro —
  # zero jobs criados: o workflow inteiro morria antes de qualquer step.
  #
  # DÍVIDA TEMPORÁRIA: quando `usetheodev/theo` migrar para `usetheoai`, volte esta linha para
  # `uses: usetheoai/theo/.github/workflows/build-publish.yml@develop` e APAGUE
  # `.github/workflows/build-publish.yml`. O teste `tests/integration/publish-workflow.test.ts`
  # fixa qual referência está em uso e falha se as duas coisas não andarem juntas.
  image:
    # A guarda roda em todo disparo e sai imediatamente quando nao e tag — o job existe
    # para que `needs` seja incondicional aqui. Com `needs` condicional, um job pulado
    # arrastaria o `image` junto e nenhuma imagem seria publicada em `develop`.
    needs: [guard-release-on-main, gate-ci, gate-contract]
    uses: ./.github/workflows/build-publish.yml
    with:
      # `theo-memory`, nao `themory`: e o nome do repositorio, que e o padrao dos
      # irmaos (theo-lens -> theo-lens, theo-rag -> theo-rag, theo-db -> theo-db).
      #
      # O pacote antigo `ghcr.io/usetheoai/themory` NAO e apagado — as tags
      # historicas seguem puxaveis; ele so deixa de receber builds novos.
      #
      # ATENCAO AO CONSUMIDOR: o reconciliador do host puxa este nome por default
      # (dev/theo-memory/reconcile.sh). Renomear aqui sem atualizar la nao quebra
      # nada visivelmente — o host simplesmente para de receber versao nova,
      # convergindo para sempre na ultima imagem antiga. Falha silenciosa. A troca
      # do reconciliador vem DEPOIS do primeiro build com o nome novo, nunca antes.
      image: theo-memory
      dockerfile: ./Dockerfile
      context: .
      # Namespace do NOVO dono. Um run de `usetheoai` recebe GITHUB_TOKEN de outro escopo e não
      # tem push em `ghcr.io/usetheodev` — deixar no default publicaria (ou tentaria publicar) no
      # namespace errado. A imagem passa a ser `ghcr.io/usetheoai/themory`.
      registry: ghcr.io/usetheoai
      trivy: true
      # Alinhado ao GHCR pelo mesmo motivo. Dormente hoje: sem DOCKERHUB_TOKEN o
      # step de login e pulado e nada e empurrado para o Docker Hub — nenhum dos
      # projetos irmaos publica la.
      # Assinar SEMPRE — inclusive em develop. O reconciliador do host puxa
      # `:develop` a cada 5 min, entao era exatamente o artefato em execucao que
      # nao tinha assinatura: a garantia existia no canal de release, que nao e o
      # que roda. Cosign keyless custa segundos, e `id-token: write` ja esta
      # declarado. Verificar junto, senao assina-se sem saber se a assinatura
      # presta.
      sign: true
      verify: true
      # SBOM + proveniencia SLSA mode=max SO na release. Este e o export pesado —
      # o proprio reusable registra que o cache do GHA devolve 500/BlobNotFound
      # justamente nele — e quem consome atestacao e auditoria, nao o
      # reconciliador.
      attest: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # arm64 SO na release. O build ja leva ~14 min a frio pelo double-build do
      # gate Trivy, e arm64 aqui sai por emulacao (QEMU) — ligar em todo push de
      # develop cobraria esse preco a cada iteracao, sem consumidor ARM hoje: o
      # dev roda em host amd64.
      #
      # Na release o preco se paga: uma imagem so-amd64 nao roda em no Graviton,
      # e o erro no cluster e obscuro. O delta medido entre a familia AMD e o
      # Graviton foi ~$100/mes numa unica maquina de 8 vCPU / 32 GB, entao a
      # portabilidade do artefato de release e o que mantem essa escolha aberta.
      #
      # Quando/se o deploy passar a consumir ARM continuamente, mover para
      # 'linux/amd64,linux/arm64' incondicional — e aceitar o tempo de build.
      platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      # Mesma frota de todo job deste repo. O reusable declara `runner` como STRING e faz o
      # `fromJSON` do lado dele (build-publish.yml: `runs-on: ${{ fromJSON(inputs.runner) }}`),
      # entao aqui vai a string JSON literal — NAO envolver em fromJSON, que produziria um array
      # onde o input espera string e o workflow falharia no parse.
      runner: '["blacksmith-8vcpu-ubuntu-2404"]'
    # Explicit (not `secrets: inherit`) — avoids the semgrep github-actions
    # secrets-inherit finding. DOCKERHUB_* are empty here → Docker Hub push is skipped
    # (GHCR still publishes via the run's GITHUB_TOKEN).
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
