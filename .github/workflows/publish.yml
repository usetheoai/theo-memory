# Image publish.
#   develop push → build ./Dockerfile behind the Trivy CRITICAL/HIGH gate, then push
#                  ghcr.io/usetheoai/theo-memory:develop (+ :develop-<sha>) AND, when the ECR
#                  repository variables are set, <ECR_REGISTRY>/theo-memory:<full commit sha>.
#   v* tag       → GHCR :X.Y.Z + :X.Y + :latest, ECR :<full sha> + :X.Y.Z.
#   Every push is signed keyless with cosign and carries an SBOM + SLSA provenance.
#
# THIS WORKFLOW DOES NOT DEPLOY — DELIBERATELY (2026-07-27).
#
# Until that date it carried a `deploy-dev` job that SSHed into a host of ours. That forced the
# repository to know — and version — the user, the path and the topology of one specific
# environment, and to keep an SSH key with a shell in the CI secrets. For a project that is going
# to be OPEN, that is unacceptable: none of it belongs to the product, it belongs to our operation.
#
# Deployment became PULL: the host runs a reconciler that converges to the published tag. The swap
# removes three things at once — the public repo does not know a host exists, CI no longer holds a
# credential to reach it, and reconciliation becomes continuous instead of a one-off event. The
# environment belongs to whoever operates it; this repo publishes the image.
#
# The contract between the two sides is ONE THING: the image reference. Nothing else.
name: publish
# TRIGGERS: push to `develop` (publishes `:develop` + `:develop-<sha>`, and the ECR commit tag) and
# `v*` tags (signed release image).
#
# WHY THIS WORKFLOW DOES NOT FOLLOW THE RULE OF THE OTHERS: it is CD, not a gate. What it does is a
# consequence of an already-approved merge, not the verification of a candidate. A release
# triggered by a TAG, rather than by a human click, is what keeps publication reproducible and
# auditable.
#
# WHY IT DOES NOT RUN ON PULL REQUESTS: the reusable ALWAYS pushes the image; there is no
# build-only mode. Running on a PR would publish an artifact of unmerged code. The cost of that
# choice is honest — a broken Dockerfile only shows up after the merge — and it is preferable to
# polluting the registry.
#
# `workflow_dispatch` stays as an escape hatch (exercise a change to this file, republish).
on:
  push:
    branches: [develop]
    tags: ["v*"]
    # #116: a push to develop that only touches docs skips the whole build pipeline.
    #
    # DELIBERATELY an EXCLUSION list, not a positive filter: this workflow listens to
    # `tags: ["v*"]`, and a path filter ALSO applies to tag pushes. A positive filter would make a
    # release whose commit did not match the list be ignored in silence — no image published, no
    # error. Exclusion errs on the side of publishing too much, which is the right side here.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      # Aligned with ci/integration/eval (F-tests-3). Without this line, a push touching only
      # `docs/**` was not ignored here and triggered an image build, although the three gates
      # ignore it — paid work that does not change the artifact.
      - 'docs/**'
      # Added 2026-07-27: nothing here goes into the image. Measured on commit `6b333d9`, which
      # touched only workflows + CHANGELOG and still triggered build + push of an identical
      # image, plus CI, SAST, eval and integration — six runs in a serial queue shared by five
      # repositories.
      - 'agents/**'
      # `.github/**` is NOT listed here (ADR-5). Changing a workflow DOES change the image: the
      # publish workflow defines how the image is built (Dockerfile, registries, signing). And,
      # since this workflow invokes the gates, ignoring `.github/**` would stop a workflow change
      # from running the tests that validate it.
  workflow_dispatch:
# Successive develop pushes SUPERSEDE (cancel) the older run instead of piling up: only the newest
# image matters, and a cancelled build is runner time saved. Before deployment left this workflow
# there was an extra risk — cancelling without a successor left the host without a deploy
# (incident 2026-07-22) — which no longer applies: the reconciler on the host converges the
# environment, not this workflow. Tag runs have their own group and are never cancelled by develop.
concurrency:
  # #129 note: publish listens on push + tag ONLY (no pull_request), so it does NOT double-run —
  # the push/PR key mismatch that #129 fixes for integration/sast does not apply here. Left on
  # github.ref deliberately: a tag build (v*) and a develop push MUST stay in separate groups, and
  # cancel-in-progress is already tag-aware below.
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign via GitHub OIDC, and the ECR publish role
jobs:
  # THE RELEASE TAG MUST BE ON `main` — otherwise `:latest` ships from unpromoted code.
  #
  # `:latest` is the reference PRODUCTION reconciliation consumes. It was already conditioned on
  # `refs/tags/v*`, but a tag is not a promotion: nothing stopped tagging a commit from `develop`,
  # a work branch or a fork merge and publishing `:latest` from it. The release cycle contract
  # (`develop → main` by PR, tag on the merge) was DISCIPLINE, not enforcement.
  #
  # Uses the API instead of `git merge-base`: no checkout needed (the full history of this repo is
  # expensive to fetch just to answer yes/no) and it runs in seconds.
  #
  # `compare/main...<sha>` returns the commit's position RELATIVE to main:
  #   identical -> the tag is exactly the head of main           (ok)
  #   behind    -> the tag is an ancestor of main; main moved on  (ok — it was promoted)
  #   ahead     -> the tag has commits main does not have         (NOT promoted)
  #   diverged  -> separate histories                             (NOT promoted)
  guard-release-on-main:
    runs-on: ${{ fromJSON('["blacksmith-8vcpu-ubuntu-2404"]') }}
    steps:
      - name: Is the tag on main?
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .status)"
          echo "position of ${SHA} relative to main: ${STATUS}"
          case "${STATUS}" in
            identical|behind)
              echo "OK — the tag is on main; :latest may be published." ;;
            *)
              echo "::error::Tag ${GITHUB_REF_NAME} is NOT on main (${STATUS})." >&2
              echo "::error::':latest' feeds PRODUCTION reconciliation and may only ship from promoted code." >&2
              echo "::error::Promote develop -> main by PR and tag the merge commit." >&2
              exit 1 ;;
          esac

  # The gates run HERE, invoked through `workflow_call` — one definition, two callers (a PR calls
  # them directly; a push reaches them through this workflow). `workflow_call` is synchronous in
  # the same run and preserves `github.sha`, unlike `workflow_run`.
  gate-ci:
    uses: ./.github/workflows/ci.yml

  gate-contract:
    uses: ./.github/workflows/integration.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # The org's shared reusable, pinned by commit SHA. It replaced a vendored local copy that existed
  # only because `usetheodev/theo` was private under another owner and GitHub does not share a
  # private reusable across owners; the engine now lives in `usetheoai`, so the copy was deleted.
  #
  # ONLY INPUTS THE REUSABLE DECLARES may be passed. GitHub refuses the WHOLE workflow at startup,
  # with no log at all, when a caller passes one it does not declare (usetheoai/theo-cloud B-270:
  # five runs dead in under a second, including two release tags). The reusable's inputs are:
  # aws_role_arn, build_args, context, dockerfile, dockerhub_image, ecr_registry, image, registry,
  # runner, sign, trivy, verify. `tests/integration/publish-workflow.test.ts` enforces this list.
  #
  # What the vendored copy had and the shared reusable does not, accepted knowingly:
  #   - `platforms`: release tags were also built for linux/arm64. The shared reusable builds for
  #     the runner's architecture only (amd64). Nothing that consumes this image runs on ARM today.
  #   - `attest`: SBOM + SLSA provenance were release-only. The shared reusable ties them to
  #     `sign`, so every develop push now also exports them.
  #   - `outputs.digest` / `outputs.image_ref`: no job here consumed them; the platform pins ECR
  #     by the full commit SHA tag instead.
  image:
    # The guard runs on every trigger and exits immediately when it is not a tag — the job exists
    # so that `needs` is unconditional here. With a conditional `needs`, a skipped job would drag
    # `image` along and no image would be published on `develop`.
    needs: [guard-release-on-main, gate-ci, gate-contract]
    # The reusable declares these scopes, and GitHub refuses at startup — with no log — a reusable
    # that asks for more than its caller grants (usetheoai/theo#436). `attestations` is for its
    # GitHub-native provenance; `id-token` signs with cosign and assumes the ECR publish role.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: usetheoai/theo/.github/workflows/build-publish.yml@1596e81f2ab64a4eb08a7d180e33639138f96b7f # develop
    with:
      # `theo-memory`, not `themory`: the repository name, which is the sibling convention
      # (theo-lens -> theo-lens, theo-rag -> theo-rag). It is also the name of the ECR repository.
      #
      # The old package `ghcr.io/usetheodev/themory` is NOT deleted — historical tags remain
      # pullable; it simply stops receiving new builds.
      #
      # CONSUMER WARNING: the host reconciler pulls this name by default. Renaming it here without
      # updating the reconciler breaks nothing visibly — the host simply stops receiving new
      # versions and converges forever on the last old image. A silent failure.
      image: theo-memory
      dockerfile: ./Dockerfile
      context: .
      # The namespace of the NEW owner, explicit rather than derived: the image is
      # `ghcr.io/usetheoai/theo-memory` (`themory` was the OLD name and no longer resolves).
      registry: ghcr.io/usetheoai
      trivy: true
      # SBOM + SLSA provenance (mode=max) + keyless cosign signature on every push: the signed
      # channel has to be the DEPLOYED channel, and the host reconciler pulls `:develop`.
      sign: true
      # OFF, and it has to be: the reusable pins the verified identity to the CALLER
      # (`github.com/${github.repository}/.github/workflows/build-publish.yml@`), while a
      # certificate signed inside a reusable workflow carries the REUSABLE's path. Measured
      # 2026-09-29 on the Rekor entry of theo-cloud's image signed by this same reusable at this
      # same SHA: SAN = `https://github.com/usetheoai/theo/.github/workflows/build-publish.yml@1596e81…`.
      # With `verify: true` every run would fail AFTER the push, reporting red for an image that
      # was published. The signature itself is still produced. Verify it by pinning BOTH the
      # reusable (the SAN) and this repository (the caller claim), or any org repo calling the same
      # reusable would satisfy the check:
      #   --certificate-identity-regexp '^https://github\.com/usetheoai/theo/\.github/workflows/build-publish\.yml@'
      #   --certificate-github-workflow-repository usetheoai/theo-memory
      verify: false
      # Amazon ECR, the registry the platform pulls from, by the full commit SHA tag
      # (usetheoai/theo#446). Both are repository VARIABLES; unset, the reusable skips ECR and
      # GHCR publishes as before. The account id is never fixed in text.
      ecr_registry: ${{ vars.ECR_REGISTRY }}
      aws_role_arn: ${{ vars.AWS_IMAGE_PUBLISH_ROLE_ARN }}
      # The same runner fleet as every job in this repo. The reusable declares `runner` as a
      # STRING and does the `fromJSON` on its side, so a literal JSON string goes here — do NOT
      # wrap it in fromJSON, which would produce an array where the input expects a string.
      runner: '["blacksmith-8vcpu-ubuntu-2404"]'
    # NO `secrets:` block — on purpose. The reusable's optional secrets are for a Go module this
    # repo does not have and for Docker Hub, which this workflow does not publish to (no
    # `dockerhub_image`). Passing a credential to a destination that cannot use it is surface with
    # no return, and `secrets: inherit` is refused for the same reason (semgrep flags it).
    # `GITHUB_TOKEN` is implicit — it is what publishes to GHCR — and ECR is reached by OIDC.
