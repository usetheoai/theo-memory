# Image publish + dev deploy — M5 CD pipeline (playbook, adapted from theo-rag).
#   develop push → build ./Dockerfile → ghcr.io/usetheodev/themory:develop (+ :develop-<sha>)
#                  behind the Trivy CRITICAL/HIGH gate → deploy to the dev host
#                  (deploy-dev job, develop-only).
#   v* tag       → :X.Y.Z + :X.Y + :latest, SBOM + SLSA + keyless cosign — NOT deployed
#                  (the future prod host is provisioned separately).
#
# The deploy is a `needs: image` job (NOT a workflow_run trigger) because the repo's
# default branch is `main` and workflow_run only fires from the default branch.
name: publish
# GATILHOS (política 2026-07-27, decisão do owner): só em PR para `main`. Este workflow é CD, não
# gate, então a mudança tem TRÊS consequências que não se leem no YAML — registradas aqui para não
# virarem mistério:
#
#   1. `deploy-dev` NUNCA MAIS RODA. Ele é `if: github.ref == 'refs/heads/develop'`, e num PR o
#      `github.ref` é `refs/pull/N/merge`. O dev host deixa de receber deploy automático.
#   2. TAG `v*` NÃO CONSTRÓI MAIS IMAGEM. O gatilho de tag saiu, então a imagem de release
#      assinada (SBOM + SLSA + cosign) só sai por `workflow_dispatch` — que fica mantido abaixo
#      exatamente como esse escape hatch.
#   3. Num PR, o `docker/metadata-action` do reusable avalia
#      `type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}` como FALSO, então
#      pode não computar tag nenhuma. Se o job passar a falhar por "no tags", a causa é esta.
#
# (Hoje o job `image` já falha antes disso, pela mudança de dono — ver o bloco QUEBRA CONHECIDA.)
on:
  pull_request:
    branches: [main]
    # #116: um PR que só mexe em docs pula a esteira inteira de build.
    #
    # DELIBERADAMENTE lista de EXCLUSÃO, não filtro positivo. O racional original era o gatilho de
    # tag (filtro de path se aplica também a push de tag, e um filtro positivo faria um release
    # cujo commit não casasse a lista ser ignorado em silêncio — sem imagem, sem erro). O gatilho
    # de tag saiu em 2026-07-27, mas a exclusão FICA: ela erra para o lado de construir a mais,
    # que continua sendo o lado certo num workflow que publica artefato.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      # Adicionados em 2026-07-27: nada aqui entra na imagem. Medido no commit `6b333d9`,
      # que tocou só workflows + CHANGELOG e mesmo assim disparou build + push + deploy de
      # uma imagem idêntica, além de CI, SAST, eval e integration — seis runs numa fila
      # serial compartilhada por cinco repositórios.
      - 'docs/**'
      - 'knowledge-base/**'
      - 'agents/**'
      # Mudar um workflow não muda a imagem. Para exercitar uma alteração NESTE arquivo — ou para
      # construir a imagem de release, agora que o gatilho de tag saiu — use o `workflow_dispatch`
      # declarado abaixo. Ele é o único caminho restante para publicar.
      - '.github/**'
  workflow_dispatch:
# Single self-hosted runner: successive develop pushes must SUPERSEDE (cancel) the
# queued/older run instead of piling up — the newest run always redeploys, so a
# cancelled predecessor is never left without a successor deploy (2026-07-22 incident:
# a manual cancel mid-deploy with no successor left the dev host down). Tag runs get
# their own group per ref and are never cancelled by develop pushes.
concurrency:
  # #129 note: publish listens on push + tag ONLY (no pull_request), so it does NOT
  # double-run — the push/PR key-mismatch that #129 fixes for integration/sast does not
  # apply here. Left on github.ref deliberately: a tag build (v*) and a develop push MUST
  # stay in separate groups, and cancel-in-progress is already tag-aware below. Changing
  # the key would risk the signed release build for zero dedup benefit.
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign via GitHub OIDC (release only)
jobs:
  # QUEBRA CONHECIDA E ACEITA (2026-07-27, decisão do owner). Este repo foi transferido de
  # `usetheodev` (conta pessoal) para a organização `usetheoai` porque a Blacksmith não serve
  # repositórios pessoais — ver integration.yml. O `theo`, dono do reusable abaixo, NÃO foi
  # transferido junto, e isso quebra DUAS coisas neste job:
  #
  #   1. `usetheodev/theo` é PRIVADO. GitHub só compartilha workflow reusável de repo privado
  #      dentro do MESMO dono. Com o chamador em `usetheoai` e o chamado em `usetheodev`, esta
  #      referência não resolve.
  #   2. O reusable publica em `ghcr.io/usetheodev` (seu `registry` default, não sobrescrito
  #      aqui). Um run em `usetheoai` recebe GITHUB_TOKEN de outro escopo e não tem push nesse
  #      namespace.
  #
  # Consequência: `image` falha e `deploy-dev` (needs: image) não roda — o dev host para de
  # receber deploy. Aceito deliberadamente para destravar o CI na Blacksmith primeiro.
  # PARA CONSERTAR: transferir `usetheodev/theo` para `usetheoai` também (resolve os dois de
  # uma vez), ou tornar `theo` público e passar `registry: ghcr.io/usetheoai`.
  image:
    uses: usetheodev/theo/.github/workflows/build-publish.yml@develop
    with:
      image: themory
      dockerfile: ./Dockerfile
      context: .
      trivy: true
      dockerhub_image: usetheo/themory   # pushed only when the DOCKERHUB_TOKEN secret is set
      sign: ${{ startsWith(github.ref, 'refs/tags/v') }}
      verify: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Mesma frota de todo job deste repo. O reusable declara `runner` como STRING e faz o
      # `fromJSON` do lado dele (build-publish.yml: `runs-on: ${{ fromJSON(inputs.runner) }}`),
      # entao aqui vai a string JSON literal — NAO envolver em fromJSON, que produziria um array
      # onde o input espera string e o workflow falharia no parse.
      runner: '["blacksmith-8vcpu-ubuntu-2404"]'
    # Explicit (not `secrets: inherit`) — avoids the semgrep github-actions
    # secrets-inherit finding. DOCKERHUB_* are empty here → Docker Hub push is skipped
    # (GHCR still publishes via the run's GITHUB_TOKEN).
    secrets:
      GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Deploy the freshly-published :develop image to the dev host. develop-only: a v* tag
  # publishes the release image but never deploys.
  deploy-dev:
    needs: image
    if: ${{ github.ref == 'refs/heads/develop' }}
    # Blacksmith (#156). Hoje este job nem chega a rodar: `needs: image`, e `image` está quebrado
    # pela transferência de dono (ver o bloco QUEBRA CONHECIDA acima).
    #
    # RISCO A VALIDAR QUANDO `image` VOLTAR: este job faz SSH para `vars.DEV_HOST`. O runner
    # self-hosted saía sempre do mesmo IP; o efêmero NÃO — o IP de egresso varia a cada run. Se o
    # firewall do droplet filtrar SSH por origem, este job falha no `ssh` enquanto `image` fica
    # verde: a imagem publica e o deploy não acontece. Saídas: (a) liberar SSH na origem,
    # (b) Static IP da Blacksmith + allowlist, ou (c) deixar SÓ este job no self-hosted.
    #
    # ATENÇÃO ADICIONAL: o mirror de deploy no droplet (`<HOME>/theo-data-plane/theo-memory`)
    # tem remote apontando para o dono ANTIGO. O GitHub redireciona URLs antigas, então o
    # `git fetch` abaixo continua funcionando — mas o remote deve ser atualizado para
    # `usetheoai/theo-memory` para não depender do redirect indefinidamente.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Medido: max 0,7 min. So SSH + docker pull remoto; um ssh pendurado sem timeout seguraria o runner por 6h.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/themory_deploy
          chmod 600 ~/.ssh/themory_deploy
          ssh-keyscan -H "${{ vars.DEV_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Provision runtime env on the dev host
        # Written over stdin (never argv) so the secret is not exposed in the process
        # list; GitHub masks it in logs. Compose reads this .env. .env is gitignored, so
        # the git sync below never clobbers it.
        run: |
          SHA='${{ github.sha }}'
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # shellcheck disable=SC2087
          # O heredoc é NÃO-citado de propósito: `${SHA}` e `${BUILT}` têm de expandir aqui, no
          # runner. Citar `'EOF'` — que é o que o SC2087 sugere — enviaria `${SHA}` literal para o
          # host, onde a variável não existe: o `.env` sairia com valores vazios e o deploy subiria
          # sem versão, com a CI verde. Aqui a sugestão do linter é o bug, não a correção.
          ssh -i ~/.ssh/themory_deploy paulo@"${{ vars.DEV_HOST }}" \
            'cat > <HOME>/theo-data-plane/theo-memory/.env' <<EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          THEOMEM_GIT_SHA=${SHA}
          THEOMEM_VERSION=develop-${SHA:0:7}
          THEOMEM_BUILD_TIME=${BUILT}
          THEMORY_ADMIN_BOOTSTRAP_TOKEN=${{ secrets.THEMORY_ADMIN_BOOTSTRAP_TOKEN }}
          THEMORY_MCP_TLS_DIR=${{ vars.THEMORY_MCP_TLS_DIR }}
          EOF

      - name: Sync the deploy mirror, log into GHCR, and deploy
        # Sync the box checkout to the published commit FIRST (it carries the deploy
        # script + compose override), then pull the image and restart themory. Sync to
        # the EXACT commit (not the branch tip) so the checkout, the compose files, and
        # the version gate all agree even if develop advanced.
        run: |
          ssh -i ~/.ssh/themory_deploy paulo@"${{ vars.DEV_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          DIR=<HOME>/theo-data-plane/theo-memory
          cd "$DIR"
          git fetch --quiet origin develop
          git reset --hard --quiet '${{ github.sha }}'
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          EXPECTED_SHA='${{ github.sha }}' bash scripts/deploy-dev.sh
          REMOTE

      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f ~/.ssh/themory_deploy
