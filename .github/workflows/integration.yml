# Integration (Postgres + pgvector) — M5 Phase 2 CI hardening. The integration
# suite (tests/integration/**, ~95 tests against a real pgvector) previously ran
# ONLY locally — `describe.skipIf(!THEOMEM_PG_URI)` silently skips without a DB, so
# a regression could land green. This job provisions a pgvector service, applies
# the schema, builds the dist subpaths (theo-memory's package `exports` point at
# `./dist/**`, so the integration tests need the compiled output), and runs
# `test:integration` as a REQUIRED gate.
name: Integration (Postgres)

on:
  pull_request:
  push:
    branches: [develop, main]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read

# One run per ref — a new push cancels the in-flight run (single-trunk develop).
concurrency:
  # #129: key on the BRANCH, not github.ref. A push to develop and its PR carry different
  # github.ref values (refs/heads/develop vs refs/pull/N/merge), so the old key put them in
  # different groups and both ran — the same work twice. head.ref (PR) and ref_name (push)
  # both resolve to `develop`, so the PR run now cancels the push run: one run, and it's the
  # PR's (which tests the merge commit).
  group: integration-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration (pgvector + test:integration)
    # RUNNER — Blacksmith, 8 vCPU / 32 GB (#156). Migração levou 4 tentativas em 2026-07-27; as
    # 3 primeiras morreram IGUAL (`queued`, `runner_name` vazio, zero pickup, nenhum step
    # executado: 40+ / 9+ / 12+ min). O registro fica porque a causa não é adivinhável pelo YAML.
    #
    # SÃO DUAS PRÉ-CONDIÇÕES, e cada uma só ficou visível depois de resolver a anterior:
    #
    # (1) O REPO PRECISA PERTENCER A UMA ORGANIZAÇÃO. Estava em `usetheodev`, conta PESSOAL
    #     (`type=User`). A doc é explícita: "Blacksmith is limited to GitHub organizations and
    #     not available for personal repositories". Resolvido transferindo para a org `usetheoai`
    #     (secrets e variables sobreviveram). NECESSÁRIO, mas NÃO suficiente — a 3ª tentativa,
    #     já sob a org, falhou igual.
    #
    # (2) O GITHUB APP PRECISA ESTAR INSTALADO NA ORG QUE DONA O REPO. Instalação de App pertence
    #     à CONTA, não ao repositório: ao transferir, o repo saiu de baixo da instalação que
    #     existia em `usetheodev` e entrou numa org sem instalação alguma. Resolvido instalando
    #     em github.com/apps/blacksmith-sh para `usetheoai` (repo_selection=all).
    #
    # O QUE DESPISTOU O DIAGNÓSTICO POR TRÊS RODADAS: o Migration Wizard lê os repositórios pela
    # SESSÃO OAUTH do usuário, não pela instalação do App. Por isso ele sempre listou estes
    # workflows e respondeu "No changes to migrate" — mesmo com o repo numa conta pessoal e nenhum
    # runner sendo servido. Ele atesta o `runs-on`, NÃO a integração.
    #
    # ORDEM DE VERIFICAÇÃO SE VOLTAR A FICAR `queued` COM `runner_name` VAZIO (barata → cara):
    #   a) `gh api repos/<owner>/theo-memory --jq .owner.type` → tem de ser "Organization"
    #   b) `gh api orgs/<org>/installations` → tem de listar `blacksmith-sh` (exige admin:org)
    #   c) Billing/plano ativo PARA ESSA ORG em app.blacksmith.sh (o cartão fica na conta e não
    #      migra junto com o repo)
    #   d) IP allow list da org (Settings > Security). Se habilitada, liberar 34.107.78.182,
    #      63.181.86.27, 63.178.35.73 — causa documentada de "jobs not getting picked up".
    # A label literal depende de `.github/actionlint.yaml`: sem ele o gate actionlint a rejeita
    # em TODOS os workflows.
    #
    # PERGUNTA DO #156, ENFIM RESPONDIDA — SIM, runner efêmero provisiona `services:`. Medido no
    # run 30306550648: `Initialize containers` OK, o pgvector subiu, `job.services.postgres.ports`
    # resolveu a porta dinâmica, o schema aplicou e a suíte de contrato (1353 testes) passou.
    # A doc da Blacksmith não cobre service containers em lugar nenhum — isto aqui é a evidência.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Medido: max 28,8 min (baixa o modelo Xenova ~22 MB com 6 tentativas, aplica schema, roda contract 1353 testes + integration). 60 = ~2x o observado.
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Dedicated app DB `themem` — MUST NOT be the `postgres` maintenance DB.
          # The integration harness derives its admin connection as `.../postgres`
          # (global-setup.ts / isolated-db.ts / reset-shared-db.ts `siblingUri(uri,
          # 'postgres')`) and issues `DROP DATABASE <app-db> WITH (FORCE)` from it.
          # If the app DB were `postgres`, that admin connection would be dropping
          # the very database it is connected to → `55006 cannot drop the currently
          # open database`. A separate `themem` app DB (the local convention) avoids
          # it; the default `postgres` maintenance DB always exists alongside it.
          POSTGRES_DB: themem
        # Ephemeral host port (NOT 5432:5432): the self-hosted runner host is SHARED
        # across repos, so a fixed host port would collide with a concurrent job's
        # postgres (and with the platform's own :5432). The mapped port is resolved below.
        # (#156 marcou isto como candidato a limpeza se a frota efêmera fosse promovida —
        # ela NÃO foi, então a restrição do host compartilhado continua valendo.)
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve Postgres URI (dynamic host port — shared self-hosted host)
        # App DB is `themem` (NOT the `postgres` maintenance DB) — see the service
        # POSTGRES_DB note above (avoids the reset-shared-db drop-the-open-db 55006).
        run: echo "THEOMEM_PG_URI=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/themem" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.34.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (dist subpaths the integration tests import)
        run: pnpm run build

      - name: Apply schema (migrations — the runtime path, no drizzle-kit TTY / no psql)
        # `pnpm run db:push` uses drizzle-kit push (requires a TTY — it prompts
        # unconditionally in this version, not only on destructive changes) AND
        # `apply-trigger-migrations.mjs` (requires the `psql` client, absent on the
        # runner). Instead provision the schema the way the deployed server does:
        # `themory migrate` → runMigrations(pool) applies the .sql migrations
        # (triggers included) programmatically — no drizzle-kit, no psql, no TTY.
        # Embedder defaults to openai (dim 1536), matching the integration suite.
        env:
          # THEOMEM_EMBEDDER=openai → schema provisioned at vector(1536) to match the
          # integration suite (openai embedder / MAX_EMBEDDING_DIM). Unset defaults to
          # `local` (384) → dimension mismatch against every 1536 insert. `migrate`
          # only reads the dim CONSTANT (embeddingDimForKind) — it makes NO API call,
          # so no OPENAI_API_KEY is needed here.
          THEOMEM_EMBEDDER: openai
        run: |
          node -e "const{Pool}=require('pg');const p=new Pool({connectionString:process.env.THEOMEM_PG_URI});p.query('CREATE EXTENSION IF NOT EXISTS vector').then(()=>p.end()).catch(e=>{console.error(e);process.exit(1)})"
          node dist/agent-tools/cli.js migrate

      - name: Pre-cache the local embedder model (Xenova/all-MiniLM-L6-v2) with retry
        # Tests that exercise the shipped LOCAL embedder (LocalTransformerEmbedder)
        # download a ~22 MB ONNX model from huggingface.co on first use. The HF CDN
        # is intermittently "Service unavailable" from the runner (same CDN-flakiness
        # class as the sharp/libvips build). A single unlucky first-caller then fails
        # (principles-alignment-hardening). Pre-warm the model ONCE with retry so it is
        # on disk (shared @xenova/transformers cache) before any test — deterministic,
        # not a per-test race. node-linker=hoisted makes the bare import resolve at root.
        run: |
          for i in $(seq 1 6); do
            node -e "import('@xenova/transformers').then(async (m)=>{const p=await m.pipeline('feature-extraction','Xenova/all-MiniLM-L6-v2');await p('warmup',{pooling:'mean',normalize:true});console.log('xenova model cached');}).then(()=>process.exit(0)).catch((e)=>{console.error('attempt failed:',e.message);process.exit(1);})" && exit 0
            echo "HF fetch attempt $i failed — retry in 20s"; sleep 20
          done
          echo "::error::could not pre-cache the Xenova model after 6 attempts (HF CDN unreachable)"; exit 1

      - name: Run contract suite + typecheck (#104)
        # #104 — the contract suite (1353 tests) was NOT run by CI; only test:integration was,
        # so a contract regression stayed invisible until someone ran `npm test` locally. Run it
        # HERE, in the integration job, reusing its Postgres + build + embedder cache: a handful
        # of "contract" tests boot the MCP server, which opens a real Pool — without a DB those
        # leak ECONNREFUSED as unhandled rejections (the suite is not as pure as its name). Sharing
        # the existing Postgres service is the parsimonious fix — no second DB, no second job, and
        # it runs first so a contract regression fails the job fast.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEOMEM_EMBEDDER: openai
        run: pnpm test

      - name: Run integration suite (real Postgres + real OpenAI)
        # THEOMEM_PG_URI set above; OPENAI_API_KEY from the repo secret (real
        # provider — no stubs in the production path). THEOMEM_EMBEDDER=openai keeps
        # the runtime embedder (1536) consistent with the schema provisioned above.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEOMEM_EMBEDDER: openai
        run: pnpm run test:integration
