# Garantia CONTÍNUA de que o dev host roda a versão esperada.
#
# O DEFEITO QUE ISTO PREVINE: o `deploy-dev` já verifica a versão — mas só no INSTANTE do deploy
# (compara o label OCI do container com o SHA deployado e gateia em `/v1/health{,/db}`). Depois
# disso, ninguém olha. Se um container morrer e subir de imagem antiga, se alguém der um `docker
# compose up` manual no box compartilhado, ou se um deploy falhar sem sucessor, o ambiente fica
# defasado em SILÊNCIO até alguém tropeçar. Isso é a limitação estrutural de um deploy PUSH-BASED:
# não há estado desejado sendo reconciliado, só um evento pontual no passado.
#
# Este workflow fecha essa janela pelo lado barato: pergunta ao serviço qual commit ele acha que
# está rodando e compara com o último `publish` bem-sucedido (NÃO com o tip de `develop` — ver o
# step, o `publish` tem `paths-ignore` e a branch avança sem deploy legitimamente).
#
# O QUE ELE GARANTE — e o que NÃO garante. Ele DETECTA drift; não CORRIGE. Um reconciliador
# GitOps (ArgoCD e afins) faria as duas coisas, mas é controlador Kubernetes e este ambiente é
# Docker Compose. Detecção contínua é o que dá para ter sem trocar a arquitetura, e cobre o caso
# real: o ambiente parar de bater com o repositório sem ninguém perceber.
name: dev version drift

on:
  # De hora em hora. Drift num ambiente de dev é raro; detectar dentro de 1 h é suficiente e
  # mantém o custo baixo na frota cobrada por minuto (~30 s por run). Ajuste se precisar mais fino.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Necessário para consultar o último run bem-sucedido do `publish` — é ELE que define o
  # commit esperado no host, não o tip de `develop` (ver o step abaixo).
  actions: read

concurrency:
  group: dev-version-drift
  cancel-in-progress: true

jobs:
  drift:
    name: dev host roda o último deploy?
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      # `ref: develop` é OBRIGATÓRIO: o default branch deste repo é `main`, e num gatilho
      # `schedule` o checkout viria de `main` — comparar o dev host contra `main` reportaria drift
      # permanente e falso, já que o deploy acompanha `develop`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # `ref: develop` porque o default branch é `main` e num gatilho `schedule` o checkout
          # viria de `main`.
          ref: develop
          # `fetch-depth: 0` é OBRIGATÓRIO, não zelo: o diagnóstico usa `git merge-base
          # --is-ancestor` e `git log A..B`. Com o clone shallow padrão (depth 1) só existe o
          # commit do tip, e os dois comandos falhariam — o gate detectaria o drift e não
          # conseguiria dizer NADA sobre ele, que é metade do valor.
          fetch-depth: 0

      - name: Compara o SHA do dev host com o último deploy bem-sucedido
        env:
          DEV_HOST: ${{ vars.DEV_HOST }}
          THEMORY_PORT: '8080'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${DEV_HOST}" ]; then
            echo "::error::vars.DEV_HOST não está definida — sem host para checar."
            exit 1
          fi

          # O ESPERADO É O ÚLTIMO `publish` BEM-SUCEDIDO, NÃO O TIP DE `develop`.
          #
          # A primeira versão deste gate comparava com o tip e estava ERRADA: o `publish` tem
          # `paths-ignore` (`.github/**`, `**/*.md`, `docs/**`, ...), então `develop` avança
          # legitimamente sem construir imagem nova. Todo commit de docs ou de CI produziria um
          # DRIFT falso — pego em `f2e8e0d`, um commit só de workflow + CHANGELOG, com o host
          # corretamente parado em `37ade5e`.
          #
          # Um run do `publish` só conclui `success` quando TODOS os seus jobs passam, incluindo o
          # `deploy-dev`. Então o head_sha do último run verde é, por construção, o commit que
          # está publicado E deployado — exatamente o que o host deve estar rodando.
          EXPECTED="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow publish \
            --branch develop --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"

          if [ -z "${EXPECTED}" ]; then
            echo "Nenhum run bem-sucedido do \`publish\` em \`develop\` — nada contra o que comparar."
            echo "Isso é esperado num repo recém-configurado; o gate passa em vez de gritar sem base."
            exit 0
          fi

          URL="http://${DEV_HOST}:${THEMORY_PORT}/v1/version"
          echo "esperado (último publish verde em develop): ${EXPECTED}"

          # RETRY COM PROPÓSITO, não superstição: existe uma janela legítima entre o merge em
          # `develop` e o fim do deploy (medido ~2 min: build + push + pull + recreate). Sem esta
          # tolerância, todo run que caísse nessa janela reportaria drift falso — e um gate que
          # grita sem motivo é um gate que o time aprende a ignorar. 5 tentativas x 45 s ~= 3,5 min
          # cobre o deploy inteiro com folga.
          for attempt in $(seq 1 5); do
            if ! BODY="$(curl -fsS --max-time 15 "${URL}" 2>/dev/null)"; then
              echo "tentativa ${attempt}: /v1/version inalcançável em ${URL}"
              [ "${attempt}" -lt 5 ] && sleep 45 && continue
              echo "::error::dev host inalcançável em ${URL} após 5 tentativas — o serviço pode estar fora do ar."
              exit 1
            fi

            RUNNING="$(printf '%s' "${BODY}" | jq -r '.git_sha // "unknown"')"
            echo "tentativa ${attempt}: dev host reporta ${RUNNING}"

            if [ "${RUNNING}" = "${EXPECTED}" ]; then
              echo "OK — dev host está em ${RUNNING}, igual ao último deploy publicado."
              exit 0
            fi

            [ "${attempt}" -lt 5 ] && sleep 45
          done

          # Chegou aqui: divergência ESTÁVEL, não janela de deploy.
          echo "::error::DRIFT — dev host roda '${RUNNING}', o último deploy publicou '${EXPECTED}'."
          {
            echo "## Drift no ambiente de dev"
            echo ""
            echo "| | commit |"
            echo "|---|---|"
            echo "| dev host (\`/v1/version\`) | \`${RUNNING}\` |"
            echo "| último \`publish\` verde | \`${EXPECTED}\` |"
            echo ""
            # `git cat-file -e` distingue os dois diagnósticos: um commit que EXISTE e é ancestral
            # significa host atrasado (deploy falhou/não rodou); um SHA desconhecido significa que
            # o host roda algo que não veio desta branch — deploy manual ou imagem estranha.
            if git cat-file -e "${RUNNING}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "${RUNNING}" "${EXPECTED}" 2>/dev/null; then
                echo "O host está ATRASADO — roda um ancestral do último deploy. Provável deploy"
                echo "que falhou ou nunca chegou ao host. Commits publicados mas não rodando:"
                echo ""
                echo '```'
                git log --oneline "${RUNNING}..${EXPECTED}" | head -20
                echo '```'
              else
                echo "O host roda um commit que NÃO é ancestral do último deploy —"
                echo "deploy a partir de outra branch, ou rollback manual."
              fi
            else
              echo "O commit do host é DESCONHECIDO neste repositório. Imagem de outra origem,"
              echo "ou o container subiu sem a env de versão (\`git_sha\` cai para \`unknown\`)."
            fi
            echo ""
            echo "Para reconciliar: rode o workflow \`publish\` (\`workflow_dispatch\`) ou empurre"
            echo "um commit em \`develop\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
