# Secret-scan config (motivated by #126 — 2 real theo_live_ keys reached develop history).
# Prevents RECURRENCE: a hardcoded real API key added to the working tree fails CI. Scans the
# tree (not git history), so it does not re-flag the already-exposed keys #126 tracks for the
# owner to ROTATE (history rewrite is forbidden — Rule 4; rotation neutralizes the exposed keys).
title = "theo-memory secret scan"

# Targeted gate: ONLY the project's own `theo_live_` API-key format. The generic default
# ruleset false-positives heavily on this repo's reference clones + fixtures; #126 is specifically
# about theo_live_ keys, so this rule alone is the precise, low-noise preventive gate.

[[rules]]
id = "theo-live-api-key"
description = "Hardcoded theo_live_ API key (base64url, >=40 chars — o formato canonico do produto)"
# CORRIGIDO: a regra anterior era `theo_live_[a-f0-9]{20,}` — SO HEXADECIMAL — e a descricao dela
# afirmava que "a real key is a long hex string". Nao e. O formato canonico do produto esta em
# `packages/api/src/server/auth/dual-validation.ts:22`:
#
#     /^theo_live_[A-Za-z0-9_-]{40,}$/   — prefixo + >=40 chars base64url (canonico: 43)
#
# Base64url usa maiusculas, `-` e `_`. Uma chave real cair inteira em [a-f0-9] por 40 chars tem
# probabilidade ~(16/64)^40: nunca acontece. Ou seja, o gate criado para PREVENIR a recorrencia do
# #126 nao conseguia detectar uma chave real — guarda que existe e nao guarda, que e pior que
# guarda nenhuma, porque a presenca dela faz o problema parecer resolvido.
#
# PROVADO: plantei uma chave de formato real na arvore e o gitleaks reportou "no leaks found".
#
# A racionalizacao sobre template literals CONTINUA valendo, e por construcao: `theo_live_${...}`
# tem `$` logo apos o prefixo, e `$` nao pertence a [A-Za-z0-9_-]. Fixtures sinteticas seguem sem
# casar, sem depender do allowlist abaixo.
regex = '''theo_live_[A-Za-z0-9_-]{40,}'''
keywords = ["theo_live_"]

[rules.allowlist]
description = "Test fixtures generate SYNTHETIC keys via template literals — not hardcoded secrets."
paths = [
  '''.*\.(test|spec)\.ts$''',
  '''.*/__tests__/.*''',
]
