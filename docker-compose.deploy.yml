# Deploy override for the dev host (165.227.121.20) — M5 CD pipeline (playbook Phase 4).
# Runs the themory API from the GHCR-published image (built once on the CI runner)
# on top of the base docker-compose.yaml pgvector (container `themem_pgvector`, already
# running from the platform local-env). Layered by scripts/deploy-dev.sh:
#   docker compose -f docker-compose.yaml -f docker-compose.deploy.yml pull themory
#   docker compose -f docker-compose.yaml -f docker-compose.deploy.yml up -d pgvector themory
# pgvector is inherited unchanged from the base file (left running, not rebuilt) so the
# CD deploy never disrupts the neighbouring platform stacks on this shared box.
services:
  themory:
    image: ghcr.io/usetheoai/themory:develop
    container_name: themory_app
    pull_policy: always
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      # DB connection — the base `pgvector` service, same compose network (service name).
      THEOMEM_PG_URI: postgres://${POSTGRES_USER:-themem}:${POSTGRES_PASSWORD:-themem}@pgvector:5432/${POSTGRES_DB:-themem}
      PORT: "8080"
      HOST: "0.0.0.0"
      # Embedder MUST match the shared themem_pgvector's stored dimension. That DB was
      # provisioned by the platform local-env at dim 1536 (OpenAI); the local embedder
      # (Xenova, 384) would trip the destructive-dim-change migration guard and crash-loop.
      # So the CD deploy uses OpenAI (needs OPENAI_API_KEY, provided below).
      THEOMEM_EMBEDDER: ${THEOMEM_EMBEDDER:-openai}
      # Real OpenAI key (extraction + embedding) — written into .env by the deploy job.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Build-info (forward-compat for a future GET /v1/version) — written into .env too.
      THEOMEM_GIT_SHA: ${THEOMEM_GIT_SHA:-unknown}
      THEOMEM_VERSION: ${THEOMEM_VERSION:-dev}
      THEOMEM_BUILD_TIME: ${THEOMEM_BUILD_TIME:-unknown}
      # M7 — FAIL CLOSED (closes issue #101). Until this flag, the deploy resolved a
      # default Principal for every request, so this service accepted reads AND writes
      # with no credential from any internet host (verified: POST /v1/remember -> 201
      # with no Authorization header, from an arbitrary IP). That contradicts invariant 5
      # of theo-data/CLAUDE.md ("a missing/unresolvable credential returns 401, never a
      # privileged default Principal") and is the prod-gate the theo-cloud ROADMAP names.
      # Default is `true`: an operator must opt OUT explicitly, never in by omission.
      THEMEMORY_REQUIRE_CREDENTIAL: ${THEMEMORY_REQUIRE_CREDENTIAL:-true}
      # M7 — mounts the admin key-lifecycle API (run-server.ts:207-209 mounts it ONLY
      # when this is set). Model B needs it: the gateway's ForwardAuth mints a per-tenant
      # data key per request via POST /v1/admin/keys, and without the API that mint 404s
      # ("mcp-resolve: per-tenant mint failed ... themory: not found").
      # ORDER MATTERS: this is only safe because REQUIRE_CREDENTIAL above closes the open
      # data surface first — mounting key minting on an unauthenticated public service
      # would be a worse hole than the one being fixed.
      THEMORY_ADMIN_BOOTSTRAP_TOKEN: ${THEMORY_ADMIN_BOOTSTRAP_TOKEN:-}
    ports:
      - "${THEMORY_PORT:-8080}:8080"
    healthcheck:
      # The distroless image has no shell/curl — probe via node directly. /v1/health
      # honors the EC-33 readiness gate (503 while the Memory factory warms, 200 once ready).
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "require('node:http').get('http://127.0.0.1:8080/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  # M7 — the MCP upstream the Theo MCP Gateway fronts at the public edge
  # (https://app-dev.usetheo.dev/mcp/memory). Same image, different entrypoint verb:
  # `themory mcp` instead of `themory server`. Before this service the gateway resolved
  # the credential, minted the per-tenant key, and then failed with `upstream_error`
  # because nothing was listening — dev ran only the REST server.
  #
  # DELIBERATELY NOT PUBLISHED TO THE HOST. `host.docker.internal` maps to the bridge
  # gateway IP, so a loopback-only publish is unreachable from the gateway container and
  # a reachable publish means 0.0.0.0 on a SHARED box — the same class of exposure as
  # issue #101. Instead this joins the gateway's own network and is addressed by service
  # name; the port never leaves the docker bridge.
  themory_mcp:
    image: ghcr.io/usetheoai/themory:develop
    container_name: themory_mcp
    pull_policy: always
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    # ENTRYPOINT hardcodes the `server` verb, so `command:` alone would produce
    # `server mcp ...`. Override the entrypoint to select the MCP verb.
    entrypoint:
      - /nodejs/bin/node
      - /app/dist/agent-tools/cli.js
      - mcp
    command:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "18091"
      # Defense in depth: the gateway already authenticates and injects a least-privilege
      # per-tenant key, but this upstream validates that key itself. A bug in the edge
      # must not turn into an unauthenticated data surface (invariant 5, fail closed).
      - --auth
      - api-keys
      # ADR-0015 #3: a non-localhost bind REQUIRES TLS. The keypair is the dev CA the
      # gateway already trusts via THEO_MCP_UPSTREAM_CA_FILE.
      - --tls-cert
      - /etc/theo/tls/themory-mcp.crt
      - --tls-key
      - /etc/theo/tls/themory-mcp.key
    environment:
      THEOMEM_PG_URI: postgres://${POSTGRES_USER:-themem}:${POSTGRES_PASSWORD:-themem}@pgvector:5432/${POSTGRES_DB:-themem}
      THEOMEM_EMBEDDER: ${THEOMEM_EMBEDDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Binds the MCP tool scope. Tenant isolation does NOT come from this value — it
      # comes from the per-tenant credential the gateway injects; this only names the
      # scope tier the 4 verbs operate on.
      THEOMEM_MCP_DEFAULT_USER_ID: ${THEOMEM_MCP_DEFAULT_USER_ID:-claude-code}
      THEOMEM_GIT_SHA: ${THEOMEM_GIT_SHA:-unknown}
      THEOMEM_VERSION: ${THEOMEM_VERSION:-dev}
    volumes:
      - ${THEMORY_MCP_TLS_DIR:?set THEMORY_MCP_TLS_DIR to the dir holding themory-mcp.crt/.key}:/etc/theo/tls:ro
    healthcheck:
      # Without this the deploy could report success over a crash-looping MCP upstream:
      # the version gate compares image labels, which a container that dies on startup
      # still satisfies. Probing TLS proves the cert/key actually loaded — the most
      # likely boot failure here. A 4xx from the auth layer is a HEALTHY answer: it
      # means the listener is up and fail-closed, which is the contract.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "const t=require('node:tls').connect({host:'127.0.0.1',port:18091,rejectUnauthorized:false},()=>process.exit(0));t.on('error',()=>process.exit(1));t.setTimeout(3000,()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - default
      - theo_edge

# The gateway's compose project network, joined (not created) so the MCP upstream is
# addressable as `themory_mcp` without ever publishing a port on the shared host.
networks:
  theo_edge:
    external: true
    name: ${THEO_EDGE_NETWORK:-theo-workspace_default}
